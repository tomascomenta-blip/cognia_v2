name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt || true

      - name: Run tests
        # Mismo comando que CLAUDE.md:94 ("Verificación"), y por sus dos razones:
        #  --ignore=tests/test_e2e_inference.py -> ese fichero levanta un modelo
        #    real; en el runner no hay GGUF, así que solo aportaba ruido lento.
        #  sin -x -> con -x el job aborta en el PRIMER fallo y el log nunca dice
        #    CUÁNTOS hay. La suite es la compuerta: hace falta el conteo entero
        #    (N passed / M failed) para saber si un cambio rompió una cosa o
        #    veinte. El exit code sigue siendo != 0 igual, que es lo que corta el CI.
        run: |
          pip install pytest --quiet
          pytest tests/ --ignore=tests/test_e2e_inference.py --tb=short
