[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognia-ai"
version = "4.21.0"
description = "Local cognitive AI that runs offline on a small model, with episodic memory, self-improving prompts, and an AI-native image/scene creator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Acua124298042" }]
keywords = ["ai", "llm", "distributed", "memory", "cognia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "flask>=2.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "numpy",
    "networkx>=3.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "cryptography>=41.0.0",
    "slowapi>=0.1.9",
    "sse-starlette>=1.6",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "huggingface_hub>=0.20",
    "tokenizers>=0.15",  # BPE real del pipeline de shards (fix 2026-07-08: sin esto caia a LightTokenizer y Qwen no funcionaba)
    "psutil>=5.9",
    "python-dateutil>=2.8.2",  # RRULE RFC-5545 en reminders (Cal.com nativo): cadencias arbitrarias
    "httpx>=0.27",
    "pillow>=10.0.0",   # creador de imagenes/escenas (cognia/lcd): render PNG/GIF
    # TUI (python -m cognia.tui / cognia tui) y el panel de agentes: DEPENDENCIA
    # DURA desde 4.8.x (decision del dueno). Deja de ser extra porque la TUI ya no
    # es un adorno opcional: es la vista de los workflows por agente.
    # El piso >=0.86.0 esta MEDIDO, no estimado (antes decia >=0.60.0 y era falso):
    # el sistema de temas (textual.theme.Theme, App.register_theme,
    # App.get_theme_variable_defaults, ThemeProvider) nace en 0.86.0. Con 0.85.2 el
    # arranque muere en "No module named 'textual.theme'"; con 0.86.0 la app monta
    # (52 widgets, tema 'cognia' activo) y sigue montando en 1.0.0, 2.1.2, 3.5.0,
    # 5.0.1 y 8.2.8. El piso de rich lo empuja textual por su propia metadata
    # (0.86 pide rich>=13.3.3; 8.2.8 pide rich>=14.2.0), por eso NO se duplica aca.
    "textual>=0.86.0",
]

# Heavy/optional features are NOT installed by default: Cognia runs fully on the
# lean core (n-gram embeddings, llama.cpp). Install extras only if you want them.
#   pip install cognia-ai[semantic]   -> real sentence-transformer embeddings (pulls torch, ~2GB)
#   pip install cognia-ai[pdf]        -> read PDFs
#   pip install cognia-ai[all]        -> everything
[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2.0"]
# /grabar-clase: capturar el audio que SUENA en el equipo (una clase virtual
# entra por los altavoces, no por el microfono). Es un EXTRA y no dependencia
# dura porque quien solo quiere el CLI no tiene por que arrastrar cffi ni
# tocar el audio de su maquina; sin el, /grabar-clase dice exactamente que le
# falta y como instalarlo, nunca falla mudo.
# MEDIDO 2026-08-31 en Windows 11: sounddevice 0.5.5 NO trae loopback en su
# build de PortAudio (WasapiSettings sin el parametro); soundcard capturo el
# tono de prueba con pico=0.50127. Por eso soundcard y no sounddevice.
#   pip install "cognia-ai[clases]"
# matplotlib y sympy van AQUI y no en las deps duras: son lo que dibuja las
# formulas (matplotlib.mathtext, sin instalar LaTeX) y las graficas de
# /grabar-clase formula|grafico, y sympy es ademas quien parsea la expresion
# con topes (cognia/clases/mates.py). Sin ellas `mates.disponible()` devuelve
# el motivo con el `pip install` exacto y el subcomando lo ensenia; nunca
# falla mudo. NO se meten en requirements.txt: eso es lo unico que instala el
# CI de ubuntu y ahi solo hace falta lo que los tests importan de verdad (los
# de mates ya usan pytest.importorskip).
clases   = ["soundcard>=0.4.2", "faster-whisper>=1.0.0",
            "matplotlib>=3.7", "sympy>=1.12"]
pdf      = ["pdfplumber>=0.10.0"]
# Inferencia local pip-nativa (sin cazar el binario llama-server): trae llama.cpp
# via el binding de Python. Alternativa al llama-server.exe / al path numpy-shards.
#   pip install "cognia-ai[llama]"
llama    = ["llama-cpp-python>=0.2.20"]
# TUI: el extra queda como ALIAS VACIO, no se borra. textual paso a dependencia
# dura, asi que no hay nada que instalar de mas; pero `pip install cognia-ai[tui]`
# quedo escrito en el CHANGELOG, en docs viejas y en scripts de usuarios.
# Que pasa si se borra, MEDIDO contra este mismo wheel (no supuesto):
#   pip 26.1.2 y 26.2.1  -> ignoran el extra inexistente EN SILENCIO (sin warning)
#   uv 0.12.5            -> "warning: The package `cognia-ai` does not have an
#                           extra named `noexiste`"
# O sea: borrarlo no rompe a nadie, pero le mete un warning a todo el que use uv
# y haya hecho lo que decia la documentacion. Con `tui = []` las dos herramientas
# quedan calladas y METADATA sigue publicando `Provides-Extra: tui`.
# Cuesta una linea. Se puede retirar recien en un mayor.
tui      = []
# OJOS (comando /ver): Cognia mira la pantalla y responde sobre lo que ve.
# Captura con mss + arbol de controles con uiautomation (Windows). Sin VLM: la
# percepcion se rinde como TEXTO y la consume el cerebro de siempre.
#   pip install "cognia-ai[vision]"
# Estaban SIN DECLARAR hasta 4.3.1: el codigo existia y el usuario no tenia como
# saber que instalar para encenderlo.
vision   = ["mss>=9.0", "uiautomation>=2.0; sys_platform == 'win32'"]
# OIDOS Y BOCA (python -m cognia.voz.jarvis): palabra de activacion, transcripcion
# y voz. Pesados y muy dependientes del SO, por eso van aparte del core.
#   pip install "cognia-ai[voz]"
voz      = ["sounddevice>=0.4", "faster-whisper>=1.0", "openwakeword>=0.6", "piper-tts>=1.2"]
# OJO: textual YA NO figura aca. Esta en las deps duras; repetirlo en `all` con
# su propio piso creaba una segunda restriccion que se desincronizaba (tenia
# >=0.60.0 mientras el codigo exigia >=0.86.0).
all      = ["sentence-transformers>=2.2.0", "pdfplumber>=0.10.0", "llama-cpp-python>=0.2.20",
            "mss>=9.0", "uiautomation>=2.0; sys_platform == 'win32'",
            "soundcard>=0.4.2", "faster-whisper>=1.0.0",
            "matplotlib>=3.7", "sympy>=1.12"]

[project.urls]
Homepage   = "https://github.com/tomascomenta-blip/cognia_v2"
Repository = "https://github.com/tomascomenta-blip/cognia_v2"

[project.scripts]
cognia             = "cognia.__main__:main"
cognia-node        = "node.main:main"
cognia-coordinator = "coordinator.run:main"

[tool.setuptools.packages.find]
where   = ["."]
# IMPORTANTE: usar nombres explicitos + ".*", NO globs anchos ("cognia*").
# "cognia*" capturaba ademas cognia_desktop (bundle Electron + node_modules),
# cognia_x (lab de investigacion), cognia_game, cognia_mobile y cognia_public_api,
# inflando el paquete con ~8MB de codigo NO destinado a publicarse. (v3.7.0)
include = [
    "cognia", "cognia.*",
    "cognia_v3", "cognia_v3.*",
    "node", "node.*",
    "coordinator", "coordinator.*",
    "shattering", "shattering.*",
    "app", "app.*",
    "security", "security.*",
    "storage", "storage.*",
    "network", "network.*",
]
exclude = [
    "cognia_x", "cognia_x.*",
    "cognia_desktop", "cognia_desktop.*",
    "cognia_game", "cognia_game.*",
    "cognia_mobile", "cognia_mobile.*",
    "cognia_public_api", "cognia_public_api.*",
    # Programas DEMO generados en runtime (salidas del creador, incl. artefactos
    # de los e2e): no son codigo del producto y solo inflaban el wheel (~30
    # modulos). El creador escribe en ~/.cognia en la instalacion real. (4.4.0)
    "cognia.program_creator.generated_programs",
    "cognia.program_creator.generated_programs.*",
]

[tool.setuptools.package-data]
"shattering" = ["manifests/*.json"]
"cognia" = ["knowledge/*.json", "knowledge/*.txt", "skills/*.md",
            # Sistema de estilos (/estilo): los 5 presets del paquete y el JSON
            # Schema que VS Code usa al editar ~/.cognia/estilo.json a mano.
            "ux/presets/*.json", "ux/estilo.schema.json"]
# Build Vite de la oficina 3D: sin esto /oficina3d instalado respondia
# "falta el build 3d" (cazado e2e 2026-07-15). Solo el dist compilado
# (~KBs), no node_modules/src (esos siguen fuera del wheel).
"cognia.oficina" = ["web3d/dist/*", "web3d/dist/assets/*"]
# CSS de la TUI (CSS_PATH de app.py y de agentes.py): sin esto la TUI instalada
# no arranca. Verificado en el wheel 4.8.0: viajan app.tcss y agentes.tcss.
# widgets/ no tiene .tcss hoy; se declara igual para que un CSS nuevo ahi no se
# quede fuera en silencio (un patron que no matchea nada no cuesta nada).
"cognia.tui" = ["*.tcss"]
"cognia.tui.widgets" = ["*.tcss"]
# Los patrones curados que guian la generacion web (2026-07-20): sin ellos el
# generador instalado pierde la mejora medida (cero defectos de navegador).
"cognia.program_creator" = ["patrones_web/*.html"]
# La colonia de micro-expertos: pesos numpy + config + referencia de paridad.
# model.pt (torch) NO se embarca: el runtime instalado no depende de torch.
# La app movil del control remoto (python -m cognia.remoto)
"cognia.remoto" = ["static/*.html"]
"cognia.microexpertos" = ["*/pesos.npz", "*/config.json", "*/metrics.json", "*/paridad_ref.npz"]
# Fuentes C de los kernels rapidos: node/build_fast_kernels.py compila
# fast_kernels.c (y _fast_kernels_cffi.c en el fallback cffi) en runtime, pero
# el .c nunca viajaba en el wheel — 'node' no tenia entrada aqui. En la
# instalacion real eso son 4 lineas de error por arranque (gcc/clang: "No such
# file or directory") y la perdida SILENCIOSA de la aceleracion CPU, porque el
# builder no distingue "no compila" de "no hay fuente". Cazado 2026-08-02.
"node" = ["*.c"]
# CUADERNO DE CLASE (/grabar-clase): el cerebrito. `assets/cerebro.svg` es la
# FUENTE DE DISENIO del icono y ademas se embebe INLINE en la cabecera del
# cuaderno en vivo (vista_viva._cerebro_inline lo lee de
# Path(__file__).with_name("assets")). Sin esta entrada el .svg NO viaja al
# wheel -- package-data no incluye nada que no se declare -- y en una
# instalacion limpia el cuaderno sale sin icono y el widget con la paleta a
# medias, degradando por 'clases.vista_viva.cerebro' sin que nadie entienda
# por que solo pasa en la version instalada. Los *.png se declaran aunque hoy
# no haya ninguno (el icono del widget se dibuja en runtime con Pillow y se
# cachea fuera del paquete): un patron que no matchea nada no cuesta nada, y
# evita que un asset nuevo se quede fuera en silencio.
"cognia.clases" = ["assets/*.svg", "assets/*.png"]

# (v3.6.0) Se removio el bloque py-modules: esos modulos top-level se reorganizaron
# dentro del paquete cognia_v3/ (core/memory/interfaces) y ahora se empaquetan via
# packages.find (include cognia_v3*). Mantenerlos como py-modules root rompia el build
# (los archivos ya no existen en la raiz).
