<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hero</title>
    <style>
        :root {
            --dark-blue: #0f172a;
            --medium-blue: #1e293b;
            --light-blue: #334155;
            --accent: #10b981;
            --accent-alt: #3b82f6;
            --accent-dark: #f59e0b;
            --gray-light: #cbd5e1;
            --gray-medium: #64748b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            padding: 4rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            animation: fadeIn 1s ease-out;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1.2s ease-out 0.2s;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            opacity: 0;
            animation: fadeIn 1.4s ease-out 0.4s;
        }

        .hero-buttons button {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 50px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--medium-blue);
            color: var(--text-primary);
        }

        .hero-buttons button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* Background Animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.2);
            opacity: 0;
            animation: particleMove 5s linear infinite;
        }

        @keyframes particleMove {
            0% { opacity: 0; transform: translateY(-200px) scale(0.5); }
            10% { opacity: 1; transform: translateY(0) scale(1); }
            90% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(200px) scale(0.5); }
        }

        /* Card Grid */
        .cards {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        .card {
            background: var(--light-blue);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
        }

        .card-header {
            background: var(--dark-blue);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1rem;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.6s ease-out;
        }

        .card-chart {
            height: 100px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SVG Chart with Y-axis labels */
        .chart-container {
            position: relative;
            height: 150px;
        }

        .chart {
            height: 100%;
            width: 100%;
            background: #f8fafc;
            border-radius: 8px;
            overflow: hidden;
        }

        .chart-rect {
            height: 100%;
            width: 100%;
            fill: #3b82f6;
        }

        .y-axis {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-left: 10px;
        }

        .y-axis label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Footer */
        footer {
            background: var(--dark-blue);
            color: var(--text-secondary);
            padding: 2rem 1rem;
            text-align: center;
            margin-top: 3rem;
            border-top: 1px solid var(--gray-light);
        }

        footer h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .social-links a {
            color: var(--accent);
            margin: 0 0.5rem;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: var(--accent-alt);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes moveParticles {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-20%, -20%) rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .hero-buttons {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Hero Section -->
    <div class="hero">
        <h1>Dashboard Hero</h1>
        <h2>Track your performance with real-time analytics</h2>
        <div class="hero-buttons">
            <button>View Analytics</button>
            <button>Get Started</button>
        </div>
    </div>
    
    <!-- Cards Grid -->
    <div class="cards">
        <div class="card">
            <div class="card-header">
                <h3>Revenue</h3>
                <span class="value">$12,450</span>
            </div>
            <div class="card-chart">
                <div class="chart-container">
                    <div class="chart">
                        <div class="chart-rect" style="height: 80%;"></div>
                    </div>
                    <div class="y-axis">
                        <label>100%</label>
                        <label>80%</label>
                        <label>60%</label>
                        <label>40%</label>
                        <label>20%</label>
                        <label>0%</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Users</h3>
                <span class="value">4,231</span>
            </div>
            <div class="card-chart">
                <div class="chart-container">
                    <div class="chart">
                        <div class="chart-rect" style="height: 90%;"></div>
                    </div>
                    <div class="y-axis">
                        <label>100%</label>
                        <label>80%</label>
                        <label>60%</label>
                        <label>40%</label>
                        <label>20%</label>
                        <label>0%</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Orders</h3>
                <span class="value">1,845</span>
            </div>
            <div class="card-chart">
                <div class="chart-container">
                    <div class="chart">
                        <div class="chart-rect" style="height: 70%;"></div>
                    </div>
                    <div class="y-axis">
                        <label>100%</label>
                        <label>80%</label>
                        <label>60%</label>
                        <label>40%</label>
                        <label>20%</label>
                        <label>0%</label>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Engagement</h3>
                <span class="value">87%</span>
            </div>
            <div class="card-chart">
                <div class="chart-container">
                    <div class="chart">
                        <div class="chart-rect" style="height: 85%;"></div>
                    </div>
                    <div class="y-axis">
                        <label>100%</label>
                        <label>80%</label>
                        <label>60%</label>
                        <label>40%</label>
                        <label>20%</label>
                        <label>0%</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="#" aria-label="Twitter">𝕏</a>
            <a href="#" aria-label="LinkedIn">LinkedIn</a>
            <a href="#" aria-label="GitHub">GitHub</a>
        </div>
        <p>&copy; 2023 Dashboard Hero. All rights reserved.</p>
    </footer>

    <script>
        // Create animated particles
        const particles = document.getElementById('particles');
        const numParticles = 50;
        
        for (let i = 0; i < numParticles; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.width = `${Math.random() * 20 + 10}px`;
            particle.style.height = `${Math.random() * 20 + 10}px`;
            particles.appendChild(particle);
        }
        
        // Animate particles
        const particleElements = document.querySelectorAll('.particle');
        particleElements.forEach(particle => {
            particle.style.animationDuration = `${Math.random() * 8 + 5}s`;
        });
        
        // Set initial card values
        const cardValues = document.querySelectorAll('.value');
        cardValues.forEach(value => {
            value.textContent = '$' + (Math.random() * 20000).toFixed(2);
        });
        
        // Auto-update values with color changes
        setInterval(() => {
            cardValues.forEach(value => {
                const current = parseFloat(value.textContent.replace('$', ''));
                const change = (Math.random() * 2000 - 1000) + 500;
                const newValue = (current + change).toFixed(2);
                
                // Update value and color
                value.textContent = '$' + newValue;
                value.style.color = (change >= 0 ? 'green' : 'red');
            });
        }, 2000);
    </script>
</body>
</html>
