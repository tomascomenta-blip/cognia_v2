
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f0f0f0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    grid-gap:5px;
    animation:fadeIn 1s ease-in-out;
  }
  input.celda{
    width:80px;height:30px;text-align:right;font-size:14px;
    padding:0 5px;
    box-sizing:border-box;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>
<div id="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>

<script>
(() => {
  const cells = {}; // map ref -> input element
  document.querySelectorAll('.celda').forEach(el => {
    cells[el.dataset.ref] = el;
  });

  let updating = false; // flag to avoid recursive events

  // Evaluate a cell value (recursive, with cycle detection)
  function evaluate(ref, visited) {
    const cell = cells[ref];
    if (!cell) return 0;
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);

    const formula = cell.dataset.formula;
    if (!formula) {
      const val = parseFloat(cell.value);
      visited.delete(ref);
      return isNaN(val) ? 0 : val;
    }

    // Remove leading '='
    const expr = formula.slice(1);

    // Replace cell references with their evaluated values
    const replaced = expr.replace(/[A-C][1-3]/g, match => {
      const val = evaluate(match, visited);
      return val === 'CIRC' ? 'CIRC' : val;
    });

    if (replaced.includes('CIRC')) {
      visited.delete(ref);
      return 'CIRC';
    }

    try {
      const result = Function(`return ${replaced}`)();
      visited.delete(ref);
      return result;
    } catch (e) {
      visited.delete(ref);
      return 'CIRC';
    }
  }

  // Recalculate all formula cells
  function recomputeAll() {
    if (updating) return;
    updating = true;
    Object.keys(cells).forEach(ref => {
      const cell = cells[ref];
      if (cell.dataset.formula) {
        const val = evaluate(ref, new Set());
        cell.value = val;
      }
    });
    updating = false;
  }

  // Handle user input
  document.querySelectorAll('.celda').forEach(el => {
    el.addEventListener('input', e => {
      if (updating) return;
      const val = e.target.value;
      if (val.startsWith('=')) {
        e.target.dataset.formula = val;
      } else {
        delete e.target.dataset.formula;
      }
      recomputeAll();
    });
  });

  // Initial calculation (in case some cells already contain formulas)
  recomputeAll();
})();
</script>
</body>
</html>
