<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:sans-serif;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    max-width:300px;
    width:100%;
    background:#fff;
    padding:10px;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
  }
  .celda{
    width:100%;
    height:30px;
    border:1px solid #ccc;
    text-align:right;
    padding-right:5px;
    font-size:14px;
    box-sizing:border-box;
  }
  .celda.formula{
    color:#008080;
    font-weight:bold;
  }
  .celda:not(.formula){
    color:#333;
  }
  .celda:focus{
    outline:none;
    border-color:#008080;
  }
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="10">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const cells=document.querySelectorAll('.celda');
  const cellMap={};
  const dependents={};
  cells.forEach(c=>{cellMap[c.dataset.ref]=c;dependents[c.dataset.ref]=[];});

  // Build dependencies and mark formulas
  cells.forEach(c=>{
    const ref=c.dataset.ref;
    const val=c.value.trim();
    if(val.startsWith('=')){
      c.dataset.formula=val;
      c.classList.add('formula');
      c.readOnly=true;
      const refs=val.match(/[A-C][1-3]/g)||[];
      refs.forEach(r=>{if(dependents[r])dependents[r].push(ref);});
    }else{
      c.dataset.formula='';
    }
  });

  function evaluateCell(ref,visited){
    const cell=cellMap[ref];
    if(!cell)return 0;
    if(visited.has(ref)){
      cell.value='CIRC';
      return 'CIRC';
    }
    visited.add(ref);
    const formula=cell.dataset.formula;
    if(!formula){
      const num=parseFloat(cell.value);
      visited.delete(ref);
      return isNaN(num)?0:num;
    }
    let expr=formula.slice(1);
    const refs=expr.match(/[A-C][1-3]/g)||[];
    for(const r of refs){
      const val=evaluateCell(r,visited);
      if(val==='CIRC'){
        cell.value='CIRC';
        visited.delete(ref);
        return 'CIRC';
      }
      expr=expr.replace(new RegExp(r,'g'),val);
    }
    let result;
    try{result=eval(expr);}catch(e){result=0;}
    if(result==='CIRC'){
      cell.value='CIRC';
      visited.delete(ref);
      return 'CIRC';
    }
    const formatted=typeof result==='number'?result.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}):result;
    cell.value=formatted;
    visited.delete(ref);
    return result;
  }

  // Initial evaluation
  cells.forEach(c=>{if(c.dataset.formula)evaluateCell(c.dataset.ref,new Set());});

  function recalcDependents(ref){
    const deps=dependents[ref]||[];
    deps.forEach(d=>{evaluateCell(d,new Set());recalcDependents(d);});
  }

  // Event listeners for editable cells
  cells.forEach(c=>{
    if(!c.dataset.formula){
      c.addEventListener('input',function(){
        recalcDependents(c.dataset.ref);
      });
    }
  });
});
</script>
</body>
</html>
