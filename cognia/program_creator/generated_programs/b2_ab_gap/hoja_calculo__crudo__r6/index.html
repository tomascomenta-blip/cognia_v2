
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(3, 90px);
    grid-gap:8px;
    padding:20px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    animation:fadeIn 1s ease-out;
  }
  .celda{
    width:90px;
    height:30px;
    padding:0 4px;
    font-size:14px;
    text-align:right;
    border:1px solid #ccc;
    border-radius:4px;
    transition:background 0.3s;
  }
  .celda:focus{
    outline:none;
    border-color:#4a90e2;
    background:#e8f4ff;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>

<script>
(() => {
  const cells = document.querySelectorAll('.celda');
  const cellMap = {};          // ref -> raw content (formula or literal)
  const cache = {};            // ref -> computed value for this cycle
  let isUpdating = false;      // guard against recursive input events

  // Initialize cellMap with empty strings
  cells.forEach(cell => {
    const ref = cell.dataset.ref;
    cellMap[ref] = '';
    cell.addEventListener('input', () => {
      if (isUpdating) return;
      cellMap[ref] = cell.value;
      updateAll();
    });
  });

  // Initial calculation
  updateAll();

  function updateAll() {
    isUpdating = true;
    // Clear cache for fresh calculation
    Object.keys(cache).forEach(k => delete cache[k]);

    cells.forEach(cell => {
      const ref = cell.dataset.ref;
      const raw = cellMap[ref];
      const val = computeValue(ref, []);
      if (raw.startsWith('=')) {
        cell.value = val;
      } else {
        cell.value = raw;
      }
    });
    isUpdating = false;
  }

  function computeValue(ref, stack) {
    // Detect circular reference
    if (stack.includes(ref)) {
      return 'CIRC';
    }
    // Return cached value if available
    if (cache[ref] !== undefined) {
      return cache[ref];
    }

    const raw = cellMap[ref];
    // Literal value
    if (!raw.startsWith('=')) {
      cache[ref] = raw;
      return raw;
    }

    // Formula evaluation
    const expr = raw.slice(1).replace(/\s+/g, ''); // remove spaces
    if (expr === '') {
      cache[ref] = '';
      return '';
    }

    // Split by + or - keeping operators
    const tokens = expr.split(/([+-])/);
    let result = 0;
    let currentOp = '+';

    for (let token of tokens) {
      if (token === '' || token === '+' || token === '-') {
        if (token === '+' || token === '-') {
          currentOp = token;
        }
        continue;
      }

      let val;
      if (/^[A-C][1-3]$/.test(token)) {
        // Reference to another cell
        val = computeValue(token, [...stack, ref]);
        if (val === 'CIRC') {
          cache[ref] = 'CIRC';
          return 'CIRC';
        }
        val = parseFloat(val);
        if (isNaN(val)) val = 0;
      } else {
        // Numeric literal
        val = parseFloat(token);
        if (isNaN(val)) val = 0;
      }

      if (currentOp === '+') {
        result += val;
      } else {
        result -= val;
      }
    }

    cache[ref] = result.toString();
    return result.toString();
  }
})();
</script>
</body>
</html>
