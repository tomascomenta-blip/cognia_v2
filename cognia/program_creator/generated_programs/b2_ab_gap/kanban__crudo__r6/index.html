
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en una sola página</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
  }
  .board{
    display:flex;
    gap:10px;
    width:100%;
    max-width:1200px;
    animation:boardFade 1s ease-out;
  }
  .col{
    background:#e2e4e6;
    border-radius:5px;
    padding:10px;
    box-sizing:border-box;
    width:30%;
    min-height:300px;
    animation:slideIn 0.5s ease-out;
  }
  .col h2{
    margin-top:0;
    font-size:1.2em;
  }
  .col .cards{
    margin-top:10px;
  }
  .card{
    background:#fff;
    border-radius:3px;
    padding:8px;
    margin-bottom:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
    display:flex;
    justify-content:space-between;
    align-items:center;
    animation:fadeIn 0.5s ease-out;
  }
  .card span{
    flex:1;
  }
  .card button{
    margin-left:4px;
    padding:2px 6px;
    font-size:.9em;
  }
  span#cont-todo, span#cont-doing, span#cont-done{
    font-weight:normal;
    font-size:.9em;
    margin-left:5px;
  }
  @keyframes slideIn{
    from{transform:translateX(-20px);opacity:0;}
    to{transform:translateX(0);opacity:1;}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  @keyframes boardFade{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo"></span></h2>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing <span id="cont-doing"></span></h2>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="done">
    <h2>Done <span id="cont-done"></span></h2>
    <div class="cards"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const counts = {
    todo: document.getElementById('cont-todo'),
    doing: document.getElementById('cont-doing'),
    done: document.getElementById('cont-done')
  };

  // Crear tarjetas iniciales en Todo
  const todoCards = document.querySelector('.col[data-col="todo"] .cards');
  ['t1','t2','t3'].forEach(id => todoCards.appendChild(createCard(id)));

  updateCounts();

  // Delegación de eventos para los botones
  document.body.addEventListener('click', e => {
    if (!e.target.matches('.mas,.menos')) return;
    const card = e.target.closest('.card');
    const currentCol = card.parentElement.parentElement; // .cards -> .col
    const colName = currentCol.dataset.col;
    let targetColName;

    if (e.target.classList.contains('mas')) {
      if (colName === 'todo') targetColName = 'doing';
      else if (colName === 'doing') targetColName = 'done';
      else return; // no avanzar desde Done
    } else {
      if (colName === 'doing') targetColName = 'todo';
      else if (colName === 'done') targetColName = 'doing';
      else return; // no retroceder desde Todo
    }

    // Regla WIP: Doing solo 2 tarjetas
    if (targetColName === 'doing') {
      const doingCards = document.querySelectorAll('.col[data-col="doing"] .cards .card');
      if (doingCards.length >= 2) return; // no mover si ya hay 2
    }

    const targetCol = document.querySelector(`.col[data-col="${targetColName}"] .cards`);
    targetCol.appendChild(card);
    updateCounts();
  });

  function createCard(id) {
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = id;

    const span = document.createElement('span');
    span.textContent = id;
    div.appendChild(span);

    const masBtn = document.createElement('button');
    masBtn.className = 'mas';
    masBtn.textContent = '+';

    const menosBtn = document.createElement('button');
    menosBtn.className = 'menos';
    menosBtn.textContent = '-';

    div.appendChild(masBtn);
    div.appendChild(menosBtn);
    return div;
  }

  function updateCounts() {
    counts.todo.textContent = document.querySelectorAll('.col[data-col="todo"] .cards .card').length;
    counts.doing.textContent = document.querySelectorAll('.col[data-col="doing"] .cards .card').length;
    counts.done.textContent = document.querySelectorAll('.col[data-col="done"] .cards .card').length;
  }
});
</script>
</body>
</html>
