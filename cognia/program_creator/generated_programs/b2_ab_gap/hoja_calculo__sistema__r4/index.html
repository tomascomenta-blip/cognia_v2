<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:sans-serif;margin:20px;background:#f0f0f0;}
  h1{text-align:center;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:5px;box-sizing:border-box;font-size:1rem;}
  .celda[data-formula]{background:#e0ffe0;}
  .celda.circular{background:#ffe0e0;color:#a00;}
  pre{background:#222;color:#eee;padding:10px;margin-top:20px;overflow:auto;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" />
  <input class="celda" data-ref="A2" />
  <input class="celda" data-ref="A3" />
  <input class="celda" data-ref="B1" />
  <input class="celda" data-ref="B2" />
  <input class="celda" data-ref="B3" />
  <input class="celda" data-ref="C1" />
  <input class="celda" data-ref="C2" />
  <input class="celda" data-ref="C3" />
</div>
<pre>
  A   B   C
+---+---+---+
|   |   |   |
+---+---+---+
|   |   |   |
+---+---+---+
|   |   |   |
+---+---+---+
</pre>
<script>
(() => {
  const cells = {};
  document.querySelectorAll('.celda').forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = el;
    el.addEventListener('input', onInput);
  });
  let isUpdating = false;
  function onInput(e) {
    if (isUpdating) return;
    const el = e.target;
    const val = el.value.trim();
    if (val.startsWith('=')) {
      el.dataset.formula = val;
    } else {
      el.dataset.formula = null;
    }
    recalcAll();
  }
  function recalcAll() {
    isUpdating = true;
    Object.keys(cells).forEach(ref => {
      evaluateCell(ref, new Set());
    });
    isUpdating = false;
  }
  function evaluateCell(ref, visited) {
    const el = cells[ref];
    if (visited.has(ref)) {
      el.value = 'CIRC';
      el.classList.add('circular');
      return 'CIRC';
    }
    visited.add(ref);
    const formula = el.dataset.formula;
    if (!formula) {
      const num = parseFloat(el.value);
      const val = isNaN(num) ? '' : num;
      el.value = val;
      el.classList.remove('circular');
      visited.delete(ref);
      return val;
    }
    const expr = formula.slice(1);
    const replaced = expr.replace(/[A-C][1-3]/g, match => {
      const v = evaluateCell(match, visited);
      if (v === 'CIRC') return 'NaN';
      return v;
    });
    let result;
    try {
      result = Function(`"use strict";return (${replaced})`)();
    } catch (e) {
      result = 'CIRC';
    }
    if (result === 'CIRC' || typeof result !== 'number' || isNaN(result)) {
      el.value = 'CIRC';
      el.classList.add('circular');
      visited.delete(ref);
      return 'CIRC';
    }
    el.value = result;
    el.classList.remove('circular');
    visited.delete(ref);
    return result;
  }
  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
