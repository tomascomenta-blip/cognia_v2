
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3×3</title>
<style>
  body{font-family:Arial,sans-serif;margin:20px;}
  table{border-collapse:collapse;animation:slideIn 1s ease-out;}
  @keyframes slideIn{from{transform:translateY(-20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  td{border:1px solid #999;padding:0;}
  input.celda{width:80px;height:30px;border:none;text-align:right;padding:5px;animation:fadeIn 0.5s forwards;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda" data-ref="A1"></td>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="A3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1"></td>
    <td><input class="celda" data-ref="B2"></td>
    <td><input class="celda" data-ref="B3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1"></td>
    <td><input class="celda" data-ref="C2"></td>
    <td><input class="celda" data-ref="C3"></td>
  </tr>
</table>
<script>
  (function(){
    const cells = document.querySelectorAll('.celda');
    const map = {};
    cells.forEach(c=>{ map[c.dataset.ref] = c; });

    let updating = false;

    function evaluate(ref, visited){
      if(visited.has(ref)) return 'CIRC';
      const cell = map[ref];
      if(!cell) return 0;
      const val = cell.value.trim();
      if(!val.startsWith('=')){
        const num = parseFloat(val);
        return isNaN(num)?0:num;
      }
      visited.add(ref);
      const expr = val.slice(1).replace(/\s+/g,'');
      const tokens = expr.match(/[A-C][1-3]|[+\-]|\d+(\.\d+)?/g);
      if(!tokens) return 0;
      let evalStr = '';
      for(const tok of tokens){
        if(/[A-C][1-3]/.test(tok)){
          const res = evaluate(tok, visited);
          if(res==='CIRC') return 'CIRC';
          evalStr += res;
        }else{
          evalStr += tok;
        }
      }
      try{
        const result = eval(evalStr);
        return result;
      }catch(e){
        return 0;
      }
    }

    function recomputeAll(){
      cells.forEach(c=>{
        const ref = c.dataset.ref;
        const val = c.value.trim();
        if(val.startsWith('=')){
          const res = evaluate(ref, new Set());
          c.value = res==='CIRC' ? 'CIRC' : res;
        }
      });
    }

    cells.forEach(c=>{
      c.addEventListener('input',()=>{
        if(updating) return;
        updating = true;
        recomputeAll();
        updating = false;
      });
    });

    recomputeAll();
  })();
</script>
</body>
</html>
