<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;height:30px;text-align:right;padding:5px;font-size:1rem;}
</style>
</head>
<body>
<h1>Mini hoja de cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C3" value="">
</div>
<script>
const cells = {};
document.querySelectorAll('.celda').forEach(el=>{
  cells[el.dataset.ref] = el;
  el.addEventListener('focus', function(){
    if(this.dataset.formula){
      this.value = this.dataset.formula;
    }
  });
  el.addEventListener('blur', function(){
    if(this.value.startsWith('=')){
      this.dataset.formula = this.value;
    }else{
      delete this.dataset.formula;
    }
    updateAll();
  });
});
function evalCell(cell, visited){
  const ref = cell.dataset.ref;
  if(visited.has(ref)) return 'CIRC';
  visited.add(ref);
  const formula = cell.dataset.formula;
  if(!formula){
    visited.delete(ref);
    return cell.value;
  }
  let expr = formula.slice(1);
  expr = expr.replace(/[A-C][1-3]/g, match=>{
    const target = cells[match];
    const val = evalCell(target, visited);
    if(val==='CIRC') return 'NaN';
    const num = parseFloat(val);
    return isNaN(num)?'0':num.toString();
  });
  if(expr.includes('NaN')){
    visited.delete(ref);
    return 'CIRC';
  }
  try{
    const result = Function('return '+expr)();
    visited.delete(ref);
    return result.toString();
  }catch(e){
    visited.delete(ref);
    return 'CIRC';
  }
}
function updateAll(){
  Object.values(cells).forEach(cell=>{
    const val = evalCell(cell, new Set());
    if(val==='CIRC'){
      cell.value='CIRC';
    }else{
      cell.value=val;
    }
  });
}
</script>
</body>
</html>
