<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;margin:0;padding:20px;}
  .productos{display:flex;gap:20px;margin-bottom:30px;animation:fadeIn 1s ease-out;}
  .prod{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);flex:1;text-align:center;}
  .prod h3{margin:0 0 10px;}
  .prod button{padding:8px 12px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .prod button:disabled{background:#aaa;cursor:not-allowed;}
  #carrito{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);animation:slideIn 0.8s ease-out;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .linea span{font-weight:bold;}
  .linea button{padding:4px 8px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  #total{font-size:1.2em;font-weight:bold;margin-top:10px;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideIn{from{transform:translateX(-20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
</style>
</head>
<body>
<h1>Carrito de Compras</h1>
<div class="productos">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <h3>Producto 1</h3>
    <p>Precio: $100</p>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <h3>Producto 2</h3>
    <p>Precio: $50</p>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <h3>Producto 3</h3>
    <p>Precio: $25</p>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<div id="carrito">
  <h2>Carrito</h2>
  <div id="lineas"></div>
  <div id="total">Total: $0</div>
</div>

<script>
  const productos = {};
  document.querySelectorAll('.prod').forEach(div=>{
    const id = div.dataset.id;
    productos[id] = {
      precio: parseFloat(div.dataset.precio),
      stock: parseInt(div.dataset.stock)
    };
  });

  const cart = {};

  function actualizarTotal(){
    let total = 0;
    for(const id in cart){
      total += cart[id].cant * productos[id].precio;
    }
    document.getElementById('total').textContent = 'Total: $' + total;
  }

  function actualizarBoton(id){
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    if(cart[id] && cart[id].cant >= productos[id].stock){
      btn.disabled = true;
    }else{
      btn.disabled = false;
    }
  }

  function renderLinea(id){
    const lineasDiv = document.getElementById('lineas');
    let linea = lineasDiv.querySelector(`.linea[data-id="${id}"]`);
    if(!linea){
      linea = document.createElement('div');
      linea.className = 'linea';
      linea.dataset.id = id;
      linea.innerHTML = `<span>${id} x <span class="cant">${cart[id].cant}</span></span>
                         <button class="quitar" data-id="${id}">Quitar</button>`;
      lineasDiv.appendChild(linea);
      linea.querySelector('.quitar').addEventListener('click',()=>quitar(id));
    }else{
      linea.querySelector('.cant').textContent = cart[id].cant;
    }
  }

  function quitar(id){
    if(cart[id]){
      cart[id].cant--;
      if(cart[id].cant <= 0){
        delete cart[id];
        const linea = document.querySelector(`.linea[data-id="${id}"]`);
        if(linea) linea.remove();
      }else{
        renderLinea(id);
      }
      actualizarBoton(id);
      actualizarTotal();
    }
  }

  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.id;
      if(!cart[id]) cart[id] = {cant:0};
      if(cart[id].cant < productos[id].stock){
        cart[id].cant++;
        renderLinea(id);
        actualizarBoton(id);
        actualizarTotal();
      }
    });
  });
</script>
</body>
</html>
