<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
  body{font-family:sans-serif;margin:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  input{width:100%;padding:5px;font-size:1rem;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1">
  <input class="celda" data-ref="B1">
  <input class="celda" data-ref="C1">
  <input class="celda" data-ref="A2">
  <input class="celda" data-ref="B2">
  <input class="celda" data-ref="C2">
  <input class="celda" data-ref="A3">
  <input class="celda" data-ref="B3">
  <input class="celda" data-ref="C3">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const map={};const deps={};const cellDeps={};let updating=false;
cells.forEach(c=>{const r=c.dataset.ref;map[r]=c;deps[r]=new Set();});
function upd(r){const c=map[r];const old=cellDeps[r]||new Set();old.forEach(d=>deps[d].delete(r));const f=c.dataset.formula;const newD=new Set();if(f){(f.match(/[A-C][1-3]/g)||[]).forEach(m=>newD.add(m));}newD.forEach(d=>deps[d].add(r));cellDeps[r]=newD;}
function evalCell(r,stack=[]){const c=map[r];const f=c.dataset.formula;if(!f)return c.value;if(stack.includes(r))return'CIRC';stack.push(r);let hasCirc=false;const expr=f.slice(1).replace(/[A-C][1-3]/g,m=>{const v=evalCell(m,stack.slice());if(v==='CIRC'){hasCirc=true;return'0';}return v||'0';});let res;if(hasCirc){res='CIRC';}else{try{res=eval(expr);}catch{res='CIRC';}}stack.pop();return res;}
function setVal(r,v){updating=true;map[r].value=v;updating=false;}
function recalc(r){const v=evalCell(r);setVal(r,v);deps[r].forEach(d=>recalc(d));}
cells.forEach(c=>{c.dataset.formula=c.value.startsWith('=')?c.value:'';});
cells.forEach(c=>upd(c.dataset.ref));
cells.forEach(c=>recalc(c.dataset.ref));
cells.forEach(c=>c.addEventListener('input',e=>{if(updating)return;const r=e.target.dataset.ref;const v=e.target.value;if(v.startsWith('='))e.target.dataset.formula=v;else e.target.dataset.formula='';upd(r);recalc(r);}));
</script>
</body>
</html>
