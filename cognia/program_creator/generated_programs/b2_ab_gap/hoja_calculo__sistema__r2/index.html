<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:1rem;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:400px;margin:auto;}
  .celda{width:100%;box-sizing:border-box;padding:8px;font-size:1rem;text-align:right;}
  .celda:focus{outline:2px solid #0066cc;}
</style>
</head>
<body>
<h1 style="text-align:center;">Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B1" value="">
  <input type="text" class="celda" data-ref="B2" value="">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C1" value="">
  <input type="text" class="celda" data-ref="C2" value="">
  <input type="text" class="celda" data-ref="C3" value="=A1+B1">
</div>

<script>
"use strict";

/* Configurable constants */
const OPERATORS = ['+','-'];
const REF_REGEX = /^[A-C][1-3]$/;

/* Map of cell references to DOM elements */
const cellMap = {};

/* Populate cellMap */
document.querySelectorAll('.celda').forEach(cell => {
  const ref = cell.dataset.ref;
  if (ref) cellMap[ref] = cell;
});

/* Evaluate a single cell recursively */
function evaluateCell(cell, stack=[]) {
  // If cell has no formula, return its numeric value (or 0)
  if (!cell.dataset.formula) {
    const val = parseFloat(cell.value);
    return isNaN(val) ? 0 : val;
  }

  // Detect circular reference
  if (stack.includes(cell)) {
    cell.value = 'CIRC';
    return 'CIRC';
  }

  const expr = cell.dataset.formula.slice(1).replace(/\s+/g,'');
  const tokens = expr.match(/[A-C][1-3]|[0-9]+(?:\.[0-9]+)?|[+-]/g);
  if (!tokens) return 0;

  let result = 0;
  let op = '+';

  for (const token of tokens) {
    if (token === '+' || token === '-') {
      op = token;
    } else {
      let val;
      if (REF_REGEX.test(token)) {
        const refCell = cellMap[token];
        if (!refCell) val = 0;
        else {
          val = evaluateCell(refCell, stack.concat(cell));
          if (val === 'CIRC') {
            cell.value = 'CIRC';
            return 'CIRC';
          }
        }
      } else {
        val = parseFloat(token);
      }
      if (op === '+') result += val;
      else result -= val;
    }
  }

  cell.value = result.toString();
  return result;
}

/* Evaluate all cells (used on load and after any change) */
function evaluateAll() {
  document.querySelectorAll('.celda').forEach(cell => {
    evaluateCell(cell);
  });
}

/* Handle user input */
function onInput(e) {
  const cell = e.target;
  const val = cell.value.trim();
  if (val.startsWith('=')) {
    cell.dataset.formula = val;
  } else {
    delete cell.dataset.formula;
  }
  evaluateAll();
}

/* Attach event listeners */
document.querySelectorAll('.celda').forEach(cell => {
  cell.addEventListener('input', onInput);
});

/* Initial evaluation */
evaluateAll();
</script>
</body>
</html>
