
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
    animation: bgFade 3s ease-in-out infinite alternate;
  }
  @keyframes bgFade{
    from{background:#f0f0f0;}
    to{background:#e0e0ff;}
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    grid-template-rows:repeat(3,80px);
    gap:5px;
  }
  .celda{
    width:100%;
    height:100%;
    font-size:18px;
    text-align:right;
    padding:5px;
    box-sizing:border-box;
    border:1px solid #999;
    border-radius:4px;
    background:#fff;
    animation: cellAnim 0.8s ease forwards;
    opacity:0;
  }
  @keyframes cellAnim{
    to{opacity:1;}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B1" placeholder="B1">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C1" placeholder="C1">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="C3" placeholder="C3">
</div>

<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  // Evaluate all formulas
  function recalcAll() {
    const memo = {}; // cache computed values
    const evaluating = new Set(); // for circular detection

    function evalCell(ref) {
      if (memo.hasOwnProperty(ref)) return memo[ref];
      const cell = refMap[ref];
      const raw = cell.value.trim();

      // If not a formula, just return its numeric value or string
      if (!raw.startsWith('=')) {
        const num = Number(raw);
        memo[ref] = isNaN(num) ? raw : num;
        return memo[ref];
      }

      // Circular detection
      if (evaluating.has(ref)) {
        memo[ref] = 'CIRC';
        return memo[ref];
      }
      evaluating.add(ref);

      // Find referenced cells
      const refs = raw.match(/[A-C][1-3]/g) || [];
      const exprParts = [];
      for (const r of refs) {
        const val = evalCell(r);
        if (val === 'CIRC') {
          memo[ref] = 'CIRC';
          evaluating.delete(ref);
          return memo[ref];
        }
        exprParts.push(val);
      }

      // Replace references with their numeric values
      let expr = raw.slice(1); // remove leading '='
      refs.forEach(r => {
        const val = evalCell(r);
        expr = expr.replaceAll(r, isNaN(val) ? 0 : val);
      });

      // Evaluate expression safely
      let result;
      try {
        // Only + and - allowed, so eval is safe here
        result = Function(`return ${expr}`)();
        if (typeof result !== 'number' || !isFinite(result)) throw new Error();
      } catch {
        result = 'CIRC';
      }

      memo[ref] = result;
      evaluating.delete(ref);
      return memo[ref];
    }

    // Compute all cells
    cells.forEach(cell => {
      const ref = cell.dataset.ref;
      const val = evalCell(ref);
      if (cell.value.trim().startsWith('=')) {
        cell.value = val;
      } else {
        // keep user input
      }
    });
  }

  // Initial calculation
  recalcAll();

  // Recalculate on any input change
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      // Delay to allow the input to update
      setTimeout(recalcAll, 0);
    });
  });
})();
</script>
</body>
</html>
