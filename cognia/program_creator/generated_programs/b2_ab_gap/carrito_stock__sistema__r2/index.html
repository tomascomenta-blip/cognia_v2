<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:0;
    background:#f5f5f5;
  }
  .container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
  }
  .products{
    flex:1 1 300px;
  }
  .cart{
    flex:1 1 300px;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .prod{
    background:#fff;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .prod .img{
    background:#add8e6;
    height:100px;
    border-radius:5px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#333;
  }
  .prod h3{
    margin:0 0 5px;
    font-size:1.1em;
  }
  .prod .price, .prod .stock{
    margin:5px 0;
    font-size:0.95em;
  }
  .prod .price strong, .prod .stock strong{
    font-weight:bold;
  }
  .add{
    background:#98ff98;
    color:#000;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
  }
  .add:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  .quitar{
    background:#ffb6c1;
    color:#000;
    border:none;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    font-size:0.9em;
  }
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .linea .cant{
    font-weight:bold;
  }
  .total{
    font-weight:bold;
    margin-top:20px;
    font-size:1.2em;
  }
  @media(max-width:600px){
    .container{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img">Imagen</div>
      <h3>Producto 1</h3>
      <p class="price"><strong>Precio:</strong> 100,00 €</p>
      <p class="stock"><strong>Stock:</strong> 2</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img">Imagen</div>
      <h3>Producto 2</h3>
      <p class="price"><strong>Precio:</strong> 50,00 €</p>
      <p class="stock"><strong>Stock:</strong> 3</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img">Imagen</div>
      <h3>Producto 3</h3>
      <p class="price"><strong>Precio:</strong> 25,00 €</p>
      <p class="stock"><strong>Stock:</strong> 1</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cart = {};

  // Add button handlers
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click', function(){
      const id = this.dataset.id;
      const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
      const stock = parseInt(prodDiv.dataset.stock,10);
      const qty = cart[id] || 0;
      if(qty < stock){
        cart[id] = qty + 1;
        updateLine(id, cart[id]);
        if(cart[id] === stock){
          this.disabled = true;
        }
        updateTotal();
      }
    });
  });

  // Remove button handler (delegated)
  document.getElementById('cart-lines').addEventListener('click', function(e){
    if(e.target.classList.contains('quitar')){
      const id = e.target.dataset.id;
      const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
      const stock = parseInt(prodDiv.dataset.stock,10);
      const qty = cart[id] || 0;
      if(qty > 0){
        cart[id] = qty - 1;
        if(cart[id] === 0){
          delete cart[id];
          const line = document.querySelector(`.linea[data-id="${id}"]`);
          if(line) line.remove();
          const addBtn = document.querySelector(`.add[data-id="${id}"]`);
          if(addBtn) addBtn.disabled = false;
        } else {
          updateLine(id, cart[id]);
        }
        updateTotal();
      }
    }
  });

  function updateLine(id, qty){
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if(!line){
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      const cantSpan = document.createElement('span');
      cantSpan.className = 'cant';
      cantSpan.textContent = qty;
      const quitarBtn = document.createElement('button');
      quitarBtn.className = 'quitar';
      quitarBtn.dataset.id = id;
      quitarBtn.textContent = 'Quitar';
      line.appendChild(cantSpan);
      line.appendChild(quitarBtn);
      document.getElementById('cart-lines').appendChild(line);
    } else {
      const cantSpan = line.querySelector('.cant');
      cantSpan.textContent = qty;
    }
  }

  function updateTotal(){
    let total = 0;
    for(const id in cart){
      const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseInt(prodDiv.dataset.precio,10);
      total += cart[id] * price;
    }
    document.getElementById('total').textContent =
      total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  // Inicializar total
  updateTotal();
});
</script>
</body>
</html>
