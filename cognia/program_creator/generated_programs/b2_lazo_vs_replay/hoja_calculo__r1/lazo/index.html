
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3×3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f0f0f0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
  }
  .celda{
    width:80px;height:30px;padding:5px;
    box-sizing:border-box;text-align:right;
    font-size:14px;
    animation:fadeIn 0.5s ease-out;
  }
  @keyframes fadeIn{
    0%{opacity:0;transform:scale(.9);}
    100%{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="0">
  <input class="celda" data-ref="A2" value="0">
  <input class="celda" data-ref="A3" value="0">
  <input class="celda" data-ref="B1" value="0">
  <input class="celda" data-ref="B2" value="0">
  <input class="celda" data-ref="B3" value="0">
  <input class="celda" data-ref="C1" value="0">
  <input class="celda" data-ref="C2" value="0">
  <input class="celda" data-ref="C3" value="0">
</div>

<script>
(() => {
  const cells = [...document.querySelectorAll('.celda')];
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  // ---------- Evaluación ----------
  function evaluateCell(cell, visited = new Set()) {
    const formula = cell.dataset.formula;
    if (!formula) return cell.value; // no fórmula, devuelve el valor tal cual

    const ref = cell.dataset.ref;
    if (visited.has(ref)) return 'CIRC'; // ciclo detectado

    visited.add(ref);
    const expr = formula.slice(1); // quitar '='
    const refs = expr.match(/[A-C][1-3]/g) || [];

    let resolved = expr;
    for (const r of refs) {
      const target = refMap[r];
      const res = evaluateCell(target, new Set(visited));
      if (res === 'CIRC') return 'CIRC';
      // si el resultado no es numérico, lo tratamos como 0
      const num = parseFloat(res);
      resolved = resolved.replaceAll(r, isNaN(num) ? '0' : num);
    }

    try {
      const result = eval(resolved); // solo + y -
      return isNaN(result) ? 'ERR' : result.toString();
    } catch {
      return 'ERR';
    }
  }

  // ---------- Actualización ----------
  function updateAll() {
    cells.forEach(cell => {
      const val = cell.value;
      if (cell.dataset.formula) {
        const res = evaluateCell(cell);
        cell.value = res;
      }
    });
  }

  // ---------- Eventos ----------
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      const val = cell.value;
      if (val.startsWith('=')) {
        cell.dataset.formula = val; // guardamos la fórmula
      } else {
        delete cell.dataset.formula; // no es fórmula
      }
      updateAll();
    });
  });

  // Inicializamos
  updateAll();
})();
</script>
</body>
</html>
