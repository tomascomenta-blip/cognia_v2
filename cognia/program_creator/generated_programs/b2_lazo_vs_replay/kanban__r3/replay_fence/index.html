
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;background:#f0f0f0;}
.board{display:flex;height:100vh;gap:10px;padding:10px;}
.col{background:#fff;border-radius:4px;flex:1;display:flex;flex-direction:column;overflow:auto;}
.col header{background:#e0e0e0;padding:8px;font-weight:bold;text-align:center;}
.card{background:#fafafa;margin:8px;padding:8px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center;}
.card button{background:#ddd;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;margin-left:4px;}
.card button:disabled{opacity:.4;cursor:not-allowed;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.col{animation:fadeIn 0.5s ease-out;}
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo"><header>todo <span id="cont-todo"></span></header></div>
  <div class="col" data-col="doing"><header>doing <span id="cont-doing"></span></header></div>
  <div class="col" data-col="done"><header>done <span id="cont-done"></span></header></div>
</div>
<script>
function createCard(id){const c=document.createElement('div');c.className='card';c.dataset.id=id;const t=document.createElement('span');t.textContent=id;const btns=document.createElement('div');const m=document.createElement('button');m.className='mas';m.textContent='+';const n=document.createElement('button');n.className='menos';n.textContent='-';btns.append(m,n);c.append(t,btns);return c;}
function updateCounters(){['todo','doing','done'].forEach(col=>{const cnt=document.getElementById('cont-'+col);cnt.textContent='('+document.querySelectorAll('.col[data-col="'+col+'"] .card').length+')';});}
function moveCard(card,dir){const colEl=card.parentElement;const col=colEl.dataset.col;const cols=['todo','doing','done'];let idx=cols.indexOf(col)+dir;if(idx<0||idx>2)return;const targetCol=cols[idx];const targetEl=document.querySelector('.col[data-col="'+targetCol+'"]');if(targetCol==='doing'&&targetEl.querySelectorAll('.card').length>=2)return;targetEl.appendChild(card);updateCounters();}
document.addEventListener('DOMContentLoaded',()=>{const todo=document.querySelector('.col[data-col="todo"]');['t1','t2','t3'].forEach(id=>{todo.appendChild(createCard(id));});updateCounters();document.body.addEventListener('click',e=>{if(e.target.classList.contains('mas'))moveCard(e.target.parentElement.parentElement,1);else if(e.target.classList.contains('menos'))moveCard(e.target.parentElement.parentElement,-1);});});
</script>
</body>
</html>
