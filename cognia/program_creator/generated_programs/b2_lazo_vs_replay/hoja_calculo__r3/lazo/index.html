<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#e0f7fa;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #toolbar{
    margin-bottom:10px;
  }
  #toolbar button{
    padding:5px 10px;
    font-size:14px;
    background:#b2ebf2;
    border:1px solid #80deea;
    border-radius:3px;
    cursor:pointer;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
  }
  .celda{
    width:80px;
    height:30px;
    text-align:right;
    padding:5px;
    border:1px solid #b2ebf2;
    border-radius:3px;
    background:#ffffff;
    font-size:14px;
  }
  #status{
    margin-top:10px;
    font-size:12px;
    color:#555;
  }
  @media (max-width:400px){
    #grid{
      grid-template-columns:repeat(3,1fr);
    }
    .celda{
      width:100%;
    }
  }
</style>
</head>
<body>
<div id="toolbar">
  <button id="recalcBtn">Recalcular</button>
</div>
<div id="grid">
  <input type="text" class="celda" data-ref="A1" value="10">
  <input type="text" class="celda" data-ref="A2" value="20">
  <input type="text" class="celda" data-ref="A3" value="30">
  <input type="text" class="celda" data-ref="B1" data-formula="=A1+A2" value="">
  <input type="text" class="celda" data-ref="B2" data-formula="=B1+5" value="">
  <input type="text" class="celda" data-ref="B3" data-formula="=A3-B1" value="">
  <input type="text" class="celda" data-ref="C1" data-formula="=B1+B2" value="">
  <input type="text" class="celda" data-ref="C2" data-formula="=C1-A1" value="">
  <input type="text" class="celda" data-ref="C3" data-formula="=C3+1" value="">
</div>
<div id="status">Última actualización: </div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cells = document.querySelectorAll('.celda');
  const status = document.getElementById('status');
  const recalcBtn = document.getElementById('recalcBtn');

  function recalcAll(){
    const cache = new Map();

    function evaluate(ref, path){
      if(path.includes(ref)) return 'CIRC';
      if(cache.has(ref)) return cache.get(ref);
      const cell = document.querySelector(`.celda[data-ref="${ref}"]`);
      if(!cell) return 0;
      const formula = cell.dataset.formula;
      if(!formula){
        const val = parseFloat(cell.value.replace(/,/g,''));
        const num = isNaN(val)?0:val;
        cache.set(ref, num);
        return num;
      }
      const expr = formula.slice(1);
      const replaced = expr.replace(/[A-C][1-3]/g, m=>{
        const r = evaluate(m, [...path, ref]);
        if(r==='CIRC') return 'CIRC';
        return r;
      });
      if(replaced.includes('CIRC')){
        cache.set(ref, 'CIRC');
        return 'CIRC';
      }
      let result;
      try{
        result = Function(`return ${replaced}`)();
        if(typeof result!=='number' || isNaN(result)) throw new Error();
      }catch{
        result = 'CIRC';
      }
      cache.set(ref, result);
      return result;
    }

    cells.forEach(cell=>{
      const ref = cell.dataset.ref;
      const val = evaluate(ref, []);
      if(cell.dataset.formula){
        if(val==='CIRC'){
          cell.value = 'CIRC';
        }else{
          cell.value = val.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
        }
      }
    });

    status.textContent = 'Última actualización: '+new Date().toLocaleTimeString();
  }

  cells.forEach(cell=>{
    cell.addEventListener('change', e=>{
      const val = e.target.value.trim();
      if(val.startsWith('=')){
        e.target.dataset.formula = val;
      }else{
        delete e.target.dataset.formula;
      }
      recalcAll();
    });
  });

  recalcBtn.addEventListener('click', recalcAll);

  recalcAll();
});
</script>
</body>
</html>
