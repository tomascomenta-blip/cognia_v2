<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f5f5f5;
    --accent:#008080;
    --red:#d32f2f;
    --gray:#e0e0e0;
    --text:#333;
  }
  body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:var(--text);}
  .container{display:flex;min-height:100vh;flex-direction:row;}
  .products{flex:2;padding:16px;display:flex;flex-direction:column;gap:16px;}
  .cart{flex:1;background:#fff;border-left:1px solid #ddd;padding:16px;display:flex;flex-direction:column;}
  .prod{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .prod h3{margin:0;font-weight:500;}
  .prod .price{margin:0;font-weight:300;}
  .prod .stock{font-size:.8rem;background:var(--gray);color:var(--text);border-radius:12px;padding:2px 6px;display:inline-block;}
  .prod .add{background:var(--accent);color:#fff;border:none;border-radius:4px;padding:8px 12px;cursor:pointer;font-weight:500;}
  .prod .add:disabled{background:#a0a0a0;cursor:not-allowed;}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .linea .name{font-weight:500;}
  .linea .cant{margin:0 8px;}
  .linea .quitar{background:var(--red);color:#fff;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;font-weight:500;}
  .linea .quitar:disabled{background:#a0a0a0;cursor:not-allowed;}
  .total{margin-top:auto;font-weight:700;font-size:1.2rem;}
  .total span{font-weight:700;}
  @media (max-width:600px){
    .container{flex-direction:column;}
    .cart{border-left:none;border-top:1px solid #ddd;}
  }
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2" data-name="Producto 1">
      <h3>Producto 1</h3>
      <p class="price">100,00 €</p>
      <span class="stock">Stock: 2</span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3" data-name="Producto 2">
      <h3>Producto 2</h3>
      <p class="price">50,00 €</p>
      <span class="stock">Stock: 3</span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1" data-name="Producto 3">
      <h3>Producto 3</h3>
      <p class="price">25,00 €</p>
      <span class="stock">Stock: 1</span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const cart={};
  const addBtns=document.querySelectorAll('.add');
  addBtns.forEach(btn=>{
    btn.addEventListener('click',()=>addToCart(btn.dataset.id));
  });

  function addToCart(id){
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const stock=parseInt(prod.dataset.stock);
    const price=parseFloat(prod.dataset.precio);
    const name=prod.dataset.name;
    let qty=cart[id]||0;
    if(qty<stock){
      qty++;
      cart[id]=qty;
      updateLine(id,name,qty,price);
      updateAddButton(id,qty,stock);
      updateTotal();
    }
  }

  function updateLine(id,name,qty,price){
    let line=document.querySelector(`.linea[data-id="${id}"]`);
    if(line){
      line.querySelector('.cant').textContent=qty;
    }else{
      const linesDiv=document.getElementById('lines');
      const div=document.createElement('div');
      div.className='linea';
      div.dataset.id=id;
      div.innerHTML=`<span class="name">${name}</span><span class="cant">${qty}</span><button class="quitar" data-id="${id}">Quitar</button>`;
      linesDiv.appendChild(div);
      const btn=div.querySelector('.quitar');
      btn.addEventListener('click',()=>removeFromCart(id));
    }
  }

  function removeFromCart(id){
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const stock=parseInt(prod.dataset.stock);
    let qty=cart[id]||0;
    if(qty>0){
      qty--;
      if(qty===0){
        delete cart[id];
        const line=document.querySelector(`.linea[data-id="${id}"]`);
        if(line) line.remove();
      }else{
        cart[id]=qty;
        const line=document.querySelector(`.linea[data-id="${id}"]`);
        if(line) line.querySelector('.cant').textContent=qty;
      }
      updateAddButton(id,qty,stock);
      updateTotal();
    }
  }

  function updateAddButton(id,qty,stock){
    const btn=document.querySelector(`.add[data-id="${id}"]`);
    btn.disabled=qty>=stock;
  }

  function updateTotal(){
    let total=0;
    for(const id in cart){
      const prod=document.querySelector(`.prod[data-id="${id}"]`);
      const price=parseFloat(prod.dataset.precio);
      total+=price*cart[id];
    }
    document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  }
});
</script>
</body>
</html>
