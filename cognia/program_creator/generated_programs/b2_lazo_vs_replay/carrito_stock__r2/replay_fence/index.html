
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#333;}
  .container{display:flex;flex-wrap:wrap;padding:20px;}
  .products,.cart{flex:1 1 300px;margin:10px;}
  .products{max-width:400px;}
  .prod{background:#fff;border:1px solid #ddd;border-radius:4px;padding:15px;margin-bottom:15px;display:flex;flex-direction:column;}
  .prod h3{margin:0 0 10px;font-weight:500;font-size:1.1rem;}
  .prod .price{color:#777;font-size:0.9rem;margin-bottom:5px;}
  .prod .stock{font-size:0.8rem;color:#777;margin-bottom:10px;}
  .prod .add{background:#4CAF50;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:0.9rem;}
  .prod .add:disabled{background:#9E9E9E;cursor:not-allowed;}
  .cart{background:#fff;border:1px solid #ddd;border-radius:4px;padding:15px;}
  .cart h2{margin-top:0;font-weight:500;font-size:1.2rem;}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .linea .name{flex:1;}
  .linea .cant{margin:0 10px;}
  .linea .quitar{background:#F44336;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:0.8rem;}
  .total{font-weight:bold;font-size:1.1rem;margin-top:15px;}
  @media (max-width:600px){.container{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <div class="price">Precio: 100,00 €</div>
      <div class="stock">Stock: 2</div>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <div class="price">Precio: 50,00 €</div>
      <div class="stock">Stock: 3</div>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <div class="price">Precio: 25,00 €</div>
      <div class="stock">Stock: 1</div>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
(function(){
  const products = document.querySelectorAll('.prod');
  const linesContainer = document.getElementById('lines');
  const totalSpan = document.getElementById('total');
  const cart = {}; // id -> quantity

  function formatCurrency(val){
    return val.toLocaleString('es-ES', {style:'currency', currency:'EUR', minimumFractionDigits:2});
  }

  function updateTotal(){
    let sum = 0;
    for(const id in cart){
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      sum += price * cart[id];
    }
    totalSpan.textContent = formatCurrency(sum);
  }

  function updateAddButton(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const addBtn = prod.querySelector('.add');
    const stock = parseInt(prod.dataset.stock);
    addBtn.disabled = cart[id] >= stock;
  }

  function createLine(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = prod.querySelector('h3').textContent;
    const cant = document.createElement('span');
    cant.className = 'cant';
    cant.textContent = cart[id];
    const quitar = document.createElement('button');
    quitar.className = 'quitar';
    quitar.dataset.id = id;
    quitar.textContent = 'Quitar';
    quitar.addEventListener('click', () => removeItem(id));
    line.appendChild(name);
    line.appendChild(cant);
    line.appendChild(quitar);
    linesContainer.appendChild(line);
  }

  function removeItem(id){
    if(!cart[id]) return;
    cart[id]--;
    if(cart[id] <= 0){
      delete cart[id];
      const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
      if(line) line.remove();
    }else{
      const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
      if(line){
        const cantSpan = line.querySelector('.cant');
        cantSpan.textContent = cart[id];
      }
    }
    updateAddButton(id);
    updateTotal();
  }

  function addItem(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    if(cart[id] === undefined) cart[id] = 0;
    if(cart[id] < stock){
      cart[id]++;
      if(cart[id] === 1){
        createLine(id);
      }else{
        const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
        if(line){
          const cantSpan = line.querySelector('.cant');
          cantSpan.textContent = cart[id];
        }
      }
      updateAddButton(id);
      updateTotal();
    }
  }

  products.forEach(prod=>{
    const addBtn = prod.querySelector('.add');
    addBtn.addEventListener('click', () => addItem(prod.dataset.id));
  });

  updateTotal();
})();
</script>
</body>
</html>
