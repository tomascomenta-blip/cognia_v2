
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Minesweeper 5x5</title><style>body{font-family:sans-serif;text-align:center;margin:0;padding:0;}h1{font-weight:bold;margin:1rem 0;}#grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-flow:column;width:90vmin;max-width:400px;margin:auto;} .c{aspect-ratio:1;background:#e0e0e0;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;user-select:none;} .c.abierta{background:#add8e6;color:#0000ff;} .c.bandera{background:#e0e0e0;color:#ff0000;}#estado{margin-top:1rem;font-weight:bold;}</style></head>
<body><h1>Minesweeper 5x5</h1><div id="grid"><div class="c" data-i="0"></div><div class="c" data-i="1"></div><div class="c" data-i="2"></div><div class="c" data-i="3"></div><div class="c" data-i="4"></div><div class="c" data-i="5"></div><div class="c" data-i="6"></div><div class="c" data-i="7"></div><div class="c" data-i="8"></div><div class="c" data-i="9"></div><div class="c" data-i="10"></div><div class="c" data-i="11"></div><div class="c" data-i="12"></div><div class="c" data-i="13"></div><div class="c" data-i="14"></div><div class="c" data-i="15"></div><div class="c" data-i="16"></div><div class="c" data-i="17"></div><div class="c" data-i="18"></div><div class="c" data-i="19"></div><div class="c" data-i="20"></div><div class="c" data-i="21"></div><div class="c" data-i="22"></div><div class="c" data-i="23"></div><div class="c" data-i="24"></div></div><div id="estado"></div><script>const mines=new Set([6,12,18]),cells=document.querySelectorAll('.c'),counts=Array(25).fill(0);for(let i=0;i<25;i++){let r=Math.floor(i/5),c=i%5;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(!(dr===0&&dc===0)){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5){let j=nr*5+nc;if(mines.has(j))counts[i]++;}}}function openCell(idx){let cell=cells[idx];if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;if(mines.has(idx)){cell.classList.add('abierta');cell.textContent='💣';document.getElementById('estado').textContent='perdiste';return;}cell.classList.add('abierta');cell.textContent=counts[idx]||'';if(counts[idx]===0){let q=[idx];while(q.length){let cur=q.shift(),r=Math.floor(cur/5),c=cur%5;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(!(dr===0&&dc===0)){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5){let j=nr*5+nc;let ccell=cells[j];if(ccell.classList.contains('abierta')||ccell.classList.contains('bandera')||mines.has(j))continue;ccell.classList.add('abierta');ccell.textContent=counts[j]||'';if(counts[j]===0)q.push(j);}}}}}cells.forEach(cell=>{cell.addEventListener('click',()=>openCell(+cell.dataset.i));cell.addEventListener('contextmenu',e=>{e.preventDefault();if(cell.classList.contains('abierta'))return;cell.classList.toggle('bandera');});});</script></body></html>
