<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minería 5x5</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#222;color:#eee;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:300px;}
  .c{background:#444;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;aspect-ratio:1;}
  .c.abierta{background:#555;color:#0ff;}
  .c.bandera{color:orange;}
  .c.bandera::before{content:"🚩";}
  #estado{margin-top:15px;font-size:1.2rem;font-weight:bold;color:#f00;text-align:center;}
</style>
</head>
<body>
<h1>Minería 5x5</h1>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>

<script>
(() => {
  const mines = new Set([6,12,18]); // índices de minas
  const cells = Array.from(document.querySelectorAll('.c'));
  const estado = document.getElementById('estado');
  const size = 5;

  // Pre‑calcular conteo de minas adyacentes
  const counts = cells.map(cell => {
    const i = +cell.dataset.i;
    const r = Math.floor(i / size);
    const c = i % size;
    let count = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
        const ni = nr * size + nc;
        if (mines.has(ni)) count++;
      }
    }
    return count;
  });

  // Función para abrir una celda
  const openCell = (cell) => {
    const i = +cell.dataset.i;
    if (cell.classList.contains('bandera') || cell.classList.contains('abierta')) return;
    if (mines.has(i)) {
      cell.classList.add('abierta');
      estado.textContent = 'perdiste';
      return;
    }
    cell.classList.add('abierta');
    const cnt = counts[i];
    if (cnt > 0) cell.textContent = cnt;
    if (cnt === 0) flood(i);
  };

  // Flood fill para celdas con 0 minas adyacentes
  const flood = (startIdx) => {
    const queue = [startIdx];
    const visited = new Set();
    while (queue.length) {
      const idx = queue.shift();
      if (visited.has(idx)) continue;
      visited.add(idx);
      const cell = cells[idx];
      if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
      cell.classList.add('abierta');
      const cnt = counts[idx];
      if (cnt > 0) cell.textContent = cnt;
      if (cnt === 0) {
        const r = Math.floor(idx / size);
        const c = idx % size;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= size || nc < 0 || nc >= size) continue;
            const ni = nr * size + nc;
            if (!visited.has(ni)) queue.push(ni);
          }
        }
      }
    }
  };

  // Eventos
  cells.forEach(cell => {
    cell.addEventListener('click', () => openCell(cell));
    cell.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (cell.classList.contains('abierta')) return;
      cell.classList.toggle('bandera');
    });
  });
})();
</script>
</body>
</html>
