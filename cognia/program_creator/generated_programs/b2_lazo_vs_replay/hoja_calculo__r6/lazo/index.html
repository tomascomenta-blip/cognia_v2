<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3×3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#fafafa;font-family:monospace;}
  table{border-collapse:collapse;}
  th{background:#e0e0e0;font-weight:bold;text-align:center;padding:4px;}
  .celda{width:80px;height:30px;text-align:right;background:#f0f0f0;border:1px solid #ccc;font-family:monospace;padding:0 4px;}
  .celda:focus{outline:2px solid teal;}
  .cell{display:flex;align-items:center;}
  .error-icon{color:#c00;font-size:12px;margin-left:4px;display:none;}
</style>
</head>
<body>
<table>
  <thead>
    <tr>
      <th></th><th class="header">A</th><th class="header">B</th><th class="header">C</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th class="header">1</th>
      <td class="cell"><input type="text" class="celda" data-ref="A1"><span class="error-icon" title="Circular reference">⚠️</span></td>
      <td class="cell"><input type="text" class="celda" data-ref="B1"><span class="error-icon" title="Circular reference">⚠️</span></td>
      <td class="cell"><input type="text" class="celda" data-ref="C1"><span class="error-icon" title="Circular reference">⚠️</span></td>
    </tr>
    <tr>
      <th class="header">2</th>
      <td class="cell"><input type="text" class="celda" data-ref="A2"><span class="error-icon" title="Circular reference">⚠️</span></td>
      <td class="cell"><input type="text" class="celda" data-ref="B2"><span class="error-icon" title="Circular reference">⚠️</span></td>
      <td class="cell"><input type="text" class="celda" data-ref="C2"><span class="error-icon" title="Circular reference">⚠️</span></td>
    </tr>
    <tr>
      <th class="header">3</th>
      <td class="cell"><input type="text" class="celda" data-ref="A3"><span class="error-icon" title="Circular reference">⚠️</span></td>
      <td class="cell"><input type="text" class="celda" data-ref="B3"><span class="error-icon" title="Circular reference">⚠️</span></td>
      <td class="cell"><input type="text" class="celda" data-ref="C3"><span class="error-icon" title="Circular reference">⚠️</span></td>
    </tr>
  </tbody>
</table>
<script>
(() => {
  const cells = {};
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  refs.forEach(ref=>{
    const input=document.querySelector(`input[data-ref="${ref}"]`);
    const icon=input.parentElement.querySelector('.error-icon');
    cells[ref]={ref,element:input,errorIcon:icon,dependencies:[],dependents:[],isFormula:false,formula:'',value:''};
  });

  function updateDependencies(){
    Object.values(cells).forEach(cell=>{
      cell.dependencies=[];
      cell.dependents=[];
    });
    Object.values(cells).forEach(cell=>{
      const val=cell.element.value.trim();
      if(val.startsWith('=')){
        cell.isFormula=true;
        cell.formula=val.slice(1);
        const refsIn=cell.formula.match(/[A-C][1-3]/g)||[];
        cell.dependencies=refsIn;
        refsIn.forEach(r=>{
          if(cells[r])cells[r].dependents.push(cell.ref);
        });
      }else{
        cell.isFormula=false;
        cell.formula='';
      }
    });
  }

  function computeValue(cell,stack){
    if(stack.has(cell.ref))return 'CIRC';
    if(!cell.isFormula)return cell.element.value.trim();
    stack.add(cell.ref);
    const refsIn=cell.formula.match(/[A-C][1-3]/g)||[];
    const values={};
    for(const r of refsIn){
      const dep=cells[r];
      if(!dep){values[r]=0;continue;}
      const v=computeValue(dep,stack);
      if(v==='CIRC')return 'CIRC';
      values[r]=Number(v)||0;
    }
    let expr=cell.formula;
    for(const r of refsIn){
      expr=expr.replaceAll(r,values[r]);
    }
    let result;
    try{
      result=eval(expr);
    }catch(e){return 'CIRC';}
    stack.delete(cell.ref);
    return result;
  }

  function recomputeAll(){
    updateDependencies();
    Object.values(cells).forEach(cell=>{
      const val=computeValue(cell,new Set());
      cell.value=val;
      cell.element.value=val;
      if(val==='CIRC'){
        cell.errorIcon.style.display='inline';
      }else{
        cell.errorIcon.style.display='none';
      }
    });
  }

  Object.values(cells).forEach(cell=>{
    cell.element.addEventListener('input',()=>{recomputeAll();});
  });
  recomputeAll();
})();
</script>
</body>
</html>
