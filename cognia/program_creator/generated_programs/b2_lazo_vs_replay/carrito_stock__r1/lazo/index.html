<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#333;}
  .container{max-width:600px;margin:auto;padding:10px;}
  h1{font-size:24px;margin:0 0 20px 0;text-align:center;}
  .prod{display:flex;align-items:center;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:10px;}
  .thumb{width:60px;height:60px;background:#ddd;border-radius:4px;margin-right:10px;}
  .details{flex:1;}
  .details p{margin:4px 0;}
  .stock{background:#1abc9c;color:#fff;padding:2px 6px;border-radius:4px;font-size:12px;}
  .add{background:#1abc9c;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;}
  .add:disabled{background:#ccc;cursor:not-allowed;}
  #cart{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px;}
  #cart h2{font-size:18px;margin:0 0 10px 0;}
  .linea{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:5px 0;}
  .linea span{margin-right:10px;}
  .quitar{background:#e74c3c;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;}
  #total{font-weight:bold;}
  @media(max-width:480px){
    .prod{flex-direction:column;align-items:flex-start;}
    .thumb{margin-bottom:10px;}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Carrito</h1>
  <div id="products"></div>
  <div id="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div id="cart-total"><strong>Total: <span id="total">0 €</span></strong></div>
  </div>
</div>

<script>
const PRODUCTS = [
  {id:'p1', name:'Producto 1', price:100, stock:2},
  {id:'p2', name:'Producto 2', price:50, stock:3},
  {id:'p3', name:'Producto 3', price:25, stock:1}
];

const cart = {}; // {id: quantity}
const prodElems = {}; // {id: {addBtn, stockBadge}}

function formatPrice(v){ return v.toLocaleString('es-ES',{style:'currency',currency:'EUR'}); }

function renderProducts(){
  const container = document.getElementById('products');
  PRODUCTS.forEach(p=>{
    const div = document.createElement('div');
    div.className='prod';
    div.dataset.id=p.id;
    div.dataset.precio=p.price;
    div.dataset.stock=p.stock;
    div.innerHTML = `
      <div class="thumb"></div>
      <div class="details">
        <p><strong>${p.name}</strong></p>
        <p>Precio: ${formatPrice(p.price)}</p>
        <p class="stock" id="stock-${p.id}">Stock: ${p.stock}</p>
      </div>
      <button class="add" data-id="${p.id}">Añadir</button>
    `;
    container.appendChild(div);
    prodElems[p.id] = {
      addBtn: div.querySelector('.add'),
      stockBadge: div.querySelector('.stock')
    };
    div.querySelector('.add').addEventListener('click',()=>addToCart(p.id));
  });
}

function addToCart(id){
  const prod = PRODUCTS.find(p=>p.id===id);
  const qty = cart[id] || 0;
  if(qty < prod.stock){
    cart[id] = qty + 1;
    updateLine(id);
    updateTotal();
    if(cart[id] >= prod.stock){
      prodElems[id].addBtn.disabled = true;
    }
  }
}

function removeFromCart(id){
  if(!cart[id]) return;
  cart[id] -= 1;
  if(cart[id] <= 0){
    delete cart[id];
    removeLine(id);
    prodElems[id].addBtn.disabled = false;
  } else {
    updateLine(id);
    prodElems[id].addBtn.disabled = false;
  }
  updateTotal();
}

function updateLine(id){
  const prod = PRODUCTS.find(p=>p.id===id);
  let line = document.querySelector(`.linea[data-id="${id}"]`);
  if(!line){
    line = document.createElement('div');
    line.className='linea';
    line.dataset.id=id;
    line.innerHTML = `
      <span>${prod.name}</span>
      <span class="cant">${cart[id]}</span>
      <span>${formatPrice(prod.price)}</span>
      <button class="quitar" data-id="${id}">Quitar</button>
    `;
    document.getElementById('cart-lines').appendChild(line);
    line.querySelector('.quitar').addEventListener('click',()=>removeFromCart(id));
  } else {
    line.querySelector('.cant').textContent = cart[id];
  }
  prodElems[id].stockBadge.textContent = `Stock: ${prod.stock - cart[id]}`;
}

function removeLine(id){
  const line = document.querySelector(`.linea[data-id="${id}"]`);
  if(line) line.remove();
  const prod = PRODUCTS.find(p=>p.id===id);
  prodElems[id].stockBadge.textContent = `Stock: ${prod.stock}`;
}

function updateTotal(){
  let total = 0;
  Object.keys(cart).forEach(id=>{
    const prod = PRODUCTS.find(p=>p.id===id);
    total += prod.price * cart[id];
  });
  document.getElementById('total').textContent = formatPrice(total);
}

document.addEventListener('DOMContentLoaded',()=>{
  renderProducts();
  updateTotal();
});
</script>
</body>
</html>
