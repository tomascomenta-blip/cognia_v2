<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulador de ascensor</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
#panel{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;width:260px;}
#status{font-size:1.8em;margin-bottom:20px;text-align:center;}
#status span{display:block;}
#status #dir{font-size:.6em;color:#777;}
.call{background:#e0e0e0;border:none;border-radius:4px;margin:4px 0;width:100%;padding:10px;font-size:1.2em;}
.call.active{background:#008080;color:#fff;}
#paso{background:#008080;color:#fff;border:none;border-radius:4px;padding:12px 0;width:100%;font-size:1.2em;margin-top:20px;}
@media(max-width:400px){#panel{width:90%;}}
</style>
</head>
<body>
<div id="panel">
  <div id="status"><span id="piso">0</span><span id="dir">parado</span></div>
  <div id="calls">
    <button class="call" data-p="0">0</button>
    <button class="call" data-p="1">1</button>
    <button class="call" data-p="2">2</button>
    <button class="call" data-p="3">3</button>
    <button class="call" data-p="4">4</button>
    <button class="call" data-p="5">5</button>
  </div>
  <button id="paso">Paso</button>
</div>
<script>
(function(){
  const pisoEl=document.getElementById('piso'), dirEl=document.getElementById('dir');
  const callBtns=document.querySelectorAll('.call');
  let piso=0, dir='parado', pendientes=[];
  function updateUI(){
    pisoEl.textContent=piso;
    dirEl.textContent=dir;
    callBtns.forEach(b=>{
      const p=parseInt(b.dataset.p,10);
      b.classList.toggle('active', pendientes.includes(p));
    });
    window.asc={piso,dir,pendientes:pendientes.slice()};
  }
  function addPendiente(p){
    if(p===piso){return;}
    if(!pendientes.includes(p)) pendientes.push(p);
    updateUI();
  }
  function removePendiente(p){
    const i=pendientes.indexOf(p);
    if(i>-1){pendientes.splice(i,1);}
    updateUI();
  }
  callBtns.forEach(b=>{
    b.addEventListener('click',()=>{addPendiente(parseInt(b.dataset.p,10));});
  });
  document.getElementById('paso').addEventListener('click',()=>{
    // Determine direction if parado
    if(dir==='parado'){
      const above=pendientes.filter(p=>p>piso);
      const below=pendientes.filter(p=>p<piso);
      if(above.length) dir='sube';
      else if(below.length) dir='baja';
    }
    // Move one floor
    if(dir==='sube'){
      if(pendientes.some(p=>p>piso)) piso++;
      else if(pendientes.some(p=>p<piso)){dir='baja'; piso--;}
    }else if(dir==='baja'){
      if(pendientes.some(p=>p<piso)) piso--;
      else if(pendientes.some(p=>p>piso)){dir='sube'; piso++;}
    }
    // Serve call if present
    if(pendientes.includes(piso)) removePendiente(piso);
    // If no pending, stop
    if(pendientes.length===0) dir='parado';
    updateUI();
  });
  updateUI();
})();
</script>
</body>
</html>
