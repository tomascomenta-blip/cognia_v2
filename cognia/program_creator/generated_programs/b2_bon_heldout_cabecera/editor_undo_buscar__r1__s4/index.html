<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor de Texto con Buscar y Reemplazar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#2e2e2e;
    color:#e0e0e0;
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  .toolbar{
    background:#3c3c3c;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .toolbar input{
    padding:5px;
    border:none;
    border-radius:3px;
    background:#4a4a4a;
    color:#e0e0e0;
    font-size:1rem;
  }
  .toolbar button{
    padding:5px 10px;
    border:none;
    border-radius:3px;
    background:#4caf50;
    color:white;
    cursor:pointer;
    font-size:1rem;
  }
  .toolbar button:hover{
    background:#45a049;
  }
  textarea#doc{
    flex:1;
    padding:10px;
    border:none;
    background:#1e1e1e;
    color:#e0e0e0;
    font-family:monospace;
    font-size:1rem;
    resize:none;
    outline:none;
  }
</style>
</head>
<body>
<div class="toolbar">
  <input id="buscar" placeholder="Buscar">
  <input id="reemplazo" placeholder="Reemplazo">
  <button id="reemplazar">Reemplazar</button>
  <button id="undo">Undo</button>
</div>
<textarea id="doc">gato perro gato loro gato</textarea>
<script>
  (function(){
    const textarea=document.getElementById('doc');
    const buscar=document.getElementById('buscar');
    const reemplazo=document.getElementById('reemplazo');
    const reemplazarBtn=document.getElementById('reemplazar');
    const undoBtn=document.getElementById('undo');
    const stack=[];
    let lastValue=textarea.value;

    function pushState(){
      stack.push(lastValue);
    }

    textarea.addEventListener('input',()=>{
      pushState();
      lastValue=textarea.value;
    });

    reemplazarBtn.addEventListener('click',()=>{
      const find=buscar.value;
      if(find==='') return;
      pushState();
      const replace=reemplazo.value;
      const escaped=find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const regex=new RegExp(escaped,'g');
      textarea.value=textarea.value.replace(regex,replace);
      lastValue=textarea.value;
    });

    undoBtn.addEventListener('click',()=>{
      if(stack.length===0) return;
      const prev=stack.pop();
      textarea.value=prev;
      lastValue=prev;
    });
  })();
</script>
</body>
</html>
