<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agenda sin solapamientos</title>
<style>
body{font-family:sans-serif;background:#f0f4f8;margin:0;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px;}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:400px;width:100%;padding:20px;}
header{display:flex;gap:10px;margin-bottom:10px;}
input{flex:1;padding:8px;border:1px solid #ccc;border-radius:4px;}
button{padding:8px 12px;background:#008080;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#aviso{color:#d03b3b;margin-bottom:10px;height:20px;}
.ev{margin:4px 0;padding:8px;border-radius:4px;color:#fff;background:linear-gradient(90deg,#008080,#4caf50);font-size:14px;}
@media (max-width:480px){header{flex-direction:column;}}
</style>
</head>
<body>
<div class="card">
<header>
<input id="desde" type="number" min="0" max="23" placeholder="Desde">
<input id="hasta" type="number" min="0" max="23" placeholder="Hasta">
<button id="crear">Crear</button>
</header>
<div id="aviso"></div>
<div id="lista"></div>
</div>
<script>
document.getElementById('crear').onclick=function(){
var desde=parseInt(document.getElementById('desde').value,10);
var hasta=parseInt(document.getElementById('hasta').value,10);
var aviso=document.getElementById('aviso');
aviso.textContent='';
if(isNaN(desde)||isNaN(hasta)||desde>=hasta){aviso.textContent='conflicto';return;}
var lista=document.getElementById('lista');
var evs=lista.querySelectorAll('.ev');
for(var i=0;i<evs.length;i++){
var d=parseInt(evs[i].dataset.desde,10);
var h=parseInt(evs[i].dataset.hasta,10);
if(desde<h && hasta>d){aviso.textContent='conflicto';return;}
}
var div=document.createElement('div');
div.className='ev';
div.dataset.desde=desde;
div.dataset.hasta=hasta;
div.textContent=desde+'h – '+hasta+'h';
lista.appendChild(div);
};
</script>
</body>
</html>
