<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulador de ascensor</title>
<style>
  body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#fafafa;
    color:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:20px;
  }
  #status{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    font-weight:bold;
    font-family:Arial, sans-serif;
    background:#f0f0f0;
    padding:10px;
    border-radius:4px;
    width:100%;
    max-width:600px;
  }
  .main{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:20px;
    margin-top:20px;
    width:100%;
    max-width:600px;
  }
  .shaft{
    width:80px;
    border:2px solid #333;
    background:#ddd;
    position:relative;
    border-radius:4px;
    overflow:hidden;
  }
  .cabin{
    width:60%;
    position:absolute;
    left:20%;
    bottom:0;
    border-radius:4px;
    transition:bottom 0.3s ease;
  }
  .buttons{
    display:flex;
    flex-direction:column;
  }
  .call{
    background:#008080;
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    margin:4px 0;
    cursor:pointer;
    font-size:14px;
  }
  .call:hover{
    background:#006666;
  }
  .call.pending{
    background:#006666;
  }
  #paso{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    background:#008080;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  #paso:hover{
    background:#006666;
  }
</style>
</head>
<body>
<div id="status">
  <span id="piso">0</span>
  <span id="dir">parado</span>
</div>
<div class="main">
  <div class="shaft">
    <div class="cabin"></div>
  </div>
  <div class="buttons">
    <button class="call" data-p="0">0</button>
    <button class="call" data-p="1">1</button>
    <button class="call" data-p="2">2</button>
    <button class="call" data-p="3">3</button>
    <button class="call" data-p="4">4</button>
    <button class="call" data-p="5">5</button>
  </div>
</div>
<button id="paso">Avanzar</button>

<script>
const NUM_FLOORS = 6;
const FLOOR_HEIGHT = 60; // px
const CABIN_BOTTOM_OFFSET = 5; // px

let currentFloor = 0;
let direction = 'parado';
let pending = [];

function updateUI(){
  document.getElementById('piso').textContent = currentFloor;
  document.getElementById('dir').textContent = direction;
  const cabin = document.querySelector('.cabin');
  cabin.style.bottom = (currentFloor * FLOOR_HEIGHT + CABIN_BOTTOM_OFFSET) + 'px';
  document.querySelectorAll('.call').forEach(btn=>{
    const f = parseInt(btn.dataset.p);
    if(pending.includes(f)){
      btn.classList.add('pending');
    }else{
      btn.classList.remove('pending');
    }
  });
  window.asc = {piso: currentFloor, dir: direction, pendientes: [...pending]};
}

function step(){
  if(pending.includes(currentFloor)){
    pending = pending.filter(f=>f!==currentFloor);
  }
  if(direction==='parado'){
    if(pending.some(f=>f>currentFloor)) direction='sube';
    else if(pending.some(f=>f<currentFloor)) direction='baja';
    else direction='parado';
  }else if(direction==='sube'){
    if(!pending.some(f=>f>currentFloor)){
      if(pending.some(f=>f<currentFloor)) direction='baja';
      else direction='parado';
    }
  }else if(direction==='baja'){
    if(!pending.some(f=>f<currentFloor)){
      if(pending.some(f=>f>currentFloor)) direction='sube';
      else direction='parado';
    }
  }
  if(direction==='sube'){
    currentFloor++;
    if(currentFloor>=NUM_FLOORS) currentFloor=NUM_FLOORS-1;
  }else if(direction==='baja'){
    currentFloor--;
    if(currentFloor<0) currentFloor=0;
  }
  if(pending.includes(currentFloor)){
    pending = pending.filter(f=>f!==currentFloor);
  }
  updateUI();
}

document.addEventListener('DOMContentLoaded',()=>{
  const shaft = document.querySelector('.shaft');
  shaft.style.height = (NUM_FLOORS*FLOOR_HEIGHT)+'px';
  const cabin = document.querySelector('.cabin');
  cabin.style.height = (FLOOR_HEIGHT-10)+'px';
  document.getElementById('paso').addEventListener('click',step);
  document.querySelectorAll('.call').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const floor = parseInt(btn.dataset.p);
      if(floor===currentFloor){
        if(pending.includes(floor)){
          pending = pending.filter(f=>f!==floor);
          updateUI();
        }
      }else{
        if(!pending.includes(floor)){
          pending.push(floor);
          updateUI();
        }
      }
    });
  });
  updateUI();
});
</script>
</body>
</html>
