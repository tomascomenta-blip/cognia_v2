<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Cupón y Envío</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#333;
  }
  .container{
    display:flex;
    flex-direction:row;
    gap:20px;
    padding:20px;
    max-width:1200px;
    margin:auto;
  }
  .products{
    flex:1;
  }
  .prod{
    background:#fff;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    border-radius:5px;
  }
  .prod h3{
    margin:0 0 10px;
    font-weight:bold;
  }
  .add{
    padding:10px 20px;
    font-size:1.1rem;
    background:#006666;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  .add:hover{
    background:#005555;
  }
  .cart{
    width:300px;
    background:#fff;
    padding:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    border-radius:5px;
    position:sticky;
    top:20px;
    height:fit-content;
  }
  .cart h2{
    margin-top:0;
    font-size:1.3rem;
    color:#006666;
  }
  .row{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
  }
  #subtotal, #envio{
    font-weight:normal;
  }
  #total{
    font-weight:bold;
    color:#006666;
    font-size:1.2rem;
  }
  #cupon{
    width:calc(100% - 90px);
    padding:8px;
    margin-right:5px;
    border:1px solid #ccc;
    border-radius:4px;
  }
  #aplicar{
    padding:8px 12px;
    background:#006666;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  #aplicar:hover{
    background:#005555;
  }
  @media(max-width:768px){
    .container{
      flex-direction:column;
    }
    .cart{
      width:100%;
      position:static;
      margin-top:20px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="30">
      <h3>Producto 1</h3>
      <p>Precio: 30 €</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="40">
      <h3>Producto 2</h3>
      <p>Precio: 40 €</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="50">
      <h3>Producto 3</h3>
      <p>Precio: 50 €</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Resumen del carrito</h2>
    <div class="row"><span>Subtotal:</span> <span id="subtotal">0 €</span></div>
    <div class="row"><span>Envío:</span> <span id="envio">0 €</span></div>
    <div class="row"><span>Total:</span> <span id="total">0 €</span></div>
    <div style="margin-top:15px;">
      <input type="text" id="cupon" placeholder="Código de cupón">
      <button id="aplicar">Aplicar</button>
    </div>
  </div>
</div>
<script>
  // Configurables
  const SHIPPING_COST = 5;
  const DISCOUNT_CODE = 'DESCUENTO20';
  const DISCOUNT_RATE = 0.20;
  const FREE_SHIPPING_THRESHOLD = 60;

  // State
  const cart = [];
  let couponValid = false;

  // Helpers
  function formatCurrency(val){
    return val.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  function recalc(){
    const subtotal = cart.reduce((sum, id)=> sum + Number(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio), 0);
    const discount = couponValid ? subtotal * DISCOUNT_RATE : 0;
    const discountedSubtotal = subtotal - discount;
    const envio = discountedSubtotal >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_COST;
    const total = discountedSubtotal + envio;

    document.getElementById('subtotal').textContent = formatCurrency(subtotal);
    document.getElementById('envio').textContent = formatCurrency(envio);
    document.getElementById('total').textContent = formatCurrency(total);
  }

  // Event listeners
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      cart.push(btn.dataset.id);
      recalc();
    });
  });

  document.getElementById('aplicar').addEventListener('click', ()=>{
    const code = document.getElementById('cupon').value.trim();
    couponValid = code === DISCOUNT_CODE;
    recalc();
  });

  // Initial render
  recalc();
</script>
</body>
</html>
