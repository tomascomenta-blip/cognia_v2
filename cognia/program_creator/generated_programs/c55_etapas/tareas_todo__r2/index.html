<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #nueva {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #anadir {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #anadir:hover {
            background-color: #0056b3;
        }
        #lista {
            list-style-type: none;
            padding: 0;
            width: 80%;
        }
        .tarea {
            background-color: #ffffff;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Lista de Tareas</h1>
    <input type="text" id="nueva" placeholder="Nueva tarea">
    <button id="anadir">Añadir</button>
    <ul id="lista"></ul>

    <script>
        const input = document.getElementById('nueva');
        const button = document.getElementById('anadir');
        const lista = document.getElementById('lista');

        button.addEventListener('click', () => {
            const tareaTexto = input.value.trim();
            if (tareaTexto !== '') {
                const li = document.createElement('li');
                li.className = 'tarea';
                li.textContent = tareaTexto;
                lista.appendChild(li);
                input.value = '';
            }
        });
    </script>
</body>
</html>
