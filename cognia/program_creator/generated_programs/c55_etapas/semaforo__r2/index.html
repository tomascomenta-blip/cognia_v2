<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Simulation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #traffic-light {
            width: 200px;
            height: 300px;
            border: 2px solid #ccc;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background-color: #fff;
        }
        #luz {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #808080; /* Neutral grey */
        }
        #avanzar {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #808080; /* Neutral grey */
            color: #fff;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="traffic-light">
        <div id="luz" data-color="rojo"></div>
        <button id="avanzar">Advance</button>
    </div>

    <script>
        const colors = ['red', 'green', 'yellow'];
        let currentIndex = 0;

        function changeColor() {
            const luz = document.getElementById('luz');
            luz.style.backgroundColor = colors[currentIndex];
            currentIndex = (currentIndex + 1) % colors.length;
        }

        document.getElementById('avanzar').addEventListener('click', changeColor);

        // Initial color on load
        changeColor();

        // Auto-advance every 3 seconds
        setInterval(changeColor, 3000);
    </script>
</body>
</html>
