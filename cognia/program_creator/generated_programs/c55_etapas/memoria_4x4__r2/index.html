<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un juego de memoria 4x4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 0;
        }
        #game-container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-gap: 10px;
            margin: 20px 0;
        }
        .tile {
            width: 100px;
            height: 100px;
            background-color: #80cbc4;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.8)"/></svg>');
            background-size: cover;
        }
        .tile.flipped {
            transform: rotateY(180deg);
            background-image: none;
        }
        .tile.matched {
            background-color: #4caf50;
        }
        #controls {
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #moves {
            font-size: 20px;
            margin-right: 10px;
            font-weight: bold;
        }
        #reset-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Un juego de memoria 4x4</h1>
    <div id="controls">
        <span id="moves">0</span>
        <button id="reset-button">Reiniciar</button>
    </div>
    <div id="game-container"></div>

    <script>
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        const tiles = emojis.concat(emojis).sort(() => Math.random() - 0.5);
        let flippedCards = [];
        let moves = 0;
        let matchFound = false;

        const gameContainer = document.getElementById('game-container');
        const movesCounter = document.getElementById('moves');
        const resetButton = document.getElementById('reset-button');

        function createTile(index) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.dataset.index = index;
            tile.dataset.emoji = tiles[index];
            tile.addEventListener('click', flipTile);
            gameContainer.appendChild(tile);
        }

        function flipTile() {
            if (matchFound || flippedCards.length === 2 || this.classList.contains('flipped')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesCounter.textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [firstCard, secondCard] = flippedCards;
            if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
            } else {
                matchFound = true;
                setTimeout(() => {
                    firstCard.classList.remove('flipped');
                    secondCard.classList.remove('flipped');
                    matchFound = false;
                }, 1000);
            }

            flippedCards = [];
        }

        function resetGame() {
            moves = 0;
            movesCounter.textContent = moves;
            gameContainer.innerHTML = '';
            tiles.sort(() => Math.random() - 0.5);
            for (let i = 0; i < tiles.length; i++) {
                createTile(i);
            }
        }

        resetButton.addEventListener('click', resetGame);

        for (let i = 0; i < tiles.length; i++) {
            createTile(i);
        }
    </script>
</body>
</html>
