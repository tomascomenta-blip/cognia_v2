<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Minimalista</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        #calculadora {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 300px;
            padding: 20px;
        }
        #pantalla {
            background-color: #e0e0e0;
            border-radius: 5px;
            width: 100%;
            height: 80px; /* Increased height for better visibility */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px; /* Increased font size for better visibility */
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .tecla {
            background-color: #f0f0f0;
            border: none;
            border-radius: 5px;
            width: calc(33.33% - 5px);
            height: 50px;
            font-size: 20px;
            margin: 5px;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        .tecla:hover {
            background-color: #d0d0d0;
        }
        .tecla:active {
            background-color: #c0c0c0;
        }
        .tecla[data-t="="] {
            background-color: #ffcc00;
            color: white;
        }
        .tecla[data-t="="]:hover {
            background-color: #ff9900;
        }
        .tecla[data-t="="]:active {
            background-color: #ff6600;
        }
    </style>
</head>
<body>
    <div id="calculadora">
        <div id="pantalla">0</div>
        <div>
            <button class="tecla" data-t="2">2</button>
            <button class="tecla" data-t="3">3</button>
            <button class="tecla" data-t="+">+</button>
        </div>
        <div>
            <button class="tecla" data-t="=">=</button>
        </div>
    </div>

    <script>
        let pantalla = document.getElementById('pantalla');
        let teclas = document.querySelectorAll('.tecla');
        let currentValue = 0;
        let operator = '';
        let nextValue = 0;

        function updatePantalla(value) {
            pantalla.textContent = value;
        }

        teclas.forEach(tecla => {
            tecla.addEventListener('click', () => {
                let valor = tecla.getAttribute('data-t');
                if (valor === '=') {
                    if (operator === '+') {
                        currentValue = currentValue + nextValue;
                    }
                    updatePantalla(currentValue);
                } else if (valor === '+') {
                    operator = valor;
                    currentValue = parseFloat(pantalla.textContent);
                    nextValue = 0;
                } else {
                    nextValue = parseFloat(valor);
                    updatePantalla(nextValue);
                }
            });
        });

        // Auto-click simulation for demonstration
        setTimeout(() => {
            teclas[0].click(); // Press 2
            setTimeout(() => {
                teclas[2].click(); // Press +
                setTimeout(() => {
                    teclas[1].click(); // Press 3
                    setTimeout(() => {
                        teclas[3].click(); // Press =
                    }, 1000);
                }, 1000);
            }, 1000);
        }, 1000);
    </script>
</body>
</html>
