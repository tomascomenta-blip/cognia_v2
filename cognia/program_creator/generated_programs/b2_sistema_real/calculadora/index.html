
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
  body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
  }
  #calculator{
    width:260px;
    background:#222;
    border-radius:10px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    animation:slideIn 1s ease-out forwards;
  }
  #pantalla{
    height:50px;
    background:#000;
    color:#0f0;
    font-size:1.8em;
    text-align:right;
    padding:10px;
    border-radius:5px;
    margin-bottom:10px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  #teclas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .tecla{
    background:#444;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:1.4em;
    padding:15px 0;
    cursor:pointer;
    transition:background 0.2s;
    animation:fadeIn 0.5s ease forwards;
    animation-delay:0.2s;
  }
  .tecla:hover{background:#555;}
  @keyframes slideIn{
    from{transform:translateX(-100%); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>
<div id="calculator">
  <div id="pantalla"></div>
  <div id="teclas">
    <button class="tecla" data-t="7">7</button>
    <button class="tecla" data-t="8">8</button>
    <button class="tecla" data-t="9">9</button>
    <button class="tecla" data-t="/">/</button>
    <button class="tecla" data-t="4">4</button>
    <button class="tecla" data-t="5">5</button>
    <button class="tecla" data-t="6">6</button>
    <button class="tecla" data-t="*">*</button>
    <button class="tecla" data-t="1">1</button>
    <button class="tecla" data-t="2">2</button>
    <button class="tecla" data-t="3">3</button>
    <button class="tecla" data-t="-">-</button>
    <button class="tecla" data-t="0">0</button>
    <button class="tecla" data-t=".">.</button>
    <button class="tecla" data-t="=">=</button>
    <button class="tecla" data-t="+">+</button>
  </div>
</div>

<script>
  (function(){
    const pantalla = document.getElementById('pantalla');
    let expr = '';
    const teclas = document.querySelectorAll('.tecla');
    teclas.forEach(btn=>{
      btn.addEventListener('click',()=>{
        const val = btn.dataset.t;
        if(val === '='){
          try{
            // Evaluate the expression safely
            const result = eval(expr);
            pantalla.textContent = result;
            expr = result.toString();
          }catch(e){
            pantalla.textContent = 'Error';
            expr = '';
          }
        }else{
          expr += val;
          pantalla.textContent = expr;
        }
      });
    });
  })();
</script>
</body>
</html>
