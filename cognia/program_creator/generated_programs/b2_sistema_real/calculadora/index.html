<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><title>Calculadora y Dashboard</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;background:#f0f0f0;}
#summary,#chart,#table{background:#fff;padding:10px;margin:5px;}
#pantalla{border:1px solid #000;padding:5px;font-size:1.2em;}
.tecla{display:inline-block;width:30px;height:30px;margin:2px;background:#ddd;text-align:center;line-height:30px;}
.tecla.active{background:#bbb;}
svg{width:100%;height:200px;}
.grid line{stroke:#ccc;}
.bar{fill:#4caf50;transition:height 1s;}
</style>
</head>
<body>
<div id="summary"><div id="pantalla">0</div></div>
<div id="chart"><svg id="chartSvg" width="400" height="200"></svg></div>
<div id="table"><table id="detailTable"><tr><th>Item</th><th>Valor</th></tr></table></div>
<div id="buttons">
  <button class="tecla" data-t="2">2</button>
  <button class="tecla" data-t="+">+</button>
  <button class="tecla" data-t="3">3</button>
  <button class="tecla" data-t="=">=</button>
</div>
<script>
let p = document.getElementById('pantalla'),
    t = document.querySelectorAll('.tecla'),
    d = ['2', '+', '3', '='],
    i = 0,
    calc = 0,
    op = null,
    opv = 0,
    prev = 0;

function press(v) {
  if (v === '=') {
    if (op) {
      const current = parseInt(p.textContent, 10);
      const result = op(opv, current);
      const change = result - prev;
      p.textContent = result;
      p.style.color = change >= 0 ? 'green' : 'red';
      prev = result;
      op = null;
      opv = 0;
    }
  } else if (v === '+' || v === '-') {
    opv = parseInt(p.textContent, 10);
    op = (v === '+') ? ((a, b) => a + b) : ((a, b) => a - b);
  } else {
    p.textContent = v;
    p.style.color = 'black';
  }
}

t.forEach(btn => btn.addEventListener('click', () => press(btn.dataset.t)));

setTimeout(() => {
  if (i < d.length) {
    press(d[i]);
    i++;
    setTimeout(arguments.callee, 500);
  }
}, 500);

const data = [12, 7, 9, 15, 4],
      svg = document.getElementById('chartSvg'),
      h = svg.height.baseVal.value,
      w = svg.width.baseVal.value;

svg.innerHTML = '<g class="grid">' +
  data.map((v, j) => `<line x1="0" y1="${h - 20 * j}" x2="${w}" y2="${h - 20 * j}"></line>`).join('') +
  '</g><g class="bars">' +
  data.map((v, j) => `<rect class="bar" x="${j * 80 + 10}" y="${h}" width="60" height="0" data-t="${v}"></rect>`).join('') +
  '</g>';

// Add Y‑axis labels
for (let j = 0; j <= 10; j++) {
  const y = h - 20 * j;
  const label = j * 5;
  svg.innerHTML += `<text x="5" y="${y - 5}" font-size="10" fill="black">${label}</text>`;
}

setTimeout(() => {
  document.querySelectorAll('.bar').forEach(r => {
    const v = parseInt(r.dataset.t, 10);
    r.setAttribute('y', h - 20 * v);
    r.setAttribute('height', 20 * v);
  });
}, 200);

const tbl = document.getElementById('detailTable');
data.forEach((v, i) => {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>Dato ${i + 1}</td><td>${v.toLocaleString()}</td>`;
  tbl.appendChild(tr);
});
</script>
</body>
</html>
