
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista de tareas</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:linear-gradient(120deg,#f6d365,#fda085);
    background-size:400% 400%;
    animation:gradientBG 15s ease infinite;
  }
  @keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  h1{
    color:#fff;
    text-align:center;
    margin-bottom:20px;
    animation:slideIn 1s ease-out;
  }
  @keyframes slideIn{
    0%{transform:translateX(-100%);opacity:0;}
    100%{transform:translateX(0);opacity:1;}
  }
  #nueva{
    width:70%;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:4px;
  }
  #anadir{
    padding:10px 20px;
    font-size:16px;
    margin-left:10px;
    border:none;
    background:#4CAF50;
    color:#fff;
    border-radius:4px;
    cursor:pointer;
  }
  #anadir:hover{background:#45a049;}
  ul{list-style:none;padding:0;margin-top:20px;}
  .tarea{
    background:#fff;
    margin:5px 0;
    padding:10px;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
</style>
</head>
<body>
<h1>Lista de tareas</h1>
<input type="text" id="nueva" placeholder="Nueva tarea">
<button id="anadir">Añadir</button>
<ul id="lista"></ul>
<script>
  document.getElementById('anadir').addEventListener('click', function(){
    const input = document.getElementById('nueva');
    const text = input.value.trim();
    if(text){
      const li = document.createElement('li');
      li.textContent = text;
      li.className = 'tarea';
      document.getElementById('lista').appendChild(li);
      input.value = '';
    }
  });
</script>
</body>
</html>
