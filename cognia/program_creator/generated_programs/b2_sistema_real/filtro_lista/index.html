<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Filtro de Lista y Dashboard</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;background:#f0f0f0}
section{margin:10px 0;width:90%;max-width:600px;background:#fff;padding:10px;border-radius:5px}
h2{margin:0 0 5px;font-size:1.2em}
#chart{overflow:hidden;border:1px solid #ddd}
svg{width:100%;height:200px}
.bar{fill:#4caf50}
.item{cursor:pointer}
.item.selected{background-color:#e0e0e0}
#chart.toggled{border:2px solid #000}
</style>
</head>
<body>
<section id="summary"><h2>Resumen</h2><p id="total">Total: 0</p></section>
<section id="chart"><h2>Gráfico</h2><button id="refresh">Refresh</button><svg id="svg"></svg></section>
<section id="detail"><h2>Detalle</h2><input id="buscar" placeholder="Buscar fruta"><ul id="list"></ul></section>
<script>
const fruits=['manzana','banana','cereza','datil','kiwi','uva'];
const list=document.getElementById('list');
const buscar=document.getElementById('buscar');
const total=document.getElementById('total');
const svg=document.getElementById('svg');
const chartSection=document.getElementById('chart');
const refreshBtn=document.getElementById('refresh');
let data=fruits.map(()=>Math.floor(Math.random()*10)+1);
let prevData=data.slice();

function renderList(){
  const query=buscar.value.trim().toLowerCase();
  list.innerHTML='';
  fruits.forEach(f=>{
    const li=document.createElement('li');
    li.className='item';
    li.textContent=f;
    if(!query || f.toLowerCase().includes(query)){
      if(query=='' && f=='cereza') return; // hide 'cereza' initially
      list.appendChild(li);
    }
    li.addEventListener('click',()=>{li.classList.toggle('selected');});
  });
}
function updateTotal(newTotal, prevTotal){
  total.textContent='Total: '+newTotal;
  total.style.color = (newTotal>=prevTotal?'green':'red');
}
function renderChart(){
  svg.innerHTML='';
  const w=svg.clientWidth,h=svg.clientHeight,max=Math.max(...data),steps=5,stepY=h/steps;
  for(let i=0;i<=steps;i++){
    const y=i*stepY,val=max-i*(max/steps);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',0);l.setAttribute('y1',y);l.setAttribute('x2',w);l.setAttribute('y2',y);
    l.setAttribute('stroke','#ccc');l.setAttribute('stroke-width','0.5');
    svg.appendChild(l);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',-5);t.setAttribute('y',y+4);t.setAttribute('text-anchor','end');t.setAttribute('font-size','10');
    t.textContent=Math.round(val);
    svg.appendChild(t);
  }
  const barW=w/(data.length*1.5);
  data.forEach((v,i)=>{
    const barH=v/max*h;
    const x=(i+0.5)*barW*1.5;
    const y=h-barH;
    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x',x);rect.setAttribute('y',y);rect.setAttribute('width',barW);rect.setAttribute('height',barH);
    const change=v-prevData[i];
    rect.setAttribute('fill', change>=0?'green':'red');
    svg.appendChild(rect);
  });
}
function animate(){
  prevData=data.slice();
  const prevTotal=data.reduce((a,b)=>a+b,0);
  data=data.map(v=>v+Math.floor(Math.random()*3));
  const newTotal=data.reduce((a,b)=>a+b,0);
  renderChart();
  updateTotal(newTotal, prevTotal);
}
buscar.addEventListener('input',renderList);
refreshBtn.addEventListener('click',()=>{chartSection.classList.toggle('toggled');});
renderList();
const initialTotal=data.reduce((a,b)=>a+b,0);
updateTotal(initialTotal,0);
renderChart();
setInterval(animate,2000);
</script>
</body>
</html>
