<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Filtro de Lista con Gráfico y Tabla Dinámica</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#333;}
  header{background:#0063a6;color:#fff;padding:1rem;text-align:center;}
  section{padding:1rem;background:#fff;margin:1rem auto;max-width:800px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
  #summary{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;}
  #chart{width:100%;height:250px;overflow:hidden;}
  #list{margin-top:1rem;}
  #list input{width:100%;padding:.5rem;font-size:1rem;border:1px solid #ccc;border-radius:4px;}
  #list ul{list-style:none;padding:0;margin-top:.5rem;}
  #list li{padding:.5rem;border-bottom:1px solid #eee;}
  #list li.hidden{display:none;}
  #table{margin-top:1rem;}
  #table table{width:100%;border-collapse:collapse;font-size:0.9rem;}
  #table th,#table td{padding:.5rem;text-align:left;border-bottom:1px solid #ddd;}
  #table th{background:#0063a6;color:#fff;}
  .positive{color:#006300;}
  .negative{color:#d03b3b;}
  @media(max-width:600px){
    #summary{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<header>
  <h1>Filtro de Lista con Gráfico y Tabla Dinámica</h1>
</header>

<section id="summary">
  <div>Total visibles: <span id="visibleCount">5</span></div>
  <div>Valor aleatorio: <span id="randomValue">0.00</span></div>
</section>

<section id="chart">
  <svg id="chartSvg" viewBox="0 0 800 250" preserveAspectRatio="none"></svg>
</section>

<section id="list">
  <input type="text" id="buscar" placeholder="Buscar fruta...">
  <ul>
    <li class="item">manzana</li>
    <li class="item">banana</li>
    <li class="item">cereza</li>
    <li class="item">datil</li>
    <li class="item">kiwi</li>
  </ul>
</section>

<section id="table">
  <table id="fruitTable">
    <thead>
      <tr>
        <th>Fruta</th>
        <th>Precio</th>
        <th>Cambio</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
/* ---------- Objetos de datos ---------- */
class DataGenerator {
  constructor() {
    this.min = 0;
    this.max = 100;
  }
  random() {
    return Math.random() * (this.max - this.min) + this.min;
  }
  randomPrice() {
    return (Math.random() * 10 + 1).toFixed(2);
  }
  randomChange() {
    return (Math.random() * 4 - 2).toFixed(2); // -2 to +2
  }
}

/* ---------- Gráfico SVG ---------- */
class Chart {
  constructor(svg, dataGen) {
    this.svg = svg;
    this.dataGen = dataGen;
    this.values = Array(10).fill(0);
    this.maxPoints = 10;
    this.update();
  }
  update() {
    this.values.shift();
    this.values.push(this.dataGen.random());
    this.draw();
  }
  draw() {
    const w = 800, h = 250;
    const padding = 40;
    const maxVal = Math.max(...this.values);
    const minVal = Math.min(...this.values);
    const yScale = (val) => h - padding - ((val - minVal) / (maxVal - minVal || 1)) * (h - 2 * padding);
    const xStep = (w - 2 * padding) / (this.maxPoints - 1);

    // Clear
    this.svg.innerHTML = '';

    // Gridlines
    const gridLines = 5;
    for (let i = 0; i <= gridLines; i++) {
      const y = padding + i * (h - 2 * padding) / gridLines;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', padding);
      line.setAttribute('y1', y);
      line.setAttribute('x2', w - padding);
      line.setAttribute('y2', y);
      line.setAttribute('stroke', '#e0e0e0');
      line.setAttribute('stroke-width', '1');
      this.svg.appendChild(line);
    }

    // Y-axis labels
    for (let i = 0; i <= gridLines; i++) {
      const y = padding + i * (h - 2 * padding) / gridLines;
      const val = maxVal - i * (maxVal - minVal) / gridLines;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', padding - 10);
      text.setAttribute('y', y + 4);
      text.setAttribute('text-anchor', 'end');
      text.setAttribute('font-size', '10');
      text.textContent = val.toFixed(1);
      this.svg.appendChild(text);
    }

    // Path
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    let d = '';
    this.values.forEach((v, i) => {
      const x = padding + i * xStep;
      const y = yScale(v);
      d += (i === 0 ? 'M' : 'L') + x + ' ' + y + ' ';
    });
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#0063a6');
    path.setAttribute('stroke-width', '2');
    this.svg.appendChild(path);
  }
}

/* ---------- Tabla de frutas ---------- */
class FruitTable {
  constructor(tbody, dataGen) {
    this.tbody = tbody;
    this.dataGen = dataGen;
    this.fruits = ['manzana', 'banana', 'cereza', 'datil', 'kiwi'];
    this.update();
  }
  update() {
    this.tbody.innerHTML = '';
    this.fruits.forEach(fruit => {
      const tr = document.createElement('tr');
      const price = parseFloat(this.dataGen.randomPrice());
      const change = parseFloat(this.dataGen.randomChange());
      const color = change >= 0 ? 'positive' : 'negative';
      const arrow = change >= 0 ? '▲' : '▼';
      tr.innerHTML = `
        <td>${fruit}</td>
        <td style="text-align:right">${price.toLocaleString('es-ES', {style:'currency',currency:'EUR'})}</td>
        <td class="${color}" style="text-align:right">${arrow} ${Math.abs(change).toFixed(2)}</td>
      `;
      this.tbody.appendChild(tr);
    });
  }
}

/* ---------- Filtro de lista ---------- */
class FilterList {
  constructor(input, list) {
    this.input = input;
    this.list = list;
    this.items = Array.from(list.querySelectorAll('.item'));
    this.input.addEventListener('input', () => this.filter());
  }
  filter() {
    const val = this.input.value.toLowerCase();
    this.items.forEach(li => {
      const text = li.textContent.toLowerCase();
      li.classList.toggle('hidden', !text.includes(val));
    });
    // Update visible count
    const visible = this.items.filter(li => !li.classList.contains('hidden')).length;
    document.getElementById('visibleCount').textContent = visible;
  }
}

/* ---------- Inicialización ---------- */
document.addEventListener('DOMContentLoaded', () => {
  const dataGen = new DataGenerator();

  // Summary random value
  const randomValueEl = document.getElementById('randomValue');
  setInterval(() => {
    randomValueEl.textContent = dataGen.random().toFixed(2);
  }, 1000);

  // Chart
  const chart = new Chart(document.getElementById('chartSvg'), dataGen);
  setInterval(() => chart.update(), 1000);

  // Table
  const table = new FruitTable(document.querySelector('#fruitTable tbody'), dataGen);
  setInterval(() => table.update(), 3000);

  // Filter list
  new FilterList(document.getElementById('buscar'), document.querySelector('#list ul'));
});
</script>
</body>
</html>
