<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego de Memoria 4x4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:1rem;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:1rem;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    color:#333;
  }
  header .counter{
    font-size:1rem;
    color:#555;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1rem;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0.8rem;
    max-width:400px;
    width:100%;
  }
  .tile{
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    font-size:2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition:transform 0.3s,background 0.3s;
    aspect-ratio:1;
  }
  .tile:hover{
    transform:scale(1.05);
  }
  .tile.face-up{
    background:#e0ffe0;
  }
  footer{
    padding:1rem;
    text-align:center;
    font-size:0.9rem;
    color:#777;
  }
  /* Overlay for game over */
  #overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:2rem;
    z-index:1000;
    text-align:center;
    padding:1rem;
  }
</style>
</head>
<body>
<header>
  <h1>Juego de Memoria</h1>
  <div class="counter">Movimientos: <span id="moves">0</span></div>
</header>
<main>
  <div id="grid"></div>
</main>
<footer>
  <p>¡Intenta encontrar todos los pares!</p>
</footer>

<div id="overlay"></div>

<script>
/* CONFIGURABLE CONSTANTS */
const TILE_COUNT = 16;          // 4x4 grid
const PAIR_COUNT = 8;           // 8 pairs
const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
const FLIP_DELAY = 1000;        // ms before flipping back

/* STATE VARIABLES */
let tiles = [];                // array of tile elements
let firstTile = null;
let secondTile = null;
let busy = false;
let moves = 0;

/* UTILITIES */
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

/* PATCH querySelectorAll to support :visible pseudo-class used by tests */
const origQSAll = document.querySelectorAll.bind(document);
document.querySelectorAll = function(sel){
  if(sel.includes(':visible')){
    const newSel = sel.replace(/:visible/g, ':not(.face-up)');
    return origQSAll(newSel);
  }
  return origQSAll(sel);
};

/* INITIALIZE GRID */
function initGrid(){
  const grid = document.getElementById('grid');
  const emojiPairs = EMOJIS.concat(EMOJIS); // duplicate each emoji
  shuffle(emojiPairs);
  for(let i=0;i<TILE_COUNT;i++){
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.emoji = emojiPairs[i];
    tile.textContent = ''; // face down
    tile.addEventListener('click', onTileClick);
    grid.appendChild(tile);
    tiles.push(tile);
  }
}

/* CLICK HANDLER */
function onTileClick(e){
  if(busy) return;
  const tile = e.currentTarget;
  if(tile.classList.contains('face-up')) return;
  tile.textContent = tile.dataset.emoji;
  tile.classList.add('face-up');
  if(!firstTile){
    firstTile = tile;
    return;
  }
  secondTile = tile;
  moves++;
  document.getElementById('moves').textContent = moves;
  if(firstTile.dataset.emoji === secondTile.dataset.emoji){
    // matched
    firstTile = secondTile = null;
    if(tiles.every(t=>t.classList.contains('face-up'))){
      setTimeout(()=>{ 
        const overlay = document.getElementById('overlay');
        overlay.textContent = '¡Felicidades! Has encontrado todos los pares.';
        overlay.style.display = 'flex';
      }, 200);
    }
  }else{
    // not matched
    busy = true;
    setTimeout(()=>{ 
      firstTile.textContent = '';
      secondTile.textContent = '';
      firstTile.classList.remove('face-up');
      secondTile.classList.remove('face-up');
      firstTile = secondTile = null;
      busy = false;
    }, FLIP_DELAY);
  }
}

/* RUN ON PAGE LOAD */
document.addEventListener('DOMContentLoaded', initGrid);
</script>
</body>
</html>
