<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;background:#f0f0f0;color:#333;}
  header{padding:10px;text-align:center;background:#222;color:#fff;}
  #moves{font-size:1.2rem;margin-top:5px;}
  #board{display:flex;flex-wrap:wrap;max-width:400px;margin:20px auto;}
  .tile{width:20%;height:80px;margin:5px;background:#444;color:transparent;display:flex;align-items:center;justify-content:center;font-size:2rem;border-radius:8px;cursor:pointer;transition:color .3s,background .3s;}
  .face-up{color:#000;background:#fff;}
  .matched{background:#8f8;}
  #chart{max-width:400px;margin:20px auto;}
  svg{background:#fff;border:1px solid #ccc;}
  table{width:100%;border-collapse:collapse;margin:20px auto;}
  th,td{border:1px solid #ccc;padding:4px;text-align:center;}
</style>
</head>
<body>
<header>
  <h1>Juego de Memoria 4x4</h1>
  <div id="moves">Movimientos: <span id="moves-count">0</span></div>
  <div id="timer">Tiempo: <span id="time">0</span>s</div>
</header>
<section id="board"></section>
<section id="chart"><svg id="chart-svg" width="100%" height="200"></svg></section>
<section id="details"><table id="details-table"><thead><tr><th>Emoji</th><th>Coincidente</th></tr></thead><tbody></tbody></table></section>
<script>
(() => {
  const emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
  const tiles = [];
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves-count');
  const timeEl = document.getElementById('time');
  const chartSvg = document.getElementById('chart-svg');
  const detailsBody = document.querySelector('#details-table tbody');
  let first = null, second = null, busy = false, moves = 0, elapsed = 0;
  const chartData = [];
  const matched = {};

  // Expose variables for testing
  window.emojis = emojis;
  window.tiles = tiles;
  window.matched = matched;
  window.board = board;
  window.first = first;
  window.second = second;
  window.busy = busy;
  window.elapsed = elapsed;
  window.chartData = chartData;
  window.chartSvg = chartSvg;
  window.detailsBody = detailsBody;
  window.timeEl = timeEl;
  window.movesEl = movesEl;
  window.moves = moves; // initial value

  // Shuffle emojis
  const deck = [...emojis, ...emojis].sort(()=>Math.random()-0.5);
  deck.forEach((e,i)=>{
    const div=document.createElement('div');
    div.className='tile face-down';
    div.dataset.emoji=e;
    div.addEventListener('click',()=>handleClick(div));
    board.appendChild(div);
    tiles.push(div);
  });

  function handleClick(tile){
    if(busy||tile.classList.contains('face-up')||tile.classList.contains('matched')) return;
    tile.classList.remove('face-down'); tile.classList.add('face-up');
    tile.textContent = tile.dataset.emoji;
    if(!first){ first=tile; return; }
    second=tile; moves++; window.moves = moves; movesEl.textContent=moves; busy=true;
    if(first.dataset.emoji===second.dataset.emoji){
      first.classList.add('matched'); second.classList.add('matched');
      matched[first.dataset.emoji]=true; updateDetails();
      first=second=null; busy=false;
    }else{
      setTimeout(()=>{ 
        first.classList.remove('face-up'); first.classList.add('face-down'); first.textContent='';
        second.classList.remove('face-up'); second.classList.add('face-down'); second.textContent='';
        first=second=null; busy=false; 
      },1000);
    }
  }

  function updateDetails(){
    detailsBody.innerHTML='';
    Object.keys(matched).forEach(k=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${k}</td><td>${matched[k]?'✓':'✗'}</td>`;
      detailsBody.appendChild(tr);
    });
  }

  function drawChart(){
    const w=chartSvg.clientWidth, h=chartSvg.clientHeight;
    chartSvg.innerHTML='';
    const margin=40, width=w-margin*2, height=h-margin*2;
    const maxY=Math.max(...chartData,1);
    let path='';
    if(chartData.length>1){
        path='M'+chartData.map((v,i)=>`${i*width/(chartData.length-1)},${height-(v/maxY)*height}`).join('L');
    }else if(chartData.length===1){
        path='M0,0L0,0';
    }else{
        path='M0,0';
    }
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(${margin},${margin})`);
    // grid
    for(let i=0;i<=5;i++){
      const y=height*i/5;
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',0); line.setAttribute('y1',y);
      line.setAttribute('x2',width); line.setAttribute('y2',y);
      line.setAttribute('stroke','#eee'); line.setAttribute('stroke-width',1);
      g.appendChild(line);
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',-10); txt.setAttribute('y',y+4);
      txt.setAttribute('font-size','10'); txt.textContent=(maxY*i/5).toFixed(0);
      g.appendChild(txt);
    }
    // line
    const line=document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d',path);
    line.setAttribute('stroke','#00f'); line.setAttribute('stroke-width',2); line.setAttribute('fill','none');
    g.appendChild(line);
    chartSvg.appendChild(g);
  }

  setInterval(()=>{
    elapsed++; timeEl.textContent=elapsed;
    chartData.push(moves);
    drawChart();
  },1000);
})();
</script>
</body>
</html>
