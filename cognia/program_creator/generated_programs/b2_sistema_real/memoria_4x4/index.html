<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria 4x4</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
        }
        #moves {
            margin: 20px;
            font-size: 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-gap: 10px;
        }
        .tile {
            width: 100px;
            height: 100px;
            background-color: #e0f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .tile.flipped {
            transform: rotateY(180deg);
        }
        .tile.back {
            background-color: #b2ebf2;
        }
        .tile.front {
            background-color: #e0f7fa;
        }
    </style>
</head>
<body>
    <div id="moves">Movimientos: 0</div>
    <div class="grid" id="grid"></div>

    <script>
        class MemoryGame {
            constructor(gridElement, movesElement) {
                this.gridElement = gridElement;
                this.movesElement = movesElement;
                this.moves = 0;
                this.grid = [];
                this.selectedTiles = [];
                this.emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
                this.emojis = this.emojis.concat(this.emojis);
                this.shuffle(this.emojis);
                this.initBoard();
            }

            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            initBoard() {
                for (let i = 0; i < 16; i++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile', 'back');
                    tile.dataset.emoji = this.emojis[i];
                    tile.addEventListener('click', () => this.handleClick(tile));
                    this.gridElement.appendChild(tile);
                    this.grid.push(tile);
                }
            }

            handleClick(tile) {
                if (this.selectedTiles.length === 2 || tile.classList.contains('flipped')) {
                    return;
                }

                tile.classList.remove('back');
                tile.classList.add('flipped', 'front');
                this.selectedTiles.push(tile);

                if (this.selectedTiles.length === 2) {
                    this.checkMatch();
                }
            }

            checkMatch() {
                const [tile1, tile2] = this.selectedTiles;
                this.moves++;
                this.movesElement.textContent = `Movimientos: ${this.moves}`;

                if (tile1.dataset.emoji !== tile2.dataset.emoji) {
                    setTimeout(() => {
                        tile1.classList.remove('flipped', 'front');
                        tile1.classList.add('back');
                        tile2.classList.remove('flipped', 'front');
                        tile2.classList.add('back');
                        this.selectedTiles = [];
                    }, 1000);
                } else {
                    this.selectedTiles = [];
                }
            }
        }

        const movesElement = document.getElementById('moves');
        const gridElement = document.getElementById('grid');
        const game = new MemoryGame(gridElement, movesElement);
    </script>
</body>
</html>
