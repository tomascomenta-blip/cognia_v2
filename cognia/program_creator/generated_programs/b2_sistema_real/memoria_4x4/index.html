<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego de Memoria 4x4</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
header{background:#4a90e2;color:#fff;padding:10px;text-align:center;}
header h1{margin:0;font-size:2rem;animation:slideIn 1s ease-out;}
#moves{font-weight:bold;}
section{padding:10px;}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:auto;}
.tile{background:#333;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:transform .3s;transform-style:preserve-3d;aspect-ratio:1/1;}
.tile.down{background:#333;}
.tile.up{background:#fff;color:#333;}
#chart{width:100%;height:200px;background:#fff;border:1px solid #ccc;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ccc;padding:4px;text-align:center;}
@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}
</style>
</head>
<body>
<header>
<h1>Juego de Memoria 4x4</h1>
<p>Movimientos: <span id="moves">0</span></p>
</header>

<section id="board"></section>

<section>
<h2>Gráfico de Movimientos</h2>
<svg id="chart"></svg>
</section>

<section>
<h2>Detalle de Cartas</h2>
<table id="detail"><thead><tr><th>#</th><th>Emoji</th><th>Estado</th></tr></thead><tbody></tbody></table>
</section>

<script>
const emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
const tiles=[];
const board=document.getElementById('board');
const movesSpan=document.getElementById('moves');
const detailBody=document.querySelector('#detail tbody');
const chart=document.getElementById('chart');
let first=null,second=null,lock=false,moves=0;
const chartData=[];

// Shuffle emojis and create tiles
const deck=emojis.concat(emojis).sort(()=>Math.random()-0.5);
deck.forEach((e,i)=>{
  const div=document.createElement('div');
  div.className='tile down';
  div.dataset.emoji=e;
  div.dataset.idx=i;
  div.addEventListener('click',()=>handleClick(div));
  board.appendChild(div);
  tiles.push(div);
});

function handleClick(tile){
  if(lock||tile.classList.contains('up')) return;
  tile.classList.remove('down');tile.classList.add('up');
  tile.textContent=tile.dataset.emoji;
  if(!first){first=tile;updateDetail();return;}
  second=tile;lock=true;
  moves++;movesSpan.textContent=moves;
  updateDetail();
  if(first.dataset.emoji===second.dataset.emoji){
    first=null;second=null;lock=false;
  }else{
    setTimeout(()=>{first.classList.remove('up');first.classList.add('down');first.textContent='';
                    second.classList.remove('up');second.classList.add('down');second.textContent='';
                    first=null;second=null;lock=false;updateDetail();},1000);
  }
}

function updateDetail(){
  detailBody.innerHTML='';
  tiles.forEach(t=>{const tr=document.createElement('tr');
    tr.innerHTML=`<td>${t.dataset.idx}</td><td>${t.dataset.emoji}</td><td>${t.classList.contains('up')?'Arriba':'Abajo'}</td>`;
    detailBody.appendChild(tr);
  });
}

// Chart animation
function drawChart(){
  const w=chart.clientWidth;const h=chart.clientHeight;
  const maxY=Math.max(...chartData,1);
  const stepY=h/(maxY+1);
  const stepX=w/(chartData.length-1||1);
  let path='';
  chartData.forEach((v,i)=>{path+=`${i*stepX},${h-v*stepY} `;});
  // Y axis labels
  const ticks=5;
  const tickValues=[];
  for(let i=0;i<=ticks;i++){
    tickValues.push(Math.round(maxY*i/ticks));
  }
  let yLabels='';
  tickValues.forEach(v=>{
    const y=h-v*stepY;
    yLabels+=`<text x="5" y="${y+5}" font-size="10" fill="#000">${v}</text>`;
  });
  chart.innerHTML=`<rect width="100%" height="100%" fill="#fff"/>${yLabels}<g transform="translate(0,${h}) scale(1,-1)">
    <polyline fill="none" stroke="#4a90e2" stroke-width="2" points="${path.trim()}"/>
    <g stroke="#ccc"><!-- gridlines --></g>
  </g>`;
}
setInterval(()=>{chartData.push(moves);drawChart();},1000);
</script>
</body>
</html>
