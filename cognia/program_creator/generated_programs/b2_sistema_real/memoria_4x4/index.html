<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }
  header{
    width:100%;
    text-align:center;
    padding:1rem 0;
    background:#333;
    color:#fff;
    font-size:1.5rem;
  }
  #moves{
    font-weight:bold;
  }
  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    padding:1rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    max-width:400px;
    width:100%;
  }
  .tile{
    width:100%;
    padding-top:100%; /* square */
    position:relative;
    cursor:pointer;
    perspective:600px;
  }
  .tile-inner{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    transition:transform 0.6s;
    transform-style:preserve-3d;
  }
  .tile.face-up .tile-inner{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    width:100%; height:100%;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-size:2rem;
  }
  .face-front{
    background:#444;
    color:transparent;
  }
  .face-back{
    background:#fff;
    color:#000;
    transform:rotateY(180deg);
  }
  footer{
    width:100%;
    text-align:center;
    padding:0.5rem 0;
    background:#333;
    color:#fff;
    font-size:0.9rem;
  }
  #overlay{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.7);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    z-index:1000;
    display:none;
  }
</style>
</head>
<body>
<header>
  Intentos: <span id="moves">0</span>
</header>
<main>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <p>Juego de Memoria 4x4 con emojis de animales.</p>
</footer>
<div id="overlay">¡Has ganado!</div>
<script>
class Tile{
  constructor(id, emoji){
    this.id = id;
    this.emoji = emoji;
    this.isFlipped = false;
    this.isMatched = false;
    this.element = this.createElement();
  }
  createElement(){
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.id = this.id;
    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    const front = document.createElement('div');
    front.className = 'face face-front';
    const back = document.createElement('div');
    back.className = 'face face-back';
    back.textContent = this.emoji;
    inner.appendChild(front);
    inner.appendChild(back);
    tile.appendChild(inner);
    return tile;
  }
  flip(){
    if(this.isMatched || this.isFlipped) return;
    this.isFlipped = true;
    this.element.classList.add('face-up');
  }
  unflip(){
    if(this.isMatched || !this.isFlipped) return;
    this.isFlipped = false;
    this.element.classList.remove('face-up');
  }
  setMatched(){
    this.isMatched = true;
  }
}

class MemoryGame{
  constructor(){
    this.emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
    this.tiles = [];
    this.firstSelection = null;
    this.secondSelection = null;
    this.moves = 0;
    this.movesElement = document.getElementById('moves');
    this.gridElement = document.getElementById('grid');
    this.overlay = document.getElementById('overlay');
    this.overlayShown = false;
    this.init();
  }
  init(){
    const pairs = [...this.emojis, ...this.emojis];
    this.shuffle(pairs);
    pairs.forEach((emoji, idx)=>{
      const tile = new Tile(idx, emoji);
      this.tiles.push(tile);
      this.gridElement.appendChild(tile.element);
      tile.element.addEventListener('click', ()=>this.handleClick(tile));
    });
  }
  shuffle(array){
    for(let i=array.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [array[i],array[j]]=[array[j],array[i]];
    }
  }
  handleClick(tile){
    if(tile.isFlipped || tile.isMatched) return;
    tile.flip();
    if(!this.firstSelection){
      this.firstSelection = tile;
    }else{
      this.secondSelection = tile;
      this.moves++;
      this.updateMoves();
      if(this.firstSelection.emoji === this.secondSelection.emoji){
        this.firstSelection.setMatched();
        this.secondSelection.setMatched();
        this.resetSelection();
        if(this.tiles.every(t=>t.isMatched)){
          setTimeout(()=>this.showOverlay(), 500);
        }
      }else{
        setTimeout(()=>this.unflipBoth(), 1000);
      }
    }
  }
  unflipBoth(){
    this.firstSelection.unflip();
    this.secondSelection.unflip();
    this.resetSelection();
  }
  resetSelection(){
    this.firstSelection = null;
    this.secondSelection = null;
  }
  updateMoves(){
    this.movesElement.textContent = this.moves;
  }
  showOverlay(){
    if(this.overlayShown) return;
    this.overlayShown = true;
    this.overlay.style.display = 'flex';
  }
}

document.addEventListener('DOMContentLoaded',()=>new MemoryGame());
</script>
</body>
</html>
