<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contador Automático</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;background:#f0f0f0;}
  header,section,footer{width:90%;max-width:600px;margin:10px 0;background:#fff;padding:10px;border-radius:5px;}
  #valor{font-size:2em;color:#333;}
  button{margin:5px;padding:5px 10px;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #ddd;padding:4px;text-align:center;}
  .grid line{stroke:#eee;stroke-width:1;}
</style>
</head>
<body>
<header><span id="valor">0</span></header>
<section>
  <button id="mas">+</button>
  <button id="menos">-</button>
</section>
<section>
  <svg id="chart" width="100%" height="200"></svg>
</section>
<section>
  <table id="tabla"><thead><tr><th>Tiempo</th><th>Valor</th></tr></thead><tbody></tbody></table>
</section>
<script>
let val=0, datos=[0], t=0, prevVal=0;
const valor=document.getElementById('valor'),
      mas=document.getElementById('mas'),
      menos=document.getElementById('menos'),
      chart=document.getElementById('chart'),
      tabla=document.querySelector('#tabla tbody');

function update(){
  valor.textContent=val.toLocaleString('es-ES');
  const cambio=val-prevVal;
  valor.style.color = cambio>=0?'green':'red';
  prevVal=val;

  datos.push(val);
  t++;

  const max=Math.max(...datos), min=Math.min(...datos);
  const h=chart.clientHeight,w=chart.clientWidth;
  chart.innerHTML='';
  const yScale=d=>h-((d-min)/(max-min||1))*h;
  const xScale=i=>w*(i/(datos.length-1||1));

  chart.innerHTML+=`<g class="grid">${datos.map((_,i)=>`<line x1="${xScale(i)}" y1="0" x2="${xScale(i)}" y2="${h}"/>`).join('')}</g>`;
  chart.innerHTML+=`<g class="grid">${[min,max].map(v=>`<line x1="0" y1="${yScale(v)}" x2="${w}" y2="${yScale(v)}"/>`).join('')}</g>`;
  chart.innerHTML+=`<polyline fill="none" stroke="steelblue" stroke-width="2" points="${datos.map((d,i)=>`${xScale(i)},${yScale(d)}`).join(' ')}"/>`;
  chart.innerHTML+=`<text x="0" y="${yScale(min)}" dy="3" font-size="10">${min.toLocaleString('es-ES')}</text>`;
  chart.innerHTML+=`<text x="0" y="${yScale(max)}" dy="3" font-size="10">${max.toLocaleString('es-ES')}</text>`;

  const tr=document.createElement('tr');
  const tdTime=document.createElement('td');
  tdTime.textContent=t;
  const tdVal=document.createElement('td');
  tdVal.textContent=val.toLocaleString('es-ES');
  tdVal.style.color = cambio>=0?'green':'red';
  tr.append(tdTime,tdVal);
  tabla.appendChild(tr);
}

mas.onclick=e=>{val++;update();};
menos.onclick=e=>{if(val>0){val--;update();}};

setTimeout(()=>{setInterval(()=>{val++;update();},1000);},3000);
update();
</script>
</body>
</html>
