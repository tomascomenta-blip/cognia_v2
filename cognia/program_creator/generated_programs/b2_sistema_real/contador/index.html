<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contador Animado</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  .section{padding:1rem;background:#fff;margin:1rem auto;max-width:600px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
  .summary{font-size:2rem;text-align:center;}
  .buttons{display:flex;justify-content:center;margin-top:.5rem;}
  button{margin:0 .5rem;padding:.5rem 1rem;font-size:1rem;}
  .chart{overflow:auto;}
  svg{width:100%;height:200px;}
  .grid{stroke:#e0e0e0;stroke-width:1;}
  .bar{fill:#4caf50;}
  .axis{fill:#000;font-size:10px;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #ddd;padding:.5rem;text-align:center;}
  th{background:#eee;}
</style>
</head>
<body>
<div class="section summary"><span id="valor">0</span></div>
<div class="section buttons"><button id="mas">+</button><button id="menos">-</button></div>
<div class="section chart"><svg id="chart"></svg></div>
<div class="section"><table id="table"><thead><tr><th>Hora</th><th>Valor</th></tr></thead><tbody></tbody></table></div>
<script>
  const valorEl=document.getElementById('valor');
  const mas=document.getElementById('mas');
  const menos=document.getElementById('menos');
  const chart=document.getElementById('chart');
  const tbody=document.querySelector('#table tbody');
  let value=0;
  const history=[];
  function updateDisplay(){valorEl.textContent=value.toLocaleString();}
  function add(delta){value=Math.max(0,value+delta);updateDisplay();record();}
  function record(){const now=new Date();history.push({time:now,value});if(history.length>20)history.shift();drawChart();drawTable();}
  function drawChart(){const w=chart.clientWidth;const h=chart.clientHeight;const max=Math.max(...history.map(d=>d.value),1);const barW= w/(history.length+1);chart.innerHTML='';const gridLines=5;for(let i=0;i<=gridLines;i++){const y=h*(i/gridLines);chart.innerHTML+=`<line class="grid" x1="0" y1="${y}" x2="${w}" y2="${y}"/>`;chart.innerHTML+=`<text class="axis" x="0" y="${y+3}">${(max*(gridLines-i)/gridLines).toFixed(0)}</text>`;}history.forEach((d,i)=>{const barHeight=h*(d.value/max);const x=barW*i+barW/2;chart.innerHTML+=`<rect class="bar" x="${x}" y="${h-barHeight}" width="${barW*0.8}" height="${barHeight}"/>`;});}
  function drawTable(){tbody.innerHTML='';history.forEach(d=>{tbody.innerHTML+=`<tr><td>${d.time.toLocaleTimeString()}</td><td>${d.value.toLocaleString()}</td></tr>`;});}
  mas.onclick=()=>add(1);
  menos.onclick=()=>add(-1);
  setInterval(()=>add(1),1000);
  updateDisplay();record();
</script>
</body>
</html>
