<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador Animado</title>
<style>
  body {font-family: Arial, sans-serif; margin:0; padding:0; background:#fafafa; color:#333;}
  .container {max-width:800px; margin:0 auto; padding:1rem;}
  h1, h2 {text-align:center;}
  #summary {display:flex; flex-direction:column; align-items:center; margin-bottom:1rem;}
  #valor {font-size:3rem; font-weight:bold; margin:0.5rem 0;}
  button {padding:0.5rem 1rem; margin:0.2rem; font-size:1rem; cursor:pointer;}
  button:focus {outline:none;}
  #chart {margin-bottom:1rem;}
  #chartSvg {width:100%; height:300px; background:#fff; border:1px solid #ddd;}
  #details {margin-bottom:1rem;}
  #detailTable {width:100%; border-collapse:collapse;}
  #detailTable th, #detailTable td {border:1px solid #ddd; padding:0.5rem; text-align:center;}
  #detailTable th {background:#f5f5f5;}
  #ascii pre {background:#eee; padding:1rem; font-family:monospace; white-space:pre-wrap; word-wrap:break-word;}
  @media (max-width:600px){#valor{font-size:2rem;} button{font-size:0.9rem;}}
</style>
</head>
<body>
<div class="container">
  <header><h1>Contador Animado</h1></header>

  <section id="summary">
    <h2>Resumen</h2>
    <p>Valor actual: <span id="valor">0</span></p>
    <button id="mas">+</button>
    <button id="menos">-</button>
  </section>

  <section id="chart">
    <h2>Gráfico de valores</h2>
    <svg id="chartSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  </section>

  <section id="details">
    <h2>Detalle de valores</h2>
    <table id="detailTable">
      <thead><tr><th>#</th><th>Valor</th><th>Hora</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="ascii">
    <h2>ASCII Art</h2>
    <pre>
  _______
 |  ___  |
 | |   | |
 | |   | |
 | |___| |
 |_______|
    </pre>
  </section>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const valorSpan = document.getElementById('valor');
  const masBtn = document.getElementById('mas');
  const menosBtn = document.getElementById('menos');
  const chartSvg = document.getElementById('chartSvg');
  const detailTableBody = document.querySelector('#detailTable tbody');

  let counter = 0;
  let direction = 1; // 1 = up, -1 = down
  const data = [];
  const maxDataPoints = 20;
  let manualIncrement = true; // skip first auto tick

  function formatNumber(num) { return num.toLocaleString('es-ES'); }

  function updateDisplay() {
    valorSpan.textContent = formatNumber(counter);
    valorSpan.style.color = direction === 1 ? 'green' : 'red';
  }

  function addDataPoint(value) {
    const timestamp = new Date();
    data.push({ value, timestamp });
    if (data.length > maxDataPoints) data.shift();
  }

  function updateChart() {
    const min = 0;
    const max = Math.max(...data.map(d => d.value), 1);
    const yScale = (max - min) === 0 ? 0 : 100 / (max - min);
    const barWidth = 100 / data.length;
    const ticks = 5;
    const tickValues = [];
    for (let i = 0; i <= ticks; i++) {
      tickValues.push(min + i * (max - min) / ticks);
    }

    chartSvg.innerHTML = '';

    tickValues.forEach(tick => {
      const y = 100 - (tick - min) * yScale;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', '0'); line.setAttribute('y1', y);
      line.setAttribute('x2', '100'); line.setAttribute('y2', y);
      line.setAttribute('stroke', '#e0e0e0'); line.setAttribute('stroke-width', '0.5');
      chartSvg.appendChild(line);

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', '0'); text.setAttribute('y', y);
      text.setAttribute('text-anchor', 'end'); text.setAttribute('dy', '0.35em');
      text.setAttribute('font-size', '0.8em');
      text.textContent = formatNumber(tick);
      chartSvg.appendChild(text);
    });

    data.forEach((d, i) => {
      const barHeight = (d.value - min) * yScale;
      const y = 100 - barHeight;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', i * barWidth + barWidth * 0.1);
      rect.setAttribute('y', y);
      rect.setAttribute('width', barWidth * 0.8);
      rect.setAttribute('height', barHeight);
      rect.setAttribute('fill', '#4caf50');
      chartSvg.appendChild(rect);
    });
  }

  function updateTable() {
    detailTableBody.innerHTML = '';
    // compute changes relative to previous value
    const changes = [];
    for (let i = 0; i < data.length; i++) {
      if (i === 0) changes.push(0);
      else changes.push(data[i].value - data[i - 1].value);
    }
    data.slice().reverse().forEach((d, idx) => {
      const tr = document.createElement('tr');
      const tdIndex = document.createElement('td'); tdIndex.textContent = idx + 1;
      const tdValue = document.createElement('td'); tdValue.textContent = formatNumber(d.value);
      const tdTime = document.createElement('td'); tdTime.textContent = d.timestamp.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      // color based on change
      const change = changes[data.length - 1 - idx];
      tdValue.style.color = change > 0 ? 'green' : (change < 0 ? 'red' : '#333');
      tr.appendChild(tdIndex); tr.appendChild(tdValue); tr.appendChild(tdTime);
      detailTableBody.appendChild(tr);
    });
  }

  function autoUpdate() {
    if (manualIncrement) {
      manualIncrement = false;
    } else {
      if (direction === 1) {
        counter++;
      } else {
        if (counter > 0) counter--; else direction = 1;
      }
    }
    addDataPoint(counter);
    updateDisplay();
    updateChart();
    updateTable();
  }

  masBtn.addEventListener('click', () => {
    counter++; direction = 1;
    manualIncrement = true;
    addDataPoint(counter);
    updateDisplay(); updateChart(); updateTable();
  });

  menosBtn.addEventListener('click', () => {
    if (counter > 0) {
      counter--; direction = -1;
      manualIncrement = true;
      addDataPoint(counter);
      updateDisplay(); updateChart(); updateTable();
    }
  });

  // Initial frame
  addDataPoint(counter);
  updateDisplay();
  updateChart();
  updateTable();

  setInterval(autoUpdate, 1000);
});
</script>
</body>
</html>
