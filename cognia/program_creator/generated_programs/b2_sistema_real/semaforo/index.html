<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo y Dashboard</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;}
  header, main{max-width:800px;margin:auto;padding:10px;}
  #summary{display:flex;flex-wrap:wrap;gap:10px;}
  #summary p{background:#fff;padding:5px 10px;border-radius:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  #chart{width:100%;height:200px;background:#fff;border:1px solid #ccc;border-radius:5px;}
  #table-container{margin-top:20px;overflow-x:auto;}
  #data-table{width:100%;border-collapse:collapse;}
  #data-table th,#data-table td{border:1px solid #ccc;padding:5px;text-align:center;}
  #luz{width:60px;height:180px;border-radius:10px;margin:20px auto;position:relative;}
  #luz[data-color="rojo"]{background:red;}
  #luz[data-color="verde"]{background:green;}
  #luz[data-color="ambar"]{background:orange;}
  #avanzar{padding:10px 20px;font-size:1rem;cursor:pointer;}
  pre{background:#000;color:#0f0;padding:10px;border-radius:5px;overflow:auto;}
</style>
</head>
<body>
<header>
  <h1>Semáforo y Dashboard</h1>
  <div id="summary">
    <p>Visitas: 0</p>
    <p>Último valor: 0</p>
    <p>Tiempo: 00:00:00</p>
    <p>Datos totales: 0</p>
    <p>Media: 0.00</p>
  </div>
</header>

<main>
  <div id="luz" data-color="rojo"></div>
  <button id="avanzar">Avanzar semáforo</button>

  <svg id="chart"></svg>

  <div id="table-container">
    <table id="data-table">
      <thead><tr><th>Hora</th><th>Valor</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <pre id="ascii-art">
     _____
    |     |
    |  R  |
    |  G  |
    |  Y  |
    |_____|
  </pre>
</main>

<script>
const colors = ["rojo","verde","ambar"];
let colorIndex = 0;
const luz = document.getElementById('luz');
const avanzarBtn = document.getElementById('avanzar');
const summary = document.getElementById('summary');
const chartSvg = document.getElementById('chart');
const tableBody = document.querySelector('#data-table tbody');
let counter = 0;
const data = [];
const maxDataPoints = 20;

function updateData() {
  counter++;
  const now = new Date();
  data.push({time: now, value: counter});
  if (data.length > maxDataPoints) data.shift();
  updateSummary();
  updateChart();
  updateTable();
}

function updateSummary() {
  const last = data[data.length-1];
  const avg = data.reduce((sum, d)=>sum+d.value,0)/data.length;
  summary.innerHTML = `
    <p>Visitas: ${counter.toLocaleString()}</p>
    <p>Último valor: ${last.value.toLocaleString()}</p>
    <p>Tiempo: ${last.time.toLocaleTimeString()}</p>
    <p>Datos totales: ${data.length}</p>
    <p>Media: ${avg.toFixed(2)}</p>
  `;
}

function updateChart() {
  const width = chartSvg.clientWidth;
  const height = chartSvg.clientHeight;
  const padding = 40;
  const innerWidth = width - 2*padding;
  const innerHeight = height - 2*padding;
  const values = data.map(d=>d.value);
  const minVal = Math.min(...values);
  const maxVal = Math.max(...values);
  const yScale = y => padding + innerHeight - ((y - minVal)/(maxVal - minVal || 1) * innerHeight);
  const xScale = i => padding + (i/(data.length-1||1))*innerWidth;

  chartSvg.innerHTML = '';

  // Gridlines and Y labels
  const gridLines = 5;
  for(let i=0;i<=gridLines;i++){
    const y = padding + i*(innerHeight/gridLines);
    const val = maxVal - i*((maxVal-minVal)/gridLines);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',padding);
    line.setAttribute('y1',y);
    line.setAttribute('x2',width-padding);
    line.setAttribute('y2',y);
    line.setAttribute('stroke','#e0e0e0');
    line.setAttribute('stroke-width','1');
    chartSvg.appendChild(line);
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x',5);
    text.setAttribute('y',y+5);
    text.setAttribute('font-size','10');
    text.textContent = val.toFixed(0);
    chartSvg.appendChild(text);
  }

  // Axes
  const xAxis = document.createElementNS('http://www.w3.org/2000/svg','line');
  xAxis.setAttribute('x1',padding);
  xAxis.setAttribute('y1',height-padding);
  xAxis.setAttribute('x2',width-padding);
  xAxis.setAttribute('y2',height-padding);
  xAxis.setAttribute('stroke','#000');
  xAxis.setAttribute('stroke-width','1');
  chartSvg.appendChild(xAxis);

  const yAxis = document.createElementNS('http://www.w3.org/2000/svg','line');
  yAxis.setAttribute('x1',padding);
  yAxis.setAttribute('y1',padding);
  yAxis.setAttribute('x2',padding);
  yAxis.setAttribute('y2',height-padding);
  yAxis.setAttribute('stroke','#000');
  yAxis.setAttribute('stroke-width','1');
  chartSvg.appendChild(yAxis);

  // Path
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  let d = '';
  data.forEach((dpt,i)=>{
    const x = xScale(i);
    const y = yScale(dpt.value);
    d += `${i===0?'M':'L'}${x},${y} `;
  });
  path.setAttribute('d',d);
  path.setAttribute('fill','none');
  path.setAttribute('stroke','steelblue');
  path.setAttribute('stroke-width','2');
  chartSvg.appendChild(path);
}

function updateTable() {
  const rows = data.map(d=>{
    const time = d.time.toLocaleTimeString();
    const val = d.value.toLocaleString();
    return `<tr><td>${time}</td><td>${val}</td></tr>`;
  }).join('');
  tableBody.innerHTML = rows;
}

function cycleColor() {
  colorIndex = (colorIndex+1)%colors.length;
  luz.setAttribute('data-color',colors[colorIndex]);
}

avanzarBtn.addEventListener('click',cycleColor);
setInterval(updateData,1000);
setInterval(cycleColor,3000);
window.addEventListener('resize', updateChart);
updateData();
</script>
</body>
</html>
