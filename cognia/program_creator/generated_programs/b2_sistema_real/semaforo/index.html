<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo y Gráfica</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;background:#f0f0f0;}
  header{padding:1rem;text-align:center;}
  #luz{width:80px;height:80px;border-radius:50%;margin:1rem auto;background:red;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;}
  #luz[data-color="rojo"]{background:red;}
  #luz[data-color="verde"]{background:green;}
  #luz[data-color="ambar"]{background:orange;}
  #avanzar{padding:0.5rem 1rem;margin:1rem;cursor:pointer;}
  section{width:90%;max-width:600px;margin:1rem 0;}
  svg{width:100%;height:200px;background:white;border:1px solid #ccc;}
  table{width:100%;border-collapse:collapse;}
  th,td{border:1px solid #ccc;padding:4px;text-align:right;}
</style>
</head>
<body>
<header><h1>Semáforo y Gráfica</h1></header>
<section id="control"><div id="luz" data-color="rojo"></div><button id="avanzar">Avanzar</button></section>
<section id="chart"><svg id="chartSvg"></svg></section>
<section id="table"><table><thead><tr><th>Índice</th><th>Valor</th></tr></thead><tbody id="tableBody"></tbody></table></section>
<script>
document.addEventListener('DOMContentLoaded', function(){
  // Semáforo
  var luz = document.getElementById('luz');
  var avanzarBtn = document.getElementById('avanzar');
  var colors = ['rojo','verde','ambar'];
  var idx = 0;
  function setColor(c){ luz.setAttribute('data-color', c); }
  setColor(colors[idx]);

  avanzarBtn.addEventListener('click', function(){
    idx = (idx + 1) % colors.length;
    setColor(colors[idx]);
  });

  setInterval(function(){
    idx = (idx + 1) % colors.length;
    setColor(colors[idx]);
  }, 3000);

  // Gráfica
  var data = [];
  var maxPoints = 20;
  var svg = document.getElementById('chartSvg');
  var tableBody = document.getElementById('tableBody');

  function update(){
    var val = Math.floor(Math.random()*1000)+1;
    data.push(val);
    if(data.length > maxPoints) data.shift();
    draw();
    updateTable();
  }

  function draw(){
    var w = svg.clientWidth;
    var h = svg.clientHeight;
    var min = Math.min.apply(null, data);
    var max = Math.max.apply(null, data);
    var range = max - min || 1;
    var points = data.map(function(v,i){
      var x = i/(maxPoints-1)*w;
      var y = h - (v-min)/range*h;
      return {x: x, y: y};
    });
    var path = 'M' + points.map(function(p){ return p.x + ',' + p.y; }).join(' L');
    svg.innerHTML = '';
    for(var i=0;i<=5;i++){
      var y = i/5*h;
      svg.innerHTML += '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="#eee" stroke-width="1"/>';
    }
    for(var i=0;i<=5;i++){
      var y = i/5*h;
      var val = min + range*i/5;
      svg.innerHTML += '<text x="0" y="'+(y+4)+'" font-size="10" fill="#333">'+val.toLocaleString()+'</text>';
    }
    svg.innerHTML += '<path d="'+path+'" fill="none" stroke="steelblue" stroke-width="2"/>';
  }

  function updateTable(){
    tableBody.innerHTML = '';
    for(var i=0;i<data.length;i++){
      var tr = document.createElement('tr');
      var tdIndex = document.createElement('td');
      tdIndex.textContent = i;
      var tdValue = document.createElement('td');
      tdValue.textContent = data[i].toLocaleString();
      var prev = data[i-1];
      var change = prev !== undefined ? data[i] - prev : 0;
      tdValue.style.color = change >= 0 ? 'green' : 'red';
      tr.appendChild(tdIndex);
      tr.appendChild(tdValue);
      tableBody.appendChild(tr);
    }
  }

  update();
  setInterval(update, 2000);
});
</script>
</body>
</html>
