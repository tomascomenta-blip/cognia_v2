<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:400px;margin:auto;}
.celda{width:100%;padding:5px;font-size:1em;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1"><input class="celda" data-ref="A2"><input class="celda" data-ref="A3">
<input class="celda" data-ref="B1"><input class="celda" data-ref="B2"><input class="celda" data-ref="B3">
<input class="celda" data-ref="C1"><input class="celda" data-ref="C2"><input class="celda" data-ref="C3">
</div>
<script>
let computing=false;
function evaluate(ref,vis,vals){
 if(vis.has(ref)) return 'CIRC';
 if(vals[ref]!==undefined) return vals[ref];
 vis.add(ref);
 const el=document.querySelector(`.celda[data-ref="${ref}"]`);
 const formula=el.dataset.formula;
 if(!formula){vis.delete(ref);vals[ref]=el.value||'0';return vals[ref];}
 const expr=formula.slice(1);
 let cycle=false;
 const repl=expr.replace(/[A-C][1-3]/g,m=>{
  const v=evaluate(m,vis,vals);
  if(v==='CIRC'){cycle=true;return 'NaN';}
  return v;
 });
 let res;
 try{res=eval(repl);}catch{res='CIRC';}
 vis.delete(ref);
 if(cycle) res='CIRC';
 vals[ref]=res==='CIRC'?'CIRC':String(res);
 return vals[ref];
}
function recompute(){
 const vals={};
 const refs=[...document.querySelectorAll('.celda')].map(e=>e.dataset.ref);
 refs.forEach(r=>evaluate(r,new Set(),vals));
 refs.forEach(r=>{
  const el=document.querySelector(`.celda[data-ref="${r}"]`);
  el.value=vals[r];
 });
}
document.querySelectorAll('.celda').forEach(e=>{
 e.addEventListener('input',e=>{
  if(computing)return;
  const val=e.target.value;
  if(val.startsWith('=')) e.target.dataset.formula=val;
  else delete e.target.dataset.formula;
  computing=true;
  recompute();
  computing=false;
 });
});
</script>
</body>
</html>
