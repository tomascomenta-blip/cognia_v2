
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:#e0e0e0;
    animation:bgColor 1s ease forwards;
  }
  .products{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .prod{
    background:#fff;
    border:1px solid #ccc;
    padding:10px 15px;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:200px;
    opacity:0;
    animation:slideIn 0.5s ease forwards;
  }
  .prod:nth-child(1){animation-delay:0s;}
  .prod:nth-child(2){animation-delay:0.2s;}
  .prod:nth-child(3){animation-delay:0.4s;}
  .add{
    padding:5px 10px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:3px;
    cursor:pointer;
  }
  .add:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  .cart{
    margin-top:30px;
    padding-top:15px;
    border-top:2px solid #333;
    opacity:0;
    animation:fadeIn 0.5s ease forwards;
    animation-delay:0.6s;
  }
  .linea{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
    opacity:0;
    animation:fadeIn 0.3s ease forwards;
  }
  .linea.removing{
    animation:fadeOut 0.3s ease forwards;
  }
  .quitar{
    padding:3px 6px;
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:3px;
    cursor:pointer;
  }
  #total{
    font-weight:bold;
  }
  @keyframes slideIn{
    from{transform:translateX(-100%); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  @keyframes fadeOut{
    from{opacity:1;}
    to{opacity:0;}
  }
  @keyframes bgColor{
    from{background:#e0e0e0;}
    to{background:#fff;}
  }
</style>
</head>
<body>
  <h1>Carrito de Compra</h1>
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <span>Producto 1 - $100 (Stock: 2)</span>
      <button class="add" data-id="p1">Add</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <span>Producto 2 - $50 (Stock: 3)</span>
      <button class="add" data-id="p2">Add</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <span>Producto 3 - $25 (Stock: 1)</span>
      <button class="add" data-id="p3">Add</button>
    </div>
  </div>

  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div>Total: $<span id="total">0</span></div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const cart = {}; // {id:{qty,price,stock}}
  const addBtns = document.querySelectorAll('.add');
  const linesContainer = document.getElementById('lines');
  const totalEl = document.getElementById('total');

  // Initialize cart data from products
  addBtns.forEach(btn=>{
    const id = btn.dataset.id;
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    cart[id] = {
      qty:0,
      price:parseInt(prod.dataset.precio,10),
      stock:parseInt(prod.dataset.stock,10)
    };
  });

  // Add button click
  addBtns.forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.id;
      const item = cart[id];
      if(item.qty < item.stock){
        item.qty++;
        updateLine(id);
        updateAddButton(id);
        updateTotal();
      }
    });
  });

  // Quitar button via event delegation
  linesContainer.addEventListener('click',e=>{
    if(e.target.classList.contains('quitar')){
      const id = e.target.dataset.id;
      const item = cart[id];
      if(item.qty > 0){
        item.qty--;
        if(item.qty===0){
          removeLine(id);
        }else{
          updateLine(id);
        }
        updateAddButton(id);
        updateTotal();
      }
    }
  });

  function updateLine(id){
    const item = cart[id];
    let line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
    if(!line){
      line = document.createElement('div');
      line.className='linea';
      line.dataset.id=id;
      line.innerHTML = `<span class="cant">${item.qty}</span> <button class="quitar" data-id="${id}">-</button>`;
      linesContainer.appendChild(line);
      // Remove 'new' class after animation
      line.addEventListener('animationend',function handler(){
        line.classList.remove('new');
        line.removeEventListener('animationend',handler);
      });
      line.classList.add('new');
    }else{
      line.querySelector('.cant').textContent = item.qty;
    }
  }

  function removeLine(id){
    const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
    if(line){
      line.classList.add('removing');
      line.addEventListener('animationend',function handler(){
        line.remove();
        line.removeEventListener('animationend',handler);
      });
    }
  }

  function updateAddButton(id){
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    const item = cart[id];
    btn.disabled = item.qty >= item.stock;
  }

  function updateTotal(){
    let sum = 0;
    Object.values(cart).forEach(item=>{
      sum += item.qty * item.price;
    });
    totalEl.textContent = sum;
  }
});
</script>
</body>
</html>
