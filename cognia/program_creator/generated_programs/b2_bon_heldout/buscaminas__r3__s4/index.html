<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5 con minas fijas</title>
<style>
  body{font-family:sans-serif;margin:0;padding:20px;background:#fafafa;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:400px;margin:auto;}
  .c{background:#ccc;border:1px solid #777;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;}
  .c.abierta{background:#e0e0e0;pointer-events:none;}
  .c.bandera{background:#ffeb3b;}
  #estado{margin-top:10px;text-align:center;font-size:1.2rem;color:#d32f2f;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
(() => {
  const grid = document.getElementById('grid');
  const estado = document.getElementById('estado');
  const mines = [6,12,18];
  const total = 25;
  const cells = [];
  const counts = new Array(total).fill(0);

  // Crear las 25 celdas
  for(let i=0;i<total;i++){
    const div = document.createElement('div');
    div.className='c';
    div.dataset.i = i;
    grid.appendChild(div);
    cells.push(div);
  }

  // Obtener vecinos de una celda
  const getNeighbors = (i)=>{
    const neighbors=[];
    const row=Math.floor(i/5), col=i%5;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const r=row+dr, c=col+dc;
        if(r>=0&&r<5&&c>=0&&c<5){
          neighbors.push(r*5+c);
        }
      }
    }
    return neighbors;
  };

  // Calcular número de minas adyacentes
  for(let i=0;i<total;i++){
    const neigh=getNeighbors(i);
    let cnt=0;
    for(const n of neigh){
      if(mines.includes(n))cnt++;
    }
    counts[i]=cnt;
  }

  // Función para abrir una celda
  const openCell = (i)=>{
    const cell=cells[i];
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
    if(mines.includes(i)){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      return;
    }
    cell.classList.add('abierta');
    if(counts[i]>0)cell.textContent=counts[i];

    // Cascada si la celda tiene 0 minas adyacentes
    if(counts[i]===0){
      const queue=[i];
      const visited=new Set([i]);
      while(queue.length){
        const idx=queue.shift();
        const neigh=getNeighbors(idx);
        for(const n of neigh){
          if(visited.has(n))continue;
          const c=cells[n];
          if(c.classList.contains('bandera'))continue;
          c.classList.add('abierta');
          if(counts[n]>0)c.textContent=counts[n];
          visited.add(n);
          if(counts[n]===0)queue.push(n);
        }
      }
    }
  };

  // Añadir manejadores de eventos
  cells.forEach((cell,i)=>{
    cell.addEventListener('click',()=>openCell(i));
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(cell.classList.contains('abierta'))return;
      if(cell.classList.contains('bandera')){
        cell.classList.remove('bandera');
        cell.textContent='';
      }else{
        cell.classList.add('bandera');
        cell.textContent='🚩';
      }
    });
  });
})();
</script>
</body>
</html>
