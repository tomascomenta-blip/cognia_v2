<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f0f0f0;
  font-family:Arial,sans-serif;
}
#grid{
  display:grid;
  grid-template-columns:repeat(3,80px);
  gap:1px;
  padding:1px;
  background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
}
.celda{
  width:80px;
  height:30px;
  border:1px solid #ccc;
  background:#fff;
  color:#333;
  text-align:right;
  padding:5px;
  box-sizing:border-box;
  font-size:14px;
}
</style>
</head>
<body>
<div id="grid">
  <input type="text" class="celda" data-ref="A1" value="">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B1" value="">
  <input type="text" class="celda" data-ref="B2" value="">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C1" value="">
  <input type="text" class="celda" data-ref="C2" value="">
  <input type="text" class="celda" data-ref="C3" value="">
</div>
<script>
class Spreadsheet{
  constructor(){
    this.cells={};
    this.init();
  }
  init(){
    const inputs=document.querySelectorAll('.celda');
    inputs.forEach(inp=>{
      const ref=inp.dataset.ref;
      this.cells[ref]=inp;
      inp.dataset.formula=inp.value;
      inp.addEventListener('input',()=>{
        inp.dataset.formula=inp.value;
        this.recalculate();
      });
    });
    this.recalculate();
  }
  recalculate(){
    for(const ref in this.cells){
      const inp=this.cells[ref];
      const formula=inp.dataset.formula;
      if(formula && formula.startsWith('=')){
        const res=this.evaluate(ref,[]);
        inp.value=res;
      }else{
        inp.value=formula;
      }
    }
  }
  evaluate(ref,stack){
    if(stack.includes(ref)) return 'CIRC';
    const inp=this.cells[ref];
    const formula=inp.dataset.formula;
    if(!formula) return 0;
    if(!formula.startsWith('=')){
      const num=parseFloat(formula);
      return isNaN(num)?0:num;
    }
    stack.push(ref);
    let expr=formula.slice(1).replace(/\s+/g,'');
    const replaced=expr.replace(/[A-C][1-3]/g,match=>{
      const val=this.evaluate(match,stack);
      if(val==='CIRC') return 'NaN';
      return val;
    });
    if(replaced.includes('NaN')){
      stack.pop();
      return 'CIRC';
    }
    let result;
    try{
      result=eval(replaced);
    }catch(e){
      result='CIRC';
    }
    stack.pop();
    if(result===undefined||result===null||isNaN(result)) return 'CIRC';
    return result;
  }
}
document.addEventListener('DOMContentLoaded',()=>new Spreadsheet());
</script>
</body>
</html>
