<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:20px;background:#f9f9f9;color:#333;text-align:center;}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:8px;box-sizing:border-box;font-size:1rem;}
  .celda:focus{outline:2px solid #0066cc;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div id="grid">
  <input type="text" class="celda" data-ref="A1" value="">
  <input type="text" class="celda" data-ref="B1" value="">
  <input type="text" class="celda" data-ref="C1" value="">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="B2" value="">
  <input type="text" class="celda" data-ref="C2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C3" value="=A1+B1">
</div>

<script>
class Spreadsheet {
  constructor() {
    this.cells = new Map(); // ref -> input element
    this.formulas = new Map(); // ref -> formula string (without '=')
    this.values = new Map(); // ref -> computed numeric value or 'CIRC'
    this.init();
  }
  init() {
    const inputs = document.querySelectorAll('.celda');
    inputs.forEach(inp => {
      const ref = inp.dataset.ref;
      this.cells.set(ref, inp);
      // If initial value starts with '=', treat as formula
      if (inp.value.trim().startsWith('=')) {
        const formula = inp.value.trim().slice(1);
        this.formulas.set(ref, formula);
      }
      inp.addEventListener('input', () => this.onInput(ref));
    });
    this.recalculateAll();
  }
  onInput(ref) {
    const inp = this.cells.get(ref);
    const val = inp.value.trim();
    if (val.startsWith('=')) {
      this.formulas.set(ref, val.slice(1));
    } else {
      this.formulas.delete(ref);
    }
    this.recalculateAll();
  }
  recalculateAll() {
    this.values.clear();
    // Evaluate each cell
    for (const ref of this.cells.keys()) {
      this.evaluateCell(ref, new Set());
    }
    // Update display
    for (const [ref, inp] of this.cells.entries()) {
      if (this.formulas.has(ref)) {
        const val = this.values.get(ref);
        inp.value = (val === 'CIRC') ? 'CIRC' : this.formatNumber(val);
      } else {
        // Non-formula cells keep their typed value
        // But if the cell was previously a formula and now not, clear its value
        // (value already set by user)
      }
    }
  }
  evaluateCell(ref, visited) {
    if (this.values.has(ref)) return this.values.get(ref);
    if (visited.has(ref)) {
      this.values.set(ref, 'CIRC');
      return 'CIRC';
    }
    visited.add(ref);
    if (!this.formulas.has(ref)) {
      // Non-formula: parse numeric value
      const inp = this.cells.get(ref);
      const num = parseFloat(inp.value);
      const val = isNaN(num) ? 0 : num;
      this.values.set(ref, val);
      visited.delete(ref);
      return val;
    }
    const formula = this.formulas.get(ref);
    // Replace cell references with their evaluated values
    const expr = formula.replace(/[A-Z][1-3]/g, match => {
      const v = this.evaluateCell(match, visited);
      return (v === 'CIRC') ? '0' : v;
    });
    // Evaluate the arithmetic expression safely
    let result;
    try {
      // Only + and - are allowed, so eval is safe here
      result = Function(`'use strict';return (${expr})`)();
      if (typeof result !== 'number' || isNaN(result)) result = 0;
    } catch (e) {
      result = 0;
    }
    this.values.set(ref, result);
    visited.delete(ref);
    return result;
  }
  formatNumber(num) {
    return num.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new Spreadsheet();
});
</script>
</body>
</html>
