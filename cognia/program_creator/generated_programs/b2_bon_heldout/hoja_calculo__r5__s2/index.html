<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:90%;max-width:400px;}
  .celda{width:100%;padding:8px;font-size:1rem;box-sizing:border-box;border:1px solid #ccc;}
  .celda:focus{outline:none;border-color:#66afe9;background:#e6f7ff;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="1">
  <input class="celda" data-ref="A2" value="2">
  <input class="celda" data-ref="A3" value="3">
  <input class="celda" data-ref="B1" value="4">
  <input class="celda" data-ref="B2" value="5">
  <input class="celda" data-ref="B3" value="6">
  <input class="celda" data-ref="C1" value="7">
  <input class="celda" data-ref="C2" value="8">
  <input class="celda" data-ref="C3" value="=A1+A2">
</div>
<script>
(() => {
  const refs = ["A1","A2","A3","B1","B2","B3","C1","C2","C3"];
  const cells = {};
  refs.forEach(r => { cells[r] = document.querySelector(`input[data-ref="${r}"]`); });

  // Store initial formula for C3
  cells["C3"].dataset.formula = cells["C3"].value;

  function evaluateCell(ref, stack = []) {
    if (stack.includes(ref)) return "CIRC";
    const cell = cells[ref];
    const formula = cell.dataset.formula;
    if (!formula) return cell.value || "0";
    const expr = formula.slice(1); // remove leading '='
    const replaced = expr.replace(/([A-C][1-3])/g, (m) => {
      const val = evaluateCell(m, stack.concat(ref));
      if (val === "CIRC") return "CIRC";
      return val;
    });
    if (replaced.includes("CIRC")) return "CIRC";
    try {
      const result = Function('return ' + replaced)();
      return result.toString();
    } catch (e) {
      return "ERR";
    }
  }

  function recomputeAll() {
    refs.forEach(r => {
      const cell = cells[r];
      const val = evaluateCell(r);
      cell.value = val;
    });
  }

  refs.forEach(r => {
    const cell = cells[r];
    cell.addEventListener('change', () => {
      const val = cell.value;
      if (val.startsWith('=')) {
        cell.dataset.formula = val;
      } else {
        delete cell.dataset.formula;
      }
      recomputeAll();
    });
  });

  // Initial calculation
  recomputeAll();
})();
</script>
</body>
</html>
