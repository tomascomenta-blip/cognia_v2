
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
  }
  .products{
    display:flex;
    gap:20px;
    margin-bottom:30px;
  }
  .prod{
    background:#fff;
    padding:15px;
    border:1px solid #ccc;
    width:150px;
    opacity:0;
    transform:translateX(-20px);
    animation:slideIn 0.5s forwards;
  }
  .prod:nth-child(1){animation-delay:0.2s;}
  .prod:nth-child(2){animation-delay:0.4s;}
  .prod:nth-child(3){animation-delay:0.6s;}
  @keyframes slideIn{
    from{opacity:0;transform:translateX(-20px);}
    to{opacity:1;transform:translateX(0);}
  }
  .cart{
    background:#fff;
    padding:15px;
    border:1px solid #ccc;
    width:300px;
    opacity:0;
    animation:fadeInCart 0.5s forwards;
    animation-delay:0.8s;
  }
  @keyframes fadeInCart{
    from{opacity:0;}
    to{opacity:1;}
  }
  .linea{
    display:flex;
    justify-content:space-between;
    margin-bottom:5px;
    opacity:0;
    animation:fadeIn 0.3s forwards;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  button{
    cursor:pointer;
    padding:3px 6px;
    font-size:0.9em;
  }
  button:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  #total{
    font-weight:bold;
  }
</style>
</head>
<body>

<div class="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <h3>Producto 1</h3>
    <p>Precio: 100</p>
    <p>Stock: 2</p>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <h3>Producto 2</h3>
    <p>Precio: 50</p>
    <p>Stock: 3</p>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <h3>Producto 3</h3>
    <p>Precio: 25</p>
    <p>Stock: 1</p>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<div class="cart">
  <h2>Carrito</h2>
  <div id="lines"></div>
  <p>Total: <span id="total">0</span></p>
</div>

<script>
  const cart = {}; // {id: quantity}
  const addButtons = document.querySelectorAll('.add');
  const linesContainer = document.getElementById('lines');
  const totalSpan = document.getElementById('total');

  function updateTotal(){
    let total = 0;
    for(const id in cart){
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseInt(prod.dataset.precio,10);
      total += cart[id] * price;
    }
    totalSpan.textContent = total;
  }

  function updateAddButton(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock,10);
    const qty = cart[id] || 0;
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    btn.disabled = qty >= stock;
  }

  function createLine(id){
    const line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;
    const cantSpan = document.createElement('span');
    cantSpan.className = 'cant';
    cantSpan.textContent = '1';
    const quitarBtn = document.createElement('button');
    quitarBtn.className = 'quitar';
    quitarBtn.dataset.id = id;
    quitarBtn.textContent = 'Quitar';
    quitarBtn.addEventListener('click', () => removeFromCart(id));
    line.appendChild(cantSpan);
    line.appendChild(quitarBtn);
    linesContainer.appendChild(line);
  }

  function addToCart(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock,10);
    const qty = cart[id] || 0;
    if(qty >= stock) return; // no more stock

    cart[id] = qty + 1;
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if(line){
      line.querySelector('.cant').textContent = cart[id];
    }else{
      createLine(id);
    }
    updateAddButton(id);
    updateTotal();
  }

  function removeFromCart(id){
    if(!cart[id]) return;
    cart[id] -= 1;
    if(cart[id] <= 0){
      delete cart[id];
      const line = document.querySelector(`.linea[data-id="${id}"]`);
      if(line) line.remove();
    }else{
      const line = document.querySelector(`.linea[data-id="${id}"]`);
      if(line) line.querySelector('.cant').textContent = cart[id];
    }
    updateAddButton(id);
    updateTotal();
  }

  addButtons.forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });
</script>
</body>
</html>
