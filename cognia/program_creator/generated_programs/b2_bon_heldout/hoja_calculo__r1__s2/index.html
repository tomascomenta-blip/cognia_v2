<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f0f0f0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    max-width:400px;
    width:100%;
  }
  input.celda{
    width:100%;
    padding:8px;
    font-size:1rem;
    box-sizing:border-box;
  }
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" />
  <input class="celda" data-ref="A2" />
  <input class="celda" data-ref="A3" />
  <input class="celda" data-ref="B1" value="=A1+1" />
  <input class="celda" data-ref="B2" />
  <input class="celda" data-ref="B3" />
  <input class="celda" data-ref="C1" value="=B1+1" />
  <input class="celda" data-ref="C2" />
  <input class="celda" data-ref="C3" value="=A1+A2" />
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = {};
  const inputs = document.querySelectorAll('.celda');
  inputs.forEach(input => {
    const ref = input.dataset.ref;
    cells[ref] = input;
  });

  function evaluate(ref, stack) {
    const cell = cells[ref];
    if (!cell) return 0;
    const formula = cell.dataset.formula;
    if (!formula) {
      const val = parseFloat(cell.value);
      return isNaN(val) ? 0 : val;
    }
    if (stack.has(ref)) {
      cell.value = 'CIRC';
      return 'CIRC';
    }
    stack.add(ref);
    const expr = formula.slice(1).replace(/[A-C][1-3]/g, match => {
      const val = evaluate(match, stack);
      return val === 'CIRC' ? 'NaN' : val;
    });
    let result;
    try {
      result = eval(expr);
    } catch (e) {
      result = 'CIRC';
    }
    stack.delete(ref);
    if (result === 'CIRC' || isNaN(result)) {
      cell.value = 'CIRC';
      return 'CIRC';
    } else {
      cell.value = result;
      return result;
    }
  }

  function recomputeAll() {
    Object.values(cells).forEach(cell => {
      if (cell.dataset.formula) {
        evaluate(cell.dataset.ref, new Set());
      }
    });
  }

  // Initialize formulas
  inputs.forEach(input => {
    if (input.value.startsWith('=')) {
      input.dataset.formula = input.value;
    } else {
      delete input.dataset.formula;
    }
  });

  recomputeAll();

  inputs.forEach(input => {
    input.addEventListener('input', () => {
      if (input.value.startsWith('=')) {
        input.dataset.formula = input.value;
      } else {
        delete input.dataset.formula;
      }
      recomputeAll();
    });
  });
});
</script>
</body>
</html>
