
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#fafafa;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,40px);
    gap:2px;
  }
  .c{
    width:40px;
    height:40px;
    border:1px solid #999;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    opacity:0;
    animation:fadeIn 0.5s ease forwards;
    animation-delay:calc(var(--i)*0.05s);
  }
  .abierta{
    background:#ddd;
    pointer-events:none;
  }
  .bandera{
    background:#f99;
  }
  #estado{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
  }
  @keyframes fadeIn{
    0%{opacity:0;transform:scale(0.8);}
    100%{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div id="grid">
  <!-- 25 cells -->
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>

<script>
  const cells = document.querySelectorAll('.c');
  const estado = document.getElementById('estado');
  const minePositions = [6,12,18];

  // Set CSS variable for animation delay
  cells.forEach(cell=>{
    cell.style.setProperty('--i', cell.dataset.i);
  });

  // Initialize cell data
  cells.forEach(cell=>{
    const i = parseInt(cell.dataset.i);
    cell.dataset.mine = minePositions.includes(i) ? 'true' : 'false';
    cell.dataset.opened = 'false';
    cell.dataset.flag = 'false';
  });

  // Helper to get neighbor indices
  function getNeighbors(i){
    const row = Math.floor(i/5);
    const col = i%5;
    const neigh=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=row+dr, nc=col+dc;
        if(nr>=0 && nr<5 && nc>=0 && nc<5){
          neigh.push(nr*5+nc);
        }
      }
    }
    return neigh;
  }

  // Precompute adjacent mine counts
  const counts = {};
  cells.forEach(cell=>{
    const i=parseInt(cell.dataset.i);
    if(cell.dataset.mine==='true') return;
    const neigh=getNeighbors(i);
    let cnt=0;
    neigh.forEach(n=>{ if(cells[n].dataset.mine==='true') cnt++;});
    counts[i]=cnt;
  });

  // Open a cell (non-mine)
  function openCell(i){
    const cell=cells[i];
    if(cell.dataset.opened==='true' || cell.dataset.flag==='true') return;
    cell.dataset.opened='true';
    cell.classList.add('abierta');
    const cnt=counts[i];
    if(cnt>0){
      cell.textContent=cnt;
    }else{
      // Cascade opening of zeros
      const stack=[i];
      while(stack.length){
        const cur=stack.pop();
        const neigh=getNeighbors(cur);
        neigh.forEach(n=>{
          const c=cells[n];
          if(c.dataset.opened==='false' && c.dataset.flag==='false'){
            c.dataset.opened='true';
            c.classList.add('abierta');
            const cCnt=counts[n];
            if(cCnt>0){
              c.textContent=cCnt;
            }else{
              stack.push(n);
            }
          }
        });
      }
    }
  }

  // Reveal a mine (used when game is lost)
  function revealMine(i){
    const cell=cells[i];
    cell.classList.add('abierta');
    cell.textContent='💣';
  }

  // Left click handler
  function handleLeft(e){
    e.preventDefault();
    const i=parseInt(e.currentTarget.dataset.i);
    const cell=e.currentTarget;
    if(cell.dataset.flag==='true') return;
    if(cell.dataset.mine==='true'){
      estado.textContent='perdiste';
      minePositions.forEach(pos=>revealMine(pos));
      // Disable further interactions
      cells.forEach(c=>{c.removeEventListener('click',handleLeft);c.removeEventListener('contextmenu',handleRight);});
      return;
    }
    openCell(i);
  }

  // Right click (flag) handler
  function handleRight(e){
    e.preventDefault();
    const cell=e.currentTarget;
    if(cell.dataset.opened==='true') return;
    if(cell.dataset.flag==='true'){
      cell.dataset.flag='false';
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.dataset.flag='true';
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }

  // Attach event listeners
  cells.forEach(cell=>{
    cell.addEventListener('click',handleLeft);
    cell.addEventListener('contextmenu',handleRight);
  });
</script>
</body>
</html>
