<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0; padding:0; display:flex; align-items:center; justify-content:center;
    height:100vh; background:#fafafa; font-family:Arial,Helvetica,sans-serif;
  }
  #grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    width:90%; max-width:400px;
  }
  .celda{
    width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;
    font-size:1rem; text-align:right; box-sizing:border-box;
  }
  .celda:focus{
    outline:none; border-color:#66afe9; box-shadow:0 0 5px rgba(102,175,233,.6);
  }
</style>
</head>
<body>
<div id="grid"></div>
<script>
(() => {
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  const cells = {};          // ref -> input element
  const formulas = {};       // ref -> formula string (without '=')
  const dependencies = {};   // ref -> array of refs it depends on
  const dependents = {};     // ref -> array of refs that depend on it

  // Create grid
  const grid = document.getElementById('grid');
  refs.forEach(ref => {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'celda';
    input.dataset.ref = ref;
    input.value = '';
    grid.appendChild(input);
    cells[ref] = input;
    dependencies[ref] = [];
    dependents[ref] = [];
    input.addEventListener('input', () => handleInput(ref));
  });

  // Utility to remove an element from an array
  function removeFromArray(arr, val) {
    const i = arr.indexOf(val);
    if (i > -1) arr.splice(i, 1);
  }

  // Evaluate a cell recursively, detecting cycles
  function evaluateCell(ref, stack) {
    if (stack.has(ref)) return 'CIRC';
    stack.add(ref);
    const formula = formulas[ref];
    if (!formula) {
      const val = cells[ref].value.trim();
      const num = parseFloat(val);
      stack.delete(ref);
      return isNaN(num) ? val : num;
    }
    // Replace references with their numeric values
    let expr = formula;
    const refsIn = expr.match(/[A-C][1-3]/g) || [];
    for (const r of refsIn) {
      const v = evaluateCell(r, stack);
      if (v === 'CIRC') { stack.delete(ref); return 'CIRC'; }
      const num = typeof v === 'number' ? v : parseFloat(v);
      if (isNaN(num)) { stack.delete(ref); return 'CIRC'; }
      expr = expr.split(r).join(num.toString());
    }
    const result = evalExpression(expr);
    stack.delete(ref);
    return result;
  }

  // Simple expression evaluator for + and -
  function evalExpression(expr) {
    let total = 0, num = '', sign = 1;
    for (let i = 0; i < expr.length; i++) {
      const ch = expr[i];
      if (ch === '+' || ch === '-') {
        if (num !== '') { total += sign * parseFloat(num); num = ''; }
        sign = ch === '+' ? 1 : -1;
      } else {
        num += ch;
      }
    }
    if (num !== '') total += sign * parseFloat(num);
    return total;
  }

  // Handle input changes
  function handleInput(ref) {
    const input = cells[ref];
    const content = input.value.trim();

    // Remove old dependencies
    dependencies[ref].forEach(dep => removeFromArray(dependents[dep], ref));
    dependencies[ref] = [];

    if (content.startsWith('=')) {
      const formula = content.slice(1).trim();
      formulas[ref] = formula;
      const deps = formula.match(/[A-C][1-3]/g) || [];
      dependencies[ref] = deps;
      deps.forEach(d => dependents[d].push(ref));
      const val = evaluateCell(ref, new Set());
      input.value = val === 'CIRC' ? 'CIRC' : val;
    } else {
      formulas[ref] = null;
      input.value = content;
    }

    // Recalculate dependents
    const queue = [...dependents[ref]];
    const visited = new Set();
    while (queue.length) {
      const dRef = queue.shift();
      if (visited.has(dRef)) continue;
      visited.add(dRef);
      const dInput = cells[dRef];
      const dVal = evaluateCell(dRef, new Set());
      dInput.value = dVal === 'CIRC' ? 'CIRC' : dVal;
      queue.push(...dependents[dRef]);
    }
  }
})();
</script>
</body>
</html>
