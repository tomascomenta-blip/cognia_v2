<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;height:40px;padding:5px;font-size:1rem;text-align:right;border:1px solid #ccc;border-radius:4px;background:#fff;}
  .celda:focus{outline:none;border-color:#4a90e2;}
</style>
</head>
<body>
<h2 style="text-align:center;">Mini Hoja de Cálculo 3x3</h2>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="B1" placeholder="B1">
  <input type="text" class="celda" data-ref="C1" placeholder="C1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C3" placeholder="C3" value="=A1+A2">
</div>

<script>
'use strict';
(function(){
  const cells = Array.from(document.querySelectorAll('.celda'));
  const refMap = {};
  cells.forEach(c=>{refMap[c.dataset.ref]=c;});

  function parseNumber(str){
    if(!str)return NaN;
    const cleaned = str.replace(/,/g,'');
    const n = parseFloat(cleaned);
    return isNaN(n)?NaN:n;
  }

  function formatNumber(n){
    if(isNaN(n))return '';
    return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function evaluateAll(){
    // Evaluate each cell; recursion handles dependencies
    cells.forEach(c=>{evaluateCell(c.dataset.ref,new Set());});
  }

  function evaluateCell(ref, visited){
    const cell = refMap[ref];
    if(!cell)return NaN;
    const val = cell.value.trim();
    if(val.startsWith('=')){
      if(visited.has(ref)){
        cell.value='CIRC';
        cell.dataset.num='NaN';
        return 'CIRC';
      }
      visited.add(ref);
      const expr = val.slice(1);
      const refs = expr.match(/[A-C][1-3]/g) || [];
      let evalExpr = expr;
      for(const r of refs){
        const res = evaluateCell(r, visited);
        if(res==='CIRC'){
          cell.value='CIRC';
          cell.dataset.num='NaN';
          return 'CIRC';
        }
        const num = parseNumber(refMap[r].value);
        if(isNaN(num)){
          cell.value='';
          cell.dataset.num='NaN';
          return NaN;
        }
        evalExpr = evalExpr.replace(new RegExp(r,'g'),num);
      }
      let result;
      try{
        result = Function('return '+evalExpr)();
      }catch(e){
        result = NaN;
      }
      if(isNaN(result)){
        cell.value='';
        cell.dataset.num='NaN';
        return NaN;
      }
      cell.dataset.num=result;
      cell.value=formatNumber(result);
      return result;
    }else{
      const num = parseNumber(val);
      cell.dataset.num=num;
      cell.value=formatNumber(num);
      return num;
    }
  }

  cells.forEach(c=>{
    c.addEventListener('input',()=>{
      evaluateAll();
    });
  });

  // Initial calculation
  evaluateAll();
})();
</script>
</body>
</html>
