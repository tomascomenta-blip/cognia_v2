<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    background:#e0e0e0;
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    width:90vw;
    max-width:400px;
    margin:20px;
    background:#f0f0f0;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .celda{
    width:100%;
    height:40px;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:16px;
    text-align:right;
    padding:5px;
    box-sizing:border-box;
    background:white;
    color:#333;
    outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .celda:focus{
    border-color:#66afe9;
    box-shadow:0 0 5px rgba(102,175,233,.5);
  }
  .celda.formula{
    background:#fff9c4;
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="5">
  <input type="text" class="celda" data-ref="A2" value="3">
  <input type="text" class="celda" data-ref="A3" value="2">
  <input type="text" class="celda" data-ref="B1" value="=A1+1">
  <input type="text" class="celda" data-ref="B2" value="=A2+2">
  <input type="text" class="celda" data-ref="B3" value="=A3+3">
  <input type="text" class="celda" data-ref="C1" value="=B1+1">
  <input type="text" class="celda" data-ref="C2" value="=B2+2">
  <input type="text" class="celda" data-ref="C3" value="=B3+3">
</div>
<script>
(() => {
  const cells = {}; // ref -> cell object
  const inputs = document.querySelectorAll('.celda');

  // Initialize cell objects
  inputs.forEach(el => {
    const ref = el.dataset.ref;
    const val = el.value;
    const cell = {
      ref,
      el,
      formula: null,
      value: val,
      dependencies: [], // refs this cell depends on
      dependents: []    // cells that depend on this cell
    };
    if (val.startsWith('=')) {
      cell.formula = val;
      cell.value = ''; // will be computed
    }
    cells[ref] = cell;
  });

  // Helper: parse references in a formula string
  const parseRefs = (formula) => {
    if (!formula) return [];
    const refs = formula.slice(1).match(/[A-C][1-3]/g);
    return refs ? Array.from(new Set(refs)) : [];
  };

  // Update dependencies for a cell
  const updateDependencies = (cell) => {
    // Remove from old dependencies
    cell.dependencies.forEach(depRef => {
      const depCell = cells[depRef];
      if (depCell) {
        depCell.dependents = depCell.dependents.filter(r => r !== cell.ref);
      }
    });
    // Compute new dependencies
    const newDeps = parseRefs(cell.formula);
    cell.dependencies = newDeps;
    // Add to new dependencies' dependents
    newDeps.forEach(depRef => {
      const depCell = cells[depRef];
      if (depCell) {
        if (!depCell.dependents.includes(cell.ref)) {
          depCell.dependents.push(cell.ref);
        }
      }
    });
  };

  // Evaluate a formula recursively, detecting cycles
  const evaluateFormula = (cell, stack) => {
    if (!cell.formula) return null;
    const expr = cell.formula.slice(1); // remove '='
    const tokens = expr.split(/([+-])/).filter(t => t !== '');
    let result = null;
    let currentOp = '+';
    for (const token of tokens) {
      if (token === '+' || token === '-') {
        currentOp = token;
        continue;
      }
      let val;
      if (/^[A-C][1-3]$/.test(token)) {
        // Reference
        if (stack.has(token)) return 'CIRC';
        const refCell = cells[token];
        if (!refCell) return 'CIRC';
        stack.add(token);
        const evalVal = evaluateFormula(refCell, stack);
        stack.delete(token);
        if (evalVal === 'CIRC') return 'CIRC';
        val = typeof evalVal === 'number' ? evalVal : parseFloat(evalVal);
      } else {
        // Numeric literal
        val = parseFloat(token);
      }
      if (isNaN(val)) val = 0;
      if (result === null) {
        result = val;
      } else {
        if (currentOp === '+') result += val;
        else if (currentOp === '-') result -= val;
      }
    }
    return result;
  };

  // Recompute a single cell's value
  const recomputeCell = (cell) => {
    if (!cell.formula) {
      // Non-formula cells keep their raw value
      cell.el.value = cell.value;
      cell.el.classList.remove('formula');
      return;
    }
    const val = evaluateFormula(cell, new Set([cell.ref]));
    if (val === 'CIRC') {
      cell.value = 'CIRC';
    } else {
      cell.value = val.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
    cell.el.value = cell.value;
    cell.el.classList.add('formula');
  };

  // Recompute all cells (used after any change)
  const recomputeAll = () => {
    Object.values(cells).forEach(recomputeCell);
  };

  // Handle user input changes
  const handleChange = (cell) => {
    const newVal = cell.el.value;
    if (newVal.startsWith('=')) {
      cell.formula = newVal;
      cell.value = ''; // will be computed
    } else {
      cell.formula = null;
      cell.value = newVal;
    }
    updateDependencies(cell);
    recomputeAll();
  };

  // Attach event listeners
  Object.values(cells).forEach(cell => {
    cell.el.addEventListener('input', () => handleChange(cell));
  });

  // Initial setup
  Object.values(cells).forEach(cell => {
    updateDependencies(cell);
  });
  recomputeAll();
})();
</script>
</body>
</html>
