<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  #spreadsheet{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    width:100%;
    max-width:400px;
  }
  .celda{
    width:100%;
    height:40px;
    box-sizing:border-box;
    border:1px solid #ccc;
    padding:5px;
    font-size:16px;
    text-align:right;
    background:#f9f9f9;
  }
  .celda.formula{background:#e0f7ff;}
  .celda.circular{background:#ffcccc;}
</style>
</head>
<body>
<div id="spreadsheet"></div>
<script>
class Cell {
  constructor(ref, element, spreadsheet) {
    this.ref = ref;
    this.element = element;
    this.spreadsheet = spreadsheet;
    this.formula = null;
    this.rawValue = '';
    this.value = '';
    this.dependencies = new Set();
    this.dependents = new Set();
    this.isFormula = false;
    this.element.addEventListener('input', () => this.updateFromInput());
  }
  updateFromInput() {
    const val = this.element.value.trim();
    if (val.startsWith('=')) {
      this.isFormula = true;
      this.formula = val;
    } else {
      this.isFormula = false;
      this.formula = null;
      this.rawValue = val;
    }
    this.updateDependencies();
    this.recompute();
  }
  updateDependencies() {
    // Remove from old dependencies
    this.dependencies.forEach(depRef => {
      const depCell = this.spreadsheet.cells.get(depRef);
      if (depCell) depCell.dependents.delete(this.ref);
    });
    this.dependencies.clear();
    if (this.isFormula) {
      const refs = this.parseRefs(this.formula);
      refs.forEach(ref => {
        this.dependencies.add(ref);
        const depCell = this.spreadsheet.cells.get(ref);
        if (depCell) depCell.dependents.add(this.ref);
      });
    }
  }
  parseRefs(formula) {
    const regex = /([A-C][1-3])/g;
    const refs = [];
    let match;
    while ((match = regex.exec(formula)) !== null) {
      refs.push(match[1]);
    }
    return refs;
  }
  evaluate(stack = []) {
    if (stack.includes(this.ref)) return 'CIRC';
    stack.push(this.ref);
    let result;
    if (!this.isFormula) {
      const num = parseFloat(this.rawValue);
      result = !isNaN(num) ? num : this.rawValue;
    } else {
      const expr = this.formula.slice(1);
      const tokens = expr.split(/([+-])/).filter(t => t !== '');
      let acc = 0;
      let op = '+';
      for (const token of tokens) {
        if (token === '+' || token === '-') {
          op = token;
        } else {
          const val = this.getValueFromToken(token, stack);
          if (val === 'CIRC') { stack.pop(); return 'CIRC'; }
          const num = typeof val === 'number' ? val : parseFloat(val);
          if (!isNaN(num)) {
            acc = op === '+' ? acc + num : acc - num;
          }
        }
      }
      result = acc;
    }
    stack.pop();
    return result;
  }
  getValueFromToken(token, stack) {
    if (/^[A-C][1-3]$/.test(token)) {
      const cell = this.spreadsheet.cells.get(token);
      if (!cell) return 0;
      return cell.evaluate(stack);
    } else {
      const num = parseFloat(token);
      return !isNaN(num) ? num : 0;
    }
  }
  recompute() {
    const val = this.evaluate();
    this.value = val;
    if (this.isFormula) {
      this.element.value = val;
      this.element.classList.add('formula');
    } else {
      this.element.value = this.rawValue;
      this.element.classList.remove('formula');
    }
    if (val === 'CIRC') {
      this.element.classList.add('circular');
    } else {
      this.element.classList.remove('circular');
    }
    this.dependents.forEach(depRef => {
      const depCell = this.spreadsheet.cells.get(depRef);
      if (depCell) depCell.recompute();
    });
  }
}
class Spreadsheet {
  constructor() {
    this.cells = new Map();
    this.init();
  }
  init() {
    const container = document.getElementById('spreadsheet');
    const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
    refs.forEach(ref => {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'celda';
      input.dataset.ref = ref;
      input.value = '';
      container.appendChild(input);
      const cell = new Cell(ref, input, this);
      this.cells.set(ref, cell);
    });
  }
}
document.addEventListener('DOMContentLoaded', () => {
  window.spreadsheet = new Spreadsheet();
});
</script>
</body>
</html>
