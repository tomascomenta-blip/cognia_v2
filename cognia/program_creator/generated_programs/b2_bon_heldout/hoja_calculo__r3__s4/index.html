
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f0f0;padding:20px;}
  table{border-collapse:collapse;margin:auto;}
  td{border:1px solid #999;padding:0;}
  input.celda{
    width:80px;height:30px;text-align:right;padding:5px;
    border:none;outline:none;font-size:14px;
  }
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda" data-ref="A1" value=""></td>
    <td><input class="celda" data-ref="A2" value=""></td>
    <td><input class="celda" data-ref="A3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1" value=""></td>
    <td><input class="celda" data-ref="B2" value=""></td>
    <td><input class="celda" data-ref="B3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1" value=""></td>
    <td><input class="celda" data-ref="C2" value=""></td>
    <td><input class="celda" data-ref="C3" value=""></td>
  </tr>
</table>

<script>
(() => {
  const cells = {}; // map ref -> input element
  document.querySelectorAll('.celda').forEach(el => {
    cells[el.dataset.ref] = el;
  });

  let computing = false; // flag to avoid re‑entry

  // Evaluate a cell value recursively
  function evalCell(ref, stack = []) {
    if (stack.includes(ref)) return 'CIRC'; // circular reference
    const el = cells[ref];
    const formula = el.dataset.formula;
    if (!formula) {
      // Non‑formula cell: return its current value (as string)
      return el.value;
    }
    // Formula cell: compute result
    stack.push(ref);
    let expr = formula.slice(1); // remove leading '='
    // Replace cell references with their evaluated values
    expr = expr.replace(/[A-C][1-3]/g, match => {
      const val = evalCell(match, stack);
      if (val === 'CIRC') return 'CIRC';
      // Try to parse as number; if not numeric, treat as 0
      const num = parseFloat(val);
      return isNaN(num) ? '0' : num;
    });
    // If any reference was circular, propagate
    if (expr.includes('CIRC')) {
      stack.pop();
      return 'CIRC';
    }
    // Evaluate the arithmetic expression safely
    let result;
    try {
      // Only allow numbers and +,- operators
      if (!/^[0-9+\-.\s]+$/.test(expr)) throw new Error('Invalid expression');
      result = Function(`return ${expr}`)();
    } catch (e) {
      result = 'CIRC';
    }
    stack.pop();
    return result;
  }

  // Recalculate all cells and update displayed values
  function recomputeAll() {
    computing = true;
    Object.keys(cells).forEach(ref => {
      const el = cells[ref];
      const formula = el.dataset.formula;
      if (formula) {
        const val = evalCell(ref);
        el.value = val;
      }
    });
    computing = false;
  }

  // Handle user input
  document.querySelectorAll('.celda').forEach(el => {
    el.addEventListener('input', () => {
      if (computing) return; // ignore programmatic changes
      const val = el.value.trim();
      if (val.startsWith('=')) {
        el.dataset.formula = val;
      } else {
        delete el.dataset.formula;
      }
      recomputeAll();
    });
  });

  // Initial calculation on page load
  recomputeAll();
})();
</script>
</body>
</html>
