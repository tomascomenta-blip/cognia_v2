<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con Stock</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f5f5f5;}
  .container{max-width:800px;margin:auto;padding:20px;}
  h1{font-size:1.8em;margin-bottom:10px;}
  .products,.cart{background:#fff;padding:15px;margin-bottom:15px;border-radius:5px;}
  .prod{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .prod:last-child{margin-bottom:0;}
  .prod button{padding:5px 10px;}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .linea:last-child{margin-bottom:0;}
  .linea button{padding:3px 6px;}
  #total{font-weight:bold;font-size:1.2em;}
  @media (max-width:600px){
    .prod{flex-direction:column;align-items:flex-start;}
    .prod button{margin-top:5px;}
    .linea{flex-direction:column;align-items:flex-start;}
    .linea button{margin-top:5px;}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Carrito de compra con Stock</h1>
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <span>Producto 1 - €100.00</span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <span>Producto 2 - €50.00</span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <span>Producto 3 - €25.00</span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div>Total: <span id="total">€0.00</span></div>
  </div>
</div>
<script>
(function(){
  const products=document.querySelectorAll('.prod');
  const cartLines=document.getElementById('cart-lines');
  const totalSpan=document.getElementById('total');
  const cart={};

  function formatPrice(val){return val.toLocaleString('es-ES',{style:'currency',currency:'EUR'});}
  function updateTotal(){
    let sum=0;
    for(const id in cart){
      const prod=document.querySelector(`.prod[data-id="${id}"]`);
      const price=parseFloat(prod.dataset.precio);
      sum+=price*cart[id];
    }
    totalSpan.textContent=formatPrice(sum);
  }
  function updateAddButton(id){
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const btn=prod.querySelector('.add');
    const stock=parseInt(prod.dataset.stock);
    const qty=cart[id]||0;
    btn.disabled=qty>=stock;
  }
  function addToCart(id){
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const stock=parseInt(prod.dataset.stock);
    const qty=cart[id]||0;
    if(qty>=stock)return;
    cart[id]=qty+1;
    renderCartLine(id);
    updateAddButton(id);
    updateTotal();
  }
  function removeFromCart(id){
    const qty=cart[id]||0;
    if(qty<=0)return;
    cart[id]=qty-1;
    if(cart[id]===0){
      delete cart[id];
      removeCartLine(id);
    }else{
      updateCartLine(id);
    }
    updateAddButton(id);
    updateTotal();
  }
  function renderCartLine(id){
    const existing=document.querySelector(`.linea[data-id="${id}"]`);
    if(existing)return;
    const line=document.createElement('div');
    line.className='linea';
    line.dataset.id=id;
    const spanCant=document.createElement('span');
    spanCant.className='cant';
    spanCant.textContent=cart[id];
    const btn=document.createElement('button');
    btn.className='quitar';
    btn.dataset.id=id;
    btn.textContent='Quitar';
    btn.addEventListener('click',()=>{removeFromCart(id);});
    line.appendChild(spanCant);
    line.appendChild(btn);
    cartLines.appendChild(line);
  }
  function removeCartLine(id){
    const line=document.querySelector(`.linea[data-id="${id}"]`);
    if(line)line.remove();
  }
  function updateCartLine(id){
    const line=document.querySelector(`.linea[data-id="${id}"]`);
    if(line){
      const span=line.querySelector('.cant');
      span.textContent=cart[id];
    }
  }
  products.forEach(prod=>{
    const btn=prod.querySelector('.add');
    btn.addEventListener('click',()=>{addToCart(btn.dataset.id);});
  });
})();
</script>
</body>
</html>
