<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en una página</title>
<style>
  body {font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #eaeaea;}
  .board {display: flex; flex-wrap: wrap; gap: 10px; max-width: 1200px; margin: 0 auto;}
  .col {flex: 1; min-width: 250px; background: #f9f9f9; border: 1px solid #ccc; border-radius: 4px; padding: 10px;}
  .col-header {font-weight: bold; margin-bottom: 10px; display: flex; align-items: center;}
  .counter {margin-left: 5px; font-weight: bold;}
  .card {background: #fff; border: 1px solid #999; border-radius: 4px; padding: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
  .card button {margin-left: 5px; padding: 2px 5px;}
  @media (max-width: 600px) {
    .board {flex-direction: column;}
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <div class="col-header">Todo <span id="cont-todo">3</span></div>
    <div class="card" data-id="t1"><span>Tarea 1</span><button class="menos">&lt;</button><button class="mas">&gt;</button></div>
    <div class="card" data-id="t2"><span>Tarea 2</span><button class="menos">&lt;</button><button class="mas">&gt;</button></div>
    <div class="card" data-id="t3"><span>Tarea 3</span><button class="menos">&lt;</button><button class="mas">&gt;</button></div>
  </div>
  <div class="col" data-col="doing">
    <div class="col-header">En Progreso <span id="cont-doing">0</span></div>
  </div>
  <div class="col" data-col="done">
    <div class="col-header">Hecho <span id="cont-done">0</span></div>
  </div>
</div>
<script>
const MAX_DOING = 2;
const COLUMN_ORDER = ['todo', 'doing', 'done'];

function updateCounters() {
  COLUMN_ORDER.forEach(col => {
    const count = document.querySelectorAll(`.col[data-col="${col}"] .card`).length;
    document.getElementById(`cont-${col}`).textContent = count;
  });
}

function moveCard(card, direction) {
  const currentCol = card.parentElement;
  const currentColName = currentCol.dataset.col;
  const currentIndex = COLUMN_ORDER.indexOf(currentColName);
  let targetIndex = currentIndex + direction;
  if (targetIndex < 0 || targetIndex >= COLUMN_ORDER.length) return; // out of bounds
  const targetColName = COLUMN_ORDER[targetIndex];
  // WIP rule: if moving into doing and it's full, do nothing
  if (targetColName === 'doing' && document.querySelectorAll('.col[data-col="doing"] .card').length >= MAX_DOING) {
    return;
  }
  // Move card
  document.querySelector(`.col[data-col="${targetColName}"]`).appendChild(card);
}

document.querySelectorAll('.card button').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const card = e.target.closest('.card');
    if (e.target.classList.contains('mas')) {
      moveCard(card, 1);
    } else if (e.target.classList.contains('menos')) {
      moveCard(card, -1);
    }
    updateCounters();
  });
});

updateCounters();
</script>
</body>
</html>
