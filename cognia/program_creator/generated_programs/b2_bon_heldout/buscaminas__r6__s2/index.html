<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Minesweeper 5x5</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:400px;}
.c{background:#ccc;border:1px solid #999;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;}
.c.abierta{background:#e0e0e0;cursor:default;}
.c.bandera{background:#ffeb3b;}
#estado{margin-top:10px;font-size:1.2rem;color:#d32f2f;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const grid=document.getElementById('grid');
const estado=document.getElementById('estado');
for(let i=0;i<25;i++){
  const cell=document.createElement('div');
  cell.className='c';
  cell.dataset.i=i;
  cell.addEventListener('click',()=>openCell(cell));
  cell.addEventListener('contextmenu',e=>{
    e.preventDefault();
    toggleFlag(cell);
  });
  grid.appendChild(cell);
}
function isMine(i){return mines.includes(i);}
function neighbors(i){
  const r=Math.floor(i/5),c=i%5;
  const list=[];
  for(let dr=-1;dr<=1;dr++){
    for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0)continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<5&&nc>=0&&nc<5)list.push(nr*5+nc);
    }
  }
  return list;
}
function countAdj(i){return neighbors(i).filter(isMine).length;}
function openCell(cell){
  if(cell.classList.contains('bandera')||cell.classList.contains('abierta'))return;
  const i=parseInt(cell.dataset.i);
  if(isMine(i)){
    cell.textContent='💣';
    cell.classList.add('abierta');
    estado.textContent='perdiste';
    return;
  }
  const cnt=countAdj(i);
  cell.textContent=cnt?cnt:'';
  cell.classList.add('abierta');
  if(cnt===0){
    neighbors(i).forEach(idx=>{
      const nb=document.querySelector(`.c[data-i="${idx}"]`);
      if(nb && !nb.classList.contains('abierta') && !nb.classList.contains('bandera')){
        openCell(nb);
      }
    });
  }
}
function toggleFlag(cell){
  if(cell.classList.contains('abierta'))return;
  if(cell.classList.contains('bandera')){
    cell.classList.remove('bandera');
    cell.textContent='';
  }else{
    cell.classList.add('bandera');
    cell.textContent='🚩';
  }
}
</script>
</body>
</html>
