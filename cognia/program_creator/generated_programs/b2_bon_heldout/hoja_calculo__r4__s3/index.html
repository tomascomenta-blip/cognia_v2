<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#333;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:10px;
  }
  .celda{
    width:80px;
    height:30px;
    padding:5px;
    box-sizing:border-box;
    text-align:right;
    font-size:1rem;
    color:#000;
    background:#f0f0f0;
    border:1px solid #ccc;
    outline:none;
  }
  .celda:focus{
    box-shadow:0 0 5px 2px rgba(0,120,255,0.5);
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="1">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B1" value="2">
  <input type="text" class="celda" data-ref="B2" value="=A1+1">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C1" value="3">
  <input type="text" class="celda" data-ref="C2" value="=B2+1">
  <input type="text" class="celda" data-ref="C3" value="=A1+B1+C1">
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = {};
  document.querySelectorAll('.celda').forEach(input => {
    const ref = input.dataset.ref;
    input.dataset.raw = input.value;
    cells[ref] = {input, raw: input.dataset.raw};
    input.addEventListener('input', () => {
      input.dataset.raw = input.value;
      updateAll();
    });
  });

  function evaluateCell(ref, visited) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const raw = cells[ref].raw;
    if (!raw.startsWith('=')) {
      visited.delete(ref);
      return raw;
    }
    const expr = raw.slice(1);
    const replaced = expr.replace(/[A-C][1-3]/g, r => {
      const val = evaluateCell(r, visited);
      if (val === 'CIRC') return 'CIRC';
      return val === '' ? '0' : val;
    });
    if (replaced.includes('CIRC')) {
      visited.delete(ref);
      return 'CIRC';
    }
    try {
      const result = Function('return ' + replaced)();
      visited.delete(ref);
      return result.toString();
    } catch (e) {
      visited.delete(ref);
      return 'ERR';
    }
  }

  function updateAll() {
    Object.keys(cells).forEach(ref => {
      const val = evaluateCell(ref, new Set());
      cells[ref].input.value = val;
    });
  }

  updateAll();
});
</script>
</body>
</html>
