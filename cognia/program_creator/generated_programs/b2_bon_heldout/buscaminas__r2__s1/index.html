
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f0f0;display:flex;flex-direction:column;align-items:center;padding-top:20px;}
  #grid{display:grid;grid-template-columns:repeat(5,50px);grid-template-rows:repeat(5,50px);gap:2px;width:260px;margin:auto;animation:fadeInScale 1s ease-out;}
  .c{width:50px;height:50px;background:#ccc;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none;}
  .c.abierta{background:#eee;cursor:default;}
  .c.bandera{background:#f00;color:#fff;}
  #estado{margin-top:10px;font-size:1.2em;}
  @keyframes fadeInScale{from{opacity:0;transform:scale(0.8);}to{opacity:1;transform:scale(1);}}
</style>
</head>
<body>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>
<script>
  const mines = new Set([6,12,18]);
  const cells = Array.from(document.querySelectorAll('.c'));
  let gameOver = false;
  function getNeighbors(i){
    const neighbors=[];
    const row=Math.floor(i/5), col=i%5;
    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        const r=row+dr, c=col+dc;
        if(r>=0 && r<5 && c>=0 && c<5){
          neighbors.push(r*5+c);
        }
      }
    }
    return neighbors;
  }
  function countAdjacentMines(i){
    return getNeighbors(i).filter(n=>mines.has(n)).length;
  }
  function openCell(i){
    const cell=cells[i];
    if(cell.classList.contains('abierta') || cell.classList.contains('bandera') || gameOver) return;
    if(mines.has(i)){
      cell.classList.add('abierta');
      cell.textContent='X';
      document.getElementById('estado').textContent='perdiste';
      gameOver=true;
      return;
    }
    const count=countAdjacentMines(i);
    cell.classList.add('abierta');
    if(count>0) cell.textContent=count;
    if(count===0){
      getNeighbors(i).forEach(n=>openCell(n));
    }
  }
  cells.forEach(cell=>{
    const i=parseInt(cell.dataset.i);
    cell.addEventListener('click',()=>{ openCell(i); });
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(gameOver || cell.classList.contains('abierta')) return;
      if(cell.classList.contains('bandera')){
        cell.classList.remove('bandera');
      }else{
        cell.classList.add('bandera');
      }
    });
  });
</script>
</body>
</html>
