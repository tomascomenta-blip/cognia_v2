<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:sans-serif;margin:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;padding:5px;text-align:right;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="1">
  <input class="celda" data-ref="A2" value="2">
  <input class="celda" data-ref="A3" value="3">
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="=A2+1">
  <input class="celda" data-ref="B3" value="=A3+1">
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="=B2+1">
  <input class="celda" data-ref="C3" value="=B3+1">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const refMap={};
cells.forEach(c=>refMap[c.dataset.ref]=c);
function evalCell(cell,vis){if(vis.has(cell))return'CIRC';vis.add(cell);
 let expr=cell.dataset.formula||cell.value;
 if(expr.startsWith('=')){
  expr=expr.slice(1);
  expr=expr.replace(/[A-C][1-3]/g,ref=>{
   const r=refMap[ref];
   const v=evalCell(r,vis);
   return v==='CIRC'?v:v;
  });
  if(expr.includes('CIRC'))return'CIRC';
  try{return(eval(expr)).toString();}catch{return'ERR';}
 }return expr;}
function recompute(){cells.forEach(c=>{
  if(c.dataset.formula===undefined && c.value.startsWith('=')){
   c.dataset.formula=c.value;c.value='';c.readOnly=true;
  }
  const val=evalCell(c,new Set());
  c.value=val;
  c.readOnly=!!c.dataset.formula;
});}
cells.forEach(c=>c.addEventListener('input',recompute));
recompute();
</script>
</body>
</html>
