<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en HTML</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  h1{margin:0;padding:10px;background:#4caf50;color:#fff;text-align:center;}
  .board{display:flex;flex-wrap:wrap;padding:10px;}
  .col{background:#fff;border:1px solid #ccc;border-radius:4px;flex:1;min-width:250px;margin:5px;padding:10px;box-sizing:border-box;}
  .col h2{margin-top:0;font-size:1.2em;}
  .card{background:#e3f2fd;border:1px solid #90caf9;border-radius:4px;padding:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .card button{margin-left:4px;}
  .counter{font-weight:bold;color:#333;}
</style>
</head>
<body>
<h1>Tablero Kanban</h1>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo" class="counter"></span></h2>
    <div class="card" data-id="t1">
      <span>t1</span>
      <div>
        <button class="menos">&lt;</button>
        <button class="mas">&gt;</button>
      </div>
    </div>
    <div class="card" data-id="t2">
      <span>t2</span>
      <div>
        <button class="menos">&lt;</button>
        <button class="mas">&gt;</button>
      </div>
    </div>
    <div class="card" data-id="t3">
      <span>t3</span>
      <div>
        <button class="menos">&lt;</button>
        <button class="mas">&gt;</button>
      </div>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h2>En Progreso <span id="cont-doing" class="counter"></span></h2>
  </div>
  <div class="col" data-col="done">
    <h2>Hecho <span id="cont-done" class="counter"></span></h2>
  </div>
</div>
<script>
  function updateCounters() {
    document.querySelectorAll('.col').forEach(col => {
      const id = col.dataset.col;
      const count = col.querySelectorAll('.card').length;
      document.getElementById('cont-' + id).textContent = count;
    });
  }
  function moveCard(card, direction) {
    const currentCol = card.parentElement.parentElement;
    const cols = Array.from(currentCol.parentElement.children);
    const currentIndex = cols.indexOf(currentCol);
    const targetIndex = currentIndex + direction;
    if (targetIndex < 0 || targetIndex >= cols.length) return;
    const targetCol = cols[targetIndex];
    // WIP rule: doing max 2 cards
    if (targetCol.dataset.col === 'doing' && targetCol.querySelectorAll('.card').length >= 2) return;
    targetCol.appendChild(card);
    updateCounters();
  }
  document.querySelectorAll('.mas').forEach(btn => {
    btn.addEventListener('click', function() {
      const card = this.closest('.card');
      const col = card.parentElement.parentElement;
      if (col.dataset.col === 'done') return;
      moveCard(card, 1);
    });
  });
  document.querySelectorAll('.menos').forEach(btn => {
    btn.addEventListener('click', function() {
      const card = this.closest('.card');
      const col = card.parentElement.parentElement;
      if (col.dataset.col === 'todo') return;
      moveCard(card, -1);
    });
  });
  updateCounters();
</script>
</body>
</html>
