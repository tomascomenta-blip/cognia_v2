<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:5px;box-sizing:border-box;text-align:right;}
  input[value="CIRC"]{color:red;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" value="5">
  <input class="celda" data-ref="A2" value="3">
  <input class="celda" data-ref="A3" value="2">
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="=A1+B1-A2">
  <input class="celda" data-ref="B3" value="Hello">
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="=C3+1">
  <input class="celda" data-ref="C3" value="=C2+1">
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const cells = {};
  const raw = {};
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  refs.forEach(ref => {
    const cell = document.querySelector(`input[data-ref="${ref}"]`);
    cells[ref] = cell;
    raw[ref] = cell.value;
    cell.addEventListener('input', () => {
      raw[ref] = cell.value;
      recomputeAll();
    });
  });

  function evaluateCell(ref, visited) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const val = raw[ref];
    if (!val.startsWith('=')) {
      visited.delete(ref);
      return val;
    }
    const expr = val.slice(1);
    const replaced = expr.replace(/([A-C][1-3])/g, m => {
      const res = evaluateCell(m, visited);
      if (res === 'CIRC') return 'CIRC';
      const num = parseFloat(res);
      return isNaN(num) ? '0' : num;
    });
    if (replaced.includes('CIRC')) {
      visited.delete(ref);
      return 'CIRC';
    }
    try {
      const result = Function(`return ${replaced}`)();
      visited.delete(ref);
      return result;
    } catch {
      visited.delete(ref);
      return 'CIRC';
    }
  }

  function recomputeAll() {
    refs.forEach(ref => {
      const cell = cells[ref];
      const rawVal = raw[ref];
      if (rawVal.startsWith('=')) {
        const val = evaluateCell(ref, new Set());
        cell.value = val === 'CIRC' ? 'CIRC' : val.toString();
      } else {
        cell.value = rawVal;
      }
    });
  }

  recomputeAll();
});
</script>
</body>
</html>
