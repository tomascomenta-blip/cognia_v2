
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:#f4f4f4;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
  }
  .prod{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    width:200px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    opacity:0;
    animation:fadeIn 1s forwards;
  }
  .prod:nth-child(1){animation-delay:.2s;}
  .prod:nth-child(2){animation-delay:.4s;}
  .prod:nth-child(3){animation-delay:.6s;}
  .prod h3{margin-top:0;}
  .prod button{
    margin-top:10px;
    padding:5px 10px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  .prod button:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  .cart{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    width:260px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    opacity:0;
    animation:fadeIn 1s forwards;
    animation-delay:.8s;
  }
  .cart h2{margin-top:0;}
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:5px 0;
    padding:5px;
    background:#f9f9f9;
    border-radius:4px;
    opacity:0;
    animation:fadeInLine .4s forwards;
  }
  .linea button{
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:4px;
    padding:2px 6px;
    cursor:pointer;
  }
  #total{
    font-weight:bold;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes fadeInLine{
    from{opacity:0;transform:translateX(-20px);}
    to{opacity:1;transform:translateX(0);}
  }
</style>
</head>
<body>

<div class="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <h3>Producto 1</h3>
    <p>Precio: $100</p>
    <p>Stock: 2</p>
    <button class="add" data-id="p1">Agregar</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <h3>Producto 2</h3>
    <p>Precio: $50</p>
    <p>Stock: 3</p>
    <button class="add" data-id="p2">Agregar</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <h3>Producto 3</h3>
    <p>Precio: $25</p>
    <p>Stock: 1</p>
    <button class="add" data-id="p3">Agregar</button>
  </div>
</div>

<div class="cart">
  <h2>Carrito</h2>
  <div id="lines"></div>
  <p>Total: $<span id="total">0</span></p>
</div>

<script>
  // Estado del carrito: {id: {qty, precio, stock}}
  const cart = {};

  // Función para actualizar el total
  function updateTotal(){
    let total = 0;
    for(const id in cart){
      total += cart[id].qty * cart[id].precio;
    }
    document.getElementById('total').textContent = total;
  }

  // Función para crear o actualizar una línea en el carrito
  function renderLine(id){
    const lineContainer = document.getElementById('lines');
    let line = lineContainer.querySelector(`.linea[data-id="${id}"]`);
    if(!line){
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <span class="cant">${cart[id].qty}</span>
        <button class="quitar" data-id="${id}">-</button>
      `;
      lineContainer.appendChild(line);
      // Añadir listener al botón quitar
      line.querySelector('.quitar').addEventListener('click', () => removeItem(id));
    }else{
      line.querySelector('.cant').textContent = cart[id].qty;
    }
  }

  // Función para añadir un producto
  function addItem(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const precio = parseInt(prod.dataset.precio);
    const stock = parseInt(prod.dataset.stock);
    const btnAdd = prod.querySelector(`button.add[data-id="${id}"]`);

    if(!cart[id]){
      cart[id] = {qty:0, precio, stock};
    }
    if(cart[id].qty < stock){
      cart[id].qty += 1;
      if(cart[id].qty === stock){
        btnAdd.disabled = true;
      }
      renderLine(id);
      updateTotal();
    }
  }

  // Función para quitar un producto
  function removeItem(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const btnAdd = prod.querySelector(`button.add[data-id="${id}"]`);
    if(cart[id] && cart[id].qty > 0){
      cart[id].qty -= 1;
      if(cart[id].qty < cart[id].stock){
        btnAdd.disabled = false;
      }
      if(cart[id].qty === 0){
        // eliminar línea
        const line = document.querySelector(`.linea[data-id="${id}"]`);
        if(line) line.remove();
        delete cart[id];
      }else{
        renderLine(id);
      }
      updateTotal();
    }
  }

  // Asignar listeners a los botones de agregar
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click', () => addItem(btn.dataset.id));
  });
</script>
</body>
</html>
