<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#f0f0f0;
  }
  #estado{
    font-size:1.5rem;
    margin-top:10px;
    min-height:1.5rem;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    width:90vmin;
    height:90vmin;
    margin:20px auto;
    border:2px solid #333;
    box-sizing:border-box;
  }
  .c{
    border:1px solid #999;
    background:#ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera{
    background:#ff0;
  }
</style>
</head>
<body>
<div id="estado"></div>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<script>
  const MINE_POSITIONS = [6,12,18];
  const GRID_SIZE = 5;
  const cells = document.querySelectorAll('.c');
  let gameOver = false;

  function countAdjacentMines(i){
    const row = Math.floor(i/GRID_SIZE);
    const col = i%GRID_SIZE;
    let count = 0;
    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        const nr = row+dr, nc = col+dc;
        if(nr>=0 && nr<GRID_SIZE && nc>=0 && nc<GRID_SIZE){
          const nIdx = nr*GRID_SIZE+nc;
          if(MINE_POSITIONS.includes(nIdx)) count++;
        }
      }
    }
    return count;
  }

  function openCell(i){
    const cell = cells[i];
    if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    cell.classList.add('abierta');
    if(MINE_POSITIONS.includes(i)){
      document.getElementById('estado').textContent = 'perdiste';
      gameOver = true;
      // reveal all mines
      MINE_POSITIONS.forEach(idx=>{
        const mineCell = cells[idx];
        mineCell.textContent = '💣';
        mineCell.classList.add('abierta');
      });
      return;
    }
    const count = countAdjacentMines(i);
    if(count>0){
      cell.textContent = count;
    }else{
      cell.textContent = '';
      // cascade
      const row = Math.floor(i/GRID_SIZE);
      const col = i%GRID_SIZE;
      for(let dr=-1; dr<=1; dr++){
        for(let dc=-1; dc<=1; dc++){
          if(dr===0 && dc===0) continue;
          const nr = row+dr, nc = col+dc;
          if(nr>=0 && nr<GRID_SIZE && nc>=0 && nc<GRID_SIZE){
            const nIdx = nr*GRID_SIZE+nc;
            openCell(nIdx);
          }
        }
      }
    }
  }

  cells.forEach(cell=>{
    cell.addEventListener('click', e=>{
      if(gameOver) return;
      const i = parseInt(cell.dataset.i,10);
      if(cell.classList.contains('bandera')) return;
      openCell(i);
    });
    cell.addEventListener('contextmenu', e=>{
      e.preventDefault();
      if(gameOver) return;
      const i = parseInt(cell.dataset.i,10);
      const c = cells[i];
      if(c.classList.contains('abierta')) return;
      if(c.classList.contains('bandera')){
        c.classList.remove('bandera');
        c.textContent = '';
      }else{
        c.classList.add('bandera');
        c.textContent = '🚩';
      }
    });
  });
</script>
</body>
</html>
