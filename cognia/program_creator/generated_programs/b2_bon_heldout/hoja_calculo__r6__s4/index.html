
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;justify-content:center;align-items:center;height:100vh;margin:0;
  }
  table{
    border-collapse:collapse;
    animation:bgAnim 2s ease-in-out;
  }
  td{border:1px solid #999;padding:0;}
  input.celda{
    width:60px;height:30px;text-align:right;border:none;font-size:14px;padding:5px;
  }
  @keyframes bgAnim{
    0%{background-color:#e0f7fa;}
    100%{background-color:#fff;}
  }
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda" data-ref="A1" value=""></td>
    <td><input class="celda" data-ref="A2" value=""></td>
    <td><input class="celda" data-ref="A3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1" value=""></td>
    <td><input class="celda" data-ref="B2" value=""></td>
    <td><input class="celda" data-ref="B3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1" value=""></td>
    <td><input class="celda" data-ref="C2" value=""></td>
    <td><input class="celda" data-ref="C3" value=""></td>
  </tr>
</table>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = document.querySelectorAll('.celda');
  const refMap = {};
  const dependents = {};

  cells.forEach(cell => {
    const ref = cell.dataset.ref;
    refMap[ref] = cell;
    dependents[ref] = [];
  });

  function parseDependencies(formula) {
    const regex = /[A-C][1-3]/g;
    const matches = formula.match(regex);
    return matches ? matches : [];
  }

  function evaluateCell(ref, stack = new Set()) {
    const cell = refMap[ref];
    const val = cell.value;
    if (!val.startsWith('=')) {
      const num = parseFloat(val);
      return isNaN(num) ? 0 : num;
    }
    if (stack.has(ref)) {
      stack.forEach(r => refMap[r].value = 'CIRC');
      return 'CIRC';
    }
    stack.add(ref);
    const expr = val.slice(1);
    const replaced = expr.replace(/[A-C][1-3]/g, (match) => {
      const depVal = evaluateCell(match, stack);
      if (depVal === 'CIRC') return '0';
      return depVal;
    });
    let result;
    try {
      result = eval(replaced);
    } catch (e) {
      result = 0;
    }
    cell.value = result;
    stack.delete(ref);
    return result;
  }

  function evaluateAll() {
    Object.keys(dependents).forEach(ref => dependents[ref] = []);
    cells.forEach(cell => {
      const ref = cell.dataset.ref;
      if (cell.value.startsWith('=')) {
        const deps = parseDependencies(cell.value);
        deps.forEach(dep => {
          if (dependents[dep]) dependents[dep].push(ref);
        });
      }
    });
    cells.forEach(cell => {
      if (cell.value.startsWith('=')) {
        evaluateCell(cell.dataset.ref);
      }
    });
  }

  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      evaluateAll();
    });
  });

  evaluateAll();
});
</script>
</body>
</html>
