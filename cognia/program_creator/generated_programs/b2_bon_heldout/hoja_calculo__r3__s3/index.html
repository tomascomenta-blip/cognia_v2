<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    max-width:320px;
    width:100%;
    padding:20px;
    background:#f0f0f0;
  }
  .cell{
    position:relative;
  }
  .celda{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#fff;
    font-size:14px;
    color:#000;
    box-sizing:border-box;
    outline:none;
    transition:background .2s,border-color .2s;
  }
  .celda:focus{
    background:#e6f7ff;
    border-color:#007bff;
  }
  .cell.formula::after{
    content:"ℹ️";
    position:absolute;
    top:4px;
    right:4px;
    font-size:12px;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><input class="celda" data-ref="A1" /></div>
  <div class="cell"><input class="celda" data-ref="A2" /></div>
  <div class="cell"><input class="celda" data-ref="A3" /></div>
  <div class="cell"><input class="celda" data-ref="B1" /></div>
  <div class="cell"><input class="celda" data-ref="B2" /></div>
  <div class="cell"><input class="celda" data-ref="B3" /></div>
  <div class="cell"><input class="celda" data-ref="C1" /></div>
  <div class="cell"><input class="celda" data-ref="C2" /></div>
  <div class="cell"><input class="celda" data-ref="C3" /></div>
</div>
<script>
(() => {
  const cells = {}; // ref -> {formula, value, deps, dependents, input, container}
  const refRegex = /[A-C][1-3]/g;

  function init() {
    document.querySelectorAll('.celda').forEach(input => {
      const ref = input.dataset.ref;
      const container = input.parentElement;
      const val = input.value.trim();
      const cell = {
        ref,
        input,
        container,
        formula: null,
        value: val,
        deps: new Set(),
        dependents: new Set()
      };
      if (val.startsWith('=')) {
        cell.formula = val;
        cell.value = ''; // will be computed
      }
      cells[ref] = cell;
    });
    buildDependencies();
    computeAll();
    attachEvents();
  }

  function buildDependencies() {
    // clear deps and dependents
    Object.values(cells).forEach(cell => {
      cell.deps.clear();
      cell.dependents.clear();
    });
    // build deps
    Object.values(cells).forEach(cell => {
      if (cell.formula) {
        const refs = cell.formula.match(refRegex) || [];
        refs.forEach(r => {
          cell.deps.add(r);
          if (cells[r]) cells[r].dependents.add(cell.ref);
        });
      }
    });
  }

  function computeAll() {
    const visited = new Set();
    const stack = [];
    const cache = {};

    function compute(ref) {
      if (cache[ref] !== undefined) return cache[ref];
      const cell = cells[ref];
      if (!cell) return '';
      if (!cell.formula) {
        cache[ref] = cell.value;
        return cache[ref];
      }
      if (stack.includes(ref)) {
        // cycle detected
        cache[ref] = 'CIRC';
        return cache[ref];
      }
      stack.push(ref);
      let expr = cell.formula.slice(1); // remove '='
      const refsInExpr = expr.match(refRegex) || [];
      for (const r of refsInExpr) {
        const val = compute(r);
        if (val === 'CIRC') {
          cache[ref] = 'CIRC';
          stack.pop();
          return cache[ref];
        }
        expr = expr.replaceAll(r, val);
      }
      let result;
      try {
        // safe eval: only numbers, +, -
        result = Function(`"use strict"; return (${expr})`)();
        if (isNaN(result)) throw new Error();
      } catch {
        result = 'CIRC';
      }
      cache[ref] = result.toString();
      stack.pop();
      return cache[ref];
    }

    Object.keys(cells).forEach(ref => compute(ref));

    // update UI
    Object.values(cells).forEach(cell => {
      const val = cache[cell.ref];
      cell.value = val;
      cell.input.value = val;
      if (cell.formula) {
        cell.input.title = cell.formula;
        cell.container.classList.add('formula');
      } else {
        cell.input.title = '';
        cell.container.classList.remove('formula');
      }
    });
  }

  function attachEvents() {
    document.querySelectorAll('.celda').forEach(input => {
      input.addEventListener('input', () => {
        const ref = input.dataset.ref;
        const cell = cells[ref];
        const newVal = input.value.trim();
        if (newVal.startsWith('=')) {
          cell.formula = newVal;
          cell.value = '';
        } else {
          cell.formula = null;
          cell.value = newVal;
        }
        buildDependencies();
        computeAll();
      });
    });
  }

  init();
})();
</script>
</body>
</html>
