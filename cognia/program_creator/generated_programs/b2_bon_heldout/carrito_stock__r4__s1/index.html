<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f5f5;}
.container{display:flex;flex-wrap:wrap;padding:20px;}
.products,.cart{flex:1 1 300px;box-sizing:border-box;padding:10px;}
.products{background:#fff;border-right:1px solid #ddd;}
.cart{background:#fff;}
.prod{border:1px solid #ddd;border-radius:4px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.prod .info{flex:1;}
.prod button.add{padding:5px 10px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;}
.prod button.add:disabled{background:#aaa;cursor:not-allowed;}
.cart h2{margin-top:0;}
.linea{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:5px 0;}
.linea button.quitar{padding:3px 6px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
#total{font-weight:bold;font-size:1.2em;}
@media (max-width:600px){
  .container{flex-direction:column;}
  .products,.cart{border-right:none;border-bottom:1px solid #ddd;}
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="info">
        <div>Producto 1</div>
        <div>Precio: <span class="precio"></span></div>
      </div>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="info">
        <div>Producto 2</div>
        <div>Precio: <span class="precio"></span></div>
      </div>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="info">
        <div>Producto 3</div>
        <div>Precio: <span class="precio"></span></div>
      </div>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div>Total: <span id="total">0 €</span></div>
  </div>
</div>
<script>
(function(){
  const cart = {}; // id -> quantity
  const linesDiv = document.getElementById('lines');
  const totalSpan = document.getElementById('total');

  function formatPrice(val){
    return Number(val).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  // Initialize price display
  document.querySelectorAll('.prod').forEach(prod=>{
    const precio = prod.dataset.precio;
    prod.querySelector('.precio').textContent = formatPrice(precio);
  });

  function updateTotal(){
    let total = 0;
    for(const id in cart){
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const precio = Number(prod.dataset.precio);
      total += precio * cart[id];
    }
    totalSpan.textContent = formatPrice(total);
  }

  function updateAddButton(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = Number(prod.dataset.stock);
    const btn = prod.querySelector(`button.add[data-id="${id}"]`);
    if(cart[id] >= stock){
      btn.disabled = true;
    }else{
      btn.disabled = false;
    }
  }

  function renderLine(id){
    const qty = cart[id];
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if(!line){
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `<span class="cant"></span> <button class="quitar" data-id="${id}">Quitar</button>`;
      linesDiv.appendChild(line);
    }
    line.querySelector('.cant').textContent = qty;
  }

  function removeLine(id){
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if(line) line.remove();
  }

  function addToCart(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = Number(prod.dataset.stock);
    if(!cart[id]) cart[id] = 0;
    if(cart[id] < stock){
      cart[id]++;
      renderLine(id);
      updateAddButton(id);
      updateTotal();
    }
  }

  function removeFromCart(id){
    if(cart[id]){
      cart[id]--;
      if(cart[id] <= 0){
        delete cart[id];
        removeLine(id);
      }else{
        renderLine(id);
      }
      updateAddButton(id);
      updateTotal();
    }
  }

  // Event listeners
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>addToCart(btn.dataset.id));
  });

  linesDiv.addEventListener('click',e=>{
    if(e.target.classList.contains('quitar')){
      removeFromCart(e.target.dataset.id);
    }
  });

  // Initial state
  updateTotal();
})();
</script>
</body>
</html>
