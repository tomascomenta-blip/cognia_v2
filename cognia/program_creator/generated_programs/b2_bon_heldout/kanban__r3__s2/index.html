<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;color:#333;}
.board{display:flex;flex-wrap:wrap;justify-content:space-between;padding:20px;}
.col{flex:1 1 30%;background:#fff;margin:10px;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);border-radius:5px;min-width:250px;}
.col h3{margin-top:0;font-size:1.2em;display:flex;align-items:center;justify-content:space-between;}
.card{background:#fafafa;border:1px solid #ddd;border-radius:4px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.card button{background:#008080;color:#fff;border:none;border-radius:3px;padding:3px 6px;margin-left:5px;cursor:pointer;font-size:0.9em;}
.card button:disabled{background:#aaa;cursor:not-allowed;}
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h3>Todo <span id="cont-todo"></span></h3>
    <div class="card" data-id="t1">
      <span>Tarea 1</span>
      <div>
        <button class="menos" disabled>←</button>
        <button class="mas">→</button>
      </div>
    </div>
    <div class="card" data-id="t2">
      <span>Tarea 2</span>
      <div>
        <button class="menos" disabled>←</button>
        <button class="mas">→</button>
      </div>
    </div>
    <div class="card" data-id="t3">
      <span>Tarea 3</span>
      <div>
        <button class="menos" disabled>←</button>
        <button class="mas">→</button>
      </div>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h3>Doing <span id="cont-doing"></span></h3>
  </div>
  <div class="col" data-col="done">
    <h3>Done <span id="cont-done"></span></h3>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  function updateCounters(){
    const cols = document.querySelectorAll('.col');
    cols.forEach(col=>{
      const count = col.querySelectorAll('.card').length;
      const id = 'cont-' + col.dataset.col;
      document.getElementById(id).textContent = count;
    });
  }
  function moveCard(card, direction){
    const currentCol = card.parentElement;
    const currentIndex = Array.from(currentCol.parentElement.children).indexOf(currentCol);
    let targetIndex = direction === 'right' ? currentIndex + 1 : currentIndex - 1;
    if (targetIndex < 0 || targetIndex > 2) return;
    const targetCol = currentCol.parentElement.children[targetIndex];
    const doingCol = currentCol.parentElement.querySelector('.col[data-col="doing"]');
    if (direction === 'right'){
      if (currentCol.dataset.col === 'todo'){
        if (doingCol.querySelectorAll('.card').length >= 2) return;
      }
    }
    card.parentElement.removeChild(card);
    targetCol.appendChild(card);
    updateCounters();
  }
  const buttons = document.querySelectorAll('.mas, .menos');
  buttons.forEach(btn=>{
    btn.addEventListener('click', function(){
      const card = btn.parentElement.parentElement;
      const dir = btn.classList.contains('mas') ? 'right' : 'left';
      moveCard(card, dir);
    });
  });
  updateCounters();
});
</script>
</body>
</html>
