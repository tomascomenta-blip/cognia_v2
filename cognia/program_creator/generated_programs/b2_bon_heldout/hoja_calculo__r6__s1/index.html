<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;padding:8px;font-size:1rem;text-align:right;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" value="1">
  <input class="celda" data-ref="B1" value="2">
  <input class="celda" data-ref="C1" value="3">
  <input class="celda" data-ref="A2" value="4">
  <input class="celda" data-ref="B2" value="5">
  <input class="celda" data-ref="C2" value="6">
  <input class="celda" data-ref="A3" value="7">
  <input class="celda" data-ref="B3" value="8">
  <input class="celda" data-ref="C3" value="=A1+B1">
</div>
<script>
class Spreadsheet {
  constructor() {
    this.cells = {};
    this.init();
  }
  init() {
    const inputs = document.querySelectorAll('.celda');
    inputs.forEach(el => {
      const ref = el.dataset.ref;
      const cell = {
        ref,
        el,
        formula: null,
        raw: el.value
      };
      if (el.value.startsWith('=')) {
        cell.formula = el.value;
      }
      this.cells[ref] = cell;
      el.addEventListener('change', () => {
        const newVal = el.value;
        cell.raw = newVal;
        if (newVal.startsWith('=')) {
          cell.formula = newVal;
        } else {
          cell.formula = null;
        }
        this.computeAll();
      });
    });
    this.computeAll();
  }
  computeAll() {
    Object.values(this.cells).forEach(cell => {
      if (cell.formula) {
        const val = this.computeCell(cell.ref, new Set());
        if (typeof val === 'number') {
          cell.el.value = val.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
        } else {
          cell.el.value = val; // 'CIRC' or 'ERR'
        }
      } else {
        cell.el.value = cell.raw;
      }
    });
  }
  computeCell(ref, visited) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const cell = this.cells[ref];
    if (!cell) return 0;
    if (!cell.formula) {
      const num = parseFloat(cell.raw.replace(',', '.'));
      return isNaN(num) ? 0 : num;
    }
    const expr = cell.formula.slice(1);
    try {
      const replaced = expr.replace(/[A-C][1-3]/g, match => {
        const val = this.computeCell(match, visited);
        if (val === 'CIRC') throw new Error('CIRC');
        if (val === 'ERR') throw new Error('ERR');
        return val;
      });
      const result = Function(`return ${replaced}`)();
      if (isNaN(result)) return 'ERR';
      return result;
    } catch (e) {
      if (e.message === 'CIRC') return 'CIRC';
      return 'ERR';
    }
  }
}
document.addEventListener('DOMContentLoaded', () => new Spreadsheet());
</script>
</body>
</html>
