<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Minesweeper 5x5</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;}
  #game{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:90vmin;max-width:400px;}
  .c{width:100%;aspect-ratio:1;background:#ccc;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;border:1px solid #999;}
  .c.abierta{background:#e0e0e0;cursor:default;font-weight:bold;}
  .c.bandera{background:#ffeb3b;}
  #estado{margin-top:10px;font-size:1.2rem;color:red;}
  #instructions{margin-top:10px;font-size:0.9rem;color:#555;text-align:center;}
</style>
</head>
<body>
<div id="instructions">Haz clic izquierdo para abrir, clic derecho para colocar bandera.</div>
<div id="game"></div>
<div id="estado"></div>
<script>
class Cell {
  constructor(index, element, game) {
    this.index = index;
    this.element = element;
    this.game = game;
    this.isMine = false;
    this.isOpen = false;
    this.isFlagged = false;
  }
  open() {
    if (this.isOpen || this.isFlagged || this.game.gameOver) return;
    this.isOpen = true;
    this.element.classList.add('abierta');
    if (this.isMine) {
      this.element.textContent = '💣';
      this.game.gameOver = true;
      document.getElementById('estado').textContent = 'perdiste';
      return;
    }
    const count = this.game.countAdjacentMines(this.index);
    this.element.textContent = count > 0 ? count : '';
    if (count === 0) {
      this.game.cascadeOpen(this.index);
    }
  }
  toggleFlag() {
    if (this.isOpen || this.game.gameOver) return;
    this.isFlagged = !this.isFlagged;
    if (this.isFlagged) {
      this.element.classList.add('bandera');
      this.element.textContent = '🚩';
    } else {
      this.element.classList.remove('bandera');
      this.element.textContent = '';
    }
  }
}
class Game {
  constructor() {
    this.cells = [];
    this.mines = new Set([6,12,18]); // posiciones fijas
    this.gameOver = false;
    this.init();
  }
  init() {
    const gameDiv = document.getElementById('game');
    for (let i=0;i<25;i++) {
      const div = document.createElement('div');
      div.className = 'c';
      div.dataset.i = i;
      const cell = new Cell(i, div, this);
      if (this.mines.has(i)) cell.isMine = true;
      div.addEventListener('click', () => cell.open());
      div.addEventListener('contextmenu', (e)=>{e.preventDefault(); cell.toggleFlag();});
      this.cells.push(cell);
      gameDiv.appendChild(div);
    }
  }
  getNeighbors(index) {
    const neighbors = [];
    const row = Math.floor(index/5);
    const col = index%5;
    for (let dr=-1; dr<=1; dr++) {
      for (let dc=-1; dc<=1; dc++) {
        if (dr===0 && dc===0) continue;
        const r = row+dr;
        const c = col+dc;
        if (r>=0 && r<5 && c>=0 && c<5) {
          neighbors.push(r*5 + c);
        }
      }
    }
    return neighbors;
  }
  countAdjacentMines(index) {
    const neighbors = this.getNeighbors(index);
    let count = 0;
    for (const n of neighbors) {
      if (this.mines.has(n)) count++;
    }
    return count;
  }
  cascadeOpen(startIndex) {
    const queue = [startIndex];
    const visited = new Set();
    while (queue.length) {
      const idx = queue.shift();
      if (visited.has(idx)) continue;
      visited.add(idx);
      const cell = this.cells[idx];
      if (cell.isOpen || cell.isFlagged) continue;
      cell.open();
      if (cell.isMine) continue;
      const count = this.countAdjacentMines(idx);
      if (count === 0) {
        const neighbors = this.getNeighbors(idx);
        for (const n of neighbors) {
          if (!visited.has(n)) queue.push(n);
        }
      }
    }
  }
}
document.addEventListener('DOMContentLoaded', () => {
  new Game();
});
</script>
</body>
</html>
