<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:1em;background:#f9f9f9;}
  table{width:100%;border-collapse:collapse;}
  td{padding:0;}
  input.celda{width:100%;height:2.5em;box-sizing:border-box;text-align:right;font-size:1em;padding:0 0.5em;}
</style>
</head>
<body>
<h1>Mini hoja de cálculo</h1>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  const grid = document.createElement('table');
  const tbody = document.createElement('tbody');
  for (let i=0;i<3;i++){
    const tr=document.createElement('tr');
    for (let j=0;j<3;j++){
      const td=document.createElement('td');
      const input=document.createElement('input');
      input.type='text';
      input.className='celda';
      input.dataset.ref=refs[i*3+j];
      input.value='';
      input.addEventListener('input',()=>handleInput(input));
      td.appendChild(input);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  grid.appendChild(tbody);
  document.body.appendChild(grid);
  const cellsByRef={};
  const cells=document.querySelectorAll('.celda');
  cells.forEach(c=>{cellsByRef[c.dataset.ref]=c;});
  function handleInput(cell){
    const val=cell.value.trim();
    if(val.startsWith('=')){
      cell.dataset.formula=val.slice(1).trim();
    }else{
      cell.dataset.formula='';
      const num=parseFloat(val.replace(/,/g,''));
      if(!isNaN(num)){
        cell.value=num.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
      }
    }
    recomputeAll();
  }
  function evaluateCell(cell,stack){
    const ref=cell.dataset.ref;
    if(stack.has(ref)){
      cell.value='CIRC';
      return;
    }
    const formula=cell.dataset.formula;
    if(!formula)return;
    stack.add(ref);
    let expr=formula.replace(/[A-C][1-3]/g,match=>{
      const r=cellsByRef[match];
      if(!r)return '0';
      if(r.dataset.formula){evaluateCell(r,stack);}
      if(r.value==='CIRC')return 'NaN';
      const v=parseFloat(r.value.replace(/,/g,''));
      return isNaN(v)?'0':v;
    });
    let result;
    try{
      result=Function(`return ${expr}`)();
      if(isNaN(result))throw new Error();
    }catch{
      cell.value='CIRC';
      stack.delete(ref);
      return;
    }
    cell.value=result.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
    stack.delete(ref);
  }
  function recomputeAll(){
    cells.forEach(c=>{if(c.dataset.formula){evaluateCell(c,new Set());}});
  }
  recomputeAll();
});
</script>
</body>
</html>
