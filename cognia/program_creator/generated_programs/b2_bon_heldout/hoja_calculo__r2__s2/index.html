<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    font-family: Arial, sans-serif;
    padding:20px;
    background:#f9f9f9;
  }
  h1{
    text-align:center;
    margin-bottom:10px;
  }
  p{
    text-align:center;
    margin-bottom:20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    max-width:400px;
    margin:auto;
  }
  .celda{
    width:100%;
    padding:5px;
    font-size:1rem;
    box-sizing:border-box;
    text-align:right;
    border:1px solid #ccc;
    border-radius:3px;
    outline:none;
    transition:border-color .2s;
  }
  .celda:focus{
    border-color:#66afe9;
  }
  input[value="CIRC"]{
    color:red;
    font-weight:bold;
  }
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo</h1>
<p>Escribe valores o fórmulas (ej. =A1+B1-A2) y observa cómo se actualizan las celdas dependientes.</p>
<div class="grid">
  <input class="celda" data-ref="A1" />
  <input class="celda" data-ref="A2" />
  <input class="celda" data-ref="A3" />
  <input class="celda" data-ref="B1" />
  <input class="celda" data-ref="B2" />
  <input class="celda" data-ref="B3" />
  <input class="celda" data-ref="C1" />
  <input class="celda" data-ref="C2" />
  <input class="celda" data-ref="C3" />
</div>

<script>
'use strict';
class Spreadsheet {
  constructor() {
    this.cells = new Map(); // ref -> cell object
    this.initCells();
  }
  initCells() {
    const inputs = document.querySelectorAll('.celda');
    inputs.forEach(el => {
      const ref = el.dataset.ref;
      const cell = {
        ref,
        element: el,
        formula: null,          // string starting with '=' or null
        dependents: new Set(),  // cells that depend on this cell
        dependencies: new Set() // cells this cell depends on
      };
      this.cells.set(ref, cell);
      el.addEventListener('input', () => this.handleInput(cell));
      el.addEventListener('blur', () => this.handleBlur(cell));
    });
  }
  handleInput(cell) {
    const val = cell.element.value.trim();
    if (val.startsWith('=')) {
      cell.formula = val;
    } else {
      cell.formula = null;
    }
    this.updateDependencies(cell);
    // Do not recalc yet; wait for blur
  }
  handleBlur(cell) {
    this.recalcAll(cell);
  }
  updateDependencies(cell) {
    // Remove old dependencies
    cell.dependencies.forEach(depRef => {
      const depCell = this.cells.get(depRef);
      if (depCell) depCell.dependents.delete(cell.ref);
    });
    // Compute new dependencies
    const newDeps = this.computeDependencies(cell.formula);
    newDeps.forEach(depRef => {
      const depCell = this.cells.get(depRef);
      if (depCell) depCell.dependents.add(cell.ref);
    });
    cell.dependencies = new Set(newDeps);
  }
  computeDependencies(formula) {
    if (!formula) return [];
    const matches = formula.match(/[A-C][1-3]/g);
    return matches ? matches : [];
  }
  recalcAll(startCell) {
    const stack = [];
    this.recalcCell(startCell, stack);
  }
  recalcCell(cell, stack) {
    if (stack.includes(cell.ref)) {
      // Circular reference detected
      cell.element.value = 'CIRC';
      return;
    }
    stack.push(cell.ref);
    if (cell.formula) {
      const result = this.evaluateFormula(cell, stack);
      cell.element.value = result;
    }
    // Recurse for dependents
    cell.dependents.forEach(depRef => {
      const depCell = this.cells.get(depRef);
      if (depCell) this.recalcCell(depCell, stack);
    });
    stack.pop();
  }
  evaluateFormula(cell, stack) {
    // Replace references with numeric values
    const expr = cell.formula.slice(1); // remove '='
    const replaced = expr.replace(/[A-C][1-3]/g, match => {
      const refCell = this.cells.get(match);
      if (!refCell) return '0';
      const val = this.evaluateCellValue(refCell, stack);
      if (val === 'CIRC') return 'CIRC';
      return val;
    });
    if (replaced.includes('CIRC')) return 'CIRC';
    let result;
    try {
      // eslint-disable-next-line no-new-func
      result = Function(`return ${replaced}`)();
    } catch (e) {
      return 'CIRC';
    }
    if (typeof result !== 'number' || isNaN(result)) return 'CIRC';
    // Format number with 2 decimals, thousands separator
    return result.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }
  evaluateCellValue(cell, stack) {
    if (cell.element.value === 'CIRC') return 'CIRC';
    if (cell.formula) {
      return this.evaluateFormula(cell, stack);
    }
    const num = parseFloat(cell.element.value);
    return isNaN(num) ? 0 : num;
  }
}
document.addEventListener('DOMContentLoaded', () => {
  new Spreadsheet();
});
</script>
</body>
</html>
