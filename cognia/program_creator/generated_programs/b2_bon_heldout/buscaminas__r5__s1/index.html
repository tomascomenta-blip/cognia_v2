<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5 con 3 minas fijas</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
#grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
  width: 100%;
  max-width: 400px;
}
.c {
  background: #ccc;
  border: 1px solid #999;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  cursor: pointer;
  user-select: none;
}
.c.abierta {
  background: #eee;
  cursor: default;
}
.c.bandera {
  background: #fdd;
}
#estado {
  margin-top: 10px;
  font-size: 1.2rem;
  color: red;
}
</style>
</head>
<body>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>
<script>
const cells = document.querySelectorAll('.c');
const estado = document.getElementById('estado');
const mines = new Set([6,12,18]);

// compute adjacent mine counts
const counts = new Array(25).fill(0);
for (let i=0; i<25; i++) {
  if (mines.has(i)) continue;
  let count = 0;
  const row = Math.floor(i/5);
  const col = i%5;
  for (let dr=-1; dr<=1; dr++) {
    for (let dc=-1; dc<=1; dc++) {
      if (dr===0 && dc===0) continue;
      const nr = row+dr;
      const nc = col+dc;
      if (nr>=0 && nr<5 && nc>=0 && nc<5) {
        const nIdx = nr*5+nc;
        if (mines.has(nIdx)) count++;
      }
    }
  }
  counts[i] = count;
}

cells.forEach(cell => {
  const i = parseInt(cell.dataset.i,10);
  cell.addEventListener('click', () => {
    if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    if (mines.has(i)) {
      cell.classList.add('abierta');
      cell.textContent = '💣';
      estado.textContent = 'perdiste';
      return;
    }
    openCell(i);
  });
  cell.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (cell.classList.contains('abierta')) return;
    if (cell.classList.contains('bandera')) {
      cell.classList.remove('bandera');
      cell.textContent = '';
    } else {
      cell.classList.add('bandera');
      cell.textContent = '🚩';
    }
  });
});

function openCell(startIdx) {
  const queue = [startIdx];
  const visited = new Set();
  while (queue.length) {
    const idx = queue.shift();
    if (visited.has(idx)) continue;
    visited.add(idx);
    const cell = cells[idx];
    if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
    cell.classList.add('abierta');
    const count = counts[idx];
    if (count > 0) {
      cell.textContent = count;
    } else {
      cell.textContent = '';
      const row = Math.floor(idx/5);
      const col = idx%5;
      for (let dr=-1; dr<=1; dr++) {
        for (let dc=-1; dc<=1; dc++) {
          if (dr===0 && dc===0) continue;
          const nr = row+dr;
          const nc = col+dc;
          if (nr>=0 && nr<5 && nc>=0 && nc<5) {
            const nIdx = nr*5+nc;
            if (!visited.has(nIdx)) queue.push(nIdx);
          }
        }
      }
    }
  }
}
</script>
</body>
</html>
