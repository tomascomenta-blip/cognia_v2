<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero Kanban</title>
<style>
  body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
    background:#eaeaea;
  }
  h1{
    text-align:center;
    padding:1rem 0;
    margin:0;
    background:#4a90e2;
    color:white;
  }
  .board{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:10px;
    justify-content:center;
  }
  .col{
    flex:1 1 250px;
    background:#f5f5f5;
    border-radius:5px;
    padding:10px;
    box-sizing:border-box;
  }
  .col h2{
    margin-top:0;
    font-size:1.2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card{
    background:white;
    border:1px solid #ccc;
    border-radius:3px;
    padding:8px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card button{
    margin-left:4px;
    padding:3px 6px;
    border:none;
    border-radius:3px;
    cursor:pointer;
    font-size:0.9rem;
  }
  .card button.mas{
    background:#4CAF50;
    color:white;
  }
  .card button.menos{
    background:#f44336;
    color:white;
  }
  @media(max-width:600px){
    .board{
      flex-direction:column;
      align-items:center;
    }
    .col{
      width:90%;
    }
  }
</style>
</head>
<body>
<h1>Tablero Kanban</h1>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo (<span id="cont-todo"></span>)</h2>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing (<span id="cont-doing"></span>)</h2>
  </div>
  <div class="col" data-col="done">
    <h2>Done (<span id="cont-done"></span>)</h2>
  </div>
</div>

<script>
  // Configurables
  const MAX_DOING = 2;
  const columns = ['todo', 'doing', 'done'];

  // Helper to create a card element
  function createCard(id) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = id;
    card.textContent = id;

    const btnMas = document.createElement('button');
    btnMas.className = 'mas';
    btnMas.textContent = '+';

    const btnMenos = document.createElement('button');
    btnMenos.className = 'menos';
    btnMenos.textContent = '-';

    card.appendChild(btnMas);
    card.appendChild(btnMenos);

    return card;
  }

  // Initial cards
  const todoCol = document.querySelector('.col[data-col="todo"]');
  ['t1', 't2', 't3'].forEach(id => {
    todoCol.appendChild(createCard(id));
  });

  // Update counters
  function updateCounters() {
    document.getElementById('cont-todo').textContent = document.querySelectorAll('.col[data-col="todo"] .card').length;
    document.getElementById('cont-doing').textContent = document.querySelectorAll('.col[data-col="doing"] .card').length;
    document.getElementById('cont-done').textContent = document.querySelectorAll('.col[data-col="done"] .card').length;
  }

  // Move card logic
  function moveCard(card, direction) {
    const currentCol = card.parentElement.dataset.col;
    const currentIndex = columns.indexOf(currentCol);
    const newIndex = direction === 'right' ? currentIndex + 1 : currentIndex - 1;

    if (newIndex < 0 || newIndex >= columns.length) return; // out of bounds

    const newCol = columns[newIndex];

    // WIP rule: cannot add to doing if it's full
    if (currentCol === 'todo' && newCol === 'doing' && document.querySelectorAll('.col[data-col="doing"] .card').length >= MAX_DOING) {
      return;
    }

    // Move the card
    const targetColDiv = document.querySelector('.col[data-col="' + newCol + '"]');
    targetColDiv.appendChild(card);
    updateCounters();
  }

  // Event delegation for buttons
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('mas')) {
      moveCard(e.target.parentElement, 'right');
    } else if (e.target.classList.contains('menos')) {
      moveCard(e.target.parentElement, 'left');
    }
  });

  // Initial counter update
  updateCounters();
</script>
</body>
</html>
