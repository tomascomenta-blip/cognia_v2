<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:0;}
.container{display:flex;flex-wrap:wrap;gap:20px;padding:20px;max-width:1200px;margin:auto;}
.products{flex:1 1 60%;display:flex;flex-direction:column;gap:15px;}
.prod{background:#fff;border:1px solid #ddd;border-radius:8px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.prod h3{margin-top:0;margin-bottom:8px;font-size:1.2em;color:#333;}
.prod p{margin:4px 0;color:#555;}
.prod button.add{background:#007bff;color:#fff;border:none;border-radius:4px;padding:8px 12px;cursor:pointer;}
.prod button.add:disabled{background:#bbb;cursor:not-allowed;}
.cart{flex:1 1 35%;background:#fff;border:1px solid #ddd;border-radius:8px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.cart h2{margin-top:0;font-size:1.3em;color:#333;}
.linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:8px;}
.linea .name{flex:1;color:#333;}
.linea .cant{margin:0 10px;font-weight:bold;}
.linea button.quitar{background:#007bff;color:#fff;border:none;border-radius:4px;padding:6px 10px;cursor:pointer;}
.total{font-weight:bold;font-size:1.1em;margin-top:15px;}
#total{color:#007bff;}
@media(max-width:768px){
.container{flex-direction:column;}
.products,.cart{flex:1 1 100%;}
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p>Precio: <span class="precio">100,00 €</span></p>
      <p>Stock: <span class="stock">2</span></p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p>Precio: <span class="precio">50,00 €</span></p>
      <p>Stock: <span class="stock">3</span></p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p>Precio: <span class="precio">25,00 €</span></p>
      <p>Stock: <span class="stock">1</span></p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cart = {}; // {id:{qty,price,stock,name}}
  const cartLines = document.getElementById('cart-lines');
  const totalEl = document.getElementById('total');

  function formatCurrency(val){
    return Number(val).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  }

  function updateTotal(){
    let sum = 0;
    for(const id in cart){
      sum += cart[id].qty * cart[id].price;
    }
    totalEl.textContent = formatCurrency(sum);
  }

  function updateLine(id){
    const line = cartLines.querySelector('.linea[data-id="'+id+'"]');
    if(cart[id].qty > 0){
      if(line){
        line.querySelector('.cant').textContent = cart[id].qty;
      }else{
        const prodEl = document.querySelector('.prod[data-id="'+id+'"]');
        const name = prodEl.querySelector('h3').textContent;
        const newLine = document.createElement('div');
        newLine.className = 'linea';
        newLine.dataset.id = id;
        newLine.innerHTML = '<span class="name">'+name+'</span><span class="cant">'+cart[id].qty+'</span><button class="quitar" data-id="'+id+'">Quitar</button>';
        cartLines.appendChild(newLine);
        newLine.querySelector('.quitar').addEventListener('click', removeHandler);
      }
    }else{
      if(line){
        line.remove();
      }
    }
    // enable/disable add button
    const addBtn = document.querySelector('.prod[data-id="'+id+'"] .add');
    if(cart[id].qty >= cart[id].stock){
      addBtn.disabled = true;
    }else{
      addBtn.disabled = false;
    }
  }

  function addHandler(e){
    const id = e.target.dataset.id;
    const prodEl = document.querySelector('.prod[data-id="'+id+'"]');
    const price = parseFloat(prodEl.dataset.precio);
    const stock = parseInt(prodEl.dataset.stock,10);
    if(!cart[id]){
      cart[id] = {qty:0, price:price, stock:stock, name:prodEl.querySelector('h3').textContent};
    }
    if(cart[id].qty < stock){
      cart[id].qty += 1;
      updateLine(id);
      updateTotal();
    }
  }

  function removeHandler(e){
    const id = e.target.dataset.id;
    if(cart[id] && cart[id].qty > 0){
      cart[id].qty -= 1;
      updateLine(id);
      updateTotal();
    }
  }

  // attach add listeners
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click', addHandler);
  });
});
</script>
</body>
</html>
