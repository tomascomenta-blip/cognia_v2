<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f0f0f0;}
  #contenedor{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:400px;margin:auto;}
  .c{background:#ccc;border:1px solid #999;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;}
  .c.abierta{background:#eee;pointer-events:none;}
  .c.bandera{color:red;}
  #estado{margin-top:1rem;text-align:center;font-weight:bold;}
</style>
</head>
<body>
<div id="contenedor"></div>
<div id="estado"></div>
<script>
(()=>{
  const mines=new Set([6,12,18]);
  const cont=document.getElementById('contenedor');
  const estado=document.getElementById('estado');
  const cells=[];
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='c';
    div.dataset.i=i;
    div.textContent='';
    cont.appendChild(div);
    cells.push(div);
  }
  // precompute neighbor mine counts
  const dirs=[-1,0,1];
  cells.forEach(cell=>{
    const i=parseInt(cell.dataset.i);
    const r=Math.floor(i/5),c=i%5;
    let count=0;
    dirs.forEach(dr=>{
      dirs.forEach(dc=>{
        if(dr===0&&dc===0)return;
        const nr=r+dr,nc=c+dc;
        if(nr<0||nr>4||nc<0||nc>4)return;
        const idx=nr*5+nc;
        if(mines.has(idx))count++;
      });
    });
    cell.dataset.neighborMines=count;
  });
  const openCell=(cell)=>{
    const i=parseInt(cell.dataset.i);
    if(cell.classList.contains('bandera')||cell.classList.contains('abierta'))return;
    if(mines.has(i)){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      return;
    }
    cell.classList.add('abierta');
    const cnt=parseInt(cell.dataset.neighborMines);
    cell.textContent=cnt>0?cnt:'';
    if(cnt===0)flood(i);
  };
  const flood=(i)=>{
    const r=Math.floor(i/5),c=i%5;
    dirs.forEach(dr=>{
      dirs.forEach(dc=>{
        if(dr===0&&dc===0)return;
        const nr=r+dr,nc=c+dc;
        if(nr<0||nr>4||nc<0||nc>4)return;
        const idx=nr*5+nc;
        const ncell=cells[idx];
        if(ncell.classList.contains('abierta')||ncell.classList.contains('bandera'))return;
        ncell.classList.add('abierta');
        const cnt=parseInt(ncell.dataset.neighborMines);
        ncell.textContent=cnt>0?cnt:'';
        if(cnt===0)flood(idx);
      });
    });
  };
  cells.forEach(cell=>{
    cell.addEventListener('click',e=>{openCell(cell);});
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(cell.classList.contains('abierta'))return;
      if(cell.classList.contains('bandera')){
        cell.classList.remove('bandera');
        cell.textContent='';
      }else{
        cell.classList.add('bandera');
        cell.textContent='🚩';
      }
    });
  });
})();
</script>
</body>
</html>
