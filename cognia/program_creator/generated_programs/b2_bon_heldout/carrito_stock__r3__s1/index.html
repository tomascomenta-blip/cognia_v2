
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:#f0f0f0;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
  }
  .prod{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    width:200px;
    text-align:center;
    opacity:0;
    transform:translateX(-20px);
    animation:slideIn 0.5s forwards;
  }
  .prod:nth-child(1){animation-delay:0s;}
  .prod:nth-child(2){animation-delay:0.2s;}
  .prod:nth-child(3){animation-delay:0.4s;}
  .prod h3{margin:0 0 10px;}
  .prod button{
    margin-top:10px;
    padding:5px 10px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  .prod button:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  .cart{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    width:300px;
    min-height:200px;
    opacity:0;
    animation:fadeIn 0.5s forwards;
    animation-delay:0.6s;
  }
  .cart h2{margin-top:0;}
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:5px 0;
    padding:5px;
    background:#f9f9f9;
    border-radius:4px;
    opacity:0;
    animation:fadeIn 0.3s forwards;
  }
  .linea button{
    padding:2px 6px;
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateX(-20px);}
    to{opacity:1;transform:translateX(0);}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>

<div class="prod" data-id="p1" data-precio="100" data-stock="2">
  <h3>Producto 1</h3>
  <p>Precio: 100</p>
  <p>Stock: 2</p>
  <button class="add" data-id="p1">Añadir</button>
</div>

<div class="prod" data-id="p2" data-precio="50" data-stock="3">
  <h3>Producto 2</h3>
  <p>Precio: 50</p>
  <p>Stock: 3</p>
  <button class="add" data-id="p2">Añadir</button>
</div>

<div class="prod" data-id="p3" data-precio="25" data-stock="1">
  <h3>Producto 3</h3>
  <p>Precio: 25</p>
  <p>Stock: 1</p>
  <button class="add" data-id="p3">Añadir</button>
</div>

<div class="cart">
  <h2>Carrito</h2>
  <div id="lines"></div>
  <p>Total: <span id="total">0</span></p>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const products = document.querySelectorAll('.prod');
  const linesContainer = document.getElementById('lines');
  const totalSpan = document.getElementById('total');
  const cart = {};

  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      total += price * cart[id];
    }
    totalSpan.textContent = total;
  }

  function renderLine(id) {
    const quantity = cart[id];
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if (!line) {
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <span class="name">${id}</span> x <span class="cant">${quantity}</span>
        <button class="quitar" data-id="${id}">-</button>
      `;
      linesContainer.appendChild(line);
    } else {
      line.querySelector('.cant').textContent = quantity;
    }
  }

  function removeLine(id) {
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if (line) line.remove();
  }

  function updateAddButton(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const addBtn = prod.querySelector(`.add[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    addBtn.disabled = cart[id] >= stock;
  }

  function handleAdd(e) {
    const id = e.target.dataset.id;
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    if (!cart[id]) cart[id] = 0;
    if (cart[id] < stock) {
      cart[id]++;
      renderLine(id);
      updateAddButton(id);
      updateTotal();
    }
  }

  function handleRemove(e) {
    const id = e.target.dataset.id;
    if (!cart[id]) return;
    cart[id]--;
    if (cart[id] <= 0) {
      delete cart[id];
      removeLine(id);
    } else {
      renderLine(id);
    }
    updateAddButton(id);
    updateTotal();
  }

  products.forEach(prod => {
    const addBtn = prod.querySelector('.add');
    addBtn.addEventListener('click', handleAdd);
  });

  linesContainer.addEventListener('click', e => {
    if (e.target.classList.contains('quitar')) {
      handleRemove(e);
    }
  });
});
</script>
</body>
</html>
