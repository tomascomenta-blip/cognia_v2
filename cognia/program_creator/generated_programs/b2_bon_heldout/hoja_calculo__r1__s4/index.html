<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f9f9f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    grid-gap:5px;
    padding:10px;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
    border-radius:4px;
  }
  .celda{
    width:80px;
    height:30px;
    border:1px solid #ccc;
    text-align:right;
    padding:5px;
    font-size:14px;
    box-sizing:border-box;
    background:#fff;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.05);
  }
  @media (max-width:400px){
    .grid{
      grid-template-columns:repeat(3,1fr);
    }
    .celda{
      width:100%;
    }
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" />
  <input type="text" class="celda" data-ref="A2" />
  <input type="text" class="celda" data-ref="A3" />
  <input type="text" class="celda" data-ref="B1" />
  <input type="text" class="celda" data-ref="B2" />
  <input type="text" class="celda" data-ref="B3" />
  <input type="text" class="celda" data-ref="C1" />
  <input type="text" class="celda" data-ref="C2" />
  <input type="text" class="celda" data-ref="C3" />
</div>

<script>
(() => {
  const cells = {}; // map ref -> cell object

  // Initialize cells
  document.querySelectorAll('input.celda').forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = {
      ref,
      element: el,
      formula: null,   // raw formula string starting with '='
      value: null,     // current evaluated value or raw string
      dependents: new Set(), // cells that depend on this cell
      references: new Set()  // cells this cell references
    };

    // Input event handler
    el.addEventListener('input', () => {
      const val = el.value.trim();
      const cell = cells[ref];
      if (val.startsWith('=')) {
        cell.formula = val;
        cell.value = null; // will be computed
      } else {
        cell.formula = null;
        cell.value = val;
      }
      // Update dependencies
      updateDependencies(cell);
      // Recalculate this cell and propagate
      evaluateCell(cell, new Set());
    });
  });

  // Update dependency graph for a cell
  function updateDependencies(cell) {
    // Remove from old references
    cell.references.forEach(r => {
      const refCell = cells[r];
      if (refCell) refCell.dependents.delete(cell);
    });
    cell.references.clear();

    if (!cell.formula) return;

    const refs = cell.formula.slice(1).match(/[A-C][1-3]/g) || [];
    refs.forEach(r => {
      if (cells[r]) {
        cell.references.add(r);
        cells[r].dependents.add(cell);
      }
    });
  }

  // Evaluate a cell recursively
  function evaluateCell(cell, stack) {
    if (stack.has(cell.ref)) {
      // Circular reference detected
      cell.value = 'CIRC';
      cell.element.value = 'CIRC';
      return;
    }
    stack.add(cell.ref);

    if (!cell.formula) {
      // Plain value, nothing to compute
      stack.delete(cell.ref);
      return;
    }

    // Build expression by replacing references with their values
    let expr = cell.formula.slice(1);
    const refs = expr.match(/[A-C][1-3]/g) || [];
    for (const r of refs) {
      const refCell = cells[r];
      if (!refCell) continue;
      evaluateCell(refCell, stack);
      if (refCell.value === 'CIRC') {
        cell.value = 'CIRC';
        cell.element.value = 'CIRC';
        stack.delete(cell.ref);
        return;
      }
      const val = parseFloat(refCell.value);
      const num = isNaN(val) ? 0 : val;
      // Replace all occurrences of the reference
      const regex = new RegExp(r, 'g');
      expr = expr.replace(regex, num);
    }

    // Evaluate the numeric expression
    let result;
    try {
      // eslint-disable-next-line no-eval
      result = eval(expr);
      if (typeof result !== 'number' || !isFinite(result)) throw new Error();
    } catch {
      result = 'CIRC';
    }

    cell.value = result;
    cell.element.value = result;

    stack.delete(cell.ref);

    // Propagate to dependents
    cell.dependents.forEach(dep => {
      evaluateCell(dep, new Set());
    });
  }

  // Initial evaluation of all cells (in case some have formulas pre-filled)
  Object.values(cells).forEach(cell => {
    if (cell.formula) {
      updateDependencies(cell);
      evaluateCell(cell, new Set());
    }
  });
})();
</script>
</body>
</html>
