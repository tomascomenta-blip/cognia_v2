
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#fafafa;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:30px;
  }
  #grid{
    width:260px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
  }
  .c{
    width:50px;
    height:50px;
    background:#ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    animation:fadeIn 0.5s ease forwards;
    animation-delay:calc(var(--i)*0.05s);
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera{
    background:#ffeb3b;
  }
  .c.abierta[data-mine="true"]{
    background:#f44336;
    color:#fff;
  }
  #estado{
    margin-top:15px;
    font-size:22px;
    color:#d32f2f;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:scale(0.8);}
    to{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>

<script>
(() => {
  const size = 5;
  const total = size*size;
  const minePositions = [6,12,18];
  const grid = document.getElementById('grid');
  const estado = document.getElementById('estado');
  const mines = Array(total).fill(false);
  minePositions.forEach(i=>mines[i]=true);
  const counts = Array(total).fill(0);
  const opened = Array(total).fill(false);
  const flagged = Array(total).fill(false);
  let gameOver = false;

  // Precompute adjacent mine counts
  for(let i=0;i<total;i++){
    let r=Math.floor(i/size), c=i%size;
    let cnt=0;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        let nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<size&&nc>=0&&nc<size){
          let idx=nr*size+nc;
          if(mines[idx])cnt++;
        }
      }
    }
    counts[i]=cnt;
  }

  // Create cells
  for(let i=0;i<total;i++){
    const cell=document.createElement('div');
    cell.className='c';
    cell.dataset.i=i;
    cell.dataset.mine=mines[i];
    cell.style.setProperty('--i',i);
    cell.addEventListener('click',e=>onLeftClick(i));
    cell.addEventListener('contextmenu',e=>{e.preventDefault();onRightClick(i);});
    grid.appendChild(cell);
  }

  function onLeftClick(i){
    if(gameOver||flagged[i]||opened[i])return;
    const cell=document.querySelector(`.c[data-i="${i}"]`);
    if(mines[i]){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      gameOver=true;
      revealAllMines();
      return;
    }
    openCell(i);
  }

  function onRightClick(i){
    if(opened[i])return;
    const cell=document.querySelector(`.c[data-i="${i}"]`);
    if(flagged[i]){
      flagged[i]=false;
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      flagged[i]=true;
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }

  function openCell(i){
    if(opened[i]||flagged[i])return;
    const cell=document.querySelector(`.c[data-i="${i}"]`);
    opened[i]=true;
    cell.classList.add('abierta');
    if(counts[i]>0){
      cell.textContent=counts[i];
    }else{
      cell.textContent='';
      // cascade
      const queue=[i];
      while(queue.length){
        const idx=queue.shift();
        const r=Math.floor(idx/size), c=idx%size;
        for(let dr=-1;dr<=1;dr++){
          for(let dc=-1;dc<=1;dc++){
            if(dr===0&&dc===0)continue;
            let nr=r+dr, nc=c+dc;
            if(nr>=0&&nr<size&&nc>=0&&nc<size){
              let nIdx=nr*size+nc;
              if(!opened[nIdx] && !flagged[nIdx]){
                const nCell=document.querySelector(`.c[data-i="${nIdx}"]`);
                opened[nIdx]=true;
                nCell.classList.add('abierta');
                if(counts[nIdx]>0){
                  nCell.textContent=counts[nIdx];
                }else{
                  nCell.textContent='';
                  queue.push(nIdx);
                }
              }
            }
          }
        }
      }
    }
  }

  function revealAllMines(){
    for(let i=0;i<total;i++){
      if(mines[i]){
        const cell=document.querySelector(`.c[data-i="${i}"]`);
        cell.classList.add('abierta');
        cell.textContent='💣';
      }
    }
  }
})();
</script>
</body>
</html>
