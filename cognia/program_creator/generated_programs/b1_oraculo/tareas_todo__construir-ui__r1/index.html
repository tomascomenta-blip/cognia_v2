
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
        :root {
            --color-bg: #f0f0f0;
            --color-text: #333;
            --color-accent: #4a90e2;
            --color-border: #ddd;
            --color-hover: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.8s ease-out;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, var(--color-accent), #6a11cb);
            opacity: 0.1;
            border-radius: 50%;
            animation: rotate 6s linear infinite;
        }

        input[type="text"] {
            width: 70%;
            padding: 12px 15px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.3);
        }

        button {
            width: 25%;
            padding: 12px 15px;
            background-color: var(--color-accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background-color: #3a76d7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, var(--color-accent), transparent);
            transform: rotate(45deg);
            transition: transform 0.5s ease;
        }

        button:hover::before {
            transform: rotate(0deg);
        }

        ul {
            list-style: none;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            padding: 0;
        }

        .tarea {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: white;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }

        .tarea:hover {
            background-color: var(--color-hover);
            transform: translateX(5px);
        }

        .tarea.completed {
            text-decoration: line-through;
            color: #888;
            opacity: 0.7;
        }

        .tarea.completed:hover {
            transform: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-on-load {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <h1>Lista de Tareas</h1>
    <div class="container">
        <input type="text" id="nueva" placeholder="Escribe una nueva tarea..." autocomplete="off" class="animate-on-load">
        <button id="anadir" class="animate-on-load">Añadir</button>
        <ul id="lista"></ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nuevaTarea = document.getElementById('nueva');
            const anadirBtn = document.getElementById('anadir');
            const lista = document.getElementById('lista');

            anadirBtn.addEventListener('click', agregarTarea);
            nuevaTarea.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    agregarTarea();
                }
            });

            function agregarTarea() {
                const texto = nuevaTarea.value.trim();
                if (texto === '') return;

                const li = document.createElement('li');
                li.className = 'tarea';
                li.innerHTML = `
                    <span>${texto}</span>
                    <button class="completar">✔</button>
                `;
                li.querySelector('.completar').addEventListener('click', function() {
                    li.classList.toggle('completed');
                });

                lista.appendChild(li);
                nuevaTarea.value = '';
                nuevaTarea.focus();
            }

            // Animación al cargar la página
            const elements = document.querySelectorAll('.animate-on-load');
            elements.forEach(el => {
                el.style.opacity = 0;
                el.style.transform = 'translateY(20px)';
                el.offsetHeight; // Trigger reflow
                el.style.opacity = 1;
                el.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
