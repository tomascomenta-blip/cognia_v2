
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
  body{
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
  }
  #calculator{
    width:260px;
    background:#222;
    border-radius:10px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    animation:slideIn 1s ease-out;
  }
  #pantalla{
    height:50px;
    background:#000;
    color:#0f0;
    font-size:1.8em;
    text-align:right;
    padding:10px;
    border-radius:5px;
    margin-bottom:10px;
    overflow:hidden;
    white-space:nowrap;
  }
  .tecla{
    width:60px;
    height:60px;
    margin:5px;
    font-size:1.5em;
    color:#fff;
    background:#444;
    border:none;
    border-radius:5px;
    cursor:pointer;
    transition:background .2s;
  }
  .tecla:hover{background:#555;}
  .tecla:active{background:#666;}
  .grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
  }
  @keyframes slideIn{
    from{transform:translateX(-100%); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
</style>
</head>
<body>
<div id="calculator">
  <div id="pantalla"></div>
  <div class="grid">
    <button class="tecla" data-t="7">7</button>
    <button class="tecla" data-t="8">8</button>
    <button class="tecla" data-t="9">9</button>
    <button class="tecla" data-t="/">/</button>

    <button class="tecla" data-t="4">4</button>
    <button class="tecla" data-t="5">5</button>
    <button class="tecla" data-t="6">6</button>
    <button class="tecla" data-t="*">*</button>

    <button class="tecla" data-t="1">1</button>
    <button class="tecla" data-t="2">2</button>
    <button class="tecla" data-t="3">3</button>
    <button class="tecla" data-t="-">-</button>

    <button class="tecla" data-t="0">0</button>
    <button class="tecla" data-t=".">.</button>
    <button class="tecla" data-t="=">=</button>
    <button class="tecla" data-t="+">+</button>

    <button class="tecla" data-t="C" style="width:250px;background:#a00;">C</button>
  </div>
</div>

<script>
  (function(){
    const pantalla=document.getElementById('pantalla');
    let expr='';
    document.querySelectorAll('.tecla').forEach(btn=>{
      btn.addEventListener('click',()=>{handle(btn.dataset.t);});
    });

    function handle(val){
      if(val==='C'){
        expr='';
        pantalla.textContent='';
      }else if(val==='='){
        try{
          // Evaluate safely: only allow numbers and operators
          const safeExpr=expr.replace(/[^0-9+\-*/.]/g,'');
          const result=eval(safeExpr);
          pantalla.textContent=result;
          expr=result.toString();
        }catch(e){
          pantalla.textContent='Error';
          expr='';
        }
      }else{
        expr+=val;
        pantalla.textContent=expr;
      }
    }
  })();
</script>
</body>
</html>
