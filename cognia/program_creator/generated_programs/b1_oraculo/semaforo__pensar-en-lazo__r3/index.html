
<!DOCTYPE html>
<html>
<head>
    <title>Traffic Light</title>
    <style>
        #luz {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            background-color: #000;
        }
    </style>
</head>
<body>
    <div id="luz" data-color="rojo"></div>
    <button id="avanzar">Advance</button>
    
    <script>
        // Color definitions
        const colors = ['rojo', 'verde', 'amarillo'];
        const colorMap = {
            'rojo': '#FF0000',
            'verde': '#00FF00',
            'amarillo': '#FFFF00'
        };
        
        // Initial background color
        const lightElement = document.getElementById('luz');
        lightElement.style.background = colorMap[lightElement.dataset.color];
        
        // Button click handler
        document.getElementById('avanzar').addEventListener('click', () => {
            // Get current color index
            const currentColor = lightElement.dataset.color;
            const currentIndex = colors.indexOf(currentColor);
            const nextIndex = (currentIndex + 1) % colors.length;
            const nextColor = colors[nextIndex];
            
            // Update data-color attribute
            lightElement.dataset.color = nextColor;
            // Update background color
            lightElement.style.background = colorMap[nextColor];
        });
    </script>
</body>
</html>
