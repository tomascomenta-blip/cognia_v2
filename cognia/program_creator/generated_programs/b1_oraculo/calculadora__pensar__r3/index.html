
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  .calculadora{
    background:#222;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.5);
    width:260px;
    animation:fadeIn 1s ease-out;
  }
  #pantalla{
    background:#000;
    color:#0f0;
    font-size:2rem;
    padding:10px;
    border-radius:5px;
    text-align:right;
    margin-bottom:10px;
    min-height:40px;
    overflow:hidden;
  }
  .tecla{
    background:#444;
    color:#fff;
    border:none;
    padding:15px;
    margin:5px;
    font-size:1.2rem;
    border-radius:5px;
    cursor:pointer;
    transition:background 0.2s;
  }
  .tecla:hover{background:#555;}
  @keyframes fadeIn{
    0%{opacity:0;transform:scale(0.9);}
    100%{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div class="calculadora">
  <div id="pantalla"></div>
  <div class="fila">
    <button class="tecla" data-t="7">7</button>
    <button class="tecla" data-t="8">8</button>
    <button class="tecla" data-t="9">9</button>
    <button class="tecla" data-t="/">/</button>
  </div>
  <div class="fila">
    <button class="tecla" data-t="4">4</button>
    <button class="tecla" data-t="5">5</button>
    <button class="tecla" data-t="6">6</button>
    <button class="tecla" data-t="*">*</button>
  </div>
  <div class="fila">
    <button class="tecla" data-t="1">1</button>
    <button class="tecla" data-t="2">2</button>
    <button class="tecla" data-t="3">3</button>
    <button class="tecla" data-t="-">-</button>
  </div>
  <div class="fila">
    <button class="tecla" data-t="0">0</button>
    <button class="tecla" data-t="C">C</button>
    <button class="tecla" data-t="=">=</button>
    <button class="tecla" data-t="+">+</button>
  </div>
</div>

<script>
  const pantalla = document.getElementById('pantalla');
  let expr = '';
  document.querySelectorAll('.tecla').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const val = btn.dataset.t;
      if(val==='C'){expr='';pantalla.textContent='';}
      else if(val==='='){
        try{
          expr = eval(expr).toString();
          pantalla.textContent = expr;
        }catch(e){
          pantalla.textContent = 'Error';
          expr = '';
        }
      }else{
        expr += val;
        pantalla.textContent = expr;
      }
    });
  });
</script>
</body>
</html>
