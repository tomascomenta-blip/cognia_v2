
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscaminas 5x5</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #estado { margin-bottom: 10px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(5, 30px); gap: 2px; }
        .c { width: 30px; height: 30px; border: 1px solid #888; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .abierta { background-color: #ddd; }
        .bandera::after { content: "🚩"; position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>
    <div id="estado"></div>
    <div class="grid">
        <!-- 25 celdas -->
        <script>
            for (let i = 0; i < 25; i++) {
                document.write(`<div class="c" data-i="${i}"></div>`);
            }
        </script>
    </div>

    <script>
        const mines = [6, 12, 18];
        let cells = [];

        // Calcular vecinos para cada celda
        for (let i = 0; i < 25; i++) {
            let row = Math.floor(i / 5);
            let col = i % 5;
            let count = 0;
            
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    let nr = row + dr;
                    let nc = col + dc;
                    
                    if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
                        let neighborIndex = nr * 5 + nc;
                        if (mines.includes(neighborIndex)) count++;
                    }
                }
            }
            cells[i] = count;
        }

        // Manejar clic izquierdo
        document.querySelectorAll('.c').forEach(cell => {
            cell.addEventListener('click', function() {
                const i = parseInt(this.dataset.i);
                
                if (this.classList.contains('bandera') || this.classList.contains('abierta')) return;

                if (mines.includes(i)) {
                    this.classList.add('abierta');
                    document.getElementById('estado').textContent = 'perdiste';
                    return;
                }

                const count = cells[i];
                this.classList.add('abierta');
                
                if (count === 0) {
                    abrirCascada(this);
                } else {
                    this.textContent = count;
                }
            });
        });

        // Manejar clic derecho
        document.querySelectorAll('.c').forEach(cell => {
            cell.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                
                if (this.classList.contains('abierta')) return;
                
                this.classList.toggle('bandera');
            });
        });

        // Función para abrir en cascada
        function abrirCascada(startCell) {
            const queue = [startCell];
            
            while (queue.length > 0) {
                const cell = queue.shift();
                if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
                
                cell.classList.add('abierta');
                const i = parseInt(cell.dataset.i);
                const count = cells[i];
                
                if (count === 0) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            
                            const row = Math.floor(i / 5);
                            const col = i % 5;
                            const nr = row + dr;
                            const nc = col + dc;
                            
                            if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
                                const neighborIndex = nr * 5 + nc;
                                const neighborCell = document.querySelector(`[data-i="${neighborIndex}"]`);
                                
                                if (!neighborCell.classList.contains('abierta') && !neighborCell.classList.contains('bandera')) {
                                    queue.push(neighborCell);
                                }
                            }
                        }
                    }
                } else {
                    cell.textContent = count;
                }
            }
        }

        // Animación de carga
        document.querySelectorAll('.c').forEach(cell => {
            setTimeout(() => {
                if (!cell.classList.contains('bandera') && !cell.classList.contains('abierta')) {
                    cell.style.backgroundColor = '#e0e0e0';
                    setTimeout(() => {
                        cell.style.backgroundColor = '';
                    }, 300);
                }
            }, Math.random() * 1000);
        });
    </script>
</body>
</html>
