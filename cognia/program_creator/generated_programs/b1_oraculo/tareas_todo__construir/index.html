
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            width: 300px;
        }
        li {
            background-color: #fff;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        li:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Lista de Tareas</h1>
    <input type="text" id="nueva" placeholder="Nueva tarea">
    <button id="anadir">Añadir</button>
    <ul id="lista"></ul>

    <script>
        document.getElementById('anadir').addEventListener('click', function() {
            const nuevaTarea = document.getElementById('nueva').value.trim();
            if (nuevaTarea !== '') {
                const li = document.createElement('li');
                li.className = 'tarea';
                li.textContent = nuevaTarea;
                document.getElementById('lista').appendChild(li);
                document.getElementById('nueva').value = '';
            }
        });
    </script>
</body>
</html>
