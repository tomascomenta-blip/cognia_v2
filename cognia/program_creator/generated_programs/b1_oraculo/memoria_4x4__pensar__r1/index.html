
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    margin:0;
    padding-top:30px;
  }
  h1{margin:0 0 20px;}
  #moves{font-size:1.2rem;margin-bottom:15px;}
  #game-board{
    display:grid;
    grid-template-columns:repeat(4,80px);
    gap:10px;
    justify-content:center;
  }
  .tile{
    width:80px;height:80px;
    background:#444;
    color:#fff;
    font-size:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    position:relative;
    transform-style:preserve-3d;
    perspective:600px;
    /* animation */
    opacity:0;
    animation:fadeIn 0.5s ease forwards;
    animation-delay:calc(var(--i)*0.05s);
  }
  .tile::after{
    content:"";
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tile.revealed::after{
    content:attr(data-emoji);
  }
  .tile.matched::after{
    content:attr(data-emoji);
  }
  @keyframes fadeIn{
    from{opacity:0;transform:scale(0.8);}
    to{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<h1>Juego de Memoria 4x4</h1>
<div id="moves">Movimientos: 0</div>
<div id="game-board"></div>

<script>
(() => {
  const emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
  const board = document.getElementById('game-board');
  const movesEl = document.getElementById('moves');
  let moves = 0;
  let firstCard = null;
  let secondCard = null;
  let lockBoard = false;

  // Create shuffled array of 16 emojis (8 pairs)
  const cards = [...emojis, ...emojis];
  for(let i=cards.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }

  // Build tiles
  cards.forEach((emoji, idx) => {
    const tile = document.createElement('div');
    tile.classList.add('tile');
    tile.dataset.emoji = emoji;
    tile.style.setProperty('--i', idx);
    tile.addEventListener('click', () => handleClick(tile));
    board.appendChild(tile);
  });

  function handleClick(tile){
    if(lockBoard || tile.classList.contains('revealed') || tile.classList.contains('matched')) return;
    tile.classList.add('revealed');

    if(!firstCard){
      firstCard = tile;
      return;
    }
    secondCard = tile;
    moves++;
    movesEl.textContent = `Movimientos: ${moves}`;
    checkMatch();
  }

  function checkMatch(){
    const match = firstCard.dataset.emoji === secondCard.dataset.emoji;
    if(match){
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      resetTurn();
    }else{
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('revealed');
        secondCard.classList.remove('revealed');
        resetTurn();
      }, 1000);
    }
  }

  function resetTurn(){
    [firstCard, secondCard] = [null, null];
    lockBoard = false;
  }
})();
</script>
</body>
</html>
