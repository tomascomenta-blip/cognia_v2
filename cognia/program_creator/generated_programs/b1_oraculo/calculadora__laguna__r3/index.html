<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    #pantalla {
      width: 200px;
      height: 50px;
      border: 2px solid #333;
      text-align: right;
      padding: 10px;
      font-size: 24px;
      margin-bottom: 10px;
      background-color: #fff;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(4, 50px);
      gap: 5px;
    }

    .tecla {
      width: 50px;
      height: 50px;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid #333;
      background-color: #fff;
    }

    .tecla:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <div id="pantalla"></div>
  <div class="botones">
    <button class="tecla" data-t="7">
