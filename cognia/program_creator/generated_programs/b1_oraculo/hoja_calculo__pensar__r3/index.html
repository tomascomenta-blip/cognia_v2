
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 90px);
    grid-gap:8px;
    padding:12px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    animation:pulse 3s infinite;
  }
  .celda{
    width:90px;
    height:36px;
    padding:0 4px;
    font-size:16px;
    text-align:right;
    border:1px solid #ccc;
    border-radius:4px;
    transition:background 0.3s;
  }
  .celda:focus{
    outline:none;
    border-color:#4a90e2;
    background:#e8f4ff;
  }
  @keyframes pulse{
    0%{background:#fff;}
    50%{background:#e8f4ff;}
    100%{background:#fff;}
  }
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="1">
  <input class="celda" data-ref="A2" value="2">
  <input class="celda" data-ref="A3" value="3">
  <input class="celda" data-ref="B1" value="4">
  <input class="celda" data-ref="B2" value="5">
  <input class="celda" data-ref="B3" value="6">
  <input class="celda" data-ref="C1" value="7">
  <input class="celda" data-ref="C2" value="8">
  <input class="celda" data-ref="C3" value="9">
</div>

<script>
(function(){
  const cells = {}; // ref -> element
  document.querySelectorAll('.celda').forEach(el=>{
    cells[el.dataset.ref] = el;
  });

  function computeAll(){
    const cache = {}; // ref -> computed value

    function compute(ref, stack){
      if(stack.includes(ref)) return 'CIRC';
      if(cache[ref] !== undefined) return cache[ref];

      const el = cells[ref];
      const raw = el.value.trim();
      if(!raw.startsWith('=')){
        cache[ref] = raw;
        return raw;
      }

      const expr = raw.slice(1); // remove '='
      const refs = expr.match(/[A-C][1-3]/g) || [];
      let evalExpr = expr;

      for(const r of refs){
        const val = compute(r, [...stack, ref]);
        if(val === 'CIRC'){
          cache[ref] = 'CIRC';
          return 'CIRC';
        }
        const num = parseFloat(val) || 0;
        const re = new RegExp(r, 'g');
        evalExpr = evalExpr.replace(re, num);
      }

      let result;
      try{
        result = eval(evalExpr);
      }catch(e){
        result = 'CIRC';
      }
      cache[ref] = result;
      return result;
    }

    // compute every cell
    Object.keys(cells).forEach(ref=>{
      const val = compute(ref, []);
      const el = cells[ref];
      el.value = val;
      el.setAttribute('value', val);
    });
  }

  // initial calculation
  computeAll();

  // recalc on any change
  document.querySelectorAll('.celda').forEach(el=>{
    el.addEventListener('input', ()=>{
      computeAll();
    });
  });
})();
</script>
</body>
</html>
