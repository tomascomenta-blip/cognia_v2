
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #calculadora {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
            text-align: center;
        }
        #pantalla {
            background-color: #e0e0e0;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 24px;
            height: 50px;
            line-height: 50px;
            overflow: hidden;
        }
        .tecla {
            background-color: #ddd;
            border: none;
            border-radius: 5px;
            padding: 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .tecla:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div id="calculadora">
        <div id="pantalla">0</div>
        <div class="tecla" data-t="2">2</div>
        <div class="tecla" data-t="3">3</div>
        <div class="tecla" data-t="+">+</div>
        <div class="tecla" data-t="=">=</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pantalla = document.getElementById('pantalla');
            const teclas = document.querySelectorAll('.tecla');

            let valorActual = '';
            let operacion = '';
            let primerOperando = null;

            teclas.forEach(tecla => {
                tecla.addEventListener('click', () => {
                    const valor = tecla.getAttribute('data-t');

                    if (valor === '=') {
                        if (primerOperando !== null && operacion !== '') {
                            const segundoOperando = parseFloat(valorActual);
                            let resultado;

                            switch (operacion) {
                                case '+':
                                    resultado = primerOperando + segundoOperando;
                                    break;
                                case '-':
                                    resultado = primerOperando - segundoOperando;
                                    break;
                                case '*':
                                    resultado = primerOperando * segundoOperando;
                                    break;
                                case '/':
                                    resultado = primerOperando / segundoOperando;
                                    break;
                            }

                            pantalla.textContent = resultado;
                            valorActual = resultado;
                            operacion = '';
                            primerOperando = null;
                        }
                    } else if (['+', '-', '*', '/'].includes(valor)) {
                        if (valorActual !== '') {
                            primerOperando = parseFloat(valorActual);
                            operacion = valor;
                            valorActual = '';
                        }
                    } else {
                        valorActual += valor;
                        pantalla.textContent = valorActual;
                    }
                });
            });
        });
    </script>
</body>
</html>
