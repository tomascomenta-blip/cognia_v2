
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego de Memoria</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f0f0;
    }
    h1 { text-align: center; margin-bottom: 20px; }
    .counter { font-size: 24px; margin-bottom: 20px; text-align: center; }
    .board { display: grid; grid-template-columns: repeat(4, 80px); grid-gap: 10px; width: 360px; margin: 0 auto; }
    .tile {
      width: 80px;
      height: 80px;
      background: #333;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      transition: transform 0.5s;
    }
    .tile.flipped { background: #fff; }
    .tile.matched { background: #90EE90; cursor: default; }
  </style>
</head>
<body>
  <h1>Juego de Memoria</h1>
  <div class="counter">Movimientos: <span id="moves">0</span></div>
  <div class="board" id="board"></div>

  <script>
    const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🐺', '🐸', '🐵'];
    const pairs = [...emojis, ...emojis];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createBoard() {
      const board = document.getElementById('board');
      const shuffledPairs = shuffle(pairs);
      
      shuffledPairs.forEach((emoji, index) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.index = index;
        tile.dataset.emoji = emoji;
        board.appendChild(tile);
      });

      document.querySelectorAll('.tile').forEach(tile => {
        tile.addEventListener('click', flipCard);
      });
    }

    function flipCard(e) {
      if (lockBoard) return;
      
      const tile = e.target;
      if (tile.classList.contains('flipped') || tile.classList.contains('matched')) return;

      tile.classList.add('flipped');
      tile.textContent = tile.dataset.emoji;

      if (!firstCard) {
        firstCard = tile;
      } else {
        secondCard = tile;
        lockBoard = true;
        moves++;
        document.getElementById('moves').textContent = moves;

        checkMatch();
      }
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
      
      if (isMatch) {
        firstCard.classList.add('matched');
        secondCard.classList.add('matched');
        resetBoard();
      } else {
        setTimeout(() => {
          firstCard.classList.remove('flipped');
          secondCard.classList.remove('flipped');
          firstCard.textContent = '';
          secondCard.textContent = '';
          resetBoard();
        }, 1000);
      }
    }

    function resetBoard() {
      [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    createBoard();
  </script>
</body>
</html>
