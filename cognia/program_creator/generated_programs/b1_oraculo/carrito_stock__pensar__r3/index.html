
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .products{
    display:flex;
    gap:20px;
    margin-bottom:30px;
  }
  .prod{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    width:200px;
    text-align:center;
    opacity:0;
    animation:fadeIn .5s forwards;
    animation-delay:calc(var(--i)*.2s);
  }
  .prod:nth-child(1){--i:0;}
  .prod:nth-child(2){--i:1;}
  .prod:nth-child(3){--i:2;}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
  .cart{
    background:#fff;
    padding:15px;
    border-radius:8px;
    width:400px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    opacity:0;
    transform:translateX(20px);
    animation:cartIn .5s forwards;
    animation-delay:.6s;
  }
  @keyframes cartIn{
    from{opacity:0;transform:translateX(20px);}
    to{opacity:1;transform:translateX(0);}
  }
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:5px;
  }
  button{
    padding:5px 10px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    background:#007bff;
    color:#fff;
  }
  button:disabled{
    background:#ccc;
    cursor:not-allowed;
  }
  button.quitar{
    background:#dc3545;
  }
  #total{
    font-weight:bold;
    transition:color .3s;
  }
</style>
</head>
<body>
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p>Precio: 100</p>
      <p>Stock: 2</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p>Precio: 50</p>
      <p>Stock: 3</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p>Precio: 25</p>
      <p>Stock: 1</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>

  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <p>Total: <span id="total">0</span></p>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cart = {}; // id -> quantity
  const linesContainer = document.getElementById('lines');
  const totalSpan = document.getElementById('total');

  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const qty = cart[id];
      const price = parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
      total += qty * price;
    }
    totalSpan.textContent = total;
  }

  function updateLine(id) {
    const qty = cart[id];
    const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
    if (qty > 0) {
      if (!line) {
        const newLine = document.createElement('div');
        newLine.className = 'linea';
        newLine.dataset.id = id;
        newLine.innerHTML = `<span class="cant">${qty}</span> x <span class="name">${id}</span> <button class="quitar" data-id="${id}">-</button>`;
        linesContainer.appendChild(newLine);
        newLine.querySelector('.quitar').addEventListener('click', () => removeFromCart(id));
      } else {
        line.querySelector('.cant').textContent = qty;
      }
    } else {
      if (line) line.remove();
    }
  }

  function addToCart(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    const currentQty = cart[id] || 0;
    if (currentQty < stock) {
      cart[id] = currentQty + 1;
      updateLine(id);
      updateTotal();
      if (cart[id] === stock) {
        prod.querySelector(`.add[data-id="${id}"]`).disabled = true;
      }
    }
  }

  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    if (cart[id] < prod.dataset.stock) {
      prod.querySelector(`.add[data-id="${id}"]`).disabled = false;
    }
    updateLine(id);
    updateTotal();
  }

  document.querySelectorAll('.add').forEach(btn => {
    const id = btn.dataset.id;
    btn.addEventListener('click', () => addToCart(id));
  });
});
</script>
</body>
</html>
