<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo</title>
<style>
  body {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#222;
  }
  #luz {
    width:120px;
    height:120px;
    border-radius:50%;
    margin-bottom:20px;
    animation:pulse 2s infinite;
    transition:background-color 0.5s ease;
  }
  #luz[data-color="rojo"]   { background:red; }
  #luz[data-color="verde"]  { background:green; }
  #luz[data-color="ambar"]  { background:orange; }
  @keyframes pulse {
    0%, 100% { opacity:0.7; }
    50%     { opacity:1; }
  }
  button {
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="luz" data-color="rojo"></div>
<button id="avanzar">Avanzar</button>
<script>
  const luz = document.getElementById('luz');
  const btn = document.getElementById('avanzar');
  const colores = ['rojo', 'verde', 'ambar'];
  let idx = 0;
  btn.addEventListener('click', () => {
    idx = (idx + 1) % colores.length;
    luz.dataset.color = colores[idx];
  });
</script>
</body>
</html>
