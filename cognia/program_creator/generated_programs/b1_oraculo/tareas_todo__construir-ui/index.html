
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <style>
        :root {
            --color-bg: #f0f8ff;
            --color-text: #2c3e50;
            --color-accent: #3498db;
            --color-border: #e0e0e0;
            --color-hover: #ecf0f1;
            --color-completed: #95a5a6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--color-accent);
            animation: fadeIn 1s ease-in-out;
        }

        .task-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: slideIn 0.8s ease-out;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-hover);
        }

        .task-header h2 {
            font-size: 1.5rem;
            margin: 0;
        }

        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #nueva {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        #nueva:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }

        #anadir {
            background: var(--color-accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #anadir:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        #anadir:active {
            transform: translateY(0);
        }

        #lista {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .tarea {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--color-border);
            transition: all 0.3s ease;
        }

        .tarea:last-child {
            border-bottom: none;
        }

        .tarea input[type="checkbox"] {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .tarea span {
            flex: 1;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .tarea.completed span {
            text-decoration: line-through;
            color: var(--color-completed);
        }

        .tarea.completed input[type="checkbox"] {
            accent-color: var(--color-completed);
        }

        .tarea:hover {
            background-color: var(--color-hover);
        }

        .tarea:hover span {
            color: var(--color-accent);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1>Lista de Tareas</h1>
    <div class="task-container">
        <div class="task-header">
            <h2>Tareas</h2>
        </div>
        <div class="task-input">
            <input type="text" id="nueva" placeholder="Escribe una nueva tarea...">
            <button id="anadir">Añadir</button>
        </div>
        <ul id="lista"></ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nuevaTarea = document.getElementById('nueva');
            const anadirBtn = document.getElementById('anadir');
            const lista = document.getElementById('lista');

            anadirBtn.addEventListener('click', agregarTarea);
            nuevaTarea.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    agregarTarea();
                }
            });

            function agregarTarea() {
                const texto = nuevaTarea.value.trim();
                if (texto === '') return;

                const li = document.createElement('li');
                li.className = 'tarea';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.addEventListener('change', function() {
                    li.classList.toggle('completed', this.checked);
                });

                const span = document.createElement('span');
                span.textContent = texto;

                li.appendChild(checkbox);
                li.appendChild(span);

                lista.appendChild(li);
                nuevaTarea.value = '';
                nuevaTarea.focus();

                // Animation for new task
                li.style.animation = 'fadeIn 0.4s ease-out';
            }

            // Optional: Add animation on scroll
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
