<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        #valor {
            font-size: 72px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            min-height: 80px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #mas {
            background-color: #4CAF50;
            color: white;
        }
        
        #menos {
            background-color: #f44336;
            color: white;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contador</h1>
        <span id="valor">0</span>
        <div>
            <button id="menos">-</button>
            <button id="mas">+</button>
        </div>
    </div>

    <script>
        let contador = 0;
        const valorSpan = document.getElementById('valor');
        const botonMas = document.getElementById('mas');
        const botonMenos = document.getElementById('menos');
        
        function actualizarContador() {
            valorSpan.textContent = contador;
            valorSpan.style.transform = 'scale(1.2)';
            setTimeout(() => {
                valorSpan.style.transform = 'scale(1)';
            }, 150);
        }
        
        botonMas.addEventListener('click', () => {
            contador++;
            actualizarContador();
        });
        
        botonMenos.addEventListener('click', () => {
            if (contador > 0) {
                contador--;
                actualizarContador();
            }
        });
        
        // Animación de entrada
        window.addEventListener('load', () => {
            valorSpan.style.opacity = '0';
            valorSpan.style.transform = 'scale(0.5)';
            
            setTimeout(() => {
                valorSpan.style.transition = 'all 0.8s ease-out';
                valorSpan.style.opacity = '1';
                valorSpan.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
</body>
</html>
