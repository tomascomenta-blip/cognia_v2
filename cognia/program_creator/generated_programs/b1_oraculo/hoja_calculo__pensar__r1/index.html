
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
    padding:10px;
    background:#fff;
    border:1px solid #ccc;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    animation:slideIn 0.5s ease-out forwards;
  }
  .celda{
    width:80px;
    height:30px;
    font-size:14px;
    text-align:right;
    padding:5px;
    box-sizing:border-box;
    animation:slideIn 0.5s ease-out forwards;
    animation-delay:calc(var(--i)*0.1s);
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(-20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" data-raw="">
  <input type="text" class="celda" data-ref="A2" data-raw="">
  <input type="text" class="celda" data-ref="A3" data-raw="">
  <input type="text" class="celda" data-ref="B1" data-raw="">
  <input type="text" class="celda" data-ref="B2" data-raw="">
  <input type="text" class="celda" data-ref="B3" data-raw="">
  <input type="text" class="celda" data-ref="C1" data-raw="">
  <input type="text" class="celda" data-ref="C2" data-raw="">
  <input type="text" class="celda" data-ref="C3" data-raw="">
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = document.querySelectorAll('.celda');
  const refMap = new Map();
  cells.forEach((cell, idx) => {
    const ref = cell.dataset.ref;
    refMap.set(ref, cell);
    cell.dataset.raw = cell.value;
    cell.style.setProperty('--i', idx + 1);
    cell.addEventListener('input', () => {
      cell.dataset.raw = cell.value;
      recalc();
    });
  });

  function evaluateCellValue(ref, stack) {
    const cell = refMap.get(ref);
    const raw = cell.dataset.raw;
    if (raw.startsWith('=')) {
      if (stack.includes(ref)) return 'CIRC';
      stack.push(ref);
      let expr = raw.slice(1).replace(/\s+/g, '');
      const replaced = expr.replace(/[A-C][1-3]/g, match => {
        const val = evaluateCellValue(match, stack);
        if (val === 'CIRC') return 'CIRC';
        return val;
      });
      if (replaced.includes('CIRC')) {
        stack.pop();
        return 'CIRC';
      }
      let result;
      try {
        result = Function('return ' + replaced)();
      } catch {
        result = 'CIRC';
      }
      stack.pop();
      return result;
    } else {
      const num = parseFloat(raw);
      return isNaN(num) ? 0 : num;
    }
  }

  function recalc() {
    cells.forEach(cell => {
      const ref = cell.dataset.ref;
      const raw = cell.dataset.raw;
      if (raw.startsWith('=')) {
        const val = evaluateCellValue(ref, []);
        cell.value = val === 'CIRC' ? 'CIRC' : val.toString();
      } else {
        cell.value = raw;
      }
    });
  }

  recalc();
});
</script>
</body>
</html>
