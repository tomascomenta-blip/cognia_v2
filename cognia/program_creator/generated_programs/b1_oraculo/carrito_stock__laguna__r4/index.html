
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            text-align: center;
            color: #333;
        }
        
        .productos {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .prod {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            background-color: white;
            width: 150px;
            text-align: center;
        }
        
        .prod p {
            margin: 10px 0;
        }
        
        button.add {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button.add:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .carrito {
            border-top: 2px solid #333;
            padding-top: 20px;
        }
        
        .linea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .linea button {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #total {
            font-size: 1.2em;
            font-weight: bold;
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Carrito de Compra</h1>
    
    <div class="productos">
        <div class="prod" data-id="p1" data-precio="100" data-stock="2">
            <p>Producto 1</p>
            <p>Precio: $100</p>
            <p>Stock: 2</p>
            <button class="add" data-id="p1">Agregar</button>
        </div>
        
        <div class="prod" data-id="p2" data-precio="50" data-stock="3">
            <p>Producto 2</p>
            <p>Precio: $50</p>
            <p>Stock: 3</p>
            <button class="add" data-id="p2">Agregar</button>
        </div>
        
        <div class="prod" data-id="p3" data-precio="25" data-stock="1">
            <p>Producto 3</p>
            <p>Precio: $25</p>
            <p>Stock: 1</p>
            <button class="add" data-id="p3">Agregar</button>
        </div>
    </div>
    
    <div class="carrito">
        <h2>Carrito</h2>
        <div id="lineas"></div>
        <span id="total">$0</span>
    </div>

    <script>
        // Estado del carrito: objeto que mantiene producto_id -> cantidad
        let carrito = {};
        
        // Inicializar productos con animación
        document.addEventListener('DOMContentLoaded', function() {
            // Agregar event listeners a los botones de agregar
            document.querySelectorAll('button.add').forEach(btn => {
                btn.addEventListener('click', agregarAlCarrito);
            });
            
            // Animación de carga
            setTimeout(() => {
                document.querySelectorAll('.prod').forEach((prod, index) => {
                    prod.style.animation = 'fadeIn 0.5s ease-out';
                    prod.style.animationDelay = `${index * 0.2}s`;
                    prod.style.WebkitAnimation = 'fadeIn 0.5s ease-out';
                    prod.style.WebkitAnimationDelay = `${index * 0.2}s`;
                });
            }, 500);
        });
        
        function agregarAlCarrito(e) {
            const productId = e.target.dataset.id;
            const productoDiv = document.querySelector(`[data-id="${productId}"]`);
            const precio = parseInt(productoDiv.dataset.precio);
            const stock = parseInt(productoDiv.dataset.stock);
            
            // Incrementar cantidad en el carrito
            if (carrito[productId]) {
                carrito[productId].cantidad++;
            } else {
                carrito[productId] = {
                    cantidad: 1,
                    precio: precio
                };
            }
            
            // Verificar si se alcanzó el stock
            if (carrito[productId].cantidad >= stock) {
                e.target.disabled = true;
            }
            
            actualizarCarrito();
        }
        
        function quitarDelCarrito(productId) {
            const productoDiv = document.querySelector(`[data-id="${productId}"]`);
            const stock = parseInt(productoDiv.dataset.stock);
            
            // Decrementar cantidad
            carrito[productId].cantidad--;
            
            // Si la cantidad llega a 0, eliminar del carrito
            if (carrito[productId].cantidad <= 0) {
                delete carrito[productId];
            } else {
                // Habilitar botón de agregar si no se alcanzó el stock
                const btnAdd = document.querySelector(`button.add[data-id="${productId}"]`);
                if (carrito[productId].cantidad < stock) {
                    btnAdd.disabled = false;
                }
            }
            
            actualizarCarrito();
        }
        
        function actualizarCarrito() {
            const lineasContainer = document.getElementById('lineas');
            lineasContainer.innerHTML = '';
            
            let total = 0;
            
            // Crear líneas para cada producto en el carrito
            for (const productId in carrito) {
                const item = carrito[productId];
                const linea = document.createElement('div');
                linea.className = 'linea';
                linea.dataset.id = productId;
                
                const nombre = document.createElement('span');
                nombre.textContent = `Producto ${productId.toUpperCase()}`;
                
                const cantSpan = document.createElement('span');
                cantSpan.className = 'cant';
                cantSpan.textContent = item.cantidad;
                
                const precioTotal = item.cantidad * item.precio;
                total += precioTotal;
                
                const precioSpan = document.createElement('span');
                precioSpan.textContent = `$${precioTotal}`;
                
                const quitarBtn = document.createElement('button');
                quitarBtn.className = 'quitar';
                quitarBtn.dataset.id = productId;
                quitarBtn.textContent = 'Quitar';
                quitarBtn.addEventListener('click', () => quitarDelCarrito(productId));
                
                linea.appendChild(nombre);
                linea.appendChild(cantSpan);
                linea.appendChild(precioSpan);
                linea.appendChild(quitarBtn);
                
                lineasContainer.appendChild(linea);
            }
            
            // Actualizar total
            document.getElementById('total').textContent = `$${total}`;
        }
    </script>
</body>
</html>

<!-- Animación CSS adicional -->
<style>
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
