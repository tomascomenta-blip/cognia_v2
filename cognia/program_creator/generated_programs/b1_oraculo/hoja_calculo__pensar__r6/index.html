
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#e0e0e0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:5px;
  }
  .celda{
    width:80px;
    height:30px;
    padding:0 5px;
    font-size:16px;
    text-align:right;
    border:1px solid #999;
    background:#fff;
    animation:fadeIn 0.8s ease forwards;
    animation-delay:var(--delay,0s);
  }
  .celda:focus{
    outline:none;
    border-color:#4a90e2;
    box-shadow:0 0 5px rgba(74,144,226,0.5);
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(-20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" style="--delay:0.1s">
  <input type="text" class="celda" data-ref="A2" style="--delay:0.2s">
  <input type="text" class="celda" data-ref="A3" style="--delay:0.3s">
  <input type="text" class="celda" data-ref="B1" style="--delay:0.4s">
  <input type="text" class="celda" data-ref="B2" style="--delay:0.5s">
  <input type="text" class="celda" data-ref="B3" style="--delay:0.6s">
  <input type="text" class="celda" data-ref="C1" style="--delay:0.7s">
  <input type="text" class="celda" data-ref="C2" style="--delay:0.8s">
  <input type="text" class="celda" data-ref="C3" style="--delay:0.9s">
</div>

<script>
(() => {
  const cells = {}; // ref => {el, formula, deps, dependents}
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  const refRegex = /[A-C][1-3]/g;
  let isUpdating = false;

  // Initialize cells
  refs.forEach(ref => {
    const el = document.querySelector(`input[data-ref="${ref}"]`);
    cells[ref] = {el, formula: null, deps: [], dependents: []};
    el.addEventListener('input', onInput);
  });

  function onInput(e){
    if(isUpdating) return;
    const el = e.target;
    const ref = el.dataset.ref;
    const val = el.value.trim();
    const cell = cells[ref];
    if(val.startsWith('=')){
      cell.formula = val.slice(1);
    }else{
      cell.formula = null;
    }
    recomputeAll();
  }

  function rebuildDependencies(){
    // clear deps/dependents
    refs.forEach(ref=>{
      cells[ref].deps = [];
      cells[ref].dependents = [];
    });
    // build new deps
    refs.forEach(ref=>{
      const cell = cells[ref];
      if(cell.formula){
        const matches = cell.formula.match(refRegex) || [];
        matches.forEach(depRef=>{
          if(cells[depRef]){
            cell.deps.push(depRef);
            cells[depRef].dependents.push(ref);
          }
        });
      }
    });
  }

  function evaluate(ref, stack, cache){
    if(cache.hasOwnProperty(ref)) return cache[ref];
    if(stack.has(ref)){
      cache[ref] = 'CIRC';
      return 'CIRC';
    }
    const cell = cells[ref];
    if(!cell.formula){
      const num = parseFloat(cell.el.value);
      const val = isNaN(num) ? 0 : num;
      cache[ref] = val;
      return val;
    }
    stack.add(ref);
    let expr = cell.formula.replace(refRegex, (match)=>{
      const val = evaluate(match, stack, cache);
      return val === 'CIRC' ? 'CIRC' : val;
    });
    stack.delete(ref);
    if(expr.includes('CIRC')){
      cache[ref] = 'CIRC';
      return 'CIRC';
    }
    // Evaluate numeric expression safely
    let result;
    try{
      result = Function('"use strict";return ('+expr+')')();
      if(typeof result !== 'number' || isNaN(result)) result = 0;
    }catch(e){
      result = 0;
    }
    cache[ref] = result;
    return result;
  }

  function recomputeAll(){
    isUpdating = true;
    rebuildDependencies();
    const cache = {};
    refs.forEach(ref=>{
      const val = evaluate(ref, new Set(), cache);
      const cell = cells[ref];
      if(cell.formula){
        cell.el.value = val;
      }else{
        // keep user input
      }
    });
    isUpdating = false;
  }

  // Initial calculation
  recomputeAll();
})();
</script>
</body>
</html>
