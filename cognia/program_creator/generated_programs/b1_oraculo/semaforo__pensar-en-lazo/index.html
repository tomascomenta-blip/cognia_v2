
<!DOCTYPE html>
<html>
<head>
    <title>Traffic Light</title>
    <style>
        #luz[data-color="rojo"] { background-color: red; }
        #luz[data-color="verde"] { background-color: green; }
        #luz[data-color="ambar"] { background-color: yellow; }
        #luz {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }
        #avanzar {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="luz" data-color="rojo"></div>
    <button id="avanzar">Avanzar</button>

    <script>
        var colors = ["rojo", "verde", "ambar"];
        var currentIndex = 0;

        function advance() {
            currentIndex = (currentIndex + 1) % 3;
            document.getElementById('luz').setAttribute('data-color', colors[currentIndex]);
        }

        document.getElementById('avanzar').addEventListener('click', advance);
    </body>
</html>
