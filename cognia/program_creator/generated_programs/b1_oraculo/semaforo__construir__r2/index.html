
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaforo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        #semaforo {
            width: 100px;
            height: 300px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .luz {
            width: 100%;
            height: 100px;
            border-radius: 50%;
            transition: background-color 0.5s;
        }
        #rojo {
            background-color: red;
        }
        #amarillo {
            background-color: yellow;
        }
        #verde {
            background-color: green;
        }
        #avanzar {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="semaforo">
        <div id="rojo" class="luz"></div>
        <div id="amarillo" class="luz"></div>
        <div id="verde" class="luz"></div>
    </div>
    <button id="avanzar">Avanzar</button>

    <script>
        const luces = {
            rojo: 'amarillo',
            amarillo: 'verde',
            verde: 'rojo'
        };

        const luz = document.getElementById('luz');
        const avanzarButton = document.getElementById('avanzar');

        luz.setAttribute('data-color', 'rojo');

        avanzarButton.addEventListener('click', () => {
            const currentColor = luz.getAttribute('data-color');
            const nextColor = luces[currentColor];
            luz.setAttribute('data-color', nextColor);
        });
    </script>
</body>
</html>
