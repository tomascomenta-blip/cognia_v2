
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Kanban Board</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .board {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .col {
      width: 300px;
      min-height: 400px;
      background-color: #ddd;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .col h3 {
      margin-top: 0;
      text-align: center;
    }
    .card {
      background-color: white;
      border: 1px solid #888;
      border-radius: 6px;
      padding: 10px;
      margin: 10px;
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 5px 10px;
      margin: 0 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.8;
    }
    .counter {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Tablero Kanban</h1>
  <div class="board">
    <div class="col" data-col="todo">
      <h3>To Do</h3>
      <span id="cont-todo" class="counter">0</span>
      <div class="card" data-id="t1">
        Tarea 1
        <button class="mas">+</button>
        <button class="menos">-</button>
      </div>
      <div class="card" data-id="t2">
        Tarea 2
        <button class="mas">+</button>
        <button class="menos">-</button>
      </div>
      <div class="card" data-id="t3">
        Tarea 3
        <button class="mas">+</button>
        <button class="menos">-</button>
      </div>
    </div>

    <div class="col" data-col="doing">
      <h3>In Progress</h3>
      <span id="cont-doing" class="counter">0</span>
    </div>

    <div class="col" data-col="done">
      <h3>Done</h3>
      <span id="cont-done" class="counter">0</span>
    </div>
  </div>

  <script>
    function updateCounters() {
      document.getElementById('cont-todo').textContent = document.querySelector('[data-col="todo"] .card').length;
      document.getElementById('cont-doing').textContent = document.querySelector('[data-col="doing"] .card').length;
      document.getElementById('cont-done').textContent = document.querySelector('[data-col="done"] .card').length;
    }

    function moveCard(card, direction) {
      const col = card.parentElement.dataset.col;
      let newCol;
      if (direction === 'right') {
        if (col === 'todo') newCol = 'doing';
        else if (col === 'doing') newCol = 'done';
        else return; // done no puede avanzar más
        if (newCol === 'doing' && document.querySelector('[data-col="doing"] .card').length >= 2) return; // WIP limit
      } else {
        if (col === 'done') newCol = 'doing';
        else if (col === 'doing') newCol = 'todo';
        else return; // todo no puede retroceder más
      }

      const targetColumn = document.querySelector('[data-col="' + newCol + '"]');
      targetColumn.appendChild(card);
      updateCounters();
    }

    document.querySelectorAll('.card').forEach(function(card) {
      card.querySelector('.mas').addEventListener('click', function() {
        moveCard(card, 'right');
      });
      card.querySelector('.menos').addEventListener('click', function() {
        moveCard(card, 'left');
      });
    });

    // Animación inicial
    document.querySelectorAll('.card').forEach(function(card, index) {
      card.style.animation = 'fadeIn 0.5s ease forwards';
      card.style.opacity = 0;
      setTimeout(function() {
        card.style.opacity = 1;
      }, index * 200);
    });

    const keyframes = `
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
    `;
    const style = document.createElement('style');
    style.textContent = keyframes;
    document.head.appendChild(style);

    updateCounters();
  </script>
</body>
</html>
