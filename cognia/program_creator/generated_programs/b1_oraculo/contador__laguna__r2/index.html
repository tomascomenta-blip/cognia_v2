<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        #valor {
            font-size: 72px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            min-height: 80px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 20px;
            margin: 0 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        #mas {
            background-color: #2196F3;
        }
        
        #menos {
            background-color: #f44336;
        }
        
        .animate {
            animation: pulse 0.5s ease-in-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contador</h1>
        <span id="valor">0</span>
        <div>
            <button id="mas">+1</button>
            <button id="menos">-1</button>
        </div>
    </div>

    <script>
        let contador = 0;
        const valorSpan = document.getElementById('valor');
        const botonMas = document.getElementById('mas');
        const botonMenos = document.getElementById('menos');
        
        function actualizarContador() {
            valorSpan.textContent = contador;
            valorSpan.classList.add('animate');
            setTimeout(() => {
                valorSpan.classList.remove('animate');
            }, 500);
        }
        
        botonMas.addEventListener('click', () => {
            contador++;
            actualizarContador();
        });
        
        botonMenos.addEventListener('click', () => {
            if (contador > 0) {
                contador--;
                actualizarContador();
            }
        });
        
        // Animación de entrada
        window.addEventListener('load', () => {
            valorSpan.classList.add('animate');
            setTimeout(() => {
                valorSpan.classList.remove('animate');
            }, 500);
        });
    </script>
</body>
</html>
