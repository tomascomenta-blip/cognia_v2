
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .productos {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        
        .prod {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            background-color: white;
            width: 150px;
            text-align: center;
        }
        
        .prod button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .prod button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .carrito {
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            background-color: white;
        }
        
        .linea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .linea button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        #total {
            font-weight: bold;
            font-size: 18px;
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Productos</h1>
    
    <div class="productos">
        <div class="prod" data-id="p1" data-precio="100" data-stock="2">
            <h3>Producto 1</h3>
            <p>Precio: $100</p>
            <p>Stock: 2</p>
            <button class="add" data-id="p1">Agregar</button>
        </div>
        
        <div class="prod" data-id="p2" data-precio="50" data-stock="3">
            <h3>Producto 2</h3>
            <p>Precio: $50</p>
            <p>Stock: 3</p>
            <button class="add" data-id="p2">Agregar</button>
        </div>
        
        <div class="prod" data-id="p3" data-precio="25" data-stock="1">
            <h3>Producto 3</h3>
            <p>Precio: $25</p>
            <p>Stock: 1</p>
            <button class="add" data-id="p3">Agregar</button>
        </div>
    </div>
    
    <h2>Carrito de Compra</h2>
    <div class="carrito">
        <div id="lineas"></div>
        <span id="total">Total: $0</span>
    </div>

    <script>
        let carrito = {};
        
        // Inicializar con animación
        document.addEventListener('DOMContentLoaded', function() {
            animateLoad();
        });
        
        function animateLoad() {
            const productos = document.querySelectorAll('.prod');
            productos.forEach((prod, index) => {
                prod.style.opacity = '0';
                prod.style.transform = 'translateY(20px)';
                prod.style.transition = 'all 0.5s ease';
                
                setTimeout(() => {
                    prod.style.opacity = '1';
                    prod.style.transform = 'translateY(0)';
                }, index * 200);
            });
        }
        
        // Agregar producto al carrito
        document.querySelectorAll('.add').forEach(button => {
            button.addEventListener('click', function() {
                const id = this.dataset.id;
                const prodElement = document.querySelector(`[data-id="${id}"]`);
                const precio = parseInt(prodElement.dataset.precio);
                const stock = parseInt(prodElement.dataset.stock);
                
                if (carrito[id]) {
                    // Si ya existe, incrementar cantidad si no se supera el stock
                    if (carrito[id].cantidad < stock) {
                        carrito[id].cantidad++;
                        updateButtonState(id, prodElement);
                    }
                } else {
                    // Crear nueva entrada en el carrito
                    carrito[id] = {
                        nombre: prodElement.querySelector('h3').textContent,
                        precio: precio,
                        cantidad: 1,
                        stock: stock
                    };
                }
                
                renderizarCarrito();
            });
        });
        
        // Quitar producto del carrito
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('quitar')) {
                const id = e.target.dataset.id;
                delete carrito[id];
                renderizarCarrito();
            }
        });
        
        // Renderizar el carrito
        function renderizarCarrito() {
            const lineasContainer = document.getElementById('lineas');
            lineasContainer.innerHTML = '';
            
            let total = 0;
            
            for (const id in carrito) {
                const producto = carrito[id];
                const subtotal = producto.precio * producto.cantidad;
                total += subtotal;
                
                const linea = document.createElement('div');
                linea.className = 'linea';
                linea.dataset.id = id;
                linea.innerHTML = `
                    <span>${producto.nombre}</span>
                    <button class="quitar" data-id="${id}">-</button>
                    <span class="cant">${producto.cantidad}</span>
                    <span>$${subtotal}</span>
                `;
                
                lineasContainer.appendChild(linea);
            }
            
            document.getElementById('total').textContent = `Total: $${total}`;
        }
        
        // Actualizar estado del botón según stock
        function updateButtonState(id, prodElement) {
            const button = prodElement.querySelector('.add');
            const cantidadActual = carrito[id] ? carrito[id].cantidad : 0;
            const stock = parseInt(prodElement.dataset.stock);
            
            if (cantidadActual >= stock) {
                button.disabled = true;
            } else {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
