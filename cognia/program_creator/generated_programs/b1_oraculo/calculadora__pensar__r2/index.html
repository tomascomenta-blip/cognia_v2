
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  #calculator{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeIn 1s ease-out;
  }
  #pantalla{
    width:260px;
    height:50px;
    background:#222;
    color:#0f0;
    font-size:2em;
    text-align:right;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
    overflow:hidden;
  }
  .tecla{
    width:60px;
    height:60px;
    margin:5px;
    font-size:1.5em;
    border:none;
    border-radius:5px;
    background:#ddd;
    cursor:pointer;
    transition:background .2s;
  }
  .tecla:hover{background:#ccc;}
  .tecla:active{background:#bbb;}
  @keyframes fadeIn{
    0%{opacity:0;transform:scale(.9);}
    100%{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div id="calculator">
  <div id="pantalla"></div>
  <div id="teclas">
    <button class="tecla" data-t="7">7</button>
    <button class="tecla" data-t="8">8</button>
    <button class="tecla" data-t="9">9</button>
    <button class="tecla" data-t="/">/</button>
    <button class="tecla" data-t="4">4</button>
    <button class="tecla" data-t="5">5</button>
    <button class="tecla" data-t="6">6</button>
    <button class="tecla" data-t="*">*</button>
    <button class="tecla" data-t="1">1</button>
    <button class="tecla" data-t="2">2</button>
    <button class="tecla" data-t="3">3</button>
    <button class="tecla" data-t="-">-</button>
    <button class="tecla" data-t="0">0</button>
    <button class="tecla" data-t=".">.</button>
    <button class="tecla" data-t="=">=</button>
    <button class="tecla" data-t="+">+</button>
    <button class="tecla" data-t="C">C</button>
  </div>
</div>
<script>
  const pantalla = document.getElementById('pantalla');
  let expression = '';
  function updateDisplay(val){ pantalla.textContent = val; }
  document.querySelectorAll('.tecla').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const val = btn.dataset.t;
      if(val==='C'){ expression=''; updateDisplay(''); }
      else if(val==='='){
        try{ const res=eval(expression); updateDisplay(res); expression=res.toString(); }
        catch{ updateDisplay('Error'); expression=''; }
      }else{ expression+=val; updateDisplay(expression); }
    });
  });
</script>
</body>
</html>
