<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#222;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
  }
  h1{margin:0;}
  #moves{
    margin-top:20px;
    font-size:24px;
  }
  #game{
    display:grid;
    grid-template-columns:repeat(4,80px);
    grid-gap:10px;
    margin-top:20px;
    animation:fadeIn 1s ease-in;
  }
  .tile{
    width:80px;
    height:80px;
    background:#444;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    cursor:pointer;
    user-select:none;
    transition:transform 0.3s;
    transform-style:preserve-3d;
  }
  .tile.flipped{background:#fff;color:#000;}
  .tile.matched{background:#aaf;color:#000;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<h1>Juego de Memoria 4x4</h1>
<div id="moves">Movimientos: 0</div>
<div id="game"></div>
<script>
const emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
let cards=[...emojis,...emojis];
cards.sort(()=>Math.random()-0.5);
const game=document.getElementById('game');
cards.forEach((emoji,i)=>{
  const tile=document.createElement('div');
  tile.classList.add('tile');
  tile.dataset.index=i;
  tile.dataset.emoji=emoji;
  tile.addEventListener('click',handleClick);
  game.appendChild(tile);
});
let flipped=[];
let moves=0;
let lock=false;
function handleClick(e){
  if(lock)return;
  const tile=e.currentTarget;
  if(tile.classList.contains('flipped')||tile.classList.contains('matched'))return;
  tile.textContent=tile.dataset.emoji;
  tile.classList.add('flipped');
  flipped.push(tile);
  if(flipped.length===2){
    moves++;
    document.getElementById('moves').textContent='Movimientos: '+moves;
    if(flipped[0].dataset.emoji===flipped[1].dataset.emoji){
      flipped[0].classList.add('matched');
      flipped[1].classList.add('matched');
      flipped[0].classList.remove('flipped');
      flipped[1].classList.remove('flipped');
      flipped=[];
    }else{
      lock=true;
      setTimeout(()=>{
        flipped[0].classList.remove('flipped');
        flipped[1].classList.remove('flipped');
        flipped[0].textContent='';
        flipped[1].textContent='';
        flipped=[];
        lock=false;
      },1000);
    }
  }
}
</script>
</body>
</html>
