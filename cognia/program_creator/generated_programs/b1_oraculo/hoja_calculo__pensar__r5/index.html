
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3×3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    grid-gap:5px;
    padding:20px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    animation:slideIn 0.8s ease-out forwards;
    opacity:0;
  }
  @keyframes slideIn{
    from{transform:translateY(50px); opacity:0;}
    to{transform:translateY(0); opacity:1;}
  }
  .celda{
    width:80px;
    height:30px;
    text-align:right;
    padding-right:5px;
    font-size:14px;
    border:1px solid #ccc;
    border-radius:4px;
    animation:fadeIn 0.5s ease-out forwards;
    opacity:0;
  }
  .celda:nth-child(1){animation-delay:0.1s;}
  .celda:nth-child(2){animation-delay:0.2s;}
  .celda:nth-child(3){animation-delay:0.3s;}
  .celda:nth-child(4){animation-delay:0.4s;}
  .celda:nth-child(5){animation-delay:0.5s;}
  .celda:nth-child(6){animation-delay:0.6s;}
  .celda:nth-child(7){animation-delay:0.7s;}
  .celda:nth-child(8){animation-delay:0.8s;}
  .celda:nth-child(9){animation-delay:0.9s;}
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B1" placeholder="B1">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C1" placeholder="C1">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="C3" placeholder="C3">
</div>

<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  // Evaluate a cell recursively, detecting cycles
  function evalCell(ref, stack) {
    const cell = refMap[ref];
    if (!cell) return 0; // unknown reference treated as 0
    if (stack.has(ref)) return 'CIRC'; // cycle detected
    if (!cell.dataset.formula) {
      const val = parseFloat(cell.value);
      return isNaN(val) ? 0 : val;
    }
    stack.add(ref);
    const result = evaluateFormula(cell.dataset.formula, stack);
    stack.delete(ref);
    return result;
  }

  // Evaluate a formula string (without leading '=')
  function evaluateFormula(formula, stack) {
    // Replace references with their numeric values
    const replaced = formula.replace(/[A-Z][1-3]/g, ref => {
      const val = evalCell(ref, stack);
      return val === 'CIRC' ? 'CIRC' : val;
    });
    if (replaced.includes('CIRC')) return 'CIRC';
    try {
      // Safe eval: only numbers and + -
      const res = Function(`return ${replaced}`)();
      return isNaN(res) ? 0 : res;
    } catch (e) {
      return 0;
    }
  }

  // Recalculate all cells
  function recalcAll() {
    cells.forEach(cell => {
      if (cell.dataset.formula) {
        const val = evaluateFormula(cell.dataset.formula, new Set());
        cell.value = val === 'CIRC' ? 'CIRC' : val;
      }
    });
  }

  // Handle input changes
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      const val = cell.value.trim();
      if (val.startsWith('=')) {
        cell.dataset.formula = val.slice(1);
      } else {
        delete cell.dataset.formula;
      }
      recalcAll();
    });
  });

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
