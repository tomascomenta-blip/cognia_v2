    <style>
        :root {
            --color-bg: #f0f4f8;
            --color-text: #1a1a1a;
            --color-accent: #4a90e2;
            --color-border: #e0e0e0;
            --color-success: #4caf50;
            --color-error: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--color-accent);
            animation: slideIn 0.6s ease-out;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            animation: fadeIn 0.6s ease-out;
        }

        #nueva {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        #nueva:focus {
            border: 2px solid var(--color-accent);
            box-shadow: 0 0 5px rgba(74, 144, 226, 0.3);
        }

        #anadir {
            background: var(--color-accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            animation: fadeIn 0.6s ease-out;
        }

        #anadir:hover {
            background: #357abd;
            transform: translateY(-2px);
        }

        #anadir:active {
            transform: translateY(0);
        }

        #lista {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
            animation: fadeIn 0.6s ease-out;
        }

        .tarea {
            padding: 12px 15px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .tarea:last-child {
            border-bottom: none;
        }

        .tarea:hover {
            background-color: #f8f9fa;
        }

        .tarea.completed {
            text-decoration: line-through;
            color: #888;
            background-color: #e8f0fe;
        }

        .tarea.completed .btn {
            background-color: var(--color-success);
        }

        .btn {
            background: none;
            border: none;
            color: var(--color-accent);
            font-size: 1rem;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: rgba(74, 144, 226, 0.1);
        }

        .btn.completed {
            background-color: var(--color-success);
            color: white;
        }

        .btn.completed:hover {
            background-color: rgba(75, 199, 199, 0.2);
        }

        .btn.remove {
            background-color: var(--color-error);
            color: white;
        }

        .btn.remove:hover {
            background-color: rgba(244, 67, 54, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

            transform: translateY(20px);
