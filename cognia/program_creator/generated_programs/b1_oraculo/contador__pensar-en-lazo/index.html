
<!DOCTYPE html>
<html>
<head>
  <title>Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin-top: 50px;
	  padding: 20px;
	  background-color: #f0f0f0;
	  color: #2d2d2d;
	  text-align: center;
	  padding: 50px;
	  width: 300px;
	  border-radius: 10px;
	  box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }
    span#valor {
      display: block;
      margin: 20px auto 20px;
      padding: 10px;
	  background: #fff;
	  color: #000;
	  box-shadow: 0 0 5px rgba(0,0,0,0.2);
	  border-radius: 5px;
      width: 100%;
    }
    button {
      background: #4a76a8;
	  color: white;
      padding: 15px 20px;
      margin: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <span id="valor">0</span>
  <button id="mas">Increment</button>
  <button id="menos">Decrement</button>
  <script>
    function updateCounter() {
      let valor = parseInt(document.getElementById('valor').textContent);
      document.getElementById('valor').textContent = valor;
    }

    document.getElementById('mas').addEventListener('click', function() {
      let valor = parseInt(document.getElementById('valor').textContent);
      valor++;
      document.getElementById('valor').textContent = valor;
    });

    document.getElementById('menos').addEventListener('click', function() {
      let valor = parseInt(document.getElementById('valor').textContent);
      if (valor > 0) {
        valor--;
      }
      document.getElementById('valor').textContent = valor;
    });
  </script>
</body>
</html>
