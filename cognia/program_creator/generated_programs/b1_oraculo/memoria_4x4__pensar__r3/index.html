
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#222;
    color:#fff;
    font-family:sans-serif;
  }
  #moves{
    margin-bottom:10px;
    font-size:1.2rem;
  }
  #game{
    display:grid;
    grid-template-columns:repeat(4,80px);
    gap:10px;
    animation:fadeIn 1s ease-out;
  }
  .tile{
    width:80px;
    height:80px;
    background:#444;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    cursor:pointer;
    user-select:none;
    transition:background 0.3s;
    opacity:0;
    transform:scale(0.8);
    animation:tileFadeIn 0.5s ease-out forwards;
    animation-delay:calc(var(--i)*0.05s);
  }
  .tile.revealed, .tile.matched{
    background:#fff;
    color:#000;
  }
  @keyframes tileFadeIn{
    from{opacity:0;transform:scale(0.8);}
    to{opacity:1;transform:scale(1);}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>
<div id="moves">Movimientos: 0</div>
<div id="game"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
  const pairs = [...emojis, ...emojis];
  shuffle(pairs);

  const game = document.getElementById('game');
  pairs.forEach((emoji, idx) => {
    const tile = document.createElement('div');
    tile.classList.add('tile');
    tile.dataset.emoji = emoji;
    tile.style.setProperty('--i', idx);
    tile.addEventListener('click', handleClick);
    game.appendChild(tile);
  });

  let firstTile = null;
  let secondTile = null;
  let lockBoard = false;
  let moves = 0;
  const movesCounter = document.getElementById('moves');

  function handleClick(e) {
    const tile = e.currentTarget;
    if (lockBoard || tile === firstTile || tile.classList.contains('revealed') || tile.classList.contains('matched')) return;

    tile.innerHTML = tile.dataset.emoji;
    tile.classList.add('revealed');

    if (!firstTile) {
      firstTile = tile;
      return;
    }

    secondTile = tile;
    moves++;
    movesCounter.textContent = `Movimientos: ${moves}`;
    checkMatch();
  }

  function checkMatch() {
    if (firstTile.dataset.emoji === secondTile.dataset.emoji) {
      firstTile.classList.add('matched');
      secondTile.classList.add('matched');
      resetTurn();
      if (document.querySelectorAll('.tile.matched').length === 16) {
        setTimeout(() => alert(`¡Felicidades! Has terminado en ${moves} movimientos.`), 500);
      }
    } else {
      lockBoard = true;
      setTimeout(() => {
        firstTile.innerHTML = '';
        firstTile.classList.remove('revealed');
        secondTile.innerHTML = '';
        secondTile.classList.remove('revealed');
        lockBoard = false;
        resetTurn();
      }, 1000);
    }
  }

  function resetTurn() {
    firstTile = null;
    secondTile = null;
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }
});
</script>
</body>
</html>
