
<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
  <style>
    #pantalla {
      width: 100%;
      height: 50px;
      background-color: #fff;
      padding: 10px;
      border: 1px solid #000;
    }
    .tecla {
      background-color: #eee;
      color: #000;
      padding: 10px;
      font-size: 20px;
      width: 60px;
      margin: 5px;
      border: 1px solid #000;
    }
  </style>
</head>
<body>
  <!-- Screen -->
  <div id="pantalla"></div>

  <!-- Buttons -->
  <div class="row">
    <button class="tecla" data-t="2"></button>
    <button class="tecla" data-t="3"></button>
    <button class="tecla" data-t="+"></button>
    <button class="tecla" data-t("="></button> <!-- Wait, data-t="="? -->
  </div>
</body>
</html>
