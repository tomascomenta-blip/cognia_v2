
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:#f0f0f0;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
    align-items:flex-start;
  }
  .prod{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    width:200px;
    text-align:center;
    opacity:0;
    animation:fadeIn .6s forwards;
  }
  .prod h3{margin:0 0 10px;}
  .prod p{margin:5px 0;}
  .add{
    margin-top:10px;
    padding:5px 10px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  .add:disabled{background:#aaa;cursor:not-allowed;}
  .cart{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    width:260px;
    opacity:0;
    animation:fadeIn .6s .2s forwards;
  }
  .cart h2{margin-top:0;}
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 0;
    padding:5px 0;
    border-bottom:1px solid #eee;
  }
  .quitar{
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:4px;
    padding:3px 6px;
    cursor:pointer;
  }
  #total{
    font-weight:bold;
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
</style>
</head>
<body>
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p>Precio: $100</p>
      <p>Stock: 2</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p>Precio: $50</p>
      <p>Stock: 3</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p>Precio: $25</p>
      <p>Stock: 1</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>

  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <p>Total: $<span id="total">0</span></p>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cart = {}; // {id: quantity}
  const totalEl = document.getElementById('total');
  const linesEl = document.getElementById('lines');

  // Update total amount
  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      total += price * cart[id];
    }
    totalEl.textContent = total;
  }

  // Update or create a line in the cart
  function updateLine(id) {
    const quantity = cart[id];
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if (quantity > 0) {
      if (!line) {
        line = document.createElement('div');
        line.className = 'linea';
        line.dataset.id = id;
        line.innerHTML = `<span class="name">${id}</span> x <span class="cant">${quantity}</span> <button class="quitar" data-id="${id}">Quitar</button>`;
        linesEl.appendChild(line);
        line.querySelector('.quitar').addEventListener('click', () => removeFromCart(id));
      } else {
        line.querySelector('.cant').textContent = quantity;
      }
    } else {
      if (line) line.remove();
    }
  }

  // Add product to cart
  function addToCart(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    const current = cart[id] || 0;
    if (current < stock) {
      cart[id] = current + 1;
      updateLine(id);
      updateTotal();
      if (cart[id] === stock) {
        const btn = document.querySelector(`.add[data-id="${id}"]`);
        btn.disabled = true;
      }
    }
  }

  // Remove one unit from cart
  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    btn.disabled = false;
    updateLine(id);
    updateTotal();
  }

  // Attach event listeners to add buttons
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });
});
</script>
</body>
</html>
