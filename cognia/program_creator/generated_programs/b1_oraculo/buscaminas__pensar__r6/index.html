
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#2c3e50;
    font-family:sans-serif;
    color:#ecf0f1;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,60px);
    grid-template-rows:repeat(5,60px);
    gap:2px;
  }
  .c{
    width:60px;
    height:60px;
    background:#bbb;
    border:1px solid #999;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    opacity:0;
    transform:scale(0.5);
    animation:fadeIn 0.5s ease forwards;
  }
  .c:hover{background:#ddd;}
  .abierta{
    background:#eee;
    cursor:default;
  }
  .bandera{
    background:#ff0;
  }
  #estado{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
  }
  @keyframes fadeIn{
    to{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('grid');
  const estado = document.getElementById('estado');
  const mines = new Set([6,12,18]); // posiciones fijas
  const counts = Array(25).fill(0);
  const cells = [];

  // Crear las 25 celdas
  for(let i=0;i<25;i++){
    const div = document.createElement('div');
    div.className='c';
    div.dataset.i = i;
    div.style.animationDelay = `${i*0.05}s`;
    grid.appendChild(div);
    cells.push(div);
  }

  // Calcular número de minas adyacentes
  const neighbors = (i)=>{
    const res=[];
    const r=Math.floor(i/5), c=i%5;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<5 && nc>=0 && nc<5){
          res.push(nr*5+nc);
        }
      }
    }
    return res;
  };
  for(let i=0;i<25;i++){
    if(mines.has(i)) continue;
    const neigh = neighbors(i);
    let cnt=0;
    neigh.forEach(n=>{ if(mines.has(n)) cnt++; });
    counts[i]=cnt;
  }

  let gameOver=false;

  const openCell = (i)=>{
    const cell=cells[i];
    if(cell.classList.contains('abierta') || cell.classList.contains('bandera') || gameOver) return;
    cell.classList.add('abierta');
    if(counts[i]>0) cell.textContent=counts[i];
    if(counts[i]===0){
      neighbors(i).forEach(n=>openCell(n));
    }
  };

  cells.forEach((cell,i)=>{
    cell.addEventListener('click', (e)=>{
      if(gameOver) return;
      if(cell.classList.contains('bandera')) return;
      if(mines.has(i)){
        cell.textContent='💣';
        cell.classList.add('abierta');
        estado.textContent='perdiste';
        gameOver=true;
        // opcional: revelar todas las minas
        mines.forEach(m=>{
          const mcell=cells[m];
          if(!mcell.classList.contains('abierta')){
            mcell.textContent='💣';
            mcell.classList.add('abierta');
          }
        });
      }else{
        openCell(i);
      }
    });

    cell.addEventListener('contextmenu', (e)=>{
      e.preventDefault();
      if(gameOver) return;
      if(cell.classList.contains('abierta')) return;
      if(cell.classList.contains('bandera')){
        cell.classList.remove('bandera');
        cell.textContent='';
      }else{
        cell.classList.add('bandera');
        cell.textContent='🚩';
      }
    });
  });
});
</script>
</body>
</html>
