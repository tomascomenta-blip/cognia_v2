
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito de Compra con Stock</title>
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f5f5f5;
  }
  .productos {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
  }
  .prod {
    border: 2px solid #333;
    padding: 15px;
    width: 150px;
    text-align: center;
    background: white;
  }
  .prod button {
    margin-top: 10px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .prod button.disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .carrito {
    border: 2px solid #333;
    padding: 15px;
    background: white;
  }
  .linea {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
  }
  .linea button {
    padding: 5px 10px;
    cursor: pointer;
  }
  #total {
    font-weight: bold;
    margin-top: 10px;
    display: block;
    text-align: right;
  }
</style>
</head>
<body>

<h2>Productos</h2>
<div class="productos">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <strong>Producto 1</strong><br>
    Precio: $100<br>
    Stock: 2
    <button class="add" data-id="p1">Agregar</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <strong>Producto 2</strong><br>
    Precio: $50<br>
    Stock: 3
    <button class="add" data-id="p2">Agregar</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <strong>Producto 3</strong><br>
    Precio: $25<br>
    Stock: 1
    <button class="add" data-id="p3">Agregar</button>
  </div>
</div>

<h2>Carrito</h2>
<div class="carrito">
  <div class="lineas"></div>
  <span id="total">Total: $0</span>
</div>

<script>
  // Estado del carrito: objeto con id de producto como clave y cantidad como valor
  const carrito = {};

  // Guardrar referencias a los elementos
  const productos = document.querySelectorAll('.prod');
  const agregarBtns = document.querySelectorAll('.add');
  const lineasContainer = document.querySelector('.lineas');
  const totalSpan = document.getElementById('total');

  // Función para actualizar la UI del carrito
  function actualizarCarrito() {
    // Limpiar líneas existentes
    lineasContainer.innerHTML = '';

    let total = 0;

    // Crear una línea por cada producto en el carrito (solo si cantidad > 0)
    for (const id in carrito) {
      const cantidad = carrito[id];
      if (cantidad <= 0) continue;

      // Buscar datos del producto
      const prodElement = document.querySelector(`.prod[data-id="${id}"]`);
      const precio = parseInt(prodElement.dataset.precio);

      // Crear línea
      const linea = document.createElement('div');
      linea.className = 'linea';
      linea.dataset.id = id;

      const nombreSpan = document.createElement('span');
      nombreSpan.textContent = `Producto ${id.toUpperCase()}`;

      const cantSpan = document.createElement('span');
      cantSpan.className = 'cant';
      cantSpan.textContent = cantidad;

      const subtotalSpan = document.createElement('span');
      subtotalSpan.textContent = `$${(precio * cantidad)}`;

      const quitarBtn = document.createElement('button');
      quitarBtn.className = 'quitar';
      quitarBtn.dataset.id = id;
      quitarBtn.textContent = 'Quitar';

      linea.appendChild(nombreSpan);
      linea.appendChild(cantSpan);
      linea.appendChild(subtotalSpan);
      linea.appendChild(quitarBtn);

      lineasContainer.appendChild(linea);

      total += precio * cantidad;
    }

    // Actualizar total
    totalSpan.textContent = `Total: $${total}`;

    // Actualizar estado de botones agregar según stock
    actualizarBotonesAgregar();
  }

  // Función para actualizar los botones "Agregregar" (habilitar/des habilitar)
  function actualizarBotonesAgregar() {
    agregarBtns.forEach(btn => {
      const id = btn.dataset.id;
      const prodElement = document.querySelector(`.prod[data-id="${id}"]`);
      const stockMaximo = parseInt(prodElement.dataset.stock);

      // Si el producto está en el carrito, restar su cantidad actual
      const enCarrito = carrito[id] || 0;

      // Si la cantidad en carrito alcanza el stock, deshabilitar botón
      if (enCarrito >= stockMaximo) {
        btn.classList.add('disabled');
        btn.disabled = true;
      } else {
        btn.classList.remove('disabled');
        btn.disabled = false;
      }
    });
  }

  // Eventos: Agregar al carrito
  agregarBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;

      // Incrementar cantidad en el carrito
      if (!carrito[id]) carrito[id] = 0;
      carrito[id]++;

      // Actualizar UI
      actualizarCarrito();
    });
  });

  // Eventos: Quitar del carrito (delegación de eventos)
  lineasContainer.addEventListener('click', (e) => {
    if (e.target.classList.contains('quitar')) {
      const id = e.target.dataset.id;

      // Decrementar cantidad en el carrito
      if (carrito[id]) {
        carrito[id]--;

        // Si llega a 0, eliminar del carrito
        if (carrito[id] <= 0) delete carrito[id];
      }

      // Actualizar UI
      actualizarCarrito();
    }
  });

  // Animación de carga: agrega animación al cargar la página
  document.addEventListener('DOMContentLoaded', () => {
    // Pequeña animación de entrada para los productos y el carrito
    productos.forEach(prod => {
      prod.style.opacity = '0';
      prod.style.transform = 'translateY(20px)';
      prod.style.transition = 'all 0.3s ease-out';
    });

    setTimeout(() => {
      productos.forEach(prod => {
        prod.style.opacity = '1';
        prod.style.transform = 'translateY(0)';
      });
    }, 100);

    // Animación para el carrito
    lineasContainer.style.opacity = '0';
    lineasContainer.style.transition = 'opacity 0.3s ease-out';

    setTimeout(() => {
      lineasContainer.style.opacity = '1';
    }, 200);
  });
</script>

</body>
</html>
