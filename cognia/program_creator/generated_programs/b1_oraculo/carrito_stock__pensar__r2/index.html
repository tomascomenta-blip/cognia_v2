
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito de compra con STOCK</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:20px;
    background:#f9f9f9;
  }
  h1{margin-bottom:10px;}
  .prod{
    margin-bottom:10px;
    padding:10px;
    border:1px solid #ccc;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity:0;
    animation:fadeIn 0.8s forwards;
    animation-delay:var(--delay);
  }
  .prod span{flex:1;}
  .prod button{margin-left:10px;}
  #cart{margin-top:20px;}
  .linea{
    padding:8px;
    border-bottom:1px solid #ddd;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity:0;
    animation:slideIn 0.4s forwards;
  }
  .linea span{flex:1;}
  .linea button{margin-left:10px;}
  #total{
    font-weight:bold;
    font-size:1.2em;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  @keyframes slideIn{
    from{transform:translateX(-20px); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
</style>
</head>
<body>
<h1>Carrito de compra con STOCK</h1>

<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2" style="--delay:0.1s;">
    <span>Producto 1 - Precio 100 - Stock 2</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3" style="--delay:0.3s;">
    <span>Producto 2 - Precio 50 - Stock 3</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1" style="--delay:0.5s;">
    <span>Producto 3 - Precio 25 - Stock 1</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: <span id="total">0</span></div>

<script>
  const cart = {}; // {id: quantity}
  const products = document.querySelectorAll('.prod');
  const cartContainer = document.getElementById('cart');
  const totalSpan = document.getElementById('total');

  // Helper to get product element by id
  function getProductElement(id){
    return document.querySelector(`.prod[data-id="${id}"]`);
  }

  // Helper to get add button by id
  function getAddButton(id){
    return document.querySelector(`.add[data-id="${id}"]`);
  }

  // Update total
  function updateTotal(){
    let total = 0;
    for(const id in cart){
      const qty = cart[id];
      const price = parseFloat(getProductElement(id).dataset.precio);
      total += qty * price;
    }
    totalSpan.textContent = total.toFixed(2);
  }

  // Render cart line for a product
  function renderLine(id){
    // Remove existing line if any
    const existing = cartContainer.querySelector(`.linea[data-id="${id}"]`);
    if(existing) existing.remove();

    const qty = cart[id];
    if(qty <= 0) return; // nothing to show

    const line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;

    const span = document.createElement('span');
    span.className = 'cant';
    span.textContent = `${id} x ${qty}`;

    const btn = document.createElement('button');
    btn.className = 'quitar';
    btn.dataset.id = id;
    btn.textContent = 'Quitar';

    line.appendChild(span);
    line.appendChild(btn);
    cartContainer.appendChild(line);
  }

  // Update line quantity display
  function updateLine(id){
    const line = cartContainer.querySelector(`.linea[data-id="${id}"]`);
    if(line){
      const span = line.querySelector('.cant');
      span.textContent = `${id} x ${cart[id]}`;
    }
  }

  // Enable or disable add button based on stock
  function updateAddButton(id){
    const btn = getAddButton(id);
    const stock = parseInt(getProductElement(id).dataset.stock,10);
    if(cart[id] >= stock){
      btn.disabled = true;
    }else{
      btn.disabled = false;
    }
  }

  // Add product to cart
  function addToCart(id){
    const stock = parseInt(getProductElement(id).dataset.stock,10);
    const current = cart[id] || 0;
    if(current < stock){
      cart[id] = current + 1;
      if(current === 0){
        renderLine(id);
      }else{
        updateLine(id);
      }
      updateAddButton(id);
      updateTotal();
    }
  }

  // Remove one unit from cart
  function removeFromCart(id){
    if(!cart[id]) return;
    cart[id] -= 1;
    if(cart[id] <= 0){
      delete cart[id];
      renderLine(id); // this will remove the line
    }else{
      updateLine(id);
    }
    updateAddButton(id);
    updateTotal();
  }

  // Event listeners for add buttons
  products.forEach(prod=>{
    const btn = prod.querySelector('.add');
    btn.addEventListener('click',()=>addToCart(btn.dataset.id));
  });

  // Event delegation for quitar buttons
  cartContainer.addEventListener('click',e=>{
    if(e.target.classList.contains('quitar')){
      removeFromCart(e.target.dataset.id);
    }
  });

  // Initial animation trigger
  window.addEventListener('load',()=>{
    // Nothing else needed; CSS animations already run
  });
</script>
</body>
</html>
