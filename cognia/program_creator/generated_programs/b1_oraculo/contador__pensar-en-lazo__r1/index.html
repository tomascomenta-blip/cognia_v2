
<!DOCTYPE html>
<html>
<head>
  <title>Counter</title>
  <style>
	div {
	  text-align: center;
	  padding: 15px;
	}
	span {
	  font-size: 24px;
	  margin-bottom: 20px;
	}
	buttons {
	  display: flex;
	  justify-content: space-around;
	  margin-top: 15px;
	}
	#mas {
	  background-color: #4CAF50;
	  color: white;
	  font-size: 16px;
	  padding: 10px;
	  border-radius: 5px;
	}
	#menos {
	  background-color: #F44336;
	  color: white;
	  font-size: 16px;
	  padding: 10px;
	  border-radius: 5px;
	}
  </style>
</head>
<body>
  <div>
    <span id="valor">0</span>
  </div>
  <div id="buttons">
    <button id="mas">Increment</button>
    <button id="menos">Decrement</button>
  </div>

  <script>
    // Initialize the counter
    let count = 0;

    // Display initial value
    document.getElementById('valor').innerHTML = count;

    // Handle increment button
    document.getElementById('mas').addEventListener('click', () => {
      count++;
      document.getElementById('valor').innerHTML = count;
    });

    // Handle decrement button
    document.getElementById('menos').addEventListener('click', () => {
      if (count > 0) {
        count--;
        document.getElementById('valor').innerHTML = count;
      }
    });
  </script>
</body>
</html>
