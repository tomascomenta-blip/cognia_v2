
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Semaforo</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #222;
    }

    #luz {
      position: relative;
      width: 80px;
      height: 240px;
      border: 3px solid #555;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    .light {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #333;
      margin: 0 auto;
    }

    #avanzar {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="luz" data-color="rojo">
    <div class="light"></div>
    <div class="light"></div>
    <div class="light"></div>
  </div>
  <button id="avanzar">Avanzar</button>

  <script>
    const luz = document.getElementById('luz');
    const avanzarBtn = document.getElementById('avanzar');
    const lights = document.querySelectorAll('#luz .light');

    function updateLights() {
      // Reset all to dark gray
      lights.forEach(light => light.style.backgroundColor = '#333');

      switch(luz.dataset.color) {
        case 'rojo':
          lights[0].style.backgroundColor = 'red';
          break;
        case 'verde':
          lights[2].style.backgroundColor = 'green';
          break;
        case 'ambar':
          lights[1].style.backgroundColor = 'yellow';
          break;
      }
    }

    avanzarBtn.addEventListener('click', () => {
      const currentColor = luz.dataset.color;
      
      if (currentColor === 'rojo') {
        luz.dataset.color = 'verde';
      } else if (currentColor === 'verde') {
        luz.dataset.color = 'ambar';
      } else if (currentColor === 'ambar') {
        luz.dataset.color = 'rojo';
      }

      updateLights();
    });

    // Initialize on load
    updateLights();
  </script>
</body>
</html>
