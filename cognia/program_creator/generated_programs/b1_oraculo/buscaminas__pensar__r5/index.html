
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:sans-serif;
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:20px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,60px);
    grid-template-rows:repeat(5,60px);
    gap:2px;
  }
  .c{
    background:#bbb;
    border:1px solid #999;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    animation:fadeIn 0.5s ease forwards;
    opacity:0;
  }
  .c.abierta{
    background:#e0e0e0;
    cursor:default;
  }
  .c.bandera{
    background:#ff0;
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
  #estado{
    margin-top:20px;
    font-size:24px;
    color:#d00;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
  const mines=[6,12,18];
  const grid=document.getElementById('grid');
  const estado=document.getElementById('estado');
  const size=5;

  // Create cells
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='c';
    div.dataset.i=i;
    div.style.animationDelay=`${i*0.05}s`;
    grid.appendChild(div);
  }

  const cells=document.querySelectorAll('.c');

  // Precompute neighbors
  function getNeighbors(i){
    const row=Math.floor(i/size);
    const col=i%size;
    const neighbors=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const r=row+dr,c=col+dc;
        if(r>=0&&r<size&&c>=0&&c<size){
          neighbors.push(r*size+c);
        }
      }
    }
    return neighbors;
  }
  const neighborMap=Array.from({length:25},(_,i)=>getNeighbors(i));

  // Open a cell
  function openCell(i){
    const cell=cells[i];
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;

    if(mines.includes(i)){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      // Reveal all mines
      mines.forEach(m=>{
        const mcell=cells[m];
        mcell.classList.remove('bandera');
        mcell.classList.add('abierta');
        mcell.textContent='💣';
      });
      return;
    }

    const adj=neighborMap[i].filter(n=>mines.includes(n)).length;
    cell.classList.add('abierta');
    if(adj>0)cell.textContent=adj;
    if(adj===0){
      // Cascade to neighbors
      neighborMap[i].forEach(n=>openCell(n));
    }
  }

  // Event listeners
  cells.forEach(cell=>{
    cell.addEventListener('click',()=>{
      const i=parseInt(cell.dataset.i);
      openCell(i);
    });
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      const i=parseInt(cell.dataset.i);
      const c=cells[i];
      if(c.classList.contains('abierta'))return;
      c.classList.toggle('bandera');
      c.textContent=c.classList.contains('bandera')?'🚩':'';
    });
  });
</script>
</body>
</html>
