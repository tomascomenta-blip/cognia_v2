
<!DOCTYPE html>
<html>
<head>
<style>
#pantalla {
	background-color: #fff;
	color: #000;
	font-size: 24px;
	padding: 10px;
	width: 100%;
	height: 100px;
}

button {
	display: block;
	width: 50px;
	height: 50px;
	background-color: #000;
	color: #fff;
	font-size: 24px;
	margin: 10px;
	border: none;
}

button:hover {
	background-color: #333;
}
</style>
</head>
<body>
<div id="pantalla"></div>
<button class="tecla" data-t="2"></button>
<button class="tecla" data-t="3"></button>
<button class="tecla" data-t="+"></button>
<button class="tecla" data-t="="></button>

<script>
var firstNum = 0;
var operator = null;
var secondNum = 0;

function processButtonValue(value) {
	if (value === '2' || value === '3') {
		var digit = parseInt(value);
		if (operator === null) {
			firstNum = digit;
		} else {
			secondNum = digit;
		}
	} else if (value === '+') {
		operator = '+';
	} else if (value === '=') {
		if (operator !== null) {
			var result = firstNum + secondNum;
			document.getElementById('pantalla').innerHTML = result;
			firstNum = 0;
			operator = null;
			secondNum = 0;
		} else {
			document.getElementById('pantalla').innerHTML = firstNum;
			firstNum = 0;
			operator = null;
			secondNum = 0;
		}
	}
}

window.onload = function() {
	processButtonValue('2');
	processButtonValue('+');
	processButtonValue('3');
	processButtonValue('=');
};

function handleButtonClick(event) {
	processButtonValue(event.target.dataset.t);
}

document.addEventListener('DOMContentLoaded', function() {
	const buttons = document.querySelectorAll('button');
	buttons.forEach(button => button.addEventListener('click', handleButtonClick));
});
</body>
</html>
