
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador en HTML</title>
    <style>
        :root {
            --color-fondo: #1a1a1a;
            --color-texto: #f0f0f0;
            --color-botones: #4caf50;
            --color-botones-activo: #45a049;
            --color-animacion: #ff6b6b;
            --fondo-animado: linear-gradient(135deg, #1a1a1a, #0f0f0f);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-fondo);
            color: var(--color-texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .contenedor {
            background: var(--fondo-animado);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .contenedor::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, var(--color-fondo), var(--color-fondo), var(--color-fondo));
            z-index: -1;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #valor {
            font-size: 4rem;
            font-weight: 700;
            margin: 20px 0;
            color: var(--color-texto);
            background: linear-gradient(45deg, var(--color-texto), var(--color-texto));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            background: var(--color-botones);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-botones-activo);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease-out;
        }

        button:hover::before {
            transform: scaleX(1);
        }

        button:hover {
            background: var(--color-botones-activo);
        }

        .boton-menos {
            background: var(--color-botones);
        }

        .boton-menos:hover {
            background: var(--color-botones-activo);
        }

        .boton-menos::before {
            background: var(--color-botones-activo);
        }

        .boton-menos:hover::before {
            transform: scaleX(1);
        }

        .boton-menos:active {
            transform: translateY(2px);
        }

        .boton-menos:active::before {
            transform: scaleX(1) translateY(2px);
        }

        .boton-mas {
            background: var(--color-botones);
        }

        .boton-mas:hover {
            background: var(--color-botones-activo);
        }

        .boton-mas::before {
            background: var(--color-botones-activo);
        }

        .boton-mas:hover::before {
            transform: scaleX(1);
        }

        .boton-mas:active {
            transform: translateY(2px);
        }

        .boton-mas:active::before {
            transform: scaleX(1) translateY(2px);
        }

        .animacion {
            animation: grow 0.5s ease-out;
        }

        @keyframes grow {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .animacion-valor {
            animation: pulse 2s infinite;
        }

        .animacion-valor {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .animacion-botones {
            animation: buttonPulse 0.3s ease-out;
        }

        @keyframes buttonPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .animacion-gradiente {
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Contador</h1>
        <span id="valor" class="animacion-valor">0</span>
        <div class="botones">
            <button id="menos" class="boton-menos animacion-botones">-</button>
            <button id="mas" class="boton-mas animacion-botones">+</button>
        </div>
        <footer>
            <p>Contador en HTML con animaciones y estilo moderno</p>
        </footer>
    </div>

    <script>
        const valorElement = document.getElementById('valor');
        const masButton = document.getElementById('mas');
        const menosButton = document.getElementById('menos');
        let valor = 0;

        function actualizarValor() {
            valorElement.textContent = valor;
            valorElement.classList.remove('animacion');
            valorElement.classList.add('animacion-valor');
            setTimeout(() => {
                valorElement.classList.remove('animacion-valor');
            }, 500);
        }

        masButton.addEventListener('click', () => {
            valor++;
            if (valor < 0) valor = 0;
            actualizarValor();
        });

        menosButton.addEventListener('click', () => {
            valor--;
            if (valor < 0) valor = 0;
            actualizarValor();
        });

        // Animación inicial
        window.addEventListener('load', () => {
            valorElement.classList.add('animacion');
            setTimeout(() => {
                valorElement.classList.remove('animacion');
            }, 500);
        });
    </script>
</body>
</html>
