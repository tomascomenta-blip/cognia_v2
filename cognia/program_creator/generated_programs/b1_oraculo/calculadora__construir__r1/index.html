
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        #calculadora {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        #pantalla {
            background-color: #e0e0e0;
            padding: 20px;
            text-align: right;
            font-size: 24px;
            margin-bottom: 20px;
            border-radius: 5px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .tecla {
            background-color: #ddd;
            border: none;
            padding: 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
            transition: background-color 0.3s;
        }
        .tecla:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div id="calculadora">
        <div id="pantalla">0</div>
        <div class="tecla" data-t="2">2</div>
        <div class="tecla" data-t="3">3</div>
        <div class="tecla" data-t="+">+</div>
        <div class="tecla" data-t="=">=</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pantalla = document.getElementById('pantalla');
            const teclas = document.querySelectorAll('.tecla');

            let currentInput = '';
            let currentOperation = '';
            let previousInput = '';

            teclas.forEach(tecla => {
                tecla.addEventListener('click', () => {
                    const valor = tecla.getAttribute('data-t');
                    handleInput(valor);
                });
            });

            function handleInput(value) {
                if (value === '=') {
                    if (currentOperation && previousInput) {
                        const result = calculate(previousInput, currentOperation, currentInput);
                        pantalla.textContent = result;
                        currentInput = result;
                        currentOperation = '';
                        previousInput = '';
                    }
                } else if (['+', '-', '*', '/'].includes(value)) {
                    if (currentInput) {
                        previousInput = currentInput;
                        currentInput = '';
                        currentOperation = value;
                    }
                } else {
                    currentInput += value;
                    pantalla.textContent = currentInput;
                }
            }

            function calculate(a, operation, b) {
                const numA = parseFloat(a);
                const numB = parseFloat(b);
                switch (operation) {
                    case '+':
                        return numA + numB;
                    case '-':
                        return numA - numB;
                    case '*':
                        return numA * numB;
                    case '/':
                        return numA / numB;
                    default:
                        return b;
                }
            }
        });
    </script>
</body>
</html>
