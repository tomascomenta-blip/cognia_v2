
<!DOCTYPE html>
<html>
<head>
  <title>Filter List</title>
  <link rel="stylesheet" href="style.css"> <!-- We can inline CSS in the body or use a style block -->
</head>
<body>
  <!-- We'll write the CSS in a style block inside the body to avoid external resources -->
  <div>
	<h2>Filter List Example</h2>
	<input id="buscar" type="text" oninput="filterList()" placeholder="Search...">
	<ul>
	  <li class="item">Mannan</li>
	  <li class="item">Banana</li>
	  <li class="item">Cereza</li>
	  <li class="item">Datil</li>
	  <li class="item">Kiwi</li>
	</ul>
  </div>
</body>
</html>
