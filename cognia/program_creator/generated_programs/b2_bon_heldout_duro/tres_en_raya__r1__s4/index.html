<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tres en raya</title>
<style>
  body{font-family:sans-serif;background:#f0f4f8;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;}
  #estado{margin-bottom:10px;padding:5px 10px;background:#fff;border-radius:4px;font-weight:bold;color:#333;}
  #estado.win{color:#2e7d32;}
  #estado.draw{color:#f57c00;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:90vmin;max-width:300px;}
  .c{background:#e3eaf1;border:1px solid #c0c0c0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;cursor:pointer;}
  .c.blocked{pointer-events:none;opacity:0.6;}
</style>
</head>
<body>
<div id="estado">X</div>
<div class="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
</div>
<script>
const cells=document.querySelectorAll('.c');
const estado=document.getElementById('estado');
let turn='X', board=Array(9).fill(null), gameOver=false;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function check(){for(const [a,b,c] of wins){if(board[a]&&board[a]===board[b]&&board[a]===board[c])return board[a];}return null;}
cells.forEach(cell=>cell.addEventListener('click',()=>{
  if(gameOver||board[cell.dataset.i])return;
  board[cell.dataset.i]=turn;cell.textContent=turn;
  const winner=check();
  if(winner){estado.textContent='gana';estado.classList.add('win');gameOver=true;cells.forEach(c=>c.classList.add('blocked'));}
  else if(board.every(v=>v)){estado.textContent='empate';estado.classList.add('draw');gameOver=true;cells.forEach(c=>c.classList.add('blocked'));}
  else{turn=turn==='X'?'O':'X';estado.textContent=turn;}
}));
</script>
</body>
</html>
