<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tabla con filtro, orden y paginación</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .container{
    max-width:800px;
    width:100%;
    background:#fff;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  }
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }
  .left-controls input,
  .left-controls button,
  .right-controls button{
    font-size:14px;
    padding:6px 12px;
    margin-right:8px;
  }
  #q{width:200px;}
  button{
    background:#e0e0e0;
    border:none;
    cursor:pointer;
  }
  button:hover:not(:disabled){background:#c0c0c0;}
  button:disabled{opacity:0.5;cursor:default;}
  #pagina{
    font-weight:bold;
    color:#008080;
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  th,td{
    padding:8px 12px;
    border-bottom:1px solid #ddd;
  }
  th{
    background:#f0f0f0;
    font-weight:bold;
    text-align:left;
  }
  tr.fila:hover{background:#fafafa;}
  @media (max-width:600px){
    .top-bar{flex-direction:column;align-items:flex-start;}
    .right-controls{margin-top:8px;}
  }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <div class="left-controls">
      <input type="text" id="q" placeholder="Buscar nombre...">
      <button id="ordenar">Ordenar edad</button>
    </div>
    <div class="right-controls">
      <button id="prev">Prev</button>
      <span id="pagina">1</span>
      <button id="sig">Next</button>
    </div>
  </div>
  <table>
    <thead>
      <tr><th>Nombre</th><th>Edad</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<script>
const data = [
  {nombre:"Ana Pérez", edad:34},
  {nombre:"Luis Gómez", edad:28},
  {nombre:"María Rodríguez", edad:45},
  {nombre:"Carlos Sánchez", edad:22},
  {nombre:"Elena Martínez", edad:31},
  {nombre:"Javier López", edad:39},
  {nombre:"Sofía Díaz", edad:27},
  {nombre:"Pedro Fernández", edad:50},
  {nombre:"Lucía Torres", edad:23},
  {nombre:"Manuel Ruiz", edad:36},
  {nombre:"Isabel Gómez", edad:29},
  {nombre:"Fernando García", edad:41},
  {nombre:"Raquel Moreno", edad:33},
  {nombre:"Andrés Jiménez", edad:38},
  {nombre:"Patricia Ortega", edad:24},
  {nombre:"Jorge Castillo", edad:47},
  {nombre:"Laura Vega", edad:26},
  {nombre:"Miguel Salazar", edad:42},
  {nombre:"Carmen Rivas", edad:30},
  {nombre:"Diego Navarro", edad:35},
  {nombre:"Ana María", edad:21},
  {nombre:"Luis Alberto", edad:44},
  {nombre:"María Luisa", edad:48}
];
let filteredData = data.slice();
let currentPage = 1;
const rowsPerPage = 10;
let ascending = true;

function sortData(){
  filteredData.sort((a,b)=> ascending ? a.edad - b.edad : b.edad - a.edad);
}

function renderTable(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const start = (currentPage-1)*rowsPerPage;
  const end = start + rowsPerPage;
  const pageData = filteredData.slice(start,end);
  pageData.forEach(item=>{
    const tr = document.createElement('tr');
    tr.className = 'fila';
    tr.innerHTML = `<td>${item.nombre}</td><td>${item.edad}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('pagina').textContent = currentPage;
  document.getElementById('prev').disabled = currentPage===1;
  document.getElementById('sig').disabled = currentPage>=Math.ceil(filteredData.length/rowsPerPage);
}

function filterData(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  filteredData = data.filter(item=>item.nombre.toLowerCase().includes(q));
  currentPage = 1;
  sortData();
  renderTable();
}

document.getElementById('q').addEventListener('input', filterData);
document.getElementById('ordenar').addEventListener('click', ()=>{
  ascending = !ascending;
  sortData();
  renderTable();
});
document.getElementById('prev').addEventListener('click', ()=>{
  if(currentPage>1){ currentPage--; renderTable(); }
});
document.getElementById('sig').addEventListener('click', ()=>{
  if(currentPage<Math.ceil(filteredData.length/rowsPerPage)){ currentPage++; renderTable(); }
});

document.addEventListener('DOMContentLoaded', ()=>{
  sortData();
  renderTable();
});
</script>
</body>
</html>
