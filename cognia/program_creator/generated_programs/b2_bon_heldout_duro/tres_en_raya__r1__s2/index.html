<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tic Tac Toe en un solo archivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    flex-direction:column;
  }
  #container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:0;
    width:90vw;
    max-width:400px;
    aspect-ratio:1;
  }
  .c{
    border:1px solid #ccc;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
    font-weight:bold;
    color:#000;
    cursor:pointer;
    user-select:none;
  }
  #estado{
    margin-top:20px;
    font-size:1.2rem;
    color:#008080;
    text-align:center;
  }
</style>
</head>
<body>
<div id="container">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
</div>
<div id="estado">X</div>
<script>
(function(){
  const cells=document.querySelectorAll('.c');
  const estado=document.getElementById('estado');
  let turn='X';
  let gameOver=false;
  const board=Array(9).fill('');
  const winCombos=[
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  function checkWin(){
    for(const combo of winCombos){
      const [a,b,c]=combo;
      if(board[a] && board[a]===board[b] && board[a]===board[c]){
        return true;
      }
    }
    return false;
  }
  function checkTie(){
    return board.every(v=>v);
  }
  cells.forEach(cell=>{
    cell.addEventListener('click',()=>{
      if(gameOver) return;
      const i=parseInt(cell.dataset.i,10);
      if(board[i]) return;
      board[i]=turn;
      cell.textContent=turn;
      if(checkWin()){
        estado.textContent='gana';
        gameOver=true;
        return;
      }
      if(checkTie()){
        estado.textContent='empate';
        gameOver=true;
        return;
      }
      turn=turn==='X'?'O':'X';
      estado.textContent=turn;
    });
  });
})();
</script>
</body>
</html>
