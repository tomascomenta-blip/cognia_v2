<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista con Undo y Redo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#333;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .container{max-width:600px;width:100%;}
  input#txt{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;margin-bottom:10px;}
  .buttons{display:flex;justify-content:center;gap:10px;margin-bottom:10px;}
  .buttons button{padding:10px 20px;font-size:16px;border:none;border-radius:4px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#a0a0a0,#c0c0c0);transition:background .3s;}
  .buttons button:disabled{background:#999;cursor:not-allowed;}
  .buttons button:hover:not(:disabled){background:linear-gradient(135deg,#8c8c8c,#b0b0b0);}
  ul#list{list-style:none;padding:0;margin:0;width:100%;max-height:300px;overflow-y:auto;border:1px solid #ddd;border-radius:4px;background:#fff;}
  ul#list li.it{padding:10px;margin:5px 10px;background:#e0e0e0;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:background .3s;}
  ul#list li.it.new{background:#d0f0f0;}
</style>
</head>
<body>
<div class="container">
  <input id="txt" placeholder="Escribe un elemento">
  <div class="buttons">
    <button id="add">Añadir</button>
    <button id="undo">Deshacer</button>
    <button id="redo">Rehacer</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
  const txt=document.getElementById('txt');
  const addBtn=document.getElementById('add');
  const undoBtn=document.getElementById('undo');
  const redoBtn=document.getElementById('redo');
  const list=document.getElementById('list');
  let undoStack=[],redoStack=[];
  function updateButtons(){undoBtn.disabled=undoStack.length===0;redoBtn.disabled=redoStack.length===0;}
  function addItem(text){if(!text)return;const li=document.createElement('li');li.className='it new';li.textContent=text;list.appendChild(li);setTimeout(()=>li.classList.remove('new'),1000);undoStack.push(text);redoStack=[];updateButtons();txt.value='';txt.focus();}
  function undoItem(){if(undoStack.length===0)return;const text=undoStack.pop();const items=list.querySelectorAll('li.it');if(items.length>0)list.removeChild(items[items.length-1]);redoStack.push(text);updateButtons();}
  function redoItem(){if(redoStack.length===0)return;const text=redoStack.pop();const li=document.createElement('li');li.className='it new';li.textContent=text;list.appendChild(li);setTimeout(()=>li.classList.remove('new'),1000);undoStack.push(text);updateButtons();}
  addBtn.addEventListener('click',()=>addItem(txt.value));
  undoBtn.addEventListener('click',undoItem);
  redoBtn.addEventListener('click',redoItem);
  txt.addEventListener('keyup',e=>{if(e.key==='Enter')addItem(txt.value);});
  updateButtons();
</script>
</body>
</html>
