<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario con Validación Cruzada</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; color:#333; background:#fff; }
  .container { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  form { width:100%; max-width:400px; }
  label { display:block; margin-bottom:4px; font-weight:bold; }
  input { width:100%; padding:8px; margin-bottom:12px; border:1px solid #ccc; border-radius:4px; font-size:1rem; }
  input:focus { border-color:#007bff; outline:none; box-shadow:0 0 0 2px rgba(0,123,255,0.25); }
  button { width:100%; padding:12px 20px; background:#333; color:#fff; border:none; border-radius:4px; font-size:1rem; cursor:pointer; box-shadow:0 4px 6px rgba(0,0,0,0.1); transition:background .3s; }
  button:hover:not([disabled]) { background:#555; }
  button[disabled] { background:#777; cursor:not-allowed; opacity:.6; }
  .ascii-art { margin-top:20px; font-family:monospace; text-align:center; color:#333; }
</style>
</head>
<body>
<div class="container">
  <form novalidate>
    <label for="pass">Contraseña:</label>
    <input id="pass" type="password" autocomplete="new-password">
    
    <label for="pass2">Confirmar Contraseña:</label>
    <input id="pass2" type="password" autocomplete="new-password">
    
    <label for="edad">Edad:</label>
    <input id="edad" type="number" min="0" max="120">
    
    <button id="enviar" disabled>Enviar</button>
  </form>
  <pre class="ascii-art">
   _______
  |  ___  |
  | |   | |
  | |___| |
  |_______|
  </pre>
</div>
<script>
  const pass = document.getElementById('pass');
  const pass2 = document.getElementById('pass2');
  const edad = document.getElementById('edad');
  const enviar = document.getElementById('enviar');

  function validate() {
    const passVal = pass.value;
    const pass2Val = pass2.value;
    const edadVal = parseInt(edad.value, 10);

    const isPassLength = passVal.length >= 8;
    const isPassMatch = passVal === pass2Val;
    const isEdadValid = !isNaN(edadVal) && edadVal >= 18 && edadVal <= 120;

    enviar.disabled = !(isPassLength && isPassMatch && isEdadValid);
  }

  pass.addEventListener('input', validate);
  pass2.addEventListener('input', validate);
  edad.addEventListener('input', validate);
</script>
</body>
</html>
