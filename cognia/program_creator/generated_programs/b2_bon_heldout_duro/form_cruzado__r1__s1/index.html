<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario con Validación Cruzada</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #f8f9fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    width: 90%;
    max-width: 400px;
  }
  .card h2 {
    margin-top: 0;
    margin-bottom: 1.5rem;
    text-align: center;
    font-size: 1.5rem;
    color: #333;
  }
  .field {
    margin-bottom: 1rem;
  }
  .field label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: #555;
  }
  .field input {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #ced4da;
    border-radius: 4px;
    box-sizing: border-box;
  }
  #enviar {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: not-allowed;
    background-color: #6c757d;
    transition: background-color 0.3s;
  }
  #enviar:not(:disabled) {
    background-color: #28a745;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="card">
  <h2>Registro</h2>
  <div class="field">
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="pass2">Confirmar Contraseña</label>
    <input id="pass2" type="password" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="edad">Edad</label>
    <input id="edad" type="number" min="0" max="200">
  </div>
  <button id="enviar" disabled>Enviar</button>
</div>
<script>
  class FormValidator {
    constructor() {
      this.passInput = document.getElementById('pass');
      this.pass2Input = document.getElementById('pass2');
      this.edadInput = document.getElementById('edad');
      this.enviarBtn = document.getElementById('enviar');
      this.addListeners();
      this.updateButtonState();
    }
    addListeners() {
      const inputs = [this.passInput, this.pass2Input, this.edadInput];
      inputs.forEach(input => {
        input.addEventListener('input', () => this.updateButtonState());
      });
    }
    isPasswordValid() {
      return this.passInput.value.length >= 8;
    }
    doPasswordsMatch() {
      return this.passInput.value === this.pass2Input.value;
    }
    isEdadValid() {
      const val = Number(this.edadInput.value);
      return Number.isInteger(val) && val >= 18 && val <= 120;
    }
    updateButtonState() {
      const enabled = this.isPasswordValid() && this.doPasswordsMatch() && this.isEdadValid();
      this.enviarBtn.disabled = !enabled;
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    new FormValidator();
  });
</script>
</body>
</html>
