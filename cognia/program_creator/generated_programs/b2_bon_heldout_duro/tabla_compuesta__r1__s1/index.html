<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tabla con Filtro, Orden y Paginación</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;background:#fafafa;color:#333;}
  #container{max-width:800px;margin:2rem auto;padding:0 1rem;}
  #toolbar{display:flex;align-items:center;gap:0.5rem;margin-bottom:1rem;}
  #toolbar input{flex:1;padding:0.4rem;border:1px solid #ccc;border-radius:4px;}
  #toolbar button{padding:0.4rem 0.8rem;border:none;background:#ddd;color:#333;border-radius:4px;cursor:pointer;}
  #toolbar button:disabled{background:#eee;color:#999;cursor:default;}
  #toolbar span{margin-left:0.5rem;}
  table{width:100%;border-collapse:collapse;background:#fff;}
  th,td{padding:0.6rem 0.8rem;text-align:left;border-bottom:1px solid #eee;}
  th{background:#f0f0f0;font-size:0.9rem;color:#555;}
  tr.fila:hover{background:#f5f5f5;}
  @media(max-width:480px){
    #toolbar{flex-wrap:wrap;}
    #toolbar input{margin-bottom:0.5rem;}
  }
</style>
</head>
<body>
<div id="container">
  <div id="toolbar">
    <input type="text" id="q" placeholder="Buscar por nombre">
    <button id="ordenar">Asc</button>
    <button id="prev">Prev</button>
    <button id="sig">Next</button>
    <span id="pagina">1</span>
  </div>
  <table id="tabla">
    <thead>
      <tr><th>Nombre</th><th>Edad</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
/* CONFIGURABLE CONSTANTS */
const PAGE_SIZE = 10;
const data = [
  {name:'Alice',age:34},{name:'Bob',age:28},{name:'Charlie',age:45},{name:'David',age:22},
  {name:'Eve',age:31},{name:'Frank',age:39},{name:'Grace',age:27},{name:'Heidi',age:36},
  {name:'Ivan',age:50},{name:'Judy',age:29},{name:'Karl',age:41},{name:'Laura',age:24},
  {name:'Mallory',age:38},{name:'Niaj',age:33},{name:'Olivia',age:26},{name:'Peggy',age:47},
  {name:'Quentin',age:30},{name:'Rupert',age:42},{name:'Sybil',age:23},{name:'Trent',age:35},
  {name:'Uma',age:21},{name:'Victor',age:44},{name:'Wendy',age:32}
];

/* STATE */
let currentPage = 1;
let ascending = true;
let query = '';

/* ELEMENTS */
const tbody = document.getElementById('tbody');
const paginaSpan = document.getElementById('pagina');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const ordenarBtn = document.getElementById('ordenar');
const qInput = document.getElementById('q');

/* FUNCTIONS */
function filterData() {
  const q = query.trim().toLowerCase();
  return data.filter(item => item.name.toLowerCase().includes(q));
}

function sortData(arr) {
  return arr.sort((a,b)=> ascending ? a.age - b.age : b.age - a.age);
}

function paginateData(arr) {
  const start = (currentPage-1)*PAGE_SIZE;
  return arr.slice(start, start+PAGE_SIZE);
}

function render() {
  const filtered = filterData();
  const sorted = sortData(filtered);
  const paged = paginateData(sorted);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  paginaSpan.textContent = currentPage;
  prevBtn.disabled = currentPage===1;
  nextBtn.disabled = currentPage===totalPages;
  tbody.innerHTML = '';
  paged.forEach(item=>{
    const tr = document.createElement('tr');
    tr.className='fila';
    tr.innerHTML = `<td>${item.name}</td><td>${item.age}</td>`;
    tbody.appendChild(tr);
  });
}

/* EVENT LISTENERS */
document.addEventListener('DOMContentLoaded', ()=>{
  render();
  qInput.addEventListener('input', e=>{
    query = e.target.value;
    currentPage = 1;
    render();
  });
  ordenarBtn.addEventListener('click', ()=>{
    ascending = !ascending;
    ordenarBtn.textContent = ascending ? 'Asc' : 'Desc';
    render();
  });
  prevBtn.addEventListener('click', ()=>{
    if(currentPage>1){currentPage--;render();}
  });
  nextBtn.addEventListener('click', ()=>{
    const filtered = filterData();
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
    if(currentPage<totalPages){currentPage++;render();}
  });
});
</script>
</body>
</html>
