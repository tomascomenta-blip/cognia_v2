<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Snake Game 10x10</title>
<style>
  body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#222;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    position:relative;
  }
  #score{
    position:absolute;
    top:10px;
    right:10px;
    font-size:1.2rem;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    width:90vmin;
    height:90vmin;
    max-width:500px;
    max-height:500px;
    border:2px solid #555;
    border-radius:5px;
  }
  .cel{
    border:1px solid #555;
    background:#444;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cel.snake{
    background:#0ff;
  }
  .cel.food{
    background:#ff9500;
    border-radius:50%;
    width:60%;
    height:60%;
  }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="grid"></div>
<script>
  const gridSize = 10;
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  let snake = [{x:5,y:5}];
  let dir = 'right';
  let food = null;

  function createGrid(){
    for(let y=0;y<gridSize;y++){
      for(let x=0;x<gridSize;x++){
        const div = document.createElement('div');
        div.className='cel';
        div.dataset.x=x;
        div.dataset.y=y;
        grid.appendChild(div);
      }
    }
  }

  function getCell(x,y){
    return grid.querySelector(`.cel[data-x="${x}"][data-y="${y}"]`);
  }

  function setSnake(){
    snake.forEach(p=>{
      const cell = getCell(p.x,p.y);
      cell.classList.add('snake');
    });
  }

  function clearSnake(){
    grid.querySelectorAll('.cel.snake').forEach(c=>c.classList.remove('snake'));
  }

  function placeFood(){
    let x,y;
    do{
      x = Math.floor(Math.random()*gridSize);
      y = Math.floor(Math.random()*gridSize);
    }while(snake.some(p=>p.x===x && p.y===y));
    food = {x,y};
    const cell = getCell(x,y);
    cell.classList.add('food');
  }

  function clearFood(){
    if(food){
      const cell = getCell(food.x,food.y);
      cell.classList.remove('food');
    }
  }

  function updateScore(){
    scoreEl.textContent = `Score: ${snake.length-1}`;
  }

  function updateJuego(){
    window.juego = { largo: snake.length, x: snake[0].x, y: snake[0].y, dir };
  }

  function moveSnake(){
    const head = snake[0];
    let newX = head.x, newY = head.y;
    switch(dir){
      case 'up': newY--; break;
      case 'down': newY++; break;
      case 'left': newX--; break;
      case 'right': newX++; break;
    }
    if(newX<0) newX=gridSize-1;
    if(newX>=gridSize) newX=0;
    if(newY<0) newY=gridSize-1;
    if(newY>=gridSize) newY=0;
    const newHead = {x:newX,y:newY};
    snake.unshift(newHead);
    const headCell = getCell(newX,newY);
    headCell.classList.add('snake');
    if(food && newX===food.x && newY===food.y){
      clearFood();
      placeFood();
    }else{
      const tail = snake.pop();
      const tailCell = getCell(tail.x,tail.y);
      tailCell.classList.remove('snake');
    }
    updateScore();
    updateJuego();
  }

  function handleKey(e){
    const key = e.key;
    let newDir = dir;
    if(key==='ArrowUp') newDir='up';
    else if(key==='ArrowDown') newDir='down';
    else if(key==='ArrowLeft') newDir='left';
    else if(key==='ArrowRight') newDir='right';
    if((dir==='up'&&newDir==='down')||(dir==='down'&&newDir==='up')||
       (dir==='left'&&newDir==='right')||(dir==='right'&&newDir==='left')){
      // ignore reverse
    }else{
      dir=newDir;
    }
    moveSnake();
  }

  // init
  createGrid();
  setSnake();
  placeFood();
  updateScore();
  updateJuego();
  document.addEventListener('keydown',handleKey);
</script>
</body>
</html>
