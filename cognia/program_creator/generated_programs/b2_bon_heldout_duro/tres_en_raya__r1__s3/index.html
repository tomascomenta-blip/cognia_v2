<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tic‑Tac‑Toe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f9f9f9;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    width:90vw;
    max-width:300px;
    background:#fff;
    border:1px solid #ddd;
  }
  .c{
    background:#fff;
    border:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    color:#333;
    cursor:pointer;
    user-select:none;
  }
  .c:focus{
    outline:none;
  }
  #estado{
    margin-top:10px;
    font-size:1.5rem;
    color:#333;
  }
</style>
</head>
<body>
<div class="board">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
</div>
<div id="estado">X</div>

<script>
  const WIN_COMBINATIONS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  let currentPlayer = 'X';
  let gameOver = false;
  const estado = document.getElementById('estado');
  const cells = document.querySelectorAll('.c');

  function updateEstado(text){ estado.textContent = text; }

  function checkWin(){
    const board = Array.from(cells).map(c => c.textContent);
    return WIN_COMBINATIONS.some(combo => {
      const [a,b,c] = combo;
      return board[a] && board[a]===board[b] && board[a]===board[c];
    });
  }

  function checkTie(){
    return Array.from(cells).every(c => c.textContent);
  }

  function handleClick(e){
    if(gameOver) return;
    const cell = e.currentTarget;
    if(cell.textContent) return;
    cell.textContent = currentPlayer;
    if(checkWin()){
      updateEstado('gana');
      gameOver = true;
    }else if(checkTie()){
      updateEstado('empate');
      gameOver = true;
    }else{
      currentPlayer = currentPlayer==='X'?'O':'X';
      updateEstado(currentPlayer);
    }
  }

  cells.forEach(c => c.addEventListener('click', handleClick));
</script>
</body>
</html>
