<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador Simple</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  .counter{
    font-size:4rem;
    margin:1rem 0;
    color:#333;
  }
  button{
    font-size:1.5rem;
    padding:0.5rem 1rem;
    margin:0.5rem;
    cursor:pointer;
    border:none;
    border-radius:5px;
    background:#007bff;
    color:#fff;
    transition:background 0.2s;
  }
  button:hover{background:#0056b3;}
  button:active{background:#004494;}
  @media(max-width:600px){
    .counter{font-size:3rem;}
    button{font-size:1.2rem;}
  }
</style>
</head>
<body>
  <div class="counter"><span id="valor">0</span></div>
  <div>
    <button id="mas">Más</button>
    <button id="menos">Menos</button>
  </div>
<script>
  (function(){
    const valorEl=document.getElementById('valor');
    const masBtn=document.getElementById('mas');
    const menosBtn=document.getElementById('menos');
    let count=0;
    function render(){
      valorEl.textContent=count.toLocaleString('es-ES');
    }
    masBtn.addEventListener('click',()=>{
      count++;
      render();
    });
    menosBtn.addEventListener('click',()=>{
      if(count>0){count--;render();}
    });
    render();
  })();
</script>
</body>
</html>
