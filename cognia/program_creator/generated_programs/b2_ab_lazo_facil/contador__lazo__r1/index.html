<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contador Simple</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;}
.container{background:#fff;border-radius:8px;padding:20px 30px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
#valor{font-size:3rem;color:#333;margin:20px 0;display:block;}
button{font-size:1rem;padding:10px 20px;margin:0 10px;border:none;border-radius:5px;background:#007bff;color:#fff;cursor:pointer;transition:background .3s;}
button:hover{background:#0056b3;}
button:active{transform:scale(.98);}
</style>
</head>
<body>
<div class="container">
<span id="valor">0</span>
<button id="mas">+</button>
<button id="menos">-</button>
</div>
<script>
const valorEl=document.getElementById('valor');
const masBtn=document.getElementById('mas');
const menosBtn=document.getElementById('menos');
let count=0;
function updateDisplay(){valorEl.textContent=count.toLocaleString();}
updateDisplay();
masBtn.addEventListener('click',()=>{count++;updateDisplay();});
menosBtn.addEventListener('click',()=>{if(count>0){count--;updateDisplay();}});
setTimeout(()=>{setInterval(()=>{count++;updateDisplay();},700);},5000);
</script>
</body>
</html>
