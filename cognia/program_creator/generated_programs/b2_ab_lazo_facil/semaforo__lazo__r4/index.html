<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo en HTML</title>
<style>
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
  }
  #luz{
    width:80px;
    height:200px;
    border-radius:10px;
    background:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-around;
    padding:10px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
    margin-bottom:20px;
  }
  #luz div{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#555;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:bold;
    text-shadow:0 0 3px #000;
  }
  /* Círculos de colores */
  #luz.rojo .rojo{background:red;}
  #luz.verde .verde{background:green;}
  #luz.ambar .ambar{background:orange;}
  /* Ocultar los círculos que no están activos */
  #luz .rojo, #luz .verde, #luz .ambar{
    opacity:0.3;
  }
  #luz.rojo .rojo{opacity:1;}
  #luz.verde .verde{opacity:1;}
  #luz.ambar .ambar{opacity:1;}
  button{
    padding:10px 20px;
    font-size:1rem;
    border:none;
    border-radius:5px;
    background:#0066cc;
    color:#fff;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
  }
  button:hover{background:#005bb5;}
  @media(max-width:400px){
    #luz{width:60px;height:150px;}
    #luz div{width:45px;height:45px;}
  }
</style>
</head>
<body>
<div id="luz" class="rojo">
  <div class="rojo">Rojo</div>
  <div class="verde">Verde</div>
  <div class="ambar">Ámbar</div>
</div>
<button id="avanzar">Avanzar</button>

<script>
  (function(){
    const luz = document.getElementById('luz');
    const btn = document.getElementById('avanzar');
    const colores = ['rojo','verde','ambar'];
    function updateState(newColor){
      // Eliminar clases anteriores
      luz.classList.remove(...colores);
      // Añadir la clase activa
      luz.classList.add(newColor);
      // Actualizar color de texto del círculo activo
      const active = luz.querySelector(`.${newColor}`);
      if(active){
        if(newColor === 'verde'){
          active.style.color = 'green';
        } else if(newColor === 'rojo'){
          active.style.color = 'red';
        } else if(newColor === 'ambar'){
          active.style.color = 'orange';
        }
      }
    }
    btn.addEventListener('click',()=>{
      let idx = colores.indexOf(luz.className.split(' ')[0]); // primera clase es el color
      idx = (idx+1)%colores.length;
      updateState(colores[idx]);
    });
    // Animación automática
    setInterval(()=>{
      let idx = colores.indexOf(luz.className.split(' ')[0]);
      idx = (idx+1)%colores.length;
      updateState(colores[idx]);
    },2000);
    // Inicializar estado
    updateState(luz.className.split(' ')[0]);
  })();
</script>
</body>
</html>
