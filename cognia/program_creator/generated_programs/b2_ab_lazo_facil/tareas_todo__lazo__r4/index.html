<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista de Tareas</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:20px;max-width:600px;margin:auto;}
  #nueva{width:70%;padding:8px;font-size:1rem;}
  #anadir{padding:8px 12px;font-size:1rem;margin-left:4px;}
  #lista{margin-top:20px;list-style:none;padding:0;}
  .tarea{padding:6px 0;border-bottom:1px solid #ddd;}
  @keyframes pulse{0%{transform:scale(1);background-color:#f0f0f0;}50%{transform:scale(1.05);background-color:#e0e0e0;}100%{transform:scale(1);background-color:#f0f0f0;}}
  @keyframes slideIn{0%{transform:translateX(-100%);opacity:0;}100%{transform:translateX(0);opacity:1;}}
  #anadir{animation:pulse 2s infinite;}
  #nueva{animation:slideIn 1s ease-out;}
</style>
<script>
  document.addEventListener('DOMContentLoaded',function(){
    const input=document.getElementById('nueva');
    const btn=document.getElementById('anadir');
    const lista=document.getElementById('lista');
    function añadir(){
      const txt=input.value.trim();
      if(txt){
        const li=document.createElement('li');
        li.className='tarea';
        li.textContent=txt;
        // Establecer color directamente para evitar dependencias de clases CSS
        li.style.color = 'green';
        lista.appendChild(li);
        input.value='';
        input.focus();
      }
    }
    btn.addEventListener('click',añadir);
    input.addEventListener('keydown',e=>{if(e.key==='Enter')añadir();});
  });
</script>
</head>
<body>
<input id="nueva" type="text" placeholder="Nueva tarea">
<button id="anadir">Añadir</button>
<ul id="lista"></ul>
</body>
</html>
