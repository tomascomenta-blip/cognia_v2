<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}
h1 {
  margin-bottom: 10px;
}
#moves {
  font-size: 1.2rem;
  margin-bottom: 10px;
}
#board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 400px;
  width: 100%;
}
.tile {
  background: #ccc;
  border: 1px solid #999;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  aspect-ratio: 1;
  cursor: pointer;
  user-select: none;
}
.tile.flipped {
  background: #fff;
}
.tile.matched {
  background: #e0ffe0;
}
</style>
</head>
<body>
<h1>Juego de Memoria 4x4</h1>
<div id="moves">0</div>
<div id="board"></div>
<script>
const emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
const pairs = [...emojis, ...emojis];
shuffle(pairs);
const board = document.getElementById('board');
pairs.forEach(emoji => {
  const tile = document.createElement('div');
  tile.classList.add('tile');
  tile.dataset.emoji = emoji;
  tile.addEventListener('click', onTileClick);
  board.appendChild(tile);
});

let firstTile = null;
let secondTile = null;
let busy = false;
let moves = 0;

function onTileClick(e) {
  const tile = e.currentTarget;
  if (busy || tile.classList.contains('flipped') || tile.classList.contains('matched')) return;
  tile.classList.add('flipped');
  tile.textContent = tile.dataset.emoji;
  if (!firstTile) {
    firstTile = tile;
    return;
  }
  secondTile = tile;
  moves++;
  document.getElementById('moves').textContent = moves;
  if (firstTile.dataset.emoji === secondTile.dataset.emoji) {
    firstTile.classList.add('matched');
    secondTile.classList.add('matched');
    firstTile = null;
    secondTile = null;
  } else {
    busy = true;
    setTimeout(() => {
      firstTile.classList.remove('flipped');
      firstTile.textContent = '';
      secondTile.classList.remove('flipped');
      secondTile.textContent = '';
      firstTile = null;
      secondTile = null;
      busy = false;
    }, 1000);
  }
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}
</script>
</body>
</html>
