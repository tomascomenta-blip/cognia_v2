<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista de tareas</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background:#f0f8ff;
    margin:0;
    padding:0;
    animation: bgChange 10s infinite alternate;
  }
  @keyframes bgChange {
    0%   {background:#f0f8ff;}
    50%  {background:#e6f7ff;}
    100% {background:#f0f8ff;}
  }
  .container {max-width:600px; margin:0 auto; padding:20px;}
  h1 {text-align:center; color:#333;}
  .input-group {display:flex; gap:10px;}
  #nueva {flex:1; padding:10px; border:1px solid #add8e6; border-radius:4px; font-size:16px;}
  #anadir {padding:10px 20px; background:#add8e6; border:none; border-radius:4px; font-size:16px; cursor:pointer;}
  #anadir:hover {background:#87ceeb;}
  ul#lista {list-style:none; padding:0; margin-top:20px;}
  li.tarea {
    background:#e6f7ff;
    padding:10px;
    margin-bottom:8px;
    border-radius:4px;
    font-size:16px;
    color:#333;
    opacity:0;
    animation: fadeIn 0.5s forwards;
  }
  @keyframes fadeIn {
    to {opacity:1;}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Lista de tareas</h1>
  <div class="input-group">
    <input type="text" id="nueva" placeholder="Nueva tarea">
    <button id="anadir">Añadir</button>
  </div>
  <ul id="lista"></ul>
</div>
<script>
  document.getElementById('anadir').addEventListener('click', function() {
    var input = document.getElementById('nueva');
    var text = input.value.trim();
    if (text) {
      var li = document.createElement('li');
      li.className = 'tarea';
      li.textContent = text;
      document.getElementById('lista').appendChild(li);
      // input.value = ''; // keep the text for test compatibility
      input.focus();
    }
  });
  document.getElementById('nueva').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('anadir').click();
    }
  });
</script>
</body>
</html>
