<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador Simple</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    font-family:Arial,sans-serif;
    background:#f0f0f0;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
#counter{
    background:#fff;
    border-radius:8px;
    padding:20px 30px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    text-align:center;
}
#valor{
    font-size:48px;
    color:#333;
    margin:20px 0;
    display:block;
}
button{
    font-size:18px;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    border:none;
    border-radius:4px;
    background:#007bff;
    color:#fff;
}
button:active{
    transform:scale(0.98);
}
</style>
</head>
<body>
<div id="counter">
    <span id="valor">0</span>
    <button id="mas">+</button>
    <button id="menos">-</button>
</div>
<script>
(function(){
    const valorEl=document.getElementById('valor');
    const masBtn=document.getElementById('mas');
    const menosBtn=document.getElementById('menos');
    let count=0;
    function update(){
        valorEl.textContent=count.toLocaleString('es-ES');
    }
    masBtn.addEventListener('click',()=>{
        count++;
        update();
    });
    menosBtn.addEventListener('click',()=>{
        if(count>0){
            count--;
            update();
        }
    });
    update();
})();
</script>
</body>
</html>
