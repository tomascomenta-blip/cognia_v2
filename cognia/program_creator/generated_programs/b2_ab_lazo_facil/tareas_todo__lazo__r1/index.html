<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista de Tareas Simple</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #f9f9f9;
    color: #333;
  }
  .contenedor {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 1rem;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,.1);
    animation: fadeIn 1s ease-in-out;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 1rem;
    text-align: center;
  }
  #nueva {
    width: calc(100% - 2rem);
    padding: .5rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #anadir {
    margin-top: .5rem;
    padding: .5rem 1rem;
    font-size: 1rem;
    background: #0063a1;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #anadir:hover {
    background: #00507a;
  }
  #lista {
    list-style: none;
    padding: 0;
    margin-top: 1rem;
  }
  .tarea {
    padding: .5rem;
    margin-bottom: .5rem;
    background: #e6f7ff;
    border-left: 4px solid #0063a1;
    border-radius: 4px;
    opacity: 0;
    transform: translateX(-20px);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }
  @media (max-width: 480px) {
    #nueva, #anadir {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="contenedor">
  <h1>Lista de Tareas</h1>
  <input type="text" id="nueva" placeholder="Escribe una tarea">
  <button id="anadir">Añadir</button>
  <ul id="lista"></ul>
</div>

<script type="module">
'use strict';

class TodoApp {
  constructor() {
    this.input = document.getElementById('nueva');
    this.button = document.getElementById('anadir');
    this.list = document.getElementById('lista');
    this.init();
  }

  init() {
    this.button.addEventListener('click', () => this.addTask());
    this.input.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') this.addTask();
    });
  }

  addTask() {
    const text = this.input.value.trim();
    if (!text) return;
    const li = document.createElement('li');
    li.className = 'tarea';
    li.textContent = text;
    li.style.animation = 'slideIn 0.3s forwards';
    this.list.appendChild(li);
    this.input.value = '';
    this.input.focus();
  }
}

window.addEventListener('load', () => new TodoApp());
</script>
</body>
</html>
