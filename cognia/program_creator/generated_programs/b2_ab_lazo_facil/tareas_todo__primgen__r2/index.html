<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista de Tareas Simple</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f9f9f9;}
  h1{font-size:1.5rem;margin-bottom:1rem;color:#333;}
  .contenedor{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .entrada{display:flex;gap:10px;margin-bottom:15px;}
  #nueva{flex:1;padding:8px;font-size:1rem;border:1px solid #ccc;border-radius:4px;}
  #anadir{padding:8px 12px;font-size:1rem;background:#0066cc;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  #anadir:hover{background:#005bb5;}
  #lista{list-style:none;padding:0;margin:0;}
  .tarea{padding:8px 12px;margin-bottom:8px;background:#e9f5ff;border-left:4px solid #0066cc;border-radius:4px;}
  @media(max-width:480px){
    .entrada{flex-direction:column;}
    #anadir{width:100%;}
  }
</style>
</head>
<body>
<div class="contenedor">
  <h1>Lista de Tareas</h1>
  <div class="entrada">
    <input type="text" id="nueva" placeholder="Escribe una tarea">
    <button id="anadir">Añadir</button>
  </div>
  <ul id="lista"></ul>
</div>
<script>
  (function(){
    const input = document.getElementById('nueva');
    const btn = document.getElementById('anadir');
    const lista = document.getElementById('lista');

    function añadirTarea(){
      const texto = input.value.trim();
      if(!texto) return;
      const li = document.createElement('li');
      li.className = 'tarea';
      li.textContent = texto;
      lista.appendChild(li);
      input.value = '';
      input.focus();
    }

    btn.addEventListener('click', añadirTarea);
    input.addEventListener('keydown', e=>{
      if(e.key==='Enter') añadirTarea();
    });
  })();
</script>
</body>
</html>
