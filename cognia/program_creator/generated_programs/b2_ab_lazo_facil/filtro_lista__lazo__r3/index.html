<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Filtro de lista de frutas</title>
<style>
  body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f9f9f9;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #buscar{
    width:100%;
    max-width:400px;
    padding:10px;
    font-size:16px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:4px;
  }
  ul{
    list-style:none;
    padding:0;
    width:100%;
    max-width:400px;
  }
  li.item{
    padding:10px;
    margin-bottom:5px;
    background:#fff;
    border:1px solid #ddd;
    border-radius:3px;
    transition:background 0.2s, opacity 0.5s;
    opacity:0;
    animation:fadeIn 0.5s forwards;
    display:list-item;
  }
  li.item:hover{
    background:#f0f0f0;
  }
  li.item.selected{
    background:#e0f7ff;
  }
  span.value{
    margin-left:10px;
    font-weight:bold;
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
</style>
</head>
<body>
  <input type="text" id="buscar" placeholder="Buscar fruta...">
  <ul id="lista">
    <li class="item"><span class="name">manzana</span><span class="value">0</span></li>
    <li class="item"><span class="name">banana</span><span class="value">0</span></li>
    <li class="item"><span class="name">cereza</span><span class="value">0</span></li>
    <li class="item"><span class="name">datil</span><span class="value">0</span></li>
    <li class="item"><span class="name">kiwi</span><span class="value">0</span></li>
  </ul>

<script>
  // Configuración
  const INPUT_ID = 'buscar';
  const LIST_ITEM_CLASS = 'item';
  const VALUE_CLASS = 'value';
  const NAME_CLASS = 'name';

  const inputEl = document.getElementById(INPUT_ID);
  const listItems = document.querySelectorAll(`.${LIST_ITEM_CLASS}`);
  const prevValues = new Map();

  // Inicializar valores aleatorios y colores
  listItems.forEach(li => {
    const valueEl = li.querySelector(`.${VALUE_CLASS}`);
    const random = Math.floor(Math.random() * 100);
    valueEl.textContent = random;
    prevValues.set(li, random);
    valueEl.style.color = 'black';
  });

  // Actualizar valores cada 700 ms
  function updateValues() {
    listItems.forEach(li => {
      const valueEl = li.querySelector(`.${VALUE_CLASS}`);
      const old = prevValues.get(li);
      const newVal = Math.floor(Math.random() * 100);
      const change = newVal - old;
      valueEl.textContent = newVal;
      valueEl.style.color = change >= 0 ? 'green' : 'red';
      prevValues.set(li, newVal);
    });
  }
  setInterval(updateValues, 700);

  // Filtro de búsqueda
  inputEl.addEventListener('input', () => {
    const filter = inputEl.value.toLowerCase();
    listItems.forEach(li => {
      const name = li.querySelector(`.${NAME_CLASS}`).textContent.toLowerCase();
      const visible = name.includes(filter);
      li.style.display = visible ? 'list-item' : 'none';
    });
  });

  // Clickable items: toggle selección
  listItems.forEach(li => {
    li.addEventListener('click', () => {
      li.classList.toggle('selected');
    });
  });
</script>
</body>
</html>
