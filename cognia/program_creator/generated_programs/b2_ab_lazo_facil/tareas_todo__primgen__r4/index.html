<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de Tareas Simple</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f9f9f9;}
  #nueva{width:70%;padding:.5rem;font-size:1rem;}
  #anadir{padding:.5rem 1rem;font-size:1rem;margin-left:.5rem;}
  #lista{list-style:none;padding:0;margin-top:1rem;}
  .tarea{background:#fff;border:1px solid #ddd;padding:.5rem;margin-bottom:.5rem;border-radius:4px;}
  @media (max-width:600px){
    #nueva{width:100%;margin-bottom:.5rem;}
    #anadir{width:100%;margin-left:0;}
  }
</style>
</head>
<body>
<input id="nueva" placeholder="Nueva tarea">
<button id="anadir">Añadir</button>
<ul id="lista"></ul>
<script>
document.getElementById('anadir').addEventListener('click', function(){
  var txt = document.getElementById('nueva').value.trim();
  if (txt) {
    var li = document.createElement('li');
    li.className = 'tarea';
    li.textContent = txt;
    document.getElementById('lista').appendChild(li);
    document.getElementById('nueva').value = '';
  }
});
</script>
</body>
</html>
