<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador Simple</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    background: #f5f5f5;
  }
  #valor {
    font-size: 4rem;
    font-weight: bold;
    margin-top: 2rem;
    color: #333;
  }
  .buttons {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
  }
  button {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    background: #007bff;
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button:active {
    background: #0056b3;
  }
</style>
</head>
<body>
<h1>Contador</h1>
<span id="valor">0</span>
<div class="buttons">
  <button id="menos">Menos</button>
  <button id="mas">Más</button>
</div>
<script>
  // Configurable constants
  const MIN_VALUE = 0;
  const STEP = 1;

  const valorEl = document.getElementById('valor');
  const masBtn = document.getElementById('mas');
  const menosBtn = document.getElementById('menos');

  let current = 0;

  function updateDisplay() {
    valorEl.textContent = current.toLocaleString();
  }

  masBtn.addEventListener('click', () => {
    current += STEP;
    updateDisplay();
  });

  menosBtn.addEventListener('click', () => {
    if (current > MIN_VALUE) {
      current -= STEP;
      updateDisplay();
    }
  });

  // Render first frame immediately
  document.addEventListener('DOMContentLoaded', () => {
    updateDisplay();
  });
</script>
</body>
</html>
