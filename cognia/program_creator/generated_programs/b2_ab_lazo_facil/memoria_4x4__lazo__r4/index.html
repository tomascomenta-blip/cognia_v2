<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  :root {
    --tile-size: 80px;
    --gap: 10px;
    --bg-face: #d3d3d3;
    --bg-flipped: #ffffff;
    --shadow: 0 2px 5px rgba(0,0,0,0.2);
    --pastel-bg: #f0f8ff;
  }
  body {
    margin:0;
    font-family: Arial, sans-serif;
    background: var(--pastel-bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    color:#333;
  }
  #moves {
    font-size:1.5rem;
    margin-bottom:20px;
  }
  #grid {
    display:grid;
    grid-template-columns: repeat(4, var(--tile-size));
    gap:var(--gap);
  }
  .tile {
    width:var(--tile-size);
    height:var(--tile-size);
    background:var(--bg-face);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background 0.3s, transform 0.3s;
    user-select:none;
    backface-visibility:hidden;
  }
  .tile.flipped {
    background:var(--bg-flipped);
    transform:rotateY(180deg);
  }
  .tile.matched {
    cursor:default;
    opacity:0.8;
    transform:none !important;
    background:var(--bg-flipped);
    color:green;
  }
  @media (max-width: 500px) {
    :root {
      --tile-size: 60px;
    }
  }
  @keyframes fadeIn {
    from { opacity:0; transform:scale(0.8); }
    to   { opacity:1; transform:scale(1); }
  }
</style>
</head>
<body>
<div id="moves">0</div>
<div id="grid"></div>

<script>
  // Tunable constants
  const TILE_SIZE = 80; // px
  const GRID_SIZE = 4; // 4x4 grid
  const EMOJIS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼']; // 8 animal emojis

  // Utility: shuffle array
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  // Game state
  let flippedTiles = [];
  let lock = false;
  let moves = 0;
  const movesEl = document.getElementById('moves');
  const gridEl = document.getElementById('grid');

  // Prepare emoji pairs and shuffle
  const emojiPairs = shuffle([...EMOJIS, ...EMOJIS]);

  // Create tiles
  emojiPairs.forEach((emoji, index) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.emoji = emoji;
    tile.addEventListener('click', onTileClick);
    // Animation on load
    tile.style.animation = 'fadeIn 0.5s forwards';
    tile.style.animationDelay = `${index * 0.1}s`;
    gridEl.appendChild(tile);
  });

  function onTileClick(e) {
    const tile = e.currentTarget;
    if (lock || tile.classList.contains('flipped') || tile.classList.contains('matched')) return;

    tile.textContent = tile.dataset.emoji;
    tile.style.color = 'green';
    tile.classList.add('flipped');
    flippedTiles.push(tile);

    if (flippedTiles.length === 2) {
      moves++;
      movesEl.textContent = moves;
      movesEl.style.color = 'green';
      const [first, second] = flippedTiles;
      if (first.dataset.emoji === second.dataset.emoji) {
        // Match found
        first.classList.add('matched');
        second.classList.add('matched');
        first.classList.remove('flipped');
        second.classList.remove('flipped');
        first.style.color = 'green';
        second.style.color = 'green';
        flippedTiles = [];
      } else {
        // No match: flip back after 1s
        lock = true;
        setTimeout(() => {
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          first.textContent = '';
          second.textContent = '';
          first.style.color = 'red';
          second.style.color = 'red';
          flippedTiles = [];
          lock = false;
        }, 1000);
      }
    }
  }
</script>
</body>
</html>
