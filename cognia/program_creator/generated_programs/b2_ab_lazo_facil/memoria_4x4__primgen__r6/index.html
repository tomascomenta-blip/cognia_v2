<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#e0f7fa;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    padding-top:2rem;
  }
  header{
    text-align:center;
    margin-bottom:1rem;
  }
  header h1{
    margin:0;
    font-size:1.8rem;
    color:#00695c;
  }
  #moves{
    font-size:1.2rem;
    color:#004d40;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1rem;
    width:90vmin;
    max-width:400px;
  }
  .tile{
    width:100%;
    padding-top:100%; /* square */
    position:relative;
    perspective:600px;
    cursor:pointer;
  }
  .tile-inner{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    transition:transform 0.6s;
    transform-style:preserve-3d;
    border-radius:8px;
    box-shadow:0 4px 8px rgba(0,0,0,0.15);
  }
  .tile.flipped .tile-inner{
    transform:rotateY(180deg);
  }
  .tile-front, .tile-back{
    position:absolute;
    width:100%; height:100%;
    backface-visibility:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
  }
  .tile-front{
    background:#fff;
  }
  .tile-back{
    background:#fff;
    transform:rotateY(180deg);
    font-size:2.5rem;
  }
  .tile.matched .tile-inner{
    transform:rotateY(180deg);
    cursor:default;
  }
  @media(max-width:500px){
    #grid{gap:0.5rem;}
    .tile-back{font-size:2rem;}
  }
</style>
</head>
<body>
<header>
  <h1>Juego de Memoria 4x4</h1>
  <div>Movimientos: <span id="moves">0</span></div>
</header>
<div id="grid"></div>

<script>
class MemoryGame {
  constructor() {
    this.emojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
    this.tiles = [];
    this.firstTile = null;
    this.secondTile = null;
    this.lock = false;
    this.moves = 0;
    this.movesEl = document.getElementById('moves');
    this.gridEl = document.getElementById('grid');
    this.init();
  }

  init() {
    const deck = [...this.emojis, ...this.emojis];
    this.shuffle(deck);
    deck.forEach((emoji, idx) => {
      const tile = this.createTile(emoji, idx);
      this.gridEl.appendChild(tile);
      this.tiles.push(tile);
    });
  }

  shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  createTile(emoji, id) {
    const tile = document.createElement('div');
    tile.classList.add('tile');
    tile.dataset.id = id;
    tile.dataset.emoji = emoji;

    const inner = document.createElement('div');
    inner.classList.add('tile-inner');

    const front = document.createElement('div');
    front.classList.add('tile-front');

    const back = document.createElement('div');
    back.classList.add('tile-back');
    back.textContent = emoji;

    inner.appendChild(front);
    inner.appendChild(back);
    tile.appendChild(inner);

    tile.addEventListener('click', () => this.handleClick(tile));
    return tile;
  }

  handleClick(tile) {
    if (this.lock || tile.classList.contains('flipped') || tile.classList.contains('matched')) return;

    tile.classList.add('flipped');

    if (!this.firstTile) {
      this.firstTile = tile;
      return;
    }

    this.secondTile = tile;
    this.lock = true;
    this.moves++;
    this.movesEl.textContent = this.moves;

    if (this.firstTile.dataset.emoji === this.secondTile.dataset.emoji) {
      this.firstTile.classList.add('matched');
      this.secondTile.classList.add('matched');
      this.resetTurn();
    } else {
      setTimeout(() => {
        this.firstTile.classList.remove('flipped');
        this.secondTile.classList.remove('flipped');
        this.resetTurn();
      }, 1000);
    }
  }

  resetTurn() {
    this.firstTile = null;
    this.secondTile = null;
    this.lock = false;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new MemoryGame();
});
</script>
</body>
</html>
