<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Semáforo Interactivo</title>
<style>
  body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:20px;
    background:#f0f0f0;
  }
  #luz{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:20px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    color:white;
    text-transform:uppercase;
    transition:background 0.3s;
  }
  #luz[data-color="rojo"]{background:red;}
  #luz[data-color="verde"]{background:green;}
  #luz[data-color="ambar"]{background:orange;}
  #avanzar{
    display:block;
    margin:0 auto;
    padding:10px 20px;
    font-size:1rem;
    cursor:pointer;
    background:#333;
    color:white;
    border:none;
    border-radius:5px;
    transition:background 0.2s;
  }
  #avanzar:hover{background:#555;}
  @media (max-width: 400px){
    #luz{width:80px;height:80px;font-size:1rem;}
    #avanzar{padding:8px 16px;font-size:0.9rem;}
  }
</style>
</head>
<body>
<div id="luz" data-color="rojo">rojo</div>
<button id="avanzar">Avanzar</button>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const luz = document.getElementById('luz');
  const btn = document.getElementById('avanzar');
  const colores = ['rojo','verde','ambar'];
  // Inicializar texto interno
  luz.textContent = luz.dataset.color;

  btn.addEventListener('click', function(){
    const current = luz.dataset.color;
    const idx = colores.indexOf(current);
    const nextIdx = (idx + 1) % colores.length;
    const nextColor = colores[nextIdx];
    luz.dataset.color = nextColor;
    luz.textContent = nextColor;
  });
});
</script>
</body>
</html>
