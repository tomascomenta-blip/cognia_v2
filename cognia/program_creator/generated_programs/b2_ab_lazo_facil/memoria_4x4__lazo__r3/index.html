<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Memoria 4x4</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:#f0f0f0;
  }
  h1{margin-top:20px;}
  #moves{margin:10px;font-size:1.2em;}
  #game-board{
    display:grid;
    grid-template-columns:repeat(4,80px);
    grid-gap:10px;
    margin:20px;
  }
  .tile{
    width:80px;height:80px;
    background:#444;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2em;
    cursor:pointer;
    border-radius:8px;
    user-select:none;
  }
  .tile .emoji{visibility:hidden;}
  .tile.flipped .emoji,
  .tile.matched .emoji{visibility:visible;}
  .tile.matched{background:#2ecc71;}
</style>
</head>
<body>
<h1>Juego de Memoria 4x4</h1>
<p>Movimientos: <span id="moves">0</span></p>
<div id="game-board"></div>
<script>
class Tile{
  constructor(emoji, board){
    this.emoji=emoji;
    this.board=board;
    this.element=document.createElement('div');
    this.element.classList.add('tile');
    this.element.dataset.emoji=emoji;
    this.element.addEventListener('click',()=>this.onClick());
    const span=document.createElement('span');
    span.classList.add('emoji');
    span.textContent=emoji;
    this.element.appendChild(span);
  }
  onClick(){this.board.handleTileClick(this);}
  flip(){this.element.classList.add('flipped');}
  unflip(){this.element.classList.remove('flipped');}
  match(){this.element.classList.add('matched');}
  isFlipped(){return this.element.classList.contains('flipped');}
  isMatched(){return this.element.classList.contains('matched');}
}
class MemoryGame{
  constructor(){
    this.emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
    this.tiles=[];
    this.firstTile=null;
    this.secondTile=null;
    this.busy=false;
    this.moves=0;
    this.movesElement=document.getElementById('moves');
    this.boardElement=document.getElementById('game-board');
    this.init();
  }
  init(){
    const deck=[...this.emojis,...this.emojis];
    this.shuffle(deck);
    deck.forEach(emoji=>{
      const tile=new Tile(emoji,this);
      this.tiles.push(tile);
      this.boardElement.appendChild(tile.element);
    });
  }
  shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
  }
  handleTileClick(tile){
    if(this.busy||tile.isFlipped()||tile.isMatched()) return;
    tile.flip();
    if(!this.firstTile){
      this.firstTile=tile;
    }else{
      this.secondTile=tile;
      this.moves++;
      this.movesElement.textContent=this.moves;
      if(this.firstTile.emoji===this.secondTile.emoji){
        this.firstTile.match();
        this.secondTile.match();
        this.resetTurn();
      }else{
        this.busy=true;
        setTimeout(()=>{
          this.firstTile.unflip();
          this.secondTile.unflip();
          this.resetTurn();
          this.busy=false;
        },1000);
      }
    }
  }
  resetTurn(){this.firstTile=null;this.secondTile=null;}
}
document.addEventListener('DOMContentLoaded',()=>new MemoryGame());
</script>
</body>
</html>
