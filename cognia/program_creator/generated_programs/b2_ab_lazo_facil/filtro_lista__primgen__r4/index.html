<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Filtro de lista de frutas</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f9f9f9;}
  h1{font-size:1.5rem;margin-bottom:0.5rem;color:#333;}
  #buscar{width:100%;max-width:400px;padding:8px;font-size:1rem;border:1px solid #ccc;border-radius:4px;}
  ul{list-style:none;padding:0;margin-top:1rem;}
  .item{padding:8px 12px;background:#fff;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;transition:background 0.2s;}
  .item.hidden{display:none;}
  @media (max-width:480px){
    body{padding:10px;}
    #buscar{font-size:0.9rem;}
  }
</style>
</head>
<body>
<h1>Filtro de lista de frutas</h1>
<input id="buscar" type="text" placeholder="Buscar fruta...">
<ul id="lista">
  <li class="item">manzana</li>
  <li class="item">banana</li>
  <li class="item">cereza</li>
  <li class="item">datil</li>
  <li class="item">kiwi</li>
</ul>
<script>
  (function(){
    const input = document.getElementById('buscar');
    const items = document.querySelectorAll('.item');
    input.addEventListener('input', function(){
      const val = this.value.trim().toLowerCase();
      items.forEach(li=>{
        const text = li.textContent.toLowerCase();
        if(val === '' || text.includes(val)){
          li.classList.remove('hidden');
        }else{
          li.classList.add('hidden');
        }
      });
    });
  })();
</script>
</body>
</html>
