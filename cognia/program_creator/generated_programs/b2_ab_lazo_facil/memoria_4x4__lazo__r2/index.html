<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Juego de Memoria 4x4</title>
<style>
body{font-family:sans-serif;margin:0;padding:1rem;background:#222;color:#fff;}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.tile{background:#444;border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:background .3s;animation:bgChange 2s infinite;}
.tile.hidden{color:transparent;}
@keyframes bgChange{0%{background:#444;}50%{background:#555;}100%{background:#444;}}
#moves{margin-top:1rem;font-size:1.2rem;}
</style>
</head>
<body>
<h1>Juego de Memoria 4x4</h1>
<div id="board"></div>
<p>Movimientos: <span id="moves">0</span></p>
<script>
const emojis=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼'];
const board=document.getElementById('board');
const movesSpan=document.getElementById('moves');
let tiles=[],first=null,second=null,locked=false,moves=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function init(){const deck=emojis.concat(emojis);shuffle(deck);deck.forEach(e=>{const t=document.createElement('div');t.className='tile hidden';t.dataset.emoji=e;board.appendChild(t);tiles.push(t);t.addEventListener('click',onClick);});}
function onClick(){if(locked||this.classList.contains('flipped'))return;moves++;movesSpan.textContent=moves;this.classList.remove('hidden');this.classList.add('flipped');this.style.color='white';this.textContent=this.dataset.emoji;if(!first){first=this;return;}second=this;locked=true;if(first.dataset.emoji===second.dataset.emoji){first.style.color='green';second.style.color='green';board.removeChild(first);board.removeChild(second);tiles=tiles.filter(t=>t!==first && t!==second);first=second=null;locked=false;}else{first.style.color='red';second.style.color='red';setTimeout(()=>{first.classList.add('hidden');first.classList.remove('flipped');first.textContent='';second.classList.add('hidden');second.classList.remove('flipped');second.textContent='';first=second=null;locked=false;},1000);}}
init();
</script>
</body>
</html>
