<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador Simple</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;}
  h1{margin-bottom:1rem;}
  #valor{font-size:3rem;margin:1rem 0;}
  button{font-size:1rem;padding:0.5rem 1rem;margin:0 0.5rem;cursor:pointer;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
</style>
</head>
<body>
<h1>Contador</h1>
<span id="valor">0</span>
<div>
  <button id="menos" disabled>-</button>
  <button id="mas">+</button>
</div>
<script>
  const valorEl = document.getElementById('valor');
  const masBtn = document.getElementById('mas');
  const menosBtn = document.getElementById('menos');
  let valor = 0;
  function actualizar() {
    valorEl.textContent = valor;
    menosBtn.disabled = valor === 0;
  }
  masBtn.addEventListener('click', () => {
    valor++;
    actualizar();
  });
  menosBtn.addEventListener('click', () => {
    if (valor > 0) {
      valor--;
      actualizar();
    }
  });
  actualizar();
</script>
</body>
</html>
