
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3×3</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;padding:20px;}
  table{border-collapse:collapse;margin:auto;}
  td{border:1px solid #999;padding:0;}
  input.celda{width:60px;height:30px;text-align:right;padding:5px;font-size:14px;}
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda" data-ref="A1"></td>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="A3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1"></td>
    <td><input class="celda" data-ref="B2"></td>
    <td><input class="celda" data-ref="B3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1"></td>
    <td><input class="celda" data-ref="C2"></td>
    <td><input class="celda" data-ref="C3"></td>
  </tr>
</table>

<script>
(() => {
  const cells = Array.from(document.querySelectorAll('input.celda'));
  const refMap = {}; // data-ref -> input element
  cells.forEach(c => refMap[c.dataset.ref] = c);

  let isRecalculating = false;

  // Evaluate a cell recursively
  function evaluateCell(cell, stack = [], cache = {}) {
    const key = cell.dataset.ref;
    if (cache[key] !== undefined) return cache[key];

    const formula = cell.dataset.formula;
    if (!formula) { // not a formula
      const val = parseFloat(cell.value);
      cache[key] = isNaN(val) ? 0 : val;
      return cache[key];
    }

    if (stack.includes(key)) { // circular reference
      cache[key] = 'CIRC';
      return 'CIRC';
    }

    stack.push(key);
    const expr = formula.slice(1); // remove leading '='
    // Replace references with evaluated values
    const replaced = expr.replace(/[A-C][1-3]/g, ref => {
      const refCell = refMap[ref];
      const val = evaluateCell(refCell, stack, cache);
      return val === 'CIRC' ? 'CIRC' : val;
    });

    // If any reference was circular, propagate
    if (replaced.includes('CIRC')) {
      cache[key] = 'CIRC';
      stack.pop();
      return 'CIRC';
    }

    // Evaluate the arithmetic expression (+ and - only)
    let result;
    try {
      result = Function(`return ${replaced}`)();
    } catch (e) {
      result = 'CIRC';
    }

    cache[key] = result;
    stack.pop();
    return result;
  }

  // Recalculate all cells
  function recalcAll() {
    if (isRecalculating) return;
    isRecalculating = true;
    const cache = {};
    cells.forEach(cell => {
      const val = evaluateCell(cell, [], cache);
      if (cell.dataset.formula) {
        cell.value = val === 'CIRC' ? 'CIRC' : val;
      }
    });
    isRecalculating = false;
  }

  // Input event handler
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      if (isRecalculating) return;
      const val = cell.value.trim();
      if (val.startsWith('=')) {
        cell.dataset.formula = val;
      } else {
        delete cell.dataset.formula;
      }
      recalcAll();
    });
  });

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
