
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:#f0f4f7;
  }
  h1{margin-bottom:10px;}
  .productos{display:flex;gap:20px;margin-bottom:30px;}
  .prod{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    width:120px;
    text-align:center;
    opacity:0;
    transform:translateX(-30px);
    animation:slideIn 0.8s forwards;
  }
  .prod:nth-child(1){animation-delay:0.1s;}
  .prod:nth-child(2){animation-delay:0.2s;}
  .prod:nth-child(3){animation-delay:0.3s;}
  .prod h3{margin:10px 0 5px;}
  .prod button{
    background:#28a745;
    color:#fff;
    border:none;
    padding:5px 10px;
    border-radius:4px;
    cursor:pointer;
  }
  .prod button:disabled{background:#aaa;cursor:not-allowed;}
  #carrito{
    background:#fff;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
  }
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 0;
    border-bottom:1px solid #eee;
    opacity:0;
    transform:translateY(-10px);
    animation:fadeIn 0.4s forwards;
  }
  .linea:last-child{border:none;}
  .linea button{
    background:#dc3545;
    color:#fff;
    border:none;
    padding:3px 6px;
    border-radius:4px;
    cursor:pointer;
  }
  #total{
    font-weight:bold;
    font-size:1.2em;
  }
  @keyframes slideIn{
    to{opacity:1;transform:translateX(0);}
  }
  @keyframes fadeIn{
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<h1>Productos</h1>
<div class="productos">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <h3>Producto 1</h3>
    <p>Precio: 100</p>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <h3>Producto 2</h3>
    <p>Precio: 50</p>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <h3>Producto 3</h3>
    <p>Precio: 25</p>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<h2>Carrito</h2>
<div id="carrito"></div>
<div>Total: <span id="total">0</span></div>

<script>
  const cart = {}; // {id: qty}
  const addButtons = document.querySelectorAll('.add');
  const carritoDiv = document.getElementById('carrito');
  const totalSpan = document.getElementById('total');

  // Helper to get product data
  function getProductData(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    return {
      precio: parseFloat(prod.dataset.precio),
      stock: parseInt(prod.dataset.stock)
    };
  }

  // Update total
  function updateTotal(){
    let total = 0;
    for(const id in cart){
      const {precio} = getProductData(id);
      total += precio * cart[id];
    }
    totalSpan.textContent = total.toFixed(2);
  }

  // Update add button state
  function updateAddButton(id){
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    const {stock} = getProductData(id);
    const qty = cart[id] || 0;
    btn.disabled = qty >= stock;
  }

  // Render cart lines
  function renderCart(){
    carritoDiv.innerHTML = '';
    for(const id in cart){
      const qty = cart[id];
      const {precio} = getProductData(id);
      const line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <span>${id} x <span class="cant">${qty}</span> = ${(precio*qty).toFixed(2)}</span>
        <button class="quitar" data-id="${id}">-</button>
      `;
      carritoDiv.appendChild(line);
    }
  }

  // Add event listeners
  addButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const {stock} = getProductData(id);
      const qty = cart[id] || 0;
      if(qty < stock){
        cart[id] = qty + 1;
        renderCart();
        updateTotal();
        updateAddButton(id);
      }
    });
  });

  carritoDiv.addEventListener('click', e=>{
    if(e.target.classList.contains('quitar')){
      const id = e.target.dataset.id;
      const qty = cart[id];
      if(qty > 1){
        cart[id] = qty - 1;
      }else{
        delete cart[id];
      }
      renderCart();
      updateTotal();
      updateAddButton(id);
    }
  });

  // Initial animation trigger
  window.addEventListener('load', ()=>{
    // Nothing else needed, CSS handles animation
  });
</script>
</body>
</html>
