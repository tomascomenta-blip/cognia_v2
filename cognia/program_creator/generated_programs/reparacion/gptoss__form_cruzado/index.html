
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario con Validación Cruzada</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f0f8ff;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }
  h1{
    font-size:2rem;
    color:#333;
    margin-bottom:1.5rem;
    animation: slideIn 1s ease-out forwards;
    opacity:0;
  }
  @keyframes slideIn{
    from{transform:translateX(-200px); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  form{
    background:#fff;
    padding:2rem;
    border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    gap:1rem;
    width:320px;
  }
  label{
    font-weight:bold;
  }
  input{
    padding:0.5rem;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:1rem;
  }
  button{
    padding:0.75rem;
    font-size:1rem;
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
    transition:background .3s;
  }
  button:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
</style>
</head>
<body>
<h1>Registro Seguro</h1>
<form id="registro" autocomplete="off">
  <label for="pass">Contraseña:</label>
  <input id="pass" type="password" required>

  <label for="pass2">Repetir Contraseña:</label>
  <input id="pass2" type="password" required>

  <label for="edad">Edad:</label>
  <input id="edad" type="number" min="0" required>

  <button id="enviar" disabled>Enviar</button>
</form>

<script>
  const pass = document.getElementById('pass');
  const pass2 = document.getElementById('pass2');
  const edad = document.getElementById('edad');
  const enviar = document.getElementById('enviar');

  function validar() {
    const pwd = pass.value;
    const pwd2 = pass2.value;
    const age = parseInt(edad.value, 10);

    const okPwd = pwd.length >= 8;
    const okMatch = pwd === pwd2 && pwd2 !== '';
    const okAge = !isNaN(age) && age >= 18 && age <= 120;

    enviar.disabled = !(okPwd && okMatch && okAge);
  }

  // Actualiza la validación en cada pulsación de tecla
  [pass, pass2, edad].forEach(el => {
    el.addEventListener('keyup', validar);
    el.addEventListener('input', validar); // captura cambios por copiado, etc.
  });
</script>
</body>
</html>
