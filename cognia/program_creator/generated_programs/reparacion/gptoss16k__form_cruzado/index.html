
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario con Validación Cruzada</title>
<style>
  body{
    font-family:Arial,sans-serif;
    background:#f0f0f0;
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  form{
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    width:300px;
  }
  label{margin-top:10px;}
  input{
    padding:8px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:4px;
  }
  button{
    margin-top:15px;
    padding:10px;
    background:#007BFF;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  button:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  .ball{
    position:absolute;
    top:10%;
    left:0;
    width:50px;
    height:50px;
    background:#ff5722;
    border-radius:50%;
    animation:bounce 4s infinite;
  }
  @keyframes bounce{
    0%{transform:translateX(0);}
    50%{transform:translateX(80vw);}
    100%{transform:translateX(0);}
  }
</style>
</head>
<body>
<div class="ball"></div>
<form id="formulario">
  <label for="pass">Contraseña:</label>
  <input id="pass" type="password" required>
  <label for="pass2">Repetir Contraseña:</label>
  <input id="pass2" type="password" required>
  <label for="edad">Edad:</label>
  <input id="edad" type="number" required>
  <button id="enviar" disabled>Enviar</button>
  <p id="mensaje"></p>
</form>
<script>
  const pass=document.getElementById('pass');
  const pass2=document.getElementById('pass2');
  const edad=document.getElementById('edad');
  const enviar=document.getElementById('enviar');
  const mensaje=document.getElementById('mensaje');

  function validar(){
    const condPass=pass.value.length>=8;
    const condMatch=pass.value===pass2.value && pass2.value!=='';
    const edadVal=parseInt(edad.value,10);
    const condEdad=edadVal>=18 && edadVal<=120;
    enviar.disabled=!(condPass && condMatch && condEdad);
  }

  [pass,pass2,edad].forEach(el=>el.addEventListener('input',validar));
  validar(); // inicial

  enviar.addEventListener('click',function(){
    mensaje.textContent='¡Formulario enviado con éxito!';
  });
</script>
</body>
</html>
