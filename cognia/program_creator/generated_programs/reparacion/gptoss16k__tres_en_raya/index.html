
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tres en Raya</title>
<style>
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#f0f8ff;
    font-family:sans-serif;
    animation:fadeIn 1s ease-in-out;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  #tablero{
    display:grid;
    grid-template-columns:repeat(3,80px);
    grid-template-rows:repeat(3,80px);
    gap:5px;
    margin-bottom:20px;
  }
  .c{
    background:#fff;
    border:2px solid #333;
    font-size:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    animation:pop 0.3s ease-out;
  }
  @keyframes pop{
    0%{transform:scale(0);}
    60%{transform:scale(1.1);}
    100%{transform:scale(1);}
  }
  #estado{
    font-size:24px;
    font-weight:bold;
  }
</style>
</head>
<body>
<div id="tablero">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
</div>
<div id="estado">X</div>

<script>
  const cells = document.querySelectorAll('.c');
  const estado = document.getElementById('estado');
  let board = Array(9).fill('');
  let turn = 'X';
  let finished = false;

  const winCombos = [
    [0,1,2],[3,4,5],[6,7,8], // filas
    [0,3,6],[1,4,7],[2,5,8], // columnas
    [0,4,8],[2,4,6]           // diagonales
  ];

  function checkWin() {
    return winCombos.some(combo => {
      const [a,b,c] = combo;
      return board[a] && board[a]===board[b] && board[a]===board[c];
    });
  }

  function checkTie() {
    return board.every(cell => cell);
  }

  cells.forEach(cell=>{
    cell.addEventListener('click',()=>{
      if(finished) return;
      const i = +cell.dataset.i;
      if(board[i]) return;
      board[i] = turn;
      cell.textContent = turn;
      if(checkWin()){
        estado.textContent = 'gana';
        finished = true;
      } else if(checkTie()){
        estado.textContent = 'empate';
        finished = true;
      } else {
        turn = turn==='X'?'O':'X';
        estado.textContent = turn;
      }
    });
  });
</script>
</body>
</html>
