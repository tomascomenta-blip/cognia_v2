
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake 10x10</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;display:flex;flex-direction:column;align-items:center;height:100vh;margin:0;}
  #grid{display:grid;grid-template-columns:repeat(10,20px);grid-template-rows:repeat(10,20px);gap:1px;margin-top:20px;}
  .cel{width:20px;height:20px;background:#fff;border:1px solid #ccc;box-sizing:border-box;}
  .snake{background:#4caf50;}
  .food{background:#f44336;}
  #controls{margin-top:20px;}
  button{margin:0 5px;padding:5px 10px;font-size:14px;}
  button.active{background:#4caf50;color:#fff;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="controls">
  <button id="upBtn">↑</button>
  <button id="downBtn">↓</button>
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
  <button id="toggleBtn">Pause</button>
</div>
<script>
(() => {
  const SIZE = 10;
  const gridEl = document.getElementById('grid');
  const cells = [];
  for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
      const div = document.createElement('div');
      div.className = 'cel';
      div.dataset.x = x;
      div.dataset.y = y;
      gridEl.appendChild(div);
      if (!cells[x]) cells[x] = [];
      cells[x][y] = div;
    }
  }

  let snake = [{x: Math.floor(SIZE/2), y: Math.floor(SIZE/2)}];
  let dir = 'right';
  let food = null;
  let running = true;
  let intervalId = null;

  function placeFood() {
    const empty = [];
    for (let x = 0; x < SIZE; x++) {
      for (let y = 0; y < SIZE; y++) {
        if (!snake.some(s => s.x===x && s.y===y)) empty.push({x,y});
      }
    }
    if (empty.length===0) return;
    const f = empty[Math.floor(Math.random()*empty.length)];
    food = f;
    cells[f.x][f.y].classList.add('food');
  }
  placeFood();

  function render() {
    for (let x = 0; x < SIZE; x++) for (let y = 0; y < SIZE; y++) cells[x][y].classList.remove('snake','food');
    snake.forEach(seg => cells[seg.x][seg.y].classList.add('snake'));
    if (food) cells[food.x][food.y].classList.add('food');
  }

  function updateState() {
    window.juego = {
      largo: snake.length,
      x: snake[0].x,
      y: snake[0].y,
      dir: dir
    };
  }

  function tick() {
    const head = snake[0];
    let nx = head.x, ny = head.y;
    if (dir==='up') ny--; if (dir==='down') ny++; if (dir==='left') nx--; if (dir==='right') nx++;
    nx = (nx+SIZE)%SIZE;
    ny = (ny+SIZE)%SIZE;
    if (snake.some(s=>s.x===nx && s.y===ny)) {
      snake = [{x: Math.floor(SIZE/2), y: Math.floor(SIZE/2)}];
      dir = 'right';
      placeFood();
      render();
      updateState();
      return;
    }
    snake.unshift({x:nx,y:ny});
    if (food && food.x===nx && food.y===ny) {
      food = null;
      placeFood();
    } else {
      snake.pop();
    }
    render();
    updateState();
  }

  function start() {
    if (!intervalId) intervalId = setInterval(tick,200);
    running = true;
    document.getElementById('toggleBtn').textContent = 'Pause';
  }
  function pause() {
    clearInterval(intervalId);
    intervalId = null;
    running = false;
    document.getElementById('toggleBtn').textContent = 'Resume';
  }

  document.getElementById('toggleBtn').addEventListener('click', () => {
    running ? pause() : start();
  });

  const btnMap = {
    upBtn: 'up',
    downBtn: 'down',
    leftBtn: 'left',
    rightBtn: 'right'
  };
  Object.keys(btnMap).forEach(id => {
    document.getElementById(id).addEventListener('click', () => {
      dir = btnMap[id];
      updateButtons();
    });
  });

  function updateButtons() {
    Object.keys(btnMap).forEach(id => {
      const btn = document.getElementById(id);
      btn.classList.toggle('active', btnMap[id]===dir);
    });
  }

  window.addEventListener('keydown', e=>{
    const k = e.key;
    let newDir = null;
    if (k==='ArrowUp') newDir='up';
    else if (k==='ArrowDown') newDir='down';
    else if (k==='ArrowLeft') newDir='left';
    else if (k==='ArrowRight') newDir='right';
    if (newDir && newDir!==dir) dir=newDir;
    updateButtons();
  });

  render();
  updateState();
  updateButtons();
  start();
})();
</script>
</body>
</html>
