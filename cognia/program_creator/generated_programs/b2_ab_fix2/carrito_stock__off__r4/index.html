<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f9f9f9;}
.container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:1rem;}
.products{flex:1 1 300px;margin-right:1rem;}
.cart{flex:1 1 300px;display:none;}
.cart.visible{display:block;}
.prod{background:#fff;border:1px solid #ddd;padding:1rem;margin-bottom:1rem;border-radius:4px;}
.prod h3{margin:0 0 .5rem;}
.prod .price{display:block;margin-bottom:.5rem;}
.prod .stock{font-size:.9rem;color:#555;margin-bottom:.5rem;}
.prod .add{padding:.5rem 1rem;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;}
.prod .add:disabled{background:#aaa;cursor:not-allowed;}
.cart h2{margin-top:0;}
.linea{display:flex;align-items:center;background:#fff;border:1px solid #ddd;padding:.5rem;margin-bottom:.5rem;border-radius:4px;}
.linea .cant{font-weight:bold;margin:0 1rem;}
.linea .quitar{padding:.3rem .6rem;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
.linea .quitar:disabled{background:#aaa;cursor:not-allowed;}
.total{font-size:1.2rem;font-weight:bold;margin-top:1rem;}
@media(max-width:600px){
.container{flex-direction:column;}
.products,.cart{margin-right:0;}
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <span class="price">100,00 €</span>
      <span class="stock">Stock: 2</span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <span class="price">50,00 €</span>
      <span class="stock">Stock: 3</span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <span class="price">25,00 €</span>
      <span class="stock">Stock: 1</span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
const cart = {}; // key: product id, value: quantity

function formatCurrency(val){
  return val.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
}

function updateCart(){
  const linesContainer = document.getElementById('cart-lines');
  linesContainer.innerHTML=''; // clear
  let total = 0;
  for(const id in cart){
    const qty = cart[id];
    const prodDiv = document.querySelector('.prod[data-id="'+id+'"]');
    const price = parseFloat(prodDiv.dataset.precio);
    total += price*qty;
    const line = document.createElement('div');
    line.className='linea';
    line.dataset.id=id;
    const name = prodDiv.querySelector('h3').textContent;
    line.innerHTML=`<span>${name}</span><span class="cant">${qty}</span><button class="quitar" data-id="${id}">Quitar</button>`;
    linesContainer.appendChild(line);
  }
  document.getElementById('total').textContent=formatCurrency(total);
  // enable/disable add buttons
  document.querySelectorAll('.add').forEach(btn=>{
    const id=btn.dataset.id;
    const prodDiv=document.querySelector('.prod[data-id="'+id+'"]');
    const stock=parseInt(prodDiv.dataset.stock);
    const qty=cart[id]||0;
    btn.disabled=qty>=stock;
  });
  // show or hide cart
  const cartDiv=document.querySelector('.cart');
  if(Object.keys(cart).length===0){
    cartDiv.classList.remove('visible');
  }else{
    cartDiv.classList.add('visible');
  }
}

document.querySelectorAll('.add').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const id=btn.dataset.id;
    const prodDiv=document.querySelector('.prod[data-id="'+id+'"]');
    const stock=parseInt(prodDiv.dataset.stock);
    const qty=cart[id]||0;
    if(qty<stock){
      cart[id]=qty+1;
      updateCart();
    }
  });
});

document.getElementById('cart-lines').addEventListener('click',function(e){
  if(e.target.classList.contains('quitar')){
    const id=e.target.dataset.id;
    const qty=cart[id];
    if(qty>1){
      cart[id]=qty-1;
    }else{
      delete cart[id];
    }
    updateCart();
  }
});

updateCart(); // initial rendering
</script>
</body>
</html>
