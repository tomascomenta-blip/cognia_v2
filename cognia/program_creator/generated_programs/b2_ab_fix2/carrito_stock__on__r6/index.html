<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;background:#f5f5f5;}
.container{display:flex;flex-wrap:wrap;max-width:800px;width:100%;margin:20px;animation:fadeIn 1s ease-in-out;}
.products,.cart{background:#fff;border:1px solid #ddd;padding:10px;margin:5px;flex:1 1 300px;box-sizing:border-box;}
.prod{margin-bottom:10px;}
.prod button{margin-left:10px;}
.row{display:flex;align-items:center;margin-bottom:5px;}
.row span{margin-right:10px;}
.row button{margin-left:auto;}
#total{font-weight:bold;font-size:1.2em;}
.linea{display:flex;align-items:center;margin-bottom:5px;}
.linea span{margin-right:10px;}
.linea button{margin-left:auto;}
@media(max-width:600px){.container{flex-direction:column;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      Producto 1 - 100 <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      Producto 2 - 50 <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      Producto 3 - 25 <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div>Total: <span id="total">0</span></div>
  </div>
</div>
<script>
const cart = {}; // id -> cantidad
const linesContainer = document.getElementById('lines');
const totalSpan = document.getElementById('total');
let oldTotal = 0;
function updateTotal(){
  let sum=0;
  for(const id in cart){
    const qty=cart[id];
    const price=parseInt(document.querySelector('.prod[data-id="'+id+'"]').dataset.precio);
    sum+=qty*price;
  }
  const cambio = sum - oldTotal;
  totalSpan.style.color = (cambio >= 0 ? 'green' : 'red');
  oldTotal = sum;
  totalSpan.textContent=sum;
}
function updateLine(id){
  const qty=cart[id];
  let line=document.querySelector('.linea[data-id="'+id+'"]');
  if(qty===0){
    if(line){linesContainer.removeChild(line);}
    return;
  }
  if(!line){
    line=document.createElement('div');
    line.className='linea';
    line.dataset.id=id;
    const span=document.createElement('span');
    span.className='cant';
    span.textContent=qty;
    line.appendChild(span);
    const btn=document.createElement('button');
    btn.className='quitar';
    btn.dataset.id=id;
    btn.textContent='Quitar';
    line.appendChild(btn);
    linesContainer.appendChild(line);
  }else{
    const span=line.querySelector('.cant');
    const oldQty=parseInt(span.textContent);
    const cambio=qty-oldQty;
    span.textContent=qty;
    span.style.color = (cambio >= 0 ? 'green' : 'red');
  }
}
document.querySelectorAll('.add').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const id=btn.dataset.id;
    const stock=parseInt(document.querySelector('.prod[data-id="'+id+'"]').dataset.stock);
    if(!cart[id])cart[id]=0;
    if(cart[id]<stock){
      cart[id]++;
      updateLine(id);
      updateTotal();
    }
  });
});
document.addEventListener('click',e=>{
  if(e.target.classList.contains('quitar')){
    const id=e.target.dataset.id;
    if(cart[id]){
      cart[id]--;
      updateLine(id);
      updateTotal();
    }
  }
});
totalSpan.textContent='0';
totalSpan.style.color='green';
</script>
</body>
</html>
