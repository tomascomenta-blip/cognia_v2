<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f9f9f9;}
.container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:20px;}
.products{flex:1 1 60%;display:flex;flex-wrap:wrap;gap:20px;}
.prod{background:#fff;border:1px solid #ddd;border-radius:8px;flex:1 1 calc(33% - 20px);box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;}
.prod .img{background:#eee;height:150px;display:flex;align-items:center;justify-content:center;font-size:48px;color:#bbb;}
.prod .info{padding:10px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.prod .info p{margin:5px 0;}
.prod .info .price{font-weight:bold;color:#333;}
.prod .info .stock{color:#777;}
.prod .info button{padding:8px;cursor:pointer;background:#28a745;color:#fff;border:none;border-radius:4px;}
.prod .info button:disabled{background:#aaa;cursor:not-allowed;}
.cart{flex:1 1 35%;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;box-sizing:border-box;margin-left:20px;}
.cart h2{margin-top:0;}
.linea{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #eee;}
.linea .name{flex:1;}
.linea .cant{margin:0 10px;}
.linea .quitar{padding:4px 8px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
.linea .quitar:hover{background:#c82333;}
.total{font-weight:bold;margin-top:10px;font-size:1.2em;}
@media(max-width:768px){
  .container{flex-direction:column;}
  .products{flex:1 1 100%;margin-bottom:20px;}
  .cart{flex:1 1 100%;margin-left:0;}
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img">🛒</div>
      <div class="info">
        <p class="name">Producto 1</p>
        <p class="price">$100.00</p>
        <p class="stock">Stock: 2</p>
        <button class="add" data-id="p1">Añadir</button>
      </div>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img">🛍️</div>
      <div class="info">
        <p class="name">Producto 2</p>
        <p class="price">$50.00</p>
        <p class="stock">Stock: 3</p>
        <button class="add" data-id="p2">Añadir</button>
      </div>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img">🎁</div>
      <div class="info">
        <p class="name">Producto 3</p>
        <p class="price">$25.00</p>
        <p class="stock">Stock: 1</p>
        <button class="add" data-id="p3">Añadir</button>
      </div>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">$0.00</span></div>
  </div>
</div>
<script>
class Cart {
  constructor() {
    this.items = {}; // id -> quantity
    this.updateTotal();
  }
  add(id, stock) {
    if (!this.items[id]) this.items[id] = 0;
    if (this.items[id] < stock) {
      this.items[id]++;
      this.updateLine(id);
      this.updateTotal();
      if (this.items[id] === stock) {
        this.disableAdd(id);
      }
    }
  }
  remove(id) {
    if (!this.items[id]) return;
    this.items[id]--;
    if (this.items[id] <= 0) {
      delete this.items[id];
      this.removeLine(id);
      this.enableAdd(id);
    } else {
      this.updateLine(id);
      this.enableAdd(id);
    }
    this.updateTotal();
  }
  updateLine(id) {
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if (line) {
      line.querySelector('.cant').textContent = this.items[id];
    }
  }
  removeLine(id) {
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if (line) line.remove();
  }
  disableAdd(id) {
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    if (btn) btn.disabled = true;
  }
  enableAdd(id) {
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    if (btn) btn.disabled = false;
  }
  updateTotal() {
    let total = 0;
    for (const id in this.items) {
      const price = parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
      total += price * this.items[id];
    }
    const totalEl = document.getElementById('total');
    totalEl.textContent = formatCurrency(total);
  }
}
function formatCurrency(value) {
  return '$' + value.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
}
document.addEventListener('DOMContentLoaded', () => {
  const cart = new Cart();
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const stock = parseInt(prod.dataset.stock);
      cart.add(id, stock);
      if (!document.querySelector(`.linea[data-id="${id}"]`)) {
        const line = document.createElement('div');
        line.className = 'linea';
        line.dataset.id = id;
        line.innerHTML = `
          <span class="name">${prod.querySelector('.name').textContent}</span>
          <span class="cant">${cart.items[id]}</span>
          <button class="quitar" data-id="${id}">-</button>
        `;
        document.getElementById('cart-lines').appendChild(line);
        line.querySelector('.quitar').addEventListener('click', () => {
          cart.remove(id);
        });
      }
    });
  });
});
</script>
</body>
</html>
