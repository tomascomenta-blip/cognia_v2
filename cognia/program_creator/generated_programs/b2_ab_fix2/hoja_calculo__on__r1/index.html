<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:20px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.celda{width:100%;box-sizing:border-box;padding:5px;animation:fade 2s infinite alternate;}
@keyframes fade{from{opacity:0.5;}to{opacity:1;}}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" id="A1">
<input class="celda" data-ref="A2" id="A2">
<input class="celda" data-ref="A3" id="A3">
<input class="celda" data-ref="B1" id="B1">
<input class="celda" data-ref="B2" id="B2">
<input class="celda" data-ref="B3" id="B3">
<input class="celda" data-ref="C1" id="C1">
<input class="celda" data-ref="C2" id="C2">
<input class="celda" data-ref="C3" id="C3">
</div>
<script>
const cells={},dependents={},refs={},reRefAll=/[A-C][1-3]/g,reRefTest=/[A-C][1-3]/,inputs=document.querySelectorAll('.celda');
inputs.forEach(inp=>{
  const r=inp.dataset.ref;
  cells[r]=inp;
  dependents[r]=new Set();
  refs[r]=new Set();
  // set initial value 0
  inp.value='0';
  delete inp.dataset.formula;
  inp.addEventListener('input',()=>handle(r));
});
function handle(r){
  const inp=cells[r];
  const val=inp.value;
  if(val.startsWith('=')){
    inp.dataset.formula=val;
    const old=refs[r];
    refs[r]=new Set(val.match(reRefAll)||[]);
    old.forEach(x=>dependents[x].delete(r));
    refs[r].forEach(x=>dependents[x].add(r));
  }else{
    delete inp.dataset.formula;
    refs[r]=new Set();
    Object.values(dependents).forEach(s=>s.delete(r));
  }
  recompute(r);
}
function recompute(start){
  const queue=[start],visited=new Set();
  while(queue.length){
    const r=queue.shift();
    if(visited.has(r))continue;
    visited.add(r);
    const inp=cells[r];
    const oldVal=inp.value;
    let newVal;
    if(inp.dataset.formula){
      newVal=evalCell(r,[]);
    }else{
      newVal=oldVal;
    }
    inp.value=newVal;
    let change=0;
    const oldNum=parseInt(oldVal)||0;
    const newNum=parseInt(newVal)||0;
    if(oldVal==='CIRC' || newVal==='CIRC'){
      change=0;
    }else{
      change=newNum-oldNum;
    }
    if(newVal==='CIRC'){
      inp.style.color='red';
    }else{
      inp.style.color=(change>=0?'green':'red');
    }
    dependents[r].forEach(d=>queue.push(d));
  }
}
function evalCell(r,stack){
  if(stack.includes(r))return 'CIRC';
  const inp=cells[r];
  if(!inp.dataset.formula)return parseInt(inp.value)||0;
  stack.push(r);
  const expr=inp.dataset.formula.slice(1);
  const parts=expr.split(/([+-])/);
  let acc=parseInt(parts[0])||0;
  for(let i=1;i<parts.length;i+=2){
    const op=parts[i],token=parts[i+1];
    let num;
    if(reRefTest.test(token)){
      num=evalCell(token,stack.slice());
      if(num==='CIRC')return 'CIRC';
    }else{
      num=parseInt(token)||0;
    }
    acc=op==='+'?acc+num:acc-num;
  }
  stack.pop();
  return acc;
}
Object.keys(cells).forEach(r=>handle(r));
</script>
</body>
</html>
