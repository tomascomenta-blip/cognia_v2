<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f0f0f0;}
  h1{font-size:1.5rem;text-align:center;margin-bottom:1rem;}
  table{margin:auto;border-collapse:collapse;}
  td{padding:0;}
  input.celda{
    width:60px;height:30px;text-align:center;border:1px solid #999;
    font-size:1rem;background:#fff;
  }
  @media(max-width:400px){
    input.celda{width:40px;height:25px;font-size:.9rem;}
  }
</style>
</head>
<body>
<h1>🗂️ Mini Hoja de Cálculo 3x3</h1>
<table>
  <tr>
    <td><input class="celda" data-ref="A1"></td>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="A3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1"></td>
    <td><input class="celda" data-ref="B2"></td>
    <td><input class="celda" data-ref="B3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1"></td>
    <td><input class="celda" data-ref="C2"></td>
    <td><input class="celda" data-ref="C3"></td>
  </tr>
</table>

<script>
(() => {
  const cells = Array.from(document.querySelectorAll('input.celda'));
  const refToCell = {};
  cells.forEach(c => refToCell[c.dataset.ref] = c);

  function evaluateCell(cell, stack) {
    const ref = cell.dataset.ref;
    if (cell.dataset.formula) {
      if (stack.includes(ref)) return 'CIRC';
      stack.push(ref);
      const formula = cell.dataset.formula.slice(1);
      const regex = /([A-Z][1-3])|([+-])|(\d+)/g;
      let match;
      let result = null;
      let currentOp = '+';
      while ((match = regex.exec(formula)) !== null) {
        if (match[1]) {
          const refCell = refToCell[match[1]];
          const val = refCell ? evaluateCell(refCell, stack) : 0;
          if (val === 'CIRC') { stack.pop(); return 'CIRC'; }
          const num = typeof val === 'number' ? val : parseInt(val,10) || 0;
          if (result === null) result = num;
          else if (currentOp === '+') result += num;
          else result -= num;
        } else if (match[2]) {
          currentOp = match[2];
        } else if (match[3]) {
          const num = parseInt(match[3],10);
          if (result === null) result = num;
          else if (currentOp === '+') result += num;
          else result -= num;
        }
      }
      stack.pop();
      return result;
    } else {
      const val = parseInt(cell.value,10);
      return isNaN(val) ? 0 : val;
    }
  }

  function evaluateAll() {
    cells.forEach(cell => {
      let newVal;
      if (cell.dataset.formula) {
        newVal = evaluateCell(cell, []);
        if (newVal === 'CIRC') {
          cell.value = 'CIRC';
          cell.style.color = 'black';
          cell.dataset.prev = newVal;
          return;
        }
        cell.value = newVal.toString();
      } else {
        const val = parseInt(cell.value,10);
        newVal = isNaN(val) ? 0 : val;
        cell.value = newVal.toString();
      }
      const prev = parseFloat(cell.dataset.prev);
      const change = isNaN(prev) ? 0 : newVal - prev;
      cell.style.color = (change >= 0 ? 'green' : 'red');
      cell.dataset.prev = newVal;
    });
  }

  cells.forEach(cell => {
    cell.addEventListener('change', e => {
      const newVal = e.target.value.trim();
      if (newVal.startsWith('=')) {
        cell.dataset.formula = newVal;
      } else {
        delete cell.dataset.formula;
        cell.value = newVal;
      }
      evaluateAll();
    });
  });

  evaluateAll();
})();
</script>
</body>
</html>
