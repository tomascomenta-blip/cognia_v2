<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<style>
body{font-family:sans-serif;margin:0;padding:1rem;}
.board{display:flex;gap:1rem;}
.col{flex:1;border:1px solid #ccc;padding:0.5rem;}
.card{background:#f9f9f9;margin-bottom:0.5rem;padding:0.5rem;border:1px solid #ddd;}
.card button{margin-right:0.2rem;}
</style>
</head>
<body>
<div class="board">
<div class="col" data-col="todo"><h3>Pendiente (<span id="cont-todo"></span>)</h3></div>
<div class="col" data-col="doing"><h3>En Progreso (<span id="cont-doing"></span>)</h3></div>
<div class="col" data-col="done"><h3>Hecho (<span id="cont-done"></span>)</h3></div>
</div>
<script>
const cols=['todo','doing','done'];
function update(){cols.forEach(c=>{document.getElementById('cont-'+c).textContent=document.querySelectorAll('.col[data-col="'+c+'"] .card').length;});}
function move(card,dir){let cur=card.parentElement.dataset.col;let idx=cols.indexOf(cur);let tgt=cols[idx+dir];if(!tgt)return;if(cur==='todo'&&dir===1){if(document.querySelectorAll('.col[data-col="doing"] .card').length>=2)return;}if(cur==='done'&&dir===1)return;if(cur==='todo'&&dir===-1)return;card.parentElement.parentElement.querySelector('.col[data-col="'+tgt+'"]').appendChild(card);update();}
document.addEventListener('click',e=>{if(e.target.classList.contains('mas'))move(e.target.closest('.card'),1);else if(e.target.classList.contains('menos'))move(e.target.closest('.card'),-1);});
for(let i=1;i<=3;i++){let c=document.createElement('div');c.className='card';c.dataset.id='t'+i;c.textContent='t'+i+' ';let m=document.createElement('button');m.className='menos';m.textContent='←';let p=document.createElement('button');p.className='mas';p.textContent='→';c.appendChild(m);c.appendChild(p);document.querySelector('.col[data-col="todo"]').appendChild(c);}
update();
</script>
</body>
</html>
