<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Un buscaminas 5x5</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:300px;}
.c{background:#ccc;width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:bold;cursor:pointer;user-select:none;}
.c.abierta{background:#eee;cursor:default;}
.c.bandera{background:#f00;color:#fff;}
#estado{margin-top:10px;font-size:1.2rem;text-align:center;}
</style>
</head>
<body>
<div id="grid">
<div class="c" data-i="0"></div>
<div class="c" data-i="1"></div>
<div class="c" data-i="2"></div>
<div class="c" data-i="3"></div>
<div class="c" data-i="4"></div>
<div class="c" data-i="5"></div>
<div class="c" data-i="6"></div>
<div class="c" data-i="7"></div>
<div class="c" data-i="8"></div>
<div class="c" data-i="9"></div>
<div class="c" data-i="10"></div>
<div class="c" data-i="11"></div>
<div class="c" data-i="12"></div>
<div class="c" data-i="13"></div>
<div class="c" data-i="14"></div>
<div class="c" data-i="15"></div>
<div class="c" data-i="16"></div>
<div class="c" data-i="17"></div>
<div class="c" data-i="18"></div>
<div class="c" data-i="19"></div>
<div class="c" data-i="20"></div>
<div class="c" data-i="21"></div>
<div class="c" data-i="22"></div>
<div class="c" data-i="23"></div>
<div class="c" data-i="24"></div>
</div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const cells=document.querySelectorAll('.c');
const estado=document.getElementById('estado');
let gameOver=false;
const adjacentCounts=new Array(25).fill(0);
function getNeighbors(i){
  const r=Math.floor(i/5),c=i%5;
  const neigh=[];
  for(let dr=-1;dr<=1;dr++){
    for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0)continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<5&&nc>=0&&nc<5)neigh.push(nr*5+nc);
    }
  }
  return neigh;
}
for(let i=0;i<25;i++){
  let count=0;
  for(const n of getNeighbors(i)){
    if(mines.includes(n))count++;
  }
  adjacentCounts[i]=count;
}
function openCell(i){
  if(gameOver)return;
  const cell=cells[i];
  if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
  if(mines.includes(i)){
    cell.classList.add('abierta');
    cell.textContent='X';
    estado.textContent='perdiste';
    gameOver=true;
    return;
  }
  const count=adjacentCounts[i];
  cell.classList.add('abierta');
  if(count>0)cell.textContent=count;
  else{
    for(const n of getNeighbors(i))openCell(n);
  }
}
cells.forEach(cell=>{
  cell.addEventListener('click',e=>{
    if(gameOver)return;
    const i=parseInt(cell.dataset.i);
    openCell(i);
  });
  cell.addEventListener('contextmenu',e=>{
    e.preventDefault();
    if(gameOver)return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  });
});
</script>
</body>
</html>
