<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{margin:0;font-family:sans-serif;background:#f9f9f9;display:flex;align-items:center;justify-content:center;height:100vh;}
.grid{display:grid;grid-template-columns:repeat(3,80px);gap:8px;}
.celda{width:80px;height:30px;border:1px solid #ccc;border-radius:4px;padding:4px;text-align:right;font-size:14px;color:#333;background:#fff;}
.celda:focus{outline:2px solid #4a90e2;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" value="">
<input class="celda" data-ref="A2" value="">
<input class="celda" data-ref="A3" value="">
<input class="celda" data-ref="B1" value="">
<input class="celda" data-ref="B2" value="">
<input class="celda" data-ref="B3" value="">
<input class="celda" data-ref="C1" value="">
<input class="celda" data-ref="C2" value="">
<input class="celda" data-ref="C3" value="">
</div>
<script>
const cells=document.querySelectorAll('.celda');
function computeCell(ref,stack){
  if(stack.has(ref))return{circular:true};
  stack.add(ref);
  const cell=document.querySelector(`input[data-ref="${ref}"]`);
  const formula=cell.dataset.formula;
  if(!formula){
    const v=parseFloat(cell.value)||0;
    stack.delete(ref);
    return{value:v};
  }
  const expr=formula.slice(1);
  const refs=expr.match(/[A-C][1-3]/g)||[];
  let exprEval=expr;
  for(const r of refs){
    const res=computeCell(r,stack);
    if(res.circular){stack.delete(ref);return{circular:true};}
    exprEval=exprEval.replaceAll(r,res.value);
  }
  let val;
  try{val=Function(`return ${exprEval}`)();}
  catch(e){val=NaN;}
  stack.delete(ref);
  return{value:val};
}
function recompute(){
  cells.forEach(c=>{
    if(c.dataset.formula){
      const res=computeCell(c.getAttribute('data-ref'),new Set());
      c.value=res.circular?'CIRC':res.value;
    }
  });
}
cells.forEach(c=>{
  c.addEventListener('input',e=>{
    const val=e.target.value;
    if(val.startsWith('='))e.target.dataset.formula=val;
    else delete e.target.dataset.formula;
    recompute();
  });
});
</script>
</body>
</html>
