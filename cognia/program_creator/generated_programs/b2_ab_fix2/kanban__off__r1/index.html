<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en una sola página</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh;}
  .board{display:flex;flex:1;padding:10px;gap:10px;}
  .col{flex:1;background:#f0f0f0;padding:10px;border-radius:5px;display:flex;flex-direction:column;}
  .col h2{margin:0 0 10px 0;text-align:center;}
  .counter{font-weight:bold;text-align:center;margin-bottom:10px;}
  .card{background:#fff;padding:10px;margin-bottom:10px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;}
  .card button{margin-top:5px;padding:2px 5px;font-size:.9em;}
  @media (max-width:600px){
    .board{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo</h2>
    <div class="counter">Tarjetas: <span id="cont-todo">3</span></div>
    <div class="card" data-id="t1">
      <div>Tarea 1</div>
      <button class="menos">←</button>
      <button class="mas">→</button>
    </div>
    <div class="card" data-id="t2">
      <div>Tarea 2</div>
      <button class="menos">←</button>
      <button class="mas">→</button>
    </div>
    <div class="card" data-id="t3">
      <div>Tarea 3</div>
      <button class="menos">←</button>
      <button class="mas">→</button>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing</h2>
    <div class="counter">Tarjetas: <span id="cont-doing">0</span></div>
  </div>
  <div class="col" data-col="done">
    <h2>Done</h2>
    <div class="counter">Tarjetas: <span id="cont-done">0</span></div>
  </div>
</div>
<script>
  const columns = ['todo','doing','done'];
  const maxCards = {todo: Infinity, doing: 2, done: Infinity};

  function updateCounters(){
    columns.forEach(col=>{
      const count = document.querySelectorAll('.col[data-col="'+col+'"] .card').length;
      document.getElementById('cont-'+col).textContent = count;
    });
  }

  function moveCard(card, dir){
    const currentCol = card.parentElement.getAttribute('data-col');
    const idx = columns.indexOf(currentCol);
    const targetIdx = idx + dir;
    if(targetIdx<0 || targetIdx>=columns.length) return;
    const targetCol = columns[targetIdx];
    if(maxCards[targetCol]!==Infinity){
      const targetCount = document.querySelectorAll('.col[data-col="'+targetCol+'"] .card').length;
      if(targetCount>=maxCards[targetCol]) return;
    }
    const targetDiv = document.querySelector('.col[data-col="'+targetCol+'"]');
    targetDiv.appendChild(card);
    updateCounters();
  }

  document.querySelectorAll('.mas').forEach(btn=>{
    btn.addEventListener('click',()=>moveCard(btn.parentElement,1));
  });
  document.querySelectorAll('.menos').forEach(btn=>{
    btn.addEventListener('click',()=>moveCard(btn.parentElement,-1));
  });

  updateCounters();
</script>
</body>
</html>
