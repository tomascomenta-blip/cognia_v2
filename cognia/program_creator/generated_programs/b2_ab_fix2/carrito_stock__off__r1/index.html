<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#f9f9f9;margin:0;padding:0;}#app{display:flex;height:100vh;}#products{flex:1;padding:20px;overflow:auto;}#cart{flex:1;padding:20px;overflow:auto;border-left:1px solid #ddd;background:#fff;} .prod{margin-bottom:15px;padding:10px;background:#e0f7fa;border-radius:5px;} .add{background:#009688;color:#fff;border:none;padding:5px 10px;border-radius:3px;font-weight:bold;cursor:pointer;} .add:disabled{background:#bbb;cursor:not-allowed;} .stock{display:block;margin-top:5px;font-size:0.9em;color:#555;} .linea{display:flex;align-items:center;margin-bottom:10px;} .cant{margin:0 10px;font-weight:bold;} .quitar{background:#ff5252;color:#fff;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;} #total{margin-top:20px;font-size:1.2em;font-weight:bold;} @media(max-width:600px){#app{flex-direction:column;}}</style>
</head>
<body>
<div id="app">
<div id="products">
<div class="prod" data-id="p1" data-precio="100" data-stock="2"><button class="add" data-id="p1">Añadir</button><span class="stock">Stock: 2</span></div>
<div class="prod" data-id="p2" data-precio="50" data-stock="3"><button class="add" data-id="p2">Añadir</button><span class="stock">Stock: 3</span></div>
<div class="prod" data-id="p3" data-precio="25" data-stock="1"><button class="add" data-id="p3">Añadir</button><span class="stock">Stock: 1</span></div>
</div>
<div id="cart">
<div id="lines"></div>
<div>Total: <span id="total">0 €</span></div>
</div>
</div>
<script>const prods={};document.querySelectorAll('.prod').forEach(p=>{const id=p.dataset.id;prods[id]={price:+p.dataset.precio,stock:+p.dataset.stock,qty:0};});function updLine(id){const prod=prods[id];let line=document.querySelector('.linea[data-id="'+id+'"]');if(prod.qty>0){if(line){line.querySelector('.cant').textContent=prod.qty;}else{line=document.createElement('div');line.className='linea';line.dataset.id=id;const c=document.createElement('span');c.className='cant';c.textContent=prod.qty;const q=document.createElement('button');q.className='quitar';q.dataset.id=id;q.textContent='-';q.addEventListener('click',()=>{rem(id)});line.append(c,q);document.getElementById('lines').append(line);}}else{if(line)line.remove();}}function rem(id){const prod=prods[id];if(prod.qty>0){prod.qty--;updLine(id);updTot();document.querySelector('.add[data-id="'+id+'"]').disabled=false;}}function updTot(){let t=0;for(const id in prods)t+=prods[id].qty*prods[id].price;document.getElementById('total').textContent=t.toLocaleString('es-ES',{style:'currency',currency:'EUR'});}document.querySelectorAll('.add').forEach(b=>{b.addEventListener('click',()=>{const id=b.dataset.id;const prod=prods[id];if(prod.qty<prod.stock){prod.qty++;updLine(id);updTot();if(prod.qty===prod.stock)b.disabled=true;}});});</script>
</body>
</html>
