<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:sans-serif;
    background:#f0f0f0;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    width:100%;
    max-width:400px;
  }
  .c{
    background:#ccc;
    border:1px solid #999;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera{
    background:#fdd;
  }
  #estado{
    margin-top:10px;
    font-size:1.2rem;
    color:#900;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
(function(){
  const mines=[6,12,18];
  const grid=document.getElementById('grid');
  const estado=document.getElementById('estado');
  const cells=[];
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='c';
    div.dataset.i=i;
    if(mines.includes(i)) div.dataset.mine='true';
    div.addEventListener('click',()=>openCell(i));
    div.addEventListener('contextmenu',e=>{
      e.preventDefault();
      toggleFlag(i);
    });
    grid.appendChild(div);
    cells.push(div);
  }
  function getNeighbors(idx){
    const r=Math.floor(idx/5),c=idx%5;
    const neighbors=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          neighbors.push(nr*5+nc);
        }
      }
    }
    return neighbors;
  }
  function openCell(idx){
    const cell=cells[idx];
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
    if(cell.dataset.mine==='true'){
      cell.classList.add('abierta');
      cell.innerText='💣';
      estado.textContent='perdiste';
      return;
    }
    const neighbors=getNeighbors(idx);
    let count=0;
    for(const n of neighbors){
      if(cells[n].dataset.mine==='true')count++;
    }
    cell.classList.add('abierta');
    cell.innerText=count>0?count:'';
    if(count===0){
      for(const n of neighbors){
        openCell(n);
      }
    }
  }
  function toggleFlag(idx){
    const cell=cells[idx];
    if(cell.classList.contains('abierta'))return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.innerText='';
    }else{
      cell.classList.add('bandera');
      cell.innerText='🚩';
    }
  }
})();
</script>
</body>
</html>
