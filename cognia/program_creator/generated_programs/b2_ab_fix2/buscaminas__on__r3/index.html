<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:90vmin;height:90vmin;}
.c{background:#ccc;border:1px solid #999;display:flex;justify-content:center;align-items:center;font-size:1.5rem;cursor:pointer;aspect-ratio:1;}
.c.abierta{background:#eee;cursor:default;}
.c.bandera{background:#fdd;}
#estado{margin-top:10px;text-align:center;font-size:1.2rem;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const grid=document.getElementById('grid');
const estado=document.getElementById('estado');
const cells=[];
for(let i=0;i<25;i++){
  const d=document.createElement('div');
  d.className='c';d.dataset.i=i;
  d.onclick=function(){
    if(d.classList.contains('bandera')) return;
    open(i);
  };
  d.oncontextmenu=function(e){e.preventDefault(); flag(i);};
  grid.appendChild(d);cells.push(d);
}
const neigh=[...Array(25)].map(()=>[]);
for(let i=0;i<25;i++){
  let r=Math.floor(i/5),c=i%5;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    let nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<5&&nc>=0&&nc<5)neigh[i].push(nr*5+nc);
  }
}
function open(i,cascade=true){
  const d=cells[i];
  if(d.classList.contains('abierta')||d.classList.contains('bandera'))return;
  if(mines.includes(i)){d.classList.add('abierta');estado.textContent='perdiste';return;}
  let cnt=neigh[i].filter(j=>mines.includes(j)).length;
  d.textContent=cnt?cnt:'';
  d.style.color='green';
  d.classList.add('abierta');
  if(cnt===0 && cascade){neigh[i].forEach(j=>open(j,false));}
}
function flag(i){
  const d=cells[i];
  if(d.classList.contains('abierta'))return;
  d.classList.toggle('bandera');
  d.textContent=d.classList.contains('bandera')?'🚩':'';
}
let autoInterval;
setTimeout(()=>{autoInterval=setInterval(()=>{
  if(estado.textContent==='perdiste'){clearInterval(autoInterval);return;}
  const candidates=cells.filter(c=>!c.classList.contains('abierta')&&!c.classList.contains('bandera'));
  if(candidates.length===0){clearInterval(autoInterval);return;}
  const rand=candidates[Math.floor(Math.random()*candidates.length)];
  open(parseInt(rand.dataset.i));
},700);},1000);
</script>
</body>
</html>
