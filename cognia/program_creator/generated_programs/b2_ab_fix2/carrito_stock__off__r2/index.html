<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Un carrito de compra con STOCK</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh;}
.container{display:flex;flex-direction:column;padding:1rem;}
.products{display:flex;flex-wrap:wrap;gap:1rem;}
.prod{border:1px solid #ccc;padding:1rem;flex:1 1 calc(33% - 2rem);box-sizing:border-box;min-width:200px;}
.prod h3{margin-top:0;}
.prod button.add{margin-top:0.5rem;}
.cart{border-top:2px solid #000;margin-top:1rem;padding-top:1rem;}
.linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;}
.linea span.cant{font-weight:bold;}
.linea button.quitar{margin-left:1rem;}
#total{font-weight:bold;}
@media(max-width:600px){.prod{flex:1 1 100%;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p>Precio: <span class="precio">100,00 €</span></p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p>Precio: <span class="precio">50,00 €</span></p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p>Precio: <span class="precio">25,00 €</span></p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div id="cart" class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <p>Total: <span id="total">0,00 €</span></p>
  </div>
</div>
<script>
const locale = 'es-ES';
const currency = 'EUR';
function formatCurrency(value){return value.toLocaleString(locale,{style:'currency',currency:currency});}
const addButtons=document.querySelectorAll('.add');
const linesContainer=document.getElementById('lines');
const totalSpan=document.getElementById('total');
const cart={};
function updateTotal(){let total=0;for(const id in cart){const qty=cart[id];const price=parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);total+=qty*price;}totalSpan.textContent=formatCurrency(total);}
function updateAddButton(id){const prodDiv=document.querySelector(`.prod[data-id="${id}"]`);const stock=parseInt(prodDiv.dataset.stock,10);const qty=cart[id]||0;const button=document.querySelector(`.add[data-id="${id}"]`);button.disabled=qty>=stock;}
function addToCart(id){const prodDiv=document.querySelector(`.prod[data-id="${id}"]`);const stock=parseInt(prodDiv.dataset.stock,10);const qty=cart[id]||0;if(qty>=stock)return;cart[id]=qty+1;if(qty===0){const lineDiv=document.createElement('div');lineDiv.className='linea';lineDiv.dataset.id=id;const cantSpan=document.createElement('span');cantSpan.className='cant';cantSpan.textContent=cart[id];const quitarBtn=document.createElement('button');quitarBtn.className='quitar';quitarBtn.dataset.id=id;quitarBtn.textContent='Quitar';lineDiv.appendChild(cantSpan);lineDiv.appendChild(quitarBtn);linesContainer.appendChild(lineDiv);quitarBtn.addEventListener('click',()=>removeFromCart(id));}else{const lineDiv=linesContainer.querySelector(`.linea[data-id="${id}"]`);const cantSpan=lineDiv.querySelector('.cant');cantSpan.textContent=cart[id];}updateAddButton(id);updateTotal();}
function removeFromCart(id){const qty=cart[id]||0;if(qty<=0)return;cart[id]=qty-1;if(cart[id]===0){const lineDiv=linesContainer.querySelector(`.linea[data-id="${id}"]`);if(lineDiv)lineDiv.remove();delete cart[id];}else{const lineDiv=linesContainer.querySelector(`.linea[data-id="${id}"]`);const cantSpan=lineDiv.querySelector('.cant');cantSpan.textContent=cart[id];}updateAddButton(id);updateTotal();}
addButtons.forEach(btn=>{btn.addEventListener('click',()=>addToCart(btn.dataset.id));});
</script>
</body>
</html>
