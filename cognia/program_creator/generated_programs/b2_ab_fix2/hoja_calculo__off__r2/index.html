<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    font-family: Arial, sans-serif;
    margin:0; padding:0;
    background:#f0f0f0;
    display:flex; align-items:center; justify-content:center;
    height:100vh;
  }
  .container{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    width:100%; max-width:400px;
    background:#fff;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    box-sizing:border-box;
  }
  .celda{
    width:100%; height:2.5rem;
    padding:0 5px;
    font-size:1rem;
    text-align:right;
    border:1px solid #ccc;
    border-radius:4px;
    box-sizing:border-box;
    outline:none;
    transition:border-color .2s;
  }
  .celda:focus{border-color:#66afe9;}
  @media(max-width:500px){
    .container{max-width:90%;}
  }
</style>
<script>
"use strict";
const MAX_DECIMALS=2; // configurable constant

document.addEventListener('DOMContentLoaded',()=>{

  const cells=document.querySelectorAll('.celda');
  const refMap=new Map();
  const dependencies=new Map(); // ref -> Set of refs it depends on
  const dependents=new Map();   // ref -> Set of refs that depend on it

  cells.forEach(cell=>{
    const ref=cell.dataset.ref;
    cell.id=ref; // add id for selectors
    refMap.set(ref,cell);
    dependencies.set(ref,new Set());
    dependents.set(ref,new Set());
    // initialize old value for color diff
    cell.dataset.oldVal='0';
  });

  function parseRefs(formula){
    const refs=[];
    const regex= /([A-C][1-3])/g;
    let m;
    while((m=regex.exec(formula))!==null) refs.push(m[1]);
    return refs;
  }

  function updateDependencies(ref,oldDeps,newDeps){
    oldDeps.forEach(dep=>dependents.get(dep).delete(ref));
    newDeps.forEach(dep=>dependents.get(dep).add(ref));
    dependencies.set(ref,new Set(newDeps));
  }

  function evaluateCell(ref,visited=new Set()){
    const cell=refMap.get(ref);
    if(!cell)return '0';
    if(visited.has(ref))return 'CIRC';
    visited.add(ref);
    const formula=cell.dataset.formula;
    if(!formula){
      if(cell.value==='CIRC'){visited.delete(ref);return 'CIRC';}
      const val=parseFloat(cell.value);
      visited.delete(ref);
      return isNaN(val)?'0':val.toString();
    }
    const expr=formula.slice(1).replace(/\s+/g,'');
    const tokens=expr.split(/([+-])/);
    let result=0,op='+';
    for(const token of tokens){
      if(token==='')continue;
      if(token==='+'||token==='-'){op=token;continue;}
      let num;
      if(/^\d+(\.\d+)?$/.test(token)){
        num=parseFloat(token);
      }else{
        const depVal=evaluateCell(token,visited);
        if(depVal==='CIRC'){visited.delete(ref);return 'CIRC';}
        num=parseFloat(depVal)||0;
      }
      if(op==='+')result+=num;else result-=num;
    }
    visited.delete(ref);
    return result.toString();
  }

  function updateCell(ref){
    const cell=refMap.get(ref);
    if(cell.dataset.formula){
      const val=evaluateCell(ref);
      const oldVal=parseFloat(cell.dataset.oldVal)||0;
      const newVal=parseFloat(val)||0;
      const diff=newVal-oldVal;
      cell.value=val;
      cell.style.color=diff>=0?'green':'red';
      cell.dataset.oldVal=newVal.toString();
    }
  }

  function recalc(ref,visited=new Set()){
    if(visited.has(ref))return;
    visited.add(ref);
    updateCell(ref);
    dependents.get(ref).forEach(dep=>recalc(dep,visited));
  }

  function handleChange(e){
    const cell=e.target;
    const ref=cell.dataset.ref;
    const val=cell.value;
    if(val.startsWith('='))cell.dataset.formula=val;
    else delete cell.dataset.formula;
    const oldDeps=dependencies.get(ref)||new Set();
    const newDeps=val.startsWith('=')?parseRefs(val):[];
    updateDependencies(ref,oldDeps,newDeps);
    recalc(ref);
  }

  // Initial evaluation
  cells.forEach(cell=>{
    const ref=cell.dataset.ref;
    const val=cell.value;
    if(val.startsWith('='))cell.dataset.formula=val;
    else delete cell.dataset.formula;
    const deps=val.startsWith('=')?parseRefs(val):[];
    updateDependencies(ref,[],deps);
    updateCell(ref);
  });

  cells.forEach(cell=>cell.addEventListener('input',handleChange));
});
</script>
</head>
<body>
<div class="container">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>
</body>
</html>
