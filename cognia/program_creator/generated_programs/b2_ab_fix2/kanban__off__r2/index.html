<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tablero Kanban</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  header{padding:10px;background:#333;color:#fff;text-align:center;}
  header span{margin:0 10px;}
  .container{display:flex;flex-wrap:wrap;justify-content:space-between;padding:10px;}
  .col{background:#fff;border-radius:5px;margin:5px;flex:1 1 30%;box-sizing:border-box;min-width:250px;max-width:30%;padding:10px;animation:fadeIn 0.6s ease forwards;animation-delay:0.2s;}
  .col h2{font-size:1.2em;margin-top:0;}
  .card{background:#e3e3e3;border-radius:3px;padding:5px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;animation:fadeIn 0.4s ease forwards;}
  .card button{margin-left:5px;}
  @media (max-width:600px){
    .col{flex:1 1 100%;max-width:100%;}
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<header>
  Pendientes: <span id="cont-todo"></span> |
  En Progreso: <span id="cont-doing"></span> |
  Completado: <span id="cont-done"></span>
</header>
<div class="container">
  <div class="col" data-col="todo">
    <h2>Pendientes</h2>
  </div>
  <div class="col" data-col="doing">
    <h2>En Progreso</h2>
  </div>
  <div class="col" data-col="done">
    <h2>Completado</h2>
  </div>
</div>
<script>
  const columns = ['todo','doing','done'];
  const colElements = {};
  columns.forEach(col=>{
    colElements[col] = document.querySelector('.col[data-col="'+col+'"]');
  });
  // create initial cards
  const initialIds = ['t1','t2','t3'];
  initialIds.forEach(id=>{
    const card = createCard(id);
    colElements['todo'].appendChild(card);
  });
  updateCounters();
  // event delegation for buttons
  document.body.addEventListener('click', function(e){
    if(e.target.classList.contains('mas') || e.target.classList.contains('menos')){
      const card = e.target.closest('.card');
      if(!card) return;
      const currentColEl = card.parentElement;
      const currentCol = currentColEl.dataset.col;
      const idx = columns.indexOf(currentCol);
      let newIdx = idx;
      if(e.target.classList.contains('mas')){
        if(currentCol === 'done') return;
        newIdx = idx + 1;
      } else if(e.target.classList.contains('menos')){
        if(currentCol === 'todo') return;
        newIdx = idx - 1;
      }
      const newCol = columns[newIdx];
      // WIP rule: only count cards, not header
      if(newCol === 'doing' && colElements['doing'].querySelectorAll('.card').length >= 2){
        return;
      }
      // move card
      colElements[newCol].appendChild(card);
      updateCounters();
    }
  });
  function createCard(id){
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.id = id;
    div.innerHTML = '<span>'+id+'</span>' +
      '<div>' +
        '<button class="menos">&lt;</button>' +
        '<button class="mas">&gt;</button>' +
      '</div>';
    return div;
  }
  function updateCounters(){
    document.getElementById('cont-todo').textContent = colElements['todo'].querySelectorAll('.card').length;
    document.getElementById('cont-doing').textContent = colElements['doing'].querySelectorAll('.card').length;
    document.getElementById('cont-done').textContent = colElements['done'].querySelectorAll('.card').length;
  }
</script>
</body>
</html>
