<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Minesweeper 5x5</title><style>body{font-family:sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f0f0;}#grid{display:grid;grid-template-columns:repeat(5,40px);gap:2px;} .c{width:40px;height:40px;background:#bbb;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;} .c.abierta{background:#ddd;} .c.bandera{background:#f88;} #estado{margin-top:10px;font-size:18px;}</style></head><body><div id="grid"></div><div id="estado"></div><script>const mines=[6,12,18],grid=document.getElementById('grid');for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;d.addEventListener('click',()=>openCell(d));d.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(d);});grid.appendChild(d);}function neighbors(i){const r=Math.floor(i/5),c=i%5,arr=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr||dc){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5)arr.push(nr*5+nc);}}return arr;}function countAdj(i){return neighbors(i).filter(n=>mines.includes(n)).length;}function openCell(cell){if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;const i=parseInt(cell.dataset.i);if(mines.includes(i)){cell.classList.add('abierta');document.getElementById('estado').textContent='perdiste';return;}const cnt=countAdj(i);cell.classList.add('abierta');cell.textContent=cnt?cnt:'';if(cnt===0){const q=[i],visited=new Set([i]);while(q.length){const cur=q.shift();neighbors(cur).forEach(n=>{if(visited.has(n)||grid.children[n].classList.contains('bandera'))return;visited.add(n);const cEl=grid.children[n];const cnt2=countAdj(n);cEl.classList.add('abierta');cEl.textContent=cnt2?cnt2:'';if(cnt2===0)q.push(n);});}}}function toggleFlag(cell){if(cell.classList.contains('abierta'))return;cell.classList.toggle('bandera');}</script></body></html>
