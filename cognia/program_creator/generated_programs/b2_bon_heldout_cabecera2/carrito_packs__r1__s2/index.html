<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Packs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f9f9f9;color:#333;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  nav{width:100%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.1);padding:1rem;text-align:center;font-size:1.2rem;font-weight:bold;color:#333;}
  main{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:1200px;padding:1rem;}
  .product-section{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;width:100%;}
  .card{background:#fff;border:1px solid #ddd;border-radius:8px;width:280px;padding:1rem;display:flex;flex-direction:column;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .card svg{width:100%;height:auto;border-radius:4px;}
  .card h3{margin:0.5rem 0;font-size:1.1rem;text-align:center;}
  .card p.price{margin:0.5rem 0;font-size:1rem;color:#555;}
  .card button.add{background:#ffb347;color:#fff;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer;font-weight:bold;margin-top:auto;transition:background .2s;}
  .card button.add:hover{background:#ffa500;}
  .cart-summary{background:#fff;border:1px solid #ddd;border-radius:8px;width:100%;max-width:600px;padding:1rem;margin-top:2rem;display:flex;flex-direction:column;gap:0.5rem;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;}
  .cart-item span.name{flex:1;font-weight:bold;}
  .cart-item span.cant{background:#eee;border-radius:12px;padding:0.2rem 0.6rem;margin-left:0.5rem;font-size:0.9rem;}
  .cart-item button.quitar{background:#ffb347;color:#fff;border:none;padding:0.3rem 0.6rem;border-radius:4px;cursor:pointer;font-weight:bold;transition:background .2s;}
  .cart-item button.quitar:hover{background:#ffa500;}
  .cart-summary .totals{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;font-size:1.2rem;font-weight:bold;}
  .cart-summary .totals span{margin-left:0.5rem;}
  .cart-summary .totals span#packs{color:#ffb347;}
  .cart-summary .totals span#total{color:#ffb347;}
  @media(max-width:600px){
    .card{width:90%;}
    .cart-summary{width:90%;}
  }
</style>
</head>
<body>
<nav>Carrito de Pan y Leche</nav>
<main>
  <section class="product-section">
    <div class="card">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#ddd"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#aaa" font-size="12">Pan</text>
      </svg>
      <h3>Pan</h3>
      <p class="price">2 €</p>
      <button class="add" data-id="pan">Añadir</button>
    </div>
    <div class="card">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#ddd"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#aaa" font-size="12">Leche</text>
      </svg>
      <h3>Leche</h3>
      <p class="price">3 €</p>
      <button class="add" data-id="leche">Añadir</button>
    </div>
  </section>

  <section class="cart-summary">
    <div class="cart-item">
      <span class="name">Pan</span>
      <span class="cant" data-id="pan">0</span>
      <button class="quitar" data-id="pan">Quitar</button>
    </div>
    <div class="cart-item">
      <span class="name">Leche</span>
      <span class="cant" data-id="leche">0</span>
      <button class="quitar" data-id="leche">Quitar</button>
    </div>
    <div class="totals">
      <span>Packs:</span> <span id="packs">0</span>
      <span>Total:</span> <span id="total">0,00 €</span>
    </div>
  </section>
</main>

<script>
  const prices = {pan:2, leche:3};
  const packPrice = 4;
  const quantities = {pan:0, leche:0};

  function updateCart() {
    const panQty = quantities.pan;
    const lecheQty = quantities.leche;
    const packs = Math.min(panQty, lecheQty);
    const total = packs*packPrice + (panQty-packs)*prices.pan + (lecheQty-packs)*prices.leche;

    document.querySelectorAll('.cant[data-id="pan"]').forEach(el=>el.textContent=panQty);
    document.querySelectorAll('.cant[data-id="leche"]').forEach(el=>el.textContent=lecheQty);
    document.getElementById('packs').textContent=packs;
    document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  }

  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      quantities[id]++;
      updateCart();
    });
  });

  document.querySelectorAll('.quitar').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      if(quantities[id]>0){quantities[id]--;updateCart();}
    });
  });

  // initial render
  updateCart();
</script>
</body>
</html>
