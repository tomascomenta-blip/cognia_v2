<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Control de Stock con Reservas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f5f5f5;
  --accent:#333;
  --teal:#008080;
  --text:#222;
  --muted:#e0e0e0;
}
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header,footer{
  background:var(--muted);
  padding:1rem;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{
  margin:0;
  font-size:2rem;
}
header .stock-info,header .available-info{
  font-size:1.2rem;
}
#reservas{
  flex:1;
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:0.5rem;
}
.res{
  background:#fff;
  border:1px solid var(--accent);
  border-radius:4px;
  padding:0.5rem 1rem;
  font-size:1rem;
}
button{
  background:var(--teal);
  color:#fff;
  border:none;
  padding:0.5rem 1rem;
  border-radius:4px;
  cursor:pointer;
  font-size:1rem;
}
button:hover{opacity:0.9;}
input[type=number]{
  padding:0.4rem;
  font-size:1rem;
  width:80px;
  margin-right:0.5rem;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:0.5rem;
  align-items:center;
}
.controls label{margin-right:0.5rem;}
@media(max-width:600px){
  header h1{font-size:1.5rem;}
  button,input[type=number]{font-size:0.9rem;}
}
</style>
</head>
<body>
<header>
  <div class="stock-info">Stock: <span id="stock">10</span></div>
  <div class="available-info">Disponible: <span id="disponible">10</span></div>
</header>
<main id="reservas">
  <!-- Reservas se añaden aquí -->
</main>
<footer>
  <div class="controls">
    <label for="cant">Cantidad:</label>
    <input id="cant" type="number" min="1" value="1">
    <button id="reservar">Reservar</button>
    <button id="cancelar">Cancelar última reserva</button>
  </div>
  <div class="controls" style="margin-top:1rem;">
    <label for="nuevo-stock">Nuevo stock:</label>
    <input id="nuevo-stock" type="number" min="0" value="10">
    <button id="ajustar">Ajustar</button>
  </div>
</footer>
<script>
(() => {
  const stockEl = document.getElementById('stock');
  const disponibleEl = document.getElementById('disponible');
  const reservasEl = document.getElementById('reservas');
  const cantInput = document.getElementById('cant');
  const reservarBtn = document.getElementById('reservar');
  const cancelarBtn = document.getElementById('cancelar');
  const nuevoStockInput = document.getElementById('nuevo-stock');
  const ajustarBtn = document.getElementById('ajustar');

  let stock = 10;
  let reservations = []; // [{id, qty}]
  let nextId = 1;

  function updateDisplay() {
    stockEl.textContent = stock.toLocaleString();
    const totalReserved = reservations.reduce((s, r) => s + r.qty, 0);
    const disponible = stock - totalReserved;
    disponibleEl.textContent = disponible.toLocaleString();
  }

  function addReservation(qty) {
    const totalReserved = reservations.reduce((s, r) => s + r.qty, 0);
    const disponible = stock - totalReserved;
    if (qty > disponible) {
      alert('No se puede reservar más de lo disponible.');
      return;
    }
    const div = document.createElement('div');
    div.className = 'res';
    div.dataset.n = nextId;
    div.textContent = `Reserva ${nextId}: ${qty}`;
    reservasEl.appendChild(div);
    reservations.push({id: nextId, qty});
    nextId++;
    updateDisplay();
  }

  function cancelLastReservation() {
    if (!reservations.length) {
      alert('No hay reservas para cancelar.');
      return;
    }
    const last = reservations.pop();
    const div = reservasEl.querySelector(`.res[data-n="${last.id}"]`);
    if (div) div.remove();
    updateDisplay();
  }

  function adjustStock(newStock) {
    const totalReserved = reservations.reduce((s, r) => s + r.qty, 0);
    if (newStock < totalReserved) {
      alert('El nuevo stock no puede ser menor que la suma de reservas.');
      return;
    }
    stock = newStock;
    updateDisplay();
  }

  reservarBtn.addEventListener('click', () => {
    const qty = parseInt(cantInput.value, 10);
    if (isNaN(qty) || qty <= 0) {
      alert('Introduce una cantidad válida.');
      return;
    }
    addReservation(qty);
  });

  cancelarBtn.addEventListener('click', cancelLastReservation);

  ajustarBtn.addEventListener('click', () => {
    const newStock = parseInt(nuevoStockInput.value, 10);
    if (isNaN(newStock) || newStock < 0) {
      alert('Introduce un stock válido.');
      return;
    }
    adjustStock(newStock);
  });

  updateDisplay();
})();
</script>
</body>
</html>
