<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Presupuesto Reparto</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:20px;
    width:90%;
    max-width:400px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  h2{
    margin:0 0 10px;
    color:#006666;
    text-align:center;
  }
  .total{
    font-size:2em;
    font-weight:bold;
    text-align:center;
    margin:10px 0;
  }
  .parts .part{
    display:flex;
    align-items:center;
    margin-bottom:10px;
  }
  .parts .part label{
    flex:1;
  }
  .parts .part input.pct{
    width:60px;
    margin-right:10px;
  }
  .parts .part span.eur{
    flex:1;
    text-align:right;
  }
  .libre{
    text-align:center;
    margin-top:10px;
  }
  #aviso{
    color:red;
    text-align:center;
    margin-top:5px;
  }
</style>
</head>
<body>
<div class="card">
  <h2>Presupuesto</h2>
  <div class="total"><span id="total">100</span></div>
  <div class="parts">
    <div class="part" data-id="a1">
      <label>Partida 1</label>
      <input class="pct" data-id="a1" type="number" value="30" step="1" min="0" max="100">
      <span class="eur" data-id="a1"></span>
    </div>
    <div class="part" data-id="a2">
      <label>Partida 2</label>
      <input class="pct" data-id="a2" type="number" value="30" step="1" min="0" max="100">
      <span class="eur" data-id="a2"></span>
    </div>
    <div class="part" data-id="a3">
      <label>Partida 3</label>
      <input class="pct" data-id="a3" type="number" value="40" step="1" min="0" max="100">
      <span class="eur" data-id="a3"></span>
    </div>
  </div>
  <div class="libre">Libre: <span id="libre"></span>%</div>
  <div id="aviso"></div>
</div>
<script>
  const TOTAL = 100;
  const pctInputs = document.querySelectorAll('.pct');

  // Initialize previous values
  pctInputs.forEach(inp => {
    inp.dataset.prev = inp.value;
  });

  function formatCurrency(val){
    return val.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  }

  function recalc(){
    let sum = 0;
    pctInputs.forEach(inp=>{
      const val = parseFloat(inp.value)||0;
      sum += val;
      const eurSpan = document.querySelector(`.eur[data-id="${inp.dataset.id}"]`);
      const eur = val/100*TOTAL;
      eurSpan.textContent = formatCurrency(eur);
    });
    const libreSpan = document.getElementById('libre');
    const libre = 100 - sum;
    libreSpan.textContent = libre.toLocaleString('es-ES',{maximumFractionDigits:0});
  }

  pctInputs.forEach(inp=>{
    inp.addEventListener('input',function(){
      const prevVal = parseFloat(inp.dataset.prev)||0;
      const newVal = parseFloat(inp.value)||0;
      let sum = 0;
      pctInputs.forEach(i=>{
        const val = parseFloat(i.value)||0;
        sum += val;
      });
      if(sum > 100){
        inp.value = prevVal;
        document.getElementById('aviso').textContent = 'limite';
      }else{
        inp.dataset.prev = newVal;
        document.getElementById('aviso').textContent = '';
        recalc();
      }
    });
  });

  // Initial calculation
  recalc();
</script>
</body>
</html>
