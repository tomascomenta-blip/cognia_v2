<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Packs</title>
<style>
  body{
    margin:0;
    font-family:system-ui,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .container{
    width:100%;
    max-width:400px;
    padding:20px;
  }
  .card{
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    overflow:hidden;
  }
  .top-bar{
    display:flex;
    align-items:center;
    padding:16px;
    border-bottom:1px solid #e0e0e0;
  }
  .top-bar h1{
    margin:0 0 0 8px;
    font-size:1.2rem;
    color:#333;
  }
  .product-row{
    display:flex;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid #e0e0e0;
  }
  .product-row img{
    width:40px;
    height:40px;
    margin-right:12px;
  }
  .product-info{
    flex:1;
  }
  .product-info .name{
    display:block;
    font-weight:600;
    color:#333;
  }
  .product-info .price{
    display:block;
    color:#777;
    font-size:.9rem;
  }
  .controls{
    display:flex;
    align-items:center;
  }
  .controls button{
    background:#4caf50;
    color:#fff;
    border:none;
    padding:4px 8px;
    margin:0 4px;
    border-radius:4px;
    cursor:pointer;
    font-size:1rem;
  }
  .controls button:disabled{
    background:#9e9e9e;
    cursor:not-allowed;
  }
  .controls .cant{
    min-width:24px;
    text-align:center;
    font-weight:600;
    color:#333;
  }
  .bottom-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
  }
  .bottom-bar span{
    font-size:.9rem;
    color:#333;
  }
  .bottom-bar .checkout{
    background:#4caf50;
    color:#fff;
    border:none;
    padding:8px 16px;
    border-radius:4px;
    font-weight:600;
    cursor:pointer;
  }
  @media(max-width:480px){
    .product-row{
      flex-direction:column;
      align-items:flex-start;
    }
    .controls{
      margin-top:8px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="top-bar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M7 4h-2l-1 2h2l3 7h9l-1-2h-8l-1-2h-2l-1-2h-2z"/>
      </svg>
      <h1>Packs</h1>
    </div>
    <div class="product-row" data-id="pan">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjZmZjYzgwIi8+PC9zdmc+" alt="Pan">
      <div class="product-info">
        <span class="name">Pan</span>
        <span class="price">$2.00</span>
      </div>
      <div class="controls">
        <button class="quitar" data-id="pan">-</button>
        <span class="cant" data-id="pan">0</span>
        <button class="add" data-id="pan">+</button>
      </div>
    </div>
    <div class="product-row" data-id="leche">
      <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHJlY3Qgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIiBmaWxsPSIjYzhlNmM5Ii8+PC9zdmc+" alt="Leche">
      <div class="product-info">
        <span class="name">Leche</span>
        <span class="price">$3.00</span>
      </div>
      <div class="controls">
        <button class="quitar" data-id="leche">-</button>
        <span class="cant" data-id="leche">0</span>
        <button class="add" data-id="leche">+</button>
      </div>
    </div>
    <div class="bottom-bar">
      <span>Packs: <span id="packs">0</span></span>
      <span>Total: <span id="total">$0.00</span></span>
      <button class="checkout">Checkout</button>
    </div>
  </div>
</div>
<script>
  const prices = {pan: 2, leche: 3, pack: 4};
  const quantities = {pan: 0, leche: 0};

  function updateUI() {
    const packs = Math.min(quantities.pan, quantities.leche);
    const total = packs * prices.pack
                + (quantities.pan - packs) * prices.pan
                + (quantities.leche - packs) * prices.leche;

    document.getElementById('packs').textContent = packs.toLocaleString();
    document.getElementById('total').textContent = total.toLocaleString('en-US', {style:'currency', currency:'USD'});

    document.querySelectorAll('.cant').forEach(span => {
      const id = span.dataset.id;
      span.textContent = quantities[id];
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.add').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        quantities[id]++;
        updateUI();
      });
    });

    document.querySelectorAll('.quitar').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        if (quantities[id] > 0) {
          quantities[id]--;
          updateUI();
        }
      });
    });

    updateUI();
  });
</script>
</body>
</html>
