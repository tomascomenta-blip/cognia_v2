    <script>
        function updateDashboard() {
            const kpiTotal = document.getElementById('kpi-total');
            const kpiDelta = document.getElementById('kpi-delta');
            const chartRect = document.querySelector('.chart rect');
            const value = Math.floor(Math.random() * 6000) + 14300;
            const delta = Math.floor(Math.random() * 200) - 100;

            kpiTotal.textContent = value.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
            kpiDelta.textContent = `▲ ${delta.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' })} desde apertura`;

            if (delta > 0) {
                chartRect.setAttribute('fill', '#00d600');
            } else if (delta < 0) {
                chartRect.setAttribute('fill', '#d03b3b');
            } else {
                chartRect.setAttribute('fill', '#00b0f0');
            }

            chartRect.setAttribute('width', Math.min(200, 250 - delta));
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
