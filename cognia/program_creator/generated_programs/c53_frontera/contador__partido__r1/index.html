
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Simple</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .contador-container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #valor {
            font-size: 2em;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button#mas {
            background-color: #4CAF50;
            color: white;
        }
        button#mas:hover {
            background-color: #45a049;
        }
        button#menos {
            background-color: #f44336;
            color: white;
        }
        button#menos:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="contador-container">
        <span id="valor">0</span>
        <button id="mas">+</button>
        <button id="menos" disabled>-</button>
    </div>

    <script>
        let contador = 0;
        const valorSpan = document.getElementById('valor');
        const masButton = document.getElementById('mas');
        const menosButton = document.getElementById('menos');

        masButton.addEventListener('click', () => {
            contador++;
            valorSpan.textContent = contador;
            menosButton.disabled = contador <= 0;
        });

        menosButton.addEventListener('click', () => {
            contador--;
            valorSpan.textContent = contador;
            menosButton.disabled = contador <= 0;
        });
    </script>
</body>
</html>
