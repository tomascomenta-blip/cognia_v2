
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #nueva {
            padding: 10px;
            width: 300px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #anadir {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #anadir:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        ul {
            list-style-type: none;
            padding: 0;
            width: 300px;
        }
        .tarea {
            background-color: #fff;
            margin: 5px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .tarea:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Gestor de Tareas</h1>
    <input type="text" id="nueva" placeholder="Escribe una nueva tarea">
    <button id="anadir" disabled>Añadir</button>
    <ul id="lista"></ul>

    <script>
        document.getElementById('nueva').addEventListener('input', function() {
            const addButton = document.getElementById('anadir');
            addButton.disabled = this.value.trim() === '';
        });

        document.getElementById('anadir').addEventListener('click', function() {
            const nuevaTarea = document.getElementById('nueva').value.trim();
            if (nuevaTarea !== '') {
                const lista = document.getElementById('lista');
                const li = document.createElement('li');
                li.className = 'tarea';
                li.textContent = nuevaTarea;
                lista.appendChild(li);
                document.getElementById('nueva').value = '';
                this.disabled = true;
            }
        });
    </script>
</body>
</html>
