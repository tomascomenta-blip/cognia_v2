
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaforo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        #luz {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: red;
            transition: background-color 0.5s;
        }
        #avanzar {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="luz" data-color="rojo"></div>
    <button id="avanzar">Avanzar</button>

    <script>
        const luz = document.getElementById('luz');
        const avanzarButton = document.getElementById('avanzar');

        avanzarButton.addEventListener('click', () => {
            const currentColor = luz.getAttribute('data-color');
            let nextColor;

            switch (currentColor) {
                case 'rojo':
                    nextColor = 'verde';
                    break;
                case 'verde':
                    nextColor = 'amarillo';
                    break;
                case 'amarillo':
                    nextColor = 'rojo';
                    break;
            }

            luz.setAttribute('data-color', nextColor);
            luz.style.backgroundColor = nextColor;
        });

        // Iniciar el ciclo automáticamente al cargar la página
        let colorIndex = 0;
        const colors = ['rojo', 'verde', 'amarillo'];

        setInterval(() => {
            luz.setAttribute('data-color', colors[colorIndex]);
            luz.style.backgroundColor = colors[colorIndex];
            colorIndex = (colorIndex + 1) % colors.length;
        }, 3000);
    </script>
</body>
</html>
