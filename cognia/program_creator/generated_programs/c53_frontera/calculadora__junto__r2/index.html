
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #calculadora {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        #pantalla {
            width: 100%;
            height: 50px;
            margin-bottom: 10px;
            background-color: #e0e0e0;
            text-align: right;
            padding: 10px;
            font-size: 24px;
            border-radius: 5px;
        }
        .tecla {
            width: 25%;
            height: 50px;
            margin: 5px;
            background-color: #ddd;
            border: none;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .tecla:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div id="calculadora">
        <div id="pantalla"></div>
        <button class="tecla" data-t="1">1</button>
        <button class="tecla" data-t="2">2</button>
        <button class="tecla" data-t="3">3</button>
        <button class="tecla" data-t="+">+</button>
        <button class="tecla" data-t="4">4</button>
        <button class="tecla" data-t="5">5</button>
        <button class="tecla" data-t="6">6</button>
        <button class="tecla" data-t="-">-</button>
        <button class="tecla" data-t="7">7</button>
        <button class="tecla" data-t="8">8</button>
        <button class="tecla" data-t="9">9</button>
        <button class="tecla" data-t="*">*</button>
        <button class="tecla" data-t="0">0</button>
        <button class="tecla" data-t=".">.</button>
        <button class="tecla" data-t="/">/</button>
        <button class="tecla" data-t="=">=</button>
    </div>

    <script>
        const pantalla = document.getElementById('pantalla');
        const teclas = document.querySelectorAll('.tecla');

        teclas.forEach(tecla => {
            tecla.addEventListener('click', () => {
                const valor = tecla.getAttribute('data-t');
                if (valor === '=') {
                    try {
                        pantalla.textContent = eval(pantalla.textContent);
                    } catch (error) {
                        pantalla.textContent = 'Error';
                    }
                } else {
                    pantalla.textContent += valor;
                }
            });
        });
    </script>
</body>
</html>
