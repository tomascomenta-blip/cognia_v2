
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaforo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        #luz {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: red;
            margin-bottom: 20px;
            transition: background-color 0.5s;
        }
        #avanzar {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #avanzar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="luz" data-color="rojo"></div>
    <button id="avanzar">Avanzar</button>

    <script>
        const luz = document.getElementById('luz');
        const avanzar = document.getElementById('avanzar');

        avanzar.addEventListener('click', () => {
            const currentColor = luz.getAttribute('data-color');
            let nextColor;

            switch (currentColor) {
                case 'rojo':
                    nextColor = 'verde';
                    break;
                case 'verde':
                    nextColor = 'amarillo';
                    break;
                case 'amarillo':
                    nextColor = 'rojo';
                    break;
            }

            luz.setAttribute('data-color', nextColor);
            luz.style.backgroundColor = nextColor;
        });
    </script>
</body>
</html>
