
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria 4x4</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #moves {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-gap: 10px;
        }
        .tile {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .tile.flipped {
            transform: rotateY(180deg);
        }
        .tile.matched {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .tile.hidden {
            background-color: #e9ecef;
            border-color: #ced4da;
        }
    </style>
</head>
<body>
    <div id="moves">Movimientos: 0</div>
    <div class="board" id="board">
        <!-- 16 tiles will be generated by JavaScript -->
    </div>

    <script>
        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼'];
        const board = document.getElementById('board');
        const movesCounter = document.getElementById('moves');
        let moves = 0;
        let flippedTiles = [];
        let matchedTiles = [];

        function createBoard() {
            const tiles = emojis.concat(emojis).sort(() => Math.random() - 0.5);
            tiles.forEach((emoji, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile', 'hidden');
                tile.dataset.emoji = emoji;
                tile.addEventListener('click', flipTile);
                board.appendChild(tile);
            });
        }

        function flipTile() {
            if (flippedTiles.length >= 2 || this.classList.contains('matched')) return;
            this.classList.remove('hidden');
            this.classList.add('flipped');
            flippedTiles.push(this);
            moves++;
            movesCounter.textContent = `Movimientos: ${moves}`;

            if (flippedTiles.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [tile1, tile2] = flippedTiles;
            if (tile1.dataset.emoji === tile2.dataset.emoji) {
                tile1.classList.add('matched');
                tile2.classList.add('matched');
                matchedTiles.push(tile1, tile2);
            } else {
                setTimeout(() => {
                    tile1.classList.remove('flipped');
                    tile1.classList.add('hidden');
                    tile2.classList.remove('flipped');
                    tile2.classList.add('hidden');
                }, 1000);
            }
            flippedTiles = [];

            if (matchedTiles.length === 16) {
                alert('¡Felicidades! Has ganado el juego.');
            }
        }

        createBoard();
    </script>
</body>
</html>
