
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simple</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        #pantalla {
            width: 200px;
            height: 100px;
            background-color: #fff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-in-out;
        }
        .tecla {
            width: 50px;
            height: 50px;
            background-color: #ddd;
            border: none;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .tecla:active {
            background-color: #aaa;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="pantalla">0</div>
    <div>
        <button class="tecla" data-t="2">2</button>
        <button class="tecla" data-t="3">3</button>
        <button class="tecla" data-t="+">+</button>
        <button class="tecla" data-t="=">=</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pantalla = document.getElementById('pantalla');
            const teclas = document.querySelectorAll('.tecla');

            teclas.forEach(tecla => {
                tecla.addEventListener('click', () => {
                    const valor = tecla.getAttribute('data-t');
                    let contenido = pantalla.textContent;

                    if (valor === '=') {
                        try {
                            contenido = eval(contenido);
                        } catch (error) {
                            contenido = 'Error';
                        }
                    } else {
                        contenido += valor;
                    }

                    pantalla.textContent = contenido;
                    teclas.forEach(t => t.style.backgroundColor = '#ddd');
                    tecla.style.backgroundColor = '#00f';
                });
            });
        });
    </script>
</body>
</html>
