
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        .tarea {
            background-color: #e9ecef;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .tarea:hover {
            background-color: #d3d3d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" id="taskInput" placeholder="Escribe una nueva tarea">
        <button id="addButton" disabled>Añadir</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        document.getElementById('taskInput').addEventListener('input', function() {
            const addButton = document.getElementById('addButton');
            addButton.disabled = this.value.trim() === '';
        });

        document.getElementById('addButton').addEventListener('click', function() {
            const taskInput = document.getElementById('taskInput');
            const taskList = document.getElementById('taskList');
            const newTask = document.createElement('li');
            newTask.className = 'tarea';
            newTask.textContent = taskInput.value.trim();
            taskList.appendChild(newTask);
            taskInput.value = '';
            this.disabled = true;
        });
    </script>
</body>
</html>
