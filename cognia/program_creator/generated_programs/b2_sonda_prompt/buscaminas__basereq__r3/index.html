<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#fafafa;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:260px;}
  .c{background:#ccc;border:1px solid #999;color:#000;display:flex;align-items:center;justify-content:center;font-size:1.2em;cursor:pointer;user-select:none;}
  .c.abierta{background:#eee;cursor:default;}
  .c.bandera{background:#f9f;}
  #estado{margin-top:15px;font-size:1.2em;color:#c00;}
  @media (max-width:400px){
    #grid{width:200px;}
    .c{font-size:1em;}
  }
</style>
</head>
<body>
<h1>Buscaminas 5x5</h1>
<div id="grid"></div>
<div id="estado"></div>

<script>
(() => {
  const grid = document.getElementById('grid');
  const estado = document.getElementById('estado');
  const size = 5;
  const mines = new Set([6,12,18]); // posiciones fijas

  // Crear las 25 celdas
  for(let i=0;i<25;i++){
    const cell = document.createElement('div');
    cell.className='c';
    cell.dataset.i = i;
    cell.dataset.opened = 'false';
    cell.dataset.flagged = 'false';
    grid.appendChild(cell);
  }

  // Función para obtener vecinos
  const neighbors = (i)=>{
    const r = Math.floor(i/size);
    const c = i%size;
    const list=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<size && nc>=0 && nc<size){
          list.push(nr*size+nc);
        }
      }
    }
    return list;
  };

  // Contar minas adyacentes
  const countAdj = (i)=>{
    return neighbors(i).filter(n=>mines.has(n)).length;
  };

  // Abrir una celda
  const openCell = (i)=>{
    const cell = grid.querySelector(`.c[data-i='${i}']`);
    if(cell.dataset.opened==='true' || cell.dataset.flagged==='true') return;
    cell.dataset.opened='true';
    cell.classList.add('abierta');
    if(mines.has(i)){
      cell.textContent='💣';
      estado.textContent='perdiste';
      return;
    }
    const cnt = countAdj(i);
    if(cnt>0) cell.textContent=cnt;
    else{
      // Cascada
      const queue=[i];
      while(queue.length){
        const cur=queue.shift();
        neighbors(cur).forEach(n=>{
          const nb = grid.querySelector(`.c[data-i='${n}']`);
          if(nb.dataset.opened==='true' || nb.dataset.flagged==='true') return;
          nb.dataset.opened='true';
          nb.classList.add('abierta');
          if(mines.has(n)){
            nb.textContent='💣';
            estado.textContent='perdiste';
            return;
          }
          const c2 = countAdj(n);
          if(c2>0) nb.textContent=c2;
          else queue.push(n);
        });
      }
    }
  };

  // Manejar click izquierdo
  grid.addEventListener('click',e=>{
    if(e.target.classList.contains('c')){
      const i=parseInt(e.target.dataset.i,10);
      openCell(i);
    }
  });

  // Manejar click derecho (bandera)
  grid.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const cell=e.target;
    if(!cell.classList.contains('c')) return;
    if(cell.dataset.opened==='true') return;
    if(cell.dataset.flagged==='true'){
      cell.dataset.flagged='false';
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.dataset.flagged='true';
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  });
})();
</script>
</body>
</html>
