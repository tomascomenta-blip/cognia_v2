<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{margin:20px;font-family:sans-serif;background:#f9f9f9;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:5px;font-size:1rem;box-sizing:border-box;}
</style>
</head>
<body>
<h1>Mini hoja de cálculo 3x3</h1>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="5">
  <input type="text" class="celda" data-ref="B1" value="=A1+1">
  <input type="text" class="celda" data-ref="C1" value="=B1+1">
  <input type="text" class="celda" data-ref="A2">
  <input type="text" class="celda" data-ref="B2">
  <input type="text" class="celda" data-ref="C2">
  <input type="text" class="celda" data-ref="A3">
  <input type="text" class="celda" data-ref="B3">
  <input type="text" class="celda" data-ref="C3">
</div>
<script>
(() => {
  const cells = {}; // ref -> {el, isFormula, formula}
  const dependents = {}; // ref -> Set of refs that depend on it
  const cellDeps = {}; // ref -> Array of refs it depends on

  // Initialize cells and dependents map
  document.querySelectorAll('.celda').forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = {el, isFormula: false, formula: ''};
    dependents[ref] = new Set();
  });

  // Helper to get numeric value of a cell (non-formula)
  const getCellNumeric = (ref) => {
    const val = cells[ref].el.value;
    const num = parseFloat(val);
    return isNaN(num) ? 0 : num;
  };

  // Update dependencies for a cell (called when its formula changes)
  const updateDependencies = (ref) => {
    const oldDeps = cellDeps[ref] || [];
    const newDeps = [];
    if (cells[ref].isFormula) {
      const matches = cells[ref].formula.match(/[A-C][1-3]/g) || [];
      newDeps.push(...new Set(matches));
    }
    // Remove this cell from old dependents
    oldDeps.forEach(dep => dependents[dep].delete(ref));
    // Add this cell to new dependents
    newDeps.forEach(dep => dependents[dep].add(ref));
    cellDeps[ref] = newDeps;
  };

  // Evaluate a formula cell recursively, detecting cycles
  const evaluateCell = (ref, stack = new Set()) => {
    if (stack.has(ref)) return 'CIRC';
    stack.add(ref);
    const cell = cells[ref];
    if (!cell.isFormula) {
      stack.delete(ref);
      return getCellNumeric(ref);
    }
    let expr = cell.formula;
    const refs = expr.match(/[A-C][1-3]/g) || [];
    for (const r of refs) {
      const val = evaluateCell(r, stack);
      if (val === 'CIRC') { stack.delete(ref); return 'CIRC'; }
      expr = expr.split(r).join(val);
    }
    let result;
    try {
      result = Function('return ' + expr)();
      if (typeof result !== 'number' || isNaN(result)) result = 0;
    } catch {
      result = 0;
    }
    stack.delete(ref);
    return result;
  };

  // Recompute a cell and propagate to dependents
  const recomputeFrom = (ref) => {
    const queue = [ref];
    const visited = new Set();
    while (queue.length) {
      const r = queue.shift();
      if (visited.has(r)) continue;
      visited.add(r);
      const cell = cells[r];
      if (cell.isFormula) {
        const val = evaluateCell(r);
        cell.el.value = val === 'CIRC' ? 'CIRC' : val.toString();
      }
      dependents[r].forEach(dep => queue.push(dep));
    }
  };

  // Event handler for input changes
  const onChange = (e) => {
    const el = e.target;
    const ref = el.dataset.ref;
    const val = el.value;
    const isFormula = val.startsWith('=');
    const formula = isFormula ? val.slice(1) : '';
    const cell = cells[ref];
    if (isFormula !== cell.isFormula || formula !== cell.formula) {
      cell.isFormula = isFormula;
      cell.formula = formula;
      updateDependencies(ref);
    }
    recomputeFrom(ref);
  };

  // Attach listeners
  Object.values(cells).forEach(cell => {
    cell.el.addEventListener('input', onChange);
  });

  // Initial evaluation
  Object.keys(cells).forEach(ref => {
    if (cells[ref].isFormula) {
      updateDependencies(ref);
    }
  });
  Object.keys(cells).forEach(ref => {
    if (cells[ref].isFormula) {
      recomputeFrom(ref);
    }
  });
})();
</script>
</body>
</html>
