<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;text-align:center;margin-top:30px;}
  #grid{display:grid;grid-template-columns:repeat(5,40px);gap:2px;justify-content:center;}
  .c{
    width:40px;height:40px;border:1px solid #777;background:#ccc;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;cursor:pointer;user-select:none;
  }
  .c.abierta{background:#eee;cursor:default;}
  .c.bandera{background:#fdd;}
  #estado{margin-top:15px;font-size:20px;color:red;}
</style>
</head>
<body>

<div id="grid">
  <div class="c" data-i="0"></div><div class="c" data-i="1"></div><div class="c" data-i="2"></div><div class="c" data-i="3"></div><div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div><div class="c" data-i="6"></div><div class="c" data-i="7"></div><div class="c" data-i="8"></div><div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div><div class="c" data-i="11"></div><div class="c" data-i="12"></div><div class="c" data-i="13"></div><div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div><div class="c" data-i="16"></div><div class="c" data-i="17"></div><div class="c" data-i="18"></div><div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div><div class="c" data-i="21"></div><div class="c" data-i="22"></div><div class="c" data-i="23"></div><div class="c" data-i="24"></div>
</div>

<div id="estado"></div>

<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.c'));
  const mineIndices = new Set([6,12,18]); // posiciones fijas de minas
  let gameOver = false;

  // Helper: contar minas adyacentes
  const countAdj = (i) => {
    const r = Math.floor(i/5), c = i%5;
    let count = 0;
    for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
      if (dr===0 && dc===0) continue;
      const nr=r+dr, nc=c+dc;
      if (nr<0||nr>4||nc<0||nc>4) continue;
      const idx = nr*5+nc;
      if (mineIndices.has(idx)) count++;
    }
    return count;
  };

  // Abrir una celda (no recursiva)
  const openCell = (cell, idx) => {
    if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    const adj = countAdj(idx);
    cell.classList.add('abierta');
    if (adj>0) cell.textContent = adj;
  };

  // Flood fill para celdas con 0 minas adyacentes
  const floodFill = (startIdx) => {
    const queue = [startIdx];
    const visited = new Set();
    visited.add(startIdx);
    while (queue.length) {
      const idx = queue.shift();
      const cell = cells[idx];
      if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
      const adj = countAdj(idx);
      cell.classList.add('abierta');
      if (adj>0) {
        cell.textContent = adj;
      } else {
        // 0 minas: abrir vecinos
        const r = Math.floor(idx/5), c = idx%5;
        for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
          if (dr===0 && dc===0) continue;
          const nr=r+dr, nc=c+dc;
          if (nr<0||nr>4||nc<0||nc>4) continue;
          const nIdx = nr*5+nc;
          if (!visited.has(nIdx) && !cells[nIdx].classList.contains('bandera')) {
            visited.add(nIdx);
            queue.push(nIdx);
          }
        }
      }
    }
  };

  // Click izquierdo
  const leftClick = (e) => {
    if (gameOver) return;
    const cell = e.currentTarget;
    const idx = parseInt(cell.dataset.i);
    if (cell.classList.contains('bandera') || cell.classList.contains('abierta')) return;
    if (mineIndices.has(idx)) {
      cell.classList.add('abierta');
      cell.textContent = '💣';
      document.getElementById('estado').textContent = 'perdiste';
      gameOver = true;
      return;
    }
    const adj = countAdj(idx);
    if (adj===0) floodFill(idx);
    else openCell(cell, idx);
  };

  // Click derecho (bandera)
  const rightClick = (e) => {
    e.preventDefault();
    if (gameOver) return;
    const cell = e.currentTarget;
    if (cell.classList.contains('abierta')) return;
    if (cell.classList.contains('bandera')) {
      cell.classList.remove('bandera');
      cell.textContent = '';
    } else {
      cell.classList.add('bandera');
      cell.textContent = '🚩';
    }
  };

  cells.forEach(cell => {
    cell.addEventListener('click', leftClick);
    cell.addEventListener('contextmenu', rightClick);
  });
})();
</script>
</body>
</html>
