<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 80px);
    gap:5px;
  }
  .celda{
    width:80px;
    height:30px;
    padding:0 5px;
    box-sizing:border-box;
    text-align:right;
    font-size:14px;
    animation:pulse 2s infinite alternate;
  }
  @keyframes pulse{
    from{background:#fff;}
    to{background:#e0f7fa;}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B1" value="">
  <input type="text" class="celda" data-ref="B2" value="">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C1" value="">
  <input type="text" class="celda" data-ref="C2" value="">
  <input type="text" class="celda" data-ref="C3" value="">
</div>

<script>
(() => {
  const cells = document.querySelectorAll('.celda');
  let isUpdating = false;

  // Evalúa una celda y devuelve su valor como cadena
  function evaluateCell(cell, visited) {
    const ref = cell.dataset.ref;
    const formula = cell.dataset.formula;
    if (!formula) return cell.value; // no es fórmula

    if (visited.has(ref)) return 'CIRC'; // referencia circular detectada
    visited.add(ref);

    const expr = formula.slice(1); // quita '='
    const tokens = expr.match(/([A-C][1-3]|\d+(\.\d+)?|[+-])/g);
    if (!tokens) { visited.delete(ref); return ''; }

    let result = 0;
    let op = '+';
    for (const tok of tokens) {
      if (tok === '+' || tok === '-') {
        op = tok;
      } else {
        let val;
        if (/^[A-C][1-3]$/.test(tok)) {
          const target = document.querySelector(`input[data-ref="${tok}"]`);
          if (!target) val = 0;
          else {
            const r = evaluateCell(target, visited);
            if (r === 'CIRC') { val = 'CIRC'; }
            else { val = parseFloat(r) || 0; }
          }
        } else { // número literal
          val = parseFloat(tok) || 0;
        }

        if (val === 'CIRC') { result = 'CIRC'; break; }

        if (op === '+') result += val;
        else if (op === '-') result -= val;
      }
    }
    visited.delete(ref);
    return result.toString();
  }

  // Recalcula todas las celdas con fórmulas
  function evaluateAll() {
    isUpdating = true;
    cells.forEach(cell => {
      if (cell.dataset.formula) {
        const val = evaluateCell(cell, new Set());
        cell.value = val;
      }
    });
    isUpdating = false;
  }

  // Evento de entrada en cada celda
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      if (isUpdating) return;
      const v = cell.value;
      if (v.startsWith('=')) cell.dataset.formula = v;
      else delete cell.dataset.formula;
      evaluateAll();
    });
  });

  // Calcular al cargar la página
  evaluateAll();
})();
</script>
</body>
</html>
