<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;padding:5px;font-size:1rem;box-sizing:border-box;}
</style>
</head>
<body>
<h1>Mini hoja de cálculo 3x3</h1>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="B1" placeholder="B1">
  <input type="text" class="celda" data-ref="C1" placeholder="C1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C3" placeholder="C3">
</div>

<script>
(function(){
  const cells = Array.from(document.querySelectorAll('.celda'));

  // Helper to format numbers
  function formatNumber(num){
    return num.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // Evaluate a cell recursively
  function evaluateCell(ref, stack){
    if(stack.includes(ref)) return 'CIRC';
    const cell = document.querySelector(`input[data-ref="${ref}"]`);
    if(!cell) return 0;
    const formula = cell.dataset.formula;
    if(!formula){
      const val = cell.dataset.value;
      if(val===undefined || val==='') return 0;
      const num = parseFloat(val);
      return isNaN(num)?0:num;
    }
    const expr = formula.substring(1); // remove leading '='
    const replaced = expr.replace(/[A-C][1-3]/g, (match)=>{
      const res = evaluateCell(match, stack.concat(ref));
      if(res==='CIRC') return 'CIRC';
      return res;
    });
    if(replaced.includes('CIRC')) return 'CIRC';
    try{
      const result = new Function('return '+replaced)();
      if(typeof result!=='number' || isNaN(result)) return 'CIRC';
      return result;
    }catch(e){
      return 'CIRC';
    }
  }

  // Recalculate all cells
  function recalcAll(){
    cells.forEach(cell=>{
      const ref = cell.dataset.ref;
      const formula = cell.dataset.formula;
      if(formula){
        const val = evaluateCell(ref, []);
        if(val==='CIRC'){
          cell.value='CIRC';
        }else{
          cell.value=formatNumber(val);
        }
      }else{
        cell.value=cell.dataset.value||'';
      }
    });
  }

  // Event handler for user input
  cells.forEach(cell=>{
    cell.addEventListener('input', e=>{
      const val = e.target.value;
      if(val.startsWith('=')){
        cell.dataset.formula=val;
        delete cell.dataset.value;
      }else{
        delete cell.dataset.formula;
        cell.dataset.value=val;
      }
      recalcAll();
    });
  });

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
