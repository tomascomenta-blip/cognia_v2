<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tablero Kanban Simple</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#fafafa;}
  .board{display:flex;gap:10px;padding:10px;flex-wrap:wrap;}
  .col{flex:1 1 200px;background:#e0e0e0;padding:10px;border-radius:5px;min-height:200px;box-sizing:border-box;}
  .col h2{margin-top:0;font-size:1.2em;}
  .card{background:#fff;padding:8px;margin-bottom:8px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center;}
  .card span{flex:1;}
  .card button{margin-left:4px;padding:2px 6px;font-size:0.9em;}
  .counter{font-weight:bold;}
  @media(max-width:600px){
    .board{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo" class="counter"></span></h2>
    <div class="card" data-id="t1"><span>t1</span><button class="menos">&lt;</button><button class="mas">&gt;</button></div>
    <div class="card" data-id="t2"><span>t2</span><button class="menos">&lt;</button><button class="mas">&gt;</button></div>
    <div class="card" data-id="t3"><span>t3</span><button class="menos">&lt;</button><button class="mas">&gt;</button></div>
  </div>
  <div class="col" data-col="doing">
    <h2>En Progreso <span id="cont-doing" class="counter"></span></h2>
  </div>
  <div class="col" data-col="done">
    <h2>Hecho <span id="cont-done" class="counter"></span></h2>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const board = document.querySelector('.board');
  function updateCounters(){
    const todo = document.querySelectorAll('.col[data-col="todo"] .card').length;
    const doing = document.querySelectorAll('.col[data-col="doing"] .card').length;
    const done = document.querySelectorAll('.col[data-col="done"] .card').length;
    document.getElementById('cont-todo').textContent = todo;
    document.getElementById('cont-doing').textContent = doing;
    document.getElementById('cont-done').textContent = done;
  }
  board.addEventListener('click', function(e){
    if(e.target.classList.contains('mas') || e.target.classList.contains('menos')){
      const card = e.target.closest('.card');
      const currentCol = card.parentElement;
      const current = currentCol.dataset.col;
      let targetColName;
      if(e.target.classList.contains('mas')){
        if(current==='todo') targetColName='doing';
        else if(current==='doing') targetColName='done';
        else return; // done cannot advance
      }else{ // menos
        if(current==='doing') targetColName='todo';
        else if(current==='done') targetColName='doing';
        else return; // todo cannot retreat
      }
      const doingCol = document.querySelector('.col[data-col="doing"]');
      // WIP rule: max 2 cards in doing
      if(targetColName==='doing' && doingCol.children.length>=2){
        return;
      }
      const targetCol = document.querySelector(`.col[data-col="${targetColName}"]`);
      targetCol.appendChild(card);
      updateCounters();
    }
  });
  updateCounters();
});
</script>
</body>
</html>
