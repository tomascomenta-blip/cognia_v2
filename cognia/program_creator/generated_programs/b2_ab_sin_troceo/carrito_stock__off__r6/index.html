<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f5f5;color:#333;}
.container{display:flex;flex-wrap:wrap;gap:20px;padding:20px;}
.products,.cart{background:#fff;border-radius:8px;padding:20px;flex:1 1 300px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
.products{max-width:600px;}
.cart{max-width:400px;}
.prod{border-bottom:1px solid #e0e0e0;padding-bottom:10px;margin-bottom:10px;}
.prod:last-child{border-bottom:none;}
.prod h3{margin:0 0 5px;}
.prod p{margin:5px 0;}
.prod button.add{background:#009688;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
.prod button.add:disabled{background:#ccc;cursor:not-allowed;}
.linea{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e0e0e0;}
.linea:last-child{border-bottom:none;}
.linea .cant{font-weight:bold;}
.linea button.quitar{background:#e57373;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;}
.linea button.quitar:hover{background:#d32f2f;}
#cart-total{margin-top:10px;font-size:1.2em;font-weight:bold;}
@media (max-width:600px){.container{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p>Precio: 100,00 €</p>
      <p>Stock: 2</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p>Precio: 50,00 €</p>
      <p>Stock: 3</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p>Precio: 25,00 €</p>
      <p>Stock: 1</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div id="cart-total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const products = document.querySelectorAll('.prod');
  const cartLines = document.getElementById('cart-lines');
  const totalSpan = document.getElementById('total');
  const cartQuantities = {};

  const productData = {};
  products.forEach(prod => {
    const id = prod.dataset.id;
    const precio = parseFloat(prod.dataset.precio);
    const stock = parseInt(prod.dataset.stock, 10);
    productData[id] = {precio, stock};
  });

  function updateTotal() {
    let total = 0;
    for (const id in cartQuantities) {
      total += cartQuantities[id] * productData[id].precio;
    }
    totalSpan.textContent = total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  function updateAddButton(id) {
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    if (!btn) return;
    const qty = cartQuantities[id] || 0;
    btn.disabled = qty >= productData[id].stock;
  }

  function createOrUpdateLine(id) {
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    const qty = cartQuantities[id];
    if (!line) {
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `<span class="name">${document.querySelector(`.prod[data-id="${id}"] h3`).textContent}</span> <span class="cant">${qty}</span> <button class="quitar" data-id="${id}">-</button>`;
      cartLines.appendChild(line);
    } else {
      line.querySelector('.cant').textContent = qty;
    }
  }

  function removeLine(id) {
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if (line) line.remove();
  }

  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.id;
      const currentQty = cartQuantities[id] || 0;
      if (currentQty < productData[id].stock) {
        cartQuantities[id] = currentQty + 1;
        createOrUpdateLine(id);
        updateAddButton(id);
        updateTotal();
      }
    });
  });

  cartLines.addEventListener('click', function(e) {
    if (e.target.classList.contains('quitar')) {
      const id = e.target.dataset.id;
      const currentQty = cartQuantities[id] || 0;
      if (currentQty > 0) {
        cartQuantities[id] = currentQty - 1;
        if (cartQuantities[id] === 0) {
          delete cartQuantities[id];
          removeLine(id);
        } else {
          createOrUpdateLine(id);
        }
        updateAddButton(id);
        updateTotal();
      }
    }
  });

  updateTotal();
});
</script>
</body>
</html>
