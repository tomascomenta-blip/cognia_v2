<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  :root{--cell-size:80px;}
  @media(max-width:400px){--cell-size:60px;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fafafa;display:flex;align-items:center;justify-content:center;height:100vh;}
  .grid{display:grid;grid-template-columns:repeat(3,var(--cell-size));grid-gap:2px;background:#fff;border:1px solid #ddd;padding:2px;}
  .celda{width:100%;height:100%;box-sizing:border-box;border:none;background:#fff;text-align:right;font-size:14px;padding:4px;transition:background .2s;}
  .celda:hover{background:#f5f5f5;}
  .celda:focus{background:#e0f7fa;}
  .calculated{font-weight:bold;color:#333;}
  #status{display:none;text-align:center;font-size:12px;color:#666;margin-top:10px;}
  .blink{display:inline-block;width:6px;height:6px;margin-left:4px;background:#666;border-radius:50%;animation:blink 1s infinite;}
  @keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}
</style>
</head>
<body>
<div>
  <div class="grid">
    <input type="text" class="celda" data-ref="A1" value="">
    <input type="text" class="celda" data-ref="A2" value="">
    <input type="text" class="celda" data-ref="A3" value="">
    <input type="text" class="celda" data-ref="B1" value="">
    <input type="text" class="celda" data-ref="B2" value="">
    <input type="text" class="celda" data-ref="B3" value="">
    <input type="text" class="celda" data-ref="C1" value="">
    <input type="text" class="celda" data-ref="C2" value="">
    <input type="text" class="celda" data-ref="C3" value="">
  </div>
  <div id="status">Updating…<span class="blink"></span></div>
</div>
<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const cellMap = {};
  cells.forEach(c => cellMap[c.dataset.ref] = c);

  const status = document.getElementById('status');

  function showStatus() {
    status.style.display = 'block';
    setTimeout(() => status.style.display = 'none', 200);
  }

  function evaluateCell(ref, stack = []) {
    if (stack.includes(ref)) return 'CIRC';
    const cell = cellMap[ref];
    if (!cell) return 0;
    const formula = cell.dataset.formula;
    if (!formula) return parseFloat(cell.value) || 0;
    const expr = formula.slice(1).replace(/[A-C][1-3]/g, r => {
      const val = evaluateCell(r, [...stack, ref]);
      return (val === 'CIRC' || isNaN(val)) ? '0' : val;
    });
    try {
      const result = eval(expr);
      return isFinite(result) ? result : 'CIRC';
    } catch {
      return 'CIRC';
    }
  }

  function recalc() {
    showStatus();
    cells.forEach(cell => {
      const ref = cell.dataset.ref;
      const formula = cell.dataset.formula;
      if (formula) {
        const val = evaluateCell(ref);
        cell.value = val === 'CIRC' ? 'CIRC' : Number(val).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        cell.classList.add('calculated');
      } else {
        cell.classList.remove('calculated');
      }
    });
  }

  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      const val = cell.value.trim();
      if (val.startsWith('=')) {
        cell.dataset.formula = val;
      } else {
        delete cell.dataset.formula;
      }
      recalc();
    });
  });

  // Initial calculation
  recalc();
})();
</script>
</body>
</html>
