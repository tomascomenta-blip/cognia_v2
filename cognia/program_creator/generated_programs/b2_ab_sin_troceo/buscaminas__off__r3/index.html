<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Buscaminas 5x5</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#222;color:#fff;font-family:sans-serif;}#grid{display:grid;grid-template-columns:repeat(5,60px);gap:2px;} .c{width:60px;height:60px;background:#333;border:1px solid #555;display:flex;justify-content:center;align-items:center;font-size:20px;cursor:pointer;} .c.abierta{background:#0f9d58;color:#fff;} .c.bandera{background:#333;color:#ff0;} #estado{margin-top:10px;text-align:center;font-size:18px;}</style></head><body><div id="grid"></div><div id="estado"></div><script>const mines=[6,12,18],grid=document.getElementById('grid');for(let i=0;i<25;i++){let d=document.createElement('div');d.className='c';d.dataset.i=i;d.onclick=e=>openCell(d);d.oncontextmenu=e=>{e.preventDefault();toggleFlag(d);};grid.appendChild(d);}function openCell(c){if(c.classList.contains('bandera')||c.classList.contains('abierta'))return;let i=parseInt(c.dataset.i);if(mines.includes(i)){c.classList.add('abierta');c.textContent='💣';document.getElementById('estado').textContent='perdiste';return;}let cnt=countAdj(i);c.classList.add('abierta');c.textContent=cnt?cnt:'';if(!cnt)cascade(i);}function countAdj(i){let r=Math.floor(i/5),c=i%5,adj=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;let nr=r+dr,nc=c+dc;if(nr<0||nr>4||nc<0||nc>4)continue;if(mines.includes(nr*5+nc))adj++;}return adj;}function cascade(i){let q=[i];while(q.length){let cur=q.shift(),r=Math.floor(cur/5),c=cur%5;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;let nr=r+dr,nc=c+dc;if(nr<0||nr>4||nc<0||nc>4)continue;let idx=nr*5+nc;let cell=document.querySelector(`.c[data-i="${idx}"]`);if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))continue;let cnt=countAdj(idx);cell.classList.add('abierta');cell.textContent=cnt?cnt:'';if(!cnt)q.push(idx);}}}function toggleFlag(c){if(c.classList.contains('abierta'))return;c.classList.toggle('bandera');c.textContent=c.classList.contains('bandera')?'🚩':'';}</script></body></html>
