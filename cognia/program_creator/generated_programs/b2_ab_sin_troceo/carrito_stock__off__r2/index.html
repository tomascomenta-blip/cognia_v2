<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:0;background:#f0f4f7;color:#333;}
  .container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:20px;}
  .left{flex:1 1 60%;}
  .right{flex:1 1 40%;position:sticky;top:20px;}
  .prod{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:16px;margin-bottom:16px;display:flex;flex-direction:column;align-items:center;}
  .prod .img{background:#c8d4e1;width:100%;height:120px;border-radius:4px;}
  .prod .name{font-weight:bold;margin-top:8px;}
  .prod .price{color:#5c6b7b;margin-top:4px;}
  .prod .stock{background:#c8d4e1;color:#333;padding:2px 6px;border-radius:12px;font-size:12px;margin-top:4px;}
  .prod button.add{margin-top:8px;background:#5c6b7b;color:#fff;border:none;border-radius:4px;padding:6px 12px;cursor:pointer;}
  .prod button.add:disabled{background:#a0a0a0;cursor:not-allowed;}
  .cart{background:#e0e7f0;padding:16px;border-radius:8px;}
  .cart h2{margin-top:0;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .linea span.cant{font-weight:bold;}
  .linea button.quitar{background:#5c6b7b;color:#fff;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;}
  .linea button.quitar:disabled{background:#a0a0a0;cursor:not-allowed;}
  #total{font-weight:bold;font-size:18px;margin-top:8px;}
  @media(max-width:600px){
    .container{flex-direction:column;}
    .left{flex:1 1 100%;}
    .right{flex:1 1 100%;margin-top:16px;}
  }
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img"></div>
      <div class="name">Producto 1</div>
      <div class="price">100 €</div>
      <div class="stock">Stock: 2</div>
      <button class="add" data-id="p1">Agregar</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img"></div>
      <div class="name">Producto 2</div>
      <div class="price">50 €</div>
      <div class="stock">Stock: 3</div>
      <button class="add" data-id="p2">Agregar</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img"></div>
      <div class="name">Producto 3</div>
      <div class="price">25 €</div>
      <div class="stock">Stock: 1</div>
      <button class="add" data-id="p3">Agregar</button>
    </div>
  </div>
  <div class="right">
    <div class="cart">
      <h2>Carrito</h2>
      <div id="lines"></div>
      <div id="total">0 €</div>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cart = {};
  const linesContainer = document.getElementById('lines');
  const totalSpan = document.getElementById('total');

  function formatCurrency(value){
    return value.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  function updateTotal(){
    let sum = 0;
    for(const id in cart){
      const qty = cart[id];
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      sum += qty * price;
    }
    totalSpan.textContent = formatCurrency(sum);
  }

  function createLine(id){
    const line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;

    const cantSpan = document.createElement('span');
    cantSpan.className = 'cant';
    cantSpan.textContent = cart[id];

    const removeBtn = document.createElement('button');
    removeBtn.className = 'quitar';
    removeBtn.dataset.id = id;
    removeBtn.textContent = 'Quitar';
    removeBtn.addEventListener('click', function(){
      removeItem(id);
    });

    line.appendChild(cantSpan);
    line.appendChild(removeBtn);
    linesContainer.appendChild(line);
  }

  function updateLine(id){
    const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
    if(line){
      const cantSpan = line.querySelector('.cant');
      cantSpan.textContent = cart[id];
    }
  }

  function removeItem(id){
    if(!cart[id]) return;
    cart[id]--;
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const addBtn = prod.querySelector(`.add[data-id="${id}"]`);
    if(cart[id] <= 0){
      delete cart[id];
      const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
      if(line) linesContainer.removeChild(line);
      addBtn.disabled = false;
    } else {
      updateLine(id);
      addBtn.disabled = false;
    }
    updateTotal();
  }

  function addItem(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    const addBtn = prod.querySelector(`.add[data-id="${id}"]`);
    if(cart[id] === undefined) cart[id] = 0;
    if(cart[id] < stock){
      cart[id]++;
      if(cart[id] === stock){
        addBtn.disabled = true;
      }
      if(linesContainer.querySelector(`.linea[data-id="${id}"]`)){
        updateLine(id);
      } else {
        createLine(id);
      }
    }
    updateTotal();
  }

  const addButtons = document.querySelectorAll('.add');
  addButtons.forEach(btn=>{
    btn.addEventListener('click', function(){
      addItem(btn.dataset.id);
    });
  });
});
</script>
</body>
</html>
