<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo</title>
<style>
  body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    background:#e0e0e0;
    font-family:Arial,Helvetica,sans-serif;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,80px);
    grid-gap:2px;
    background:#f0f0f0;
    padding:10px;
    border:1px solid #ccc;
    border-radius:4px;
  }
  .cell-wrapper{
    position:relative;
  }
  .cell-wrapper input{
    width:100%;
    box-sizing:border-box;
    padding:4px 8px;
    border:2px solid #444;
    background:#fff;
    color:#000;
    font-size:1rem;
    text-align:right;
  }
  .cell-wrapper[data-formula]::before{
    content:"=";
    position:absolute;
    top:2px;
    left:2px;
    font-size:0.8rem;
    color:#888;
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell-wrapper" data-ref="A1"><input class="celda" data-ref="A1" /></div>
  <div class="cell-wrapper" data-ref="A2"><input class="celda" data-ref="A2" /></div>
  <div class="cell-wrapper" data-ref="A3"><input class="celda" data-ref="A3" /></div>
  <div class="cell-wrapper" data-ref="B1"><input class="celda" data-ref="B1" /></div>
  <div class="cell-wrapper" data-ref="B2"><input class="celda" data-ref="B2" /></div>
  <div class="cell-wrapper" data-ref="B3"><input class="celda" data-ref="B3" /></div>
  <div class="cell-wrapper" data-ref="C1"><input class="celda" data-ref="C1" /></div>
  <div class="cell-wrapper" data-ref="C2"><input class="celda" data-ref="C2" /></div>
  <div class="cell-wrapper" data-ref="C3"><input class="celda" data-ref="C3" /></div>
</div>
<script>
(() => {
  const cells = {};
  document.querySelectorAll('.celda').forEach(input => {
    const ref = input.dataset.ref;
    cells[ref] = input;
    input.addEventListener('input', () => {
      const val = input.value;
      const wrapper = input.parentElement;
      if (val.startsWith('=')) {
        input.dataset.formula = val;
        wrapper.dataset.formula = 'true';
      } else {
        delete input.dataset.formula;
        delete wrapper.dataset.formula;
      }
      recomputeAll();
    });
  });

  function recomputeAll() {
    const cache = {};
    const visiting = new Set();

    const evaluate = (ref) => {
      if (cache[ref] !== undefined) return cache[ref];
      const input = cells[ref];
      const formula = input.dataset.formula;
      if (!formula) {
        cache[ref] = input.value;
        return cache[ref];
      }
      if (visiting.has(ref)) {
        cache[ref] = 'CIRC';
        return cache[ref];
      }
      visiting.add(ref);
      const expr = formula.slice(1);
      const parts = expr.split(/([+-])/);
      let result = evaluateOperand(parts[0]);
      for (let i = 1; i < parts.length; i += 2) {
        const op = parts[i];
        const operand = evaluateOperand(parts[i+1]);
        if (result === 'CIRC' || operand === 'CIRC') {
          result = 'CIRC';
          break;
        }
        if (op === '+') result += operand;
        else result -= operand;
      }
      visiting.delete(ref);
      cache[ref] = result;
      return result;
    };

    const evaluateOperand = (token) => {
      token = token.trim();
      if (/^[A-C][1-3]$/.test(token)) {
        return evaluate(token);
      } else {
        const num = parseFloat(token);
        return isNaN(num) ? 0 : num;
      }
    };

    Object.keys(cells).forEach(ref => {
      const input = cells[ref];
      const value = evaluate(ref);
      input.value = value;
    });
  }

  recomputeAll();
})();
</script>
</body>
</html>
