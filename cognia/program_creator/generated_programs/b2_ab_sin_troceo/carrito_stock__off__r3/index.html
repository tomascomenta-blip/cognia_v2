<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito de compra con STOCK</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#333;
  }
  .container{
    display:flex;
    flex-wrap:wrap;
    max-width:1200px;
    margin:auto;
    padding:20px;
    gap:20px;
  }
  #products{
    flex:1 1 60%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  #cart{
    flex:1 1 35%;
    background:#fff;
    padding:15px;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .prod{
    background:#fdf6e3;
    border:1px solid #ddd;
    padding:10px;
    border-radius:4px;
    transition:box-shadow 0.3s;
  }
  .prod:hover{
    box-shadow:0 0 10px rgba(0,0,0,0.1);
  }
  .prod h3{
    margin:0 0 5px;
    font-size:1.1em;
  }
  .prod p{
    margin:5px 0;
  }
  .prod button.add{
    background:#008080;
    color:#fff;
    border:none;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  .prod button.add:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  #cart-lines{
    margin-top:10px;
  }
  .linea{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 0;
    border-bottom:1px solid #eee;
  }
  .linea span.cant{
    margin:0 10px;
  }
  .linea button.quitar{
    background:#008080;
    color:#fff;
    border:none;
    padding:3px 6px;
    border-radius:3px;
    cursor:pointer;
  }
  .total{
    margin-top:10px;
    font-weight:bold;
    font-size:1.2em;
  }
  @media (max-width:768px){
    .container{
      flex-direction:column;
    }
    #products,#cart{
      flex:1 1 100%;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div id="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3 class="name">Producto 1</h3>
      <p class="price">Precio: <span class="precio"></span></p>
      <p class="stock">Stock: <span class="stock"></span></p>
      <button class="add" data-id="p1">Agregar</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3 class="name">Producto 2</h3>
      <p class="price">Precio: <span class="precio"></span></p>
      <p class="stock">Stock: <span class="stock"></span></p>
      <button class="add" data-id="p2">Agregar</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3 class="name">Producto 3</h3>
      <p class="price">Precio: <span class="precio"></span></p>
      <p class="stock">Stock: <span class="stock"></span></p>
      <button class="add" data-id="p3">Agregar</button>
    </div>
  </div>
  <div id="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">0</span></div>
  </div>
</div>
<script>
class ShoppingCart{
  constructor(){
    this.cart = {}; // id -> qty
    this.products = {}; // id -> {precio, stock}
    this.init();
  }
  init(){
    // Load product data and display price/stock
    document.querySelectorAll('.prod').forEach(prod=>{
      const id = prod.dataset.id;
      const precio = parseFloat(prod.dataset.precio);
      const stock = parseInt(prod.dataset.stock,10);
      this.products[id] = {precio, stock};
      prod.querySelector('.precio').textContent = this.formatCurrency(precio);
      prod.querySelector('.stock').textContent = stock;
    });
    // Add event listeners
    document.querySelectorAll('.add').forEach(btn=>{
      btn.addEventListener('click',()=>this.addItem(btn.dataset.id));
    });
    document.querySelectorAll('.quitar').forEach(btn=>{
      btn.addEventListener('click',()=>this.removeItem(btn.dataset.id));
    });
    this.updateTotal();
  }
  formatCurrency(v){ return v.toLocaleString('es-ES',{style:'currency',currency:'EUR'}); }
  addItem(id){
    const prod = this.products[id];
    const cur = this.cart[id]||0;
    if(cur < prod.stock){
      this.cart[id] = cur+1;
      this.updateLine(id);
      this.updateAddButton(id);
      this.updateTotal();
    }
  }
  removeItem(id){
    const cur = this.cart[id]||0;
    if(cur>0){
      this.cart[id] = cur-1;
      if(this.cart[id]===0){
        delete this.cart[id];
        this.removeLine(id);
      }else{
        this.updateLine(id);
      }
      this.updateAddButton(id);
      this.updateTotal();
    }
  }
  updateLine(id){
    const qty = this.cart[id];
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if(!line){
      line = document.createElement('div');
      line.className='linea';
      line.dataset.id=id;
      line.innerHTML = `<span class="name">${this.getName(id)}</span>
                        <span class="cant">${qty}</span>
                        <button class="quitar" data-id="${id}">-</button>`;
      document.getElementById('cart-lines').appendChild(line);
      line.querySelector('.quitar').addEventListener('click',()=>this.removeItem(id));
    }else{
      line.querySelector('.cant').textContent = qty;
    }
  }
  removeLine(id){
    const line = document.querySelector(`.linea[data-id="${id}"]`);
    if(line) line.remove();
  }
  updateAddButton(id){
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    const qty = this.cart[id]||0;
    const stock = this.products[id].stock;
    btn.disabled = qty>=stock;
  }
  updateTotal(){
    let total=0;
    for(const id in this.cart){
      total += this.cart[id]*this.products[id].precio;
    }
    document.getElementById('total').textContent = this.formatCurrency(total);
  }
  getName(id){
    return document.querySelector(`.prod[data-id="${id}"] .name`).textContent;
  }
}
document.addEventListener('DOMContentLoaded',()=>new ShoppingCart());
</script>
</body>
</html>
