<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f5f5f5;color:#333;}
  .container{display:flex;gap:20px;flex-wrap:wrap;}
  .products,.cart{flex:1 1 300px;background:#fff;border:1px solid #ddd;border-radius:5px;padding:15px;}
  .prod{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:10px;border:1px solid #ddd;border-radius:3px;background:#fafafa;}
  .add{background:#008080;color:#fff;border:none;padding:5px 10px;border-radius:3px;cursor:pointer;}
  .add:disabled{background:#999;cursor:not-allowed;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .quitar{background:#c00;color:#fff;border:none;padding:3px 8px;border-radius:3px;cursor:pointer;}
  h2{margin-top:0;font-size:1.2em;}
  @media(max-width:600px){.container{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <span>Producto 1</span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <span>Producto 2</span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <span>Producto 3</span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div>Total: <span id="total">0.00 €</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const cart={};
  const addBtns=document.querySelectorAll('.add');
  const lines=document.getElementById('lines');
  const totalEl=document.getElementById('total');

  function format(num){return num.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
  function updateTotal(){
    let sum=0;
    for(const id in cart){sum+=cart[id]*parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);}
    totalEl.textContent=format(sum);
  }
  function updateLine(id){
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const price=parseFloat(prod.dataset.precio);
    const stock=parseInt(prod.dataset.stock,10);
    const qty=cart[id]||0;
    let line=document.querySelector(`.linea[data-id="${id}"]`);
    if(qty>0){
      if(!line){
        line=document.createElement('div');
        line.className='linea';
        line.dataset.id=id;
        line.innerHTML=`<span class="cant">${qty}</span> <button class="quitar" data-id="${id}">Quitar</button>`;
        lines.appendChild(line);
        line.querySelector('.quitar').addEventListener('click',()=>{removeItem(id);});
      }else{
        line.querySelector('.cant').textContent=qty;
      }
    }else{
      if(line)lines.removeChild(line);
    }
    const addBtn=prod.querySelector('.add');
    addBtn.disabled=qty>=stock;
  }
  function addItem(id){
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const stock=parseInt(prod.dataset.stock,10);
    cart[id]=(cart[id]||0)+1;
    if(cart[id]>stock)cart[id]=stock;
    updateLine(id);
    updateTotal();
  }
  function removeItem(id){
    if(!cart[id])return;
    cart[id]--;
    if(cart[id]===0)delete cart[id];
    updateLine(id);
    updateTotal();
  }
  addBtns.forEach(btn=>btn.addEventListener('click',()=>addItem(btn.dataset.id)));
});
</script>
</body>
</html>
