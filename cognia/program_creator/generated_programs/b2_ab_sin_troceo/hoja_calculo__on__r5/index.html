<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    padding:20px;
    box-sizing:border-box;
  }
  .container{
    max-width:400px;
    width:100%;
    text-align:center;
  }
  .title-bar{
    background:#c0c8d0;
    color:#333;
    padding:5px 10px;
    border-radius:4px;
    font-size:.9rem;
    margin-bottom:10px;
  }
  .grid{
    background:#fff;
    border:1px solid #ddd;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    display:inline-block;
  }
  .grid td{
    padding:0;
  }
  .celda{
    width:80px;
    height:30px;
    border:1px solid #ddd;
    text-align:right;
    padding-right:5px;
    font-size:1rem;
    transition:background .2s;
  }
  .celda:hover{background:#f9f9f9;}
  .celda.active{background:#e0f7fa;}
  .celda:focus{outline:none;}
</style>
</head>
<body>
<div class="container">
  <div class="title-bar">Mini Hoja de Cálculo 3x3</div>
  <table class="grid">
    <tbody>
      <tr>
        <td><input type="text" class="celda" data-ref="A1"></td>
        <td><input type="text" class="celda" data-ref="A2"></td>
        <td><input type="text" class="celda" data-ref="A3"></td>
      </tr>
      <tr>
        <td><input type="text" class="celda" data-ref="B1"></td>
        <td><input type="text" class="celda" data-ref="B2"></td>
        <td><input type="text" class="celda" data-ref="B3"></td>
      </tr>
      <tr>
        <td><input type="text" class="celda" data-ref="C1"></td>
        <td><input type="text" class="celda" data-ref="C2"></td>
        <td><input type="text" class="celda" data-ref="C3"></td>
      </tr>
    </tbody>
  </table>
</div>
<script>
(function(){
  const cells = document.querySelectorAll('.celda');
  function getCellByRef(ref){ return document.querySelector('.celda[data-ref="'+ref+'"]'); }
  function formatNumber(num){ return Number(num).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function evaluateCell(cell, stack){
    const ref = cell.dataset.ref;
    if(stack.includes(ref)){
      cell.value='CIRC';
      return 'CIRC';
    }
    if(!cell.dataset.formula){
      const val = cell.value.trim();
      return val=== ''? 0 : parseFloat(val.replace(/,/g,''));
    }
    const formula = cell.dataset.formula;
    stack.push(ref);
    let expr = formula.slice(1); // remove '='
    expr = expr.replace(/[A-C][1-3]/g, m=>{
      const rc = getCellByRef(m);
      const v = evaluateCell(rc, stack);
      return v==='CIRC'?'0':v;
    });
    let result;
    try{ result = eval(expr); }catch(e){ result='CIRC'; }
    stack.pop();
    if(result==='CIRC' || isNaN(result)){
      cell.value='CIRC';
      return 'CIRC';
    }else{
      cell.value=formatNumber(result);
      return result;
    }
  }
  function evaluateAll(){
    cells.forEach(c=>evaluateCell(c,[]));
  }
  cells.forEach(c=>{
    c.addEventListener('input',e=>{
      const val = e.target.value;
      if(val.startsWith('=')){
        c.dataset.formula=val;
      }else{
        delete c.dataset.formula;
      }
      evaluateAll();
    });
    c.addEventListener('focus',()=>c.classList.add('active'));
    c.addEventListener('blur',()=>c.classList.remove('active'));
  });
  evaluateAll();
})();
</script>
</body>
</html>
