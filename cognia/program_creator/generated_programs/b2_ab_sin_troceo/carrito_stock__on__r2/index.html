
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family: Arial, sans-serif;
    margin: 2rem;
    background:#f9f9f9;
  }
  h1{ text-align:center; }
  .products{ display:flex; gap:1rem; justify-content:center; margin-bottom:2rem; }
  .prod{
    background:#fff;
    padding:1rem;
    border:1px solid #ddd;
    border-radius:5px;
    width:120px;
    text-align:center;
    opacity:0;
    animation:fadeIn 0.8s forwards;
  }
  .prod:nth-child(1){ animation-delay:0.2s; }
  .prod:nth-child(2){ animation-delay:0.4s; }
  .prod:nth-child(3){ animation-delay:0.6s; }
  .prod button{ margin-top:0.5rem; }
  #cart{ min-height:50px; border:1px solid #ddd; padding:1rem; border-radius:5px; background:#fff; }
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:0.5rem;
    opacity:0;
    animation:slideIn 0.4s forwards;
  }
  .linea:nth-child(1){ animation-delay:0.1s; }
  .linea:nth-child(2){ animation-delay:0.2s; }
  .linea:nth-child(3){ animation-delay:0.3s; }
  .linea button{ margin-left:1rem; }
  #total{ font-weight:bold; }
  @keyframes fadeIn{
    to{ opacity:1; }
  }
  @keyframes slideIn{
    from{ transform:translateX(-20px); opacity:0; }
    to{ transform:translateX(0); opacity:1; }
  }
</style>
</head>
<body>
<h1>Carrito con Stock</h1>

<div class="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - $100 (Stock: 2)</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - $50 (Stock: 3)</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - $25 (Stock: 1)</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: $<span id="total">0</span></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cart = {}; // {id: quantity}
  const products = document.querySelectorAll('.prod');
  const cartContainer = document.getElementById('cart');
  const totalSpan = document.getElementById('total');

  // Helper to get product data
  function getProduct(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    return {
      precio: parseFloat(prod.dataset.precio),
      stock: parseInt(prod.dataset.stock, 10),
      button: prod.querySelector(`button.add[data-id="${id}"]`)
    };
  }

  // Update total
  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const { precio } = getProduct(id);
      total += cart[id] * precio;
    }
    totalSpan.textContent = total.toFixed(2);
  }

  // Create or update line
  function renderLine(id) {
    let line = cartContainer.querySelector(`.linea[data-id="${id}"]`);
    if (!line) {
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <span class="cant">${cart[id]}</span>
        <button class="quitar" data-id="${id}">Quitar</button>
      `;
      cartContainer.appendChild(line);
      line.querySelector('.quitar').addEventListener('click', () => removeFromCart(id));
    } else {
      line.querySelector('.cant').textContent = cart[id];
    }
  }

  // Add product to cart
  function addToCart(id) {
    const { stock, button } = getProduct(id);
    const current = cart[id] || 0;
    if (current < stock) {
      cart[id] = current + 1;
      renderLine(id);
      if (cart[id] === stock) button.disabled = true;
      updateTotal();
    }
  }

  // Remove product from cart
  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    const { button } = getProduct(id);
    if (cart[id] <= 0) {
      delete cart[id];
      const line = cartContainer.querySelector(`.linea[data-id="${id}"]`);
      if (line) cartContainer.removeChild(line);
      button.disabled = false;
    } else {
      renderLine(id);
    }
    updateTotal();
  }

  // Attach listeners to add buttons
  products.forEach(prod => {
    const id = prod.dataset.id;
    const btn = prod.querySelector(`button.add[data-id="${id}"]`);
    btn.addEventListener('click', () => addToCart(id));
  });
});
</script>
</body>
</html>
