
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3×3</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f0f0;padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:300px;margin:auto;}
  .celda{width:100%;padding:5px;font-size:1rem;text-align:right;}
</style>
</head>
<body>
<h2 style="text-align:center;">Mini hoja de cálculo 3×3</h2>
<div class="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>

<script>
(() => {
  const cells = {}; // ref -> input element
  const updating = {flag:false};

  // Build map
  document.querySelectorAll('.celda').forEach(inp => {
    const ref = inp.dataset.ref;
    cells[ref] = inp;
    // Store original formula if present
    if (inp.value.startsWith('=')) {
      inp.dataset.formula = inp.value;
    } else {
      inp.dataset.formula = '';
    }
  });

  // Evaluate a cell recursively
  function evaluateCell(ref, stack=[]) {
    const inp = cells[ref];
    if (!inp) return 0; // safety
    const formula = inp.dataset.formula;
    if (!formula) {
      // Not a formula: return numeric value or 0
      const val = parseFloat(inp.value);
      return isNaN(val) ? 0 : val;
    }
    // Formula: detect cycle
    if (stack.includes(ref)) return 'CIRC';
    stack.push(ref);
    // Replace references with evaluated values
    let expr = formula.slice(1); // remove leading '='
    const refRegex = /[A-C][1-3]/g;
    expr = expr.replace(refRegex, match => {
      const val = evaluateCell(match, stack.slice());
      return val === 'CIRC' ? 'CIRC' : val;
    });
    // If any part is CIRC, propagate
    if (expr.includes('CIRC')) return 'CIRC';
    // Evaluate arithmetic expression (+, -)
    try {
      const result = Function(`return ${expr}`)();
      return result;
    } catch (e) {
      return 'CIRC';
    }
  }

  // Recalculate all cells
  function recalcAll() {
    updating.flag = true;
    Object.keys(cells).forEach(ref => {
      const inp = cells[ref];
      const val = evaluateCell(ref);
      inp.value = val === 'CIRC' ? 'CIRC' : val;
    });
    updating.flag = false;
  }

  // Event listeners
  document.querySelectorAll('.celda').forEach(inp => {
    inp.addEventListener('input', e => {
      if (updating.flag) return; // ignore programmatic changes
      const val = inp.value;
      if (val.startsWith('=')) {
        inp.dataset.formula = val;
      } else {
        inp.dataset.formula = '';
      }
      recalcAll();
    });
  });

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
