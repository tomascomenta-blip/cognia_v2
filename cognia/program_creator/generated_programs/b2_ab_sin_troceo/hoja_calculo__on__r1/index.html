<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#333;}
header{background:#333;color:#fff;padding:8px;text-align:center;font-weight:bold;}
footer{background:#f0f0f0;color:#666;padding:4px;text-align:center;font-size:.9em;}
table{margin:auto;border-collapse:collapse;}
th,td{padding:0;}
th{font-weight:bold;text-align:center;}
input.celda{width:100%;height:30px;border:1px solid #ccc;border-radius:4px;padding:0 4px;font-size:14px;}
input.celda:focus{background:#e0f7fa;}
input.celda.formula{background:#fff8e1;}
</style>
</head>
<body>
<header>Mini Hoja de Cálculo</header>
<div class="grid">
<table>
<thead><tr><th></th><th>A</th><th>B</th><th>C</th></tr></thead>
<tbody>
<tr><th>1</th><td><input class="celda" data-ref="A1"></td><td><input class="celda" data-ref="B1"></td><td><input class="celda" data-ref="C1"></td></tr>
<tr><th>2</th><td><input class="celda" data-ref="A2"></td><td><input class="celda" data-ref="B2"></td><td><input class="celda" data-ref="C2"></td></tr>
<tr><th>3</th><td><input class="celda" data-ref="A3"></td><td><input class="celda" data-ref="B3"></td><td><input class="celda" data-ref="C3"></td></tr>
</tbody>
</table>
</div>
<footer>Resultados</footer>
<script>
const cells={};
document.querySelectorAll('input.celda').forEach(el=>{
  cells[el.dataset.ref]=el;
  el.addEventListener('input',()=>{if(el.value.startsWith('='))el.dataset.formula=el.value;else delete el.dataset.formula;recalc();});
});
function recalc(){
  Object.keys(cells).forEach(ref=>{
    const el=cells[ref];
    if(el.dataset.formula){
      const val=evalCell(ref,new Set());
      if(val==='CIRC'){el.value='CIRC';el.classList.add('formula');}
      else{el.value=format(val);el.classList.add('formula');}
    }else el.classList.remove('formula');
  });
}
function evalCell(ref,vis){
  if(vis.has(ref))return 'CIRC';
  const el=cells[ref];
  if(!el)return 0;
  if(!el.dataset.formula){const v=parseFloat(el.value);return isNaN(v)?0:v;}
  vis.add(ref);
  const val=compute(el.dataset.formula,vis);
  vis.delete(ref);
  return val;
}
function compute(form,vis){
  let expr=form.slice(1).replace(/[A-C][1-3]/g,m=>{
    const v=evalCell(m,vis);
    return v==='CIRC'?'NaN':v;
  });
  try{return Function('"use strict";return ('+expr+')')();}
  catch{return 'CIRC';}
}
function format(n){return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});}
document.addEventListener('DOMContentLoaded',recalc);
</script>
</body>
</html>
