<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
body{font-family:sans-serif;background:#f9f9f9;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
table{border-collapse:collapse;margin-bottom:10px;}
th,td{padding:5px;text-align:center;}
th{color:#777;}
.celda{width:80px;height:30px;border:1px solid #ccc;background:#fff;text-align:center;}
button{background:#008080;color:#fff;border:none;border-radius:5px;padding:8px 12px;cursor:pointer;}
#status{font-size:12px;color:#777;}
</style>
</head>
<body>
<table>
<tr><th></th><th>A</th><th>B</th><th>C</th></tr>
<tr><th>1</th><td><input class="celda" data-ref="A1"></td><td><input class="celda" data-ref="B1"></td><td><input class="celda" data-ref="C1"></td></tr>
<tr><th>2</th><td><input class="celda" data-ref="A2"></td><td><input class="celda" data-ref="B2"></td><td><input class="celda" data-ref="C2"></td></tr>
<tr><th>3</th><td><input class="celda" data-ref="A3"></td><td><input class="celda" data-ref="B3"></td><td><input class="celda" data-ref="C3"></td></tr>
</table>
<button id="rec">Recalculate</button>
<div id="status">All cells updated</div>
<script>
const cells=document.querySelectorAll('.celda');
function evalCell(ref,vis){if(vis.has(ref))return 'CIRC';vis.add(ref);const el=document.querySelector(`[data-ref="${ref}"]`);const f=el.dataset.formula;if(!f)return parseFloat(el.value)||0;const expr=f.slice(1).replace(/[A-C][1-3]/g,r=>{const v=evalCell(r,vis);return v==='CIRC'?'CIRC':v});if(expr==='CIRC')return 'CIRC';const res=eval(expr);return isNaN(res)?0:res;}
function recalc(){cells.forEach(el=>{const val=el.value;if(val.startsWith('=')){el.dataset.formula=val;const v=evalCell(el.dataset.ref,new Set());el.value=v==='CIRC'?v:parseFloat(v).toString();}else{delete el.dataset.formula;el.value=val;}});document.getElementById('status').textContent='All cells updated';}
cells.forEach(el=>el.addEventListener('input',recalc));
document.getElementById('rec').addEventListener('click',recalc);
recalc();
</script>
</body>
</html>
