
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:sans-serif;
    background:#333;
    color:#fff;
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:fadeIn 2s;
  }
  @keyframes fadeIn{
    0%{opacity:0;}
    100%{opacity:1;}
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,60px);
    grid-template-rows:repeat(5,60px);
    gap:2px;
    margin-bottom:20px;
  }
  .c{
    background:#777;
    border:1px solid #555;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#bbb;
    border:1px solid #999;
    cursor:default;
  }
  .c.bandera{
    background:#f00;
    color:#fff;
  }
  #estado{
    font-size:24px;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
  const mines=[6,12,18];
  const grid=document.getElementById('grid');
  const estado=document.getElementById('estado');

  // Crear las 25 celdas
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='c';
    div.dataset.i=i;
    grid.appendChild(div);
  }

  // Obtener vecinos de cada celda
  function getNeighbors(i){
    const row=Math.floor(i/5);
    const col=i%5;
    const neighbors=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const r=row+dr, c=col+dc;
        if(r>=0 && r<5 && c>=0 && c<5){
          neighbors.push(r*5+c);
        }
      }
    }
    return neighbors;
  }
  const neighborMap=Array.from({length:25},(_,i)=>getNeighbors(i));

  // Abrir una celda
  function openCell(i){
    const cell=document.querySelector(`.c[data-i='${i}']`);
    if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;

    if(mines.includes(i)){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      return;
    }

    const count=neighborMap[i].filter(n=>mines.includes(n)).length;
    cell.classList.add('abierta');
    if(count>0) cell.textContent=count;

    if(count===0){
      neighborMap[i].forEach(n=>openCell(n));
    }
  }

  // Click izquierdo
  grid.addEventListener('click',e=>{
    if(!e.target.classList.contains('c')) return;
    openCell(parseInt(e.target.dataset.i));
  });

  // Click derecho (bandera)
  grid.addEventListener('contextmenu',e=>{
    e.preventDefault();
    if(!e.target.classList.contains('c')) return;
    const cell=e.target;
    if(cell.classList.contains('abierta')) return;
    cell.classList.toggle('bandera');
    cell.textContent = cell.classList.contains('bandera') ? '🚩' : '';
  });
</script>
</body>
</html>
