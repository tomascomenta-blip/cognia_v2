
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en una página</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
  }
  .board{
    display:flex;
    flex-wrap:wrap;
    gap:1rem;
    padding:1rem;
  }
  .col{
    flex:1 1 200px;
    background:#fff;
    border-radius:4px;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
  }
  .header{
    background:#e0f0ff;
    color:#004080;
    padding:0.5rem 1rem;
    font-weight:bold;
    font-size:1.1rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #c0d8e8;
  }
  .header span{
    font-size:0.9rem;
    font-weight:normal;
    color:#0066cc;
  }
  .card{
    padding:0.75rem 1rem;
    margin:0.5rem 1rem;
    background:#fafafa;
    border-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card-title{flex:1;}
  .btn{
    width:24px;
    height:24px;
    border:none;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    font-size:1rem;
    line-height:1;
  }
  .btn.mas{background:#28a745;color:#fff;}
  .btn.menos{background:#dc3545;color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  @media (max-width:600px){
    .board{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <div class="header">todo <span id="cont-todo"></span></div>
    <div class="card" data-id="t1"><div class="card-title">Tarea 1</div><button class="btn menos">←</button><button class="btn mas">→</button></div>
    <div class="card" data-id="t2"><div class="card-title">Tarea 2</div><button class="btn menos">←</button><button class="btn mas">→</button></div>
    <div class="card" data-id="t3"><div class="card-title">Tarea 3</div><button class="btn menos">←</button><button class="btn mas">→</button></div>
  </div>
  <div class="col" data-col="doing">
    <div class="header">doing <span id="cont-doing"></span></div>
  </div>
  <div class="col" data-col="done">
    <div class="header">done <span id="cont-done"></span></div>
  </div>
</div>
<script>
  function updateCounters(){
    document.querySelectorAll('.col').forEach(col=>{
      const id=col.dataset.col;
      const count=col.querySelectorAll('.card').length;
      document.getElementById('cont-'+id).textContent=count;
    });
  }
  function moveCard(card,direction){
    const currentCol=card.parentElement;
    const currentColName=currentCol.dataset.col;
    let targetColName;
    if(direction==='right'){
      if(currentColName==='todo') targetColName='doing';
      else if(currentColName==='doing') targetColName='done';
      else return; // done cannot move right
    }else if(direction==='left'){
      if(currentColName==='doing') targetColName='todo';
      else if(currentColName==='done') targetColName='doing';
      else return; // todo cannot move left
    }
    const targetCol=document.querySelector('.col[data-col="'+targetColName+'"]');
    if(targetColName==='doing' && targetCol.querySelectorAll('.card').length>=2) return; // WIP limit
    targetCol.appendChild(card);
    updateCounters();
  }
  document.querySelectorAll('.btn.mas').forEach(btn=>{
    btn.addEventListener('click',()=>{moveCard(btn.parentElement,'right');});
  });
  document.querySelectorAll('.btn.menos').forEach(btn=>{
    btn.addEventListener('click',()=>{moveCard(btn.parentElement,'left');});
  });
  updateCounters();
</script>
</body>
</html>
