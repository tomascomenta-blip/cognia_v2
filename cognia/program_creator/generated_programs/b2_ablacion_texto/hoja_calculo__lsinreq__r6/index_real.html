<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:sans-serif;
    margin:0;
    padding:0;
  }
  .grid{
    border-collapse:collapse;
    margin-top:20px;
    width:100%;
    max-width:400px;
  }
  .grid th,.grid td{
    width:70px;
    height:70px;
    text-align:center;
    vertical-align:middle;
  }
  .grid th.label{
    color:#008080;
    font-weight:normal;
  }
  .grid input{
    width:100%;
    height:70px;
    border:1px solid #fff;
    background:white;
    font-size:16px;
    text-align:center;
    outline:none;
    transition:background-color 0.2s,box-shadow 0.2s;
  }
  .grid input:hover{
    background-color:#d0e8ff;
  }
  .grid input.dependent{
    box-shadow:0 0 5px 2px #a0ffa0;
  }
  button{
    margin-top:10px;
    padding:5px 10px;
    border:none;
    background:#008080;
    color:white;
    border-radius:3px;
    cursor:pointer;
    transition:background 0.2s;
  }
  button:hover{
    background:#006666;
  }
</style>
</head>
<body>
<table class="grid">
  <tr>
    <th></th>
    <th class="label">1</th>
    <th class="label">2</th>
    <th class="label">3</th>
  </tr>
  <tr>
    <th class="label">A</th>
    <td><input class="celda" data-ref="A1"></td>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="A3"></td>
  </tr>
  <tr>
    <th class="label">B</th>
    <td><input class="celda" data-ref="B1"></td>
    <td><input class="celda" data-ref="B2"></td>
    <td><input class="celda" data-ref="B3"></td>
  </tr>
  <tr>
    <th class="label">C</th>
    <td><input class="celda" data-ref="C1"></td>
    <td><input class="celda" data-ref="C2"></td>
    <td><input class="celda" data-ref="C3"></td>
  </tr>
</table>
<button id="recalcBtn">Recalculate</button>
<script>
(() => {
  const cells = {};
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  refs.forEach(r=>{ cells[r] = document.querySelector(`input[data-ref="${r}"]`); });

  const formatNumber = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  const buildAdjacency = () => {
    const adj = {};
    refs.forEach(r=>{
      const val = cells[r].value.trim();
      if(val.startsWith('=')){
        const refsIn = val.slice(1).match(/[A-C][1-3]/g) || [];
        adj[r] = refsIn;
      }else{
        adj[r] = [];
      }
    });
    return adj;
  };

  const buildReverseAdj = (adj) => {
    const rev = {};
    refs.forEach(r=>rev[r]=[]);
    refs.forEach(r=>{
      adj[r].forEach(dep=>rev[dep].push(r));
    });
    return rev;
  };

  const evaluateCell = (ref, stack, memo, adj) => {
    if(memo.hasOwnProperty(ref)) return memo[ref];
    if(stack.has(ref)){
      memo[ref] = 'CIRC';
      return 'CIRC';
    }
    stack.add(ref);
    const val = cells[ref].value.trim();
    if(!val.startsWith('=')){
      const num = parseFloat(val);
      memo[ref] = isNaN(num) ? '' : num;
      stack.delete(ref);
      return memo[ref];
    }
    const expr = val.slice(1);
    const replaced = expr.replace(/[A-C][1-3]/g, m=>{
      const v = evaluateCell(m, stack, memo, adj);
      if(v==='CIRC') return 'NaN';
      return v=== '' ? '0' : v;
    });
    let result;
    try{
      result = Function('return '+replaced)();
    }catch(e){ result=''; }
    if(result===undefined||result===null||isNaN(result)){
      memo[ref]='';
    }else{
      memo[ref]=result;
    }
    stack.delete(ref);
    return memo[ref];
  };

  const recalcAll = (editedRef=null) => {
    const adj = buildAdjacency();
    const rev = buildReverseAdj(adj);
    const memo = {};
    refs.forEach(r=>evaluateCell(r,new Set(),memo,adj));
    refs.forEach(r=>{
      const val = memo[r];
      if(val==='CIRC'){
        cells[r].value='CIRC';
      }else if(typeof val==='number'){
        cells[r].value=formatNumber(val);
      }else{
        cells[r].value='';
      }
    });
    // highlight dependent cells
    if(editedRef){
      const reachable = new Set();
      const stack=[editedRef];
      while(stack.length){
        const cur=stack.pop();
        if(!reachable.has(cur)){
          reachable.add(cur);
          rev[cur].forEach(n=>stack.push(n));
        }
      }
      refs.forEach(r=>{
        if(reachable.has(r)){
          cells[r].classList.add('dependent');
        }else{
          cells[r].classList.remove('dependent');
        }
      });
    }else{
      refs.forEach(r=>cells[r].classList.remove('dependent'));
    }
  };

  refs.forEach(r=>{
    cells[r].addEventListener('input',e=>{
      recalcAll(r);
    });
  });

  document.getElementById('recalcBtn').addEventListener('click',()=>recalcAll());

  // initial calculation
  recalcAll();
})();
</script>
</body>
</html>
