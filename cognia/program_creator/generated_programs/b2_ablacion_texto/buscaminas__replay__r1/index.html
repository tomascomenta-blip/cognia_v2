
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5 con minas fijas</title>
<style>
  body{
    margin:0;
    background:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:sans-serif;
    color:#fff;
  }
  #mines-left{
    margin-bottom:5px;
    font-size:1rem;
  }
  #estado{
    margin-bottom:10px;
    font-size:1.2rem;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-auto-flow:column;
    gap:2px;
    width:90vmin;
    max-width:400px;
    aspect-ratio:1/1;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
    background:#555;
    padding:2px;
  }
  .c{
    background:#e0e0e0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5rem;
    color:#004040;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#008080;
    color:#004040;
  }
  .c.bandera{
    color:#ff0000;
  }
</style>
</head>
<body>
<div id="mines-left">minas restantes: 3</div>
<div id="estado"></div>
<div id="grid"></div>

<script>
class Minesweeper{
  constructor(){
    this.grid=document.getElementById('grid');
    this.estado=document.getElementById('estado');
    this.minesLeft=document.getElementById('mines-left');
    this.mines=new Set([6,12,18]); // minas fijas
    this.cells=[];
    this.init();
    this.updateMinesLeft();
  }
  init(){
    for(let i=0;i<25;i++){
      const div=document.createElement('div');
      div.classList.add('c');
      div.dataset.i=i;
      div.textContent='';
      div.addEventListener('click',e=>this.handleClick(e));
      div.addEventListener('contextmenu',e=>this.handleRight(e));
      this.grid.appendChild(div);
      this.cells.push(div);
    }
  }
  handleClick(e){
    const cell=e.currentTarget;
    if(cell.classList.contains('bandera')||cell.classList.contains('abierta')) return;
    const i=parseInt(cell.dataset.i);
    if(this.mines.has(i)){
      cell.textContent='💣';
      cell.classList.add('abierta');
      this.estado.textContent='perdiste';
      return;
    }
    const count=this.countAdj(i);
    cell.textContent=count>0?count:'';
    cell.classList.add('abierta');
    if(count===0) this.cascade(i);
  }
  handleRight(e){
    e.preventDefault();
    const cell=e.currentTarget;
    if(cell.classList.contains('abierta')) return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
    this.updateMinesLeft();
  }
  countAdj(i){
    const row=Math.floor(i/5);
    const col=i%5;
    let count=0;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0) continue;
        const r=row+dr;
        const c=col+dc;
        if(r<0||r>4||c<0||c>4) continue;
        const idx=r*5+c;
        if(this.mines.has(idx)) count++;
      }
    }
    return count;
  }
  cascade(start){
    const queue=[start];
    const visited=new Set();
    while(queue.length){
      const cur=queue.shift();
      if(visited.has(cur)) continue;
      visited.add(cur);
      const cell=this.cells[cur];
      if(cell.classList.contains('abierta')) continue;
      const count=this.countAdj(cur);
      cell.textContent=count>0?count:'';
      cell.classList.add('abierta');
      if(count===0){
        const row=Math.floor(cur/5);
        const col=cur%5;
        for(let dr=-1;dr<=1;dr++){
          for(let dc=-1;dc<=1;dc++){
            if(dr===0&&dc===0) continue;
            const r=row+dr;
            const c=col+dc;
            if(r<0||r>4||c<0||c>4) continue;
            const idx=r*5+c;
            if(!visited.has(idx)) queue.push(idx);
          }
        }
      }
    }
  }
  updateMinesLeft(){
    const flagged=this.cells.filter(c=>c.classList.contains('bandera')).length;
    this.minesLeft.textContent='minas restantes: '+(this.mines.size-flagged);
  }
}
new Minesweeper();
</script>
</body>
</html>
