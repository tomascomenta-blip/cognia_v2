<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{
    margin:0;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#e0e0e0;
    font-family:Arial,Helvetica,sans-serif;
  }
  #grid{
    display:grid;
    grid-template-columns:30px repeat(3,70px);
    grid-template-rows:30px repeat(3,70px);
    gap:0;
    background:#f0f0f0;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
  }
  .label{
    color:#008080;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }
  .celda{
    width:70px;
    height:70px;
    border:1px solid white;
    background:white;
    text-align:center;
    font-size:16px;
    padding:0;
    margin:0;
    box-sizing:border-box;
    outline:none;
  }
  .celda:hover{
    background:#e0f0ff;
  }
  .celda:focus{
    outline:2px solid #a0c8ff;
  }
  .celda.depends{
    box-shadow:0 0 5px 2px green;
  }
  #recalcBtn{
    margin-top:10px;
    padding:6px 12px;
    border:none;
    background:#4caf50;
    color:white;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
  }
  #recalcBtn:hover{
    background:#45a049;
  }
</style>
</head>
<body>
<div id="grid">
  <!-- Top-left empty -->
  <div></div>
  <div class="label">1</div>
  <div class="label">2</div>
  <div class="label">3</div>

  <!-- Row A -->
  <div class="label">A</div>
  <input type="text" class="celda" data-ref="A1">
  <input type="text" class="celda" data-ref="A2">
  <input type="text" class="celda" data-ref="A3">

  <!-- Row B -->
  <div class="label">B</div>
  <input type="text" class="celda" data-ref="B1">
  <input type="text" class="celda" data-ref="B2">
  <input type="text" class="celda" data-ref="B3">

  <!-- Row C -->
  <div class="label">C</div>
  <input type="text" class="celda" data-ref="C1">
  <input type="text" class="celda" data-ref="C2">
  <input type="text" class="celda" data-ref="C3">
</div>
<button id="recalcBtn">Recalculate</button>

<script>
(() => {
  const cells = {};
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  refs.forEach(ref => {
    const el = document.querySelector(`input[data-ref="${ref}"]`);
    cells[ref] = el;
  });

  let editedRef = null;

  function evaluate(ref, visited) {
    if (visited.has(ref)) return 'CIRC';
    const cell = cells[ref];
    if (!cell.dataset.formula) return cell.value || '0';
    visited.add(ref);
    const expr = cell.dataset.formula.slice(1);
    const tokens = expr.match(/[A-C][1-3]|[+-]|\d+(\.\d+)?/g) || [];
    let result = 0;
    let op = '+';
    for (const tok of tokens) {
      if (tok === '+' || tok === '-') {
        op = tok;
      } else if (/^[A-C][1-3]$/.test(tok)) {
        const val = evaluate(tok, visited);
        if (val === 'CIRC') return 'CIRC';
        const num = parseFloat(val) || 0;
        result = op === '+' ? result + num : result - num;
      } else { // numeric literal
        const num = parseFloat(tok);
        result = op === '+' ? result + num : result - num;
      }
    }
    visited.delete(ref);
    return result.toString();
  }

  function recalcAll() {
    for (const ref in cells) {
      const cell = cells[ref];
      if (cell.dataset.formula) {
        const val = evaluate(ref, new Set());
        cell.value = val;
      }
    }
  }

  function buildDependencyGraph() {
    const graph = {};
    for (const ref in cells) graph[ref] = [];
    for (const ref in cells) {
      const cell = cells[ref];
      if (cell.dataset.formula) {
        const expr = cell.dataset.formula.slice(1);
        const refs = expr.match(/[A-C][1-3]/g) || [];
        refs.forEach(r => {
          if (graph[r]) graph[r].push(ref);
        });
      }
    }
    return graph;
  }

  function getAllDependents(ref, graph, visited) {
    if (visited.has(ref)) return;
    visited.add(ref);
    const deps = graph[ref] || [];
    deps.forEach(d => getAllDependents(d, graph, visited));
  }

  function highlightDependents(edited) {
    const graph = buildDependencyGraph();
    const visited = new Set();
    if (edited) getAllDependents(edited, graph, visited);
    for (const ref in cells) {
      const cell = cells[ref];
      if (visited.has(ref)) cell.classList.add('depends');
      else cell.classList.remove('depends');
    }
  }

  // Attach listeners
  refs.forEach(ref => {
    const cell = cells[ref];
    cell.addEventListener('input', e => {
      const val = e.target.value;
      if (val.startsWith('=')) {
        e.target.dataset.formula = val;
      } else {
        delete e.target.dataset.formula;
      }
      editedRef = e.target.dataset.ref;
      recalcAll();
      highlightDependents(editedRef);
    });
  });

  document.getElementById('recalcBtn').addEventListener('click', () => {
    recalcAll();
    highlightDependents(editedRef);
  });

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
