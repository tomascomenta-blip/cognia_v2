<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Un carrito de compra con STOCK</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:1rem;background:#f9f9f9;}
  .products{display:flex;flex-wrap:wrap;gap:1rem;}
  .prod{background:#fff;border:1px solid #ddd;padding:1rem;border-radius:4px;flex:1 1 200px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
  .prod span{display:block;margin-bottom:.5rem;}
  .prod button{padding:.5rem 1rem;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .prod button:disabled{background:#aaa;cursor:not-allowed;}
  #cart{margin-top:2rem;background:#fff;border:1px solid #ddd;padding:1rem;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
  .linea button{padding:.3rem .6rem;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  #total{font-weight:bold;font-size:1.2rem;}
  @media(max-width:600px){
    .products{flex-direction:column;}
  }
</style>
</head>
<body>

<h1>Carrito de compra</h1>

<div class="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span class="name">Producto 1</span>
    <span class="precio">$100.00</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span class="name">Producto 2</span>
    <span class="precio">$50.00</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span class="name">Producto 3</span>
    <span class="precio">$25.00</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: <span id="total">0</span></div>

<script>
(() => {
  const cart = {}; // {id: qty}
  const products = document.querySelectorAll('.prod');
  const cartContainer = document.getElementById('cart');
  const totalEl = document.getElementById('total');

  // Helper to format currency
  const fmt = (num) => num.toLocaleString('es-ES', {style:'currency', currency:'EUR'});

  // Update the cart display
  function renderCart() {
    cartContainer.innerHTML = '';
    let total = 0;
    for (const id in cart) {
      const qty = cart[id];
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      total += qty * price;

      const line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;

      const cant = document.createElement('span');
      cant.className = 'cant';
      cant.textContent = qty;
      line.appendChild(cant);

      const btn = document.createElement('button');
      btn.className = 'quitar';
      btn.dataset.id = id;
      btn.textContent = 'Quitar';
      line.appendChild(btn);

      cartContainer.appendChild(line);
    }
    totalEl.textContent = fmt(total);
  }

  // Update add button disabled state
  function updateAddButton(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const btn = prod.querySelector('.add');
    const qty = cart[id] || 0;
    const stock = parseInt(prod.dataset.stock, 10);
    btn.disabled = qty >= stock;
  }

  // Add event listeners for add buttons
  products.forEach(prod => {
    const btn = prod.querySelector('.add');
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const stock = parseInt(prod.dataset.stock, 10);
      const current = cart[id] || 0;
      if (current < stock) {
        cart[id] = current + 1;
        renderCart();
        updateAddButton(id);
      }
    });
  });

  // Delegate click for quitar buttons
  cartContainer.addEventListener('click', e => {
    if (e.target.classList.contains('quitar')) {
      const id = e.target.dataset.id;
      if (cart[id]) {
        cart[id] -= 1;
        if (cart[id] <= 0) delete cart[id];
        renderCart();
        updateAddButton(id);
      }
    }
  });

  // Initial render
  renderCart();
})();
</script>
</body>
</html>
