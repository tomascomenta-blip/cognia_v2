<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
body{font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;}
h1{text-align:center;margin-bottom:10px;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:400px;margin:auto;width:100%;}
.c{background:#ccc;border:1px solid #999;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;user-select:none;}
.c.abierta{background:#eee;}
.c.bandera{background:#ff0;color:#f00;}
#estado{margin-top:10px;text-align:center;font-size:1.2rem;color:red;}
</style>
</head>
<body>
<h1>Buscaminas 5x5</h1>
<div id="grid">
<div class="c" data-i="0"></div>
<div class="c" data-i="1"></div>
<div class="c" data-i="2"></div>
<div class="c" data-i="3"></div>
<div class="c" data-i="4"></div>
<div class="c" data-i="5"></div>
<div class="c" data-i="6"></div>
<div class="c" data-i="7"></div>
<div class="c" data-i="8"></div>
<div class="c" data-i="9"></div>
<div class="c" data-i="10"></div>
<div class="c" data-i="11"></div>
<div class="c" data-i="12"></div>
<div class="c" data-i="13"></div>
<div class="c" data-i="14"></div>
<div class="c" data-i="15"></div>
<div class="c" data-i="16"></div>
<div class="c" data-i="17"></div>
<div class="c" data-i="18"></div>
<div class="c" data-i="19"></div>
<div class="c" data-i="20"></div>
<div class="c" data-i="21"></div>
<div class="c" data-i="22"></div>
<div class="c" data-i="23"></div>
<div class="c" data-i="24"></div>
</div>
<div id="estado"></div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const mines = [6,12,18];
  const isMine = new Array(25).fill(false);
  mines.forEach(i=>isMine[i]=true);
  const counts = new Array(25).fill(0);
  const getNeighbors = (i)=>{
    const r = Math.floor(i/5), c = i%5;
    const neigh = [];
    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<5 && nc>=0 && nc<5){
          neigh.push(nr*5+nc);
        }
      }
    }
    return neigh;
  };
  for(let i=0;i<25;i++){
    if(isMine[i]) continue;
    const neigh = getNeighbors(i);
    let cnt=0;
    neigh.forEach(n=>{ if(isMine[n]) cnt++; });
    counts[i]=cnt;
  }
  const openCell = (i)=>{
    const cell = document.querySelector(`.c[data-i="${i}"]`);
    if(!cell || cell.classList.contains('abierta') || cell.classList.contains('bandera')) return 0;
    if(isMine[i]){
      document.getElementById('estado').textContent='perdiste';
      return -1;
    }
    cell.classList.add('abierta');
    const cnt = counts[i];
    cell.textContent = cnt>0?cnt:'';
    return cnt;
  };
  const cascade = (start)=>{
    const queue=[start];
    while(queue.length){
      const idx=queue.shift();
      const cnt=openCell(idx);
      if(cnt===-1) return;
      if(cnt===0){
        const neigh=getNeighbors(idx);
        neigh.forEach(n=>{
          const cell=document.querySelector(`.c[data-i="${n}"]`);
          if(cell && !cell.classList.contains('abierta') && !cell.classList.contains('bandera')){
            const ncnt=openCell(n);
            if(ncnt===0) queue.push(n);
          }
        });
      }
    }
  };
  const cells=document.querySelectorAll('.c');
  cells.forEach(cell=>{
    cell.addEventListener('click',function(){
      const i=parseInt(this.dataset.i);
      if(this.classList.contains('bandera')) return;
      const cnt=openCell(i);
      if(cnt===0) cascade(i);
    });
    cell.addEventListener('contextmenu',function(e){
      e.preventDefault();
      if(this.classList.contains('abierta')) return;
      if(this.classList.contains('bandera')){
        this.classList.remove('bandera');
        this.textContent='';
      }else{
        this.classList.add('bandera');
        this.textContent='🚩';
      }
    });
  });
});
</script>
</body>
</html>
