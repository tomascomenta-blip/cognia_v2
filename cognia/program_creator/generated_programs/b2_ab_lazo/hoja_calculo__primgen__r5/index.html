<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:sans-serif;margin:0;padding:1rem;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;max-width:400px;margin:auto;}
  .celda{width:100%;padding:0.5rem;font-size:1rem;box-sizing:border-box;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="1">
  <input class="celda" data-ref="A2" value="2">
  <input class="celda" data-ref="A3" value="3">
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="=A2+1">
  <input class="celda" data-ref="B3" value="=A3+1">
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="=B2+1">
  <input class="celda" data-ref="C3" value="=B3+1">
</div>
<script>
  (function(){
    const cells=document.querySelectorAll('.celda');
    const refMap={};
    cells.forEach(c=>{refMap[c.dataset.ref]=c;});
    let updating=false;
    function parseFormula(formula,stack){
      return formula.replace(/[A-C][1-3]/g,ref=>{
        const val=computeCell(ref,new Set(stack));
        return val==='CIRC'? '0' : val;
      });
    }
    function computeCell(ref,stack){
      if(stack.has(ref)) return 'CIRC';
      const cell=refMap[ref];
      const formula=cell.dataset.formula;
      if(!formula) return cell.value;
      stack.add(ref);
      const expr=parseFormula(formula.slice(1),stack);
      let result;
      try{ result=eval(expr); }catch(e){ result=0; }
      stack.delete(ref);
      if(isNaN(result)) result=0;
      return result.toString();
    }
    function recomputeAll(){
      cells.forEach(c=>{
        if(c.dataset.formula){
          const val=computeCell(c.dataset.ref,new Set());
          if(!updating){
            updating=true;
            c.value=val;
            updating=false;
          }
        }
      });
    }
    cells.forEach(c=>{
      if(c.value.startsWith('=')){
        c.dataset.formula=c.value;
      }else{
        c.dataset.formula='';
      }
      c.addEventListener('input',e=>{
        if(updating)return;
        const val=e.target.value;
        if(val.startsWith('=')){
          e.target.dataset.formula=val;
        }else{
          e.target.dataset.formula='';
        }
        recomputeAll();
      });
    });
    recomputeAll();
  })();
</script>
</body>
</html>
