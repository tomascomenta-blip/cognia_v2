<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Carrito con Stock</title><style>
body{margin:0;font-family:sans-serif;background:#f5f5f5;}
.container{display:flex;gap:20px;padding:20px;max-width:900px;margin:auto;}
.left{flex:1;}
.right{flex:1;max-width:300px;background:#fff;padding:10px;border-radius:8px;}
.prod{background:#fff;border-radius:8px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.prod h3{margin:0 0 10px;}
.add{background:#a0c4ff;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
.add:disabled{background:#ccc;cursor:not-allowed;}
.linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.quitar{background:#ff6b6b;color:#fff;border:none;padding:4px 6px;border-radius:4px;cursor:pointer;}
#total{font-weight:bold;font-size:1.2em;}
@media(max-width:600px){.container{flex-direction:column;}.right{max-width:none;}}
</style></head><body>
<div class="container">
<div class="left">
<div class="prod" data-id="p1" data-precio="100" data-stock="2"><h3>Producto 1</h3><button class="add" data-id="p1">Añadir</button></div>
<div class="prod" data-id="p2" data-precio="50" data-stock="3"><h3>Producto 2</h3><button class="add" data-id="p2">Añadir</button></div>
<div class="prod" data-id="p3" data-precio="25" data-stock="1"><h3>Producto 3</h3><button class="add" data-id="p3">Añadir</button></div>
</div>
<div class="right"><div id="cart-items"></div><div id="total">0 €</div></div>
</div>
<script>
const cart={};
function update(){const items=document.getElementById('cart-items');items.innerHTML='';let total=0;for(const id in cart){const qty=cart[id];const prod=document.querySelector(`.prod[data-id="${id}"]`);const price=parseFloat(prod.dataset.precio);total+=qty*price;items.innerHTML+=`<div class="linea" data-id="${id}"><span class="cant">${qty}</span> <button class="quitar" data-id="${id}">-</button></div>`;}document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});for(const id in cart){const qty=cart[id];const prod=document.querySelector(`.prod[data-id="${id}"]`);const stock=parseInt(prod.dataset.stock);document.querySelector(`.add[data-id="${id}"]`).disabled=qty>=stock;}}
document.querySelectorAll('.add').forEach(btn=>btn.addEventListener('click',e=>{const id=e.target.dataset.id;const prod=document.querySelector(`.prod[data-id="${id}"]`);const stock=parseInt(prod.dataset.stock);cart[id]=(cart[id]||0)+1;if(cart[id]>stock){cart[id]=stock;}update();}));
document.addEventListener('click',e=>{if(e.target.classList.contains('quitar')){const id=e.target.dataset.id;cart[id]=(cart[id]||0)-1;if(cart[id]<=0){delete cart[id];}update();}});
update();
</script>
</body></html>
