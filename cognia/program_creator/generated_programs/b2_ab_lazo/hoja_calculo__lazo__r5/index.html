
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,120px);
    grid-gap:8px;
  }
  .celda{
    width:100%;
    height:30px;
    padding:4px;
    font-size:16px;
    box-sizing:border-box;
    text-align:right;
    animation:fade 0.5s ease forwards;
    opacity:0;
  }
  @keyframes fade{
    to{opacity:1;}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B1" value="">
  <input type="text" class="celda" data-ref="B2" value="">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C1" value="">
  <input type="text" class="celda" data-ref="C2" value="">
  <input type="text" class="celda" data-ref="C3" value="">
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const refMap = new Map();
  cells.forEach(cell => refMap.set(cell.dataset.ref, cell));

  // Add animation delay
  cells.forEach((cell, i) => {
    cell.style.animationDelay = `${i * 0.15}s`;
  });

  // Recalculate all formulas on any input change
  cells.forEach(cell => {
    cell.addEventListener('input', recalcAll);
  });

  function recalcAll() {
    const dependencies = new Map(); // ref -> [deps]
    const computed = new Map();     // ref -> value

    // Build dependency graph
    cells.forEach(cell => {
      const ref = cell.dataset.ref;
      const val = cell.value.trim();
      if (val.startsWith('=')) {
        const deps = [...val.matchAll(/[A-C][1-3]/g)].map(m => m[0]);
        dependencies.set(ref, deps);
      } else {
        dependencies.set(ref, []);
      }
    });

    // DFS to compute values with cycle detection
    function compute(ref, stack = new Set()) {
      if (computed.has(ref)) return computed.get(ref);
      if (stack.has(ref)) {
        // Cycle detected
        computed.set(ref, 'CIRC');
        refMap.get(ref).value = 'CIRC';
        return 'CIRC';
      }
      stack.add(ref);
      const cell = refMap.get(ref);
      const val = cell.value.trim();
      if (!val.startsWith('=')) {
        // Non-formula: keep user value
        computed.set(ref, val);
        stack.delete(ref);
        return val;
      }
      const deps = dependencies.get(ref);
      let hasCirc = false;
      const depValues = {};
      deps.forEach(d => {
        const v = compute(d, stack);
        if (v === 'CIRC') hasCirc = true;
        depValues[d] = v;
      });
      if (hasCirc) {
        computed.set(ref, 'CIRC');
        cell.value = 'CIRC';
        stack.delete(ref);
        return 'CIRC';
      }
      // Evaluate expression
      let expr = val.slice(1);
      expr = expr.replace(/[A-C][1-3]/g, d => depValues[d]);
      let result;
      try {
        result = eval(expr);
      } catch (e) {
        result = 'ERR';
      }
      computed.set(ref, result.toString());
      cell.value = result.toString();
      stack.delete(ref);
      return result.toString();
    }

    // Compute all cells
    cells.forEach(cell => compute(cell.dataset.ref));
  }

  // Initial calculation (in case some formulas are pre-filled)
  recalcAll();
});
</script>
</body>
</html>
