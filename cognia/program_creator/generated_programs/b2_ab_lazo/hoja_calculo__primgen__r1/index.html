<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:sans-serif;margin:0;padding:1rem;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:300px;margin:auto;}
  .celda{width:100%;padding:5px;font-size:1rem;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1"><input class="celda" data-ref="A2"><input class="celda" data-ref="A3">
  <input class="celda" data-ref="B1"><input class="celda" data-ref="B2"><input class="celda" data-ref="B3">
  <input class="celda" data-ref="C1"><input class="celda" data-ref="C2"><input class="celda" data-ref="C3">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const map={};
cells.forEach(c=>{map[c.dataset.ref]=c;});
function evalCell(ref,stack=[]) {
  const cell=map[ref];
  if(!cell)return '0';
  const val=cell.value.trim();
  if(val.startsWith('=')){
    if(stack.includes(ref))return 'CIRC';
    const expr=val.slice(1);
    const refs=expr.match(/[A-C][1-3]/g)||[];
    for(const r of refs){
      const res=evalCell(r,[...stack,ref]);
      if(res==='CIRC')return 'CIRC';
    }
    const replaced=expr.replace(/[A-C][1-3]/g, r=>evalCell(r,stack));
    try{return String(eval(replaced));}catch{ return 'CIRC';}
  }else return val;
}
function recalc(){
  cells.forEach(c=>{c.value=evalCell(c.dataset.ref);});
}
cells.forEach(c=>c.addEventListener('input',recalc));
recalc();
</script>
</body>
</html>
