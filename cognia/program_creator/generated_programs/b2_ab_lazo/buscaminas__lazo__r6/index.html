<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5 con minas fijas</title>
<style>
  body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;margin:0;}
  #container{width:100%;max-width:400px;padding:10px;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;}
  .c{background:#fff;border:1px solid #999;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;aspect-ratio:1;}
  .c.abierta{background:#e0e0e0;cursor:default;}
  .c.bandera{background:#ffeb3b;color:#d32f2f;font-weight:bold;}
  #estado{margin-top:10px;font-size:1.2rem;text-align:center;color:red;}
</style>
</head>
<body>
<div id="container">
  <div id="grid"></div>
  <div id="estado"></div>
</div>
<script>
class Cell {
  constructor(element, index, isMine) {
    this.element = element;
    this.index = index;
    this.isMine = isMine;
    this.isOpen = false;
    this.isFlagged = false;
    this.adjacentMines = 0;
    this.element.dataset.i = index;
    this.element.classList.add('c');
    this.element.addEventListener('click', (e) => this.handleClick(e));
    this.element.addEventListener('contextmenu', (e) => this.handleRightClick(e));
  }
  handleClick(e) {
    if (this.isFlagged || this.isOpen) return;
    if (this.isMine) {
      this.openMine();
      this.game.setEstado('perdiste');
    } else {
      this.open();
      if (this.adjacentMines === 0) {
        this.game.cascadeOpen(this);
      }
    }
  }
  handleRightClick(e) {
    e.preventDefault();
    if (this.isOpen) return;
    this.isFlagged = !this.isFlagged;
    if (this.isFlagged) {
      this.element.textContent = '🚩';
      this.element.classList.add('bandera');
    } else {
      this.element.textContent = '';
      this.element.classList.remove('bandera');
    }
  }
  open() {
    this.isOpen = true;
    this.element.classList.add('abierta');
    if (this.adjacentMines > 0) {
      this.element.textContent = this.adjacentMines;
      this.element.style.color = 'green';
    } else {
      this.element.textContent = '';
    }
  }
  openMine() {
    this.isOpen = true;
    this.element.classList.add('abierta');
    this.element.textContent = '💣';
    this.element.style.color = 'red';
  }
}
class Game {
  constructor() {
    this.mines = new Set([6,12,18]);
    this.cells = [];
    this.gridElement = document.getElementById('grid');
    this.estadoElement = document.getElementById('estado');
    this.initGrid();
  }
  initGrid() {
    for (let i=0; i<25; i++) {
      const div = document.createElement('div');
      const isMine = this.mines.has(i);
      const cell = new Cell(div, i, isMine);
      cell.game = this;
      this.cells.push(cell);
      this.gridElement.appendChild(div);
    }
    this.cells.forEach(cell => {
      cell.adjacentMines = this.countAdjacentMines(cell.index);
    });
  }
  countAdjacentMines(index) {
    const row = Math.floor(index / 5);
    const col = index % 5;
    let count = 0;
    for (let dr=-1; dr<=1; dr++) {
      for (let dc=-1; dc<=1; dc++) {
        if (dr===0 && dc===0) continue;
        const r = row + dr;
        const c = col + dc;
        if (r<0 || r>=5 || c<0 || c>=5) continue;
        const idx = r*5 + c;
        if (this.mines.has(idx)) count++;
      }
    }
    return count;
  }
  cascadeOpen(startCell) {
    const queue = this.getNeighbors(startCell.index);
    const visited = new Set();
    while (queue.length) {
      const cell = queue.shift();
      if (visited.has(cell.index)) continue;
      visited.add(cell.index);
      if (cell.isOpen || cell.isFlagged) continue;
      if (cell.isMine) {
        cell.openMine();
      } else {
        cell.open();
      }
      if (cell.adjacentMines === 0) {
        const neighbors = this.getNeighbors(cell.index);
        neighbors.forEach(n => {
          if (!visited.has(n.index)) queue.push(n);
        });
      }
    }
  }
  getNeighbors(index) {
    const row = Math.floor(index / 5);
    const col = index % 5;
    const neighbors = [];
    for (let dr=-1; dr<=1; dr++) {
      for (let dc=-1; dc<=1; dc++) {
        if (dr===0 && dc===0) continue;
        const r = row + dr;
        const c = col + dc;
        if (r<0 || r>=5 || c<0 || c>=5) continue;
        const idx = r*5 + c;
        neighbors.push(this.cells[idx]);
      }
    }
    return neighbors;
  }
  setEstado(text) {
    this.estadoElement.textContent = text;
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const game = new Game();
});
</script>
</body>
</html>
