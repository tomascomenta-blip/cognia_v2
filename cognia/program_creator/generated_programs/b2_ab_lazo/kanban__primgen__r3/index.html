<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en una página</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;background:#fafafa;}
  .container{display:flex;flex-wrap:wrap;gap:10px;padding:10px;}
  .col{background:#f5f5f5;border-radius:4px;padding:10px;flex:1;min-width:250px;display:flex;flex-direction:column;}
  .col h2{margin:0 0 10px;font-size:1.2em;color:#333;}
  .card{background:#fff;border:1px solid #ddd;border-radius:4px;padding:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .card span{flex:1;}
  .btns{display:flex;gap:4px;}
  button{width:24px;height:24px;border:none;border-radius:50%;background:#4CAF50;color:#fff;font-size:14px;cursor:pointer;}
  button:disabled{background:#bbb;}
  .counter{font-size:0.9em;color:#666;margin-top:auto;}
  @media (max-width:600px){.col{min-width:100%;}}
</style>
</head>
<body>
<div class="container">
  <div class="col" data-col="todo">
    <h2>Todo</h2>
    <div class="card" data-id="t1"><span>t1</span><div class="btns"><button class="menos">←</button><button class="mas">→</button></div></div>
    <div class="card" data-id="t2"><span>t2</span><div class="btns"><button class="menos">←</button><button class="mas">→</button></div></div>
    <div class="card" data-id="t3"><span>t3</span><div class="btns"><button class="menos">←</button><button class="mas">→</button></div></div>
    <div class="counter">Tarjetas: <span id="cont-todo"></span></div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing</h2>
    <div class="counter">Tarjetas: <span id="cont-doing"></span></div>
  </div>
  <div class="col" data-col="done">
    <h2>Done</h2>
    <div class="counter">Tarjetas: <span id="cont-done"></span></div>
  </div>
</div>
<script>
  function updateCounters(){
    document.querySelectorAll('.col[data-col]').forEach(col=>{
      const id=col.dataset.col;
      const count=col.querySelectorAll('.card').length;
      document.getElementById('cont-'+id).textContent=count;
    });
  }
  function moveCard(card, dir){
    const currentCol=card.parentElement;
    const currentId=currentCol.dataset.col;
    let targetId;
    if(dir==='mas'){
      if(currentId==='todo') targetId='doing';
      else if(currentId==='doing') targetId='done';
      else return; // done cannot move right
    }else if(dir==='menos'){
      if(currentId==='doing') targetId='todo';
      else if(currentId==='done') targetId='doing';
      else return; // todo cannot move left
    }
    const targetCol=document.querySelector('.col[data-col="'+targetId+'"]');
    if(targetId==='doing' && targetCol.querySelectorAll('.card').length>=2) return; // WIP limit
    targetCol.appendChild(card);
    updateCounters();
  }
  document.querySelectorAll('.mas').forEach(btn=>{
    btn.addEventListener('click',()=>moveCard(btn.parentElement.parentElement,'mas'));
  });
  document.querySelectorAll('.menos').forEach(btn=>{
    btn.addEventListener('click',()=>moveCard(btn.parentElement.parentElement,'menos'));
  });
  window.addEventListener('load',updateCounters);
</script>
</body>
</html>
