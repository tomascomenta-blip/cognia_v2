<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5 con 3 minas fijas</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    max-width:320px;
    margin:20px auto;
  }
  .c{
    aspect-ratio:1;
    background:#fff;
    border:1px solid #999;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#ddd;
    cursor:default;
  }
  .c.bandera{
    background:#ffeb3b;
  }
  .c.bandera::after{
    content:"🚩";
    font-size:1.5rem;
  }
  #estado{
    text-align:center;
    font-size:1.2rem;
    margin-top:10px;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>

<script>
class Minesweeper {
  constructor(gridEl, estadoEl, mines) {
    this.gridEl = gridEl;
    this.estadoEl = estadoEl;
    this.mines = new Set(mines);
    this.cells = [];
    this.gameOver = false;
    this.init();
  }
  init() {
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'c';
      cell.dataset.i = i;
      cell.addEventListener('click', () => this.handleClick(i));
      cell.addEventListener('contextmenu', (e) => this.handleRightClick(e, i));
      this.gridEl.appendChild(cell);
      this.cells.push(cell);
    }
  }
  handleClick(i) {
    if (this.gameOver) return;
    const cell = this.cells[i];
    if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    if (this.mines.has(i)) {
      cell.classList.add('abierta');
      cell.textContent = '💣';
      this.estadoEl.textContent = 'perdiste';
      this.gameOver = true;
      return;
    }
    const count = this.countAdjMines(i);
    cell.classList.add('abierta');
    if (count > 0) cell.textContent = count;
    if (count === 0) this.cascade(i);
  }
  handleRightClick(e, i) {
    e.preventDefault();
    if (this.gameOver) return;
    const cell = this.cells[i];
    if (cell.classList.contains('abierta')) return;
    if (cell.classList.contains('bandera')) {
      cell.classList.remove('bandera');
      cell.textContent = '';
    } else {
      cell.classList.add('bandera');
      cell.textContent = '';
    }
  }
  countAdjMines(i) {
    const row = Math.floor(i / 5);
    const col = i % 5;
    let count = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const r = row + dr;
        const c = col + dc;
        if (r < 0 || r > 4 || c < 0 || c > 4) continue;
        const idx = r * 5 + c;
        if (this.mines.has(idx)) count++;
      }
    }
    return count;
  }
  cascade(startIdx) {
    const queue = [startIdx];
    const visited = new Set();
    while (queue.length) {
      const idx = queue.shift();
      if (visited.has(idx)) continue;
      visited.add(idx);
      const cell = this.cells[idx];
      if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
      const count = this.countAdjMines(idx);
      cell.classList.add('abierta');
      if (count > 0) cell.textContent = count;
      if (count === 0) {
        const row = Math.floor(idx / 5);
        const col = idx % 5;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const r = row + dr;
            const c = col + dc;
            if (r < 0 || r > 4 || c < 0 || c > 4) continue;
            const nIdx = r * 5 + c;
            if (!visited.has(nIdx)) queue.push(nIdx);
          }
        }
      }
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const gridEl = document.getElementById('grid');
  const estadoEl = document.getElementById('estado');
  const mines = [6, 12, 18];
  new Minesweeper(gridEl, estadoEl, mines);
});
</script>
</body>
</html>
