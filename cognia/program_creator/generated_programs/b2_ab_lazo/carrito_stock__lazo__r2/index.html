<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito de Compra con Stock</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f9f9f9;color:#333;}
  .container{max-width:800px;margin:auto;padding:1rem;}
  h1{font-size:1.8rem;text-align:center;margin-bottom:1rem;}
  .products{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;}
  .prod{background:#fff;border:1px solid #ddd;border-radius:4px;padding:1rem;flex:1 1 calc(33% - 1rem);box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;}
  .prod .name{font-weight:bold;margin-bottom:.5rem;}
  .prod .price{color:#555;margin-bottom:.5rem;}
  .prod button{padding:.5rem 1rem;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .prod button:disabled{background:#aaa;cursor:not-allowed;}
  .cart{background:#fff;border:1px solid #ddd;border-radius:4px;padding:1rem;}
  .cart h2{margin-top:0;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
  .linea span{margin-right:.5rem;}
  .linea button{padding:.3rem .6rem;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .total{font-size:1.2rem;font-weight:bold;margin-top:1rem;text-align:right;}
  @media(max-width:600px){
    .prod{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Carrito de Compra con Stock</h1>
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="name">Producto 1</div>
      <div class="price">100 €</div>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="name">Producto 2</div>
      <div class="price">50 €</div>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="name">Producto 3</div>
      <div class="price">25 €</div>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>

  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">0 €</span></div>
  </div>
</div>

<script>
  // Configurables
  const LOCALE = 'es-ES';
  const CURRENCY = 'EUR';

  // State
  const cart = {}; // {id: quantity}
  const addButtons = document.querySelectorAll('.add');
  const cartLines = document.getElementById('cart-lines');
  const totalEl = document.getElementById('total');

  // Helper to format currency
  function fmt(value) {
    return value.toLocaleString(LOCALE, { style: 'currency', currency: CURRENCY });
  }

  // Update cart display
  function renderCart() {
    cartLines.innerHTML = '';
    let total = 0;
    for (const id in cart) {
      const qty = cart[id];
      const prodEl = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prodEl.dataset.precio);
      total += price * qty;

      const line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;

      const span = document.createElement('span');
      span.className = 'cant';
      span.textContent = `${qty} × ${fmt(price)}`;

      const btn = document.createElement('button');
      btn.className = 'quitar';
      btn.dataset.id = id;
      btn.textContent = 'Quitar';
      btn.addEventListener('click', () => removeFromCart(id));

      line.appendChild(span);
      line.appendChild(btn);
      cartLines.appendChild(line);
    }
    totalEl.textContent = fmt(total);
  }

  // Add product
  function addToCart(id) {
    const prodEl = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prodEl.dataset.stock, 10);
    const current = cart[id] || 0;
    if (current < stock) {
      cart[id] = current + 1;
      if (cart[id] === stock) {
        prodEl.querySelector('.add').disabled = true;
      }
      renderCart();
    }
  }

  // Remove product
  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    const prodEl = document.querySelector(`.prod[data-id="${id}"]`);
    if (cart[id] <= 0) {
      delete cart[id];
      prodEl.querySelector('.add').disabled = false;
    } else {
      prodEl.querySelector('.add').disabled = false;
    }
    renderCart();
  }

  // Attach listeners
  addButtons.forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });

  // Initial render
  renderCart();
</script>
</body>
</html>
