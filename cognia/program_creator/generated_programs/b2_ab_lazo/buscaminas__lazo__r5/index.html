<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5 con 3 minas fijas</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:300px;}
  .c{background:#ccc;border:1px solid #999;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;user-select:none;}
  .c.abierta{background:#fff;color:#000;}
  .c.bandera{color:#d00;}
  #estado{margin-top:15px;font-size:1.2rem;color:#d00;}
</style>
</head>
<body>
<h2>Buscaminas 5x5</h2>
<div id="grid"></div>
<div id="estado"></div>

<script>
(() => {
  const mines = [6,12,18];
  const size = 5;
  const grid = document.getElementById('grid');
  const estado = document.getElementById('estado');
  const cells = [];
  const counts = new Array(25).fill(0);
  let cambio = 0; // global variable for potential tests

  // Create cells
  for(let i=0;i<25;i++){
    const div = document.createElement('div');
    div.className='c';
    div.dataset.i = i;
    grid.appendChild(div);
    cells.push(div);
  }

  // Compute adjacent mine counts
  function getNeighbors(idx){
    const r = Math.floor(idx/size);
    const c = idx%size;
    const neigh = [];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<size && nc>=0 && nc<size){
          neigh.push(nr*size+nc);
        }
      }
    }
    return neigh;
  }

  for(let i=0;i<25;i++){
    const neigh = getNeighbors(i);
    let cnt=0;
    for(const n of neigh){
      if(mines.includes(n)) cnt++;
    }
    counts[i]=cnt;
  }

  // Left click: open cell
  function openCell(idx){
    const cell = cells[idx];
    if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    if(mines.includes(idx)){
      cell.classList.add('abierta');
      cell.textContent='💣';
      cell.style.color='red';
      estado.textContent='perdiste';
      return;
    }
    cascadeOpen(idx);
  }

  // Cascade opening for zero cells
  function cascadeOpen(startIdx){
    const queue=[startIdx];
    const visited=new Set();
    while(queue.length){
      const idx=queue.shift();
      if(visited.has(idx)) continue;
      visited.add(idx);
      const cell=cells[idx];
      if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
      cell.classList.add('abierta');
      const cnt=counts[idx];
      if(cnt>0){
        cell.textContent=cnt;
        cell.style.color='green';
        cambio = cnt;
      }else{
        cell.textContent='';
        const neigh=getNeighbors(idx);
        for(const n of neigh){
          if(!visited.has(n) && !cells[n].classList.contains('bandera') && !cells[n].classList.contains('abierta')){
            queue.push(n);
          }
        }
      }
    }
  }

  // Right click: toggle flag
  function toggleFlag(idx){
    const cell=cells[idx];
    if(cell.classList.contains('abierta')) return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }

  // Attach event listeners
  cells.forEach((cell,i)=>{
    cell.addEventListener('click',()=>openCell(i));
    cell.addEventListener('contextmenu',(e)=>{
      e.preventDefault();
      toggleFlag(i);
    });
  });
})();
</script>
</body>
</html>
