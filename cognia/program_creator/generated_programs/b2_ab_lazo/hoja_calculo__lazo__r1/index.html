<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;animation:fadeIn 2s ease-in-out;}
.celda{width:100%;padding:5px;font-size:1rem;box-sizing:border-box;background:#fff;border:1px solid #ccc;animation:pulse 3s infinite;}
.celda.clicked{background:#ff0;}
@keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
@keyframes pulse{0%{background:#fff;}50%{background:#e0e0e0;}100%{background:#fff;}}
</style>
</head>
<body>
<div class="grid">
<input class="celda" id="A1" data-ref="A1">
<input class="celda" id="A2" data-ref="A2">
<input class="celda" id="A3" data-ref="A3">
<input class="celda" id="B1" data-ref="B1">
<input class="celda" id="B2" data-ref="B2">
<input class="celda" id="B3" data-ref="B3">
<input class="celda" id="C1" data-ref="C1">
<input class="celda" id="C2" data-ref="C2">
<input class="celda" id="C3" data-ref="C3">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const map={};
cells.forEach(c=>{map[c.dataset.ref]=c;});

// Evaluate a cell formula recursively
function evalCell(ref,stack){
  const c=map[ref];
  if(!c)return 0;
  const f=c.dataset.formula;
  if(!f)return parseFloat(c.value)||0;
  if(stack.includes(ref))return 'CIRC';
  stack.push(ref);
  let hasCirc=false;
  let expr=f.slice(1).replace(/[A-C][1-3]/g,r=>{
    const v=evalCell(r,stack);
    if(v==='CIRC'){hasCirc=true; return '0';}
    return v;
  });
  if(hasCirc){stack.pop(); return 'CIRC';}
  try{
    const res=Function('return '+expr)();
    stack.pop();
    return isNaN(res)?0:res;
  }catch{
    stack.pop();
    return 0;
  }
}

// Recompute all formula cells and update colors
function recompute(){
  cells.forEach(c=>{
    if(c.dataset.formula){
      const val=evalCell(c.dataset.ref,[]);
      c.value=val==='CIRC'?'CIRC':val;
      // color based on value
      if(val==='CIRC'){
        c.style.color='red';
      }else{
        c.style.color=(parseFloat(val)>=0?'green':'red');
      }
    }
  });
}

// Input event: set or clear formula, then recompute
cells.forEach(c=>{
  c.addEventListener('input',e=>{
    const v=e.target.value;
    if(v.startsWith('=')){
      c.dataset.formula=v;
    }else{
      delete c.dataset.formula;
    }
    recompute();
  });
  // Click event: toggle visual feedback
  c.addEventListener('click',e=>{
    e.target.classList.toggle('clicked');
  });
});

// Initial animation: change background color of each cell over time
let hue=0;
setInterval(()=>{
  hue=(hue+1)%360;
  cells.forEach(c=>{
    c.style.backgroundColor=`hsl(${hue},50%,95%)`;
  });
},200);

// Periodically recompute to keep values up‑to‑date
setInterval(recompute,700);
</script>
</body>
</html>
