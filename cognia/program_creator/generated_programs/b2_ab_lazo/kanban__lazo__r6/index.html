<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en HTML</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  #board{display:flex;flex-wrap:wrap;justify-content:space-around;padding:10px;}
  .col{background:#fff;border:1px solid #ccc;border-radius:5px;width:30%;min-width:250px;margin:10px;padding:10px;box-sizing:border-box;}
  .col h2{font-size:1.2em;margin-top:0;}
  .card{background:#e9e9e9;border:1px solid #bbb;border-radius:3px;padding:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .card button{margin-left:4px;}
  .mas,.menos{background:#007bff;color:#fff;border:none;padding:4px 6px;border-radius:3px;cursor:pointer;}
  .menos{background:#6c757d;}
  .mas:disabled,.menos:disabled{background:#999;cursor:not-allowed;}
  @media (max-width:600px){.col{width:100%;}}
</style>
</head>
<body>
<div id="board">
  <div class="col" data-col="todo">
    <h2>Por hacer <span id="cont-todo"></span></h2>
    <div class="card" data-id="t1">
      <span>Tarea 1</span>
      <div>
        <button class="mas">→</button>
        <button class="menos">←</button>
      </div>
    </div>
    <div class="card" data-id="t2">
      <span>Tarea 2</span>
      <div>
        <button class="mas">→</button>
        <button class="menos">←</button>
      </div>
    </div>
    <div class="card" data-id="t3">
      <span>Tarea 3</span>
      <div>
        <button class="mas">→</button>
        <button class="menos">←</button>
      </div>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h2>En progreso <span id="cont-doing"></span></h2>
  </div>
  <div class="col" data-col="done">
    <h2>Hecho <span id="cont-done"></span></h2>
  </div>
</div>
<script>
const MAX_DOING = 2;
function updateCounters() {
  const cols = document.querySelectorAll('.col');
  cols.forEach(col => {
    const id = col.dataset.col;
    const count = col.querySelectorAll('.card').length;
    document.getElementById('cont-' + id).textContent = count;
  });
}
function moveCard(card, direction) {
  const currentCol = card.parentElement;
  const cols = document.querySelectorAll('.col');
  const currentIdx = Array.from(cols).indexOf(currentCol);
  let targetIdx = direction === 'right' ? currentIdx + 1 : currentIdx - 1;
  if (targetIdx < 0 || targetIdx >= cols.length) return;
  const targetCol = cols[targetIdx];
  if (targetCol.dataset.col === 'doing' && targetCol.querySelectorAll('.card').length >= MAX_DOING) return;
  targetCol.appendChild(card);
  updateCounters();
}
function init() {
  document.querySelectorAll('.mas').forEach(btn => {
    btn.addEventListener('click', () => moveCard(btn.closest('.card'), 'right'));
  });
  document.querySelectorAll('.menos').forEach(btn => {
    btn.addEventListener('click', () => moveCard(btn.closest('.card'), 'left'));
  });
  updateCounters();
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
