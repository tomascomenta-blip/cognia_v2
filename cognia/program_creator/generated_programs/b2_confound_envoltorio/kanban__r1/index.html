<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  .board{display:flex;justify-content:space-around;padding:20px;}
  .col{background:#fff;width:30%;min-height:400px;padding:10px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.1);position:relative;}
  .col h2{text-align:center;margin:0 0 10px;}
  .card{background:#e3f2fd;margin:5px 0;padding:10px;border-radius:3px;display:flex;justify-content:space-between;align-items:center;}
  .card button{margin-left:5px;}
  .counter{position:absolute;top:5px;right:5px;background:#2196f3;color:#fff;border-radius:12px;padding:2px 6px;font-size:12px;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .col,.card{animation:fadeIn 0.5s ease-in-out;}
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo" class="counter">0</span></h2>
    <div class="card" data-id="t1">
      <span>Task 1</span>
      <div>
        <button class="mas">→</button>
        <button class="menos">←</button>
      </div>
    </div>
    <div class="card" data-id="t2">
      <span>Task 2</span>
      <div>
        <button class="mas">→</button>
        <button class="menos">←</button>
      </div>
    </div>
    <div class="card" data-id="t3">
      <span>Task 3</span>
      <div>
        <button class="mas">→</button>
        <button class="menos">←</button>
      </div>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing <span id="cont-doing" class="counter">0</span></h2>
  </div>
  <div class="col" data-col="done">
    <h2>Done <span id="cont-done" class="counter">0</span></h2>
  </div>
</div>
<script>
  const cols = ['todo','doing','done'];
  function updateCounters(){
    cols.forEach(col=>{
      const count = document.querySelectorAll('.col[data-col="'+col+'"] .card').length;
      document.getElementById('cont-'+col).textContent = count;
    });
  }
  function moveCard(card, direction){
    const currentCol = card.parentElement.parentElement;
    const currentIdx = cols.indexOf(currentCol.dataset.col);
    let targetIdx = currentIdx + direction;
    if(targetIdx < 0 || targetIdx >= cols.length) return;
    if(cols[targetIdx]==='doing'){
      const doingCards = document.querySelectorAll('.col[data-col="doing"] .card');
      if(doingCards.length>=2) return;
    }
    const targetCol = document.querySelector('.col[data-col="'+cols[targetIdx]+'"]');
    targetCol.appendChild(card);
    updateCounters();
  }
  document.querySelectorAll('.mas').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const card = e.target.closest('.card');
      moveCard(card,1);
    });
  });
  document.querySelectorAll('.menos').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const card = e.target.closest('.card');
      moveCard(card,-1);
    });
  });
  updateCounters();
</script>
</body>
</html>
