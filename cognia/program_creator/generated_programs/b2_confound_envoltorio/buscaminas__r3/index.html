
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;margin:0;padding:20px;}
  #tablero{display:grid;grid-template-columns:repeat(5,60px);grid-gap:2px;width:310px;margin:auto;}
  .c{background:#bbb;border:1px solid #999;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
  .c.abierta{background:#ddd;cursor:default;}
  .c.bandera{background:#bbb;color:red;font-weight:bold;}
  #estado{margin-top:20px;text-align:center;font-size:20px;color:#900;}
</style>
</head>
<body>
<div id="tablero"></div>
<div id="estado"></div>

<script>
(() => {
  const minas = new Set([6,12,18]); // posiciones de minas
  const tablero = document.getElementById('tablero');
  const estado = document.getElementById('estado');
  const total = 25;
  const cells = [];

  // Crear las celdas
  for(let i=0;i<total;i++){
    const div = document.createElement('div');
    div.className='c';
    div.dataset.i = i;
    div.dataset.opened = 'false';
    div.dataset.flagged = 'false';
    tablero.appendChild(div);
    cells.push(div);
  }

  // Calcular minas adyacentes
  const adjCount = new Array(total).fill(0);
  for(let i=0;i<total;i++){
    if(minas.has(i)) continue;
    const r = Math.floor(i/5), c = i%5;
    let count=0;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr<0||nr>4||nc<0||nc>4) continue;
        const idx=nr*5+nc;
        if(minas.has(idx)) count++;
      }
    }
    adjCount[i]=count;
  }

  // Función para abrir una celda
  const abrir = (idx, cascade=true) => {
    const cell = cells[idx];
    if(cell.dataset.opened==='true' || cell.dataset.flagged==='true') return;
    cell.dataset.opened='true';
    cell.classList.add('abierta');
    const count = adjCount[idx];
    if(count>0) cell.textContent = count;
    if(minas.has(idx)){
      estado.textContent='perdiste';
      // opcional: revelar todas las minas
      minas.forEach(m=>{
        const mcell=cells[m];
        if(!mcell.classList.contains('abierta')){
          mcell.textContent='💣';
          mcell.classList.add('abierta');
        }
      });
      return;
    }
    if(count===0 && cascade){
      // abrir vecinos recursivamente
      const r=Math.floor(idx/5), c=idx%5;
      for(let dr=-1;dr<=1;dr++){
        for(let dc=-1;dc<=1;dc++){
          if(dr===0 && dc===0) continue;
          const nr=r+dr, nc=c+dc;
          if(nr<0||nr>4||nc<0||nc>4) continue;
          const nidx=nr*5+nc;
          if(!cells[nidx].dataset.opened==='true'){
            abrir(nidx,false);
          }
        }
      }
    }
  };

  // Eventos
  cells.forEach((cell,i)=>{
    cell.addEventListener('click',e=>{
      e.preventDefault();
      abrir(i);
    });
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(cell.dataset.opened==='true') return;
      const flagged = cell.dataset.flagged==='true';
      cell.dataset.flagged = flagged?'false':'true';
      cell.classList.toggle('bandera',!flagged);
    });
  });
})();
</script>
</body>
</html>
