
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,120px);
    grid-gap:5px;
  }
  .celda{
    width:100%;
    height:30px;
    padding:0 5px;
    box-sizing:border-box;
    font-size:14px;
    text-align:right;
    border:1px solid #999;
    border-radius:3px;
    background:#fff;
    animation:fadeIn 0.8s ease forwards;
    opacity:0;
  }
  .celda:nth-child(1){animation-delay:0.1s;}
  .celda:nth-child(2){animation-delay:0.2s;}
  .celda:nth-child(3){animation-delay:0.3s;}
  .celda:nth-child(4){animation-delay:0.4s;}
  .celda:nth-child(5){animation-delay:0.5s;}
  .celda:nth-child(6){animation-delay:0.6s;}
  .celda:nth-child(7){animation-delay:0.7s;}
  .celda:nth-child(8){animation-delay:0.8s;}
  .celda:nth-child(9){animation-delay:0.9s;}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1">
  <input type="text" class="celda" data-ref="A2">
  <input type="text" class="celda" data-ref="A3">
  <input type="text" class="celda" data-ref="B1">
  <input type="text" class="celda" data-ref="B2">
  <input type="text" class="celda" data-ref="B3">
  <input type="text" class="celda" data-ref="C1">
  <input type="text" class="celda" data-ref="C2">
  <input type="text" class="celda" data-ref="C3">
</div>

<script>
  // Obtener todas las celdas
  const celdas = Array.from(document.querySelectorAll('.celda'));

  // Al cargar, inicializar dataset.formula y recalcAll
  window.addEventListener('DOMContentLoaded', () => {
    celdas.forEach(cell => {
      cell.dataset.formula = cell.value; // inicialmente vacío
      cell.addEventListener('input', () => {
        cell.dataset.formula = cell.value; // guardar lo que escribe el usuario
        recalcAll();
      });
    });
    recalcAll(); // cálculo inicial
  });

  // Recalcular todas las celdas
  function recalcAll() {
    celdas.forEach(cell => {
      computeCell(cell, new Set());
    });
  }

  // Calcular el valor de una celda
  function computeCell(cell, visited) {
    if (visited.has(cell)) {
      cell.value = 'CIRC';
      return 'CIRC';
    }
    visited.add(cell);

    const formula = cell.dataset.formula || '';
    if (!formula.startsWith('=')) {
      cell.value = formula;
      return formula;
    }

    const expr = formula.slice(1);
    const result = evalExpr(expr, visited);
    cell.value = result;
    return result;
  }

  // Evaluar expresión de una fórmula
  function evalExpr(expr, visited) {
    expr = expr.replace(/\s+/g, ''); // quitar espacios
    const refs = expr.match(/[A-C][1-3]/g) || [];
    for (const ref of refs) {
      const refCell = document.querySelector(`input[data-ref="${ref}"]`);
      const val = computeCell(refCell, visited);
      if (val === 'CIRC') return 'CIRC';
      const num = parseFloat(val);
      const replaceVal = isNaN(num) ? 0 : num;
      expr = expr.replace(new RegExp(ref, 'g'), replaceVal);
    }
    if (expr === '') return '';
    try {
      const res = Function('return ' + expr)();
      return isNaN(res) ? '' : res.toString();
    } catch (e) {
      return '';
    }
  }
</script>
</body>
</html>
