
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:20px;
    background:#f0f0f0;
    animation:fadeIn 1.5s ease-out;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .products, .cart{
    background:#fff;
    padding:15px;
    margin-bottom:20px;
    border-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
  }
  .prod{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #eee;
    animation:slideIn 0.5s ease-out forwards;
    opacity:0;
  }
  .prod:last-child{border-bottom:none;}
  @keyframes slideIn{
    from{transform:translateX(-20px); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  .prod button{
    padding:5px 10px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:3px;
    cursor:pointer;
  }
  .prod button:disabled{
    background:#999;
    cursor:not-allowed;
  }
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid #eee;
  }
  .linea:last-child{border-bottom:none;}
  .linea button{
    padding:3px 6px;
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:3px;
    cursor:pointer;
  }
  .total{
    font-weight:bold;
    margin-top:10px;
  }
</style>
</head>
<body>
  <h1>Carrito de Compras</h1>

  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <span>Producto 1 - $100 - Stock: 2</span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <span>Producto 2 - $50 - Stock: 3</span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <span>Producto 3 - $25 - Stock: 1</span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>

  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div class="total">Total: $<span id="total">0</span></div>
  </div>

<script>
  // Cart data: {id: quantity}
  const cart = {};

  // Helper to get product element by id
  function getProdEl(id){ return document.querySelector(`.prod[data-id="${id}"]`); }

  // Update the cart display
  function updateCart(){
    const linesEl = document.getElementById('lines');
    linesEl.innerHTML = ''; // clear
    let total = 0;
    for(const id in cart){
      const qty = cart[id];
      const prodEl = getProdEl(id);
      const price = parseFloat(prodEl.dataset.precio);
      total += qty * price;

      const line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <span>${id} x ${qty}</span>
        <button class="quitar" data-id="${id}">Quitar</button>
      `;
      linesEl.appendChild(line);
    }
    document.getElementById('total').textContent = total.toFixed(2);
  }

  // Enable/disable add buttons based on stock
  function updateAddButtons(){
    document.querySelectorAll('.add').forEach(btn=>{
      const id = btn.dataset.id;
      const prodEl = getProdEl(id);
      const stock = parseInt(prodEl.dataset.stock,10);
      const qty = cart[id] || 0;
      btn.disabled = qty >= stock;
    });
  }

  // Add product to cart
  function addToCart(id){
    const prodEl = getProdEl(id);
    const stock = parseInt(prodEl.dataset.stock,10);
    const qty = cart[id] || 0;
    if(qty < stock){
      cart[id] = qty + 1;
      updateCart();
      updateAddButtons();
    }
  }

  // Remove one unit from cart
  function removeFromCart(id){
    const qty = cart[id] || 0;
    if(qty > 0){
      cart[id] = qty - 1;
      if(cart[id] === 0) delete cart[id];
      updateCart();
      updateAddButtons();
    }
  }

  // Event listeners
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>addToCart(btn.dataset.id));
  });

  document.getElementById('lines').addEventListener('click',e=>{
    if(e.target.classList.contains('quitar')){
      removeFromCart(e.target.dataset.id);
    }
  });

  // Initial update
  updateCart();
  updateAddButtons();
</script>
</body>
</html>
