
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en una sola página</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#e9ecef;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
  }
  .board{
    display:flex;
    gap:10px;
    width:100%;
    max-width:1200px;
  }
  .col{
    flex:1;
    background:#f8f9fa;
    border-radius:5px;
    padding:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    min-height:300px;
    animation:fadeInLeft .5s ease forwards;
  }
  .col:nth-child(1){animation-delay:0s;}
  .col:nth-child(2){animation-delay:.2s;}
  .col:nth-child(3){animation-delay:.4s;}
  h2{
    margin:0 0 10px;
    font-size:1.2rem;
    display:flex;
    align-items:center;
  }
  h2 span{
    margin-left:5px;
    font-weight:bold;
  }
  .card{
    background:#fff;
    padding:8px 10px;
    margin:5px 0;
    border-radius:4px;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
    animation:fadeIn .5s ease forwards;
  }
  .card:nth-child(1){animation-delay:.1s;}
  .card:nth-child(2){animation-delay:.2s;}
  .card:nth-child(3){animation-delay:.3s;}
  .btns{
    display:flex;
    gap:4px;
  }
  button{
    background:#007bff;
    color:#fff;
    border:none;
    border-radius:3px;
    padding:2px 5px;
    cursor:pointer;
    font-size:.8rem;
  }
  button.menos{background:#6c757d;}
  @keyframes fadeInLeft{
    from{opacity:0;transform:translateX(-20px);}
    to{opacity:1;transform:translateX(0);}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo"></span></h2>
    <div class="cards">
      <div class="card" data-id="t1">
        <span>t1</span>
        <div class="btns">
          <button class="mas">→</button>
          <button class="menos">←</button>
        </div>
      </div>
      <div class="card" data-id="t2">
        <span>t2</span>
        <div class="btns">
          <button class="mas">→</button>
          <button class="menos">←</button>
        </div>
      </div>
      <div class="card" data-id="t3">
        <span>t3</span>
        <div class="btns">
          <button class="mas">→</button>
          <button class="menos">←</button>
        </div>
      </div>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing <span id="cont-doing"></span></h2>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="done">
    <h2>Done <span id="cont-done"></span></h2>
    <div class="cards"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const updateCounters = () => {
    document.querySelectorAll('.col').forEach(col => {
      const id = col.dataset.col;
      const count = col.querySelectorAll('.card').length;
      document.getElementById(`cont-${id}`).textContent = count;
    });
  };

  const moveCard = (card, dir) => {
    const cols = Array.from(document.querySelectorAll('.col'));
    const currentCol = card.closest('.col');
    const currentIndex = cols.indexOf(currentCol);
    let targetIndex = dir === 'mas' ? currentIndex + 1 : currentIndex - 1;

    if (targetIndex < 0 || targetIndex >= cols.length) return; // out of bounds

    const targetCol = cols[targetIndex];
    // WIP rule: doing column (index 1) can hold max 2 cards
    if (targetCol.dataset.col === 'doing' && targetCol.querySelectorAll('.card').length >= 2) {
      return;
    }

    targetCol.appendChild(card);
    updateCounters();
  };

  // Delegated click handling
  document.body.addEventListener('click', e => {
    if (e.target.classList.contains('mas') || e.target.classList.contains('menos')) {
      const card = e.target.closest('.card');
      if (!card) return;
      const dir = e.target.classList.contains('mas') ? 'mas' : 'menos';
      moveCard(card, dir);
    }
  });

  updateCounters();
});
</script>
</body>
</html>
