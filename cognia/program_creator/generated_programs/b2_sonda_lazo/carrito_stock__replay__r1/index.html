
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
:root{
  --bg:#f0f4f7;
  --accent:#4a90e2;
  --text:#333;
  --gray:#888;
  --shadow:rgba(0,0,0,0.1);
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  display:flex;
  flex-wrap:wrap;
  padding:20px;
}
.products,.cart{
  flex:1 1 300px;
  box-sizing:border-box;
  padding:20px;
  background:white;
  margin:10px;
  box-shadow:0 2px 5px var(--shadow);
  border-radius:8px;
}
.products h2,.cart h2{
  margin-top:0;
}
.prod{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:20px;
}
.prod svg{
  width:80px;
  height:80px;
  margin-bottom:10px;
}
.prod .name{
  font-weight:bold;
  margin-bottom:5px;
}
.prod .price{
  color:var(--accent);
  margin-bottom:5px;
}
.prod .stock{
  font-size:0.9em;
  color:var(--gray);
  margin-bottom:10px;
}
.prod .add{
  padding:5px 10px;
  background:var(--accent);
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.prod .add:disabled{
  background:var(--gray);
  cursor:not-allowed;
}
.linea{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.linea .cant{
  font-weight:bold;
  margin:0 10px;
}
.linea .quitar{
  padding:3px 6px;
  background:#d9534f;
  color:white;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
#total{
  font-weight:bold;
  font-size:1.2em;
  margin-top:10px;
  display:block;
}
@media (max-width:600px){
  .container{flex-direction:column;}
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <svg><rect width="80" height="80" fill="#c0c0c0"/></svg>
      <div class="name">Producto 1</div>
      <div class="price">100 €</div>
      <div class="stock">Stock: 2</div>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <svg><rect width="80" height="80" fill="#c0c0c0"/></svg>
      <div class="name">Producto 2</div>
      <div class="price">50 €</div>
      <div class="stock">Stock: 3</div>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <svg><rect width="80" height="80" fill="#c0c0c0"/></svg>
      <div class="name">Producto 3</div>
      <div class="price">25 €</div>
      <div class="stock">Stock: 1</div>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <span id="total">0 €</span>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const products = document.querySelectorAll('.prod');
  const cartLines = document.getElementById('cart-lines');
  const totalEl = document.getElementById('total');
  const cart = {}; // id -> quantity

  function formatCurrency(value) {
    return value.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  function updateTotal() {
    let sum = 0;
    for (const id in cart) {
      const qty = cart[id];
      const price = parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
      sum += qty * price;
    }
    totalEl.textContent = formatCurrency(sum);
  }

  function updateAddButton(id) {
    const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
    const addBtn = prodDiv.querySelector('.add');
    const stock = parseInt(prodDiv.dataset.stock,10);
    const qty = cart[id] || 0;
    addBtn.disabled = qty >= stock;
  }

  function addToCart(id) {
    const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prodDiv.dataset.stock,10);
    const qty = cart[id] || 0;
    if (qty >= stock) return;
    cart[id] = qty + 1;
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if (!line) {
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      const nameSpan = document.createElement('span');
      nameSpan.textContent = prodDiv.querySelector('.name').textContent;
      const cantSpan = document.createElement('span');
      cantSpan.className = 'cant';
      cantSpan.textContent = cart[id];
      const quitarBtn = document.createElement('button');
      quitarBtn.className = 'quitar';
      quitarBtn.dataset.id = id;
      quitarBtn.textContent = 'Quitar';
      quitarBtn.addEventListener('click', () => removeFromCart(id));
      line.appendChild(nameSpan);
      line.appendChild(cantSpan);
      line.appendChild(quitarBtn);
      cartLines.appendChild(line);
    } else {
      const cantSpan = line.querySelector('.cant');
      cantSpan.textContent = cart[id];
    }
    updateAddButton(id);
    updateTotal();
  }

  function removeFromCart(id) {
    const qty = cart[id] || 0;
    if (qty <= 0) return;
    cart[id] = qty - 1;
    if (cart[id] === 0) {
      const line = document.querySelector(`.linea[data-id="${id}"]`);
      if (line) line.remove();
      delete cart[id];
    } else {
      const line = document.querySelector(`.linea[data-id="${id}"]`);
      if (line) {
        const cantSpan = line.querySelector('.cant');
        cantSpan.textContent = cart[id];
      }
    }
    updateAddButton(id);
    updateTotal();
  }

  products.forEach(prod => {
    const addBtn = prod.querySelector('.add');
    addBtn.addEventListener('click', () => addToCart(addBtn.dataset.id));
  });
});
</script>
</body>
</html>
