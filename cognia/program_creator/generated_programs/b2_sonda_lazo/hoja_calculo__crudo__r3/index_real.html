<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;margin:0;padding:20px;}
  table{border-collapse:collapse;margin:auto;animation:fadeIn 1s ease-out;}
  td{padding:2px;}
  .celda{
    width:80px;height:30px;text-align:center;font-size:14px;
    border:1px solid #999;border-radius:4px;
    animation:pulse 2s ease-in-out;
  }
  @keyframes pulse{
    0%{background:#fff;}
    50%{background:#e0f7fa;}
    100%{background:#fff;}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
</style>
</head>
<body>
<table>
  <tr>
    <td><input type="text" class="celda" data-ref="A1"></td>
    <td><input type="text" class="celda" data-ref="A2"></td>
    <td><input type="text" class="celda" data-ref="A3"></td>
  </tr>
  <tr>
    <td><input type="text" class="celda" data-ref="B1"></td>
    <td><input type="text" class="celda" data-ref="B2"></td>
    <td><input type="text" class="celda" data-ref="B3"></td>
  </tr>
  <tr>
    <td><input type="text" class="celda" data-ref="C1"></td>
    <td><input type="text" class="celda" data-ref="C2"></td>
    <td><input type="text" class="celda" data-ref="C3"></td>
  </tr>
</table>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  // Evaluate all cells whenever any cell changes
  cells.forEach(c => c.addEventListener('input', evaluateAll));

  function evaluateAll() {
    cells.forEach(c => evaluateCell(c, new Set()));
  }

  function evaluateCell(cell, stack) {
    const ref = cell.dataset.ref;
    if (stack.has(ref)) {
      cell.value = 'CIRC';
      return 'CIRC';
    }
    const val = cell.value;
    if (!val.startsWith('=')) {
      return val;
    }
    stack.add(ref);
    const formula = val.slice(1);
    const refs = [...formula.matchAll(/[A-C][1-3]/g)].map(m => m[0]);

    // Evaluate referenced cells
    for (const r of refs) {
      const depCell = refMap[r];
      const depVal = evaluateCell(depCell, stack);
      if (depVal === 'CIRC') {
        stack.delete(ref);
        cell.value = 'CIRC';
        return 'CIRC';
      }
    }

    // Replace references with their current values
    const replaced = formula.replace(/[A-C][1-3]/g, r => refMap[r].value);
    let result;
    try {
      // Only + and - are allowed, so eval is safe here
      result = Function('return ' + replaced)();
    } catch (e) {
      result = 'CIRC';
    }

    stack.delete(ref);
    cell.value = result;
    return result;
  }
});
</script>
</body>
</html>
