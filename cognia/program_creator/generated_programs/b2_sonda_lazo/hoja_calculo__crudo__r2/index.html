
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  table{
    border-collapse:collapse;
    background:#fff;
    box-shadow:0 0 10px rgba(0,0,0,.1);
  }
  td{
    padding:0;
  }
  input{
    width:80px;
    height:30px;
    font-size:16px;
    text-align:right;
    border:1px solid #ccc;
    box-sizing:border-box;
    outline:none;
    transition:background .2s;
  }
  input:focus{
    background:#e0f7ff;
  }
  /* Animación de entrada */
  @keyframes slideIn{
    from{transform:translateX(-20px); opacity:0;}
    to{transform:translateX(0); opacity:1;}
  }
  .celda{
    animation:slideIn .4s ease-out forwards;
  }
</style>
</head>
<body>
<table>
  <tr>
    <td><input type="text" class="celda" data-ref="A1" value=""></td>
    <td><input type="text" class="celda" data-ref="A2" value=""></td>
    <td><input type="text" class="celda" data-ref="A3" value=""></td>
  </tr>
  <tr>
    <td><input type="text" class="celda" data-ref="B1" value=""></td>
    <td><input type="text" class="celda" data-ref="B2" value=""></td>
    <td><input type="text" class="celda" data-ref="B3" value=""></td>
  </tr>
  <tr>
    <td><input type="text" class="celda" data-ref="C1" value=""></td>
    <td><input type="text" class="celda" data-ref="C2" value=""></td>
    <td><input type="text" class="celda" data-ref="C3" value=""></td>
  </tr>
</table>

<script>
(() => {
  const cells = document.querySelectorAll('.celda');
  const cellsByRef = {};

  // Map de referencia a elemento
  cells.forEach(cell => {
    const ref = cell.dataset.ref;
    cellsByRef[ref] = cell;
    // Guardar fórmula si existe
    if (cell.value.startsWith('=')) {
      cell.dataset.formula = cell.value;
    } else {
      cell.dataset.formula = '';
    }
  });

  // Función recursiva de cálculo
  function computeCell(ref, visited = new Set()) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const cell = cellsByRef[ref];
    const formula = cell.dataset.formula;
    if (!formula) {
      const val = parseFloat(cell.value);
      visited.delete(ref);
      return isNaN(val) ? 0 : val;
    }
    const expr = formula.slice(1); // quitar '='
    const refs = expr.match(/[A-C][1-3]/g) || [];
    let exprEval = expr;
    for (const r of refs) {
      const val = computeCell(r, visited);
      if (val === 'CIRC') {
        visited.delete(ref);
        return 'CIRC';
      }
      exprEval = exprEval.replaceAll(r, val);
    }
    let result;
    try {
      result = eval(exprEval);
    } catch (e) {
      visited.delete(ref);
      return 'CIRC';
    }
    visited.delete(ref);
    return result;
  }

  // Recalcular todas las celdas
  function recomputeAll() {
    const computed = {};
    // Primero calculamos todas
    for (const ref in cellsByRef) {
      computed[ref] = computeCell(ref);
    }
    // Luego actualizamos los valores mostrados
    for (const ref in cellsByRef) {
      const cell = cellsByRef[ref];
      if (cell.dataset.formula) {
        cell.value = computed[ref] === 'CIRC' ? 'CIRC' : computed[ref];
      } else {
        // Mantener el valor que el usuario escribió
        // (no se cambia)
      }
    }
  }

  // Evento de cambio en cualquier celda
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      const val = cell.value;
      if (val.startsWith('=')) {
        cell.dataset.formula = val;
      } else {
        cell.dataset.formula = '';
      }
      recomputeAll();
    });
  });

  // Cálculo inicial
  recomputeAll();
})();
</script>
</body>
</html>
