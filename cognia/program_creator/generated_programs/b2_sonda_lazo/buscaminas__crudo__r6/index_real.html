<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:sans-serif;
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:20px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,60px);
    grid-gap:2px;
  }
  .c{
    width:60px;height:60px;
    background:#bbb;
    border:1px solid #999;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    position:relative;
  }
  .c.abierta{background:#ddd;cursor:default;}
  .c.bandera{background:#f99;}
  #estado{margin-top:10px;font-size:18px;font-weight:bold;}
  @keyframes fadeIn{0%{transform:scale(0);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .c{
    animation:fadeIn 0.5s ease forwards;
    animation-delay:calc(0.05s * var(--i));
  }
</style>
</head>
<body>
<div id="grid">
  <!-- 25 celdas -->
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>
<script>
  const mines = new Set([6,12,18]);          // posiciones de las minas
  const cells = Array.from(document.querySelectorAll('.c'));
  const opened = new Set();                  // celdas ya abiertas
  const flags  = new Set();                  // celdas con bandera
  const estado = document.getElementById('estado');

  // devuelve los índices de las 8 vecinas
  function getNeighbors(i){
    const neigh=[];
    const r=Math.floor(i/5), c=i%5;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<5 && nc>=0 && nc<5){
          neigh.push(nr*5+nc);
        }
      }
    }
    return neigh;
  }

  // cuenta minas adyacentes
  function countAdj(i){
    return getNeighbors(i).filter(n=>mines.has(n)).length;
  }

  // abre una celda (con cascada si es 0)
  function openCell(i){
    if(opened.has(i) || flags.has(i)) return;
    const cell=cells[i];
    opened.add(i);
    cell.classList.add('abierta');
    const cnt=countAdj(i);
    if(cnt>0){
      cell.textContent=cnt;
      return;
    }
    // cascada de celdas con 0
    const queue=[i];
    const visited=new Set([i]);
    while(queue.length){
      const cur=queue.shift();
      const neigh=getNeighbors(cur);
      neigh.forEach(n=>{
        if(opened.has(n) || flags.has(n)) return;
        const cellN=cells[n];
        opened.add(n);
        cellN.classList.add('abierta');
        const cntN=countAdj(n);
        if(cntN>0){
          cellN.textContent=cntN;
        }else{
          if(!visited.has(n)){
            visited.add(n);
            queue.push(n);
          }
        }
      });
    }
  }

  // inicializa estilos y eventos
  cells.forEach(cell=>{
    const i=parseInt(cell.dataset.i);
    cell.style.setProperty('--i',i);
    cell.addEventListener('click',e=>{
      if(flags.has(i)) return;          // no se puede abrir una con bandera
      if(mines.has(i)){
        estado.textContent='perdiste';
        cell.classList.add('abierta');
        cell.textContent='*';
        return;
      }
      openCell(i);
    });
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(opened.has(i)) return;         // no se puede poner bandera en abierta
      if(flags.has(i)){
        flags.delete(i);
        cell.classList.remove('bandera');
      }else{
        flags.add(i);
        cell.classList.add('bandera');
      }
    });
  });
</script>
</body>
</html>
