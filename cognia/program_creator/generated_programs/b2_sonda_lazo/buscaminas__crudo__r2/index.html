
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Minesweeper 5x5</title>
<style>
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,50px);
    gap:2px;
    margin-top:20px;
  }
  .c{
    width:50px;
    height:50px;
    background:#ddd;
    border:1px solid #999;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
    cursor:pointer;
    user-select:none;
    opacity:0;
    animation:fadeIn 0.5s ease forwards;
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera{
    background:#d9534f;
    color:#fff;
  }
  #estado{
    margin-top:20px;
    min-height:30px;
    font-size:20px;
    color:#d9534f;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:scale(0.8);}
    to{opacity:1;transform:scale(1);}
  }
</style>
</head>
<body>
<div id="grid">
  <!-- 25 cells -->
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const mines = [6,12,18];
  const cells = document.querySelectorAll('.c');
  const estado = document.getElementById('estado');

  // Precompute adjacent mine counts
  const counts = {};
  cells.forEach(cell => {
    const i = parseInt(cell.dataset.i);
    if (mines.includes(i)) {
      counts[i] = -1; // mine
    } else {
      let cnt = 0;
      for (let di=-1; di<=1; di++) {
        for (let dj=-1; dj<=1; dj++) {
          if (di===0 && dj===0) continue;
          const ni = i + di*5 + dj;
          if (mines.includes(ni)) cnt++;
        }
      }
      counts[i] = cnt;
    }
  });

  // Set animation delay for each cell
  cells.forEach(cell => {
    const i = parseInt(cell.dataset.i);
    cell.style.animationDelay = `${i*0.05}s`;
  });

  function openCell(cell) {
    const i = parseInt(cell.dataset.i);
    if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    cell.classList.add('abierta');
    const cnt = counts[i];
    if (cnt > 0) {
      cell.textContent = cnt;
    } else if (cnt === 0) {
      // Cascade opening
      const queue = [cell];
      while (queue.length) {
        const cur = queue.shift();
        const idx = parseInt(cur.dataset.i);
        for (let di=-1; di<=1; di++) {
          for (let dj=-1; dj<=1; dj++) {
            if (di===0 && dj===0) continue;
            const ni = idx + di*5 + dj;
            if (ni < 0 || ni >= 25) continue;
            const neigh = document.querySelector(`.c[data-i="${ni}"]`);
            if (!neigh.classList.contains('abierta') && !neigh.classList.contains('bandera')) {
              neigh.classList.add('abierta');
              const ncnt = counts[ni];
              if (ncnt > 0) {
                neigh.textContent = ncnt;
              } else {
                queue.push(neigh);
              }
            }
          }
        }
      }
    }
    if (cnt === -1) {
      estado.textContent = 'perdiste';
      // Reveal all mines
      mines.forEach(m => {
        const mineCell = document.querySelector(`.c[data-i="${m}"]`);
        mineCell.textContent = '💣';
        mineCell.classList.add('abierta');
      });
    }
  }

  cells.forEach(cell => {
    cell.addEventListener('click', () => openCell(cell));
    cell.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (cell.classList.contains('abierta')) return;
      cell.classList.toggle('bandera');
      cell.textContent = cell.classList.contains('bandera') ? '🚩' : '';
    });
  });
});
</script>
</body>
</html>
