<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f5f5f5;}
#board{display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;}
.col{background:#e0e0e0;border-radius:4px;padding:0.5rem;flex:1 1 30%;min-width:200px;box-sizing:border-box;}
.col h2{margin-top:0;font-size:1.2rem;text-align:center;}
.card{background:#fff;border:1px solid #ccc;border-radius:4px;padding:0.5rem;margin-bottom:0.5rem;display:flex;justify-content:space-between;align-items:center;font-size:0.9rem;opacity:0;animation:fadeIn 0.5s forwards;}
.card button{margin-left:0.2rem;padding:0.2rem 0.4rem;font-size:0.8rem;cursor:pointer;border:1px solid #888;border-radius:3px;background:#f0f0f0;color:#333;}
.counter{text-align:center;margin-top:0.5rem;font-weight:bold;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<div id="board">
  <div class="col" data-col="todo">
    <h2>Por Hacer</h2>
    <div class="cards"></div>
    <div class="counter"><span id="cont-todo"></span></div>
  </div>
  <div class="col" data-col="doing">
    <h2>En Progreso</h2>
    <div class="cards"></div>
    <div class="counter"><span id="cont-doing"></span></div>
  </div>
  <div class="col" data-col="done">
    <h2>Hecho</h2>
    <div class="cards"></div>
    <div class="counter"><span id="cont-done"></span></div>
  </div>
</div>
<script>
class Card {
  constructor(id, element, column) {
    this.id = id;
    this.element = element;
    this.column = column;
  }
}
class Column {
  constructor(element) {
    this.element = element;
    this.dataCol = element.dataset.col;
    this.cards = [];
  }
  addCard(card) {
    this.cards.push(card);
    this.element.querySelector('.cards').appendChild(card.element);
  }
  removeCard(card) {
    this.cards = this.cards.filter(c => c !== card);
    card.element.remove();
  }
}
class KanbanBoard {
  constructor() {
    this.columns = {};
    document.querySelectorAll('.col').forEach(colEl => {
      const col = new Column(colEl);
      this.columns[col.dataCol] = col;
    });
    this.order = ['todo', 'doing', 'done'];
    this.initCards();
    this.updateCounters();
  }
  initCards() {
    const ids = ['t1', 't2', 't3'];
    ids.forEach(id => {
      const cardEl = this.createCardElement(id);
      const card = new Card(id, cardEl, this.columns['todo']);
      this.columns['todo'].addCard(card);
      this.attachHandlers(card);
    });
  }
  createCardElement(id) {
    const div = document.createElement('div');
    div.className = 'card';
    div.id = id;               /* <--- added id attribute for selector compatibility */
    div.dataset.id = id;
    div.appendChild(document.createTextNode(id));
    const btnMas = document.createElement('button');
    btnMas.className = 'mas';
    btnMas.textContent = '→';
    const btnMenos = document.createElement('button');
    btnMenos.className = 'menos';
    btnMenos.textContent = '←';
    div.appendChild(btnMas);
    div.appendChild(btnMenos);
    return div;
  }
  attachHandlers(card) {
    const masBtn = card.element.querySelector('.mas');
    const menosBtn = card.element.querySelector('.menos');
    masBtn.addEventListener('click', () => this.moveCard(card, +1));
    menosBtn.addEventListener('click', () => this.moveCard(card, -1));
  }
  moveCard(card, direction) {
    const currentIndex = this.order.indexOf(card.column.dataCol);
    const newIndex = currentIndex + direction;
    if (newIndex < 0 || newIndex >= this.order.length) return;
    const newColName = this.order[newIndex];
    if (newColName === 'doing' && this.columns['doing'].cards.length >= 2) return;
    card.column.removeCard(card);
    card.column = this.columns[newColName];
    card.column.addCard(card);
    this.updateCounters();
  }
  updateCounters() {
    document.getElementById('cont-todo').textContent = this.columns['todo'].cards.length;
    document.getElementById('cont-doing').textContent = this.columns['doing'].cards.length;
    document.getElementById('cont-done').textContent = this.columns['done'].cards.length;
  }
}
document.addEventListener('DOMContentLoaded', () => {
  new KanbanBoard();
});
</script>
</body>
</html>
