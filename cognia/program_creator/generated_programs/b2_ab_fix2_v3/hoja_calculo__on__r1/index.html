<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:0;padding:1rem;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;animation:pulse 5s infinite;}
.celda{width:100%;box-sizing:border-box;padding:.5rem;font-size:1rem;}
@keyframes pulse{
  0%{background-color:#fff;}
  50%{background-color:#f0f0f0;}
  100%{background-color:#fff;}
}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" value="1">
<input class="celda" data-ref="A2" value="2">
<input class="celda" data-ref="A3" value="3">
<input class="celda" data-ref="B1" value="=A1+A2">
<input class="celda" data-ref="B2" value="=A1+B1-A2">
<input class="celda" data-ref="B3" value="5">
<input class="celda" data-ref="C1" value="=B1+1">
<input class="celda" data-ref="C2" value="=C1+1">
<input class="celda" data-ref="C3" value="=C2+1">
</div>
<script>
const cells=document.querySelectorAll('.celda'),map={};
cells.forEach(c=>map[c.dataset.ref]=c);
function evalCell(ref,stack){if(stack.includes(ref))return'CIRC';const el=map[ref];if(!el)return'0';if(!el.value.startsWith('='))return el.value;const expr=el.value.slice(1).replace(/[A-C][1-3]/g,r=>`(${evalCell(r,stack.concat(ref))})`);if(expr.includes('CIRC'))return'CIRC';try{const v=eval(expr);return isNaN(v)?'':v;}catch{return'';}}
function recompute(){cells.forEach(c=>{if(c.value.startsWith('=')){const newVal=evalCell(c.dataset.ref,[]);const prev=c.dataset.prev;let cambio=0;if(prev!==undefined && newVal!=='CIRC' && newVal!==''){cambio=parseFloat(newVal)-parseFloat(prev);}c.value=newVal;c.dataset.prev=newVal;if(newVal!=='CIRC' && newVal!==''){c.style.color=(cambio>=0?'green':'red');}else{c.style.color='';}}else{c.style.color='';}});}
cells.forEach(c=>c.addEventListener('input',recompute));
recompute();
</script>
</body>
</html>
