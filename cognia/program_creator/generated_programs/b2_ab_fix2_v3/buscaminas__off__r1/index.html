<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:400px;margin:auto;}
  .c{background:#bbb;border:1px solid #999;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none;}
  .c.abierta{background:#e0e0e0;cursor:default;}
  .c.bandera{background:#ffeb3b;}
  #estado{margin-top:20px;text-align:center;font-size:1.2rem;}
  /* Animación sencilla para que la página cambie por sí sola al cargar */
  @keyframes pulse {
    0%   {background-color:#bbb;}
    50%  {background-color:#ddd;}
    100% {background-color:#bbb;}
  }
  .c:not(.abierta):not(.bandera){animation:pulse 2s infinite;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const GRID_SIZE = 5;
const MINE_INDICES = [6, 12, 18];
const grid = document.getElementById('grid');
const estado = document.getElementById('estado');

function createGrid() {
  for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'c';
    cell.dataset.i = i;
    cell.dataset.mine = MINE_INDICES.includes(i) ? '1' : '0';
    cell.addEventListener('click', onCellClick);
    cell.addEventListener('contextmenu', onCellRightClick);
    grid.appendChild(cell);
  }
}

function onCellClick(e) {
  const cell = e.currentTarget;
  if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
  if (cell.dataset.mine === '1') {
    cell.classList.add('abierta');
    cell.textContent = '💣';
    estado.textContent = 'perdiste';
    estado.style.color = 'red';
    return;
  }
  openCell(cell);
}

function onCellRightClick(e) {
  e.preventDefault();
  const cell = e.currentTarget;
  if (cell.classList.contains('abierta')) return;
  if (cell.classList.contains('bandera')) {
    cell.classList.remove('bandera');
    cell.textContent = '';
  } else {
    cell.classList.add('bandera');
    cell.textContent = '🚩';
  }
}

function openCell(cell) {
  if (cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
  const i = parseInt(cell.dataset.i);
  const count = countAdjacentMines(i);
  cell.classList.add('abierta');
  if (count > 0) {
    cell.textContent = count;
    cell.style.color = 'green';
  } else {
    cell.textContent = '';
    const queue = [cell];
    while (queue.length) {
      const current = queue.shift();
      const idx = parseInt(current.dataset.i);
      const neighbors = getNeighbors(idx);
      neighbors.forEach(n => {
        if (n.classList.contains('abierta') || n.classList.contains('bandera') || n.dataset.mine === '1') return;
        const cnt = countAdjacentMines(parseInt(n.dataset.i));
        n.classList.add('abierta');
        if (cnt > 0) {
          n.textContent = cnt;
          n.style.color = 'green';
        } else {
          n.textContent = '';
          queue.push(n);
        }
      });
    }
  }
}

function countAdjacentMines(i) {
  const neighbors = getNeighbors(i);
  let cnt = 0;
  neighbors.forEach(n => { if (n.dataset.mine === '1') cnt++; });
  return cnt;
}

function getNeighbors(i) {
  const neighbors = [];
  const row = Math.floor(i / GRID_SIZE);
  const col = i % GRID_SIZE;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const r = row + dr;
      const c = col + dc;
      if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
        const idx = r * GRID_SIZE + c;
        neighbors.push(grid.children[idx]);
      }
    }
  }
  return neighbors;
}

createGrid();
</script>
</body>
</html>
