<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{font-family:sans-serif;margin:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  input.celda{width:100%;padding:5px;font-size:1rem;border:1px solid #ccc;}
  input.celda.selected{border:2px solid #00f;}
</style>
</head>
<body>
<h1>Mini hoja de cálculo 3x3</h1>
<div class="grid">
  <input class="celda" type="text" data-ref="A1" value="">
  <input class="celda" type="text" data-ref="A2" value="">
  <input class="celda" type="text" data-ref="A3" value="">
  <input class="celda" type="text" data-ref="B1" value="">
  <input class="celda" type="text" data-ref="B2" value="">
  <input class="celda" type="text" data-ref="B3" value="">
  <input class="celda" type="text" data-ref="C1" value="">
  <input class="celda" type="text" data-ref="C2" value="">
  <input class="celda" type="text" data-ref="C3" value="">
</div>
<script>
const cells = {};
document.querySelectorAll('.celda').forEach(el=>{
  const ref = el.dataset.ref;
  cells[ref] = el;
  // inicializar valor previo
  el.dataset.prev = '';
});
let isUpdating = false;
function evaluateCell(ref, stack){
  if(stack.has(ref)) {
    const el = cells[ref];
    el.value = 'CIRC';
    el.style.color = 'red';
    el.dataset.prev = 'CIRC';
    return 'CIRC';
  }
  const el = cells[ref];
  const val = el.value;
  if(val === 'CIRC') return 'CIRC';
  if(val.startsWith('=')){
    stack.add(ref);
    const expr = val.slice(1);
    const tokens = expr.match(/([A-C][1-3])|(\d+)|([+-])/g);
    let result = 0;
    let op = '+';
    for(const token of tokens){
      if(token==='+'||token==='-'){
        op=token;
      }else if(/^[A-C][1-3]$/.test(token)){
        const depVal = evaluateCell(token, new Set(stack));
        if(depVal==='CIRC'){
          stack.delete(ref);
          const elCur = cells[ref];
          elCur.value = 'CIRC';
          elCur.style.color = 'red';
          elCur.dataset.prev = 'CIRC';
          return 'CIRC';
        }
        const num = Number(depVal);
        if(isNaN(num)){
          stack.delete(ref);
          const elCur = cells[ref];
          elCur.value = 'CIRC';
          elCur.style.color = 'red';
          elCur.dataset.prev = 'CIRC';
          return 'CIRC';
        }
        result = op==='+'? result+num : result-num;
      }else{
        const num = Number(token);
        result = op==='+'? result+num : result-num;
      }
    }
    stack.delete(ref);
    const prev = el.dataset.prev;
    const prevNum = prev!==undefined? Number(prev) : NaN;
    const cambio = !isNaN(prevNum) ? result - prevNum : 0;
    el.value = result.toString();
    el.style.color = (cambio >= 0 ? 'green' : 'red');
    el.dataset.prev = result.toString();
    return result.toString();
  }else{
    const prev = el.dataset.prev;
    const prevNum = prev!==undefined? Number(prev) : NaN;
    const valNum = Number(val);
    const cambio = !isNaN(prevNum) && !isNaN(valNum) ? valNum - prevNum : 0;
    el.style.color = (cambio >= 0 ? 'green' : 'red');
    el.dataset.prev = val;
    return val;
  }
}
function evaluateAll(){
  isUpdating = true;
  Object.keys(cells).forEach(ref=>{
    evaluateCell(ref, new Set());
  });
  isUpdating = false;
}
document.querySelectorAll('.celda').forEach(el=>{
  el.addEventListener('input',()=>{
    if(isUpdating) return;
    evaluateAll();
  });
  el.addEventListener('click',()=>{
    el.focus();
    document.querySelectorAll('.celda').forEach(e=>e.classList.remove('selected'));
    el.classList.add('selected');
    if(!isUpdating){
      evaluateAll();
    }
  });
});
evaluateAll();
</script>
</body>
</html>
