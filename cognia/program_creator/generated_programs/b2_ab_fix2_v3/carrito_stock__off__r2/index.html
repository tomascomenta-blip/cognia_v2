<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;min-height:100vh;background:#f9f9f9;}
  .container{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;max-width:900px;width:100%;padding:20px;}
  .prod{border:1px solid #ccc;padding:10px;width:200px;box-sizing:border-box;text-align:center;background:#fff;opacity:0;transform:translateY(20px);animation:fadeInUp 0.5s ease forwards;}
  .prod:nth-child(1){animation-delay:0s;}
  .prod:nth-child(2){animation-delay:0.1s;}
  .prod:nth-child(3){animation-delay:0.2s;}
  .prod h3{margin:0 0 10px;}
  .prod p{margin:5px 0;}
  button{padding:5px 10px;margin-top:5px;cursor:pointer;}
  button:disabled{background:#ddd;color:#999;cursor:not-allowed;}
  #cart{border:1px solid #000;padding:10px;width:100%;max-width:400px;background:#fff;margin-top:20px;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .linea span{margin-right:10px;}
  #total{font-weight:bold;font-size:1.2em;}
  @keyframes fadeInUp{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<h1>Carrito con Stock</h1>
<div class="container">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <h3>Producto 1</h3>
    <p>Precio: 100 €</p>
    <p>Stock: 2</p>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <h3>Producto 2</h3>
    <p>Precio: 50 €</p>
    <p>Stock: 3</p>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <h3>Producto 3</h3>
    <p>Precio: 25 €</p>
    <p>Stock: 1</p>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: <span id="total">0,00 €</span></div>

<script>
const cart = {}; // {id: quantity}
let prevCart = {}; // previous quantities
let prevTotal = 0; // previous total

function updateCartDisplay() {
  const cartDiv = document.getElementById('cart');
  cartDiv.innerHTML = '';
  let total = 0;
  for (const id in cart) {
    const qty = cart[id];
    const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
    const price = parseFloat(prodDiv.dataset.precio);
    total += qty * price;

    const line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;

    const cantSpan = document.createElement('span');
    cantSpan.className = 'cant';
    cantSpan.textContent = qty;
    // color based on change
    const prevQty = prevCart[id] || 0;
    const change = qty - prevQty;
    cantSpan.style.color = (change >= 0 ? 'green' : 'red');

    const quitarBtn = document.createElement('button');
    quitarBtn.className = 'quitar';
    quitarBtn.dataset.id = id;
    quitarBtn.textContent = 'Quitar';

    line.appendChild(cantSpan);
    line.appendChild(quitarBtn);
    cartDiv.appendChild(line);
  }
  const totalSpan = document.getElementById('total');
  totalSpan.textContent =
    total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  const changeTotal = total - prevTotal;
  totalSpan.style.color = (changeTotal >= 0 ? 'green' : 'red');

  // update previous state
  prevCart = {...cart};
  prevTotal = total;
}

function addToCart(id) {
  const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
  const stock = parseInt(prodDiv.dataset.stock, 10);
  const currentQty = cart[id] || 0;
  if (currentQty < stock) {
    cart[id] = currentQty + 1;
    updateCartDisplay();
  }
}

function removeFromCart(id) {
  if (!cart[id]) return;
  cart[id] -= 1;
  if (cart[id] <= 0) {
    delete cart[id];
    const addBtn = document.querySelector(`.add[data-id="${id}"]`);
    addBtn.disabled = false;
  }
  updateCartDisplay();
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });
  document.addEventListener('click', e => {
    if (e.target.matches('.quitar')) {
      removeFromCart(e.target.dataset.id);
    }
  });
});
</script>
</body>
</html>
