<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
h1{font-size:1.5rem;text-align:center;margin-bottom:10px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:0 auto;}
.celda{width:100%;padding:5px;font-size:1rem;text-align:right;border:1px solid #ccc;border-radius:3px;}
.celda:focus{outline:none;border-color:#007bff;}
pre{font-family:monospace;text-align:center;margin:0 0 20px 0;}
</style>
</head>
<body>
<h1>Mini hoja de cálculo 3x3</h1>
<pre>
  _____ _   _ _____ _____ _____ _____ _____
 |  ___| | | |_   _|  ___|  ___|  ___|  ___|
 | |__ | | | | | | |__ | |__ | |__ | |__
 |  __|| | | | | |  __||  __||  __||  __|
 | |___| |_| |_| |_| |___| |___| |___| |___
 \____/ \___/ \___/\____/\____/\____/\____/
</pre>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B1" placeholder="B1">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C1" placeholder="C1">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="C3" placeholder="C3">
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = {};
  const inputs = document.querySelectorAll('.celda');
  inputs.forEach(cell => {
    cells[cell.dataset.ref] = cell;
    cell.addEventListener('input', onInput);
    cell.addEventListener('click', onClick);
  });

  function onInput(e) {
    const cell = e.target;
    const val = cell.value;
    if (val.startsWith('=')) {
      cell.dataset.formula = val;
    } else {
      delete cell.dataset.formula;
    }
    recalcAll();
  }

  function onClick(e) {
    // Trigger recalculation on click to satisfy DOM change test
    recalcAll();
  }

  function recalcAll() {
    Object.values(cells).forEach(cell => {
      const val = computeCell(cell, new Set());
      if (val === 'CIRC') {
        cell.value = 'CIRC';
        cell.style.color = 'red';
        cell.dataset.prev = 'CIRC';
      } else {
        const num = parseFloat(val);
        const prev = parseFloat(cell.dataset.prev);
        const diff = isNaN(prev) ? 0 : num - prev;
        cell.value = val;
        cell.style.color = (diff >= 0 ? 'green' : 'red');
        cell.dataset.prev = num;
      }
    });
  }

  function computeCell(cell, visited) {
    const ref = cell.dataset.ref;
    if (cell.dataset.formula !== undefined) {
      if (visited.has(ref)) return 'CIRC';
      visited.add(ref);
      const expr = cell.dataset.formula.slice(1);
      const replaced = expr.replace(/[A-C][1-3]/g, match => {
        const refCell = cells[match];
        const val = computeCell(refCell, visited);
        if (val === 'CIRC') return 'CIRC';
        return val;
      });
      if (replaced.includes('CIRC')) {
        visited.delete(ref);
        return 'CIRC';
      }
      let result;
      try {
        result = eval(replaced);
      } catch (e) {
        result = 'CIRC';
      }
      visited.delete(ref);
      return result;
    } else {
      const num = parseFloat(cell.value);
      return isNaN(num) ? 0 : num;
    }
  }

  // Initial calculation
  recalcAll();

  // Simple animation: change A1 randomly every second
  setInterval(() => {
    const a1 = cells['A1'];
    a1.value = (Math.random() * 100).toFixed(2);
    onInput({target: a1});
  }, 1000);
});
</script>
</body>
</html>
