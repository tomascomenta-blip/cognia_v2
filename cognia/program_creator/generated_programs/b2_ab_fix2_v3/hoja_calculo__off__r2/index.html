<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:8px;font-size:1rem;box-sizing:border-box;}
  @keyframes pulse{
    0%{background-color:#f0f0f0;}
    50%{background-color:#e0e0e0;}
    100%{background-color:#f0f0f0;}
  }
  .celda.animate{animation:pulse 2s infinite;}
</style>
</head>
<body>
<div class="grid">
  <input id="A1" class="celda" data-ref="A1" value="1">
  <input id="A2" class="celda" data-ref="A2" value="2">
  <input id="A3" class="celda" data-ref="A3" value="3">
  <input id="B1" class="celda" data-ref="B1" value="4">
  <input id="B2" class="celda" data-ref="B2" value="5">
  <input id="B3" class="celda" data-ref="B3" value="6">
  <input id="C1" class="celda" data-ref="C1" value="7">
  <input id="C2" class="celda" data-ref="C2" value="8">
  <input id="C3" class="celda" data-ref="C3" value="=A1+A2+B1">
</div>
<script>
const rawContent = {};
const computedValues = {};
const cells = document.querySelectorAll('.celda');

// Inicializar contenido y listeners
cells.forEach(cell=>{
  const ref = cell.dataset.ref;
  rawContent[ref] = cell.value;
  const update = ()=>{
    rawContent[ref] = cell.value;
    recomputeAll();
  };
  cell.addEventListener('input', update);
  cell.addEventListener('change', update);
});

function recomputeAll(){
  Object.keys(rawContent).forEach(ref=>{
    const cell = document.querySelector(`.celda[data-ref="${ref}"]`);
    let newVal;
    if(rawContent[ref].startsWith('=')){
      newVal = evaluateCell(ref,new Set());
    }else{
      newVal = rawContent[ref];
    }
    const oldVal = computedValues[ref];
    const newNum = parseFloat(newVal);
    const oldNum = parseFloat(oldVal);
    let diff = null;
    if(!isNaN(newNum) && !isNaN(oldNum)){
      diff = newNum - oldNum;
    }
    cell.value = newVal;
    if(diff !== null){
      cell.style.color = diff >= 0 ? 'green' : 'red';
    }else{
      cell.style.color = '';
    }
    computedValues[ref] = newVal;
  });
}

function evaluateCell(ref,visited){
  if(visited.has(ref)) return 'CIRC';
  visited.add(ref);
  const raw = rawContent[ref];
  if(raw.startsWith('=')){
    let expr = raw.slice(1);
    expr = expr.replace(/[A-C][1-3]/g,match=>{
      const val = evaluateCell(match,visited);
      if(val==='CIRC') return 'CIRC';
      return val;
    });
    if(expr.includes('CIRC')){
      visited.delete(ref);
      return 'CIRC';
    }
    try{
      const result = new Function('return '+expr)();
      visited.delete(ref);
      return result.toString();
    }catch(e){
      visited.delete(ref);
      return 'CIRC';
    }
  }else{
    visited.delete(ref);
    return raw;
  }
}

// Primer cálculo y animación
recomputeAll();
cells.forEach(cell=>cell.classList.add('animate'));
</script>
</body>
</html>
