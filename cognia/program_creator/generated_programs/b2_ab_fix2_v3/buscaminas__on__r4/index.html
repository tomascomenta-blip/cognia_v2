<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5 con minas fijas</title>
<style>
  body{font-family:sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:20px;width:90%;max-width:400px;}
  .c{background:#ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;position:relative;min-height:60px;}
  .c.abierta{background:#eee;cursor:default;}
  .c.bandera{background:#fdd;}
  .c.abierta.bandera{background:#fdd;}
  #estado{margin-top:10px;font-size:1.2em;color:#900;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
class Cell {
  constructor(i, element, game) {
    this.i = i;
    this.element = element;
    this.game = game;
    this.isMine = game.mines.has(i);
    this.adjacent = 0;
    this.opened = false;
    this.flagged = false;
    this.element.dataset.i = i;
    this.element.classList.add('c');
    this.element.addEventListener('click', (e)=>this.onClick(e));
    this.element.addEventListener('contextmenu', (e)=>this.onRightClick(e));
  }
  onClick(e){
    if(this.flagged || this.opened) return;
    if(this.isMine){
      this.opened = true;
      this.element.classList.add('abierta');
      this.element.textContent = '💣';
      this.game.setEstado('perdiste');
      this.game.revealAllMines();
      return;
    }
    this.open();
    if(this.adjacent===0){
      this.game.cascadeOpen(this);
    }
  }
  onRightClick(e){
    e.preventDefault();
    if(this.opened) return;
    this.flagged = !this.flagged;
    if(this.flagged){
      this.element.classList.add('bandera');
      this.element.textContent = '🚩';
    } else {
      this.element.classList.remove('bandera');
      this.element.textContent = '';
    }
  }
  open(){
    if(this.opened) return;
    this.opened = true;
    this.element.classList.add('abierta');
    if(this.adjacent>0){
      this.element.textContent = this.adjacent;
    }
  }
}
class Game {
  constructor(){
    this.grid = document.getElementById('grid');
    this.estado = document.getElementById('estado');
    this.cells = [];
    this.mines = new Set([6,12,18]); // minas fijas
    this.init();
  }
  init(){
    for(let i=0;i<25;i++){
      const div=document.createElement('div');
      this.grid.appendChild(div);
      const cell=new Cell(i,div,this);
      this.cells.push(cell);
    }
    this.calculateAdjacents();
  }
  calculateAdjacents(){
    for(const cell of this.cells){
      if(cell.isMine) continue;
      let count=0;
      for(const n of this.neighbors(cell.i)){
        if(this.mines.has(n)) count++;
      }
      cell.adjacent=count;
    }
  }
  neighbors(i){
    const row=Math.floor(i/5);
    const col=i%5;
    const neigh=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const r=row+dr;
        const c=col+dc;
        if(r>=0 && r<5 && c>=0 && c<5){
          neigh.push(r*5+c);
        }
      }
    }
    return neigh;
  }
  cascadeOpen(startCell){
    const queue=[startCell];
    const visited=new Set();
    while(queue.length){
      const cell=queue.shift();
      for(const n of this.neighbors(cell.i)){
        const neighbor=this.cells[n];
        if(neighbor.opened || neighbor.flagged) continue;
        neighbor.open();
        if(neighbor.adjacent===0){
          if(!visited.has(n)){
            visited.add(n);
            queue.push(neighbor);
          }
        }
      }
    }
  }
  setEstado(msg){
    this.estado.textContent=msg;
  }
  revealAllMines(){
    for(const cell of this.cells){
      if(cell.isMine && !cell.opened){
        cell.element.textContent='💣';
        cell.element.classList.add('abierta');
      }
    }
  }
}
document.addEventListener('DOMContentLoaded',()=>{new Game();});
</script>
</body>
</html>
