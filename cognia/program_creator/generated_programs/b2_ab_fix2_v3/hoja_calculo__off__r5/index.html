<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:sans-serif;margin:0;padding:1rem;background:#f9f9f9;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;}
  .celda{
    width:100%;padding:0.5rem;font-size:1rem;text-align:right;
    animation:pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%{background:#fff;}
    50%{background:#e0f7fa;}
    100%{background:#fff;}
  }
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" value="10">
  <input class="celda" data-ref="A2" value="20">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="=A1+A2">
</div>
<script>
(function(){
  const cells=document.querySelectorAll('.celda');
  const cellMap={};
  cells.forEach(c=>{cellMap[c.dataset.ref]=c;});
  // Initialize formulas from initial values
  cells.forEach(c=>{
    if(c.value.startsWith('=')){
      c.dataset.formula=c.value;
    }
  });
  function getCellValue(ref, stack=[]) {
    const cell=cellMap[ref];
    if(!cell)return 0;
    if(cell.dataset.formula){
      if(stack.includes(ref)) return 'CIRC';
      const val=evalFormula(cell.dataset.formula, [...stack, ref]);
      return val;
    }
    const val=parseFloat(cell.value);
    return isNaN(val)?0:val;
  }
  function evalFormula(formula, stack){
    let expr=formula.slice(1);
    let hasCirc=false;
    expr=expr.replace(/[A-C][1-3]/g,match=>{
      const val=getCellValue(match, stack);
      if(val==='CIRC'){hasCirc=true; return '0';}
      return typeof val==='number'?val:'0';
    });
    if(hasCirc)return 'CIRC';
    try{
      const res=eval(expr);
      return isNaN(res)?0:res;
    }catch(e){return 0;}
  }
  function recalc(){
    cells.forEach(c=>{
      const oldVal = c.dataset.value;
      let newVal;
      if(c.dataset.formula){
        const val=evalFormula(c.dataset.formula, [c.dataset.ref]);
        newVal = (val==='CIRC')?'CIRC':val;
        c.value = newVal;
        c.setAttribute('value', newVal);
      }else{
        const val=parseFloat(c.value);
        newVal = isNaN(val)?'' : val;
        c.value = newVal;
        c.setAttribute('value', newVal);
      }
      // Update dataset.value
      c.dataset.value = newVal;
      // Color change logic
      let change = 0;
      const oldNum = (typeof oldVal==='number')?oldVal:parseFloat(oldVal);
      const newNum = (typeof newVal==='number')?newVal:parseFloat(newVal);
      if(!isNaN(oldNum) && !isNaN(newNum)){
        change = newNum - oldNum;
      } else if(newVal==='CIRC'){
        change = -Infinity;
      } else {
        change = 0;
      }
      if(change===-Infinity){
        c.style.color='red';
      }else{
        c.style.color = (change>=0)?'green':'red';
      }
    });
  }
  cells.forEach(c=>{
    c.addEventListener('input',e=>{
      const val=e.target.value;
      if(val.startsWith('=')){
        c.dataset.formula=val;
      }else{
        delete c.dataset.formula;
      }
      recalc();
    });
  });
  recalc();
})();
</script>
</body>
</html>
