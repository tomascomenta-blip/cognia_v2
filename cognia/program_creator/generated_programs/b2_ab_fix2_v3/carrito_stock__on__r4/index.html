<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f9f9f9;}
  .container{display:flex;flex-wrap:wrap;padding:20px;}
  .products,.cart{flex:1 1 300px;box-sizing:border-box;padding:10px;}
  .products{background:#e3f2fd;}
  .cart{background:#fff3e0;}
  .prod{background:#fff;border:1px solid #ddd;border-radius:5px;padding:10px;margin-bottom:10px;}
  .prod h3{margin:0 0 5px;}
  .prod p{margin:5px 0;}
  .prod button{padding:5px 10px;background:#1976d2;color:#fff;border:none;border-radius:3px;cursor:pointer;}
  .prod button:disabled{background:#90caf9;cursor:default;}
  .linea{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #ddd;border-radius:5px;padding:5px 10px;margin-bottom:5px;}
  .linea .cant{font-weight:bold;}
  .linea button{padding:3px 6px;background:#d32f2f;color:#fff;border:none;border-radius:3px;cursor:pointer;}
  .linea button:disabled{background:#ef9a9a;cursor:default;}
  #total{font-weight:bold;}
  @media (max-width:600px){.container{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p>Precio: 100</p>
      <p>Stock: 2</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p>Precio: 50</p>
      <p>Stock: 3</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p>Precio: 25</p>
      <p>Stock: 1</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <p>Total: <span id="total">0</span></p>
  </div>
</div>
<script>
const cart = {};

function updateTotal() {
  let total = 0;
  for (const id in cart) {
    const qty = cart[id];
    const precio = parseInt(document.querySelector('.prod[data-id="'+id+'"]').dataset.precio);
    total += qty * precio;
  }
  document.getElementById('total').textContent = total;
}

function updateLine(id, qty) {
  let line = document.querySelector('.linea[data-id="'+id+'"]');
  if (!line) {
    line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;
    const span = document.createElement('span');
    span.className = 'cant';
    span.textContent = qty;
    const btn = document.createElement('button');
    btn.className = 'quitar';
    btn.dataset.id = id;
    btn.textContent = 'Quitar';
    btn.addEventListener('click', () => removeProduct(id));
    line.appendChild(span);
    line.appendChild(btn);
    document.getElementById('cart-lines').appendChild(line);
  } else {
    line.querySelector('.cant').textContent = qty;
  }
}

function removeProduct(id) {
  const qty = cart[id];
  if (!qty) return;
  const prodDiv = document.querySelector('.prod[data-id="'+id+'"]');
  const stock = parseInt(prodDiv.dataset.stock);
  if (qty <= 1) {
    cart[id] = 0;
    updateLine(id, 0);
    enableAddButton(id);
  } else {
    cart[id] = qty - 1;
    updateLine(id, cart[id]);
    if (cart[id] < stock) enableAddButton(id);
  }
  updateTotal();
}

function addProduct(id) {
  const prodDiv = document.querySelector('.prod[data-id="'+id+'"]');
  const stock = parseInt(prodDiv.dataset.stock);
  const precio = parseInt(prodDiv.dataset.precio);
  const qty = cart[id] || 0;
  if (qty < stock) {
    cart[id] = qty + 1;
    updateLine(id, cart[id]);
    if (cart[id] === stock) disableAddButton(id);
    updateTotal();
  }
}

function disableAddButton(id) {
  const btn = document.querySelector('.add[data-id="'+id+'"]');
  if (btn) btn.disabled = true;
}

function enableAddButton(id) {
  const btn = document.querySelector('.add[data-id="'+id+'"]');
  if (btn) btn.disabled = false;
}

document.querySelectorAll('.add').forEach(btn => {
  btn.addEventListener('click', () => addProduct(btn.dataset.id));
});

/* Automatic animation on page load */
window.addEventListener('load', () => {
  const autoAdd = setInterval(() => {
    const btn = document.querySelector('.add[data-id="p1"]');
    if (btn && !btn.disabled) {
      btn.click();
    } else {
      clearInterval(autoAdd);
    }
  }, 1000);
});
</script>
</body>
</html>
