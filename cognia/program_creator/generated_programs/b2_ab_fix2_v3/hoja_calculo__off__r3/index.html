<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:monospace;margin:0;padding:1em;background:#f0f0f0;}
  header{text-align:center;margin-bottom:1em;}
  table{border-collapse:collapse;width:100%;max-width:400px;margin:auto;}
  td{border:1px solid #999;padding:0;}
  input.celda{width:100%;height:2em;border:none;padding:0 0.5em;box-sizing:border-box;font-size:1em;}
  input.celda:focus{outline:2px solid #0066cc;}
  @keyframes pulse {
    0%   {background-color:#e0e0e0;}
    50%  {background-color:#c0c0c0;}
    100% {background-color:#e0e0e0;}
  }
  header pre{animation:pulse 2s infinite;}
</style>
</head>
<body>
<header>
<pre>
   _____   _____   _____
  |     | |     | |     |
  |  A  | |  B  | |  C  |
  |_____| |_____| |_____|
</pre>
</header>
<table>
  <tr>
    <td><input class="celda" data-ref="A1" id="A1"></td>
    <td><input class="celda" data-ref="A2" id="A2"></td>
    <td><input class="celda" data-ref="A3" id="A3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1" id="B1"></td>
    <td><input class="celda" data-ref="B2" id="B2"></td>
    <td><input class="celda" data-ref="B3" id="B3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1" id="C1"></td>
    <td><input class="celda" data-ref="C2" id="C2"></td>
    <td><input class="celda" data-ref="C3" id="C3"></td>
  </tr>
</table>
<script>
(() => {
  const cells = {}; // ref -> input element
  const formulas = {}; // ref -> formula string or null
  const dependents = {}; // ref -> Set of refs that depend on this ref

  // Initialize
  document.querySelectorAll('input.celda').forEach(input => {
    const ref = input.dataset.ref;
    cells[ref] = input;
    formulas[ref] = null;
    dependents[ref] = new Set();
    input.addEventListener('input', onInput);
    input.addEventListener('click', onClick);
  });

  function onInput(e) {
    const input = e.target;
    const ref = input.dataset.ref;
    const val = input.value;
    if (val.startsWith('=')) {
      formulas[ref] = val;
    } else {
      formulas[ref] = null;
    }
    updateDependencies();
    recomputeCell(ref);
    recomputeDependents(ref);
  }

  function onClick(e) {
    const input = e.target;
    const ref = input.dataset.ref;
    recomputeCell(ref);
  }

  function updateDependencies() {
    // Clear all dependents
    Object.keys(dependents).forEach(r => dependents[r].clear());
    // For each cell with formula, add dependencies
    Object.keys(formulas).forEach(ref => {
      const formula = formulas[ref];
      if (formula) {
        const refs = formula.match(/[A-C][1-3]/g) || [];
        refs.forEach(dep => {
          if (dependents[dep]) dependents[dep].add(ref);
        });
      }
    });
  }

  function recomputeDependents(ref) {
    dependents[ref].forEach(dep => {
      recomputeCell(dep);
      recomputeDependents(dep);
    });
  }

  function recomputeCell(ref) {
    const formula = formulas[ref];
    const input = cells[ref];
    if (!formula) {
      // No formula: set color based on current numeric value
      const num = parseNumber(input.value);
      input.style.color = (num >= 0 ? 'green' : 'red');
      return;
    }
    const result = evaluateFormula(formula, ref, []);
    if (result === 'CIRC') {
      input.value = 'CIRC';
      input.style.color = 'red';
    } else {
      input.value = formatNumber(result);
      input.style.color = (result >= 0 ? 'green' : 'red');
    }
  }

  function evaluateFormula(formula, currentRef, stack) {
    if (stack.includes(currentRef)) return 'CIRC';
    stack.push(currentRef);
    const expr = formula.slice(1); // remove '='
    const tokens = expr.match(/[A-C][1-3]|\d+(\.\d+)?|[+-]/g) || [];
    let idx = 0;
    let currentVal = null;
    let currentOp = '+';
    while (idx < tokens.length) {
      const token = tokens[idx];
      if (/^[A-C][1-3]$/.test(token)) {
        const val = evaluateCell(token, stack);
        if (val === 'CIRC') { stack.pop(); return 'CIRC'; }
        if (currentVal === null) {
          currentVal = val;
        } else {
          currentVal = applyOp(currentVal, currentOp, val);
        }
      } else if (/^\d+(\.\d+)?$/.test(token)) {
        const num = parseNumber(token);
        if (currentVal === null) {
          currentVal = num;
        } else {
          currentVal = applyOp(currentVal, currentOp, num);
        }
      } else if (token === '+' || token === '-') {
        currentOp = token;
      }
      idx++;
    }
    stack.pop();
    return currentVal === null ? 0 : currentVal;
  }

  function evaluateCell(ref, stack) {
    const formula = formulas[ref];
    if (formula) {
      return evaluateFormula(formula, ref, stack);
    } else {
      const valStr = cells[ref].value;
      if (valStr === 'CIRC') return 'CIRC';
      const num = parseNumber(valStr);
      return isNaN(num) ? 0 : num;
    }
  }

  function applyOp(a, op, b) {
    return op === '+' ? a + b : a - b;
  }

  function parseNumber(str) {
    const cleaned = str.replace(/,/g, '');
    const num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
  }

  function formatNumber(num) {
    return num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  // Initial update
  updateDependencies();
  Object.keys(cells).forEach(recomputeCell);
})();
</script>
</body>
</html>
