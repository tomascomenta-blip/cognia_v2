<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;background:#f0f0f0;margin:0;height:100vh;display:flex;align-items:center;justify-content:center;}
.grid{display:grid;grid-template-columns:repeat(3,80px);grid-gap:5px;}
.celda{width:80px;height:30px;text-align:right;padding:2px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#333;}
.celda:focus{outline:none;border-color:#888;}
.celda:hover{background:#fafafa;}
@keyframes fadeIn{0%{transform:scale(0.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
.celda{animation:fadeIn 0.5s ease forwards;}
.celda:nth-child(1){animation-delay:0.1s;}
.celda:nth-child(2){animation-delay:0.2s;}
.celda:nth-child(3){animation-delay:0.3s;}
.celda:nth-child(4){animation-delay:0.4s;}
.celda:nth-child(5){animation-delay:0.5s;}
.celda:nth-child(6){animation-delay:0.6s;}
.celda:nth-child(7){animation-delay:0.7s;}
.celda:nth-child(8){animation-delay:0.8s;}
.celda:nth-child(9){animation-delay:0.9s;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" value="">
<input class="celda" data-ref="A2" value="">
<input class="celda" data-ref="A3" value="">
<input class="celda" data-ref="B1" value="">
<input class="celda" data-ref="B2" value="">
<input class="celda" data-ref="B3" value="">
<input class="celda" data-ref="C1" value="">
<input class="celda" data-ref="C2" value="">
<input class="celda" data-ref="C3" value="">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const cellMap={};
cells.forEach(c=>{cellMap[c.dataset.ref]=c;});
function compute(ref,stack=[]) {
  const cell=cellMap[ref];
  const formula=cell.dataset.formula;
  if(!formula)return cell.value;
  if(stack.includes(ref)){cell.value='CIRC';return 'CIRC';}
  stack.push(ref);
  const expr=formula.slice(1).replace(/[A-C][1-3]/g,r=>{
    const v=compute(r,stack.slice());
    if(v==='CIRC'){cell.value='CIRC';return '0';}
    const num=Number(v)||0;
    return num;
  });
  try{const res=eval(expr);cell.value=res;return res;}
  catch{cell.value='CIRC';return 'CIRC';}
}
function recalc(){
  cells.forEach(c=>{
    if(c.value.trim().startsWith('=')){
      c.dataset.formula=c.value.trim();
    }else{
      delete c.dataset.formula;
    }
    const prev=parseFloat(c.dataset.prev)||0;
    const val=compute(c.dataset.ref,[]);
    const num=Number(val)||0;
    const cambio=num-prev;
    c.style.color=(cambio>=0?'green':'red');
    c.dataset.prev=num;
  });
}
cells.forEach(c=>c.addEventListener('input',e=>{recalc();}));
recalc();
setInterval(recalc,50);
</script>
</body>
</html>
