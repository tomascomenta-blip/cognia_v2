<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en una sola página</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#333;
  }
  .container{
    display:flex;
    flex-direction:row;
    gap:1rem;
    padding:1rem;
    max-width:1200px;
    margin:auto;
  }
  .col{
    flex:1;
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
    padding:0.5rem;
    display:flex;
    flex-direction:column;
    min-width:200px;
  }
  .col-header{
    font-weight:bold;
    margin-bottom:0.5rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .card{
    background:#e0f7fa;
    border-radius:6px;
    padding:0.5rem;
    margin-bottom:0.5rem;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .card-content{
    font-size:0.9rem;
  }
  .btns{
    position:absolute;
    bottom:0.2rem;
    right:0.2rem;
    display:flex;
    gap:0.2rem;
  }
  .btns button{
    background:none;
    border:none;
    color:#00695c;
    font-size:0.8rem;
    cursor:pointer;
    padding:0.2rem;
    border-radius:4px;
    transition:background .2s;
  }
  .btns button:hover{
    background:rgba(0,105,92,.1);
  }
  @media (max-width:600px){
    .container{
      flex-direction:column;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="col" data-col="todo">
    <div class="col-header">Todo <span id="cont-todo"></span></div>
  </div>
  <div class="col" data-col="doing">
    <div class="col-header">Doing <span id="cont-doing"></span></div>
  </div>
  <div class="col" data-col="done">
    <div class="col-header">Done <span id="cont-done"></span></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const todoCol = document.querySelector('.col[data-col="todo"]');
  const doingCol = document.querySelector('.col[data-col="doing"]');
  const doneCol = document.querySelector('.col[data-col="done"]');

  // Create initial cards
  ['t1','t2','t3'].forEach(id=>{
    const card = document.createElement('div');
    card.className='card';
    card.dataset.id=id;
    card.innerHTML = `
      <div class="card-content">${id}</div>
      <div class="btns">
        <button class="menos" title="Mover a la izquierda">←</button>
        <button class="mas" title="Mover a la derecha">→</button>
      </div>
    `;
    todoCol.appendChild(card);
  });

  function updateCounters(){
    document.getElementById('cont-todo').textContent = todoCol.querySelectorAll('.card').length;
    document.getElementById('cont-doing').textContent = doingCol.querySelectorAll('.card').length;
    document.getElementById('cont-done').textContent = doneCol.querySelectorAll('.card').length;
  }

  updateCounters();

  // Event delegation for buttons
  document.body.addEventListener('click', function(e){
    if(e.target.matches('.mas') || e.target.matches('.menos')){
      const card = e.target.closest('.card');
      const currentCol = card.parentElement.dataset.col;
      let targetCol = null;

      if(e.target.matches('.mas')){
        if(currentCol==='todo') targetCol='doing';
        else if(currentCol==='doing') targetCol='done';
        else if(currentCol==='done') targetCol=null; // cannot advance
      } else if(e.target.matches('.menos')){
        if(currentCol==='doing') targetCol='todo';
        else if(currentCol==='done') targetCol='doing';
        else if(currentCol==='todo') targetCol=null; // cannot retreat
      }

      if(!targetCol) return; // no movement allowed

      // WIP rule: doing max 2 cards
      if(targetCol==='doing' && doingCol.querySelectorAll('.card').length>=2){
        return; // cannot move into full doing column
      }

      // Move card
      const targetElement = document.querySelector('.col[data-col="'+targetCol+'"]');
      targetElement.appendChild(card);
      updateCounters();
    }
  });
});
</script>
</body>
</html>
