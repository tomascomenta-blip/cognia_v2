<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
body{font-family:sans-serif;margin:0;padding:1rem;background:#fafafa;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:400px;margin:auto;}
.c{background:#eee;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;}
.c.abierta{background:#ddd;cursor:default;}
.c.bandera{background:#f00;color:#fff;}
#estado{margin-top:1rem;text-align:center;font-size:1.2rem;}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<div id="estado"></div>
<script>
const mines=new Set([6,12,18]);const grid=document.getElementById('grid');const estado=document.getElementById('estado');
function create(){for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;d.addEventListener('click',()=>open(i));d.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i);});grid.appendChild(d);}}
function neighbors(i){const r=Math.floor(i/5),c=i%5;const arr=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5)arr.push(nr*5+nc);}return arr;}
function countAdj(i){return neighbors(i).filter(n=>mines.has(n)).length;}
function open(i){const d=document.querySelector(`.c[data-i="${i}"]`);if(d.classList.contains('abierta')||d.classList.contains('bandera'))return;if(mines.has(i)){d.classList.add('abierta');estado.textContent='perdiste';return;}const cnt=countAdj(i);d.classList.add('abierta');if(cnt>0)d.textContent=cnt;else{d.textContent='';cascade(i);}}
function cascade(i){const queue=[i];while(queue.length){const cur=queue.shift();neighbors(cur).forEach(n=>{const nd=document.querySelector(`.c[data-i="${n}"]`);if(nd.classList.contains('abierta')||nd.classList.contains('bandera'))return;if(mines.has(n)){nd.classList.add('abierta');estado.textContent='perdiste';return;}const cnt=countAdj(n);nd.classList.add('abierta');if(cnt>0)nd.textContent=cnt;else{nd.textContent='';queue.push(n);}});}}
function toggleFlag(i){const d=document.querySelector(`.c[data-i="${i}"]`);if(d.classList.contains('abierta'))return;d.classList.toggle('bandera');d.textContent=d.classList.contains('bandera')?'🚩':'';}
create();
</script>
</body>
</html>
