<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5 con minas fijas</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#333;
    font-family:Arial,Helvetica,sans-serif;
  }
  #grid{
    width:80vw;
    height:80vw;
    max-width:500px;
    max-height:500px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:0.5vw;
  }
  .c{
    background:#ccc;
    border:1px solid #999;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:1.2rem;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#fff;
    cursor:default;
  }
  .c.bandera{
    background:#fdd;
  }
  .c.abierta span{
    pointer-events:none;
  }
  .c.abierta span.num1{color:blue;}
  .c.abierta span.num2{color:green;}
  .c.abierta span.num3{color:red;}
  #estado{
    margin-top:1rem;
    color:#f00;
    font-size:1.2rem;
    text-align:center;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
class Minesweeper{
  constructor(rows,cols,mines){
    this.rows=rows;
    this.cols=cols;
    this.mines=mines; // array of indices
    this.gridEl=document.getElementById('grid');
    this.estadoEl=document.getElementById('estado');
    this.cells=[];
    this.init();
  }
  init(){
    for(let i=0;i<this.rows*this.cols;i++){
      const cell=document.createElement('div');
      cell.classList.add('c');
      cell.dataset.i=i;
      cell.addEventListener('click',e=>this.handleClick(e,cell));
      cell.addEventListener('contextmenu',e=>this.handleRight(e,cell));
      this.gridEl.appendChild(cell);
      this.cells.push(cell);
    }
  }
  isMine(i){return this.mines.includes(i);}
  getNeighbors(i){
    const r=Math.floor(i/this.cols);
    const c=i%this.cols;
    const neigh=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<this.rows&&nc>=0&&nc<this.cols){
          neigh.push(nr*this.cols+nc);
        }
      }
    }
    return neigh;
  }
  countAdjacentMines(i){
    return this.getNeighbors(i).filter(idx=>this.isMine(idx)).length;
  }
  handleClick(e,cell){
    const i=parseInt(cell.dataset.i);
    if(cell.classList.contains('bandera')||cell.classList.contains('abierta'))return;
    if(this.isMine(i)){
      cell.classList.add('abierta');
      cell.innerHTML='<span>💣</span>';
      this.estadoEl.textContent='perdiste';
      return;
    }
    this.openCell(i);
  }
  handleRight(e,cell){
    e.preventDefault();
    if(cell.classList.contains('abierta'))return;
    cell.classList.toggle('bandera');
    cell.innerHTML=cell.classList.contains('bandera')?'🚩':'';
  }
  openCell(i){
    const cell=this.cells[i];
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
    cell.classList.add('abierta');
    const count=this.countAdjacentMines(i);
    if(count>0){
      const span=document.createElement('span');
      span.textContent=count;
      span.classList.add(`num${count}`);
      cell.appendChild(span);
    }else{
      this.getNeighbors(i).forEach(idx=>this.openCell(idx));
    }
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  const mines=[6,12,18];
  new Minesweeper(5,5,mines);
});
</script>
</body>
</html>
