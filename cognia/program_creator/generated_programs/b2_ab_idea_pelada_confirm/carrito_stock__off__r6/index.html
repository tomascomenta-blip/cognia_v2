<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Un carrito de compra con STOCK</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:0;}
  .container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:20px;}
  .products,.cart{background:#fff;padding:20px;box-shadow:0 2px 5px rgba(0,0,0,.1);flex:1;min-width:280px;margin:10px;}
  .products .prod{border-bottom:1px solid #e0e0e0;padding-bottom:15px;margin-bottom:15px;}
  .products .prod:last-child{border:none;}
  .products .title{font-weight:bold;margin:0;}
  .products .price,.products .stock{margin:5px 0;}
  .stock-badge{background:#c8e6c9;color:#2e7d32;padding:2px 6px;border-radius:12px;font-size:.9em;}
  button.add{background:#ffccbc;color:#a52a2a;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
  button.add:disabled{background:#e0e0e0;cursor:not-allowed;}
  .cart .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cart .linea .title{font-weight:bold;}
  .cart .linea .cant{margin:0 5px;}
  button.quitar{background:#ffcdd2;color:#c62828;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;}
  button.quitar:hover{background:#ff8a80;}
  .cart .total{font-weight:bold;margin-top:20px;font-size:1.2em;}
  .cart .total span{font-weight:normal;}
  @media (max-width:600px){.container{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3 class="title">Producto 1</h3>
      <p class="price">Precio: <span class="precio"></span></p>
      <p class="stock">Stock: <span class="stock-badge">2</span></p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3 class="title">Producto 2</h3>
      <p class="price">Precio: <span class="precio"></span></p>
      <p class="stock">Stock: <span class="stock-badge">3</span></p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3 class="title">Producto 3</h3>
      <p class="price">Precio: <span class="precio"></span></p>
      <p class="stock">Stock: <span class="stock-badge">1</span></p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total"></span></div>
  </div>
</div>
<script>
const cart = {};

function updateTotal() {
  let total = 0;
  for (const id in cart) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const price = parseFloat(prod.dataset.precio);
    total += price * cart[id];
  }
  document.getElementById('total').textContent = total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
}

function addToCart(id) {
  const prod = document.querySelector(`.prod[data-id="${id}"]`);
  const stock = parseInt(prod.dataset.stock);
  const addBtn = prod.querySelector(`button.add[data-id="${id}"]`);
  let line = document.querySelector(`.linea[data-id="${id}"]`);
  if (!line) {
    const lineDiv = document.createElement('div');
    lineDiv.className = 'linea';
    lineDiv.dataset.id = id;
    const title = prod.querySelector('.title').textContent;
    lineDiv.innerHTML = `<span class="title">${title}</span> x <span class="cant">1</span> <button class="quitar" data-id="${id}">Quitar</button>`;
    document.getElementById('cart-lines').appendChild(lineDiv);
    cart[id] = 1;
    if (stock === 1) addBtn.disabled = true;
    lineDiv.querySelector('.quitar').addEventListener('click', () => removeFromCart(id));
  } else {
    const cantSpan = line.querySelector('.cant');
    let qty = parseInt(cantSpan.textContent);
    if (qty < stock) {
      qty++;
      cantSpan.textContent = qty;
      cart[id] = qty;
      if (qty === stock) addBtn.disabled = true;
    }
  }
  updateTotal();
}

function removeFromCart(id) {
  const line = document.querySelector(`.linea[data-id="${id}"]`);
  if (!line) return;
  const cantSpan = line.querySelector('.cant');
  let qty = parseInt(cantSpan.textContent);
  qty--;
  const prod = document.querySelector(`.prod[data-id="${id}"]`);
  const addBtn = prod.querySelector(`button.add[data-id="${id}"]`);
  if (qty <= 0) {
    line.remove();
    delete cart[id];
    addBtn.disabled = false;
  } else {
    cantSpan.textContent = qty;
    cart[id] = qty;
    addBtn.disabled = false;
  }
  updateTotal();
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });
  document.querySelectorAll('.prod').forEach(prod => {
    const price = parseFloat(prod.dataset.precio);
    prod.querySelector('.precio').textContent = price.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  });
  updateTotal();
});
</script>
</body>
</html>
