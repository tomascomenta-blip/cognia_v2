<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;}
.grid{display:grid;grid-template-columns:repeat(3,80px);gap:5px;}
input.celda{width:80px;height:30px;text-align:right;padding:5px;border:1px solid #ccc;border-radius:3px;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1"><input class="celda" data-ref="A2"><input class="celda" data-ref="A3">
<input class="celda" data-ref="B1"><input class="celda" data-ref="B2"><input class="celda" data-ref="B3">
<input class="celda" data-ref="C1"><input class="celda" data-ref="C2"><input class="celda" data-ref="C3">
</div>
<script>
const cells=document.querySelectorAll('.celda');let updating=false;
function getCell(r){return document.querySelector(`.celda[data-ref="${r}"]`);}
function evalCell(r,vis=new Set()){
const c=getCell(r);let raw=c.dataset.formula||c.value;
if(raw.startsWith('=')){
if(vis.has(r))return 'CIRC';vis.add(r);
let e=raw.slice(1).replace(/[A-C][1-3]/g,ref=>{
const v=evalCell(ref,vis);return v==='CIRC'?'CIRC':v;
});
if(e.includes('CIRC'))return 'CIRC';
try{return isNaN(eval(e))?'CIRC':eval(e);}catch{return 'CIRC';}
}else{return raw;}
}
function updateAll(){
if(updating)return;updating=true;
cells.forEach(c=>{
const r=c.dataset.ref;const v=evalCell(r);
if(c.dataset.formula){
c.value=v==='CIRC'?'CIRC':Number(v).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}else{c.value=v;}
});
updating=false;
}
cells.forEach(c=>c.addEventListener('input',e=>{
const v=e.target.value;
if(v.startsWith('='))e.target.dataset.formula=v;else delete e.target.dataset.formula;
updateAll();
}));
updateAll();
</script>
</body>
</html>
