<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#333;}
.celda{width:100%;box-sizing:border-box;padding:8px;font-size:1rem;text-align:right;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" value="">
<input class="celda" data-ref="B1" value="=A1+1">
<input class="celda" data-ref="C1" value="=B1+1">
<input class="celda" data-ref="A2" value="">
<input class="celda" data-ref="B2" value="">
<input class="celda" data-ref="C2" value="">
<input class="celda" data-ref="A3" value="">
<input class="celda" data-ref="B3" value="">
<input class="celda" data-ref="C3" value="=A1+B1">
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
const cells={};
const formulas={};
let dependents={};
const refs=['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
refs.forEach(r=>{
const el=document.querySelector('[data-ref="'+r+'"]');
cells[r]=el;
if(el.value.trim().startsWith('=')){
formulas[r]=el.value.trim().slice(1);
}
});
function buildDependents(){
dependents={};
for(const ref in formulas){
const expr=formulas[ref];
const matches=expr.match(/[A-C][1-3]/g)||[];
matches.forEach(m=>{
if(!dependents[m])dependents[m]=[];
dependents[m].push(ref);
});
}
}
function evaluateCell(ref,visited){
if(visited.has(ref)){
cells[ref].value='CIRC';
return {value:null,cycle:true};
}
visited.add(ref);
if(!formulas[ref]){
const val=cells[ref].value.trim();
const num=parseFloat(val);
visited.delete(ref);
return {value:isNaN(num)?0:num,cycle:false};
}
const expr=formulas[ref];
const matches=expr.match(/[A-C][1-3]/g)||[];
let evalExpr=expr;
for(const m of matches){
const res=evaluateCell(m,visited);
if(res.cycle){
cells[ref].value='CIRC';
visited.delete(ref);
return {value:null,cycle:true};
}
const num=res.value;
const numStr=typeof num==='number'?num.toString():parseFloat(num).toString();
evalExpr=evalExpr.replace(m,numStr);
}
let result;
try{
result=Function('"use strict";return ('+evalExpr+')')();
}catch(e){result='';}
if(typeof result==='number' && !isNaN(result)){
cells[ref].value=result.toString();
}else{
cells[ref].value='';
}
visited.delete(ref);
return {value:result,cycle:false};
}
function recomputeAll(){
buildDependents();
for(const ref in cells){
evaluateCell(ref,new Set());
}
}
function onInput(e){
const el=e.target;
const ref=el.dataset.ref;
if(el.value.trim().startsWith('=')){
formulas[ref]=el.value.trim().slice(1);
}else{
delete formulas[ref];
}
recomputeAll();
}
for(const ref in cells){
cells[ref].addEventListener('input',onInput);
}
recomputeAll();
});
</script>
</body>
</html>
