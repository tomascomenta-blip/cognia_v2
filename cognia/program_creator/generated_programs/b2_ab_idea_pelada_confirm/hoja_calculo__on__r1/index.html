<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:sans-serif;margin:0;padding:10px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;box-sizing:border-box;padding:5px;font-size:1rem;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1">
  <input class="celda" data-ref="A2">
  <input class="celda" data-ref="A3">
  <input class="celda" data-ref="B1">
  <input class="celda" data-ref="B2">
  <input class="celda" data-ref="B3">
  <input class="celda" data-ref="C1">
  <input class="celda" data-ref="C2">
  <input class="celda" data-ref="C3">
</div>
<script>
const cells=document.querySelectorAll('.celda');
function evalCell(cell,vis){if(vis.has(cell))return'CIRC';vis.add(cell);if(cell.dataset.formula){const f=cell.dataset.formula;const e=f.slice(1).replace(/[A-C][1-3]/g,r=>{const c=document.querySelector(`[data-ref="${r}"]`);const v=evalCell(c,vis);return v==='CIRC'?'0':v;});try{const res=eval(e);if(isNaN(res))return'CIRC';cell.value=res;return res;}catch{return'CIRC';}}return cell.value;}
function recalc(){cells.forEach(c=>{const val=evalCell(c,new Set());if(val==='CIRC')c.value='CIRC';});}
cells.forEach(c=>c.addEventListener('input',e=>{const v=e.target.value;if(v.startsWith('='))e.target.dataset.formula=v;else delete e.target.dataset.formula;recalc();}));
recalc();
</script>
</body>
</html>
