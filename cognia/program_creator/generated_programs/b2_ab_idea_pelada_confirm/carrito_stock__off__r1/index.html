<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f9f9f9}
.prod{margin:0.5rem 0}
button{margin-left:0.5rem}
.linea{display:flex;align-items:center;margin:0.3rem 0}
.linea span{margin-right:0.5rem}
#total{font-weight:bold}
@media(max-width:600px){body{padding:0.5rem}}
</style>
</head>
<body>
<h1>Productos</h1>
<div class="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - 100 €</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - 50 €</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - 25 €</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>
<h2>Carrito</h2>
<div id="lines"></div>
<div>Total: <span id="total">0 €</span></div>
<script>
const cart={};
function update(id,delta){
  const prod=document.querySelector(`.prod[data-id="${id}"]`);
  const stock=+prod.dataset.stock;
  const qty=(cart[id]||0)+delta;
  if(qty<0||qty>stock)return;
  if(qty===0)delete cart[id];else cart[id]=qty;
  render();
}
function render(){
  const lines=document.getElementById('lines');lines.innerHTML='';
  let total=0;
  for(const id in cart){
    const qty=cart[id];
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const price=+prod.dataset.precio;
    total+=qty*price;
    const line=document.createElement('div');line.className='linea';line.dataset.id=id;
    line.innerHTML=`<span>${prod.dataset.id}</span> <span class="cant">${qty}</span> <button class="quitar" data-id="${id}">Quitar</button>`;
    lines.appendChild(line);
  }
  document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  document.querySelectorAll('.add').forEach(btn=>{
    const id=btn.dataset.id;
    const stock=+document.querySelector(`.prod[data-id="${id}"]`).dataset.stock;
    btn.disabled=(cart[id]||0)>=stock;
  });
}
document.querySelectorAll('.add').forEach(btn=>btn.addEventListener('click',()=>update(btn.dataset.id,1)));
document.addEventListener('click',e=>{if(e.target.classList.contains('quitar'))update(e.target.dataset.id,-1)});
render();
</script>
</body>
</html>
