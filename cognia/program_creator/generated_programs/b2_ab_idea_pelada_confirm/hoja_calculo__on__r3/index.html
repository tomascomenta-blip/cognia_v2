<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  h1{font-size:1.5em;text-align:center;}
  pre{font-family:monospace;text-align:center;margin:0 0 20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:5px;font-size:1em;box-sizing:border-box;}
  .celda[data-formula]{background:#e0ffe0;}
  .circ{color:red;font-weight:bold;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<pre>
  ___   ___   ___
 / _ \ / _ \ / _ \
| (_) | (_) | (_) |
 \___/ \___/ \___/
</pre>
<div class="grid">
  <input class="celda" data-ref="A1" />
  <input class="celda" data-ref="A2" />
  <input class="celda" data-ref="A3" />
  <input class="celda" data-ref="B1" />
  <input class="celda" data-ref="B2" />
  <input class="celda" data-ref="B3" />
  <input class="celda" data-ref="C1" />
  <input class="celda" data-ref="C2" />
  <input class="celda" data-ref="C3" data-formula="=A1+B1" />
</div>
<script>
(function(){
  const cells=document.querySelectorAll('.celda');
  const cellMap={};
  cells.forEach(c=>{cellMap[c.dataset.ref]=c;});
  function parseFormula(formula){
    formula=formula.slice(1);
    const tokens=[];
    let num='';
    for(let i=0;i<formula.length;i++){
      const ch=formula[i];
      if(ch==='+'||ch==='-'){
        if(num){tokens.push(num);num='';}
        tokens.push(ch);
      }else{
        num+=ch;
      }
    }
    if(num)tokens.push(num);
    return tokens;
  }
  function evalCell(ref,stack){
    if(stack.includes(ref))return 'CIRC';
    const cell=cellMap[ref];
    if(!cell)return 0;
    const formula=cell.dataset.formula;
    if(!formula){
      const val=cell.dataset.value;
      const num=parseFloat(val);
      return isNaN(num)?val:num;
    }
    const tokens=parseFormula(formula);
    let acc=null;
    let op='+';
    for(const tok of tokens){
      if(tok==='+'||tok==='-'){
        op=tok;
      }else{
        let val;
        if(/^[A-C][1-3]$/.test(tok)){
          val=evalCell(tok,stack.concat(ref));
          if(val==='CIRC')return 'CIRC';
        }else{
          val=parseFloat(tok);
          if(isNaN(val))val=0;
        }
        if(acc===null)acc=val;
        else{
          if(op==='+')acc+=val;
          else acc-=val;
        }
      }
    }
    return acc;
  }
  function recompute(){
    cells.forEach(c=>{
      const ref=c.dataset.ref;
      const formula=c.dataset.formula;
      if(formula){
        const val=evalCell(ref,[]);
        if(val==='CIRC'){
          c.value='CIRC';
          c.classList.add('circ');
        }else{
          c.value=val;
          c.classList.remove('circ');
        }
      }else{
        const val=c.dataset.value||'';
        c.value=val;
        c.classList.remove('circ');
      }
    });
  }
  cells.forEach(c=>{
    c.addEventListener('input',e=>{
      const val=e.target.value;
      if(val.startsWith('=')){
        c.dataset.formula=val;
        delete c.dataset.value;
      }else{
        c.dataset.value=val;
        delete c.dataset.formula;
      }
      recompute();
    });
  });
  recompute();
})();
</script>
</body>
</html>
