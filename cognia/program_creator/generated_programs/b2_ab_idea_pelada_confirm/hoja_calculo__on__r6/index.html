<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  h1{font-size:1.5rem;text-align:center;margin-bottom:10px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:5px;font-size:1rem;text-align:right;border:1px solid #ccc;border-radius:3px;}
  .celda.circ{color:#c00;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="=A1+B1-A2">
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const cells = document.querySelectorAll('.celda');
  const refMap = {};
  cells.forEach(c => { refMap[c.dataset.ref] = c; });

  // Guarda la fórmula original en data-formula cuando se detecta
  function storeFormula(cell) {
    const val = cell.value.trim();
    if (val.startsWith('=')) {
      cell.dataset.formula = val;
    } else {
      delete cell.dataset.formula;
    }
  }

  // Evalúa una celda recursivamente, detectando ciclos
  function evaluateCell(cell, visited = new Set()) {
    if (visited.has(cell)) return 'CIRC';
    visited.add(cell);

    const formula = cell.dataset.formula;
    if (!formula) return cell.value.trim();

    const expr = formula.slice(1); // quita '='
    const refRegex = /([A-C][1-3])/g;

    let evalExpr = expr.replace(refRegex, match => {
      const refCell = refMap[match];
      if (!refCell) return '0';
      const res = evaluateCell(refCell, visited);
      if (res === 'CIRC') return 'CIRC';
      return res;
    });

    if (evalExpr.includes('CIRC')) return 'CIRC';

    try {
      const result = Function('return ' + evalExpr)();
      return result.toString();
    } catch (e) {
      return 'CIRC';
    }
  }

  // Recalcula todas las celdas con fórmula
  function recalcAll() {
    cells.forEach(c => {
      storeFormula(c);
      if (c.dataset.formula) {
        const res = evaluateCell(c);
        c.value = res;
        c.classList.toggle('circ', res === 'CIRC');
      }
    });
  }

  cells.forEach(c => c.addEventListener('change', recalcAll));
  recalcAll(); // estado inicial
});
</script>
</body>
</html>
