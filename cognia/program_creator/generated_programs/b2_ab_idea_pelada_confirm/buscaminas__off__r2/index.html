<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
body{font-family:sans-serif;margin:0;padding:10px;background:#eee;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;}
.c{background:#ccc;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
.c.abierta{background:#fff;}
.c.bandera{background:#fdd;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const grid=document.getElementById('grid');
for(let i=0;i<25;i++){
 let d=document.createElement('div');
 d.className='c';d.dataset.i=i;
 d.addEventListener('click',e=>{
  if(d.classList.contains('bandera')||d.classList.contains('abierta'))return;
  if(mines.includes(i)){d.classList.add('abierta');document.getElementById('estado').textContent='perdiste';return;}
  openCell(i);
 });
 d.addEventListener('contextmenu',e=>{
  e.preventDefault();if(d.classList.contains('abierta'))return;d.classList.toggle('bandera');
 });
 grid.appendChild(d);
}
function neighbors(i){let r=Math.floor(i/5),c=i%5,ns=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;let nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5)ns.push(nr*5+nc);}return ns;}
function countMines(i){return neighbors(i).filter(n=>mines.includes(n)).length;}
function openCell(i){let cell=document.querySelector(`.c[data-i="${i}"]`);if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;cell.classList.add('abierta');let c=countMines(i);if(c>0){cell.textContent=c;}else{cell.textContent='';let stack=[i];while(stack.length){let cur=stack.pop();neighbors(cur).forEach(n=>{let ccell=document.querySelector(`.c[data-i="${n}"]`);if(ccell.classList.contains('abierta')||ccell.classList.contains('bandera'))return;ccell.classList.add('abierta');let cn=countMines(n);if(cn>0){ccell.textContent=cn;}else{ccell.textContent='';stack.push(n);}});}}
}
</script>
</body>
</html>
