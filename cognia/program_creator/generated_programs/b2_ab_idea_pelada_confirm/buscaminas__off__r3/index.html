<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5</title>
<style>
body{margin:0;background:#222;color:#eee;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh}
#grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:2px;width:90vw;max-width:300px;aspect-ratio:1}
.c{background:#444;border:1px solid #333;position:relative;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:1.2rem;user-select:none}
.c.abierta{background:#777;color:#000}
.c.bandera{background:#444}
#estado{margin-top:10px;text-align:center;font-size:1.5rem}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const grid=document.getElementById('grid');
const estado=document.getElementById('estado');
const size=5;
const cells=[];
for(let i=0;i<25;i++){
  const d=document.createElement('div');
  d.className='c';d.dataset.i=i;
  d.addEventListener('click',()=>openCell(d));
  d.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(d)});
  grid.appendChild(d);cells.push(d);
}
const counts=Array(25).fill(0);
for(let i=0;i<25;i++){
  let r=Math.floor(i/size),c=i%size, cnt=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    let nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<size&&nc>=0&&nc<size&&mines.includes(nr*size+nc))cnt++;
  }
  counts[i]=cnt;
}
function openCell(d){
  if(d.classList.contains('bandera')||d.classList.contains('abierta'))return;
  const i=+d.dataset.i;
  if(mines.includes(i)){d.classList.add('abierta');d.textContent='💣';estado.textContent='perdiste';return;}
  d.classList.add('abierta');const cnt=counts[i];if(cnt>0)d.textContent=cnt;else cascade(i);
}
function cascade(start){
  const q=[start],vis=new Set();
  while(q.length){
    const i=q.shift();
    if(vis.has(i)||mines.includes(i))continue;
    vis.add(i);
    const d=cells[i];
    if(d.classList.contains('abierta')||d.classList.contains('bandera'))continue;
    d.classList.add('abierta');
    const cnt=counts[i];
    if(cnt>0){d.textContent=cnt;continue;}
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0)continue;
      let r=Math.floor(i/size)+dr,c=i%size+dc;
      if(r>=0&&r<size&&c>=0&&c<size)q.push(r*size+c);
    }
  }
}
function toggleFlag(d){
  if(d.classList.contains('abierta'))return;
  if(d.classList.contains('bandera')){d.classList.remove('bandera');d.textContent='';}
  else{d.classList.add('bandera');d.textContent='🚩';}
}
</script>
</body>
</html>
