<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  background: #f0f0f0;
}
h1 {
  margin-top: 20px;
  margin-bottom: 10px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, 80px);
  grid-gap: 2px;
}
.celda {
  width: 80px;
  height: 30px;
  padding: 0;
  text-align: right;
  border: 1px solid #999;
  box-sizing: border-box;
  font-size: 14px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { background-color: #fff; }
  50% { background-color: #e0f7ff; }
  100% { background-color: #fff; }
}
pre {
  margin-top: 20px;
  font-family: monospace;
  color: #333;
}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<div class="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>
<pre>
   _____
  /     \
 | 3x3  |
  \_____/
</pre>
<script>
"use strict";
document.addEventListener('DOMContentLoaded', () => {
  const cells = document.querySelectorAll('input.celda');
  const refMap = {};
  cells.forEach(cell => {
    refMap[cell.dataset.ref] = cell;
    cell.dataset.raw = cell.value;
    cell.addEventListener('input', () => {
      cell.dataset.raw = cell.value;
      recomputeAll();
    });
  });

  function recomputeAll() {
    cells.forEach(cell => {
      const raw = cell.dataset.raw;
      if (raw.startsWith('=')) {
        const val = evaluateFormula(raw, new Set());
        if (val === 'CIRC') {
          cell.value = 'CIRC';
        } else {
          cell.value = val.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
      } else {
        cell.value = raw;
      }
    });
  }

  function evaluateFormula(formula, visited) {
    const expr = formula.slice(1);
    const refs = expr.match(/[A-C][1-3]/g) || [];
    let exprEval = expr;
    for (const ref of refs) {
      const val = evaluateCellByRef(ref, visited);
      if (val === 'CIRC') return 'CIRC';
      exprEval = exprEval.replace(ref, val);
    }
    try {
      const result = eval(exprEval);
      if (typeof result === 'number' && !isNaN(result)) {
        return result;
      } else {
        return 0;
      }
    } catch (e) {
      return 0;
    }
  }

  function evaluateCellByRef(ref, visited) {
    if (visited.has(ref)) return 'CIRC';
    const cell = refMap[ref];
    if (!cell) return 0;
    visited.add(ref);
    const raw = cell.dataset.raw;
    let val;
    if (raw.startsWith('=')) {
      val = evaluateFormula(raw, visited);
    } else {
      const num = parseFloat(raw.replace(/,/g, ''));
      val = isNaN(num) ? 0 : num;
    }
    visited.delete(ref);
    return val;
  }

  recomputeAll();
});
</script>
</body>
</html>
