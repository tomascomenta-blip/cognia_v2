<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5</title>
<style>
  body{
    font-family:sans-serif;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:#f0f0f0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    margin-top:20px;
  }
  .c{
    width:60px;
    height:60px;
    background:#ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#e0e0e0;
    cursor:default;
  }
  .c.bandera{
    background:#ffeb3b;
  }
  .c.mina{
    background:#ff5252;
  }
  #estado{
    margin-top:10px;
    font-size:18px;
    font-weight:bold;
  }
  @media (max-width:400px){
    .c{
      width:40px;
      height:40px;
      font-size:16px;
    }
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
  const mines=[6,12,18];
  const grid=document.getElementById('grid');
  const estado=document.getElementById('estado');

  // Crear las 25 celdas
  for(let i=0;i<25;i++){
    const cell=document.createElement('div');
    cell.className='c';
    cell.dataset.i=i;
    cell.addEventListener('click',onClick);
    cell.addEventListener('contextmenu',onRightClick);
    grid.appendChild(cell);
  }

  function onClick(e){
    const cell=e.currentTarget;
    if(cell.classList.contains('bandera')||cell.classList.contains('abierta')) return;
    const i=parseInt(cell.dataset.i);
    if(mines.includes(i)){
      cell.classList.add('abierta','mina');
      estado.textContent='perdiste';
      return;
    }
    const count=countAdj(i);
    cell.classList.add('abierta');
    if(count>0) cell.textContent=count;
    if(count===0) cascade(i);
  }

  function onRightClick(e){
    e.preventDefault();
    const cell=e.currentTarget;
    if(cell.classList.contains('abierta')) return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }

  function countAdj(i){
    const row=Math.floor(i/5);
    const col=i%5;
    let cnt=0;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0) continue;
        const r=row+dr,c=col+dc;
        if(r<0||r>4||c<0||c>4) continue;
        const idx=r*5+c;
        if(mines.includes(idx)) cnt++;
      }
    }
    return cnt;
  }

  function cascade(start){
    const queue=[start];
    const visited=new Set();
    while(queue.length){
      const cur=queue.shift();
      if(visited.has(cur)) continue;
      visited.add(cur);
      const cell=document.querySelector(`.c[data-i='${cur}']`);
      if(cell.classList.contains('abierta')||cell.classList.contains('bandera')) continue;
      const count=countAdj(cur);
      cell.classList.add('abierta');
      if(count>0) cell.textContent=count;
      if(count===0){
        const row=Math.floor(cur/5),col=cur%5;
        for(let dr=-1;dr<=1;dr++){
          for(let dc=-1;dc<=1;dc++){
            if(dr===0&&dc===0) continue;
            const r=row+dr,c=col+dc;
            if(r<0||r>4||c<0||c>4) continue;
            const idx=r*5+c;
            if(!visited.has(idx)) queue.push(idx);
          }
        }
      }
    }
  }
</script>
</body>
</html>
