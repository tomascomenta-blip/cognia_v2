<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f5f5;}
  .container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:20px;}
  .products,.cart{flex:1 1 300px;padding:10px;}
  .products{display:flex;flex-direction:column;gap:20px;}
  .prod{background:#fff;padding:15px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.1);display:flex;flex-direction:column;align-items:center;}
  .prod .img{width:100%;height:150px;background:#ddd;border-radius:5px;margin-bottom:10px;}
  .prod .title{font-size:1.1rem;margin:5px 0;}
  .prod .price{color:#555;margin:5px 0;}
  .prod .add{background:#008080;color:#fff;border:none;padding:8px 12px;border-radius:3px;cursor:pointer;}
  .prod .add:disabled{background:#aaa;cursor:not-allowed;}
  .cart{background:#fff;padding:15px;border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
  .cart h2{margin-top:0;}
  .lines{margin-top:10px;}
  .linea{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #eee;}
  .linea .cant{font-weight:bold;}
  .linea .quitar{background:#ff4d4d;color:#fff;border:none;padding:4px 8px;border-radius:3px;cursor:pointer;}
  .linea .quitar:hover{background:#e60000;}
  .total{margin-top:15px;font-size:1.2rem;font-weight:bold;}
  @media (max-width:600px){.container{flex-direction:column;}}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img"></div>
      <h3 class="title">Producto 1</h3>
      <p class="price">$100.00</p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img"></div>
      <h3 class="title">Producto 2</h3>
      <p class="price">$50.00</p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img"></div>
      <h3 class="title">Producto 3</h3>
      <p class="price">$25.00</p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div class="lines"></div>
    <div class="total">Total: <span id="total">0</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const addButtons = document.querySelectorAll('.add');
  const linesContainer = document.querySelector('.lines');
  const totalSpan = document.getElementById('total');
  const cart = {};

  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const item = cart[id];
      total += item.price * item.qty;
    }
    totalSpan.textContent = total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  function updateLine(id) {
    const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
    if (!line) return;
    const qtySpan = line.querySelector('.cant');
    qtySpan.textContent = cart[id].qty;
  }

  function toggleAddButton(id) {
    const button = document.querySelector(`.add[data-id="${id}"]`);
    if (!button) return;
    if (cart[id].qty >= cart[id].stock) {
      button.disabled = true;
    } else {
      button.disabled = false;
    }
  }

  function addToCart(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const price = parseFloat(prod.dataset.precio);
    const stock = parseInt(prod.dataset.stock, 10);
    if (!cart[id]) {
      cart[id] = {price, stock, qty:0};
    }
    if (cart[id].qty < stock) {
      cart[id].qty += 1;
      if (!linesContainer.querySelector(`.linea[data-id="${id}"]`)) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'linea';
        lineDiv.dataset.id = id;
        lineDiv.innerHTML = `
          <span class="title">${prod.querySelector('.title').textContent}</span>
          <span class="cant">${cart[id].qty}</span>
          <button class="quitar" data-id="${id}">Quitar</button>
        `;
        linesContainer.appendChild(lineDiv);
      } else {
        updateLine(id);
      }
      toggleAddButton(id);
      updateTotal();
    }
  }

  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id].qty -= 1;
    if (cart[id].qty <= 0) {
      const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
      if (line) line.remove();
      delete cart[id];
    } else {
      updateLine(id);
    }
    toggleAddButton(id);
    updateTotal();
  }

  addButtons.forEach(btn => {
    btn.addEventListener('click', () => addToCart(btn.dataset.id));
  });

  linesContainer.addEventListener('click', e => {
    if (e.target.classList.contains('quitar')) {
      removeFromCart(e.target.dataset.id);
    }
  });

  updateTotal();
});
</script>
</body>
</html>
