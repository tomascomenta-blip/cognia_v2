<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con STOCK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f9f9f9;color:#333;}
  .container{max-width:900px;margin:auto;padding:1rem;}
  h1{font-size:1.8rem;text-align:center;margin-bottom:1rem;}
  .products{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:2rem;}
  .prod{background:#fff;border:1px solid #ddd;border-radius:4px;padding:1rem;flex:1 1 200px;box-shadow:0 2px 4px rgba(0,0,0,.05);}
  .prod .name{font-weight:bold;display:block;margin-bottom:.5rem;}
  .prod .precio{color:#555;margin-bottom:.5rem;}
  .prod button{background:#28a745;color:#fff;border:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer;}
  .prod button:disabled{background:#aaa;cursor:not-allowed;}
  .cart{background:#fff;border:1px solid #ddd;border-radius:4px;padding:1rem;box-shadow:0 2px 4px rgba(0,0,0,.05);}
  .cart h2{margin-top:0;}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;}
  .linea .name{flex:1;}
  .linea .cant{margin:0 1rem;font-weight:bold;}
  .linea button{background:#dc3545;color:#fff;border:none;padding:.3rem .6rem;border-radius:4px;cursor:pointer;}
  .total{font-size:1.2rem;font-weight:bold;margin-top:1rem;text-align:right;}
  @media(max-width:600px){
    .products{flex-direction:column;}
    .prod{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div class="container">
  <h1>Carrito de compra con STOCK</h1>
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <span class="name">Producto 1</span>
      <span class="precio"></span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <span class="name">Producto 2</span>
      <span class="precio"></span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <span class="name">Producto 3</span>
      <span class="precio"></span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div class="total">Total: <span id="total">0 €</span></div>
  </div>
</div>

<script>
/* Configurables */
const CART = {}; // {id: quantity}
const PRODUCTS = {}; // {id: {precio, stock, name}}
const CURRENCY = 'EUR';
const LOCALE = 'es-ES';

/* Helper to format currency */
function formatCurrency(val){
  return val.toLocaleString(LOCALE, {style:'currency', currency:CURRENCY});
}

/* Initialize product data and display prices */
document.querySelectorAll('.prod').forEach(prod=>{
  const id = prod.dataset.id;
  const precio = parseFloat(prod.dataset.precio);
  const stock = parseInt(prod.dataset.stock,10);
  const name = prod.querySelector('.name').textContent;
  PRODUCTS[id] = {precio, stock, name};
  prod.querySelector('.precio').textContent = formatCurrency(precio);
});

/* Update the total display */
function updateTotal(){
  let total = 0;
  for(const id in CART){
    total += CART[id] * PRODUCTS[id].precio;
  }
  document.getElementById('total').textContent = formatCurrency(total);
}

/* Update or create a cart line */
function updateCartLine(id){
  const lines = document.getElementById('lines');
  let line = lines.querySelector(`.linea[data-id="${id}"]`);
  const qty = CART[id] || 0;
  if(qty===0){
    if(line){ lines.removeChild(line); }
    return;
  }
  if(!line){
    line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;
    line.innerHTML = `<span class="name">${PRODUCTS[id].name}</span>
                      <span class="cant">${qty}</span>
                      <button class="quitar" data-id="${id}">Quitar</button>`;
    lines.appendChild(line);
  }else{
    line.querySelector('.cant').textContent = qty;
  }
}

/* Enable/disable add button based on stock */
function updateAddButtonState(id){
  const btn = document.querySelector(`.add[data-id="${id}"]`);
  const qty = CART[id] || 0;
  if(qty >= PRODUCTS[id].stock){
    btn.disabled = true;
  }else{
    btn.disabled = false;
  }
}

/* Add item to cart */
function addItem(id){
  const current = CART[id] || 0;
  if(current < PRODUCTS[id].stock){
    CART[id] = current + 1;
    updateCartLine(id);
    updateAddButtonState(id);
    updateTotal();
  }
}

/* Remove item from cart */
function removeItem(id){
  const current = CART[id] || 0;
  if(current > 0){
    CART[id] = current - 1;
    if(CART[id]===0){ delete CART[id]; }
    updateCartLine(id);
    updateAddButtonState(id);
    updateTotal();
  }
}

/* Event delegation for add and quitar buttons */
document.addEventListener('click', e=>{
  if(e.target.matches('.add')){
    addItem(e.target.dataset.id);
  }else if(e.target.matches('.quitar')){
    removeItem(e.target.dataset.id);
  }
});

/* Initial state */
updateTotal();
</script>
</body>
</html>
