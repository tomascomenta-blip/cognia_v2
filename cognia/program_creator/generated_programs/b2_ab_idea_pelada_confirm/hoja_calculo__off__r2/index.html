<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:4px;
    padding:10px;
    background:#fff;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
    border-radius:4px;
    max-width:400px;
    width:90%;
  }
  .celda{
    width:80px;
    height:30px;
    padding:4px;
    text-align:right;
    border:1px solid #ccc;
    border-radius:2px;
    font-size:14px;
    color:#333;
    background:#fff;
    transition:border-color .2s;
  }
  .celda:focus{
    outline:none;
    border-color:#0066cc;
  }
  .celda.formula{
    background:#fafafa;
  }
</style>
</head>
<body>
<div id="grid">
  <input type="text" class="celda" data-ref="A1" />
  <input type="text" class="celda" data-ref="A2" />
  <input type="text" class="celda" data-ref="A3" />
  <input type="text" class="celda" data-ref="B1" />
  <input type="text" class="celda" data-ref="B2" />
  <input type="text" class="celda" data-ref="B3" />
  <input type="text" class="celda" data-ref="C1" />
  <input type="text" class="celda" data-ref="C2" />
  <input type="text" class="celda" data-ref="C3" />
</div>
<script>
/* CONFIGURABLE CONSTANTS */
const REF_ROWS = ['A','B','C'];
const REF_COLS = ['1','2','3'];
const REF_PATTERN = /^[A-C][1-3]$/;

/* MAPS */
const cells = {};          // ref -> element
const dependents = {};     // ref -> Set of cells that depend on it

/* UTILITIES */
function getReferences(formula){
  const matches = [...formula.matchAll(/[A-C][1-3]/g)];
  return matches.map(m=>m[0]);
}

/* REBUILD DEPENDENCY GRAPH */
function updateDependencies(){
  // reset dependents
  for(const ref of Object.keys(cells)){
    dependents[ref] = new Set();
  }
  // populate dependents
  for(const ref of Object.keys(cells)){
    const cell = cells[ref];
    const formula = cell.dataset.formula;
    if(formula){
      const refs = getReferences(formula);
      for(const r of refs){
        if(dependents[r]) dependents[r].add(ref);
      }
    }
  }
}

/* EVALUATE A CELL */
function evaluateCell(cellRef, stack){
  if(stack.has(cellRef)) return 'CIRC';
  stack.add(cellRef);
  const cell = cells[cellRef];
  const formula = cell.dataset.formula;
  let value;
  if(!formula){
    const val = cell.value.trim();
    const num = parseFloat(val);
    value = isNaN(num) ? 0 : num;
  }else{
    const tokens = formula.match(/[A-C][1-3]|[+-]|\d+(\.\d+)?/g);
    if(!tokens){ value = 0; }
    else{
      let result = null;
      let op = '+';
      for(const token of tokens){
        if(token==='+'||token==='-'){
          op = token;
        }else{
          let operand;
          if(REF_PATTERN.test(token)){
            operand = evaluateCell(token, stack);
            if(operand==='CIRC'){ stack.delete(cellRef); return 'CIRC'; }
          }else{
            operand = parseFloat(token);
            operand = isNaN(operand)?0:operand;
          }
          if(result===null){ result = operand; }
          else{
            if(op==='+') result += operand;
            else if(op==='-') result -= operand;
          }
        }
      }
      value = result;
    }
  }
  // set displayed value
  const display = value==='CIRC'?'CIRC':value.toString();
  cell.value = display;
  cell.setAttribute('value', display);
  // update formula class
  if(formula) cell.classList.add('formula');
  else cell.classList.remove('formula');
  stack.delete(cellRef);
  return value;
}

/* RECOMPUTE DEPENDENTS */
function recomputeDependents(startRef){
  const queue = [startRef];
  const visited = new Set();
  while(queue.length){
    const ref = queue.shift();
    if(visited.has(ref)) continue;
    visited.add(ref);
    const deps = dependents[ref];
    if(deps){
      for(const d of deps){
        evaluateCell(d, new Set());
        queue.push(d);
      }
    }
  }
}

/* EVENT HANDLER */
function onInput(e){
  const cell = e.target;
  const ref = cell.dataset.ref;
  const val = cell.value.trim();
  if(val.startsWith('=')){
    cell.dataset.formula = val.slice(1);
  }else{
    delete cell.dataset.formula;
  }
  updateDependencies();
  evaluateCell(ref, new Set());
  recomputeDependents(ref);
}

/* INITIALIZE */
document.addEventListener('DOMContentLoaded',()=>{
  // collect cells
  const inputs = document.querySelectorAll('.celda');
  inputs.forEach(inp=>{
    const ref = inp.dataset.ref;
    cells[ref] = inp;
    inp.addEventListener('input', onInput);
  });
  updateDependencies();
});
</script>
</body>
</html>
