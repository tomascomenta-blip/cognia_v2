<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f9f9f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
  }
  .grid{
    display:grid;
    grid-template-columns:30px 80px 80px 80px;
    grid-template-rows:30px repeat(3,40px);
    gap:0;
    background:#fff;
    border:1px solid #ddd;
    border-radius:4px;
    padding:5px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    color:#008080;
    font-size:14px;
  }
  .row-label{
    justify-content:flex-end;
    padding-right:5px;
  }
  .celda{
    width:80px;
    height:30px;
    border:1px solid #ccc;
    box-shadow:0 1px 2px rgba(0,0,0,0.1);
    text-align:right;
    padding:4px;
    font-size:14px;
    background:#fff;
    outline:none;
  }
  .celda:hover{
    outline:2px solid #e0ffff;
  }
  .celda.formula{
    font-weight:bold;
    color:#333;
  }
  .celda.circular{
    color:red;
  }
  @media (max-width:480px){
    .celda{width:60px;}
    .grid{
      grid-template-columns:25px 60px 60px 60px;
      grid-template-rows:25px repeat(3,35px);
    }
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"></div>
  <div class="cell">A</div>
  <div class="cell">B</div>
  <div class="cell">C</div>

  <div class="cell row-label">1</div>
  <input class="celda" data-ref="A1" />
  <input class="celda" data-ref="B1" />
  <input class="celda" data-ref="C1" />

  <div class="cell row-label">2</div>
  <input class="celda" data-ref="A2" />
  <input class="celda" data-ref="B2" />
  <input class="celda" data-ref="C2" />

  <div class="cell row-label">3</div>
  <input class="celda" data-ref="A3" />
  <input class="celda" data-ref="B3" />
  <input class="celda" data-ref="C3" />
</div>

<script>
(() => {
  const refs = ['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
  const cells = {};
  refs.forEach(ref => {
    const el = document.querySelector(`[data-ref="${ref}"]`);
    cells[ref] = el;
    el.addEventListener('input', handleInput);
  });

  function handleInput(e) {
    const el = e.target;
    const val = el.value.trim();
    if (val.startsWith('=')) {
      el.dataset.formula = val;
      el.classList.add('formula');
    } else {
      delete el.dataset.formula;
      el.classList.remove('formula');
    }
    evaluateAll();
  }

  function evaluateAll() {
    // Build dependency graph
    const graph = {};
    refs.forEach(r => graph[r] = []);
    refs.forEach(ref => {
      const el = cells[ref];
      const formula = el.dataset.formula;
      if (formula) {
        const refsInFormula = formula.match(/[A-C][1-3]/g) || [];
        refsInFormula.forEach(r => {
          if (graph[r]) graph[r].push(ref);
        });
      }
    });

    // Evaluate each cell
    refs.forEach(ref => {
      const val = evaluateCell(ref, new Set());
      const el = cells[ref];
      if (el.dataset.formula) {
        if (val === 'CIRC') {
          el.value = 'CIRC';
          el.classList.add('circular');
        } else {
          el.value = val;
          el.classList.remove('circular');
        }
      } else {
        // plain cell: keep user value
      }
    });
  }

  function evaluateCell(ref, visited) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const el = cells[ref];
    const formula = el.dataset.formula;
    if (!formula) {
      const val = el.value.trim();
      if (val === '') return '0';
      return val;
    }
    let expr = formula.slice(1); // remove '='
    const refsInFormula = expr.match(/[A-C][1-3]/g) || [];
    for (const r of refsInFormula) {
      const val = evaluateCell(r, visited);
      if (val === 'CIRC') {
        expr = 'CIRC';
        break;
      }
      expr = expr.split(r).join(val);
    }
    if (expr === 'CIRC') return 'CIRC';
    try {
      const result = eval(expr);
      if (isNaN(result)) return '0';
      return result.toString();
    } catch (e) {
      return '0';
    }
  }

  window.addEventListener('load', () => {
    // Set initial formulas
    cells['B1'].dataset.formula = '=A1+1';
    cells['B1'].classList.add('formula');
    cells['C1'].dataset.formula = '=B1+1';
    cells['C1'].classList.add('formula');
    cells['C3'].dataset.formula = '=A1+B1';
    cells['C3'].classList.add('formula');
    evaluateAll();
  });
})();
</script>
</body>
</html>
