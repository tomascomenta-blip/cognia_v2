<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Buscaminas 5x5</title><style>body{font-family:sans-serif;margin:0;padding:0;background:#f0f0f0;}#top{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#ddd;}#score{font-size:1rem;}#reset{padding:5px 10px;font-size:1rem;}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:300px;margin:10px auto;} .c{background:#e0e0e0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.2);} .c.abierta{background:#fff;color:#333;font-weight:bold;} .c.bandera{background:#e0e0e0;color:red;font-weight:bold;} .c.abierta[data-mine="true"]{color:red;}#estado{padding:10px;text-align:center;font-size:1.2rem;color:red;}</style></head><body><div id="top"><span id="score">Puntuación: 0</span><button id="reset">Reiniciar</button></div><div id="grid"></div><div id="estado"></div><script>const mines=[6,12,18],grid=document.getElementById('grid'),scoreEl=document.getElementById('score'),estadoEl=document.getElementById('estado');let opened=0;function createGrid(){grid.innerHTML='';for(let i=0;i<25;i++){const c=document.createElement('div');c.className='c';c.dataset.i=i;c.dataset.mine=mines.includes(i);c.addEventListener('click',()=>openCell(c));c.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(c);});grid.appendChild(c);}}function openCell(c){if(c.classList.contains('bandera')||c.classList.contains('abierta'))return;if(c.dataset.mine==='true'){c.classList.add('abierta');c.textContent='💣';estadoEl.textContent='perdiste';return;}const i=parseInt(c.dataset.i),count=countAdj(i);c.classList.add('abierta');if(count>0)c.textContent=count;opened++;scoreEl.textContent='Puntuación: '+opened;if(count===0)cascade(i);}function countAdj(i){const r=Math.floor(i/5),c=Math.floor(i%5);let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(nr<0||nr>4||nc<0||nc>4)continue;const idx=nr*5+nc;if(mines.includes(idx))cnt++;}return cnt;}function cascade(i){const queue=[i],visited=new Set();while(queue.length){const cur=queue.shift(),r=Math.floor(cur/5),c=Math.floor(cur%5);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(nr<0||nr>4||nc<0||nc>4)continue;const idx=nr*5+nc;if(visited.has(idx))continue;const cell=document.querySelector('.c[data-i="'+idx+'"]');if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))continue;if(cell.dataset.mine==='true')continue;const cnt=countAdj(idx);cell.classList.add('abierta');if(cnt>0)cell.textContent=cnt;opened++;scoreEl.textContent='Puntuación: '+opened;visited.add(idx);if(cnt===0)queue.push(idx);}}}function toggleFlag(c){if(c.classList.contains('abierta'))return;c.classList.toggle('bandera');}document.getElementById('reset').addEventListener('click',()=>{opened=0;scoreEl.textContent='Puntuación: 0';estadoEl.textContent='';createGrid();});createGrid();</script></body></html>
