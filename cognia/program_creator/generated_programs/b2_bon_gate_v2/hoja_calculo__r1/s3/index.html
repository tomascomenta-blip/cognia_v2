<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fafafa;
    color:#333;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .container{
    max-width:400px;
    width:100%;
    padding:20px;
    box-sizing:border-box;
  }
  #toolbar{
    background:#333;
    color:#fff;
    padding:10px;
    text-align:center;
    border-radius:4px;
    margin-bottom:10px;
  }
  #toolbar button{
    background:#555;
    color:#fff;
    border:none;
    padding:5px 12px;
    cursor:pointer;
    border-radius:3px;
    font-size:0.9rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }
  .celda{
    border:1px solid #ccc;
    background:#f9f9f9;
    padding:8px;
    font-size:1rem;
    text-align:center;
    width:100%;
    box-sizing:border-box;
    border-radius:3px;
    transition:box-shadow 0.2s;
  }
  .celda.active{
    box-shadow:0 0 5px 2px lightblue;
  }
  .celda.formula{
    background:#e0e0e0;
  }
</style>
</head>
<body>
<div class="container">
  <div id="toolbar">
    <button id="recalcBtn">Recalcular</button>
  </div>
  <div class="grid">
    <input type="text" class="celda" data-ref="A1" />
    <input type="text" class="celda" data-ref="A2" />
    <input type="text" class="celda" data-ref="A3" />
    <input type="text" class="celda" data-ref="B1" />
    <input type="text" class="celda" data-ref="B2" />
    <input type="text" class="celda" data-ref="B3" />
    <input type="text" class="celda" data-ref="C1" />
    <input type="text" class="celda" data-ref="C2" />
    <input type="text" class="celda" data-ref="C3" />
  </div>
</div>
<script>
'use strict';
const REF_REGEX = /^[A-C][1-3]$/;
const cells = {};
document.querySelectorAll('.celda').forEach(cell=>{
  cells[cell.dataset.ref] = cell;
  // initialize data-formula with current value
  cell.dataset.formula = cell.value;
});

function formatNumber(num){
  return num.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function evaluateCell(ref, stack){
  const cell = cells[ref];
  if(!cell) return 0;
  const formula = cell.dataset.formula;
  if(!formula || !formula.startsWith('=')) return parseFloat(formula)||0;
  if(stack.has(ref)) return 'CIRC';
  stack.add(ref);
  const expr = formula.slice(1);
  const tokens = expr.match(/([A-C][1-3])|(\d+(\.\d+)?)|[+-]/g);
  if(!tokens){ stack.delete(ref); return 0; }
  let result = 0;
  let op = '+';
  for(const tok of tokens){
    if(tok==='+'||tok==='-'){ op=tok; continue; }
    if(REF_REGEX.test(tok)){
      const val = evaluateCell(tok, stack);
      if(val==='CIRC'){ stack.delete(ref); return 'CIRC'; }
      const num = parseFloat(val)||0;
      result = op==='+'? result+num : result-num;
    }else{
      const num = parseFloat(tok)||0;
      result = op==='+'? result+num : result-num;
    }
  }
  stack.delete(ref);
  return result;
}

function recomputeAll(){
  Object.keys(cells).forEach(ref=>{
    const cell = cells[ref];
    const formula = cell.dataset.formula;
    if(formula && formula.startsWith('=')){
      const val = evaluateCell(ref, new Set());
      if(val==='CIRC'){
        cell.value='CIRC';
        cell.classList.add('formula');
      }else if(typeof val==='number'){
        cell.value=formatNumber(val);
        cell.classList.add('formula');
      }else{
        cell.value='';
        cell.classList.remove('formula');
      }
    }else{
      cell.classList.remove('formula');
    }
  });
}

document.querySelectorAll('.celda').forEach(cell=>{
  cell.addEventListener('input',()=>{
    cell.dataset.formula=cell.value;
  });
  cell.addEventListener('focus',()=>{
    if(cell.dataset.formula) cell.value=cell.dataset.formula;
    cell.classList.add('active');
  });
  cell.addEventListener('blur',()=>{
    cell.classList.remove('active');
    recomputeAll();
  });
});

document.getElementById('recalcBtn').addEventListener('click',recomputeAll);

recomputeAll();
</script>
</body>
</html>
