<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:sans-serif;background:#fafafa;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;}
  table{border-collapse:collapse;}
  .celda{
    width:80px;height:30px;border:1px solid #ccc;border-radius:5px;text-align:center;font-size:14px;background:#f9f9f9;
  }
  .celda.formula-result{font-weight:bold;color:#333;}
  .celda.circular{color:red;}
  .focus{background:#e0f7fa;}
  @media(max-width:400px){
    .celda{width:60px;height:25px;font-size:12px;}
  }
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda focus" data-ref="A1" value="5"></td>
    <td><input class="celda" data-ref="B1" value="10"></td>
    <td><input class="celda" data-ref="C1" value="15"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="A2" value="20"></td>
    <td><input class="celda" data-ref="B2" value="=A1+1"></td>
    <td><input class="celda" data-ref="C2" value="=B2+1"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="A3" value="50"></td>
    <td><input class="celda" data-ref="B3" value="60"></td>
    <td><input class="celda" data-ref="C3" value="=A1+B1+C1"></td>
  </tr>
</table>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const cells=document.querySelectorAll('.celda');
  const refMap={};
  const deps={}; // cell ref -> array of refs it depends on
  const revDeps={}; // ref -> array of dependents

  cells.forEach(cell=>{
    const ref=cell.dataset.ref;
    refMap[ref]=cell;
    cell.dataset.formula=cell.value.startsWith('=')?cell.value:'';
    if(cell.dataset.formula){
      const refs=parseRefs(cell.dataset.formula);
      deps[ref]=refs;
      refs.forEach(r=>{
        revDeps[r]=revDeps[r]||[];
        revDeps[r].push(ref);
      });
    }else{
      deps[ref]=[];
    }
  });

  // evaluate all cells initially
  Object.keys(refMap).forEach(ref=>evaluate(ref,[]));

  // add listeners for changes
  cells.forEach(cell=>{
    cell.addEventListener('input',function(){
      const ref=cell.dataset.ref;
      const val=cell.value;
      const newFormula=val.startsWith('=')?val:'';
      const oldFormula=cell.dataset.formula;
      cell.dataset.formula=newFormula;

      // update dependencies
      const oldDeps=deps[ref]||[];
      oldDeps.forEach(r=>{
        const arr=revDeps[r];
        if(arr){const i=arr.indexOf(ref);if(i>-1)arr.splice(i,1);}
      });
      const newDeps=parseRefs(newFormula);
      deps[ref]=newDeps;
      newDeps.forEach(r=>{
        revDeps[r]=revDeps[r]||[];
        revDeps[r].push(ref);
      });

      // evaluate this cell
      evaluate(ref,[]);

      // cascade recalculation
      recalcDependents(ref,new Set());
    });
  });

  function parseRefs(formula){
    const matches=formula.match(/[A-C][1-3]/g);
    return matches?Array.from(new Set(matches)):[];
  }

  function evaluate(ref,stack){
    if(stack.includes(ref)){
      const cell=refMap[ref];
      cell.value='CIRC';
      cell.classList.add('circular');
      cell.classList.remove('formula-result');
      return;
    }
    const cell=refMap[ref];
    const formula=cell.dataset.formula;
    if(!formula){
      cell.classList.remove('formula-result');
      cell.classList.remove('circular');
      return;
    }
    stack.push(ref);
    let expr=formula.slice(1); // remove '='
    const refs=parseRefs(formula);
    for(const r of refs){
      const val=refMap[r].value;
      if(val==='CIRC'){
        cell.value='CIRC';
        cell.classList.add('circular');
        cell.classList.remove('formula-result');
        stack.pop();
        return;
      }
      const num=parseFloat(val);
      expr=expr.replaceAll(r, isNaN(num)?'0':num);
    }
    let result;
    try{
      result=Function('return '+expr)();
      if(isNaN(result)) throw new Error();
    }catch(e){
      cell.value='CIRC';
      cell.classList.add('circular');
      cell.classList.remove('formula-result');
      stack.pop();
      return;
    }
    cell.value=result;
    cell.classList.add('formula-result');
    cell.classList.remove('circular');
    stack.pop();
  }

  function recalcDependents(ref,visited){
    const dependents=revDeps[ref]||[];
    dependents.forEach(d=>{
      if(visited.has(d)) return;
      visited.add(d);
      evaluate(d,[]);
      recalcDependents(d,visited);
    });
  }
});
</script>
</body>
</html>
