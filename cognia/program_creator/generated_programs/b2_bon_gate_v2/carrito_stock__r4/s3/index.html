<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con STOCK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f5f5;color:#333;}
  .container{display:flex;flex-wrap:wrap;gap:20px;padding:20px;min-height:calc(100vh-40px);}
  .left{flex:2;display:flex;flex-direction:column;gap:20px;}
  .right{flex:1;background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .prod{background:#fff;border-radius:8px;padding:15px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .prod .img{width:100%;height:120px;background:#e0e0e0;border-radius:4px;background-size:cover;background-position:center;}
  .prod .name{font-size:1.1rem;font-weight:bold;color:#333;}
  .prod .price{font-size:1rem;color:#4a8f8f;font-weight:bold;}
  .prod .stock{font-size:.9rem;color:#777;background:#e0f0f0;padding:2px 6px;border-radius:4px;}
  .prod .add{background:#4a8f8f;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:.9rem;transition:background .2s;}
  .prod .add:disabled{background:#a0c0c0;cursor:not-allowed;}
  .cart-title{font-size:1.2rem;font-weight:bold;margin-bottom:10px;}
  .linea{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e0e0e0;}
  .linea .info{flex:1;display:flex;flex-direction:column;gap:4px;}
  .linea .info .name{font-weight:bold;color:#333;}
  .linea .info .price{color:#4a8f8f;font-weight:bold;}
  .linea .cant{font-weight:bold;color:#333;margin-right:8px;}
  .linea .quitar{background:#ff4d4d;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:.8rem;transition:background .2s;}
  .linea .quitar:hover{background:#ff1a1a;}
  .linea .line-total{font-weight:bold;color:#4a8f8f;}
  .total{font-size:1.2rem;font-weight:bold;margin-top:20px;text-align:right;}
  @media (max-width:768px){.container{flex-direction:column;}.left,.right{flex:1;}}
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img"></div>
      <h3 class="name">Producto 1</h3>
      <span class="price">$100.00</span>
      <span class="stock">Stock: 2</span>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img"></div>
      <h3 class="name">Producto 2</h3>
      <span class="price">$50.00</span>
      <span class="stock">Stock: 3</span>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img"></div>
      <h3 class="name">Producto 3</h3>
      <span class="price">$25.00</span>
      <span class="stock">Stock: 1</span>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="right">
    <div class="cart-title">Resumen de carrito</div>
    <div id="cart-items"></div>
    <div class="total">Total: <span id="total">$0.00</span></div>
  </div>
</div>
<script>
  // Configuraciones
  const COLORS = {teal:'#4a8f8f', charcoal:'#333'};
  const PRODUCTS = {};
  const CART = {};

  // Inicializar datos de productos
  document.querySelectorAll('.prod').forEach(prod=>{
    const id = prod.dataset.id;
    const price = parseFloat(prod.dataset.precio);
    const stock = parseInt(prod.dataset.stock);
    const name = prod.querySelector('.name').textContent;
    PRODUCTS[id] = {price, stock, name};
  });

  // Formatear moneda
  function fmt(n){return '$'+n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});}

  // Actualizar carrito en pantalla
  function renderCart(){
    const container = document.getElementById('cart-items');
    container.innerHTML='';
    let total=0;
    for(const id in CART){
      const qty=CART[id];
      const {price,name} = PRODUCTS[id];
      const lineTotal=price*qty;
      total+=lineTotal;
      const line=document.createElement('div');
      line.className='linea';
      line.dataset.id=id;
      line.innerHTML=`<div class="info"><span class="name">${name}</span><span class="price">${fmt(price)}</span></div>
                      <div><span class="cant">${qty}</span><button class="quitar" data-id="${id}">Quitar</button></div>
                      <div class="line-total">${fmt(lineTotal)}</div>`;
      container.appendChild(line);
    }
    document.getElementById('total').textContent=fmt(total);
  }

  // Actualizar estado del botón Add
  function updateAddBtn(id){
    const qty=CART[id]||0;
    const stock=PRODUCTS[id].stock;
    const btn=document.querySelector(`.add[data-id="${id}"]`);
    btn.disabled=qty>=stock;
  }

  // Manejar clics en Add
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id;
      const stock=PRODUCTS[id].stock;
      const qty=CART[id]||0;
      if(qty<stock){
        CART[id]=qty+1;
        renderCart();
        updateAddBtn(id);
      }
    });
  });

  // Manejar clics en Quitar
  document.addEventListener('click',e=>{
    if(e.target.classList.contains('quitar')){
      const id=e.target.dataset.id;
      const qty=CART[id]||0;
      if(qty>0){
        CART[id]=qty-1;
        if(CART[id]===0) delete CART[id];
        renderCart();
        updateAddBtn(id);
      }
    }
  });

  // Render inicial
  window.addEventListener('load',()=>{renderCart();});
</script>
</body>
</html>
