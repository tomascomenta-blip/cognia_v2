<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:sans-serif;background:#fff;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;}
  table{border-collapse:collapse;}
  th,td{padding:0;}
  th{color:#888;font-weight:normal;text-align:center;width:80px;height:30px;}
  td.rownum{color:#888;text-align:center;width:30px;height:30px;}
  input.celda{width:80px;height:30px;border:1px solid #ccc;border-radius:4px;text-align:center;color:#777;font-size:14px;outline:none;}
  input.celda:focus{border:2px solid teal;}
  input.celda.formula{color:#333;font-weight:bold;}
</style>
</head>
<body>
<table>
  <tr>
    <th></th>
    <th>A</th>
    <th>B</th>
    <th>C</th>
  </tr>
  <tr>
    <td class="rownum">1</td>
    <td><input class="celda" data-ref="A1"></td>
    <td><input class="celda" data-ref="B1" data-formula="=A1+1"></td>
    <td><input class="celda" data-ref="C1" data-formula="=B1+1"></td>
  </tr>
  <tr>
    <td class="rownum">2</td>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="B2"></td>
    <td><input class="celda" data-ref="C2"></td>
  </tr>
  <tr>
    <td class="rownum">3</td>
    <td><input class="celda" data-ref="A3"></td>
    <td><input class="celda" data-ref="B3"></td>
    <td><input class="celda" data-ref="C3" data-formula="=A1+B1"></td>
  </tr>
</table>
<script>
const cells=document.querySelectorAll('.celda');
const refMap={};
cells.forEach(cell=>{refMap[cell.dataset.ref]=cell;});
function evaluateCell(cell,stack=[]) {
  const ref=cell.dataset.ref;
  if(stack.includes(ref)) {
    cell.value='CIRC';
    cell.classList.add('formula');
    return 'CIRC';
  }
  if(!cell.dataset.formula) {
    const val=cell.value.trim();
    const num=parseFloat(val);
    return isNaN(num)?'' : num;
  }
  const expr=cell.dataset.formula.slice(1);
  const replaced=expr.replace(/[A-C][1-3]/g,match=>{
    const refCell=refMap[match];
    if(!refCell)return '0';
    return evaluateCell(refCell,[...stack,ref]);
  });
  try{
    const result=eval(replaced);
    cell.value=result.toString();
    cell.classList.add('formula');
    return result;
  }catch(e){
    cell.value='CIRC';
    cell.classList.add('formula');
    return 'CIRC';
  }
}
function evaluateAll(){
  cells.forEach(cell=>{evaluateCell(cell);});
}
cells.forEach(cell=>{
  cell.addEventListener('input',e=>{
    const val=cell.value;
    if(val.startsWith('=')){
      cell.dataset.formula=val;
      cell.classList.add('formula');
    }else{
      delete cell.dataset.formula;
      cell.classList.remove('formula');
    }
    evaluateAll();
  });
});
window.addEventListener('load',evaluateAll);
</script>
</body>
</html>
