<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;background:#f0f0f0;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}
.grid{display:grid;grid-template-columns:repeat(3,80px);gap:5px;justify-content:center;align-items:center;}
.cell{position:relative;}
input.celda{width:80px;height:30px;background:#fff;border:none;text-align:right;font-size:14px;padding-right:20px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.check{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:12px;height:12px;display:none;}
</style>
</head>
<body>
<div class="grid">
<div class="cell"><input class="celda" data-ref="A1" value="1"></div>
<div class="cell"><input class="celda" data-ref="A2"></div>
<div class="cell"><input class="celda" data-ref="A3"></div>
<div class="cell"><input class="celda" data-ref="B1"></div>
<div class="cell"><input class="celda" data-ref="B2"></div>
<div class="cell"><input class="celda" data-ref="B3"></div>
<div class="cell"><input class="celda" data-ref="C1"></div>
<div class="cell"><input class="celda" data-ref="C2"></div>
<div class="cell"><input class="celda" data-ref="C3"></div>
</div>
<script>
const cells={};
document.querySelectorAll('input.celda').forEach(inp=>{
  const ref=inp.dataset.ref;
  cells[ref]=inp;
  inp.addEventListener('input',recalc);
});
function recalc(){Object.values(cells).forEach(inp=>{if(inp.value.startsWith('='))evalCell(inp.dataset.ref,new Set());else hideCheck(inp);});}
function evalCell(ref,vis){if(vis.has(ref))return 'CIRC';vis.add(ref);const inp=cells[ref];let val=inp.value;if(!val.startsWith('='))return val;const expr=val.slice(1).replace(/[A-C][1-3]/g,r=>{const v=evalCell(r,vis);return v==='CIRC'?v:parseFloat(v)||0;});if(expr.includes('CIRC')){inp.value='CIRC';hideCheck(inp);return 'CIRC';}try{const res=eval(expr);inp.value=res.toString();showCheck(inp);return res;}catch{inp.value='CIRC';hideCheck(inp);return 'CIRC';}vis.delete(ref);}
function showCheck(inp){const span=inp.parentNode.querySelector('.check');if(!span){const s=document.createElement('span');s.className='check';s.innerHTML='<svg viewBox="0 0 20 20"><polyline points="4 10 8 14 16 6" stroke="teal" stroke-width="2" fill="none"/></svg>';inp.parentNode.appendChild(s);}span.style.display='inline';}
function hideCheck(inp){const span=inp.parentNode.querySelector('.check');if(span)span.style.display='none';}
</script>
</body>
</html>
