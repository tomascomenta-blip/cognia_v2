<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con STOCK</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    display:flex;
    justify-content:center;
  }
  .container{
    max-width:600px;
    width:100%;
    padding:20px;
    background:#fff;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    margin-top:20px;
    margin-bottom:20px;
  }
  .prod{
    display:flex;
    align-items:center;
    margin-bottom:15px;
    background:#fafafa;
    padding:10px;
    border-radius:5px;
  }
  .img-placeholder{
    width:60px;
    height:60px;
    background:#ddd;
    border-radius:5px;
    margin-right:10px;
  }
  .prod-info{
    flex:1;
  }
  .prod-info h3{
    margin:0 0 5px;
    font-size:1.1em;
  }
  .prod-info p{
    margin:0 0 5px;
    font-size:.9em;
  }
  .prod-info .price{
    color:#006666;
    font-weight:bold;
  }
  .prod-info .stock{
    color:#888;
  }
  .add{
    background:#008080;
    color:#fff;
    border:none;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
    font-size:.9em;
  }
  .add:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  .cart{
    position:sticky;
    bottom:0;
    background:#fff;
    padding:10px;
    border-top:1px solid #ccc;
  }
  .linea{
    display:flex;
    align-items:center;
    margin-bottom:5px;
  }
  .linea span.cant{
    margin:0 10px;
  }
  .quitar{
    background:#d9534f;
    color:#fff;
    border:none;
    padding:3px 6px;
    border-radius:3px;
    cursor:pointer;
    font-size:.8em;
  }
  .total{
    font-size:1.2em;
    font-weight:bold;
    margin-top:10px;
  }
  .total span{
    color:#008080;
  }
</style>
</head>
<body>
<div class="container">
  <h2>Productos</h2>
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <div class="img-placeholder"></div>
    <div class="prod-info">
      <h3>Producto 1</h3>
      <p class="price">Precio: 100 €</p>
      <p class="stock">Stock: 2</p>
    </div>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <div class="img-placeholder"></div>
    <div class="prod-info">
      <h3>Producto 2</h3>
      <p class="price">Precio: 50 €</p>
      <p class="stock">Stock: 3</p>
    </div>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <div class="img-placeholder"></div>
    <div class="prod-info">
      <h3>Producto 3</h3>
      <p class="price">Precio: 25 €</p>
      <p class="stock">Stock: 1</p>
    </div>
    <button class="add" data-id="p3">Añadir</button>
  </div>

  <div class="cart">
    <h3>Carrito</h3>
    <div id="lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>

<script>
(function(){
  const cart = {}; // {id: qty}
  const addBtns = document.querySelectorAll('.add');
  const linesContainer = document.getElementById('lines');
  const totalEl = document.getElementById('total');

  function formatCurrency(v){
    return v.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  }

  function updateTotal(){
    let sum = 0;
    for(const id in cart){
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      sum += cart[id] * price;
    }
    totalEl.textContent = formatCurrency(sum);
  }

  function updateAddButton(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock,10);
    const qty = cart[id] || 0;
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    btn.disabled = qty >= stock;
  }

  function renderLine(id){
    let line = document.querySelector(`.linea[data-id="${id}"]`);
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const name = prod.querySelector('.prod-info h3').textContent;
    const qty = cart[id] || 0;
    if(line){
      line.querySelector('.cant').textContent = qty;
    }else{
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `<span class="name">${name}</span>
                        <span class="cant">${qty}</span>
                        <button class="quitar" data-id="${id}">Quitar</button>`;
      linesContainer.appendChild(line);
      line.querySelector('.quitar').addEventListener('click', () => removeItem(id));
    }
  }

  function addItem(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock,10);
    const qty = cart[id] || 0;
    if(qty < stock){
      cart[id] = qty + 1;
      renderLine(id);
      updateAddButton(id);
      updateTotal();
    }
  }

  function removeItem(id){
    const qty = cart[id] || 0;
    if(qty > 0){
      cart[id] = qty - 1;
      if(cart[id] === 0){
        delete cart[id];
        const line = document.querySelector(`.linea[data-id="${id}"]`);
        if(line) line.remove();
      }else{
        renderLine(id);
      }
      updateAddButton(id);
      updateTotal();
    }
  }

  addBtns.forEach(btn=>{
    btn.addEventListener('click', () => addItem(btn.dataset.id));
  });

  // initial state
  updateTotal();
})();
</script>
</body>
</html>
