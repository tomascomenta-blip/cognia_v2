<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con STOCK</title>
<style>
:root{
  --bg:#f9f9f9;
  --card:#fff;
  --text:#333;
  --accent:#009688;
  --border:#e0e0e0;
}
body{
  margin:0;
  font-family:system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  display:flex;
  flex-wrap:wrap;
  min-height:100vh;
}
.products{
  flex:2;
  padding:1rem;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:1rem;
}
.prod{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:8px;
  padding:1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.prod .img{
  width:100%;
  height:120px;
  background:#ddd;
  border-radius:4px;
  margin-bottom:.5rem;
}
.prod .name{
  font-weight:600;
  margin-bottom:.5rem;
}
.prod .price{
  color:var(--accent);
  margin-bottom:.5rem;
}
.prod .stock{
  font-size:.9rem;
  color:#666;
  margin-bottom:.5rem;
}
.prod .add{
  padding:.5rem 1rem;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.prod .add:disabled{
  background:#aaa;
  cursor:not-allowed;
}
.cart{
  flex:1;
  padding:1rem;
  background:#fff;
  border-left:1px solid var(--border);
}
.cart h2{
  margin-top:0;
}
.linea{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:.5rem 0;
  border-bottom:1px solid var(--border);
}
.linea .info{
  flex:1;
}
.linea .cant{
  font-weight:600;
  margin-right:.5rem;
}
.linea .quitar{
  padding:.3rem .6rem;
  background:#e53935;
  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;
}
.total{
  margin-top:1rem;
  font-size:1.2rem;
  font-weight:700;
  text-align:right;
}
@media (max-width:768px){
  .container{
    flex-direction:column;
  }
  .cart{
    border-left:none;
    border-top:1px solid var(--border);
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img"></div>
      <div class="name">Producto 1</div>
      <div class="price">€100.00</div>
      <div class="stock">Stock: 2</div>
      <button class="add" data-id="p1">Agregar</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img"></div>
      <div class="name">Producto 2</div>
      <div class="price">€50.00</div>
      <div class="stock">Stock: 3</div>
      <button class="add" data-id="p2">Agregar</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img"></div>
      <div class="name">Producto 3</div>
      <div class="price">€25.00</div>
      <div class="stock">Stock: 1</div>
      <button class="add" data-id="p3">Agregar</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-items"></div>
    <div class="total">Total: <span id="total">€0.00</span></div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cart = {}; // id -> qty
  const addButtons = document.querySelectorAll('.add');
  addButtons.forEach(btn => btn.addEventListener('click', handleAdd));
  const cartItems = document.getElementById('cart-items');
  cartItems.addEventListener('click', function(e){
    if(e.target.classList.contains('quitar')){
      handleRemove(e);
    }
  });
  function handleAdd(e){
    const id = e.target.dataset.id;
    const prod = document.querySelector('.prod[data-id="'+id+'"]');
    const stock = parseInt(prod.dataset.stock);
    const qty = cart[id] || 0;
    if(qty < stock){
      cart[id] = qty + 1;
      renderCart();
      updateTotal();
      const addBtn = prod.querySelector('.add');
      addBtn.disabled = cart[id] >= stock;
    }
  }
  function handleRemove(e){
    const id = e.target.dataset.id;
    const qty = cart[id] || 0;
    if(qty > 0){
      cart[id] = qty - 1;
      if(cart[id] === 0){
        delete cart[id];
      }
      renderCart();
      updateTotal();
      const prod = document.querySelector('.prod[data-id="'+id+'"]');
      const addBtn = prod.querySelector('.add');
      addBtn.disabled = false;
    }
  }
  function renderCart(){
    cartItems.innerHTML = '';
    Object.keys(cart).forEach(id=>{
      const qty = cart[id];
      const prod = document.querySelector('.prod[data-id="'+id+'"]');
      const price = parseFloat(prod.dataset.precio);
      const line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      const info = document.createElement('div');
      info.className = 'info';
      info.textContent = prod.querySelector('.name').textContent + ' - €' + price.toFixed(2);
      line.appendChild(info);
      const qtySpan = document.createElement('span');
      qtySpan.className = 'cant';
      qtySpan.textContent = qty;
      line.appendChild(qtySpan);
      const removeBtn = document.createElement('button');
      removeBtn.className = 'quitar';
      removeBtn.dataset.id = id;
      removeBtn.textContent = 'Quitar';
      line.appendChild(removeBtn);
      cartItems.appendChild(line);
    });
  }
  function updateTotal(){
    let total = 0;
    Object.keys(cart).forEach(id=>{
      const qty = cart[id];
      const prod = document.querySelector('.prod[data-id="'+id+'"]');
      const price = parseFloat(prod.dataset.precio);
      total += qty * price;
    });
    const totalSpan = document.getElementById('total');
    totalSpan.textContent = total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }
});
</script>
</body>
</html>
