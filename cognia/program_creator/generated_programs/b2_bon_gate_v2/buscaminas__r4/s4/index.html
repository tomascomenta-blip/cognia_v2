<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5 con minas fijas</title>
<style>
  body{
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f0f0f0;
    font-family:sans-serif;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    border:1px solid #000;
    width:90vw;
    max-width:400px;
  }
  .c{
    background:#d3d3d3;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    transition:background .2s,box-shadow .2s;
  }
  .c:hover:not(.abierta):not(.bandera){
    background:linear-gradient(135deg,#e0e0e0,#c0c0c0);
  }
  .c.abierta{
    background:#fff;
    box-shadow:inset 0 0 5px rgba(0,0,0,.2);
    color:#00008b;
  }
  .c.abierta.mine{
    background:#ff0000;
    color:#fff;
    font-weight:bold;
  }
  .c.bandera{
    background:#d3d3d3;
    color:#ff0000;
    font-weight:bold;
  }
  #estado{
    margin-top:10px;
    text-align:center;
    font-size:1.2rem;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
  const mines=[6,12,18];
  const grid=document.getElementById('grid');
  const estado=document.getElementById('estado');
  const cells=[];
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='c';
    div.dataset.i=i;
    div.addEventListener('click',onLeftClick);
    div.addEventListener('contextmenu',onRightClick);
    grid.appendChild(div);
    cells.push(div);
  }
  function countAdj(i){
    const r=Math.floor(i/5),c=i%5;
    let count=0;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          const idx=nr*5+nc;
          if(mines.includes(idx))count++;
        }
      }
    }
    return count;
  }
  function openCell(cell){
    const i=parseInt(cell.dataset.i);
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
    if(mines.includes(i)){
      cell.classList.add('abierta','mine');
      cell.textContent='💣';
      estado.textContent='perdiste';
      return;
    }
    const adj=countAdj(i);
    cell.classList.add('abierta');
    if(adj>0)cell.textContent=adj;
    if(adj===0){
      const stack=[i];
      while(stack.length){
        const idx=stack.pop();
        const r=Math.floor(idx/5),c=idx%5;
        for(let dr=-1;dr<=1;dr++){
          for(let dc=-1;dc<=1;dc++){
            if(dr===0&&dc===0)continue;
            const nr=r+dr,nc=c+dc;
            if(nr>=0&&nr<5&&nc>=0&&nc<5){
              const nidx=nr*5+nc;
              const ncell=cells[nidx];
              if(ncell.classList.contains('abierta')||ncell.classList.contains('bandera'))continue;
              if(mines.includes(nidx)){
                ncell.classList.add('abierta','mine');
                ncell.textContent='💣';
                estado.textContent='perdiste';
                continue;
              }
              const nAdj=countAdj(nidx);
              ncell.classList.add('abierta');
              if(nAdj>0)ncell.textContent=nAdj;
              if(nAdj===0)stack.push(nidx);
            }
          }
        }
      }
    }
  }
  function onLeftClick(e){
    openCell(e.currentTarget);
  }
  function onRightClick(e){
    e.preventDefault();
    const cell=e.currentTarget;
    if(cell.classList.contains('abierta'))return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }
</script>
</body>
</html>
