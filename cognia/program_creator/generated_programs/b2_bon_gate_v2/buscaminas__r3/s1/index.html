<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Minesweeper 5x5</title><style>body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}header{display:flex;justify-content:space-between;width:100%;max-width:320px;margin-bottom:10px;}#score{font-size:1.2em;}#reset{padding:5px 10px;font-size:1em;}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:320px;position:relative;} .c{background:#4a90e2;color:#fff;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;user-select:none;transition:background .3s;box-shadow:0 2px 4px rgba(0,0,0,.2);} .c.abierta{background:#8bc34a;color:#333;} .c.bandera{background:#e53935;} #gameover{position:absolute;bottom:0;left:0;width:100%;height:30px;background:rgba(0,0,0,.6);color:#fff;font-size:1.5em;text-align:center;line-height:30px;display:none;} #estado{display:none;}</style></head><body><header><span id="score">0</span><button id="reset">Reset</button></header><div id="grid"></div><div id="gameover">Game Over</div><div id="estado"></div><script>const mines=[6,12,18],grid=document.getElementById('grid'),score=document.getElementById('score'),over=document.getElementById('gameover'),state=document.getElementById('estado');function n(i){const r=Math.floor(i/5),c=i%5;const l=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(!(dr===0&&dc===0)){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5)l.push(nr*5+nc);}return l;}function c(i){return n(i).filter(j=>mines.includes(j)).length;}function open(i){const cell=document.querySelector(`.c[data-i='${i}']`);if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;if(mines.includes(i)){cell.classList.add('abierta');cell.textContent='💣';over.style.display='block';state.textContent='perdiste';return;}const a=c(i);cell.classList.add('abierta');if(a>0)cell.textContent=a;score.textContent=parseInt(score.textContent)+1;if(a===0){const q=[i],v=new Set([i]);while(q.length){const cur=q.shift();for(const nb of n(cur)){if(v.has(nb))continue;v.add(nb);const nbCell=document.querySelector(`.c[data-i='${nb}']`);if(nbCell.classList.contains('abierta')||nbCell.classList.contains('bandera'))continue;const cnt=c(nb);nbCell.classList.add('abierta');if(cnt>0)nbCell.textContent=cnt;score.textContent=parseInt(score.textContent)+1;if(cnt===0)q.push(nb);}}}}function click(e){open(parseInt(e.currentTarget.dataset.i));}function right(e){e.preventDefault();const c=e.currentTarget;if(c.classList.contains('abierta'))return;c.classList.toggle('bandera');}document.getElementById('reset').addEventListener('click',()=>{grid.innerHTML='';for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;d.addEventListener('click',click);d.addEventListener('contextmenu',right);grid.appendChild(d);}score.textContent='0';over.style.display='none';state.textContent='';});for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;d.addEventListener('click',click);d.addEventListener('contextmenu',right);grid.appendChild(d);}</script></body></html>
