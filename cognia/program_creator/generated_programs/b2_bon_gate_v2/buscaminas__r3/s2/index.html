<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un buscaminas 5x5 con 3 minas</title>
<style>
  body{
    margin:0; padding:0; background:#222; color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; justify-content:center;
  }
  #grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:2px;
    width:100%; max-width:400px; border:1px solid #fff;
    padding:5px; box-sizing:border-box; background:#333;
    border-radius:4px;
  }
  .c{
    position:relative; aspect-ratio:1/1;
    background:#444; border:1px solid #333;
    box-shadow:inset 0 0 3px #000;
    color:#fff; font-size:1.5rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
    transition:background 0.2s, box-shadow 0.2s;
  }
  .c.abierta{ background:#0f7; box-shadow:0 0 5px #0ff; }
  .c.bandera{ background:#444; color:#ff0; }
  .c.mined{ background:#f00; color:#fff; font-weight:bold; }
  #estado{ margin-top:10px; font-size:1.2rem; }
  #instrucciones{ margin-top:5px; font-size:0.9rem; color:#ccc; text-align:center; }
</style>
</head>
<body>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>
<p id="instrucciones">Haz clic para abrir, clic derecho para colocar bandera.</p>
<script>
'use strict';
class Minesweeper {
  constructor() {
    this.grid = document.getElementById('grid');
    this.estado = document.getElementById('estado');
    this.cells = Array.from(this.grid.querySelectorAll('.c'));
    this.mines = new Set([6,12,18]);
    this.opened = new Set();
    this.flagged = new Set();
    this.gameOver = false;
    this.adjacentCounts = new Array(25).fill(0);
    this.computeAdjacents();
    this.cells.forEach((cell, i) => {
      cell.addEventListener('click', () => this.openCell(i));
      cell.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        this.toggleFlag(i);
      });
    });
  }
  computeAdjacents() {
    for (let i = 0; i < 25; i++) {
      let count = 0;
      this.getNeighbors(i).forEach(n => {
        if (this.mines.has(n)) count++;
      });
      this.adjacentCounts[i] = count;
    }
  }
  getNeighbors(i) {
    const neighbors = [];
    const row = Math.floor(i / 5);
    const col = i % 5;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = row + dr;
        const nc = col + dc;
        if (nr >= 0 && nr < 5 && nc >= 0 && nc < 5) {
          neighbors.push(nr * 5 + nc);
        }
      }
    }
    return neighbors;
  }
  openCell(i) {
    if (this.gameOver) return;
    if (this.flagged.has(i)) return;
    if (this.opened.has(i)) return;
    const cell = this.cells[i];
    if (this.mines.has(i)) {
      cell.classList.add('mined');
      cell.textContent = 'X';
      this.gameOver = true;
      this.estado.textContent = 'perdiste';
      return;
    }
    this.opened.add(i);
    cell.classList.add('abierta');
    const count = this.adjacentCounts[i];
    if (count > 0) {
      cell.textContent = count;
    } else {
      cell.textContent = '';
      this.cascadeOpen(i);
    }
  }
  cascadeOpen(start) {
    const queue = [start];
    while (queue.length) {
      const i = queue.shift();
      this.getNeighbors(i).forEach(n => {
        if (this.opened.has(n) || this.flagged.has(n) || this.mines.has(n)) return;
        const cell = this.cells[n];
        this.opened.add(n);
        cell.classList.add('abierta');
        const count = this.adjacentCounts[n];
        if (count > 0) {
          cell.textContent = count;
        } else {
          cell.textContent = '';
          queue.push(n);
        }
      });
    }
  }
  toggleFlag(i) {
    if (this.gameOver) return;
    if (this.opened.has(i)) return;
    const cell = this.cells[i];
    if (this.flagged.has(i)) {
      this.flagged.delete(i);
      cell.classList.remove('bandera');
      cell.textContent = '';
    } else {
      this.flagged.add(i);
      cell.classList.add('bandera');
      cell.textContent = '🚩';
    }
  }
}
document.addEventListener('DOMContentLoaded', () => {
  new Minesweeper();
});
</script>
</body>
</html>
