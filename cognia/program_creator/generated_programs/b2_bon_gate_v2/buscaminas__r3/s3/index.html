<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5 con 3 minas fijas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#fafafa;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    justify-content:center;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    max-width:320px;
    width:100%;
    margin:20px auto;
    background:#e0e0e0;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .c{
    background:#f0f0f0;
    border:1px solid #ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    user-select:none;
    aspect-ratio:1;
    transition:transform .1s,box-shadow .1s;
  }
  .c:hover{transform:translateY(-2px);}
  .c.abierta{
    background:#d0f0d0;
    box-shadow:0 0 8px 2px rgba(0,255,0,.5);
    color:#FFD700;
  }
  .c.bandera{background:#f0d0d0;}
  #estado{
    margin-top:10px;
    font-size:1.2rem;
    color:#d00;
  }
</style>
</head>
<body>
<div class="grid"></div>
<div id="estado"></div>
<script>
  const mines = new Set([6,12,18]);
  const grid = document.querySelector('.grid');
  const estado = document.getElementById('estado');

  // Create 25 cells
  for(let i=0;i<25;i++){
    const cell=document.createElement('div');
    cell.classList.add('c');
    cell.dataset.i=i;
    cell.addEventListener('click',()=>handleClick(i));
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      handleRightClick(i);
    });
    grid.appendChild(cell);
  }

  // Precompute neighbors
  const neighbors={};
  for(let i=0;i<25;i++){
    const r=Math.floor(i/5), c=i%5;
    const list=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<5 && nc>=0 && nc<5) list.push(nr*5+nc);
      }
    }
    neighbors[i]=list;
  }

  function handleClick(i){
    const cell=document.querySelector(`.c[data-i="${i}"]`);
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera')) return;
    if(mines.has(i)){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      return;
    }
    openCell(i);
  }

  function handleRightClick(i){
    const cell=document.querySelector(`.c[data-i="${i}"]`);
    if(cell.classList.contains('abierta')) return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }

  function openCell(i){
    const cell=document.querySelector(`.c[data-i="${i}"]`);
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera')) return;
    const count=neighbors[i].filter(n=>mines.has(n)).length;
    cell.classList.add('abierta');
    cell.textContent=count>0?count:'';
    if(count===0){
      neighbors[i].forEach(n=>openCell(n));
    }
  }
</script>
</body>
</html>
