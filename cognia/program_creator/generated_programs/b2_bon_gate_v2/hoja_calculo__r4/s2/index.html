<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
body{font-family:monospace;background:#f5f5f5;margin:0;height:100vh;display:flex;align-items:center;justify-content:center;}
table{border-collapse:collapse;}
.celda{width:80px;height:80px;text-align:center;font-size:1.2em;border:1px solid #ccc;background:#fff;box-sizing:border-box;}
.celda.formula{background:#e0f0ff;}
.celda input{width:100%;height:100%;border:none;background:inherit;font-family:inherit;font-size:inherit;text-align:center;outline:none;}
</style>
</head>
<body>
<table>
<tr>
<td><input class="celda" data-ref="A1" /></td>
<td><input class="celda" data-ref="B1" /></td>
<td><input class="celda" data-ref="C1" /></td>
</tr>
<tr>
<td><input class="celda" data-ref="A2" /></td>
<td><input class="celda" data-ref="B2" /></td>
<td><input class="celda" data-ref="C2" /></td>
</tr>
<tr>
<td><input class="celda" data-ref="A3" /></td>
<td><input class="celda" data-ref="B3" /></td>
<td><input class="celda" data-ref="C3" value="=A1+B1-A2" /></td>
</tr>
</table>
<script>
const cells=document.querySelectorAll('.celda');
const refs={};
cells.forEach(c=>refs[c.dataset.ref]=c);
function evalCell(ref, stack=[]) {
  const cell=refs[ref];
  const formula=cell.dataset.formula;
  if (!formula) return cell.value;
  if (stack.includes(ref)) return 'CIRC';
  stack.push(ref);
  const expr=formula.slice(1).replace(/[A-C][1-3]/g, r=>{
    const res=evalCell(r, stack);
    return res==='CIRC'?'CIRC':res;
  });
  if (expr.includes('CIRC')) {stack.pop();return 'CIRC';}
  try{const result=eval(expr);stack.pop();return result.toString();}catch(e){stack.pop();return 'CIRC';}
}
function updateAll(){
  cells.forEach(c=>{
    const ref=c.dataset.ref;
    const res=evalCell(ref);
    if (c.dataset.formula) c.value=res;
  });
}
cells.forEach(c=>{
  if (c.value.startsWith('=')){
    c.dataset.formula=c.value;
    c.classList.add('formula');
  }
  c.addEventListener('input',function(){
    if (this.value.startsWith('=')){
      this.dataset.formula=this.value;
      this.classList.add('formula');
    } else {
      delete this.dataset.formula;
      this.classList.remove('formula');
    }
    updateAll();
  });
});
updateAll();
</script>
</body>
</html>
