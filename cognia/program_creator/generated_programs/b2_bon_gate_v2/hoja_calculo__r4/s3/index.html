<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  #container{
    background:#fff;
    padding:20px;
    border:1px solid #ccc;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    border-radius:4px;
    max-width:400px;
    width:100%;
  }
  #toolbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:10px;
  }
  #toolbar button{
    padding:5px 10px;
    border:1px solid #ccc;
    background:#fff;
    border-radius:3px;
    cursor:pointer;
    font-size:14px;
    transition:background 0.2s;
  }
  #toolbar button:hover{background:#f5f5f5;}
  #grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
  }
  .celda{
    width:100%;
    box-sizing:border-box;
    padding:5px;
    border:1px solid #ccc;
    border-radius:3px;
    font-size:14px;
    background:#fff;
    transition:border-color 0.2s;
  }
  .celda:focus{
    outline:none;
    border-color:#4a90e2;
    box-shadow:0 0 3px rgba(74,144,226,0.5);
  }
  .celda.formula{
    font-weight:bold;
    color:#000;
  }
  @media(max-width:480px){
    #container{padding:10px;}
    .celda{font-size:12px;}
    #toolbar button{font-size:12px;}
  }
</style>
</head>
<body>
<div id="container">
  <div id="toolbar">
    <button id="undoBtn">Deshacer</button>
    <button id="redoBtn">Rehacer</button>
    <button id="clearBtn">Limpiar</button>
  </div>
  <div id="grid">
    <input type="text" class="celda" data-ref="A1" value="10">
    <input type="text" class="celda" data-ref="B1" value="5">
    <input type="text" class="celda" data-ref="C1">
    <input type="text" class="celda" data-ref="A2" value="3">
    <input type="text" class="celda" data-ref="B2" data-formula="=C2">
    <input type="text" class="celda" data-ref="C2" data-formula="=B2">
    <input type="text" class="celda" data-ref="A3">
    <input type="text" class="celda" data-ref="B3">
    <input type="text" class="celda" data-ref="C3" data-formula="=A1+B1-A2">
  </div>
</div>
<script>
class Spreadsheet {
  constructor(){
    this.cells = {}; // ref -> element
    this.history = [];
    this.redoStack = [];
    this.isUpdating = false;
    this.init();
  }
  init(){
    const inputs = document.querySelectorAll('.celda');
    inputs.forEach(el=>{
      const ref = el.dataset.ref;
      this.cells[ref] = el;
      el.addEventListener('input', e=>this.onInput(e));
    });
    document.getElementById('undoBtn').addEventListener('click',()=>this.undo());
    document.getElementById('redoBtn').addEventListener('click',()=>this.redo());
    document.getElementById('clearBtn').addEventListener('click',()=>this.clear());
    this.evaluateAll();
  }
  onInput(e){
    if(this.isUpdating) return;
    const el = e.target;
    const ref = el.dataset.ref;
    const val = el.value;
    if(val.startsWith('=')){
      el.dataset.formula = val;
    }else{
      delete el.dataset.formula;
    }
    this.pushHistory();
    this.evaluateAll();
  }
  pushHistory(){
    this.history.push(this.getSnapshot());
    this.redoStack = [];
  }
  getSnapshot(){
    const snap = {};
    for(const ref in this.cells){
      const el = this.cells[ref];
      snap[ref] = {
        value: el.value,
        formula: el.dataset.formula || null
      };
    }
    return snap;
  }
  restoreSnapshot(snap){
    for(const ref in snap){
      const el = this.cells[ref];
      el.value = snap[ref].value;
      if(snap[ref].formula){
        el.dataset.formula = snap[ref].formula;
      }else{
        delete el.dataset.formula;
      }
      if(el.dataset.formula){
        el.classList.add('formula');
      }else{
        el.classList.remove('formula');
      }
    }
  }
  undo(){
    if(this.history.length===0) return;
    const current = this.getSnapshot();
    const prev = this.history.pop();
    this.redoStack.push(current);
    this.restoreSnapshot(prev);
  }
  redo(){
    if(this.redoStack.length===0) return;
    const current = this.getSnapshot();
    const next = this.redoStack.pop();
    this.history.push(current);
    this.restoreSnapshot(next);
  }
  clear(){
    this.pushHistory();
    for(const ref in this.cells){
      const el = this.cells[ref];
      el.value = '';
      delete el.dataset.formula;
      el.classList.remove('formula');
    }
    this.evaluateAll();
  }
  evaluateAll(){
    this.isUpdating = true;
    for(const ref in this.cells){
      const val = this.evaluateCell(ref, new Set());
      const el = this.cells[ref];
      if(val === 'CIRC'){
        el.value = 'CIRC';
        el.classList.add('formula');
      }else if(el.dataset.formula){
        // formula cell
        const formatted = val.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
        el.value = formatted;
        el.classList.add('formula');
      }else{
        // static cell
        // keep original value
        el.classList.remove('formula');
      }
    }
    this.isUpdating = false;
  }
  evaluateCell(ref, stack){
    if(stack.has(ref)) return 'CIRC';
    stack.add(ref);
    const el = this.cells[ref];
    if(!el.dataset.formula){
      const num = parseFloat(el.value);
      stack.delete(ref);
      return isNaN(num)?0:num;
    }
    const exprRaw = el.dataset.formula.slice(1); // remove '='
    let expr = exprRaw.replace(/[A-C][1-3]/g, r=>{
      const v = this.evaluateCell(r, stack);
      if(v==='CIRC') return 'CIRC';
      return v;
    });
    if(expr.includes('CIRC')){
      stack.delete(ref);
      return 'CIRC';
    }
    try{
      const num = Function('return '+expr)();
      stack.delete(ref);
      return isNaN(num)?0:num;
    }catch(e){
      stack.delete(ref);
      return 0;
    }
  }
}
document.addEventListener('DOMContentLoaded',()=>new Spreadsheet());
</script>
</body>
</html>
