<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><title>Mini hoja</title>
<style>
body{font:14px/1.5 sans-serif;background:#f0f4f7;margin:0;height:100vh;display:flex;align-items:center;justify-content:center;}
table{border-collapse:collapse;}
input.celda{width:80px;height:30px;text-align:right;padding:5px;border:1px solid #c0c0c0;background:#fff;}
input.celda::placeholder{color:#888;}
input.celda[data-formula]{font-weight:bold;}
</style>
</head>
<body>
<table>
<tr><td><input class="celda" data-ref="A1" placeholder="A1"></td><td><input class="celda" data-ref="B1" placeholder="B1"></td><td><input class="celda" data-ref="C1" placeholder="C1"></td></tr>
<tr><td><input class="celda" data-ref="A2" placeholder="A2"></td><td><input class="celda" data-ref="B2" placeholder="B2"></td><td><input class="celda" data-ref="C2" placeholder="C2"></td></tr>
<tr><td><input class="celda" data-ref="A3" placeholder="A3"></td><td><input class="celda" data-ref="B3" placeholder="B3"></td><td><input class="celda" data-ref="C3" placeholder="C3"></td></tr>
</table>
<script>
const cells=document.querySelectorAll('input.celda'), refs={};
cells.forEach(c=>refs[c.dataset.ref]=c);
function build(){Object.keys(refs).forEach(r=>refs[r].depend=[]);
Object.keys(refs).forEach(r=>{
const v=refs[r].value; if(v.startsWith('=')){
const rs=v.slice(1).match(/[A-C][1-3]/g)||[]; rs.forEach(x=>refs[x].depend.push(r));
}}}
function evalCell(r,stack){const c=refs[r]; const v=c.value;
if(v.startsWith('=')){
if(stack.includes(r)){c.value='CIRC';return;}
stack.push(r);
const expr=v.slice(1).replace(/[A-C][1-3]/g, m=>{
const val=refs[m].value; if(val==='CIRC') return '0';
return isNaN(parseFloat(val))?'0':val;
});
try{c.value=eval(expr).toString();}catch{c.value='CIRC';}
stack.pop();
}else{c.removeAttribute('data-formula');}
}
function recalc(r){evalCell(r,[]); refs[r].depend.forEach(d=>recalc(d));}
cells.forEach(c=>{
c.addEventListener('input',e=>{
const v=c.value; if(v.startsWith('=')) c.setAttribute('data-formula',v); else c.removeAttribute('data-formula');
build(); recalc(c.dataset.ref);
});
});
</script>
</body>
</html>
