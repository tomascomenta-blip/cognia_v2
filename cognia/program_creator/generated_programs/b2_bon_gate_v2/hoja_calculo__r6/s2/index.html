<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
  }
  .grid{
    display:grid;
    grid-template-columns:30px repeat(3,70px);
    grid-template-rows:30px repeat(3,70px);
    gap:0;
    background:#fff;
    border:1px solid #ccc;
  }
  .grid label{
    display:flex;
    justify-content:center;
    align-items:center;
    color:#006666;
    font-size:0.9rem;
    font-weight:bold;
  }
  .grid input{
    width:70px;
    height:70px;
    box-sizing:border-box;
    border:1px solid #ccc;
    text-align:right;
    padding-right:5px;
    font-size:1rem;
    background:#fff;
  }
  .grid input:hover{
    background:#e0f7ff;
  }
  .grid input.depends{
    box-shadow:0 0 5px 2px rgba(0,255,0,0.5);
  }
  button{
    margin-top:10px;
    padding:5px 15px;
    font-size:1rem;
    cursor:pointer;
  }
  @media (max-width:400px){
    .grid input{width:50px;height:50px;font-size:0.8rem;}
    .grid label{font-size:0.8rem;}
  }
</style>
</head>
<body>
<div class="grid">
  <!-- Top labels -->
  <label></label><label>A</label><label>B</label><label>C</label>
  <!-- Row A -->
  <label>A</label>
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <!-- Row B -->
  <label>B</label>
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <!-- Row C -->
  <label>C</label>
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>
<button id="recalcBtn">Recalculate</button>

<script>
(() => {
  const cells = {}; // ref -> {el, refs:Set, dependents:Set}
  const refRegex = /[A-C][1-3]/g;

  // Initialize cells
  document.querySelectorAll('.celda').forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = {el, refs:new Set(), dependents:new Set()};
    el.addEventListener('input', onCellChange);
    el.addEventListener('focus', onCellFocus);
    el.addEventListener('blur', onCellBlur);
  });

  // Build initial dependencies
  Object.keys(cells).forEach(ref => updateDependencies(ref));

  // Initial calculation
  recalcAll();

  // Recalculate button
  document.getElementById('recalcBtn').addEventListener('click', recalcAll);

  function onCellChange(e){
    const ref = e.target.dataset.ref;
    updateDependencies(ref);
    recalcCell(ref, []);
    propagate(ref, []);
  }

  function onCellFocus(e){
    const ref = e.target.dataset.ref;
    const dependents = cells[ref].dependents;
    dependents.forEach(d => cells[d].el.classList.add('depends'));
  }

  function onCellBlur(e){
    const ref = e.target.dataset.ref;
    const dependents = cells[ref].dependents;
    dependents.forEach(d => cells[d].el.classList.remove('depends'));
  }

  function updateDependencies(ref){
    const cell = cells[ref];
    // Remove this cell from old dependencies
    cell.refs.forEach(r => cells[r].dependents.delete(ref));
    // Parse new references
    const val = cell.el.value;
    const newRefs = new Set();
    if(val.startsWith('=')){
      const matches = val.match(refRegex);
      if(matches) matches.forEach(r => newRefs.add(r));
    }
    cell.refs = newRefs;
    // Add this cell to new dependencies
    newRefs.forEach(r => cells[r].dependents.add(ref));
  }

  function recalcCell(ref, stack){
    const cell = cells[ref];
    const val = cell.el.value;
    if(!val.startsWith('=')){
      // Non-formula, keep as is
      return;
    }
    if(stack.includes(ref)){
      cell.el.value = 'CIRC';
      return;
    }
    stack.push(ref);
    const expr = val.slice(1).replace(refRegex, match => {
      const depVal = cells[match].el.value;
      if(depVal === 'CIRC') return '0';
      if(depVal === '') return '0';
      return depVal;
    });
    let result;
    try{
      result = eval(expr);
      if(isNaN(result)) throw new Error();
    }catch{
      result = 'CIRC';
    }
    cell.el.value = result;
    stack.pop();
  }

  function propagate(ref, stack){
    const dependents = Array.from(cells[ref].dependents);
    dependents.forEach(d => {
      recalcCell(d, stack.slice());
      propagate(d, stack.slice());
    });
  }

  function recalcAll(){
    Object.keys(cells).forEach(ref => recalcCell(ref, []));
  }
})();
</script>
</body>
</html>
