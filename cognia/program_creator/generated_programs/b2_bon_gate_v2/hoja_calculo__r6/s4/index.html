<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#fafafa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    width:100%;
    max-width:300px;
  }
  .cell{
    position:relative;
  }
  input.celda{
    width:100%;
    height:100%;
    box-sizing:border-box;
    border:1px solid #555;
    background:#fff;
    font-size:1em;
    text-align:center;
    padding:0;
    aspect-ratio:1/1;
  }
  input.celda:focus{
    outline:2px solid teal;
    outline-offset:2px;
  }
  input.celda.formula{
    font-weight:bold;
  }
  input.celda.error{
    color:red;
  }
  .cell::after{
    content:attr(data-ref);
    position:absolute;
    top:2px;
    left:2px;
    font-size:0.7em;
    color:#999;
    pointer-events:none;
  }
  .cell[data-ref="A1"]::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:20px;
    background:#e0e0e0;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><input class="celda" data-ref="A1"></div>
  <div class="cell"><input class="celda" data-ref="A2"></div>
  <div class="cell"><input class="celda" data-ref="A3"></div>
  <div class="cell"><input class="celda" data-ref="B1"></div>
  <div class="cell"><input class="celda" data-ref="B2"></div>
  <div class="cell"><input class="celda" data-ref="B3"></div>
  <div class="cell"><input class="celda" data-ref="C1"></div>
  <div class="cell"><input class="celda" data-ref="C2"></div>
  <div class="cell"><input class="celda" data-ref="C3"></div>
</div>
<script>
"use strict";
document.addEventListener('DOMContentLoaded', () => {
  const cells = Array.from(document.querySelectorAll('input.celda'));

  // Demo initial values
  const init = () => {
    document.querySelector('input[data-ref="A1"]').value = '10';
    document.querySelector('input[data-ref="B1"]').value = '=A1+1';
    document.querySelector('input[data-ref="C1"]').value = '=B1+1';
  };

  // Evaluate a single cell recursively
  const evaluateCell = (cell, stack = []) => {
    if (stack.includes(cell)) return 'CIRC';
    stack.push(cell);
    let expr = cell.value.slice(1); // remove '='
    expr = expr.replace(/[A-C][1-3]/g, ref => {
      const refCell = document.querySelector(`input[data-ref="${ref}"]`);
      if (!refCell) return '0';
      const val = evaluateCell(refCell, stack);
      return val === 'CIRC' ? 'CIRC' : val;
    });
    if (expr.includes('CIRC')) {
      stack.pop();
      return 'CIRC';
    }
    let result;
    try {
      result = Function(`return ${expr}`)();
      if (typeof result === 'number' && !isNaN(result)) {
        result = result.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
      } else {
        result = 'CIRC';
      }
    } catch (e) {
      result = 'CIRC';
    }
    stack.pop();
    return result;
  };

  // Evaluate all formulas
  const evaluateAll = () => {
    cells.forEach(cell => {
      if (cell.value.startsWith('=')) {
        const val = evaluateCell(cell);
        cell.value = val;
        cell.classList.add('formula');
        if (val === 'CIRC') {
          cell.classList.add('error');
        } else {
          cell.classList.remove('error');
        }
      } else {
        cell.classList.remove('formula');
        cell.classList.remove('error');
      }
    });
  };

  // Attach listeners
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      evaluateAll();
    });
  });

  // Run demo
  init();
  evaluateAll();

  // After 2 seconds, create a circular reference to demonstrate detection
  setTimeout(() => {
    document.querySelector('input[data-ref="A1"]').value = '=C1';
    evaluateAll();
  }, 2000);
});
</script>
</body>
</html>
