<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban</title>
<style>
body{font-family:sans-serif;margin:0;padding:0;background:#f0f0f0;}
#board{display:flex;gap:10px;padding:10px;flex-wrap:wrap;}
.col{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1);flex:1;min-width:200px;display:flex;flex-direction:column;}
.col h3{margin:0;padding:8px;background:#e0e0e0;border-bottom:1px solid #ccc;}
.card{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin:8px;padding:8px;}
button{background:#008080;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer;}
button:disabled{background:#bbb;}
</style>
</head>
<body>
<div id="board">
<div class="col" data-col="todo"><h3>Todo <span id="cont-todo"></span></h3></div>
<div class="col" data-col="doing"><h3>Doing <span id="cont-doing"></span></h3></div>
<div class="col" data-col="done"><h3>Done <span id="cont-done"></span></h3></div>
</div>
<script>
function addCard(col, id){const c=document.createElement('div');c.className='card';c.dataset.id=id;c.innerHTML=`${id}<div><button class="menos">←</button><button class="mas">→</button></div>`;col.appendChild(c);}
function update(){document.querySelectorAll('.col').forEach(col=>{const cnt=col.querySelectorAll('.card').length;col.querySelector('span').textContent=cnt;});}
function move(card, dir){const col=card.parentElement;const cols=document.querySelectorAll('.col');const idx=Array.from(cols).indexOf(col);let targetIdx=dir==='mas'?idx+1:idx-1;if(targetIdx<0||targetIdx>=cols.length)return;const target=cols[targetIdx];if(target.dataset.col==='doing'&&target.querySelectorAll('.card').length>=2)return;target.appendChild(card);update();}
document.addEventListener('DOMContentLoaded',()=>{const todo=document.querySelector('[data-col="todo"]');['t1','t2','t3'].forEach(id=>addCard(todo,id));update();document.querySelectorAll('.card').forEach(c=>{c.querySelector('.mas').addEventListener('click',()=>move(c,'mas'));c.querySelector('.menos').addEventListener('click',()=>move(c,'menos'));});});
</script>
</body>
</html>
