
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;padding:20px;}
  table{border-collapse:collapse;margin:auto;}
  td{border:1px solid #999;padding:0;}
  input.celda{
    width:80px;height:30px;text-align:right;padding:5px;
    border:none;background:#fff;font-size:14px;
  }
  input.celda:focus{outline:2px solid #4a90e2;}
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda" data-ref="A1"></td>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="A3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1"></td>
    <td><input class="celda" data-ref="B2"></td>
    <td><input class="celda" data-ref="B3"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1"></td>
    <td><input class="celda" data-ref="C2"></td>
    <td><input class="celda" data-ref="C3"></td>
  </tr>
</table>

<script>
(() => {
  const cells = document.querySelectorAll('input.celda');
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  // Evaluate a cell value (formula or literal)
  function evaluate(ref, visited = new Set()) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const cell = refMap[ref];
    const formula = cell.dataset.formula;
    if (!formula) {
      // Literal value
      const val = cell.value.trim();
      const num = parseFloat(val);
      visited.delete(ref);
      return isNaN(num) ? val : num;
    }
    // Parse formula (no leading '=')
    const expr = formula.slice(1).trim();
    const tokens = expr.split(/([+\-])/).filter(t => t !== '');
    let result = null;
    let op = null;
    for (let token of tokens) {
      token = token.trim();
      if (token === '+' || token === '-') {
        op = token;
        continue;
      }
      let val;
      if (/^[A-C][1-3]$/.test(token)) {
        val = evaluate(token, visited);
        if (val === 'CIRC') { visited.delete(ref); return 'CIRC'; }
      } else {
        val = parseFloat(token);
        if (isNaN(val)) { visited.delete(ref); return 'CIRC'; }
      }
      if (result === null) result = val;
      else {
        if (op === '+') result += val;
        else if (op === '-') result -= val;
      }
    }
    visited.delete(ref);
    return result;
  }

  // Recalculate all cells
  function recalcAll() {
    cells.forEach(c => {
      const ref = c.dataset.ref;
      const val = evaluate(ref);
      c.value = val;
    });
  }

  // Handle input changes
  cells.forEach(c => {
    c.addEventListener('input', () => {
      const val = c.value.trim();
      if (val.startsWith('=')) {
        c.dataset.formula = val;
      } else {
        delete c.dataset.formula;
      }
      recalcAll();
    });
  });

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
