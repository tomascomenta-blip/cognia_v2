<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3×3</title>
<style>
  html, body {margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;}
  .grid {display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;height:100%;width:100%;align-items:center;justify-items:center;}
  .celda {width:100%;height:100%;box-sizing:border-box;border:1px solid #ccc;font-size:1.5rem;text-align:right;padding:0 5px;background:#fff;}
  .celda:focus {outline:none;}
  .active {box-shadow:0 0 8px teal;}
  .flash {animation:flash 0.5s ease-out;}
  @keyframes flash{0%{background-color:#e0f7fa;}100%{background-color:transparent;}}
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="B1" placeholder="B1" value="=A1+1" data-formula="=A1+1">
  <input type="text" class="celda" data-ref="C1" placeholder="C1" value="=B1+1" data-formula="=B1+1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C3" placeholder="C3">
</div>
<script>
(() => {
  const cells = {};
  const ignoreInput = {value:false};

  // Build map of refs to elements
  document.querySelectorAll('.celda').forEach(el=>{
    const ref = el.dataset.ref;
    cells[ref] = el;
    el.placeholder = ref; // label
    el.addEventListener('focus',()=>el.classList.add('active'));
    el.addEventListener('blur',()=>el.classList.remove('active'));
    el.addEventListener('input',onInput);
    el.addEventListener('animationend',e=>{
      if(e.animationName==='flash') el.classList.remove('flash');
    });
  });

  function onInput(e){
    if(ignoreInput.value) return;
    const el = e.target;
    const val = el.value.trim();
    if(val.startsWith('=')){
      el.dataset.formula = val;
    }else{
      delete el.dataset.formula;
    }
    recomputeAll();
  }

  function recomputeAll(){
    const cache = new Map();
    const visited = new Set();
    ignoreInput.value = true;
    Object.keys(cells).forEach(ref=>{
      const el = cells[ref];
      if(el.dataset.formula){
        const newVal = evaluateCell(ref, cache, visited);
        if(el.value !== newVal){
          el.value = newVal;
          el.classList.add('flash');
        }
      }
    });
    ignoreInput.value = false;
  }

  function evaluateCell(ref, cache, visited){
    if(cache.has(ref)) return cache.get(ref);
    if(visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const el = cells[ref];
    if(!el.dataset.formula){
      const val = el.value.trim() || '0';
      cache.set(ref, val);
      return val;
    }
    const formula = el.dataset.formula;
    const expr = formula.slice(1).replace(/[A-C][1-3]/g, match=>{
      const val = evaluateCell(match, cache, visited);
      return val === 'CIRC' ? 'CIRC' : val;
    });
    if(expr.includes('CIRC')){
      cache.set(ref, 'CIRC');
      return 'CIRC';
    }
    let result;
    try{
      result = eval(expr);
    }catch{
      result = '';
    }
    const resStr = result === '' ? '' : result.toString();
    cache.set(ref, resStr);
    return resStr;
  }

  // Initial calculation
  recomputeAll();
})();
</script>
</body>
</html>
