
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .prod{background:#fff;border:1px solid #ccc;padding:10px;margin-bottom:10px;
        display:flex;justify-content:space-between;align-items:center;
        animation:slideIn 0.5s ease-out;}
  .prod button{padding:5px 10px;}
  .cart{background:#fff;border:1px solid #ccc;padding:10px;margin-top:20px;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .linea button{padding:3px 6px;}
  #total{font-weight:bold;}
  @keyframes slideIn{from{transform:translateX(-100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
</style>
</head>
<body>
<h1>Carrito de compra</h1>

<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - $100 (Stock: 2)</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - $50 (Stock: 3)</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - $25 (Stock: 1)</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<div class="cart">
  <h2>Carrito</h2>
  <div id="lines"></div>
  <div>Total: <span id="total">0</span></div>
</div>

<script>
  const cart = {}; // id -> quantity

  function updateTotal(){
    let total = 0;
    for(const id in cart){
      const qty = cart[id];
      const price = parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
      total += qty * price;
    }
    document.getElementById('total').textContent = total;
  }

  function updateAddButton(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const btn = prod.querySelector('.add');
    const stock = parseInt(prod.dataset.stock);
    const qty = cart[id] || 0;
    btn.disabled = qty >= stock;
  }

  function addProduct(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    const qty = cart[id] || 0;
    if(qty >= stock) return;

    cart[id] = qty + 1;

    let line = document.querySelector(`.linea[data-id="${id}"]`);
    if(!line){
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;

      const span = document.createElement('span');
      span.className = 'cant';
      span.textContent = '1';
      line.appendChild(span);

      const btn = document.createElement('button');
      btn.className = 'quitar';
      btn.dataset.id = id;
      btn.textContent = '-';
      line.appendChild(btn);

      document.getElementById('lines').appendChild(line);
      btn.addEventListener('click', () => removeProduct(id));
    }else{
      const span = line.querySelector('.cant');
      span.textContent = parseInt(span.textContent) + 1;
    }

    updateAddButton(id);
    updateTotal();
  }

  function removeProduct(id){
    const qty = cart[id];
    if(!qty) return;

    cart[id] = qty - 1;

    if(cart[id] === 0){
      const line = document.querySelector(`.linea[data-id="${id}"]`);
      line.remove();
      delete cart[id];
    }else{
      const line = document.querySelector(`.linea[data-id="${id}"]`);
      const span = line.querySelector('.cant');
      span.textContent = cart[id];
    }

    updateAddButton(id);
    updateTotal();
  }

  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => addProduct(btn.dataset.id));
  });
</script>
</body>
</html>
