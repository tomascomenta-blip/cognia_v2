<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:0;}
.container{display:flex;flex-wrap:wrap;}
.products,.cart{flex:1;min-width:260px;padding:20px;}
.prod{background:#fff;border:1px solid #ddd;border-radius:4px;padding:10px;margin-bottom:10px;}
.prod button{background:#008080;color:#fff;border:none;padding:5px 10px;border-radius:3px;cursor:pointer;}
.prod button:disabled{background:#aaa;cursor:not-allowed;}
.cart .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.cart .linea button{background:#008080;color:#fff;border:none;padding:3px 6px;border-radius:3px;cursor:pointer;}
.cart .linea button:disabled{background:#aaa;cursor:not-allowed;}
.cart .total{font-weight:bold;margin-top:10px;}
</style>
</head>
<body>
<div class="container">
<div class="products">
<div class="prod" data-id="p1" data-precio="100" data-stock="2">
<span class="name">Producto 1</span><br>
<span class="price"></span><br>
<button class="add" data-id="p1">Añadir</button>
</div>
<div class="prod" data-id="p2" data-precio="50" data-stock="3">
<span class="name">Producto 2</span><br>
<span class="price"></span><br>
<button class="add" data-id="p2">Añadir</button>
</div>
<div class="prod" data-id="p3" data-precio="25" data-stock="1">
<span class="name">Producto 3</span><br>
<span class="price"></span><br>
<button class="add" data-id="p3">Añadir</button>
</div>
</div>
<div class="cart">
<h3>Carrito</h3>
<div id="lines"></div>
<div class="total">Total: <span id="total">0,00 €</span></div>
</div>
</div>
<script>
const cart={};
document.querySelectorAll('.prod').forEach(el=>{
const id=el.dataset.id;
const price=parseFloat(el.dataset.precio);
el.querySelector('.price').textContent=price.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
el.querySelector('.add').addEventListener('click',()=>add(id));
});
function add(id){
const prod=document.querySelector(`.prod[data-id="${id}"]`);
const stock=parseInt(prod.dataset.stock);
const qty=cart[id]||0;
if(qty<stock){
cart[id]=qty+1;
updateLine(id);
if(cart[id]===stock) prod.querySelector('.add').disabled=true;
}
updateTotal();
}
function remove(id){
if(!cart[id])return;
cart[id]--;
if(cart[id]===0){delete cart[id];removeLine(id);}
else updateLine(id);
document.querySelector(`.prod[data-id="${id}"]`).querySelector('.add').disabled=false;
updateTotal();
}
function updateLine(id){
const qty=cart[id];
const line=document.querySelector(`.linea[data-id="${id}"]`);
if(line){
line.querySelector('.cant').textContent=qty;
}else{
const div=document.createElement('div');
div.className='linea';
div.dataset.id=id;
div.innerHTML=`<span class="cant">${qty}</span> <button class="quitar" data-id="${id}">Quitar</button>`;
div.querySelector('.quitar').addEventListener('click',()=>remove(id));
document.getElementById('lines').appendChild(div);
}
}
function removeLine(id){
const line=document.querySelector(`.linea[data-id="${id}"]`);
if(line)line.remove();
}
function updateTotal(){
let total=0;
for(const id in cart){
const qty=cart[id];
const price=parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
total+=qty*price;
}
document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
}
</script>
</body>
</html>
