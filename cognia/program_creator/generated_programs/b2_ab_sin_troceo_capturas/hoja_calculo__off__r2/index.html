<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e0e0e0;
    font-family:Arial,Helvetica,sans-serif;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    border:1px solid #333;
    background:#d0d0d0;
    padding:2px;
  }
  .celda{
    width:100%;
    height:40px;
    box-sizing:border-box;
    padding:0 5px;
    font-size:1rem;
    text-align:center;
    color:#fff;
    background:#444;
    border:none;
    outline:none;
  }
  .celda:focus{
    outline:2px solid #add8e6;
  }
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="=A1+1">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="=B1+1">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="=A1+B1">
</div>

<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  // Helper to evaluate a cell
  function evaluateCell(ref, visited = new Set()) {
    const cell = refMap[ref];
    if (!cell) return 'CIRC';
    const formula = cell.dataset.formula;
    if (!formula) {
      // Non-formula cell: return its current value
      return cell.value;
    }
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);

    // Replace references with evaluated values
    const expr = formula.slice(1).replace(/[A-C][1-3]/g, match => {
      const val = evaluateCell(match, visited);
      if (val === 'CIRC') return 'CIRC';
      return val;
    });

    if (expr.includes('CIRC')) return 'CIRC';

    // Evaluate arithmetic expression (+ and - only)
    try {
      // Safe eval: only numbers, +, -, parentheses
      const result = Function(`return ${expr}`)();
      return result.toString();
    } catch (e) {
      return 'CIRC';
    }
  }

  // Recompute all cells
  function recomputeAll() {
    cells.forEach(cell => {
      const formula = cell.dataset.formula;
      if (formula) {
        const val = evaluateCell(cell.dataset.ref);
        cell.value = val;
      }
    });
  }

  // Initialize: set data-formula attributes
  cells.forEach(cell => {
    if (cell.value.startsWith('=')) {
      cell.dataset.formula = cell.value;
    } else {
      delete cell.dataset.formula;
    }
  });

  // Event listeners
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      const val = cell.value;
      if (val.startsWith('=')) {
        cell.dataset.formula = val;
      } else {
        delete cell.dataset.formula;
      }
      recomputeAll();
    });
  });

  // Initial calculation
  recomputeAll();
})();
</script>
</body>
</html>
