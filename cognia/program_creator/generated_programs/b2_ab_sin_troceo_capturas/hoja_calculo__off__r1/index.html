<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;height:100vh;display:flex;align-items:center;justify-content:center;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:300px;}
.celda{padding:8px;border:1px solid #ddd;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);font-size:16px;text-align:right;}
.celda:focus{outline:none;border-color:#008080;}
.status{position:absolute;top:10px;left:10px;background:#e6ffe6;padding:4px 8px;border-radius:4px;font-weight:bold;color:#008000;display:flex;align-items:center;}
.status svg{margin-right:4px;}
</style>
</head>
<body>
<div class="status"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6l3 3 7-7" stroke="#008000" stroke-width="2" fill="none"/></svg>Éxito</div>
<div class="grid">
<input class="celda" data-ref="A1">
<input class="celda" data-ref="A2">
<input class="celda" data-ref="A3">
<input class="celda" data-ref="B1">
<input class="celda" data-ref="B2">
<input class="celda" data-ref="B3">
<input class="celda" data-ref="C1">
<input class="celda" data-ref="C2">
<input class="celda" data-ref="C3">
</div>
<script>
const cells=document.querySelectorAll('.celda');
function evalCell(ref,vis){if(vis.has(ref))return'CIRC';const c=document.querySelector(`[data-ref="${ref}"]`);if(!c)return0;const f=c.dataset.formula;if(!f)return parseFloat(c.value)||0;vis.add(ref);let e=f.slice(1).replace(/[A-C][1-3]/g,r=>evalCell(r,vis));if(e.includes('CIRC'))return'CIRC';try{return new Function('return '+e)();}catch{return0;}finally{vis.delete(ref);}}
function update(){cells.forEach(c=>{const f=c.dataset.formula;if(f){const v=evalCell(c.dataset.ref,new Set());c.value=v==='CIRC'?'CIRC':v;}});}
cells.forEach(c=>{c.addEventListener('input',e=>{const v=e.target.value;if(v.startsWith('=')){c.dataset.formula=v;update();}else{delete c.dataset.formula;update();}});});
</script>
</body>
</html>
