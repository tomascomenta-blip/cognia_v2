<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;background:#f0f0f0;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
#grid{display:grid;grid-template-columns:repeat(3,80px);gap:4px;background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cell{position:relative;width:80px;height:80px;border:1px solid #ddd;border-radius:4px}
.cell input{width:100%;height:100%;border:none;text-align:center;font-size:1rem;color:#333;background:#fafafa}
.cell input:focus{outline:none;border:1px solid #4a90e2;box-shadow:0 0 4px rgba(74,144,226,.5)}
.cell .ref{position:absolute;top:2px;left:2px;font-size:.7rem;color:#999}
.title-bar{position:absolute;top:0;left:0;background:#4a90e2;color:#fff;font-size:.8rem;padding:2px 6px;border-bottom-right-radius:4px}
</style>
</head>
<body>
<div class="title-bar">Mini Hoja</div>
<div id="grid">
  <div class="cell"><input class="celda" data-ref="A1"><span class="ref">A1</span></div>
  <div class="cell"><input class="celda" data-ref="A2"><span class="ref">A2</span></div>
  <div class="cell"><input class="celda" data-ref="A3"><span class="ref">A3</span></div>
  <div class="cell"><input class="celda" data-ref="B1"><span class="ref">B1</span></div>
  <div class="cell"><input class="celda" data-ref="B2"><span class="ref">B2</span></div>
  <div class="cell"><input class="celda" data-ref="B3"><span class="ref">B3</span></div>
  <div class="cell"><input class="celda" data-ref="C1"><span class="ref">C1</span></div>
  <div class="cell"><input class="celda" data-ref="C2"><span class="ref">C2</span></div>
  <div class="cell"><input class="celda" data-ref="C3"><span class="ref">C3</span></div>
</div>
<script>
const refs=['A1','A2','A3','B1','B2','B3','C1','C2','C3'];
const cells={};
refs.forEach(r=>{cells[r]=document.querySelector(`[data-ref="${r}"]`);});
function getVal(r,stack){const el=cells[r];const raw=el.value;if(!raw.startsWith('=')){const n=parseFloat(raw);return isNaN(n)?0:n;}if(stack.includes(r))return null;const v=evaluate(r,stack.concat(r));return v;}
function evaluate(r,stack){const el=cells[r];const raw=el.value;if(!raw.startsWith('='))return parseFloat(raw);const expr=raw.slice(1);const repl=expr.replace(/[A-C][1-3]/g,m=>{const v=getVal(m,stack.concat(r));return v!==null?v:'NaN';});let res;try{res=Function(`return ${repl}`)();}catch{res=NaN;}if(isNaN(res)){el.value='CIRC';return null;}el.value=res;return res;}
function recalc(){refs.forEach(r=>evaluate(r,[]));}
refs.forEach(r=>cells[r].addEventListener('input',recalc));
</script>
</body>
</html>
