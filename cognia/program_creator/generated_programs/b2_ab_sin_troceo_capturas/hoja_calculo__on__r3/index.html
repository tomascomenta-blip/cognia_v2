<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  html,body{margin:0;height:100%;font-family:sans-serif;background:#fff;}
  .grid{
    display:grid;
    grid-template-columns:30px repeat(3,1fr);
    grid-template-rows:30px repeat(3,1fr);
    gap:0;
    width:100%;
    max-width:400px;
    margin:50px auto;
  }
  .grid > *{border:1px solid #ddd;box-sizing:border-box;}
  .header,.rownum{
    background:#f9f9f9;
    color:#888;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .celda{
    width:100%;height:100%;
    padding:4px;
    font-size:1rem;
    text-align:right;
    background:#fff;
    border:none;
    outline:none;
    color:#333;
  }
  .celda:focus{outline:none;box-shadow:0 0 0 2px rgba(0,120,255,0.3);}
  .formula{color:#555;}
  .circular{color:#d00;}
</style>
</head>
<body>
<div class="grid">
  <div></div>
  <div class="header">A</div>
  <div class="header">B</div>
  <div class="header">C</div>
  <div class="rownum">1</div>
  <input class="celda" data-ref="A1" />
  <input class="celda" data-ref="B1" />
  <input class="celda" data-ref="C1" />
  <div class="rownum">2</div>
  <input class="celda" data-ref="A2" />
  <input class="celda" data-ref="B2" />
  <input class="celda" data-ref="C2" />
  <div class="rownum">3</div>
  <input class="celda" data-ref="A3" />
  <input class="celda" data-ref="B3" />
  <input class="celda" data-ref="C3" />
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cells = document.querySelectorAll('.celda');
  const cellMap = {};
  const allRefs = [];
  cells.forEach(cell=>{
    const ref = cell.dataset.ref;
    cellMap[ref] = cell;
    allRefs.push(ref);
    cell.addEventListener('input', onInput);
  });
  let isUpdating = false;
  function onInput(e){
    if(isUpdating) return;
    const el = e.target;
    const val = el.value;
    if(val.startsWith('=')){
      el.dataset.formula = val.slice(1);
    }else{
      delete el.dataset.formula;
    }
    evaluateAll();
  }
  function evaluateAll(){
    isUpdating = true;
    const cache = {};
    allRefs.forEach(ref=>{
      const el = cellMap[ref];
      if(el.dataset.formula){
        const result = evaluateCell(ref, cache, new Set());
        if(result==='CIRC'){
          el.value='CIRC';
          el.classList.add('circular');
          el.classList.remove('formula');
        }else{
          const formatted = typeof result==='number'?
            result.toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2}):result;
          el.value=formatted;
          el.classList.add('formula');
          el.classList.remove('circular');
        }
      }else{
        el.classList.remove('formula','circular');
      }
    });
    isUpdating = false;
  }
  function evaluateCell(ref, cache, visited){
    if(cache.hasOwnProperty(ref)) return cache[ref];
    if(visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const el = cellMap[ref];
    let result;
    if(el.dataset.formula){
      const formula = el.dataset.formula;
      const expr = formula.replace(/[A-C][1-3]/g, m=>{
        const v = evaluateCell(m, cache, visited);
        return v==='CIRC'?'NaN':v;
      });
      try{
        result = eval(expr);
        if(typeof result!=='number'||isNaN(result)) result='CIRC';
      }catch(e){ result='CIRC'; }
    }else{
      if(el.value==='CIRC'){
        result='CIRC';
      }else if(el.value.trim()===''){
        result=0;
      }else{
        result=parseFloat(el.value);
        if(isNaN(result)) result=0;
      }
    }
    visited.delete(ref);
    cache[ref]=result;
    return result;
  }
  evaluateAll();
});
</script>
</body>
</html>
