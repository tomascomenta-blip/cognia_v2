<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en una página</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f5f5f5;}
  header{background:#fff;padding:1rem;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.1);}
  header h1{margin:0;font-size:1.5rem;color:#333;}
  .toolbar{margin-top:.5rem;font-size:.9rem;color:#777;}
  .container{display:flex;flex-wrap:wrap;padding:1rem;gap:1rem;}
  .col{background:#fff;flex:1 1 calc(33.333% - 1rem);min-width:250px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;}
  .col-header{padding:.5rem .75rem;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;}
  .col-header h2{margin:0;font-size:1rem;color:#333;}
  .col-header span{font-size:.9rem;color:#777;}
  .cards{flex:1 1 auto;}
  .card{background:#fafafa;margin:.75rem;padding:.75rem;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center;}
  .card button{background:none;border:none;cursor:pointer;font-size:1rem;color:#777;margin-left:.25rem;}
  .card button.mas{color:#008080;}
  .card button.menos{color:#008080;}
  .card button:disabled{color:#ccc;cursor:not-allowed;}
  @media (max-width:600px){.col{flex:1 1 100%;}}
</style>
</head>
<body>
<header>
  <h1>Tablero Kanban</h1>
  <div class="toolbar">Arrastra las tarjetas o usa los botones para moverlas.</div>
</header>
<div class="container">
  <div class="col" data-col="todo">
    <div class="col-header"><h2>Todo</h2><span id="cont-todo">0</span></div>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="doing">
    <div class="col-header"><h2>Doing</h2><span id="cont-doing">0</span></div>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="done">
    <div class="col-header"><h2>Done</h2><span id="cont-done">0</span></div>
    <div class="cards"></div>
  </div>
</div>
<script>
function createCard(id){
  const card=document.createElement('div');
  card.className='card';
  card.dataset.id=id;
  card.textContent=id;
  const btnMas=document.createElement('button');
  btnMas.className='mas';
  btnMas.textContent='+';
  btnMas.addEventListener('click',()=>moveCard(card,1));
  const btnMenos=document.createElement('button');
  btnMenos.className='menos';
  btnMenos.textContent='-';
  btnMenos.addEventListener('click',()=>moveCard(card,-1));
  card.appendChild(btnMas);
  card.appendChild(btnMenos);
  return card;
}
function moveCard(card,dir){
  const currentCol=card.parentElement.parentElement;
  const cols=document.querySelectorAll('.col');
  const idx=Array.from(cols).indexOf(currentCol);
  const targetIdx=idx+dir;
  if(targetIdx<0||targetIdx>2)return;
  const targetCol=cols[targetIdx];
  // WIP rule
  if(targetCol.dataset.col==='doing' && targetCol.querySelectorAll('.card').length>=2)return;
  // Limits
  if(currentCol.dataset.col==='todo'&&dir===-1)return;
  if(currentCol.dataset.col==='done'&&dir===1)return;
  targetCol.querySelector('.cards').appendChild(card);
  updateCounters();
}
function updateCounters(){
  ['todo','doing','done'].forEach(col=>{
    const count=document.querySelectorAll(`.col[data-col="${col}"] .cards .card`).length;
    document.getElementById(`cont-${col}`).textContent=count;
  });
}
document.addEventListener('DOMContentLoaded',()=>{
  const todoCol=document.querySelector('.col[data-col="todo"] .cards');
  ['t1','t2','t3'].forEach(id=>todoCol.appendChild(createCard(id)));
  updateCounters();
});
</script>
</body>
</html>
