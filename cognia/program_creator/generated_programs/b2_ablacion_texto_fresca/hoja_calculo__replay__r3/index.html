
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  html, body {margin:0; padding:0; height:100%; width:100%; background:#f0f0f0; font-family:Arial, sans-serif;}
  #wrapper {display:flex; align-items:center; justify-content:center; width:100vw; height:100vh;}
  #grid {display:grid; grid-template-columns:repeat(3,1fr); grid-gap:2px; width:90vmin; height:90vmin;}
  .celda {
    width:100%; height:100%; box-sizing:border-box;
    border:1px solid #ccc; background:#fafafa; color:#000;
    font-size:1.2rem; text-align:right; padding:4px;
    transition:background-color .2s;
  }
  .celda.active {box-shadow:0 0 8px teal;}
  .celda.flash {animation:flash 0.5s;}
  @keyframes flash {from{background-color:#e0f7ff;} to{background-color:transparent;}}
</style>
</head>
<body>
<div id="wrapper">
  <div id="grid">
    <input type="text" class="celda" data-ref="A1" value="5">
    <input type="text" class="celda" data-ref="A2">
    <input type="text" class="celda" data-ref="A3">
    <input type="text" class="celda" data-ref="B1" value="=A1+1">
    <input type="text" class="celda" data-ref="B2">
    <input type="text" class="celda" data-ref="B3">
    <input type="text" class="celda" data-ref="C1" value="=B1+1">
    <input type="text" class="celda" data-ref="C2">
    <input type="text" class="celda" data-ref="C3">
  </div>
</div>
<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const dependents = {}; // ref -> Set of refs that depend on it

  function getCell(ref) { return cells.find(c => c.dataset.ref === ref); }

  function parseRefs(formula) {
    const refs = [];
    const regex = /[A-C][1-3]/g;
    let m;
    while ((m = regex.exec(formula)) !== null) refs.push(m[0]);
    return refs;
  }

  function buildDependents() {
    Object.keys(dependents).forEach(k=>dependents[k].clear());
    cells.forEach(cell=>{
      const ref = cell.dataset.ref;
      const formula = cell.dataset.formula;
      if (!formula) return;
      const refs = parseRefs(formula);
      refs.forEach(r=>{
        if (!dependents[r]) dependents[r] = new Set();
        dependents[r].add(ref);
      });
    });
  }

  function formatNumber(n) {
    return n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  }

  function evaluateCell(ref, visited=new Set()) {
    if (visited.has(ref)) return 'CIRC';
    visited.add(ref);
    const cell = getCell(ref);
    if (!cell) return 0;
    const formula = cell.dataset.formula;
    if (!formula) {
      const val = cell.value.trim();
      const num = parseFloat(val);
      return isNaN(num) ? 0 : num;
    }
    const expr = formula.replace(/[A-C][1-3]/g, r=>{
      const v = evaluateCell(r, visited);
      return v === 'CIRC' ? '0' : v;
    });
    try {
      const result = Function(`"use strict"; return (${expr});`)();
      return typeof result === 'number' ? result : 0;
    } catch {
      return 0;
    }
  }

  function updateCell(ref, isInitial=false) {
    const cell = getCell(ref);
    if (!cell) return;
    const val = evaluateCell(ref);
    if (val === 'CIRC') {
      cell.value = 'CIRC';
    } else {
      cell.value = formatNumber(val);
    }
    if (!isInitial) {
      cell.classList.add('flash');
      setTimeout(()=>cell.classList.remove('flash'), 500);
    }
  }

  function updateDependents(ref) {
    const deps = dependents[ref];
    if (!deps) return;
    deps.forEach(d=>{ updateCell(d); updateDependents(d); });
  }

  function onInput(e) {
    const cell = e.target;
    const ref = cell.dataset.ref;
    const val = cell.value.trim();
    if (val.startsWith('=')) {
      cell.dataset.formula = val.slice(1);
    } else {
      delete cell.dataset.formula;
    }
    buildDependents();
    updateCell(ref, true);
    updateDependents(ref);
  }

  function onFocus(e) { e.target.classList.add('active'); }
  function onBlur(e) { e.target.classList.remove('active'); }

  cells.forEach(c=>{
    c.addEventListener('input', onInput);
    c.addEventListener('focus', onFocus);
    c.addEventListener('blur', onBlur);
  });

  // Initial evaluation
  buildDependents();
  cells.forEach(c=>updateCell(c.dataset.ref, true));
})();
</script>
</body>
</html>
