
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#f0f0f0;}
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:5px;
    height:100vh;
    width:100vw;
    padding:10px;
    box-sizing:border-box;
    align-items:center;
    justify-items:center;
  }
  .cell{
    position:relative;
    width:100%;
    height:100%;
    background:#fafafa;
    border:1px solid #ccc;
    border-radius:3px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .celda{
    width:100%;
    height:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:1.2rem;
    padding:0 5px;
    box-sizing:border-box;
    outline:none;
  }
  .label{
    position:absolute;
    top:2px;
    left:2px;
    font-size:0.7rem;
    color:#666;
    pointer-events:none;
  }
  .cell.active{box-shadow:0 0 5px 2px teal;}
  @keyframes flash{from{background:#ffffcc;}to{background:#fafafa;}}
  .cell.flash{animation:flash 0.5s ease-out forwards;}
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><input class="celda" data-ref="A1"><span class="label">A1</span></div>
  <div class="cell"><input class="celda" data-ref="A2"><span class="label">A2</span></div>
  <div class="cell"><input class="celda" data-ref="A3"><span class="label">A3</span></div>
  <div class="cell"><input class="celda" data-ref="B1"><span class="label">B1</span></div>
  <div class="cell"><input class="celda" data-ref="B2"><span class="label">B2</span></div>
  <div class="cell"><input class="celda" data-ref="B3"><span class="label">B3</span></div>
  <div class="cell"><input class="celda" data-ref="C1"><span class="label">C1</span></div>
  <div class="cell"><input class="celda" data-ref="C2"><span class="label">C2</span></div>
  <div class="cell"><input class="celda" data-ref="C3"><span class="label">C3</span></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const cells = {}; // ref -> input element
  const dependencies = {}; // ref -> Set of refs it depends on
  const dependents = {}; // ref -> Set of refs that depend on it

  // Initialize cells
  document.querySelectorAll('.celda').forEach(input => {
    const ref = input.dataset.ref;
    cells[ref] = input;
    dependencies[ref] = new Set();
    dependents[ref] = new Set();

    // Focus/blur for active highlight
    input.addEventListener('focus', () => input.parentElement.classList.add('active'));
    input.addEventListener('blur', () => input.parentElement.classList.remove('active'));

    // Input event
    input.addEventListener('input', () => handleInput(ref));

    // Remove flash after animation
    input.parentElement.addEventListener('animationend', e => {
      if (e.animationName === 'flash') input.parentElement.classList.remove('flash');
    });
  });

  function handleInput(ref) {
    const input = cells[ref];
    const val = input.value.trim();
    if (val.startsWith('=')) {
      input.dataset.formula = val;
    } else {
      delete input.dataset.formula;
    }
    evaluateCell(ref, []);
    updateDependents(ref, new Set());
  }

  function evaluateCell(ref, stack) {
    const input = cells[ref];
    const formula = input.dataset.formula;
    if (!formula) return input.value.trim();

    if (stack.includes(ref)) {
      input.value = 'CIRC';
      return 'CIRC';
    }
    stack.push(ref);

    const refsInFormula = formula.match(/[A-C][1-3]/g) || [];
    dependencies[ref] = new Set(refsInFormula);
    // Update reverse dependencies
    Object.keys(dependents).forEach(r => dependents[r].delete(ref));
    refsInFormula.forEach(r => dependents[r].add(ref));

    let expr = formula.slice(1);
    refsInFormula.forEach(r => {
      const val = evaluateCell(r, stack.slice());
      const num = parseFloat(val);
      const numStr = isNaN(num) ? '0' : num;
      expr = expr.replaceAll(r, numStr);
    });

    let result;
    try {
      result = Function('return ' + expr)();
      if (typeof result !== 'number' || !isFinite(result)) result = 'ERR';
    } catch (e) {
      result = 'ERR';
    }

    if (typeof result === 'number') {
      result = result.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    input.value = result;
    stack.pop();
    return result;
  }

  function updateDependents(ref, visited) {
    dependents[ref].forEach(dep => {
      if (!visited.has(dep)) {
        visited.add(dep);
        evaluateCell(dep, []);
        cells[dep].parentElement.classList.add('flash');
        updateDependents(dep, visited);
      }
    });
  }

  // Initial evaluation
  Object.keys(cells).forEach(ref => evaluateCell(ref, []));
});
</script>
</body>
</html>
