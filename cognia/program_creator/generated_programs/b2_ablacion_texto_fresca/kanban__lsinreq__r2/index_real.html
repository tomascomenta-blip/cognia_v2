<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en un solo archivo</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  .board{display:flex;gap:20px;padding:20px;justify-content:center;flex-wrap:wrap;}
  .col{background:#e0e0e0;border-radius:8px;padding:10px;flex:1 1 200px;display:flex;flex-direction:column;}
  .col h2{margin:0 0 10px 0;font-size:1.2em;text-align:center;}
  .card{background:#fff;border-radius:4px;padding:10px;margin-bottom:10px;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;}
  .card button{background:none;border:none;cursor:pointer;font-size:1.2em;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
  .mas{color:#28a745;}   /* verde + */
  .menos{color:#dc3545;} /* rojo - */
  .counter{font-size:0.9em;text-align:center;margin-top:5px;}
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo"></span></h2>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing <span id="cont-doing"></span></h2>
  </div>
  <div class="col" data-col="done">
    <h2>Done <span id="cont-done"></span></h2>
  </div>
</div>

<script>
function createCard(id, text) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = id;

  const btnMas = document.createElement('button');
  btnMas.className = 'mas';
  btnMas.textContent = '+';

  const span = document.createElement('span');
  span.textContent = text;

  const btnMenos = document.createElement('button');
  btnMenos.className = 'menos';
  btnMenos.textContent = '-';

  card.appendChild(btnMas);
  card.appendChild(span);
  card.appendChild(btnMenos);

  btnMas.addEventListener('click', () => moveCard(card, 1));
  btnMenos.addEventListener('click', () => moveCard(card, -1));

  return card;
}

function moveCard(card, direction) {
  const currentCol = card.parentElement;
  const cols = Array.from(document.querySelectorAll('.col'));
  const idx = cols.findIndex(c => c === currentCol);
  const targetIdx = idx + direction;
  if (targetIdx < 0 || targetIdx >= cols.length) return; // out of bounds

  const targetCol = cols[targetIdx];

  // WIP rule: doing max 2 cards
  if (targetCol.dataset.col === 'doing' && targetCol.querySelectorAll('.card').length >= 2) return;

  targetCol.appendChild(card);
  updateCounters();
}

function updateCounters() {
  document.getElementById('cont-todo').textContent = document.querySelectorAll('[data-col="todo"] .card').length;
  document.getElementById('cont-doing').textContent = document.querySelectorAll('[data-col="doing"] .card').length;
  document.getElementById('cont-done').textContent = document.querySelectorAll('[data-col="done"] .card').length;
}

document.addEventListener('DOMContentLoaded', () => {
  const todoCol = document.querySelector('[data-col="todo"]');
  ['t1', 't2', 't3'].forEach(id => {
    const card = createCard(id, 'Tarea ' + id);
    todoCol.appendChild(card);
  });
  updateCounters();
});
</script>
</body>
</html>
