<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f0f0f0;
    font-family:sans-serif;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2px;
    border:1px solid #333;
    background:#fff;
    padding:5px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    max-width:400px;
    width:90%;
  }
  .celda{
    width:100%;
    height:40px;
    padding:0 5px;
    border:none;
    background:#e0e0e0;
    color:#fff;
    font-size:1rem;
    text-align:right;
    box-sizing:border-box;
    outline:none;
    transition:box-shadow .2s;
  }
  .celda:focus{
    box-shadow:0 0 0 2px #add8e6;
  }
  @media (max-width:500px){
    .celda{height:35px;font-size:.9rem;}
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="">
  <input type="text" class="celda" data-ref="A2" value="">
  <input type="text" class="celda" data-ref="A3" value="">
  <input type="text" class="celda" data-ref="B1" value="">
  <input type="text" class="celda" data-ref="B2" value="">
  <input type="text" class="celda" data-ref="B3" value="">
  <input type="text" class="celda" data-ref="C1" value="">
  <input type="text" class="celda" data-ref="C2" value="">
  <input type="text" class="celda" data-ref="C3" value="">
</div>
<script>
(() => {
  const cells = Array.from(document.querySelectorAll('.celda'));
  const cellMap = new Map();
  cells.forEach(c => cellMap.set(c.dataset.ref, c));

  // Helper to format numbers
  const formatNum = n => Number.isFinite(n) ? n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) : n;

  // Evaluate a cell recursively
  const evaluate = (cell, stack = new Set()) => {
    const ref = cell.dataset.ref;
    if (stack.has(ref)) {
      cell.value = 'CIRC';
      return 'CIRC';
    }
    stack.add(ref);

    const formula = cell.dataset.formula;
    if (!formula) {
      // Non-formula: parse numeric value
      const val = parseFloat(cell.value);
      stack.delete(ref);
      return Number.isFinite(val) ? val : 0;
    }

    // Parse formula: remove leading '='
    const expr = formula.slice(1);
    // Split into tokens and operators
    const parts = expr.split(/([+-])/);
    let result = 0;
    let op = '+';
    for (let part of parts) {
      if (part === '+' || part === '-') {
        op = part;
      } else if (part.trim() !== '') {
        const refToken = part.trim();
        const depCell = cellMap.get(refToken);
        if (!depCell) {
          // Unknown reference treated as 0
          var val = 0;
        } else {
          var val = evaluate(depCell, stack);
          if (val === 'CIRC') {
            cell.value = 'CIRC';
            stack.delete(ref);
            return 'CIRC';
          }
        }
        result = op === '+' ? result + val : result - val;
      }
    }
    stack.delete(ref);
    cell.value = formatNum(result);
    return result;
  };

  // Recalculate all formula cells
  const recalcAll = () => {
    cells.forEach(c => {
      if (c.dataset.formula) {
        evaluate(c);
      }
    });
  };

  // Handle input changes
  cells.forEach(c => {
    c.addEventListener('input', () => {
      const val = c.value.trim();
      if (val.startsWith('=')) {
        c.dataset.formula = val;
      } else {
        delete c.dataset.formula;
      }
      recalcAll();
    });
  });

  // Initial calculation (none)
  recalcAll();
})();
</script>
</body>
</html>
