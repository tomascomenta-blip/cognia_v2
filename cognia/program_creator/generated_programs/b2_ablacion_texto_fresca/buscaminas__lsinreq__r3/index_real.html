<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Buscaminas 5x5</title><style>body{font-family:sans-serif;background:#f0f0f0;margin:0;display:flex;flex-direction:column;align-items:center;padding:20px;}h1{margin:0 0 10px;font-size:1.5rem;color:#004d4d;}#grid{display:grid;grid-template-columns:repeat(5,50px);gap:2px;background:#d0d0d0;} .c{width:50px;height:50px;background:#006666;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;box-shadow:1px 1px 2px rgba(0,0,0,.3);} .c.abierta{background:#e0e0e0;color:#004d4d;font-weight:bold;} .c.bandera{background:#006666;color:#ff0;} .c.abierta.bandera{background:#006666;color:#ff0;} .c.abierta.mine{background:#e0e0e0;color:#000;} #estado{margin-top:10px;font-size:1rem;color:#d00;}</style></head><body><h1>Buscaminas 5x5</h1><div id="grid"></div><div id="estado"></div><script>const mines=[6,12,18],grid=document.getElementById('grid');for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;d.addEventListener('click',()=>openCell(d));d.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(d);});grid.appendChild(d);}function neighbors(i){const r=Math.floor(i/5),c=i%5,arr=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5)arr.push(nr*5+nc);}return arr;}function countAdj(i){return neighbors(i).filter(n=>mines.includes(n)).length;}function openCell(cell){if(cell.classList.contains('bandera')||cell.classList.contains('abierta'))return;const i=parseInt(cell.dataset.i);if(mines.includes(i)){cell.classList.add('abierta','mine');cell.textContent='⚫';document.getElementById('estado').textContent='perdiste';return;}const n=countAdj(i);cell.classList.add('abierta');if(n>0)cell.textContent=n;else{const stack=[i],visited=new Set();while(stack.length){const cur=stack.pop();if(visited.has(cur))continue;visited.add(cur);const curCell=document.querySelector(`.c[data-i="${cur}"]`);if(curCell.classList.contains('abierta')||curCell.classList.contains('bandera'))continue;const cnt=countAdj(cur);curCell.classList.add('abierta');if(cnt>0)curCell.textContent=cnt;if(cnt===0)neighbors(cur).forEach(n=>{if(!visited.has(n))stack.push(n);});}}}function toggleFlag(cell){if(cell.classList.contains('abierta'))return;if(cell.classList.toggle('bandera'))cell.textContent='🚩';else cell.textContent='';}</script></body></html>
