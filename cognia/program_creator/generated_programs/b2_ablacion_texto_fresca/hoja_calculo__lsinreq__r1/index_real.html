<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;}
#status{position:absolute;top:10px;left:10px;background:#e8f5e9;padding:4px 8px;border-radius:4px;font-size:12px;color:#2e7d32;display:flex;align-items:center;}
#status svg{width:12px;height:12px;margin-right:4px;}
#grid{display:grid;grid-template-columns:repeat(3,80px);gap:8px;}
input.celda{width:80px;height:30px;border:none;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);text-align:right;padding-right:4px;font-size:14px;}
input.celda:focus{outline:none;border:2px solid #009688;}
</style>
</head>
<body>
<div id="status"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#4caf50"/></svg>Listo</div>
<div id="grid">
<input class="celda" data-ref="A1" value="1">
<input class="celda" data-ref="A2" value="2">
<input class="celda" data-ref="A3" value="3">
<input class="celda" data-ref="B1" value="4">
<input class="celda" data-ref="B2" value="5">
<input class="celda" data-ref="B3" value="6">
<input class="celda" data-ref="C1" value="7">
<input class="celda" data-ref="C2" value="8">
<input class="celda" data-ref="C3" value="9">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const map={};
cells.forEach(c=>{map[c.dataset.ref]=c;});
function evalCell(ref,stack){const c=map[ref];if(!c)return 0;const f=c.dataset.formula;if(!f)return parseFloat(c.value)||c.value; if(stack.has(ref))return 'CIRC'; stack.add(ref); const expr=f.slice(1).replace(/[A-C][1-3]/g,r=>{const v=evalCell(r,stack);return v==='CIRC'?'NaN':v;}); stack.delete(ref); const val=eval(expr); return isNaN(val)?'CIRC':val;}
function recalc(){cells.forEach(c=>{const f=c.dataset.formula; if(f){const val=evalCell(c.dataset.ref,new Set()); c.value=val==='CIRC'?'CIRC':(typeof val==='number'?val.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}):val); } });}
cells.forEach(c=>{c.addEventListener('change',e=>{const v=e.target.value;if(v.startsWith('=')){c.dataset.formula=v; e.target.value='';}else{delete c.dataset.formula;} recalc();});});
recalc();
</script>
</body>
</html>
