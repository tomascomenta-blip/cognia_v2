<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Buscaminas 5x5</title><style>body{font-family:Arial,Helvetica,sans-serif;background:#f0f0f0;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}#container{display:flex;flex-direction:column;align-items:center;background:#f0f0f0;padding:10px;border-radius:5px;}h1{margin:0 0 10px;font-size:1.2em;color:#004d4d;}#grid{display:grid;grid-template-columns:repeat(5,50px);gap:2px;} .c{width:50px;height:50px;background:#004d4d;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);user-select:none;} .c.abierta{background:#d3d3d3;color:#004d4d;cursor:default;} .c.bandera{background:#004d4d;color:#ff0;}#estado{margin-top:10px;font-weight:bold;color:#004d4d;}</style></head>
<body><div id="container"><h1>Buscaminas 5x5</h1><div id="grid"></div><div id="estado"></div></div><script>const mines=[6,12,18],grid=document.getElementById('grid'),estado=document.getElementById('estado'),cells=[];for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;d.addEventListener('click',e=>{if(d.classList.contains('bandera')||d.classList.contains('abierta'))return;open(i);});d.addEventListener('contextmenu',e=>{e.preventDefault();if(d.classList.contains('abierta'))return;d.classList.toggle('bandera');d.textContent=d.classList.contains('bandera')?'🚩':'';});grid.appendChild(d);cells.push(d);}const adjCount=Array(25).fill(0);for(let i=0;i<25;i++){let r=Math.floor(i/5),c=i%5,cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;let nr=r+dr,nc=c+dc;if(nr<0||nr>4||nc<0||nc>4)continue;if(mines.includes(nr*5+nc))cnt++;}adjCount[i]=cnt;}function open(i){const d=cells[i];if(d.classList.contains('abierta')||d.classList.contains('bandera'))return;d.classList.add('abierta');if(mines.includes(i)){d.textContent='💣';estado.textContent='perdiste';return;}const n=adjCount[i];d.textContent=n>0?n:'';if(n===0){let r=Math.floor(i/5),c=i%5;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;let nr=r+dr,nc=c+dc;if(nr<0||nr>4||nc<0||nc>4)continue;open(nr*5+nc);}}}</script></body></html>
