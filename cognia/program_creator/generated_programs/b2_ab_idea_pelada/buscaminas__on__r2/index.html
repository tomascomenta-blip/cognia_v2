
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#f0f0f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5, 40px);
    grid-template-rows:repeat(5, 40px);
    gap:2px;
    margin-top:20px;
    animation:slideIn 1s ease forwards;
  }
  .c{
    width:40px;
    height:40px;
    background:#ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    border:1px solid #999;
    transition:background 0.2s;
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera{
    background:#ff0;
    color:red;
  }
  #estado{
    margin-top:10px;
    font-size:1.2em;
    min-height:1.2em;
  }
  @keyframes slideIn{
    from{opacity:0;transform:translateY(-20px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>

<script>
(function(){
  const grid=document.getElementById('grid');
  const estado=document.getElementById('estado');
  const size=5;
  const total=size*size;
  const mines=[6,12,18];
  const cells=[];
  let gameOver=false;

  // Create cells
  for(let i=0;i<total;i++){
    const div=document.createElement('div');
    div.classList.add('c');
    div.dataset.i=i;
    div.dataset.mine=mines.includes(i)?'true':'false';
    div.addEventListener('click',handleLeft);
    div.addEventListener('contextmenu',handleRight);
    grid.appendChild(div);
    cells.push(div);
  }

  function handleLeft(e){
    if(gameOver)return;
    const cell=e.currentTarget;
    if(cell.classList.contains('bandera')||cell.classList.contains('abierta'))return;
    if(cell.dataset.mine==='true'){
      cell.classList.add('abierta');
      cell.textContent='💣';
      estado.textContent='perdiste';
      gameOver=true;
      return;
    }
    cascade(cell);
  }

  function handleRight(e){
    e.preventDefault();
    if(gameOver)return;
    const cell=e.currentTarget;
    if(cell.classList.contains('abierta'))return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }

  function getNeighbors(idx){
    const r=Math.floor(idx/size);
    const c=idx%size;
    const neigh=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<size&&nc>=0&&nc<size){
          neigh.push(nr*size+nc);
        }
      }
    }
    return neigh;
  }

  function countAdjMines(idx){
    return getNeighbors(idx).filter(i=>cells[i].dataset.mine==='true').length;
  }

  function openCell(idx){
    const cell=cells[idx];
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return 0;
    cell.classList.add('abierta');
    const cnt=countAdjMines(idx);
    cell.textContent=cnt>0?cnt:'';
    return cnt;
  }

  function cascade(startCell){
    const queue=[parseInt(startCell.dataset.i)];
    while(queue.length){
      const idx=queue.shift();
      const cnt=openCell(idx);
      if(cnt===0){
        getNeighbors(idx).forEach(n=>{
          const nCell=cells[n];
          if(!nCell.classList.contains('abierta') && !nCell.classList.contains('bandera') && nCell.dataset.mine==='false'){
            queue.push(n);
          }
        });
      }
    }
  }
})();
</script>
</body>
</html>
