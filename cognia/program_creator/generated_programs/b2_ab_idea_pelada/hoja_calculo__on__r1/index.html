<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:sans-serif;margin:0;padding:1rem;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;}
  .celda{width:100%;padding:.5rem;font-size:1rem;}
</style>
</head>
<body>
<div class="grid">
  <input class="celda" data-ref="A1" value="1">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="2">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="3">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="=A1+B1">
</div>
<script>
const cells={};
document.querySelectorAll('.celda').forEach(el=>{
  const ref=el.dataset.ref;
  cells[ref]=el;
  el.dataset.formula=el.value;
  el.addEventListener('input',e=>{
    if(ignore)return;
    el.dataset.formula=el.value;
    evaluateAll();
  });
});
let ignore=false;
function setVal(el,val){ignore=true;el.value=val;ignore=false;}
function evalCell(ref,stack){
  const el=cells[ref];
  const f=el.dataset.formula;
  if(!f||!f.startsWith('='))return el.value;
  if(stack.includes(ref)){setVal(el,'CIRC');return 'CIRC';}
  let circ=false;
  const expr=f.slice(1).replace(/[A-C][1-3]/g,m=>{
    const r=evalCell(m,stack.concat(ref));
    if(r==='CIRC')circ=true;
    return r;
  });
  if(circ){setVal(el,'CIRC');return 'CIRC';}
  try{const r=eval(expr);setVal(el,r.toString());return r.toString();}
  catch{setVal(el,'ERR');return 'ERR';}
}
function evaluateAll(){Object.keys(cells).forEach(r=>evalCell(r,[]));}
evaluateAll();
</script>
</body>
</html>
