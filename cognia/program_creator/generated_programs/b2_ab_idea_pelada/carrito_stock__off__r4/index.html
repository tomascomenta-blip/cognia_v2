<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de Compra con Stock</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f5f5f5;}
  .container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:20px;}
  .products,.cart{flex:1;min-width:280px;background:#fff;padding:20px;margin:10px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.1);}
  .prod{border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:15px;text-align:center;}
  .prod img{width:100%;height:auto;border-radius:4px;}
  .prod h3{margin:10px 0 5px;}
  .prod p{margin:5px 0;}
  .prod button{padding:8px 12px;background:#28a745;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .prod button:disabled{background:#aaa;cursor:not-allowed;}
  .cart h2{margin-top:0;}
  .linea{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;}
  .linea button{padding:4px 8px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .linea button:disabled{background:#aaa;cursor:not-allowed;}
  #total{font-weight:bold;font-size:1.2em;}
  @media(max-width:600px){
    .container{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="container">
  <section class="products">
    <h2>Productos</h2>
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNlZWVlZWUiIC8+PHRleHQgeD0iNTAiIHk9IjU1IiBmb250LXNpemU9IjE4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwMDAwIj5QMSB8IFZhbGlkPC90ZXh0Pjwvc3ZnPg==" alt="Producto 1">
      <h3>Producto 1</h3>
      <p>Precio: <span class="precio"></span></p>
      <p>Stock: <span class="stock"></span></p>
      <button class="add" data-id="p1">Agregar</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNmZmZmZmYiIC8+PHRleHQgeD0iNTAiIHk9IjU1IiBmb250LXNpemU9IjE4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwMDAwIj5QMiB8IFZhbGlkPC90ZXh0Pjwvc3ZnPg==" alt="Producto 2">
      <h3>Producto 2</h3>
      <p>Precio: <span class="precio"></span></p>
      <p>Stock: <span class="stock"></span></p>
      <button class="add" data-id="p2">Agregar</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgdmlld0JveD0iMCAwIDEwMCAxMDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiNmZmYwMDAiIC8+PHRleHQgeD0iNTAiIHk9IjU1IiBmb250LXNpemU9IjE4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwMDAwIj5QMzwvdGV4dD48L3N2Zz4=" alt="Producto 3">
      <h3>Producto 3</h3>
      <p>Precio: <span class="precio"></span></p>
      <p>Stock: <span class="stock"></span></p>
      <button class="add" data-id="p3">Agregar</button>
    </div>
  </section>

  <section class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <p>Total: <span id="total">0,00 €</span></p>
  </section>
</div>

<script>
  // Configuraciones iniciales
  const cart = {}; // {id: cantidad}
  const products = {}; // {id: {precio, stock, addBtn}}
  const totalEl = document.getElementById('total');
  const cartLinesEl = document.getElementById('cart-lines');

  // Inicializar productos y botones
  document.querySelectorAll('.prod').forEach(prodEl => {
    const id = prodEl.dataset.id;
    const precio = parseFloat(prodEl.dataset.precio);
    const stock = parseInt(prodEl.dataset.stock, 10);
    const addBtn = prodEl.querySelector('.add');

    // Mostrar precio y stock
    prodEl.querySelector('.precio').textContent = precio.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
    prodEl.querySelector('.stock').textContent = stock;

    products[id] = {precio, stock, addBtn};

    addBtn.addEventListener('click', () => addToCart(id));
  });

  function addToCart(id) {
    const prod = products[id];
    const currentQty = cart[id] || 0;
    if (currentQty < prod.stock) {
      cart[id] = currentQty + 1;
      updateCartLine(id);
      if (cart[id] === prod.stock) prod.addBtn.disabled = true;
      updateTotal();
    }
  }

  function removeFromCart(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    const prod = products[id];
    if (cart[id] <= 0) {
      delete cart[id];
      removeCartLine(id);
      prod.addBtn.disabled = false;
    } else {
      updateCartLine(id);
    }
    updateTotal();
  }

  function updateCartLine(id) {
    const lineEl = document.querySelector(`.linea[data-id="${id}"]`);
    if (lineEl) {
      lineEl.querySelector('.cant').textContent = cart[id];
    } else {
      const prod = products[id];
      const newLine = document.createElement('div');
      newLine.className = 'linea';
      newLine.dataset.id = id;
      newLine.innerHTML = `
        <span>${id.toUpperCase()}</span>
        <span class="cant">${cart[id]}</span>
        <button class="quitar" data-id="${id}">Quitar</button>
      `;
      cartLinesEl.appendChild(newLine);
      newLine.querySelector('.quitar').addEventListener('click', () => removeFromCart(id));
    }
  }

  function removeCartLine(id) {
    const lineEl = document.querySelector(`.linea[data-id="${id}"]`);
    if (lineEl) lineEl.remove();
  }

  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      total += cart[id] * products[id].precio;
    }
    totalEl.textContent = total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }
</script>
</body>
</html>
