<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
body{font-family:Arial,sans-serif;margin:10px;}
.prod{margin-bottom:10px;}
button{margin-left:5px;}
.linea{margin-bottom:5px;}
</style>
</head>
<body>
<h1>Productos</h1>
<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - 100 €</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - 50 €</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - 25 €</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>
<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: <span id="total">0 €</span></div>
<script>
const cart={};
function updateCart(){
  const cartDiv=document.getElementById('cart');
  cartDiv.innerHTML='';
  for(const id in cart){
    const qty=cart[id];
    const line=document.createElement('div');
    line.className='linea'; line.dataset.id=id;
    const cant=document.createElement('span'); cant.className='cant'; cant.textContent=qty;
    const btn=document.createElement('button'); btn.className='quitar'; btn.dataset.id=id; btn.textContent='Quitar';
    line.append(cant,btn); cartDiv.appendChild(line);
  }
}
function updateButtons(){
  document.querySelectorAll('.prod').forEach(p=>{
    const id=p.dataset.id, stock=parseInt(p.dataset.stock), qty=cart[id]||0;
    const btn=p.querySelector('.add'); btn.disabled=qty>=stock;
  });
}
function updateTotal(){
  let total=0;
  for(const id in cart){
    const qty=cart[id];
    const price=parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
    total+=qty*price;
  }
  document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
}
document.addEventListener('click',e=>{
  if(e.target.matches('.add')){
    const id=e.target.dataset.id;
    const prod=document.querySelector(`.prod[data-id="${id}"]`);
    const stock=parseInt(prod.dataset.stock), qty=cart[id]||0;
    if(qty<stock){ cart[id]=qty+1; updateCart(); updateButtons(); updateTotal(); }
  }
  if(e.target.matches('.quitar')){
    const id=e.target.dataset.id, qty=cart[id]||0;
    if(qty>0){ cart[id]=qty-1; if(cart[id]===0) delete cart[id]; updateCart(); updateButtons(); updateTotal(); }
  }
});
</script>
</body>
</html>
