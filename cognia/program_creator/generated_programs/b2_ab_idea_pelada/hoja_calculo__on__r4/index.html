<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;padding:5px;font-size:1rem;text-align:right;}
  header{margin-bottom:20px;}
  pre{font-family:monospace;background:#222;color:#0f0;padding:10px;}
</style>
</head>
<body>
<header>
  <h1>Mini Hoja de Cálculo 3x3</h1>
  <pre>
     ___   ___   ___
    | A | | B | | C |
    |___| |___| |___|
    | 1 | | 2 | | 3 |
    |___| |___| |___|
  </pre>
</header>
<div class="grid">
  <input class="celda" data-ref="A1" value="">
  <input class="celda" data-ref="A2" value="">
  <input class="celda" data-ref="A3" value="">
  <input class="celda" data-ref="B1" value="">
  <input class="celda" data-ref="B2" value="">
  <input class="celda" data-ref="B3" value="">
  <input class="celda" data-ref="C1" value="">
  <input class="celda" data-ref="C2" value="">
  <input class="celda" data-ref="C3" value="">
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = {};
  document.querySelectorAll('.celda').forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = el;
    el.addEventListener('input', () => recomputeAll());
  });

  function recomputeAll() {
    Object.keys(cells).forEach(ref => evaluateCell(ref, []));
  }

  function evaluateCell(ref, stack) {
    const el = cells[ref];
    const val = el.value;
    if (val.startsWith('=')) {
      if (stack.includes(ref)) {
        el.value = 'CIRC';
        el.setAttribute('value', 'CIRC');
        return 'CIRC';
      }
      stack.push(ref);
      const formula = val;
      let cycleDetected = false;
      let expr = formula.slice(1);
      expr = expr.replace(/[A-C][1-3]/g, match => {
        const res = evaluateCell(match, stack);
        if (res === 'CIRC') {
          cycleDetected = true;
          return '0';
        }
        const num = parseFloat(res);
        return isNaN(num) ? 0 : num;
      });
      if (cycleDetected) {
        el.value = 'CIRC';
        el.setAttribute('value', 'CIRC');
        stack.pop();
        return 'CIRC';
      }
      let result;
      try {
        result = eval(expr);
      } catch (e) {
        result = 'CIRC';
      }
      if (typeof result === 'number' && !isNaN(result)) {
        el.value = result.toString();
        el.setAttribute('value', result.toString());
      } else {
        el.value = 'CIRC';
        el.setAttribute('value', 'CIRC');
      }
      stack.pop();
      return el.value;
    } else {
      return val;
    }
  }

  recomputeAll();
});
</script>
</body>
</html>
