<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
  .celda{width:100%;padding:5px;font-size:1rem;text-align:right;}
  header{margin-bottom:20px;}
  pre{background:#333;color:#0f0;padding:10px;font-family:monospace;}
</style>
</head>
<body>
<header>
  <h1>Mini Hoja de Cálculo 3x3</h1>
  <pre>
  ___   ___   ___
 | A | | B | | C |
 |___| |___| |___|
 | 1 | | 2 | | 3 |
 |___| |___| |___|
  </pre>
</header>
<div class="grid">
  <input class="celda" data-ref="A1" value="0">
  <input class="celda" data-ref="A2" value="0">
  <input class="celda" data-ref="A3" value="0">
  <input class="celda" data-ref="B1" value="0">
  <input class="celda" data-ref="B2" value="0">
  <input class="celda" data-ref="B3" value="0">
  <input class="celda" data-ref="C1" value="0">
  <input class="celda" data-ref="C2" value="0">
  <input class="celda" data-ref="C3" value="0">
</div>
<script>
const cells = {};
const cellsArray = [];
document.querySelectorAll('.celda').forEach(cell=>{
  const ref = cell.dataset.ref;
  cells[ref] = cell;
  cellsArray.push(cell);
  cell.addEventListener('input', recalcAll);
});

function formatNumber(n){
  if(isNaN(n)) return 'NaN';
  return n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function evaluateCell(ref, stack){
  const cell = cells[ref];
  const val = cell.value.trim();
  if(val.startsWith('=')){
    if(stack.has(ref)) return 'CIRC';
    stack.add(ref);
    let expr = val.slice(1);
    let hasCirc = false;
    expr = expr.replace(/[A-C][1-3]/g, match=>{
      const res = evaluateCell(match, stack);
      if(res === 'CIRC'){ hasCirc = true; return '0'; }
      return res;
    });
    if(hasCirc){ stack.delete(ref); return 'CIRC'; }
    let result;
    try{ result = eval(expr); }catch(e){ result = NaN; }
    stack.delete(ref);
    return result;
  }else{
    const num = parseFloat(cell.dataset.num);
    return isNaN(num) ? 0 : num;
  }
}

function recalcAll(){
  // Update numeric values for non-formula cells
  cellsArray.forEach(cell=>{
    const val = cell.value.trim();
    if(!val.startsWith('=')){
      const num = parseFloat(val.replace(/,/g,''));
      cell.dataset.num = isNaN(num) ? 0 : num;
    }
  });
  // Evaluate all cells
  cellsArray.forEach(cell=>{
    const ref = cell.dataset.ref;
    const val = cell.value.trim();
    if(val.startsWith('=')){
      const result = evaluateCell(ref, new Set());
      if(result === 'CIRC'){
        cell.value = 'CIRC';
        delete cell.dataset.num;
      }else{
        cell.dataset.num = result;
        cell.value = formatNumber(result);
      }
    }else{
      const num = parseFloat(cell.dataset.num);
      cell.value = formatNumber(num);
    }
  });
}
recalcAll();
</script>
</body>
</html>
