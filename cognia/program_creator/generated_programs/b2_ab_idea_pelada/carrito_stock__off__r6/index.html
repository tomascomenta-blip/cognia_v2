<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {font-family: Arial, sans-serif; margin: 0; padding: 0; background:#f9f9f9;}
.container {max-width: 600px; margin: 0 auto; padding: 1rem;}
.prod {border:1px solid #ddd; padding:0.5rem; margin-bottom:0.5rem; background:#fff;}
.prod button.add {margin-left:1rem;}
.cart {border-top:2px solid #333; margin-top:1rem; padding-top:1rem;}
.linea {display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0; border-bottom:1px solid #eee;}
.linea button.quitar {margin-left:1rem;}
#total {font-weight:bold; font-size:1.2rem; margin-top:1rem;}
@media (max-width: 480px) {
  .linea {flex-direction:column; align-items:flex-start;}
  .linea button.quitar {margin-top:0.5rem;}
}
</style>
</head>
<body>
<div class="container">
<h1>Carrito de Compra</h1>
<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - €100.00</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - €50.00</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - €25.00</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>
<div class="cart">
  <h2>Carrito</h2>
  <div id="cart-lines"></div>
  <div id="total">Total: €0.00</div>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const cartLines = document.getElementById('cart-lines');
  const totalSpan = document.getElementById('total');
  const cart = {}; // id -> quantity

  // Helper to format currency
  function formatCurrency(value) {
    return value.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }

  function updateTotal() {
    let total = 0;
    for (const id in cart) {
      const qty = cart[id];
      const price = parseFloat(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
      total += qty * price;
    }
    totalSpan.textContent = 'Total: ' + formatCurrency(total);
  }

  function createLine(id, qty) {
    const line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;
    const span = document.createElement('span');
    span.textContent = `Producto ${id.slice(1)} - Cantidad: `;
    const cant = document.createElement('span');
    cant.className = 'cant';
    cant.textContent = qty;
    const btn = document.createElement('button');
    btn.className = 'quitar';
    btn.dataset.id = id;
    btn.textContent = 'Quitar';
    line.appendChild(span);
    span.appendChild(cant);
    line.appendChild(btn);
    cartLines.appendChild(line);
  }

  function updateLine(id, qty) {
    const line = cartLines.querySelector(`.linea[data-id="${id}"]`);
    if (line) {
      const cant = line.querySelector('.cant');
      cant.textContent = qty;
    }
  }

  function removeLine(id) {
    const line = cartLines.querySelector(`.linea[data-id="${id}"]`);
    if (line) line.remove();
  }

  function toggleAddButton(id, enable) {
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    if (btn) btn.disabled = !enable;
  }

  // Add button click
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', function() {
      const id = this.dataset.id;
      const prodDiv = document.querySelector(`.prod[data-id="${id}"]`);
      const stock = parseInt(prodDiv.dataset.stock);
      const currentQty = cart[id] || 0;
      if (currentQty < stock) {
        cart[id] = currentQty + 1;
        if (cartLines.querySelector(`.linea[data-id="${id}"]`)) {
          updateLine(id, cart[id]);
        } else {
          createLine(id, cart[id]);
        }
        if (cart[id] >= stock) {
          toggleAddButton(id, false);
        }
        updateTotal();
      }
    });
  });

  // Quitar button click
  cartLines.addEventListener('click', function(e) {
    if (e.target && e.target.classList.contains('quitar')) {
      const id = e.target.dataset.id;
      if (cart[id]) {
        cart[id] -= 1;
        if (cart[id] <= 0) {
          delete cart[id];
          removeLine(id);
          toggleAddButton(id, true);
        } else {
          updateLine(id, cart[id]);
        }
        updateTotal();
      }
    }
  });
});
</script>
</body>
</html>
