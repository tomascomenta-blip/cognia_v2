<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;background:#fafafa;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
  table{border-collapse:collapse;width:100%;max-width:400px;margin:auto;}
  th,td{border:1px solid #ddd;padding:5px;text-align:center;}
  th{background:#f0f0f0;color:#555;}
  .celda{width:80px;height:30px;text-align:right;border:1px solid #ccc;background:#fff;box-sizing:border-box;}
  .celda.formula{background:#e6f7ff;}
  .celda:focus{outline:2px solid #4caf50;}
</style>
</head>
<body>
<table>
  <tr><th></th><th>A</th><th>B</th><th>C</th></tr>
  <tr>
    <th>1</th>
    <td><input class="celda" data-ref="A1" value="1"></td>
    <td><input class="celda" data-ref="B1" value="2"></td>
    <td><input class="celda" data-ref="C1" value="3"></td>
  </tr>
  <tr>
    <th>2</th>
    <td><input class="celda" data-ref="A2"></td>
    <td><input class="celda" data-ref="B2" data-formula="=A1+B1"></td>
    <td><input class="celda" data-ref="C2" data-formula="=B2+1"></td>
  </tr>
  <tr>
    <th>3</th>
    <td><input class="celda" data-ref="A3"></td>
    <td><input class="celda" data-ref="B3"></td>
    <td><input class="celda" data-ref="C3" data-formula="=C2-A1"></td>
  </tr>
</table>
<script>
document.addEventListener('DOMContentLoaded',()=>{const cells=document.querySelectorAll('.celda');
function evaluate(cell,visited){const ref=cell.dataset.ref;if(visited.has(ref))return 'CIRC';visited.add(ref);const formula=cell.dataset.formula;if(!formula)return cell.value;const expr=formula.slice(1).replace(/([A-C][1-3])/g,(m)=>{const refCell=document.querySelector(`[data-ref="${m}"]`);const val=evaluate(refCell,visited);if(val==='CIRC')return 'CIRC';const num=parseFloat(val)||0;return num;});if(expr.includes('CIRC')){visited.delete(ref);return 'CIRC';}try{const result=Function('return '+expr)();visited.delete(ref);return result.toString();}catch(e){visited.delete(ref);return 'CIRC';}}
function recalcAll(){cells.forEach(cell=>{if(cell.dataset.formula){const val=evaluate(cell,new Set());cell.value=val;cell.classList.add('formula');}else{cell.classList.remove('formula');}});}
cells.forEach(cell=>{cell.addEventListener('input',e=>{const val=cell.value;if(val.startsWith('=')){cell.dataset.formula=val;}else{delete cell.dataset.formula;}recalcAll();});});
recalcAll();});
</script>
</body>
</html>
