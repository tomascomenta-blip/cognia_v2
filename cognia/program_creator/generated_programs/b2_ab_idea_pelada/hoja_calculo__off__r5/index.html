<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f9f9f9;}
  h1{font-size:1.5rem;text-align:center;margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:8px;box-sizing:border-box;text-align:right;font-size:1rem;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo</h1>
<div class="grid">
  <input type="text" class="celda" data-ref="A1">
  <input type="text" class="celda" data-ref="A2">
  <input type="text" class="celda" data-ref="A3">
  <input type="text" class="celda" data-ref="B1">
  <input type="text" class="celda" data-ref="B2">
  <input type="text" class="celda" data-ref="B3">
  <input type="text" class="celda" data-ref="C1">
  <input type="text" class="celda" data-ref="C2">
  <input type="text" class="celda" data-ref="C3">
</div>
<script>
(() => {
  const cells = {};
  document.querySelectorAll('.celda').forEach(el => {
    cells[el.dataset.ref] = el;
    el.addEventListener('blur', () => handleBlur(el));
  });

  function handleBlur(el) {
    const raw = el.value.trim();
    if (raw.startsWith('=')) {
      el.dataset.formula = raw.slice(1);
    } else {
      delete el.dataset.formula;
    }
    recomputeAll();
  }

  function recomputeAll() {
    Object.values(cells).forEach(el => {
      if (el.dataset.formula !== undefined) {
        const res = evaluateCell(el, new Set());
        el.value = res;
      }
    });
  }

  function evaluateCell(el, stack) {
    if (el.dataset.formula === undefined) return el.value;
    if (stack.has(el)) return 'CIRC';
    stack.add(el);
    const formula = el.dataset.formula;
    const tokens = formula.match(/[A-Z][1-3]|[+-]|[0-9]+(?:\.[0-9]+)?/g) || [];
    let result = 0;
    let op = '+';
    for (const token of tokens) {
      if (token === '+' || token === '-') {
        op = token;
        continue;
      }
      let num;
      if (token[0] >= 'A' && token[0] <= 'Z') {
        const refEl = cells[token];
        const val = evaluateCell(refEl, stack);
        if (val === 'CIRC') { stack.delete(el); return 'CIRC'; }
        num = parseFloat(val);
      } else {
        num = parseFloat(token);
      }
      if (isNaN(num)) num = 0;
      result = op === '+' ? result + num : result - num;
    }
    stack.delete(el);
    return result.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
})();
</script>
</body>
</html>
