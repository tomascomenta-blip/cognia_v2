<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    background:#f5f5f5;
  }
  #products, #cart{
    width:90%;
    max-width:800px;
    margin:20px 0;
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  h2{
    margin-top:0;
    font-size:1.5rem;
    text-align:center;
  }
  .prod{
    border-bottom:1px solid #ddd;
    padding:10px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .prod:last-child{border-bottom:none;}
  .prod h3{margin:0;font-size:1.1rem;}
  .prod p{margin:0;font-size:0.9rem;color:#555;}
  .prod button.add{
    padding:5px 10px;
    background:#28a745;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  .prod button.add:disabled{
    background:#aaa;
    cursor:not-allowed;
  }
  .linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:5px 0;
    border-bottom:1px solid #eee;
  }
  .linea:last-child{border-bottom:none;}
  .linea span.cant{font-weight:bold;}
  .linea button.quitar{
    padding:3px 6px;
    background:#dc3545;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  #total{
    font-weight:bold;
    font-size:1.2rem;
  }
  @media (max-width:600px){
    .prod{flex-direction:column;align-items:flex-start;}
    .prod button.add{margin-top:5px;}
  }
</style>
</head>
<body>
  <div id="products">
    <h2>Productos</h2>
  </div>
  <div id="cart">
    <h2>Carrito</h2>
    <div id="lines"></div>
    <div>Total: <span id="total"></span></div>
  </div>
<script>
const PRODUCTS = [
  {id:'p1', name:'Producto 1', price:100, stock:2},
  {id:'p2', name:'Producto 2', price:50, stock:3},
  {id:'p3', name:'Producto 3', price:25, stock:1}
];
const cart = {}; // {id: qty}

function formatPrice(value){
  return value.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
}

function createProductElement(prod){
  const div = document.createElement('div');
  div.className = 'prod';
  div.dataset.id = prod.id;
  div.dataset.precio = prod.price;
  div.dataset.stock = prod.stock;
  const h3 = document.createElement('h3');
  h3.textContent = prod.name;
  const p = document.createElement('p');
  p.textContent = 'Precio: ' + formatPrice(prod.price);
  const btn = document.createElement('button');
  btn.className = 'add';
  btn.dataset.id = prod.id;
  btn.textContent = 'Agregar';
  div.appendChild(h3);
  div.appendChild(p);
  div.appendChild(btn);
  return div;
}

function init(){
  const productsContainer = document.getElementById('products');
  PRODUCTS.forEach(prod => {
    const el = createProductElement(prod);
    productsContainer.appendChild(el);
  });

  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>addToCart(btn.dataset.id));
  });

  const linesContainer = document.getElementById('lines');
  linesContainer.addEventListener('click',e=>{
    if(e.target.matches('.quitar')){
      removeFromCart(e.target.dataset.id);
    }
  });

  updateTotal();
}

function addToCart(id){
  const prod = PRODUCTS.find(p=>p.id===id);
  if(!prod) return;
  const currentQty = cart[id]||0;
  if(currentQty>=prod.stock) return;
  cart[id] = currentQty+1;
  updateLine(id);
  updateAddButtonState(id);
  updateTotal();
}

function removeFromCart(id){
  const currentQty = cart[id]||0;
  if(currentQty<=0) return;
  cart[id] = currentQty-1;
  if(cart[id]===0){
    delete cart[id];
    removeLine(id);
  }else{
    updateLine(id);
  }
  updateAddButtonState(id);
  updateTotal();
}

function updateLine(id){
  const linesContainer = document.getElementById('lines');
  let line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
  if(!line){
    line = document.createElement('div');
    line.className = 'linea';
    line.dataset.id = id;
    const cantSpan = document.createElement('span');
    cantSpan.className = 'cant';
    cantSpan.textContent = cart[id];
    const btn = document.createElement('button');
    btn.className = 'quitar';
    btn.dataset.id = id;
    btn.textContent = 'Quitar';
    line.appendChild(cantSpan);
    line.appendChild(btn);
    linesContainer.appendChild(line);
  }else{
    line.querySelector('.cant').textContent = cart[id];
  }
}

function removeLine(id){
  const linesContainer = document.getElementById('lines');
  const line = linesContainer.querySelector(`.linea[data-id="${id}"]`);
  if(line) line.remove();
}

function updateAddButtonState(id){
  const prod = PRODUCTS.find(p=>p.id===id);
  const btn = document.querySelector(`.add[data-id="${id}"]`);
  if(!btn) return;
  const qty = cart[id]||0;
  btn.disabled = qty>=prod.stock;
}

function updateTotal(){
  const totalEl = document.getElementById('total');
  let total = 0;
  for(const id in cart){
    const prod = PRODUCTS.find(p=>p.id===id);
    total += prod.price * cart[id];
  }
  totalEl.textContent = formatPrice(total);
}

document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
