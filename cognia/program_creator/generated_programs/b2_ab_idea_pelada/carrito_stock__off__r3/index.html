<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con STOCK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f0f4f8;margin:0;padding:0;}
  .container{display:flex;flex-wrap:wrap;max-width:1200px;margin:auto;padding:20px;}
  .products{flex:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
  .prod{background:#fff;border-radius:8px;padding:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1);display:flex;flex-direction:column;align-items:center;}
  .prod .img{width:100%;height:150px;background:#cce5ff;border-radius:4px;margin-bottom:10px;}
  .prod h3{margin:5px 0;font-size:1.2em;}
  .prod .price,.prod .stock{margin:5px 0;font-size:0.9em;}
  .prod .add{margin-top:auto;padding:8px 12px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .prod .add:disabled{background:#aaa;cursor:not-allowed;}
  .cart{flex:1;padding:20px;background:#fff;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);margin-left:20px;}
  .cart h2{margin-top:0;}
  .linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:5px;border-bottom:1px solid #e0e0e0;}
  .linea .info{flex:1;}
  .linea .cant{font-weight:bold;}
  .linea .quitar{padding:4px 8px;background:#dc3545;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  .total{margin-top:20px;font-size:1.2em;font-weight:bold;}
  .total span{color:#007bff;}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img"></div>
      <h3 class="name">Producto 1</h3>
      <p class="price">Precio: <span class="precio">€100.00</span></p>
      <p class="stock">Stock: <span class="stock-qty">2</span></p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img"></div>
      <h3 class="name">Producto 2</h3>
      <p class="price">Precio: <span class="precio">€50.00</span></p>
      <p class="stock">Stock: <span class="stock-qty">3</span></p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img"></div>
      <h3 class="name">Producto 3</h3>
      <p class="price">Precio: <span class="precio">€25.00</span></p>
      <p class="stock">Stock: <span class="stock-qty">1</span></p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">€0.00</span></div>
  </div>
</div>
<script>
class Cart {
  constructor() {
    this.items = new Map(); // productId -> quantity
    this.products = {}; // productId -> {price, stock}
    this.initProducts();
    this.cartLinesContainer = document.getElementById('cart-lines');
    this.totalSpan = document.getElementById('total');
    this.updateTotal();
    this.attachAddButtons();
  }
  initProducts() {
    const prodDivs = document.querySelectorAll('.prod');
    prodDivs.forEach(div => {
      const id = div.dataset.id;
      const price = parseFloat(div.dataset.precio);
      const stock = parseInt(div.dataset.stock, 10);
      this.products[id] = {price, stock};
    });
  }
  attachAddButtons() {
    const addButtons = document.querySelectorAll('.add');
    addButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        this.add(id);
      });
    });
  }
  add(id) {
    const currentQty = this.items.get(id) || 0;
    const stock = this.products[id].stock;
    if (currentQty < stock) {
      this.items.set(id, currentQty + 1);
      this.updateLine(id);
      this.updateAddButtonState(id);
      this.updateTotal();
    }
  }
  remove(id) {
    const currentQty = this.items.get(id) || 0;
    if (currentQty > 0) {
      if (currentQty === 1) {
        this.items.delete(id);
        this.removeLine(id);
      } else {
        this.items.set(id, currentQty - 1);
        this.updateLine(id);
      }
      this.updateAddButtonState(id);
      this.updateTotal();
    }
  }
  updateLine(id) {
    let line = this.cartLinesContainer.querySelector(`.linea[data-id="${id}"]`);
    const qty = this.items.get(id);
    if (!line) {
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <div class="info">
          <span class="name">${this.getProductName(id)}</span> x <span class="cant">${qty}</span>
        </div>
        <button class="quitar" data-id="${id}">Quitar</button>
      `;
      this.cartLinesContainer.appendChild(line);
      line.querySelector('.quitar').addEventListener('click', () => this.remove(id));
    } else {
      const cantSpan = line.querySelector('.cant');
      cantSpan.textContent = qty;
    }
  }
  removeLine(id) {
    const line = this.cartLinesContainer.querySelector(`.linea[data-id="${id}"]`);
    if (line) line.remove();
  }
  updateAddButtonState(id) {
    const btn = document.querySelector(`.add[data-id="${id}"]`);
    const qty = this.items.get(id) || 0;
    btn.disabled = qty >= this.products[id].stock;
  }
  updateTotal() {
    let total = 0;
    this.items.forEach((qty, id) => {
      total += qty * this.products[id].price;
    });
    this.totalSpan.textContent = total.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
  }
  getProductName(id) {
    const div = document.querySelector(`.prod[data-id="${id}"]`);
    return div.querySelector('.name').textContent;
  }
}
document.addEventListener('DOMContentLoaded', () => new Cart());
</script>
</body>
</html>
