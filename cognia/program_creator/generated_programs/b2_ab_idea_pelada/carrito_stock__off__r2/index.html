<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Stock</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f9f9f9;}
  .prod{border:1px solid #ddd;padding:0.5rem;margin-bottom:0.5rem;background:#fff;}
  .prod button{margin-top:0.5rem;}
  #cart{margin-top:1rem;background:#fff;border:1px solid #ddd;padding:0.5rem;}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;}
  .linea span{margin-right:0.5rem;}
  #total{font-weight:bold;}
  button:disabled{opacity:0.5;}
</style>
</head>
<body>
<h1>Carrito de compra</h1>
<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - 100 €</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - 50 €</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - 25 €</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>
<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: <span id="total">0 €</span></div>

<script>
const PRODUCTS = [
  {id:'p1', precio:100, stock:2},
  {id:'p2', precio:50, stock:3},
  {id:'p3', precio:25, stock:1}
];
const cart = {}; // id -> quantity
function formatPrice(v){return v.toLocaleString('es-ES',{style:'currency',currency:'EUR'});}
function updateCart(){
  const cartDiv=document.getElementById('cart');
  cartDiv.innerHTML='';
  let total=0;
  for(const id in cart){
    const qty=cart[id];
    const prod=PRODUCTS.find(p=>p.id===id);
    total+=qty*prod.precio;
    const line=document.createElement('div');
    line.className='linea';
    line.dataset.id=id;
    const span=document.createElement('span');
    span.className='cant';
    span.textContent=qty;
    const btn=document.createElement('button');
    btn.className='quitar';
    btn.dataset.id=id;
    btn.textContent='Quitar';
    line.appendChild(span);
    line.appendChild(btn);
    cartDiv.appendChild(line);
  }
  document.getElementById('total').textContent=formatPrice(total);
  // update add buttons disabled state
  PRODUCTS.forEach(p=>{
    const btn=document.querySelector('.add[data-id="'+p.id+'"]');
    if(btn){
      const qty=cart[p.id]||0;
      btn.disabled=qty>=p.stock;
    }
  });
}
document.querySelectorAll('.add').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const id=btn.dataset.id;
    const prod=PRODUCTS.find(p=>p.id===id);
    const qty=cart[id]||0;
    if(qty<prod.stock){
      cart[id]=qty+1;
      updateCart();
    }
  });
});
document.addEventListener('click',e=>{
  if(e.target.classList.contains('quitar')){
    const id=e.target.dataset.id;
    const qty=cart[id]||0;
    if(qty>0){
      if(qty===1){
        delete cart[id];
      }else{
        cart[id]=qty-1;
      }
      updateCart();
    }
  }
});
updateCart();
</script>
</body>
</html>
