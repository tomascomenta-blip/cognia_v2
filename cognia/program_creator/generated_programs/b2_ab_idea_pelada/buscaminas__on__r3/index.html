<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5</title>
<style>
body{font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:400px;margin:auto;}
.c{background:#ddd;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;user-select:none;}
.c.abierta{background:#fff;}
.c.bandera{background:#ffd700;}
#estado{margin-top:20px;text-align:center;font-size:1.2rem;color:#900;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const grid=document.getElementById('grid');
for(let i=0;i<25;i++){
  const d=document.createElement('div');
  d.className='c';
  d.dataset.i=i;
  d.dataset.mine=mines.includes(i)?'1':'0';
  d.addEventListener('click',e=>{
    if(d.classList.contains('bandera')||d.classList.contains('abierta'))return;
    open(i);
  });
  d.addEventListener('contextmenu',e=>{
    e.preventDefault();
    if(d.classList.contains('abierta'))return;
    d.classList.toggle('bandera');
    d.textContent=d.classList.contains('bandera')?'🚩':'';
  });
  grid.appendChild(d);
}
function neighbors(i){
  const r=Math.floor(i/5),c=i%5;
  const arr=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<5&&nc>=0&&nc<5)arr.push(nr*5+nc);
  }
  return arr;
}
function countMines(i){return neighbors(i).filter(n=>grid.children[n].dataset.mine==='1').length;}
function open(i){
  const d=grid.children[i];
  if(d.dataset.mine==='1'){d.classList.add('abierta');d.textContent='💣';document.getElementById('estado').textContent='perdiste';return;}
  const cnt=countMines(i);
  d.classList.add('abierta');
  if(cnt>0)d.textContent=cnt;
  if(cnt===0){
    const q=[i];
    const visited=new Set([i]);
    while(q.length){
      const cur=q.shift();
      neighbors(cur).forEach(n=>{
        const nd=grid.children[n];
        if(nd.classList.contains('abierta')||nd.classList.contains('bandera')||visited.has(n))return;
        visited.add(n);
        const c=countMines(n);
        nd.classList.add('abierta');
        if(c>0)nd.textContent=c;
        if(c===0)q.push(n);
      });
    }
  }
}
</script>
</body>
</html>
