<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:#f0f0f0;
  }
  h1{
    margin-bottom:10px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    width:100%;
    max-width:400px;
  }
  .c{
    background:#ccc;
    border:1px solid #999;
    height:0;
    padding-bottom:100%;
    position:relative;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    user-select:none;
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera::after{
    content:"🚩";
    position:absolute;
    font-size:1.2rem;
  }
  #estado{
    margin-top:10px;
    font-weight:bold;
    color:#d00;
  }
</style>
</head>
<body>
<h1>Buscaminas 5x5</h1>
<div id="grid"></div>
<div id="estado"></div>
<script>
class Game{
  constructor(){
    this.grid=document.getElementById('grid');
    this.estado=document.getElementById('estado');
    this.cells=[];
    this.mines=new Set([6,12,18]); // posiciones fijas
    this.counts=new Array(25).fill(0);
    this.initGrid();
    this.computeCounts();
    this.addEventListeners();
  }
  initGrid(){
    for(let i=0;i<25;i++){
      const div=document.createElement('div');
      div.classList.add('c');
      div.dataset.i=i;
      this.grid.appendChild(div);
      this.cells.push(div);
    }
  }
  computeCounts(){
    for(let i=0;i<25;i++){
      if(this.mines.has(i)) continue;
      const cnt=this.getNeighbors(i).filter(n=>this.mines.has(n)).length;
      this.counts[i]=cnt;
    }
  }
  getNeighbors(i){
    const r=Math.floor(i/5),c=i%5;
    const neigh=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0) continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          neigh.push(nr*5+nc);
        }
      }
    }
    return neigh;
  }
  addEventListeners(){
    this.grid.addEventListener('click',e=>{
      const cell=e.target.closest('.c');
      if(!cell) return;
      this.handleLeftClick(cell);
    });
    this.grid.addEventListener('contextmenu',e=>{
      e.preventDefault();
      const cell=e.target.closest('.c');
      if(!cell) return;
      this.toggleFlag(cell);
    });
  }
  handleLeftClick(cell){
    const i=parseInt(cell.dataset.i);
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera')) return;
    if(this.mines.has(i)){
      this.estado.textContent='perdiste';
      cell.textContent='💣';
      cell.classList.add('abierta');
      return;
    }
    this.openCell(cell);
  }
  openCell(cell){
    const i=parseInt(cell.dataset.i);
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera')) return;
    cell.classList.add('abierta');
    const cnt=this.counts[i];
    if(cnt>0){
      cell.textContent=cnt;
    }else{
      cell.textContent='';
      this.getNeighbors(i).forEach(n=>{
        const nb=this.cells[n];
        if(!nb.classList.contains('abierta')&&!nb.classList.contains('bandera')){
          this.openCell(nb);
        }
      });
    }
  }
  toggleFlag(cell){
    if(cell.classList.contains('abierta')) return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
    }else{
      cell.classList.add('bandera');
    }
  }
}
document.addEventListener('DOMContentLoaded',()=>new Game());
</script>
</body>
</html>
