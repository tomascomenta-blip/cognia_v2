
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:50px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,60px);
    grid-template-rows:repeat(5,60px);
    gap:2px;
  }
  .c{
    background:#ccc;
    border:1px solid #999;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    opacity:0;
    animation:fadeIn 0.5s ease forwards;
  }
  .c:nth-child(n){
    animation-delay:calc(0.05s * (n-1));
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
  .c.abierta{
    background:#eee;
    cursor:default;
  }
  .c.bandera{
    background:#ff0;
  }
  #estado{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
  }
</style>
</head>
<body>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></div>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>

<script>
const mines = [6, 12, 18];
const cells = document.querySelectorAll('.c');
const estado = document.getElementById('estado');
let gameOver = false;

// Pre‑calcular número de minas adyacentes
const adjCount = new Array(25).fill(0);
cells.forEach((cell, i) => {
  if (mines.includes(i)) return;
  let count = 0;
  for (let di = -1; di <= 1; di++) {
    for (let dj = -1; dj <= 1; dj++) {
      if (di === 0 && dj === 0) continue;
      const ni = i + di * 5 + dj;
      if (ni >= 0 && ni < 25 && mines.includes(ni)) count++;
    }
  }
  adjCount[i] = count;
});

function openCell(i) {
  const cell = cells[i];
  if (cell.classList.contains('abierta') || cell.classList.contains('bandera') || gameOver) return;

  if (mines.includes(i)) {
    cell.textContent = '💣';
    cell.classList.add('abierta');
    estado.textContent = 'perdiste';
    gameOver = true;
    return;
  }

  cell.classList.add('abierta');
  const count = adjCount[i];
  if (count > 0) cell.textContent = count;

  if (count === 0) {
    // Cascada de apertura
    const stack = [i];
    while (stack.length) {
      const idx = stack.pop();
      for (let di = -1; di <= 1; di++) {
        for (let dj = -1; dj <= 1; dj++) {
          if (di === 0 && dj === 0) continue;
          const ni = idx + di * 5 + dj;
          if (ni >= 0 && ni < 25) {
            const ncell = cells[ni];
            if (!ncell.classList.contains('abierta') && !ncell.classList.contains('bandera')) {
              ncell.classList.add('abierta');
              const ncount = adjCount[ni];
              if (ncount > 0) ncell.textContent = ncount;
              if (ncount === 0) stack.push(ni);
            }
          }
        }
      }
    }
  }
}

cells.forEach((cell, i) => {
  cell.addEventListener('click', () => {
    if (gameOver) return;
    openCell(i);
  });

  cell.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (gameOver) return;
    if (cell.classList.contains('abierta')) return;
    cell.classList.toggle('bandera');
  });
});
</script>
</body>
</html>
