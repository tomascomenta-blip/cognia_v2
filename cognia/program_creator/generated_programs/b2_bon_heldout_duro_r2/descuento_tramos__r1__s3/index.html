<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora de Descuento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:#333;
  }
  .card{
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    width:90%;
    max-width:400px;
    text-align:center;
  }
  h1{
    margin:0;
    font-size:1.8em;
    color:#333;
  }
  input[type=number]{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:20px;
    font-size:1em;
    box-sizing:border-box;
  }
  #total-display{
    font-size:1.5em;
    margin-top:10px;
    color:#333;
  }
  .progress-bar{
    width:100%;
    height:8px;
    background:#e0e0e0;
    border-radius:4px;
    overflow:hidden;
    margin-top:10px;
  }
  .progress{
    height:100%;
    background:#1abc9c;
    width:0%;
    transition:width 0.3s ease;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Calculadora de Descuento</h1>
  <input id="cant" type="number" min="0" value="0" placeholder="Cantidad">
  <div id="total-display">Total: <span id="total">0.00</span></div>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>
</div>
<script>
  function calculate(){
    let qty = parseInt(document.getElementById('cant').value) || 0;
    if(qty < 0) qty = 0;
    let total = 0, remaining = qty;
    if(remaining > 0){
      let first = Math.min(10, remaining);
      total += first * 10;
      remaining -= first;
    }
    if(remaining > 0){
      let second = Math.min(40, remaining);
      total += second * 9;
      remaining -= second;
    }
    if(remaining > 0){
      total += remaining * 8;
    }
    document.getElementById('total').textContent =
      total.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
    updateProgress(qty);
  }
  function updateProgress(qty){
    const prog = document.getElementById('progress');
    if(qty <= 10) prog.style.width = '0%';
    else if(qty <= 50) prog.style.width = '50%';
    else prog.style.width = '100%';
  }
  window.addEventListener('DOMContentLoaded', function(){
    document.getElementById('cant').addEventListener('input', calculate);
    calculate();
  });
</script>
</body>
</html>
