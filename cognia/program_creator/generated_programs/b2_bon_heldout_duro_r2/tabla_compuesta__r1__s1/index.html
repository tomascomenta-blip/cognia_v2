<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tabla con Filtro, Orden y Paginación</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f4f8;
    color:#333;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding-top:2rem;
  }
  .container{
    width:90%;
    max-width:800px;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    padding:1.5rem;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .controls{
    width:100%;
    display:flex;
    align-items:center;
    gap:0.5rem;
    margin-bottom:1rem;
  }
  #q{
    flex:1;
    padding:0.5rem;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:1rem;
  }
  #ordenar{
    padding:0.5rem 1rem;
    background:#4a90e2;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:1rem;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
  }
  #ordenar:hover{
    background:#357ab8;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:1rem;
  }
  th,td{
    padding:0.75rem;
    text-align:left;
  }
  th{
    background:#e0e8f0;
    color:#333;
    font-weight:normal;
  }
  tr.fila:hover{
    background:#f5f9fc;
  }
  .pagination{
    display:flex;
    align-items:center;
    gap:1rem;
  }
  #prev,#sig{
    padding:0.5rem 1rem;
    background:#4a90e2;
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:1rem;
    box-shadow:0 2px 4px rgba(0,0,0,.1);
  }
  #prev:hover,#sig:hover{
    background:#357ab8;
  }
  @media(max-width:600px){
    .controls{
      flex-direction:column;
      align-items:flex-start;
    }
    #q{
      width:100%;
    }
    #ordenar{
      width:100%;
      margin-top:0.5rem;
    }
  }
</style>
</head>
<body>
<div class="container">
  <div class="controls">
    <input type="text" id="q" placeholder="Buscar nombre">
    <button id="ordenar">Ordenar edad</button>
  </div>
  <table>
    <thead>
      <tr><th>Nombre</th><th>Edad</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="pagination">
    <button id="prev">Prev</button>
    <span id="pagina">1</span>
    <button id="sig">Next</button>
  </div>
</div>
<script>
  // Constants
  const ROWS_PER_PAGE = 10;
  const DATA = [
    {nombre:"Ana", edad:28},
    {nombre:"Luis", edad:34},
    {nombre:"María", edad:22},
    {nombre:"Carlos", edad:45},
    {nombre:"Elena", edad:31},
    {nombre:"Javier", edad:39},
    {nombre:"Sofía", edad:27},
    {nombre:"Pedro", edad:50},
    {nombre:"Lucía", edad:24},
    {nombre:"Miguel", edad:36},
    {nombre:"Isabel", edad:29},
    {nombre:"Fernando", edad:41},
    {nombre:"Raquel", edad:33},
    {nombre:"Jorge", edad:38},
    {nombre:"Patricia", edad:26},
    {nombre:"Antonio", edad:47},
    {nombre:"Laura", edad:23},
    {nombre:"David", edad:40},
    {nombre:"Marta", edad:30},
    {nombre:"Roberto", edad:35},
    {nombre:"Verónica", edad:32},
    {nombre:"Alberto", edad:42}
  ];

  let filteredData = [...DATA];
  let orderAsc = true;
  let currentPage = 1;

  function sortData(){
    filteredData.sort((a,b)=> orderAsc ? a.edad - b.edad : b.edad - a.edad);
  }

  function render(){
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    const start = (currentPage-1)*ROWS_PER_PAGE;
    const end = start + ROWS_PER_PAGE;
    const pageData = filteredData.slice(start, end);
    for(const item of pageData){
      const tr = document.createElement('tr');
      tr.className = 'fila';
      tr.innerHTML = `<td>${item.nombre}</td><td>${item.edad}</td>`;
      tbody.appendChild(tr);
    }
    document.getElementById('pagina').textContent = currentPage;
  }

  function applyFilter(){
    const q = document.getElementById('q').value.trim().toLowerCase();
    filteredData = DATA.filter(item => item.nombre.toLowerCase().includes(q));
    sortData();
    currentPage = 1;
    render();
  }

  document.getElementById('q').addEventListener('input', applyFilter);

  document.getElementById('ordenar').addEventListener('click', () => {
    orderAsc = !orderAsc;
    sortData();
    render();
  });

  document.getElementById('prev').addEventListener('click', () => {
    if(currentPage > 1){
      currentPage--;
      render();
    }
  });

  document.getElementById('sig').addEventListener('click', () => {
    const maxPage = Math.ceil(filteredData.length / ROWS_PER_PAGE);
    if(currentPage < maxPage){
      currentPage++;
      render();
    }
  });

  // Initial load
  sortData();
  render();
</script>
</body>
</html>
