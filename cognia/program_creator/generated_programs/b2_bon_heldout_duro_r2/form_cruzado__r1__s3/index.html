<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario con Validación Cruzada</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#f0f0f0;font-family:Arial,sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;}
.wrapper{display:flex;justify-content:center;align-items:center;width:100%;height:100%;}
.card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:400px;width:90%;}
label{display:block;margin-bottom:5px;font-weight:600;}
input{width:100%;padding:8px;margin-bottom:15px;border:1px solid #ccc;border-radius:4px;}
input:focus{border-color:teal;outline:none;}
button{width:100%;padding:10px;border:none;border-radius:4px;background:#ccc;color:#666;cursor:not-allowed;transition:background .3s,box-shadow .3s;}
button.enabled{background:teal;color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);cursor:pointer;}
</style>
</head>
<body>
<div class="wrapper">
<div class="card">
<form id="form">
<label for="pass">Contraseña</label>
<input id="pass" type="password" autocomplete="new-password">
<label for="pass2">Confirmar Contraseña</label>
<input id="pass2" type="password" autocomplete="new-password">
<label for="edad">Edad</label>
<input id="edad" type="number" min="0">
<button id="enviar" disabled>Enviar</button>
</form>
</div>
</div>
<script>
const pass=document.getElementById('pass');
const pass2=document.getElementById('pass2');
const edad=document.getElementById('edad');
const btn=document.getElementById('enviar');
function validate(){
  const p=pass.value;
  const p2=pass2.value;
  const age=parseInt(edad.value,10);
  const ok=p.length>=8 && p===p2 && age>=18 && age<=120;
  btn.disabled=!ok;
  btn.classList.toggle('enabled',ok);
}
[pass,pass2,edad].forEach(el=>el.addEventListener('input',validate));
</script>
</body>
</html>
