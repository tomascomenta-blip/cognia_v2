<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Snake 10x10</title>
<style>
  body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    font-family:sans-serif;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
    gap:1px;
    width:90vmin;
    height:90vmin;
  }
  .cel{
    background:#333;
    position:relative;
  }
  .cel.snake{
    background:#0ff;
  }
  .cel.food{
    background:#ff6347;
  }
  .cel::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    box-shadow:inset 0 0 2px #000;
  }
  #status{
    position:absolute;
    top:10px;
    left:10px;
    color:#fff;
    background:rgba(0,0,0,0.5);
    padding:5px 10px;
    border-radius:5px;
    font-size:0.9rem;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="status"></div>
<script>
  (function(){
    const size = 10;
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');

    // Create grid cells
    for(let y=0; y<size; y++){
      for(let x=0; x<size; x++){
        const div = document.createElement('div');
        div.className = 'cel';
        div.dataset.x = x;
        div.dataset.y = y;
        gridEl.appendChild(div);
      }
    }

    // Helper to get cell element
    function getCell(x,y){
      return gridEl.querySelector(`[data-x="${x}"][data-y="${y}"]`);
    }

    // Initial snake and food
    let snake = [{x:5,y:5}];
    let dir = 'right';
    let food = null;

    function placeFood(){
      for(let y=0; y<size; y++){
        for(let x=0; x<size; x++){
          const cell = getCell(x,y);
          if(!cell.classList.contains('snake') && !cell.classList.contains('food')){
            cell.classList.add('food');
            food = {x,y};
            return;
          }
        }
      }
      food = null; // no empty cell
    }

    function updateStatus(){
      statusEl.textContent = `Largo: ${snake.length} | Pos: (${snake[snake.length-1].x},${snake[snake.length-1].y}) | Dir: ${dir}`;
    }

    function updateJuego(){
      window.juego = {
        largo: snake.length,
        x: snake[snake.length-1].x,
        y: snake[snake.length-1].y,
        dir: dir
      };
    }

    function move(){
      const head = snake[snake.length-1];
      let nx = head.x, ny = head.y;
      switch(dir){
        case 'up': ny--; break;
        case 'down': ny++; break;
        case 'left': nx--; break;
        case 'right': nx++; break;
      }
      // Bounds check
      if(nx<0||nx>=size||ny<0||ny>=size) return;
      // Collision with self
      for(const part of snake){
        if(part.x===nx && part.y===ny) return;
      }
      // Add new head
      snake.push({x:nx,y:ny});
      getCell(nx,ny).classList.add('snake');

      // Check food
      if(food && food.x===nx && food.y===ny){
        // Eat food: don't remove tail
        getCell(nx,ny).classList.remove('food');
        placeFood();
      }else{
        // Remove tail
        const tail = snake.shift();
        getCell(tail.x,tail.y).classList.remove('snake');
      }

      updateStatus();
      updateJuego();
    }

    // Key handling
    const opposite = {up:'down',down:'up',left:'right',right:'left'};
    document.addEventListener('keydown',e=>{
      let newDir=null;
      switch(e.key){
        case 'ArrowUp': newDir='up'; break;
        case 'ArrowDown': newDir='down'; break;
        case 'ArrowLeft': newDir='left'; break;
        case 'ArrowRight': newDir='right'; break;
      }
      if(newDir && newDir!==opposite[dir]){
        dir = newDir;
        move();
      }
    });

    // Initial placement
    getCell(5,5).classList.add('snake');
    placeFood();
    updateStatus();
    updateJuego();
  })();
</script>
</body>
</html>
