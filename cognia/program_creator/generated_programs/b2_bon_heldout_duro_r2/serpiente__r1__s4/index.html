<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snake 10x10</title>
<style>
  body{
    margin:0;
    padding:0;
    background:#222;
    color:#eee;
    font-family:monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }
  #score-bar{
    margin-bottom:10px;
    font-size:1.2rem;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    width:90vmin;
    aspect-ratio:1;
    border:2px solid #444;
  }
  .cel{
    width:100%;
    height:100%;
    border:1px solid #333;
    box-sizing:border-box;
  }
  .cel.snake{
    background:linear-gradient(135deg,#4caf50,#388e3c);
  }
  .cel.food{
    background:#f44336;
    box-shadow:0 0 8px 2px #ff5252;
  }
</style>
</head>
<body>
<div id="score-bar">Puntuación: <span id="score">1</span></div>
<div id="grid"></div>
<script>
(() => {
  const gridSize = 10;
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const cells = [];
  // Create grid cells
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const div = document.createElement('div');
      div.className = 'cel';
      div.dataset.x = x;
      div.dataset.y = y;
      gridEl.appendChild(div);
      cells.push(div);
    }
  }
  // Helper to get cell by coordinates
  const getCell = (x, y) => cells[y * gridSize + x];
  // Snake state
  let snake = [{x:5, y:5}];
  let dir = 'right';
  // Food state
  let food = null;
  const placeFood = () => {
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        if (!snake.some(s => s.x===x && s.y===y)) {
          food = {x, y};
          return;
        }
      }
    }
    food = null; // no space
  };
  placeFood();
  // Render function
  const render = () => {
    cells.forEach(c => c.classList.remove('snake','food'));
    snake.forEach(seg => getCell(seg.x, seg.y).classList.add('snake'));
    if (food) getCell(food.x, food.y).classList.add('food');
    scoreEl.textContent = snake.length;
    window.juego = {
      largo: snake.length,
      x: snake[0].x,
      y: snake[0].y,
      dir: dir
    };
  };
  // Movement
  const move = () => {
    const head = snake[0];
    let nx = head.x, ny = head.y;
    if (dir==='up') ny--; else if (dir==='down') ny++; else if (dir==='left') nx--; else if (dir==='right') nx++;
    // Wrap around
    if (nx<0) nx=gridSize-1; if (nx>=gridSize) nx=0;
    if (ny<0) ny=gridSize-1; if (ny>=gridSize) ny=0;
    // Check self-collision
    if (snake.some(s=>s.x===nx && s.y===ny)) return;
    const growing = food && food.x===nx && food.y===ny;
    snake.unshift({x:nx,y:ny});
    if (!growing) snake.pop();
    if (growing) placeFood();
    render();
  };
  // Key handling
  const opposite = {'up':'down','down':'up','left':'right','right':'left'};
  document.addEventListener('keydown', e=>{
    const key = e.key;
    let newDir=null;
    if (key==='ArrowUp') newDir='up';
    else if (key==='ArrowDown') newDir='down';
    else if (key==='ArrowLeft') newDir='left';
    else if (key==='ArrowRight') newDir='right';
    if (newDir && newDir!==dir && newDir!==opposite[dir]) {
      dir=newDir;
      move();
    }
  });
  // Initial render
  render();
})();
</script>
</body>
</html>
