<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario Validación Cruzada</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#e0e0e0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
  }
  .card{
    background:#f9f9f9;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    width:90%;
    max-width:400px;
  }
  .form-group{
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
  }
  label{
    margin-bottom:5px;
    font-weight:bold;
  }
  input{
    padding:8px;
    font-size:1rem;
    border:1px solid #ccc;
    border-radius:4px;
  }
  input:focus{
    outline:none;
    border-color:#66afe9;
    box-shadow:0 0 5px rgba(102,175,233,0.5);
  }
  .error{
    color:#d9534f;
    font-size:0.9rem;
    height:1.2rem;
    margin-top:3px;
  }
  button{
    padding:10px 15px;
    font-size:1rem;
    border:none;
    border-radius:4px;
    cursor:pointer;
    background:#ccc;
    color:#fff;
    opacity:0.6;
    transition:background 0.3s,opacity 0.3s;
  }
  button:enabled{
    background:#28a745;
    opacity:1;
  }
  button:enabled:hover{
    background:#218838;
  }
  button:disabled{
    cursor:not-allowed;
  }
  .ascii{
    text-align:center;
    font-family:monospace;
    color:#333;
    margin-bottom:15px;
  }
</style>
</head>
<body>
<div class="card">
  <pre class="ascii">
   _______
  /       \
 /  LOCK  \
/_________\
|  _____  |
| |     | |
| |     | |
| |_____| |
|_________|
  </pre>
  <div class="form-group">
    <label for="pass">Contraseña:</label>
    <input id="pass" type="password" autocomplete="new-password">
    <div class="error" id="passError"></div>
  </div>
  <div class="form-group">
    <label for="pass2">Confirmar Contraseña:</label>
    <input id="pass2" type="password" autocomplete="new-password">
    <div class="error" id="pass2Error"></div>
  </div>
  <div class="form-group">
    <label for="edad">Edad:</label>
    <input id="edad" type="number" min="0" max="200">
    <div class="error" id="edadError"></div>
  </div>
  <button id="enviar" disabled>Enviar</button>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function(){
    const pass = document.getElementById('pass');
    const pass2 = document.getElementById('pass2');
    const edad = document.getElementById('edad');
    const enviar = document.getElementById('enviar');
    const passError = document.getElementById('passError');
    const pass2Error = document.getElementById('pass2Error');
    const edadError = document.getElementById('edadError');

    function validate(){
      const p = pass.value;
      const p2 = pass2.value;
      const age = parseInt(edad.value,10);
      let valid = true;

      // Contraseña mínima 8 caracteres
      if(p.length < 8){
        passError.textContent = 'La contraseña debe tener al menos 8 caracteres.';
        valid = false;
      }else{
        passError.textContent = '';
      }

      // Contraseñas coinciden
      if(p !== p2){
        pass2Error.textContent = 'Las contraseñas no coinciden.';
        valid = false;
      }else{
        pass2Error.textContent = '';
      }

      // Edad entre 18 y 120
      if(isNaN(age) || age < 18 || age > 120){
        edadError.textContent = 'La edad debe estar entre 18 y 120.';
        valid = false;
      }else{
        edadError.textContent = '';
      }

      enviar.disabled = !valid;
    }

    pass.addEventListener('input', validate);
    pass2.addEventListener('input', validate);
    edad.addEventListener('input', validate);
  });
</script>
</body>
</html>
