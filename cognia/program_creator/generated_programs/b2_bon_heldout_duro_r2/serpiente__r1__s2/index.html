<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de la serpiente 10×10</title>
<style>
  body{margin:0;background:#222;color:#00f;font-family:sans-serif;}
  #top{height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;}
  #bottom{height:30px;display:flex;align-items:center;justify-content:center;font-weight:lighter;}
  #grid{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);
        width:100vw;height:calc(100vh - 60px);}
  .cel{border:1px solid #444;box-sizing:border-box;}
  .snake{background:#0f0;}
  .food{background:#f00;}
</style>
</head>
<body>
<div id="top">Puntuación: <span id="score">0</span></div>
<div id="grid"></div>
<div id="bottom">Use las flechas del teclado para mover la serpiente.</div>

<script>
(() => {
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const SIZE = 10;
  const dirs = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  const opposite = {ArrowUp:'ArrowDown',ArrowDown:'ArrowUp',ArrowLeft:'ArrowRight',ArrowRight:'ArrowLeft'};
  let snake = [{x:5,y:5}];
  let dir = 'ArrowRight';
  let food = null;

  // Create grid cells
  for(let y=0;y<SIZE;y++){
    for(let x=0;x<SIZE;x++){
      const div = document.createElement('div');
      div.className='cel';
      div.dataset.x = x;
      div.dataset.y = y;
      grid.appendChild(div);
    }
  }

  function getCell(x,y){return grid.querySelector(`.cel[data-x="${x}"][data-y="${y}"]`);}

  // Place snake head
  getCell(5,5).classList.add('snake');

  // Place food
  function placeFood(){
    let fx,fy;
    do{
      fx = Math.floor(Math.random()*SIZE);
      fy = Math.floor(Math.random()*SIZE);
    }while(snake.some(s=>s.x===fx && s.y===fy));
    getCell(fx,fy).classList.add('food');
    food = {x:fx,y:fy};
  }
  placeFood();

  function updateScore(){scoreEl.textContent = (snake.length-1).toString();}

  function exposeState(){
    window.juego = {
      largo: snake.length,
      x: snake[0].x,
      y: snake[0].y,
      dir: dir
    };
  }

  exposeState();
  updateScore();

  document.addEventListener('keydown',e=>{
    if(!(e.key in dirs)) return;
    if(opposite[e.key]===dir) return; // ignore 180° reverse
    dir = e.key;
    const delta = dirs[dir];
    const head = snake[0];
    let nx = (head.x + delta.x + SIZE)%SIZE;
    let ny = (head.y + delta.y + SIZE)%SIZE;
    const newHead = {x:nx,y:ny};

    const newCell = getCell(nx,ny);
    const ateFood = newCell.classList.contains('food');

    // Add new head
    newCell.classList.add('snake');
    snake.unshift(newHead);

    if(ateFood){
      newCell.classList.remove('food');
      placeFood();
    }else{
      // Remove tail
      const tail = snake.pop();
      getCell(tail.x,tail.y).classList.remove('snake');
    }

    exposeState();
    updateScore();
  });
})();
</script>
</body>
</html>
