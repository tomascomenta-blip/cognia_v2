<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora de Descuento por Tramos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin:0;
    font-family:Arial, sans-serif;
    background:#f9f9f9;
    color:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .card {
    background:#fff;
    padding:2rem;
    border-radius:8px;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
    max-width:400px;
    width:100%;
    text-align:center;
  }
  h1 {
    font-size:1.8rem;
    margin-bottom:1.5rem;
  }
  label {
    display:block;
    margin-bottom:0.5rem;
    font-weight:bold;
  }
  input[type=number] {
    width:100%;
    padding:0.75rem;
    font-size:1rem;
    border:1px solid #ccc;
    border-radius:4px;
    margin-bottom:1rem;
    transition:border-color 0.3s;
  }
  input[type=number]:focus {
    outline:none;
    border-color:#4caf50;
  }
  #total {
    display:block;
    background:#28a745;
    color:#fff;
    padding:1rem;
    font-size:1.5rem;
    border-radius:4px;
  }
  @media (max-width:480px) {
    h1 {font-size:1.5rem;}
    #total {font-size:1.2rem;}
  }
</style>
</head>
<body>
<div class="card">
  <h1>Calculadora de Descuento por Tramos</h1>
  <label for="cant">Cantidad</label>
  <input id="cant" type="number" min="0" value="0">
  <span id="total">0.00</span>
</div>

<script>
  class Calculator {
    constructor() {
      this.input = document.getElementById('cant');
      this.totalSpan = document.getElementById('total');
      this.update();
      this.input.addEventListener('input', () => this.update());
    }
    update() {
      const qty = Math.max(0, parseInt(this.input.value) || 0);
      const first = Math.min(qty, 10) * 10;
      const second = Math.min(Math.max(qty - 10, 0), 40) * 9;
      const third = Math.max(qty - 50, 0) * 8;
      const total = first + second + third;
      this.totalSpan.textContent = total.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }
  }
  const calculator = new Calculator();
</script>
</body>
</html>
