<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lista con Undo/Redo</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100vh;
  }
  .container{
    width:100%;
    max-width:400px;
    padding:20px;
    box-sizing:border-box;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    border-radius:8px;
    margin-top:20px;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  #txt{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:4px;
    margin-bottom:10px;
    font-size:14px;
  }
  .row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
  }
  button{
    flex:1;
    margin:0 5px;
    padding:8px;
    border:none;
    border-radius:4px;
    background:#e0e0e0;
    color:#333;
    cursor:pointer;
    transition:background 0.2s;
    font-size:14px;
  }
  button.active{
    background:#008080;
    color:white;
  }
  button:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }
  .list{
    flex:1;
    overflow-y:auto;
    border-top:1px solid #ddd;
    padding-top:10px;
  }
  .list ul{
    list-style:none;
    padding:0;
    margin:0;
  }
  .list li{
    padding:8px;
    border-bottom:1px solid #eee;
    color:#555;
    font-size:14px;
  }
</style>
</head>
<body>
<div class="container">
  <input type="text" id="txt" placeholder="Escribe un elemento">
  <div class="row">
    <button id="add">Añadir</button>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
  </div>
  <div class="list">
    <ul id="list"></ul>
  </div>
</div>
<script>
  const txt = document.getElementById('txt');
  const addBtn = document.getElementById('add');
  const undoBtn = document.getElementById('undo');
  const redoBtn = document.getElementById('redo');
  const list = document.getElementById('list');

  let actions = [];
  let currentIndex = 0;

  function render() {
    list.innerHTML = '';
    for (let i = 0; i < currentIndex; i++) {
      const li = document.createElement('li');
      li.className = 'it';
      li.textContent = actions[i];
      list.appendChild(li);
    }
  }

  function updateButtons() {
    undoBtn.disabled = currentIndex === 0;
    redoBtn.disabled = currentIndex === actions.length;
    undoBtn.className = undoBtn.disabled ? '' : 'active';
    redoBtn.className = redoBtn.disabled ? '' : 'active';
  }

  function addItem() {
    const text = txt.value.trim();
    if (!text) return;
    if (currentIndex < actions.length) {
      actions.splice(currentIndex);
    }
    actions.push(text);
    currentIndex++;
    render();
    updateButtons();
    txt.value = '';
    txt.focus();
  }

  function undo() {
    if (currentIndex === 0) return;
    currentIndex--;
    render();
    updateButtons();
  }

  function redo() {
    if (currentIndex === actions.length) return;
    currentIndex++;
    render();
    updateButtons();
  }

  addBtn.addEventListener('click', addItem);
  txt.addEventListener('keypress', e => {
    if (e.key === 'Enter') addItem();
  });
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  // Initial state
  render();
  updateButtons();
</script>
</body>
</html>
