<body>
    <div id="game-container">
        <h1>The Forbidden File</h1>
        <div id="map"></div>
        <div id="puzzle-container">
            <input type="text" id="puzzle-input" placeholder="Escribe la respuesta">
            <button onclick="solvePuzzle()">Resolver</button>
        </div>
        <div id="event-log"></div>
        <div id="controls">
            <button onclick="saveGame()">Guardar</button>
            <button onclick="loadGame()">Cargar</button>
        </div>
    </div>
    <script>
        const map = document.getElementById('map');
        const eventLog = document.getElementById('event-log');
        const puzzleInput = document.getElementById('puzzle-input');

        let gameState = {
            map: generateMap(),
            puzzles: generatePuzzles(),
            currentPuzzle: 0,
            events: [],
        };

        function generateMap() {
            // Generate a random map
            let map = '';
            for (let i = 0; i < 20; i++) {
                for (let j = 0; j < 20; j++) {
                    map += Math.random() > 0.5 ? '.' : '#';
                }
                map += '\n';
            }
            return map;
        }

        function generatePuzzles() {
            // Generate a list of random puzzles
            let puzzles = [];
            for (let i = 0; i < 60; i++) {
                puzzles.push({
                    question: `¿Cuál es el número secreto ${i + 1}?`,
                    answer: Math.floor(Math.random() * 1000) + 1,
                });
            }
            return puzzles;
        }

        function drawMap() {
            map.innerHTML = gameState.map.split('\n').map(row => `<p>${row}</p>`).join('');
        }

        function drawPuzzle() {
            const currentPuzzle = gameState.puzzles[gameState.currentPuzzle];
            if (currentPuzzle) {
                puzzleInput.value = '';
                eventLog.innerHTML += `<p>Puzzle: ${currentPuzzle.question}</p>`;
            }
        }

        function solvePuzzle() {
            const currentPuzzle = gameState.puzzles[gameState.currentPuzzle];
            if (currentPuzzle && parseInt(puzzleInput.value) === currentPuzzle.answer) {
                eventLog.innerHTML += `<p>Correcto!</p>`;
                gameState.currentPuzzle++;
                drawPuzzle();
            } else {
                eventLog.innerHTML += `<p>Incorrecto. Intenta de nuevo.</p>`;
            }
        }

        function saveGame() {
            localStorage.setItem('gameState', JSON.stringify(gameState));
            eventLog.innerHTML += `<p>Juego guardado.</p>`;
        }

        function loadGame() {
            const savedState = localStorage.getItem('gameState');
            if (savedState) {
                gameState = JSON.parse(savedState);
                drawMap();
                drawPuzzle();
                eventLog.innerHTML += `<p>Juego cargado.</p>`;
            } else {
                eventLog.innerHTML += `<p>No hay juego guardado.</p>`;
            }
        }

        drawMap();
        drawPuzzle();

        // Animation
        let counter = 0;
        setInterval(() => {
            counter++;
            const randomChange = Math.floor(Math.random() * 5) - 2; // Random change between -2 and 2
            const newPuzzle = gameState.puzzles[gameState.currentPuzzle];
            if (newPuzzle) {
                const newAnswer = newPuzzle.answer + randomChange;
                const puzzleElement = eventLog.querySelector(`p:last-child`);
                if (puzzleElement) {
                    puzzleElement.textContent = `Puzzle: ${newPuzzle.question} (Respuesta: ${newAnswer})`;
                    puzzleElement.style.color = (randomChange >= 0 ? 'green' : 'red');
                }
            }
        }, 700);
    </script>
