<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo 3x3</title>
<style>
  body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
    font-family:Arial,Helvetica,sans-serif;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    width:90%;
    max-width:400px;
  }
  .celda{
    width:100%;
    height:40px;
    border:none;
    text-align:right;
    padding:0 5px;
    font-size:1rem;
    font-weight:bold;
    color:#000;
    background:#fff;
  }
  .celda.formula{
    color:#00aa00;
  }
  .celda:focus{
    outline:none;
    background:#e6f7ff;
  }
  .celda::placeholder{
    color:#bbb;
  }
</style>
</head>
<body>
<div class="grid">
  <input type="text" class="celda" data-ref="A1">
  <input type="text" class="celda" data-ref="A2">
  <input type="text" class="celda" data-ref="A3">
  <input type="text" class="celda" data-ref="B1">
  <input type="text" class="celda" data-ref="B2">
  <input type="text" class="celda" data-ref="B3">
  <input type="text" class="celda" data-ref="C1">
  <input type="text" class="celda" data-ref="C2">
  <input type="text" class="celda" data-ref="C3">
</div>
<script>
  const cells = {};
  document.querySelectorAll('.celda').forEach(inp=>{
    const ref = inp.dataset.ref;
    cells[ref] = inp;
    inp.placeholder = ref;
    inp.dataset.raw = '';
    inp.addEventListener('input', onInput);
  });

  function onInput(e){
    const ref = e.target.dataset.ref;
    e.target.dataset.raw = e.target.value;
    recomputeAll();
  }

  function recomputeAll(){
    const memo = {};
    Object.keys(cells).forEach(ref=>evaluate(ref, memo, new Set()));
  }

  function evaluate(ref, memo, stack){
    if(memo.hasOwnProperty(ref)) return memo[ref];
    const inp = cells[ref];
    const raw = inp.dataset.raw || inp.value;
    if(raw.startsWith('=')){
      if(stack.has(ref)){
        memo[ref] = 'CIRC';
        inp.value = 'CIRC';
        inp.classList.add('formula');
        inp.classList.remove('number');
        return 'CIRC';
      }
      stack.add(ref);
      let expr = raw.slice(1);
      const refs = expr.match(/[A-Z][1-3]/g) || [];
      let hasCircular = false;
      refs.forEach(r=>{
        const val = evaluate(r, memo, stack);
        if(val === 'CIRC') hasCircular = true;
        const replaceWith = (val === '' || val === 'CIRC') ? '0' : val;
        expr = expr.replaceAll(r, replaceWith);
      });
      if(hasCircular){
        memo[ref] = 'CIRC';
        inp.value = 'CIRC';
        inp.classList.add('formula');
        inp.classList.remove('number');
        stack.delete(ref);
        return 'CIRC';
      }
      let result;
      try{
        result = Function('return '+expr)();
      }catch(e){
        result = 'CIRC';
      }
      memo[ref] = result;
      inp.value = result;
      inp.classList.add('formula');
      inp.classList.remove('number');
      stack.delete(ref);
      return result;
    }else{
      const val = raw.trim() === '' ? '' : raw;
      memo[ref] = val;
      inp.value = val;
      inp.classList.remove('formula');
      inp.classList.add('number');
      return val;
    }
  }

  // Initial calculation
  recomputeAll();
</script>
</body>
</html>
