<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;padding:8px;font-size:1rem;border:1px solid #ccc;border-radius:4px;background:#fff;}
  .celda:focus{outline:none;border-color:#4a90e2;}
  .header{font-weight:bold;text-align:center;}
</style>
</head>
<body>
<h2 class="header">Mini Hoja de Cálculo 3x3</h2>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" placeholder="A1">
  <input type="text" class="celda" data-ref="B1" placeholder="B1">
  <input type="text" class="celda" data-ref="C1" placeholder="C1">
  <input type="text" class="celda" data-ref="A2" placeholder="A2">
  <input type="text" class="celda" data-ref="B2" placeholder="B2">
  <input type="text" class="celda" data-ref="C2" placeholder="C2">
  <input type="text" class="celda" data-ref="A3" placeholder="A3">
  <input type="text" class="celda" data-ref="B3" placeholder="B3">
  <input type="text" class="celda" data-ref="C3" placeholder="C3">
</div>

<script>
(() => {
  const cells = {}; // map ref -> input element
  const formulaAttr = 'data-formula';

  // Initialize cells map
  document.querySelectorAll('.celda').forEach(inp => {
    const ref = inp.dataset.ref;
    cells[ref] = inp;
    inp.addEventListener('input', onCellInput);
  });

  function onCellInput(e) {
    const inp = e.target;
    const val = inp.value.trim();
    if (val.startsWith('=')) {
      inp.setAttribute(formulaAttr, val);
    } else {
      inp.removeAttribute(formulaAttr);
    }
    recalcAll();
  }

  function recalcAll() {
    // Evaluate all formula cells
    Object.keys(cells).forEach(ref => {
      const inp = cells[ref];
      if (inp.hasAttribute(formulaAttr)) {
        const result = evaluateCell(ref, new Set());
        inp.value = result;
      }
    });
  }

  function evaluateCell(ref, stack) {
    const inp = cells[ref];
    const formula = inp.getAttribute(formulaAttr);
    if (!formula) return parseValue(inp.value);

    if (stack.has(ref)) {
      return 'CIRC';
    }
    stack.add(ref);

    // Extract expression after '='
    const expr = formula.slice(1).trim();

    // Replace cell references with their evaluated values
    const replaced = expr.replace(/[A-C][1-3]/g, match => {
      const val = evaluateCell(match, new Set(stack));
      if (val === 'CIRC') return '0';
      return val;
    });

    // Evaluate the numeric expression
    let result;
    try {
      // Only allow + and - operators
      if (!/^[0-9+\-.\s]+$/.test(replaced)) throw new Error('Invalid chars');
      result = Function(`return ${replaced}`)();
      if (isNaN(result)) throw new Error('NaN');
    } catch (e) {
      result = 'CIRC';
    }

    stack.delete(ref);
    return result;
  }

  function parseValue(val) {
    const num = parseFloat(val);
    return isNaN(num) ? val : num;
  }

  // Initial calculation
  recalcAll();
})();
</script>
</body>
</html>
