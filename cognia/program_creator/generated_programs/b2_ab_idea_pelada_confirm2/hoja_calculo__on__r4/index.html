<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{
    font-family: monospace;
    background:#f0f0f0;
    padding:1rem;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  pre{
    margin:0 0 1rem 0;
    font-size:1rem;
    color:#333;
  }
  table{
    border-collapse:collapse;
    width:100%;
    max-width:400px;
  }
  td{
    border:1px solid #999;
    padding:0;
    width:33.33%;
    height:40px;
  }
  input.celda{
    width:100%;
    height:100%;
    border:none;
    padding:0 4px;
    box-sizing:border-box;
    font-size:1rem;
    text-align:right;
    background:#fff;
    color:#000;
  }
  input.celda:focus{
    outline:2px solid #0066ff;
  }
</style>
</head>
<body>
<pre>
  ┌───────┬───────┬───────┐
  │  A1   │  A2   │  A3   │
  ├───────┼───────┼───────┤
  │  B1   │  B2   │  B3   │
  ├───────┼───────┼───────┤
  │  C1   │  C2   │  C3   │
  └───────┴───────┴───────┘
</pre>
<table>
  <tr>
    <td><input class="celda" data-ref="A1" value=""></td>
    <td><input class="celda" data-ref="A2" value=""></td>
    <td><input class="celda" data-ref="A3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1" value=""></td>
    <td><input class="celda" data-ref="B2" value=""></td>
    <td><input class="celda" data-ref="B3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1" value=""></td>
    <td><input class="celda" data-ref="C2" value=""></td>
    <td><input class="celda" data-ref="C3" value="=A1+A2" data-formula="=A1+A2"></td>
  </tr>
</table>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const cells = document.querySelectorAll('input.celda');
  const refMap = {};
  cells.forEach(c => refMap[c.dataset.ref] = c);

  function formatNumber(n){
    return n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function computeFormula(formula, currentRef, visited){
    if(visited.has(currentRef)) return 'CIRC';
    visited.add(currentRef);
    let expr = formula.slice(1); // remove '='
    if(expr.trim()==='') return 0;
    expr = expr.replace(/[A-C][1-3]/g, match=>{
      const refCell = refMap[match];
      if(!refCell) return '0';
      let val;
      if(refCell.dataset.formula!==undefined){
        val = computeFormula(refCell.dataset.formula, match, visited);
      }else{
        val = parseFloat(refCell.value);
        if(isNaN(val)) val = 0;
      }
      if(val==='CIRC') return 'CIRC';
      return val;
    });
    if(expr.includes('CIRC')) return 'CIRC';
    try{
      const res = eval(expr);
      if(isNaN(res)) return 'CIRC';
      return res;
    }catch(e){ return 'CIRC'; }
  }

  function recomputeAll(){
    cells.forEach(cell=>{
      let val;
      if(cell.dataset.formula!==undefined){
        val = computeFormula(cell.dataset.formula, cell.dataset.ref, new Set());
      }else{
        val = parseFloat(cell.value);
        if(isNaN(val)) val = 0;
      }
      if(val==='CIRC'){
        cell.value = 'CIRC';
      }else{
        cell.value = formatNumber(val);
      }
    });
  }

  cells.forEach(cell=>{
    cell.addEventListener('input', function(){
      if(this.value.startsWith('=')){
        this.dataset.formula = this.value;
      }else{
        delete this.dataset.formula;
      }
      recomputeAll();
    });
  });

  recomputeAll();
});
</script>
</body>
</html>
