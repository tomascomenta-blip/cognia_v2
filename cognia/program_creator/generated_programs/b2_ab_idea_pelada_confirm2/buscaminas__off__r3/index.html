<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
body{font-family:sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;}
#grid{display:flex;flex-wrap:wrap;width:200px;}
.c{width:20%;height:40px;border:1px solid #999;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:1.2em;cursor:pointer;}
.abierta{background:#ddd;}
.bandera{background:#ff0;}
#estado{margin-top:10px;font-weight:bold;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18],grid=document.getElementById('grid'),cells=[];
for(let i=0;i<25;i++){const d=document.createElement('div');d.className='c';d.dataset.i=i;grid.appendChild(d);cells.push(d);}
function countAdj(i){const r=Math.floor(i/5),c=i%5;let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(!(dr===0&&dc===0)){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5){const ni=nr*5+nc;if(mines.includes(ni))cnt++;}}return cnt;}
function open(i){const cell=cells[i];if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;if(mines.includes(i)){cell.classList.add('abierta');document.getElementById('estado').textContent='perdiste';return;}const cnt=countAdj(i);cell.classList.add('abierta');if(cnt>0)cell.textContent=cnt;if(cnt===0)openRec(i);}
function openRec(i){const r=Math.floor(i/5),c=i%5;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(!(dr===0&&dc===0)){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5){const ni=nr*5+nc;if(mines.includes(ni))continue;const cell=cells[ni];if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))continue;const cnt=countAdj(ni);cell.classList.add('abierta');if(cnt>0)cell.textContent=cnt;if(cnt===0)openRec(ni);}}}
cells.forEach((cell,i)=>{cell.addEventListener('click',()=>open(i));cell.addEventListener('contextmenu',e=>{e.preventDefault();if(cell.classList.contains('abierta'))return;cell.classList.toggle('bandera');});});
</script>
</body>
</html>
