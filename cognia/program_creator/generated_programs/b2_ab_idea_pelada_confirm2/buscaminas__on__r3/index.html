
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
    background:#f0f0f0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,48px);
    grid-template-rows:repeat(5,48px);
    gap:2px;
  }
  .c{
    width:48px;height:48px;
    background:#bbb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    user-select:none;
    animation:fadeIn 0.6s ease forwards;
    animation-delay:calc(var(--i)*0.04s);
    opacity:0;
  }
  .c.abierta{
    background:#e0e0e0;
    cursor:default;
  }
  .c.abierta[data-mine="true"]{
    background:#f88;
  }
  .c.bandera{
    background:#bbb;
  }
  #estado{
    margin-top:20px;
    font-size:24px;
    color:#900;
  }
  @keyframes fadeIn{
    to{opacity:1;}
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>

<script>
(() => {
  const mines = new Set([6,12,18]); // posiciones fijas
  const grid = document.getElementById('grid');
  const estado = document.getElementById('estado');
  const total = 25;
  const cells = [];
  const adjCount = new Array(total).fill(0);
  const opened = new Set();
  const flagged = new Set();
  let gameOver = false;

  // Helper: get row/col from index
  const row = i => Math.floor(i/5);
  const col = i => i%5;

  // Compute adjacent mine counts
  for(let i=0;i<total;i++){
    let count=0;
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0 && dc===0) continue;
        const r=row(i)+dr, c=col(i)+dc;
        if(r<0||r>4||c<0||c>4) continue;
        const idx=r*5+c;
        if(mines.has(idx)) count++;
      }
    }
    adjCount[i]=count;
  }

  // Create cells
  for(let i=0;i<total;i++){
    const div=document.createElement('div');
    div.classList.add('c');
    div.dataset.i=i;
    div.dataset.mine=mines.has(i);
    div.style.setProperty('--i',i);
    grid.appendChild(div);
    cells.push(div);
  }

  // Event listeners
  grid.addEventListener('click', e=>{
    if(gameOver) return;
    const cell=e.target;
    if(!cell.classList.contains('c')) return;
    const i=parseInt(cell.dataset.i);
    if(flagged.has(i) || opened.has(i)) return;
    openCell(i);
  });

  grid.addEventListener('contextmenu', e=>{
    e.preventDefault();
    if(gameOver) return;
    const cell=e.target;
    if(!cell.classList.contains('c')) return;
    const i=parseInt(cell.dataset.i);
    if(opened.has(i)) return;
    if(flagged.has(i)){
      flagged.delete(i);
      cell.classList.remove('bandera');
    }else{
      flagged.add(i);
      cell.classList.add('bandera');
    }
  });

  function openCell(i){
    if(opened.has(i) || flagged.has(i)) return;
    const cell=cells[i];
    opened.add(i);
    cell.classList.add('abierta');
    if(mines.has(i)){
      cell.textContent='💣';
      estado.textContent='perdiste';
      gameOver=true;
      return;
    }
    const count=adjCount[i];
    if(count>0){
      cell.textContent=count;
    }else{
      // cascade
      const queue=[i];
      const visited=new Set([i]);
      while(queue.length){
        const cur=queue.shift();
        const curCell=cells[cur];
        const curCount=adjCount[cur];
        if(curCount>0){
          curCell.textContent=curCount;
          continue;
        }
        for(let dr=-1;dr<=1;dr++){
          for(let dc=-1;dc<=1;dc++){
            if(dr===0 && dc===0) continue;
            const r=row(cur)+dr, c=col(cur)+dc;
            if(r<0||r>4||c<0||c>4) continue;
            const idx=r*5+c;
            if(visited.has(idx)) continue;
            visited.add(idx);
            if(flagged.has(idx)) continue;
            opened.add(idx);
            const neighborCell=cells[idx];
            neighborCell.classList.add('abierta');
            const nCount=adjCount[idx];
            if(nCount>0){
              neighborCell.textContent=nCount;
            }else{
              queue.push(idx);
            }
          }
        }
      }
    }
  }
})();
</script>
</body>
</html>
