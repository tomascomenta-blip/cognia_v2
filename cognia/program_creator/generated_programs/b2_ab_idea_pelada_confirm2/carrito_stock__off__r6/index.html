<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Stock</title>
<style>
:root{
  --bg:#f5f5f5;
  --card:#fff;
  --text:#333;
  --accent:#009688;
  --border:#e0e0e0;
  --shadow:0 2px 8px rgba(0,0,0,.1);
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);}
.container{display:flex;flex-wrap:wrap;gap:20px;padding:20px;max-width:1200px;margin:auto;}
.products{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.prod{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;}
.prod .img{background:#ddd;height:150px;}
.prod .info{padding:10px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.prod h3{margin:0 0 5px;font-size:1.1rem;}
.prod .price{font-weight:bold;margin-bottom:5px;}
.prod .stock{font-size:.9rem;color:#777;margin-bottom:10px;}
.prod .add{background:var(--accent);color:#fff;border:none;padding:8px;cursor:pointer;font-size:.9rem;border-radius:4px;}
.prod .add:disabled{background:#bbb;cursor:not-allowed;}
.cart{width:280px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:10px;position:sticky;top:20px;height:fit-content;align-self:flex-start;}
.cart h2{margin-top:0;font-size:1.2rem;}
.linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.linea .cant{margin:0 5px;}
.linea .quitar{background:var(--accent);color:#fff;border:none;padding:4px 6px;cursor:pointer;font-size:.8rem;border-radius:4px;}
.total{margin-top:10px;font-weight:bold;font-size:1.1rem;}
@media(max-width:600px){
  .container{flex-direction:column;}
  .cart{width:100%;position:static;margin-top:20px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <div class="img"></div>
      <div class="info">
        <h3>Producto 1</h3>
        <div class="price">100 €</div>
        <div class="stock">Stock: 2</div>
        <button class="add" data-id="p1">Añadir</button>
      </div>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <div class="img"></div>
      <div class="info">
        <h3>Producto 2</h3>
        <div class="price">50 €</div>
        <div class="stock">Stock: 3</div>
        <button class="add" data-id="p2">Añadir</button>
      </div>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <div class="img"></div>
      <div class="info">
        <h3>Producto 3</h3>
        <div class="price">25 €</div>
        <div class="stock">Stock: 1</div>
        <button class="add" data-id="p3">Añadir</button>
      </div>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div id="cart-lines"></div>
    <div class="total">Total: <span id="total">0 €</span></div>
  </div>
</div>
<script>
(function(){
  const cart={};
  const products={};
  document.querySelectorAll('.prod').forEach(p=>{
    const id=p.dataset.id;
    const price=parseFloat(p.dataset.precio);
    const stock=parseInt(p.dataset.stock,10);
    const title=p.querySelector('h3').textContent;
    products[id]={price,stock,title};
  });
  const cartLines=document.getElementById('cart-lines');
  const totalEl=document.getElementById('total');
  function updateTotal(){
    let total=0;
    for(const id in cart) total+=cart[id]*products[id].price;
    totalEl.textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  }
  function updateAddButton(id){
    const btn=document.querySelector(`.add[data-id="${id}"]`);
    btn.disabled=cart[id]>=products[id].stock;
  }
  function addToCart(id){
    if(!cart[id]) cart[id]=0;
    if(cart[id]<products[id].stock){
      cart[id]++;
      const line=document.querySelector(`.linea[data-id="${id}"]`);
      if(line){
        line.querySelector('.cant').textContent=cart[id];
      }else{
        const div=document.createElement('div');
        div.className='linea';
        div.dataset.id=id;
        div.innerHTML=`<span class="title">${products[id].title}</span><span class="cant">${cart[id]}</span><button class="quitar" data-id="${id}">Quitar</button>`;
        cartLines.appendChild(div);
        div.querySelector('.quitar').addEventListener('click',()=>removeFromCart(id));
      }
      updateAddButton(id);
      updateTotal();
    }
  }
  function removeFromCart(id){
    if(cart[id]){
      cart[id]--;
      if(cart[id]<=0){
        const line=document.querySelector(`.linea[data-id="${id}"]`);
        if(line) line.remove();
        delete cart[id];
      }else{
        const line=document.querySelector(`.linea[data-id="${id}"]`);
        if(line) line.querySelector('.cant').textContent=cart[id];
      }
      updateAddButton(id);
      updateTotal();
    }
  }
  document.querySelectorAll('.add').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.id)));
})();
</script>
</body>
</html>
