<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:20px;
    background:#f0f0f0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    width:100%;
    max-width:400px;
  }
  .c{
    background:#e0e0e0;
    border:1px solid #999;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    user-select:none;
  }
  .c.abierta{
    background:#ddd;
    cursor:default;
  }
  .c.bandera{
    background:#e0e0e0;
  }
  #estado{
    margin-top:20px;
    font-size:1.2rem;
    font-weight:bold;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
(function(){
  'use strict';
  class Minesweeper{
    constructor(){
      this.size = 5;
      this.total = this.size * this.size;
      this.mines = [6, 12, 18];
      this.grid = document.getElementById('grid');
      this.estado = document.getElementById('estado');
      this.cells = [];
      this.init();
    }
    init(){
      for(let i=0;i<this.total;i++){
        const div = document.createElement('div');
        div.classList.add('c');
        div.dataset.i = i;
        div.addEventListener('click', e => this.handleLeft(e));
        div.addEventListener('contextmenu', e => this.handleRight(e));
        this.grid.appendChild(div);
        this.cells.push(div);
      }
    }
    handleLeft(e){
      const cell = e.currentTarget;
      if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
      const idx = parseInt(cell.dataset.i);
      if(this.mines.includes(idx)){
        cell.classList.add('abierta');
        cell.textContent = 'X';
        this.estado.textContent = 'perdiste';
        return;
      }
      const count = this.adjacentMines(idx);
      cell.classList.add('abierta');
      if(count > 0) cell.textContent = count;
      if(count === 0) this.cascadeOpen(idx);
    }
    handleRight(e){
      e.preventDefault();
      const cell = e.currentTarget;
      if(cell.classList.contains('abierta')) return;
      if(cell.classList.contains('bandera')){
        cell.classList.remove('bandera');
        cell.textContent = '';
      }else{
        cell.classList.add('bandera');
        cell.textContent = '🚩';
      }
    }
    adjacentMines(idx){
      const row = Math.floor(idx / this.size);
      const col = idx % this.size;
      let count = 0;
      for(let dr=-1; dr<=1; dr++){
        for(let dc=-1; dc<=1; dc++){
          if(dr===0 && dc===0) continue;
          const r = row + dr;
          const c = col + dc;
          if(r<0 || r>=this.size || c<0 || c>=this.size) continue;
          const nIdx = r * this.size + c;
          if(this.mines.includes(nIdx)) count++;
        }
      }
      return count;
    }
    cascadeOpen(startIdx){
      const queue = [startIdx];
      const visited = new Set();
      while(queue.length){
        const idx = queue.shift();
        if(visited.has(idx)) continue;
        visited.add(idx);
        const cell = this.cells[idx];
        if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) continue;
        const count = this.adjacentMines(idx);
        cell.classList.add('abierta');
        if(count > 0){
          cell.textContent = count;
        }else{
          cell.textContent = '';
          const row = Math.floor(idx / this.size);
          const col = idx % this.size;
          for(let dr=-1; dr<=1; dr++){
            for(let dc=-1; dc<=1; dc++){
              if(dr===0 && dc===0) continue;
              const r = row + dr;
              const c = col + dc;
              if(r<0 || r>=this.size || c<0 || c>=this.size) continue;
              const nIdx = r * this.size + c;
              if(!visited.has(nIdx)) queue.push(nIdx);
            }
          }
        }
      }
    }
  }
  new Minesweeper();
})();
</script>
</body>
</html>
