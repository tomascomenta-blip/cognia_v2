<!DOCTYPE html>
<html>
<head>
<title>Minesweeper 5x5</title>
<style>
#grid{display:flex;flex-wrap:wrap;width:100%;max-width:400px;margin:auto;}
.c{border:1px solid #999;box-sizing:border-box;width:20%;height:0;padding-bottom:20%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;user-select:none;}
.c.abierta{background:#ddd;cursor:default;}
.c.bandera{background:#ff0;}
.c.abierta[data-num="0"]::after{content:"";}
.c.abierta::after{content:attr(data-num);}
.c.bandera::after{content:"🚩";font-size:1.2rem;}
#estado{margin-top:10px;text-align:center;font-weight:bold;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[6,12,18];
const grid=document.getElementById('grid');
for(let i=0;i<25;i++){
  const d=document.createElement('div');
  d.className='c';
  d.dataset.i=i;
  d.dataset.num='';
  grid.appendChild(d);
}
function neighbors(i){const r=Math.floor(i/5),c=i%5;const res=[];for(let dr=-1;dr<=1;dr++){for(let dc=-1;dc<=1;dc++){if(dr===0&&dc===0)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<5&&nc>=0&&nc<5)res.push(nr*5+nc);}}return res;}
function countAdj(i){return neighbors(i).filter(n=>mines.includes(n)).length;}
function openCell(i){const cell=document.querySelector(`.c[data-i='${i}']`);if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;if(mines.includes(i)){cell.classList.add('abierta');cell.dataset.num='X';document.getElementById('estado').textContent='perdiste';return;}const cnt=countAdj(i);cell.classList.add('abierta');cell.dataset.num=cnt;if(cnt===0){neighbors(i).forEach(openCell);}}
grid.addEventListener('click',e=>{if(e.target.classList.contains('c'))openCell(parseInt(e.target.dataset.i));});
grid.addEventListener('contextmenu',e=>{e.preventDefault();const cell=e.target;if(cell.classList.contains('c')){if(cell.classList.contains('bandera')){cell.classList.remove('bandera');cell.dataset.num='';}else{cell.classList.add('bandera');cell.dataset.num='';}}});
</script>
</body>
</html>
