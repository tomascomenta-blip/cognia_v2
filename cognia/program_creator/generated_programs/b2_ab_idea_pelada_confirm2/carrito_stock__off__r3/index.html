<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito de compra con STOCK</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8fa;color:#333;}
  .container{display:flex;flex-wrap:wrap;max-width:1200px;margin:0 auto;padding:20px;}
  .products{flex:2;display:flex;flex-wrap:wrap;gap:20px;}
  .prod{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:15px;flex:1 1 calc(33% - 20px);box-sizing:border-box;}
  .prod h3{margin:0 0 10px;}
  .prod .precio,.prod .stock{display:block;margin:5px 0;}
  .prod .stock{background:#e0f7ff;color:#0066cc;padding:2px 6px;border-radius:4px;font-size:.9em;}
  .prod .add{background:#2a78d6;color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;}
  .prod .add:disabled{background:#a0c4ff;cursor:not-allowed;}
  .cart{flex:1;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:15px;margin-left:20px;height:fit-content;position:sticky;top:20px;}
  .cart h2{margin-top:0;}
  .cart-lines{margin-bottom:10px;}
  .linea{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .linea span.cant{font-weight:bold;}
  .linea button.quitar{background:#ff4d4d;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;}
  .linea button.quitar:hover{background:#ff1a1a;}
  .total{font-size:1.2em;font-weight:bold;text-align:right;}
  @media (max-width:768px){
    .container{flex-direction:column;}
    .products{flex-direction:column;}
    .prod{flex:1 1 100%;}
    .cart{margin-left:0;margin-top:20px;}
  }
</style>
</head>
<body>
<div class="container">
  <div class="products">
    <div class="prod" data-id="p1" data-precio="100" data-stock="2">
      <h3>Producto 1</h3>
      <p class="precio">Precio: <span>100,00 €</span></p>
      <p class="stock">Stock: <span>2</span></p>
      <button class="add" data-id="p1">Añadir</button>
    </div>
    <div class="prod" data-id="p2" data-precio="50" data-stock="3">
      <h3>Producto 2</h3>
      <p class="precio">Precio: <span>50,00 €</span></p>
      <p class="stock">Stock: <span>3</span></p>
      <button class="add" data-id="p2">Añadir</button>
    </div>
    <div class="prod" data-id="p3" data-precio="25" data-stock="1">
      <h3>Producto 3</h3>
      <p class="precio">Precio: <span>25,00 €</span></p>
      <p class="stock">Stock: <span>1</span></p>
      <button class="add" data-id="p3">Añadir</button>
    </div>
  </div>
  <div class="cart">
    <h2>Carrito</h2>
    <div class="cart-lines"></div>
    <div class="total">Total: <span id="total">0,00 €</span></div>
  </div>
</div>
<script>
class Product {
  constructor(el) {
    this.el = el;
    this.id = el.dataset.id;
    this.price = parseFloat(el.dataset.precio);
    this.stock = parseInt(el.dataset.stock, 10);
    this.addBtn = el.querySelector('.add');
  }
}
class Cart {
  constructor() {
    this.items = {}; // id -> quantity
    this.products = {}; // id -> Product
    this.cartLines = document.querySelector('.cart-lines');
    this.totalEl = document.getElementById('total');
    this.init();
  }
  init() {
    document.querySelectorAll('.prod').forEach(el => {
      const prod = new Product(el);
      this.products[prod.id] = prod;
      prod.addBtn.addEventListener('click', () => this.add(prod.id));
    });
    this.cartLines.addEventListener('click', e => {
      if (e.target.classList.contains('quitar')) {
        const id = e.target.dataset.id;
        this.remove(id);
      }
    });
    this.updateTotal();
  }
  add(id) {
    const prod = this.products[id];
    const qty = this.items[id] || 0;
    if (qty < prod.stock) {
      this.items[id] = qty + 1;
      this.renderLine(id);
      if (this.items[id] >= prod.stock) prod.addBtn.disabled = true;
      this.updateTotal();
    }
  }
  remove(id) {
    if (!this.items[id]) return;
    this.items[id] -= 1;
    const prod = this.products[id];
    if (this.items[id] <= 0) {
      delete this.items[id];
      this.removeLine(id);
      prod.addBtn.disabled = false;
    } else {
      this.updateLineQty(id);
      prod.addBtn.disabled = false;
    }
    this.updateTotal();
  }
  renderLine(id) {
    const line = this.cartLines.querySelector(`.linea[data-id="${id}"]`);
    if (line) {
      this.updateLineQty(id);
      return;
    }
    const prod = this.products[id];
    const lineDiv = document.createElement('div');
    lineDiv.className = 'linea';
    lineDiv.dataset.id = id;
    const nameSpan = document.createElement('span');
    nameSpan.textContent = prod.el.querySelector('h3').textContent;
    const qtySpan = document.createElement('span');
    qtySpan.className = 'cant';
    qtySpan.textContent = this.items[id];
    const removeBtn = document.createElement('button');
    removeBtn.className = 'quitar';
    removeBtn.dataset.id = id;
    removeBtn.textContent = 'Quitar';
    lineDiv.append(nameSpan, document.createTextNode(' x '), qtySpan, document.createTextNode(' '), removeBtn);
    this.cartLines.appendChild(lineDiv);
  }
  updateLineQty(id) {
    const line = this.cartLines.querySelector(`.linea[data-id="${id}"]`);
    if (line) {
      const qtySpan = line.querySelector('.cant');
      qtySpan.textContent = this.items[id];
    }
  }
  removeLine(id) {
    const line = this.cartLines.querySelector(`.linea[data-id="${id}"]`);
    if (line) line.remove();
  }
  updateTotal() {
    let total = 0;
    for (const id in this.items) {
      total += this.items[id] * this.products[id].price;
    }
    this.totalEl.textContent = total.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  }
}
document.addEventListener('DOMContentLoaded', () => new Cart());
</script>
</body>
</html>
