<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;}
  table{border-collapse:collapse;width:100%;max-width:400px;}
  td{border:1px solid #999;}
  input.celda{width:100%;box-sizing:border-box;padding:4px;font-size:1rem;}
</style>
</head>
<body>
<table>
  <tr>
    <td><input class="celda" data-ref="A1" value="1"></td>
    <td><input class="celda" data-ref="A2" value="2"></td>
    <td><input class="celda" data-ref="A3" value=""></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="B1" value="3"></td>
    <td><input class="celda" data-ref="B2" value="4"></td>
    <td><input class="celda" data-ref="B3" value="5"></td>
  </tr>
  <tr>
    <td><input class="celda" data-ref="C1" value="6"></td>
    <td><input class="celda" data-ref="C2" value="7"></td>
    <td><input class="celda" data-ref="C3" value="=A1+A2"></td>
  </tr>
</table>
<script>
(() => {
  const cells = {};          // ref -> {ref, input, formula, dependencies}
  const dependentsMap = {};   // ref -> Set of refs that depend on it
  const ignoreInput = {value:false};

  function init() {
    const inputs = document.querySelectorAll('input.celda');
    inputs.forEach(inp => {
      const ref = inp.dataset.ref;
      cells[ref] = {ref, input: inp, formula: null, dependencies: new Set()};
      inp.addEventListener('input', () => onInput(ref));
    });
    rebuildDependencies();
    propagateAll();
  }

  function onInput(ref) {
    if (ignoreInput.value) return;
    const cell = cells[ref];
    const val = cell.input.value.trim();
    cell.formula = val.startsWith('=') ? val.slice(1) : null;
    rebuildDependencies();
    propagate(ref);
  }

  function rebuildDependencies() {
    Object.values(cells).forEach(cell => cell.dependencies.clear());
    Object.keys(dependentsMap).forEach(k => dependentsMap[k] = new Set());
    Object.values(cells).forEach(cell => {
      if (cell.formula) {
        const refs = cell.formula.match(/[A-C][1-3]/g) || [];
        refs.forEach(r => {
          cell.dependencies.add(r);
          if (!dependentsMap[r]) dependentsMap[r] = new Set();
          dependentsMap[r].add(cell.ref);
        });
      }
    });
  }

  function propagateAll() {
    Object.keys(cells).forEach(ref => propagate(ref));
  }

  function propagate(ref, visited = new Set()) {
    if (visited.has(ref)) {
      setCellValue(ref, 'CIRC');
      return;
    }
    visited.add(ref);
    const cell = cells[ref];
    if (cell.formula) {
      const result = evaluateFormula(cell.formula, visited);
      setCellValue(ref, result);
    }
    if (dependentsMap[ref]) {
      dependentsMap[ref].forEach(depRef => propagate(depRef, new Set(visited)));
    }
  }

  function evaluateFormula(formula, visited) {
    let expr = formula;
    const refs = formula.match(/[A-C][1-3]/g) || [];
    for (const r of refs) {
      const val = getCellNumericValue(r, visited);
      if (val === 'CIRC') return 'CIRC';
      expr = expr.replaceAll(r, val);
    }
    try {
      const num = Function(`return ${expr}`)();
      return isNaN(num) ? 'CIRC' : num;
    } catch (e) {
      return 'CIRC';
    }
  }

  function getCellNumericValue(ref, visited) {
    const cell = cells[ref];
    if (!cell) return 0;
    if (cell.formula) {
      if (visited.has(ref)) return 'CIRC';
      visited.add(ref);
      const val = evaluateFormula(cell.formula, visited);
      visited.delete(ref);
      return val === 'CIRC' ? 'CIRC' : val;
    }
    const val = parseFloat(cell.input.value);
    return isNaN(val) ? 0 : val;
  }

  function setCellValue(ref, val) {
    const cell = cells[ref];
    ignoreInput.value = true;
    cell.input.value = val;
    ignoreInput.value = false;
  }

  init();
})();
</script>
</body>
</html>
