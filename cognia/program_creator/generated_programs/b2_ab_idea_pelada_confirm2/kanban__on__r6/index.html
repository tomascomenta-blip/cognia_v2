<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tablero Kanban</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f0f0;}
  h1{background:#333;color:#fff;text-align:center;padding:1rem;margin:0;}
  #board{display:flex;flex-wrap:wrap;justify-content:space-around;padding:1rem;}
  .col{background:#fff;border:1px solid #ccc;border-radius:4px;flex:1 1 30%;margin:0.5rem;min-width:250px;display:flex;flex-direction:column;}
  .col-header{background:#eee;padding:0.5rem;font-weight:bold;text-align:center;border-bottom:1px solid #ccc;}
  .card{background:#fafafa;border:1px solid #ddd;border-radius:4px;padding:0.5rem;margin:0.5rem;display:flex;justify-content:space-between;align-items:center;}
  .card button{margin-left:0.2rem;padding:0.2rem 0.4rem;font-size:0.9rem;}
  .counter{display:block;text-align:center;margin-top:0.5rem;font-weight:bold;}
</style>
</head>
<body>
<h1>Tablero Kanban</h1>
<div id="board">
  <div class="col" data-col="todo">
    <div class="col-header">Por Hacer <span id="cont-todo" class="counter"></span></div>
  </div>
  <div class="col" data-col="doing">
    <div class="col-header">En Progreso <span id="cont-doing" class="counter"></span></div>
  </div>
  <div class="col" data-col="done">
    <div class="col-header">Hecho <span id="cont-done" class="counter"></span></div>
  </div>
</div>
<script>
  // Configuraciones
  const MAX_DOING = 2;
  const INITIAL_TODO = ['t1', 't2', 't3'];

  // Crear tarjeta
  function createCard(id) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = id;
    card.textContent = id;

    const btnMas = document.createElement('button');
    btnMas.className = 'mas';
    btnMas.textContent = '+';

    const btnMenos = document.createElement('button');
    btnMenos.className = 'menos';
    btnMenos.textContent = '-';

    card.appendChild(btnMas);
    card.appendChild(btnMenos);
    return card;
  }

  // Inicializar tablero
  function init() {
    const todoCol = document.querySelector('[data-col="todo"]');
    INITIAL_TODO.forEach(id => {
      const card = createCard(id);
      todoCol.appendChild(card);
    });
    attachHandlers();
    updateCounters();
  }

  // Adjuntar eventos a botones
  function attachHandlers() {
    document.querySelectorAll('.mas').forEach(btn => {
      btn.addEventListener('click', e => {
        const card = e.target.parentElement;
        const currentCol = card.parentElement;
        const currentData = currentCol.dataset.col;

        if (currentData === 'todo') {
          const doingCol = document.querySelector('[data-col="doing"]');
          if (doingCol.querySelectorAll('.card').length >= MAX_DOING) return;
          doingCol.appendChild(card);
        } else if (currentData === 'doing') {
          const doneCol = document.querySelector('[data-col="done"]');
          doneCol.appendChild(card);
        }
        updateCounters();
      });
    });

    document.querySelectorAll('.menos').forEach(btn => {
      btn.addEventListener('click', e => {
        const card = e.target.parentElement;
        const currentCol = card.parentElement;
        const currentData = currentCol.dataset.col;

        if (currentData === 'doing') {
          const todoCol = document.querySelector('[data-col="todo"]');
          todoCol.appendChild(card);
        } else if (currentData === 'done') {
          const doingCol = document.querySelector('[data-col="doing"]');
          doingCol.appendChild(card);
        }
        updateCounters();
      });
    });
  }

  // Actualizar contadores
  function updateCounters() {
    const todoCount = document.querySelectorAll('[data-col="todo"] .card').length;
    const doingCount = document.querySelectorAll('[data-col="doing"] .card').length;
    const doneCount = document.querySelectorAll('[data-col="done"] .card').length;

    document.getElementById('cont-todo').textContent = todoCount;
    document.getElementById('cont-doing').textContent = doingCount;
    document.getElementById('cont-done').textContent = doneCount;
  }

  window.addEventListener('load', init);
</script>
</body>
</html>
