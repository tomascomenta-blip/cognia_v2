<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo</title>
<style>
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
input.celda{width:100%;padding:5px;box-sizing:border-box;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" value="">
<input class="celda" data-ref="A2" value="">
<input class="celda" data-ref="A3" value="">
<input class="celda" data-ref="B1" value="">
<input class="celda" data-ref="B2" value="">
<input class="celda" data-ref="B3" value="">
<input class="celda" data-ref="C1" value="">
<input class="celda" data-ref="C2" value="">
<input class="celda" data-ref="C3" value="=A1+A2">
</div>
<script>
const cells=document.querySelectorAll('.celda');
const map={};
cells.forEach(e=>map[e.dataset.ref]=e);
function evalCell(ref,stack){
  if(stack.has(ref)) return 'CIRC';
  stack.add(ref);
  const el=map[ref];
  const val=el.value;
  if(val.startsWith('=')){
    const expr=val.slice(1);
    let hasCirc=false;
    const replaced=expr.replace(/[A-C][1-3]/g,r=>{
      const resRef=evalCell(r,stack);
      if(resRef==='CIRC'){hasCirc=true;return '0';}
      return resRef;
    });
    let res;
    if(hasCirc){res='CIRC';}
    else{
      try{res=eval(replaced);}catch{res='CIRC';}
    }
    stack.delete(ref);
    el.value=res;
    el.setAttribute('value',res);
    return res;
  }else{
    stack.delete(ref);
    return val||'0';
  }
}
function recalc(){cells.forEach(e=>evalCell(e.dataset.ref,new Set()));}
cells.forEach(e=>e.addEventListener('input',recalc));
recalc();
</script>
</body>
</html>
