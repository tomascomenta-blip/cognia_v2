<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Hoja de Cálculo 3x3</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f0f0f0;}
  h1{font-size:1.5em;text-align:center;}
  pre{font-size:1.2em;text-align:center;margin:10px 0;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;max-width:400px;margin:auto;}
  .celda{width:100%;height:30px;padding:5px;font-size:1em;text-align:right;border:1px solid #ccc;border-radius:4px;background:#fff;}
  .celda:focus{outline:2px solid #4a90e2;}
  .circ{color:red;font-weight:bold;}
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<pre>
  _____  
 / ___/  
 \__ \   
 ___/ /  
/_____/  
</pre>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" />
  <input type="text" class="celda" data-ref="B1" />
  <input type="text" class="celda" data-ref="C1" />
  <input type="text" class="celda" data-ref="A2" />
  <input type="text" class="celda" data-ref="B2" />
  <input type="text" class="celda" data-ref="C2" />
  <input type="text" class="celda" data-ref="A3" />
  <input type="text" class="celda" data-ref="B3" />
  <input type="text" class="celda" data-ref="C3" />
</div>
<script>
(() => {
  const cells = {};
  document.querySelectorAll('.celda').forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = el;
    el.dataset.raw = ''; // initial raw value
    el.addEventListener('input', () => {
      el.dataset.raw = el.value;
      evaluateAll();
    });
  });

  function evaluateAll() {
    Object.keys(cells).forEach(ref => {
      const val = evaluateCell(ref, new Set());
      const el = cells[ref];
      if (val === 'CIRC') {
        el.value = 'CIRC';
        el.classList.add('circ');
      } else {
        el.value = val;
        el.classList.remove('circ');
      }
    });
  }

  function evaluateCell(ref, stack) {
    const el = cells[ref];
    const raw = el.dataset.raw.trim();
    if (!raw.startsWith('=')) {
      return raw;
    }
    if (stack.has(ref)) {
      return 'CIRC';
    }
    stack.add(ref);
    const expr = raw.slice(1); // remove '='
    const tokens = expr.match(/([A-Z][1-3])|(\d+(\.\d+)?)|([+-])/g);
    if (!tokens) return '';
    let result = null;
    let currentOp = '+';
    for (const token of tokens) {
      if (token === '+' || token === '-') {
        currentOp = token;
      } else if (/^[A-Z][1-3]$/.test(token)) {
        const depVal = evaluateCell(token, stack);
        if (depVal === 'CIRC') return 'CIRC';
        let num = parseFloat(depVal);
        if (isNaN(num)) num = 0;
        if (result === null) {
          result = num;
        } else {
          result = currentOp === '+' ? result + num : result - num;
        }
      } else if (/^\d+(\.\d+)?$/.test(token)) {
        let num = parseFloat(token);
        if (result === null) {
          result = num;
        } else {
          result = currentOp === '+' ? result + num : result - num;
        }
      }
    }
    stack.delete(ref);
    if (result === null) return '';
    const formatted = result.toLocaleString('es-ES', {minimumFractionDigits: 0, maximumFractionDigits: 2});
    return formatted;
  }

  evaluateAll();
})();
</script>
</body>
</html>
