<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;background:#f9f9f9;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;max-width:400px;margin:20px auto;}
.celda{width:100%;padding:5px;font-size:1rem;text-align:right;border:1px solid #ccc;border-radius:3px;}
</style>
</head>
<body>
<div class="grid">
<input type="text" class="celda" data-ref="A1" value="1">
<input type="text" class="celda" data-ref="A2" value="">
<input type="text" class="celda" data-ref="A3" value="">
<input type="text" class="celda" data-ref="B1" value="2">
<input type="text" class="celda" data-ref="B2" value="">
<input type="text" class="celda" data-ref="B3" value="">
<input type="text" class="celda" data-ref="C1" value="">
<input type="text" class="celda" data-ref="C2" value="">
<input type="text" class="celda" data-ref="C3" value="=A1+B1">
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cells = document.querySelectorAll('.celda');
  const refMap = {};
  const dependents = {}; // ref -> Set of refs that depend on it
  const formulas = {}; // ref -> formula string (without '=')
  cells.forEach(cell => {
    const ref = cell.dataset.ref;
    refMap[ref] = cell;
    dependents[ref] = new Set();
  });
  function parseRefs(formula) {
    return (formula.match(/[A-C][1-3]/g) || []);
  }
  function addDependencies(ref, formula) {
    parseRefs(formula).forEach(dep => {
      if (dependents[dep]) dependents[dep].add(ref);
    });
  }
  function removeDependencies(ref, formula) {
    parseRefs(formula).forEach(dep => {
      if (dependents[dep]) dependents[dep].delete(ref);
    });
  }
  function evaluateCell(ref, visited = new Set()) {
    if (visited.has(ref)) {
      refMap[ref].value = 'CIRC';
      return 'CIRC';
    }
    visited.add(ref);
    const formula = formulas[ref];
    if (formula) {
      const tokens = formula.split(/([+-])/);
      let result = 0;
      let op = '+';
      for (let token of tokens) {
        token = token.trim();
        if (token === '' || token === '+' || token === '-') {
          if (token === '+' || token === '-') op = token;
          continue;
        }
        let num;
        if (/[A-C][1-3]/.test(token)) {
          const val = evaluateCell(token, new Set(visited));
          if (val === 'CIRC') {
            refMap[ref].value = 'CIRC';
            return 'CIRC';
          }
          num = parseFloat(val) || 0;
        } else {
          num = parseFloat(token) || 0;
        }
        if (op === '+') result += num;
        else result -= num;
      }
      refMap[ref].value = result.toString();
      return result.toString();
    } else {
      return refMap[ref].value;
    }
  }
  function recalc(ref, visited = new Set()) {
    if (visited.has(ref)) return;
    visited.add(ref);
    evaluateCell(ref);
    dependents[ref].forEach(dep => recalc(dep, visited));
  }
  // Initial setup
  cells.forEach(cell => {
    const ref = cell.dataset.ref;
    const val = cell.value;
    if (val.startsWith('=')) {
      const formula = val.slice(1);
      formulas[ref] = formula;
      addDependencies(ref, formula);
    }
  });
  // Evaluate all cells
  Object.keys(refMap).forEach(ref => recalc(ref));
  // Event listeners
  cells.forEach(cell => {
    cell.addEventListener('input', () => {
      const ref = cell.dataset.ref;
      const newVal = cell.value;
      const oldFormula = formulas[ref] || null;
      const newFormula = newVal.startsWith('=') ? newVal.slice(1) : null;
      if (oldFormula !== newFormula) {
        if (oldFormula) removeDependencies(ref, oldFormula);
        if (newFormula) addDependencies(ref, newFormula);
        formulas[ref] = newFormula;
      }
      recalc(ref);
    });
  });
});
</script>
</body>
</html>
