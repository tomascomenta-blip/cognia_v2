<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Buscaminas 5x5 con 3 minas fijas</title>
<style>
  body{
    font-family: Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:20px;
    background:#f0f0f0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
    width:100%;
    max-width:400px;
  }
  .c{
    background:#d3d3d3;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    cursor:pointer;
    user-select:none;
    border:1px solid #999;
  }
  .c.abierta{
    background:#e0e0e0;
    cursor:default;
  }
  .c.bandera{
    background:#ffeb3b;
  }
  #estado{
    margin-top:15px;
    font-size:1.2rem;
    color:#d32f2f;
    min-height:1.2em;
  }
</style>
</head>
<body>
<h1>Buscaminas 5x5</h1>
<div id="grid">
  <div class="c" data-i="0"></div>
  <div class="c" data-i="1"></div>
  <div class="c" data-i="2"></div>
  <div class="c" data-i="3"></div>
  <div class="c" data-i="4"></div>
  <div class="c" data-i="5"></div>
  <div class="c" data-i="6"></div>
  <div class="c" data-i="7"></div>
  <div class="c" data-i="8"></div>
  <div class="c" data-i="9"></div>
  <div class="c" data-i="10"></div>
  <div class="c" data-i="11"></div>
  <div class="c" data-i="12"></div>
  <div class="c" data-i="13"></div>
  <div class="c" data-i="14"></div>
  <div class="c" data-i="15"></div>
  <div class="c" data-i="16"></div>
  <div class="c" data-i="17"></div>
  <div class="c" data-i="18"></div>
  <div class="c" data-i="19"></v>
  <div class="c" data-i="20"></div>
  <div class="c" data-i="21"></div>
  <div class="c" data-i="22"></div>
  <div class="c" data-i="23"></div>
  <div class="c" data-i="24"></div>
</div>
<div id="estado"></div>

<script>
(() => {
  const GRID_SIZE = 5;
  const MINE_POSITIONS = [6,12,18];
  const cells = Array.from(document.querySelectorAll('.c'));
  const mines = new Set(MINE_POSITIONS);
  const estado = document.getElementById('estado');

  function getNeighbors(idx){
    const r = Math.floor(idx/GRID_SIZE);
    const c = idx%GRID_SIZE;
    const neighbors = [];
    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        const nr=r+dr, nc=c+dc;
        if(nr>=0 && nr<GRID_SIZE && nc>=0 && nc<GRID_SIZE){
          neighbors.push(nr*GRID_SIZE+nc);
        }
      }
    }
    return neighbors;
  }

  function countAdjMines(idx){
    return getNeighbors(idx).filter(n=>mines.has(n)).length;
  }

  function openCell(idx){
    const cell = cells[idx];
    if(cell.classList.contains('abierta') || cell.classList.contains('bandera')) return;
    cell.classList.add('abierta');
    if(mines.has(idx)){
      cell.textContent = '💣';
      estado.textContent = 'perdiste';
      return;
    }
    const adj = countAdjMines(idx);
    if(adj>0){
      cell.textContent = adj;
    } else {
      // cascade
      const stack = [idx];
      while(stack.length){
        const current = stack.pop();
        const neigh = getNeighbors(current);
        neigh.forEach(n=>{
          const nCell = cells[n];
          if(!nCell.classList.contains('abierta') && !nCell.classList.contains('bandera') && !mines.has(n)){
            nCell.classList.add('abierta');
            const adjN = countAdjMines(n);
            if(adjN>0){
              nCell.textContent = adjN;
            } else {
              stack.push(n);
            }
          }
        });
      }
    }
  }

  cells.forEach(cell=>{
    cell.addEventListener('click', e=>{
      const idx = parseInt(cell.dataset.i,10);
      openCell(idx);
    });
    cell.addEventListener('contextmenu', e=>{
      e.preventDefault();
      if(cell.classList.contains('abierta')) return;
      if(cell.classList.contains('bandera')){
        cell.classList.remove('bandera');
        cell.textContent = '';
      } else {
        cell.classList.add('bandera');
        cell.textContent = '🚩';
      }
    });
  });
})();
</script>
</body>
</html>
