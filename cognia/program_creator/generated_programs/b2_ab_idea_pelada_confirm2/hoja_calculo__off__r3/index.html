
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini hoja de cálculo</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:20px;}
  table{border-collapse:collapse;margin:auto;}
  td{border:1px solid #000;width:60px;height:30px;}
  input.celda{width:100%;height:100%;box-sizing:border-box;text-align:right;padding:0 5px;font-size:16px;border:none;background:none;}
</style>
</head>
<body>
<table>
<tr>
  <td><input class="celda" data-ref="A1"></td>
  <td><input class="celda" data-ref="A2"></td>
  <td><input class="celda" data-ref="A3"></td>
</tr>
<tr>
  <td><input class="celda" data-ref="B1"></td>
  <td><input class="celda" data-ref="B2"></td>
  <td><input class="celda" data-ref="B3"></td>
</tr>
<tr>
  <td><input class="celda" data-ref="C1"></td>
  <td><input class="celda" data-ref="C2"></td>
  <td><input class="celda" data-ref="C3"></td>
</tr>
</table>
<script>
(() => {
  const cells = {};
  const inputs = document.querySelectorAll('input.celda');
  inputs.forEach(el => {
    const ref = el.dataset.ref;
    cells[ref] = el;
    if (el.value.trim().startsWith('=')) {
      el.dataset.formula = el.value.trim();
    } else {
      delete el.dataset.formula;
    }
  });

  let updating = false;

  function recomputeAll() {
    if (updating) return;
    updating = true;
    const cache = {};

    function computeValue(ref, stack) {
      if (stack.includes(ref)) return 'CIRC';
      if (cache[ref] !== undefined) return cache[ref];
      const el = cells[ref];
      const formula = el.dataset.formula;
      if (!formula) {
        const val = el.value.trim();
        const num = parseFloat(val);
        const result = isNaN(num) ? val : num;
        cache[ref] = result;
        return result;
      }
      const expr = formula.slice(1).trim();
      const tokens = expr.split(/([+-])/);
      let idx = 0;
      let current;
      const first = tokens[0].trim();
      if (/^[A-C][1-3]$/.test(first)) {
        current = computeValue(first, stack.concat(ref));
      } else {
        current = parseFloat(first);
        if (isNaN(current)) current = 0;
      }
      idx = 1;
      while (idx < tokens.length) {
        const op = tokens[idx].trim();
        const operandStr = tokens[idx+1].trim();
        let operand;
        if (/^[A-C][1-3]$/.test(operandStr)) {
          operand = computeValue(operandStr, stack.concat(ref));
        } else {
          operand = parseFloat(operandStr);
          if (isNaN(operand)) operand = 0;
        }
        if (operand === 'CIRC' || current === 'CIRC') {
          current = 'CIRC';
          break;
        }
        if (op === '+') current += operand;
        else if (op === '-') current -= operand;
        idx += 2;
      }
      cache[ref] = current;
      return current;
    }

    Object.keys(cells).forEach(ref => {
      const el = cells[ref];
      if (el.dataset.formula) {
        const val = computeValue(ref, []);
        el.value = val === 'CIRC' ? 'CIRC' : val.toString();
      }
    });

    updating = false;
  }

  inputs.forEach(el => {
    el.addEventListener('input', () => {
      if (updating) return;
      const val = el.value.trim();
      if (val.startsWith('=')) {
        el.dataset.formula = val;
      } else {
        delete el.dataset.formula;
      }
      recomputeAll();
    });
  });

  recomputeAll();
})();
</script>
</body>
</html>
