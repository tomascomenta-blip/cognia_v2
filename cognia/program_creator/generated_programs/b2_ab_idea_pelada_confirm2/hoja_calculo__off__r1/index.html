<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo</title>
<style>
body{font-family:sans-serif;margin:0;padding:10px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.celda{width:100%;padding:5px;box-sizing:border-box;}
</style>
</head>
<body>
<div class="grid">
<input class="celda" data-ref="A1" />
<input class="celda" data-ref="A2" />
<input class="celda" data-ref="A3" />
<input class="celda" data-ref="B1" />
<input class="celda" data-ref="B2" />
<input class="celda" data-ref="B3" />
<input class="celda" data-ref="C1" />
<input class="celda" data-ref="C2" />
<input class="celda" data-ref="C3" />
</div>
<script>
const cells=document.querySelectorAll('.celda');
const map={};
cells.forEach(c=>{map[c.dataset.ref]=c;});
function evalCell(ref,vis){
  const c=map[ref];
  const f=c.dataset.formula||'';
  if(!f||!f.startsWith('='))return f||'0';
  if(vis.has(ref))return' CIRC';
  vis.add(ref);
  let e=f.slice(1);
  e=e.replace(/[A-C][1-3]/g,m=>{
    const r=evalCell(m,vis);
    if(r==='CIRC')return'NaN';
    return r;
  });
  try{
    const r=Function('"use strict";return ('+e+')')();
    if(isNaN(r))return'CIRC';
    return r.toString();
  }catch{return'CIRC';}
  finally{vis.delete(ref);}
}
function recompute(){
  cells.forEach(c=>{
    const f=c.dataset.formula||'';
    if(f.startsWith('=')){
      const r=evalCell(c.dataset.ref,new Set());
      c.value=r;
    }else{
      c.value=f;
    }
  });
}
cells.forEach(c=>{
  c.addEventListener('input',e=>{
    c.dataset.formula=c.value;
    recompute();
  });
});
</script>
</body>
</html>
