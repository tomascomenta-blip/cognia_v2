<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en una página</title>
<style>
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#f0f0f0; }
  #board { display:flex; flex-wrap:wrap; height:100vh; }
  .col { flex:1; min-width:250px; border:1px solid #ccc; box-sizing:border-box; padding:10px; display:flex; flex-direction:column; background:#fff; }
  .col h2 { margin:0 0 10px 0; font-size:1.2em; display:flex; justify-content:space-between; align-items:center; }
  .card { background:#f9f9f9; border:1px solid #ddd; padding:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .card button { margin-left:4px; }
  @media (max-width:600px){ #board{flex-direction:column;} }
</style>
</head>
<body>
<div id="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo"></span></h2>
    <div class="card" data-id="t1" data-col="todo">
      <span>Tarea t1</span>
      <div>
        <button class="menos">←</button>
        <button class="mas">→</button>
      </div>
    </div>
    <div class="card" data-id="t2" data-col="todo">
      <span>Tarea t2</span>
      <div>
        <button class="menos">←</button>
        <button class="mas">→</button>
      </div>
    </div>
    <div class="card" data-id="t3" data-col="todo">
      <span>Tarea t3</span>
      <div>
        <button class="menos">←</button>
        <button class="mas">→</button>
      </div>
    </div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing <span id="cont-doing"></span></h2>
  </div>
  <div class="col" data-col="done">
    <h2>Done <span id="cont-done"></span></h2>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  function updateCounters() {
    const todoCount = document.querySelectorAll('.col[data-col="todo"] .card').length;
    const doingCount = document.querySelectorAll('.col[data-col="doing"] .card').length;
    const doneCount = document.querySelectorAll('.col[data-col="done"] .card').length;
    document.getElementById('cont-todo').textContent = todoCount;
    document.getElementById('cont-doing').textContent = doingCount;
    document.getElementById('cont-done').textContent = doneCount;
  }

  function moveCard(card, direction) {
    const currentCol = card.getAttribute('data-col');
    let targetCol;
    if (direction === 1) {
      if (currentCol === 'todo') targetCol = 'doing';
      else if (currentCol === 'doing') targetCol = 'done';
      else return; // done cannot advance
    } else if (direction === -1) {
      if (currentCol === 'doing') targetCol = 'todo';
      else if (currentCol === 'done') targetCol = 'doing';
      else return; // todo cannot retreat
    }

    // WIP rule: doing max 2
    if (targetCol === 'doing') {
      const doingCount = document.querySelectorAll('.col[data-col="doing"] .card').length;
      if (doingCount >= 2) return; // cannot move into doing
    }

    // Move card
    card.setAttribute('data-col', targetCol);
    const targetColumnEl = document.querySelector('.col[data-col="' + targetCol + '"]');
    targetColumnEl.appendChild(card);
    updateCounters();
  }

  // Attach event listeners to buttons
  const buttons = document.querySelectorAll('.card button');
  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      const card = btn.parentElement.parentElement; // button -> div -> card
      if (btn.classList.contains('mas')) {
        moveCard(card, 1);
      } else if (btn.classList.contains('menos')) {
        moveCard(card, -1);
      }
    });
  });

  updateCounters();
});
</script>
</body>
</html>
