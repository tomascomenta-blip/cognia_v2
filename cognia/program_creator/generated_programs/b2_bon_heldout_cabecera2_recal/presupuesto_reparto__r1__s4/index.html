<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reparto de presupuesto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#333;
    line-height:1.4;
  }
  .container{
    max-width:400px;
    margin:0 auto;
    padding:20px;
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
  }
  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:20px;
  }
  .total-row span{
    color:#3a9c9c; /* accent teal */
  }
  .parts{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .part{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .part input.pct{
    width:60px;
    padding:4px;
    border:1px solid #3a9c9c; /* accent teal */
    border-radius:4px;
    background:#fff;
    color:#333;
    text-align:right;
  }
  .part span.eur{
    color:#333;
  }
  .libre-row{
    margin-top:20px;
    font-size:1rem;
    color:#777;
  }
  #aviso{
    margin-top:8px;
    font-size:0.9rem;
    color:#a00; /* muted red */
  }
</style>
</head>
<body>
<div class="container">
  <div class="total-row"><span>Total</span> <span id="total">100</span></div>
  <div class="parts">
    <div class="part" data-id="a1">
      <input class="pct" data-id="a1" type="number" value="30" min="0" max="100" step="1">
      <span class="eur" data-id="a1"></span>
    </div>
    <div class="part" data-id="a2">
      <input class="pct" data-id="a2" type="number" value="30" min="0" max="100" step="1">
      <span class="eur" data-id="a2"></span>
    </div>
    <div class="part" data-id="a3">
      <input class="pct" data-id="a3" type="number" value="40" min="0" max="100" step="1">
      <span class="eur" data-id="a3"></span>
    </div>
  </div>
  <div class="libre-row"><span id="libre"></span></div>
  <div id="aviso"></div>
</div>
<script>
const TOTAL = 100;
function formatCurrency(val){return val.toLocaleString('es-ES',{style:'currency',currency:'EUR'});}
function update(){
  const inputs=document.querySelectorAll('.pct');
  let sum=0;
  inputs.forEach(inp=>{const v=parseFloat(inp.value)||0;sum+=v;});
  const libre=TOTAL-sum;
  document.getElementById('aviso').textContent=libre<0?'limite':'';
  document.getElementById('libre').textContent=libre.toFixed(0)+'%';
  inputs.forEach(inp=>{
    const pct=parseFloat(inp.value)||0;
    const eur=pct/100*TOTAL;
    document.querySelector('.eur[data-id="'+inp.dataset.id+'"]').textContent=formatCurrency(eur);
  });
}
function init(){
  const inputs=document.querySelectorAll('.pct');
  inputs.forEach(inp=>{inp.dataset.prev=inp.value;});
  update();
  inputs.forEach(inp=>{
    inp.addEventListener('input',e=>{
      const newVal=parseFloat(e.target.value)||0;
      const prev=parseFloat(e.target.dataset.prev)||0;
      const all=document.querySelectorAll('.pct');
      let sum=0;
      all.forEach(i=>{
        sum+= (i===e.target)?newVal:parseFloat(i.value)||0;
      });
      if(sum>TOTAL){
        e.target.value=e.target.dataset.prev;
        document.getElementById('aviso').textContent='limite';
        return;
      }
      e.target.dataset.prev=newVal;
      update();
    });
  });
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
