<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con Packs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .cart{
    background:#fff;
    max-width:400px;
    width:90%;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .product-name{
    font-weight:600;
  }
  button{
    padding:6px 12px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:600;
    color:#fff;
  }
  button.add{background:#1976d2;}
  button.quitar{background:#d32f2f;}
  .cant{
    background:#c8e6c9;
    color:#004d40;
    padding:4px 8px;
    border-radius:12px;
    font-weight:600;
  }
  .summary{
    display:flex;
    justify-content:flex-end;
    gap:20px;
    margin-top:20px;
    font-weight:600;
  }
  .summary span{
    display:flex;
    align-items:center;
    gap:4px;
  }
</style>
</head>
<body>
<div class="cart">
  <div class="row">
    <div class="product-name">Pan</div>
    <button class="add" data-id="pan">Añadir</button>
    <span class="cant" data-id="pan">0</span>
    <button class="quitar" data-id="pan">Quitar</button>
  </div>
  <div class="row">
    <div class="product-name">Leche</div>
    <button class="add" data-id="leche">Añadir</button>
    <span class="cant" data-id="leche">0</span>
    <button class="quitar" data-id="leche">Quitar</button>
  </div>
  <div class="summary">
    <span>Packs: <span id="packs">0</span></span>
    <span>Total: <span id="total">0,00 €</span></span>
  </div>
</div>

<script>
(() => {
  const prices = { pan: 2, leche: 3, pack: 4 };
  const qty = { pan: 0, leche: 0 };

  const update = () => {
    // Update quantity badges
    document.querySelectorAll('.cant').forEach(el => {
      const id = el.dataset.id;
      el.textContent = qty[id];
    });

    // Calculate packs and total
    const packs = Math.min(qty.pan, qty.leche);
    const total = packs * prices.pack +
                  (qty.pan - packs) * prices.pan +
                  (qty.leche - packs) * prices.leche;

    // Update summary
    document.getElementById('packs').textContent = packs;
    document.getElementById('total').textContent =
      total.toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
  };

  // Event listeners
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      qty[id]++;
      update();
    });
  });

  document.querySelectorAll('.quitar').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      if (qty[id] > 0) qty[id]--;
      update();
    });
  });

  // Initial render
  update();
})();
</script>
</body>
</html>
