<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito con Packs</title>
<style>
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
  }
  .cart{
    background:#fff;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    width:100%;
    max-width:350px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
  }
  .row span{
    flex:1;
    text-align:center;
  }
  .cant{
    color:#333;
    font-weight:bold;
  }
  button{
    width:30px;
    height:30px;
    border:none;
    border-radius:4px;
    font-size:18px;
    cursor:pointer;
  }
  .add{
    background:#4caf50;
    color:#fff;
  }
  .quitar{
    background:#f44336;
    color:#fff;
  }
  .summary{
    margin-top:20px;
    text-align:right;
  }
  #packs{
    color:#777;
    font-size:0.9em;
  }
  #total{
    color:#008080;
    font-weight:bold;
    font-size:1.2em;
  }
  @media(max-width:400px){
    .row span{font-size:0.9em;}
    button{width:28px;height:28px;font-size:16px;}
  }
</style>
</head>
<body>
<div class="cart">
  <div class="row">
    <span>Pan</span>
    <button class="add" data-id="pan">+</button>
    <span class="cant" data-id="pan">0</span>
    <button class="quitar" data-id="pan">-</button>
  </div>
  <div class="row">
    <span>Leche</span>
    <button class="add" data-id="leche">+</button>
    <span class="cant" data-id="leche">0</span>
    <button class="quitar" data-id="leche">-</button>
  </div>
  <div class="summary">
    <div id="packs">Packs: 0</div>
    <div id="total">Total: $0.00</div>
  </div>
</div>
<script>
  const prices = { pan: 2, leche: 3, pack: 4 };
  const counts = { pan: 0, leche: 0 };

  function updateDisplay() {
    // Update quantities
    document.querySelectorAll('.cant').forEach(span => {
      const id = span.dataset.id;
      span.textContent = counts[id];
    });

    // Calculate packs and total
    const packs = Math.min(counts.pan, counts.leche);
    const total = packs * prices.pack
                + (counts.pan - packs) * prices.pan
                + (counts.leche - packs) * prices.leche;

    // Update summary
    document.getElementById('packs').textContent = `Packs: ${packs}`;
    document.getElementById('total').textContent = `Total: ${total.toLocaleString('es-ES', {style:'currency', currency:'USD'})}`;
  }

  function addItem(id) {
    counts[id]++;
    updateDisplay();
  }

  function removeItem(id) {
    if (counts[id] > 0) {
      counts[id]--;
      updateDisplay();
    }
  }

  // Attach event listeners
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => addItem(btn.dataset.id));
  });
  document.querySelectorAll('.quitar').forEach(btn => {
    btn.addEventListener('click', () => removeItem(btn.dataset.id));
  });

  // Initial render
  updateDisplay();
</script>
</body>
</html>
