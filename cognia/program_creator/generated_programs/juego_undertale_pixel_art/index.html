<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego Undertale Pixel Art</title>
<style>
body { background: #0e0c0a; color: #c3c3c3; font-family: monospace; }
.row { display: flex; justify-content: space-between; }
.row span { display: block; width: 40px; text-align: center; }
#grafico { margin-top: 20px; }
</style>
</head>
<body>
<div class="row">
  <span class="estado up" style="color: rgb(195, 195, 195)">Estado</span>
  <span class="hp up" style="color: rgb(195, 195, 195)">HP</span>
  <span class="mp up" style="color: rgb(195, 195, 195)">MP</span>
</div>
<div id="grafico" width="100%" height="220"></div>

<script>
var hp = 100, mp = 100, puntos = [50, 70, 80, 90, 100];
setInterval(() => {
  hp += Math.random() * 10 - 5;
  mp += Math.random() * 10 - 5;
  puntos.push(hp);
  puntos.shift();
  pintar(puntos);
}, 1000);

function pintar(datos) {
  var svg = document.getElementById('grafico');
  var M = { arriba: 20, abajo: 20, izq: 12, der: 12 }, W = 580, H = 200;
  var y0 = Math.min.apply(null, datos), y1 = Math.max.apply(null, datos);
  if (y1 - y0 < 1) { y0 -= 1; y1 += 1; }
  var x = function(i) { return M.izq + (W - M.izq - M.der) * i / Math.max(1, datos.length - 1); };
  var y = function(v) { return M.arriba + (H - M.arriba - M.abajo) * (1 - (v - y0) / (y1 - y0)); };
  var linea = datos.map(function(v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join('');
  var rejilla = '', etiquetas = '';
  for (var k = 0; k <= 3; k++) {
    var v = y0 + (y1 - y0) * k / 3, yy = y(v).toFixed(1);
    rejilla += '<line x1="' + M.izq + '" x2="' + (W - M.der) + '" y1="' + yy + '" y2="' + yy + '" stroke="#e1e0d9" stroke-width="1"/>';
    etiquetas += '<text x="' + (M.izq - 8) + '" y="' + yy + '" dy="4" text-anchor="end" font-size="11" fill="#898781">' + Math.round(v).toLocaleString('es-ES') + '</text>';
  }
  svg.innerHTML = rejilla + etiquetas + '<polyline points="' + linea + '" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>';
  document.querySelector('.estado').style.color = (hp >= 100 ? 'green' : 'red');
  document.querySelector('.hp').style.color = (hp >= 100 ? 'green' : 'red');
  document.querySelector('.mp').style.color = (mp >= 100 ? 'green' : 'red');
}

window.onload = () => {
  hp = 100, mp = 100, puntos = [50, 70, 80, 90, 100];
  pintar(puntos);
};
</script>
</body>
</html>
