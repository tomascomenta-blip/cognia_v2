<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscaminas 5x5 con 3 minas fijas</title>
<style>
  body{font-family:Arial,sans-serif;background:#f0f0f0;margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:300px;width:100%;}
  .c{background:#ccc;border:1px solid #999;position:relative;cursor:pointer;width:60px;height:60px;display:flex;align-items:center;justify-content:center;}
  .c span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5em;display:none;}
  .c.abierta span{display:block;}
  .c.bandera::after{content:"🚩";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.5em;}
  #estado{margin-top:15px;font-size:1.2em;color:#d00;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="estado"></div>
<script>
const mines=[false,false,false,false,false,false,true,false,false,false,false,false,true,false,false,false,false,false,true,false,false,false,false,false];
const counts=new Array(25).fill(0);
function neighbors(i){
  const r=Math.floor(i/5),c=i%5;
  const res=[];
  for(let dr=-1;dr<=1;dr++){
    for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0)continue;
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<5&&nc>=0&&nc<5)res.push(nr*5+nc);
    }
  }
  return res;
}
for(let i=0;i<25;i++){
  let cnt=0;
  for(const n of neighbors(i))if(mines[n])cnt++;
  counts[i]=cnt;
}
const grid=document.getElementById('grid');
const cells=new Array(25);
for(let i=0;i<25;i++){
  const div=document.createElement('div');
  div.className='c';
  div.dataset.i=i;
  const span=document.createElement('span');
  div.appendChild(span);
  div.onclick = () => openCell(i);
  div.oncontextmenu = e => { e.preventDefault(); toggleFlag(i); };
  grid.appendChild(div);
  cells[i]=div;
}
function openCell(i){
  const cell=cells[i];
  if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
  cell.classList.add('abierta');
  const span=cell.querySelector('span');
  if(mines[i]){
    span.textContent='M';
    span.style.color='red';
    document.getElementById('estado').textContent='perdiste';
    return;
  }
  if(counts[i]>0){
    span.textContent=counts[i];
    span.style.color='green';
  }
  if(counts[i]===0){
    const queue=[i];
    const visited=new Set();
    while(queue.length){
      const cur=queue.shift();
      for(const n of neighbors(cur)){
        if(visited.has(n))continue;
        visited.add(n);
        const ncell=cells[n];
        if(ncell.classList.contains('abierta')||ncell.classList.contains('bandera'))continue;
        ncell.classList.add('abierta');
        const nspan=ncell.querySelector('span');
        if(mines[n]){
          nspan.textContent='M';
          nspan.style.color='red';
          document.getElementById('estado').textContent='perdiste';
          continue;
        }
        if(counts[n]>0){
          nspan.textContent=counts[n];
          nspan.style.color='green';
        }
        if(counts[n]===0)queue.push(n);
      }
    }
  }
}
function toggleFlag(i){
  const cell=cells[i];
  if(cell.classList.contains('abierta'))return;
  if(cell.classList.contains('bandera')){
    cell.classList.remove('bandera');
  }else{
    cell.classList.add('bandera');
  }
}
</script>
</body>
</html>
