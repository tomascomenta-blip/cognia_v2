<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Minesweeper 5x5 Demo</title>
<style>
  body{margin:0;font-family:Arial,sans-serif;background:#e0e0e0;display:flex;flex-direction:column;align-items:center;min-height:100vh;justify-content:center;}
  #title{font-size:1.5rem;font-weight:bold;margin:10px;color:#333;}
  #estado{font-size:1.2rem;margin:5px;color:#333;}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;width:90%;max-width:400px;}
  .c{position:relative;width:100%;padding-top:100%;background:#f0f0f0;border:1px solid #ccc;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:bold;color:#000;user-select:none;}
  .c.abierta{background:#add8e6;color:#000;pointer-events:none;}
  .c.bandera{background:#f0f0f0;color:#ff0000;pointer-events:none;}
  .c.mina{background:#f0f0f0;color:#ff0000;pointer-events:none;}
  .c.mina.revealed{background:#f0f0f0;color:#ff0000;}
</style>
</head>
<body>
<div id="title">Minesweeper 5x5 Demo</div>
<div id="estado">jugando</div>
<div id="grid"></div>
<script>
(function(){
  const mines=[6,12,18];
  const grid=document.getElementById('grid');
  const cells=[];
  const counts=new Array(25).fill(0);
  // create cells
  for(let i=0;i<25;i++){
    const div=document.createElement('div');
    div.className='c';
    div.dataset.i=i;
    grid.appendChild(div);
    cells.push(div);
  }
  // compute adjacent mine counts
  function getNeighbors(i){
    const r=Math.floor(i/5),c=i%5;
    const neigh=[];
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<5&&nc>=0&&nc<5){
          neigh.push(nr*5+nc);
        }
      }
    }
    return neigh;
  }
  for(let i=0;i<25;i++){
    if(mines.includes(i))continue;
    const neigh=getNeighbors(i);
    let cnt=0;
    for(const n of neigh) if(mines.includes(n))cnt++;
    counts[i]=cnt;
  }
  const estado=document.getElementById('estado');
  let gameOver=false;
  function revealMine(i){
    const cell=cells[i];
    cell.classList.add('mina','revealed');
    cell.textContent='💣';
  }
  function revealAllMines(){
    for(const m of mines){
      const cell=cells[m];
      if(!cell.classList.contains('abierta')){
        cell.classList.add('mina','revealed');
        cell.textContent='💣';
      }
    }
  }
  function openCell(i){
    if(gameOver)return;
    const cell=cells[i];
    if(cell.classList.contains('abierta')||cell.classList.contains('bandera'))return;
    if(mines.includes(i)){
      revealMine(i);
      estado.textContent='perdiste';
      gameOver=true;
      revealAllMines();
      return;
    }
    // open cell
    cell.classList.add('abierta');
    const cnt=counts[i];
    if(cnt>0)cell.textContent=cnt;
    else{
      // cascade
      const queue=[i];
      const visited=new Set();
      visited.add(i);
      while(queue.length){
        const cur=queue.shift();
        const neigh=getNeighbors(cur);
        for(const n of neigh){
          const ncell=cells[n];
          if(ncell.classList.contains('abierta')||ncell.classList.contains('bandera'))continue;
          ncell.classList.add('abierta');
          const ncnt=counts[n];
          if(ncnt>0){
            ncell.textContent=ncnt;
          }else{
            queue.push(n);
          }
        }
      }
    }
    // check win
    const openedCount=cells.filter(c=>c.classList.contains('abierta')).length;
    if(openedCount===22){
      estado.textContent='ganaste';
      gameOver=true;
    }
  }
  function toggleFlag(i){
    if(gameOver)return;
    const cell=cells[i];
    if(cell.classList.contains('abierta'))return;
    if(cell.classList.contains('bandera')){
      cell.classList.remove('bandera');
      cell.textContent='';
    }else{
      cell.classList.add('bandera');
      cell.textContent='🚩';
    }
  }
  // event listeners
  cells.forEach((cell,i)=>{
    cell.addEventListener('click',()=>openCell(i));
    cell.addEventListener('contextmenu',e=>{
      e.preventDefault();
      toggleFlag(i);
    });
  });
  // auto simulation
  let openSteps=0;
  const maxOpen=5;
  const simulation=setInterval(()=>{
    if(gameOver||openSteps>=maxOpen)return clearInterval(simulation);
    const candidates=cells.filter((c,i)=>!c.classList.contains('abierta')&&!c.classList.contains('bandera')&&!mines.includes(i)&&i!==10);
    if(candidates.length===0)return clearInterval(simulation);
    const idx=Math.floor(Math.random()*candidates.length);
    const cell=candidates[idx];
    const i=parseInt(cell.dataset.i);
    openCell(i);
    openSteps++;
    // toggle flag on random unopened non-mine cell (excluding 10)
    const flagCandidates=cells.filter((c,i)=>!c.classList.contains('abierta')&&!c.classList.contains('bandera')&&!mines.includes(i)&&i!==10);
    if(flagCandidates.length>0 && Math.random()<0.3){
      const fIdx=Math.floor(Math.random()*flagCandidates.length);
      const fCell=flagCandidates[fIdx];
      const fI=parseInt(fCell.dataset.i);
      toggleFlag(fI);
    }
  },800);
})();
</script>
</body>
</html>
