
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito de compra con STOCK</title>
<style>
  body{
    font-family: Arial, sans-serif;
    margin: 20px;
    background:#f9f9f9;
  }
  h1, h2{color:#333;}
  .prod{
    margin-bottom: 10px;
    padding: 10px;
    border:1px solid #ccc;
    border-radius:4px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity:0;
    animation:fadeIn 0.5s forwards;
  }
  .prod:nth-child(1){animation-delay:0.2s;}
  .prod:nth-child(2){animation-delay:0.4s;}
  .prod:nth-child(3){animation-delay:0.6s;}
  .add, .quitar{
    padding:5px 10px;
    border:none;
    border-radius:3px;
    cursor:pointer;
    background:#28a745;
    color:#fff;
    font-size:0.9em;
  }
  .quitar{background:#dc3545;}
  .add:disabled{background:#6c757d;cursor:not-allowed;}
  #cart{margin-top:20px;}
  .linea{
    padding:8px;
    margin-bottom:5px;
    background:#fff;
    border:1px solid #ccc;
    border-radius:4px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity:0;
    animation:fadeIn 0.3s forwards;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateX(-20px);}
    to{opacity:1;transform:translateX(0);}
  }
</style>
</head>
<body>
<h1>Carrito de compra con STOCK</h1>

<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - Precio: 100 - Stock: 2</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - Precio: 50 - Stock: 3</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - Precio: 25 - Stock: 1</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>

<h2>Carrito</h2>
<div id="cart"></div>
<div>Total: <span id="total">0</span></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const cart = {}; // {id: quantity}
  const totalEl = document.getElementById('total');
  const cartEl = document.getElementById('cart');

  // Helper to recalc total
  function updateTotal() {
    let sum = 0;
    for (const id in cart) {
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = parseFloat(prod.dataset.precio);
      sum += cart[id] * price;
    }
    totalEl.textContent = sum;
  }

  // Helper to create or update line
  function renderLine(id) {
    const quantity = cart[id];
    let line = cartEl.querySelector(`.linea[data-id="${id}"]`);
    if (!line) {
      line = document.createElement('div');
      line.className = 'linea';
      line.dataset.id = id;
      line.innerHTML = `
        <span class="name">${document.querySelector(`.prod[data-id="${id}"] span`).textContent}</span>
        <span class="cant">${quantity}</span>
        <button class="quitar" data-id="${id}">Quitar</button>
      `;
      cartEl.appendChild(line);
      // Attach quitar listener
      line.querySelector('.quitar').addEventListener('click', () => removeItem(id));
    } else {
      line.querySelector('.cant').textContent = quantity;
    }
  }

  // Add item
  function addItem(id) {
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = parseInt(prod.dataset.stock);
    const current = cart[id] || 0;
    if (current < stock) {
      cart[id] = current + 1;
      renderLine(id);
      if (cart[id] === stock) {
        prod.querySelector('.add').disabled = true;
      }
      updateTotal();
    }
  }

  // Remove item
  function removeItem(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    if (cart[id] <= 0) {
      delete cart[id];
      const line = cartEl.querySelector(`.linea[data-id="${id}"]`);
      if (line) line.remove();
      document.querySelector(`.prod[data-id="${id}"] .add`).disabled = false;
    } else {
      renderLine(id);
    }
    updateTotal();
  }

  // Attach add listeners
  document.querySelectorAll('.add').forEach(btn => {
    btn.addEventListener('click', () => addItem(btn.dataset.id));
  });
});
</script>
</body>
</html>
