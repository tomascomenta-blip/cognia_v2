<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito Automático</title>
<style>
body{font:12px sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;background:#f9f9f9;}
header{margin:10px;text-align:center;}
#total{font-weight:bold;}
section{margin:5px;width:90%;max-width:600px;}
.prod{display:flex;justify-content:space-between;align-items:center;margin:3px 0;}
.prod button{margin-left:5px;}
.linea{display:flex;justify-content:space-between;align-items:center;margin:2px 0;}
.linea button{margin-left:5px;}
svg{width:100%;height:200px;background:#fff;border:1px solid #ccc;}
</style>
</head>
<body>
<header><h1>Carrito Automático</h1><div>Total: <span id="total">0</span></div></header>
<section id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2"><span>Producto 1 - 100€</span><button class="add" data-id="p1">Añadir</button></div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3"><span>Producto 2 - 50€</span><button class="add" data-id="p2">Añadir</button></div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1"><span>Producto 3 - 25€</span><button class="add" data-id="p3">Añadir</button></div>
</section>
<section id="chart"><svg id="grafico"></svg></section>
<section id="cart"><h2>Carrito</h2><div id="lines"></div></section>
<script>
const cart={};
const prodEls=document.querySelectorAll('.prod');
let prevTotal=0;
let prevQty={};

function upd(){
  const t=document.getElementById('total');
  let tot=0;
  const l=document.getElementById('lines');
  l.innerHTML='';
  prodEls.forEach(p=>{
    const id=p.dataset.id;
    const q=cart[id]||0;
    const price=parseFloat(p.dataset.precio);
    tot+=q*price;
    if(q>0){
      const d=document.createElement('div');
      d.className='linea';
      d.dataset.id=id;
      d.innerHTML=`<span>${p.querySelector('span').textContent} x <span class="cant">${q}</span></span><button class="quitar" data-id="${id}">Quitar</button>`;
      const changeQty = q - (prevQty[id]||0);
      d.querySelector('.cant').style.color = changeQty>=0?'green':'red';
      prevQty[id] = q;
      l.appendChild(d);
    }
  });
  t.textContent=tot.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  const change = tot - prevTotal;
  t.style.color = change>=0?'green':'red';
  prevTotal = tot;
  draw();
}

function draw(){
  const svg=document.getElementById('grafico');
  const maxVal=Math.max(...Array.from(prodEls).map(p=>cart[p.dataset.id]||0));
  const max=maxVal||1;
  const h=200,w=svg.clientWidth,m=30;
  svg.innerHTML='';
  for(let i=0;i<=2;i++){
    const val=max*i/2;
    const y=m+(h-2*m)*(1-val/max);
    svg.innerHTML+=`<line x1="${m}" y1="${y}" x2="${w-m}" y2="${y}" stroke="#e1e0d9" stroke-width="1"/><text x="${m-5}" y="${y+3}" font-size="10">${val.toLocaleString('es-ES')}</text>`;
  }
  for(let i=0;i<3;i++){
    const p=prodEls[i];
    const q=cart[p.dataset.id]||0;
    const barHeight=(h-2*m)*q/max;
    const y=m+(h-2*m)*(1-q/max);
    svg.innerHTML+=`<rect x="${m+i*(w-2*m)/3}" y="${y}" width="${(w-2*m)/3-5}" height="${barHeight}" fill="#4caf50"></rect><text x="${m+i*(w-2*m)/3+5}" y="${h-5}" font-size="10">${q}</text>`;
  }
}

function act(){
  const ids = Array.from(prodEls).map(p=>p.dataset.id);
  const id = ids[Math.floor(Math.random()*ids.length)];
  const q = cart[id]||0;
  const p = document.querySelector(`.prod[data-id="${id}"]`);
  const stock = parseInt(p.dataset.stock,10);
  const add = Math.random()<0.5;
  if(add){
    if(q<stock){
      cart[id]=q+1;
      upd();
    }
  }else{
    if(q>0){
      cart[id]=q-1;
      upd();
    }
  }
}

prodEls.forEach(p=>p.querySelector('.add').addEventListener('click',e=>{
  const id=e.target.dataset.id;
  const q=cart[id]||0;
  const p=document.querySelector(`.prod[data-id="${id}"]`);
  const stock=parseInt(p.dataset.stock,10);
  if(q<stock){
    cart[id]=q+1;
    upd();
  }
}));

document.getElementById('lines').addEventListener('click',e=>{
  if(e.target.classList.contains('quitar')){
    const id=e.target.dataset.id;
    const q=cart[id]||0;
    if(q>0){
      cart[id]=q-1;
      upd();
    }
  }
});

upd();
setInterval(act,700);
</script>
</body>
</html>
