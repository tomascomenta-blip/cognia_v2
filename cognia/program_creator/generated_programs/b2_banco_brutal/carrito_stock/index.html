<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Carrito con STOCK</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:0;display:flex;flex-direction:column;align-items:center}
#products{display:flex;gap:10px;margin:10px}
.prod{border:1px solid #ccc;padding:5px;border-radius:4px}
#cart{margin:10px;width:90%}
#linea{display:flex;align-items:center;gap:5px;margin:2px 0}
#total{font-weight:bold}
#chart{margin:10px;width:90%}
svg{border:1px solid #ddd}
</style>
</head>
<body>
<div id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <span>Producto 1 - 100 €</span>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <span>Producto 2 - 50 €</span>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <span>Producto 3 - 25 €</span>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</div>
<div id="cart">
  <h2>Carrito</h2>
  <div id="lines"></div>
  <div>Total: <span id="total">0 €</span></div>
</div>
<div id="chart">
  <svg id="grafico" width="100%" height="200"></svg>
</div>
<script>
const cart={p1:0,p2:0,p3:0};
const prodEls=document.querySelectorAll('.prod');
function updateCart(){
  const lines=document.getElementById('lines');lines.innerHTML='';
  let total=0;
  prodEls.forEach(p=>{
    const id=p.dataset.id, qty=cart[id], price=parseFloat(p.dataset.precio), stock=parseInt(p.dataset.stock);
    if(qty>0){
      const line=document.createElement('div');line.className='linea';line.dataset.id=id;
      line.innerHTML=`<span>${p.querySelector('span').textContent}</span><span class="cant">${qty}</span><button class="quitar" data-id="${id}">Quitar</button>`;
      lines.appendChild(line);
      total+=qty*price;
    }
    const btn=p.querySelector('.add');
    btn.disabled=qty>=stock;
  });
  document.getElementById('total').textContent=total.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
  drawChart();
}
function drawChart(){
  const svg=document.getElementById('grafico');
  const maxQty=Math.max(...Object.values(cart),1);
  const W=600,H=200,M={l:50,t:10,r:10,b:20};
  const x=(i)=>M.l+(W-M.l-M.r)*(i/2);
  const y=(v)=>M.t+(H-M.t-M.b)*(1-v/maxQty);
  let bars='',grid='',labels='';
  Object.values(cart).forEach((v,i)=>{bars+=`<rect x="${x(i)-15}" y="${y(v)}" width="30" height="${H-M.t-M.b-y(v)}" fill="#4caf50"></rect>`});
  for(let k=0;k<=3;k++){
    const v=maxQty*k/3;
    const yy=y(v);
    grid+=`<line x1="${M.l}" y1="${yy}" x2="${W-M.r}" y2="${yy}" stroke="#e1e0d9" stroke-width="1"/>`;
    labels+=`<text x="${M.l-10}" y="${yy}" dy="4" text-anchor="end" font-size="10">${v.toFixed(0)}</text>`;
  }
  svg.innerHTML=`${grid}${labels}${bars}`;
}
function randomAction(){
  const ids=['p1','p2','p3'];
  const id=ids[Math.floor(Math.random()*ids.length)];
  const prod=document.querySelector(`.prod[data-id="${id}"]`);
  const stock=parseInt(prod.dataset.stock);
  if(Math.random()<0.5 && cart[id]<stock){cart[id]++}
  else if(cart[id]>0){cart[id]--}
  updateCart();
}
document.querySelectorAll('.add').forEach(b=>b.addEventListener('click',e=>{cart[e.target.dataset.id]++;updateCart()}));
document.querySelectorAll('.quitar').forEach(b=>b.addEventListener('click',e=>{cart[e.target.dataset.id]--;updateCart()}));
updateCart();
setInterval(randomAction,1000);
</script>
</body>
</html>
