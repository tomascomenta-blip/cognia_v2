<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carrito de Compra con Stock</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f9f9f9;color:#333;}
  header{background:#2a78d6;color:white;padding:1rem;text-align:center;}
  section{padding:1rem;max-width:1200px;margin:auto;}
  #summary{display:flex;justify-content:space-around;flex-wrap:wrap;background:#e3f2fd;border-radius:8px;margin-bottom:1rem;}
  #summary div{margin:0.5rem;padding:0.5rem 1rem;background:#fff;border:1px solid #cfd8dc;border-radius:4px;}
  #chart{margin-bottom:1rem;}
  #products, #cart{display:flex;flex-wrap:wrap;gap:1rem;}
  .prod, .linea{background:#fff;border:1px solid #cfd8dc;border-radius:4px;padding:0.5rem 1rem;flex:1 1 200px;box-sizing:border-box;}
  .prod button, .linea button{margin-left:0.5rem;padding:0.2rem 0.5rem;background:#2a78d6;color:white;border:none;border-radius:3px;cursor:pointer;}
  .prod button:disabled, .linea button:disabled{background:#9e9e9e;cursor:not-allowed;}
  .cant{font-weight:bold;margin-left:0.5rem;}
  #total{font-size:1.5rem;font-weight:bold;color:#2a78d6;}
  @media(max-width:600px){
    #summary{flex-direction:column;align-items:center;}
    .prod, .linea{flex:1 1 100%;}
  }
</style>
</head>
<body>
<header><h1>Carrito de Compra con Stock</h1></header>

<section id="summary">
  <div>Artículos en carrito: <span id="items">0</span></div>
  <div>Total: <span id="total">0 €</span></div>
</section>

<section id="chart">
  <svg id="chartSvg" width="100%" height="220" viewBox="0 0 600 220"></svg>
</section>

<section id="products">
  <div class="prod" data-id="p1" data-precio="100" data-stock="2">
    <strong>Producto 1</strong><br>
    Precio: <span class="precio"></span> €<br>
    Stock: <span class="stock"></span><br>
    <button class="add" data-id="p1">Añadir</button>
  </div>
  <div class="prod" data-id="p2" data-precio="50" data-stock="3">
    <strong>Producto 2</strong><br>
    Precio: <span class="precio"></span> €<br>
    Stock: <span class="stock"></span><br>
    <button class="add" data-id="p2">Añadir</button>
  </div>
  <div class="prod" data-id="p3" data-precio="25" data-stock="1">
    <strong>Producto 3</strong><br>
    Precio: <span class="precio"></span> €<br>
    Stock: <span class="stock"></span><br>
    <button class="add" data-id="p3">Añadir</button>
  </div>
</section>

<section id="cart">
  <h2>Carrito</h2>
  <!-- líneas del carrito se generan dinámicamente -->
</section>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const products = document.querySelectorAll('.prod');
  const cartContainer = document.getElementById('cart');
  const itemsSpan = document.getElementById('items');
  const totalSpan = document.getElementById('total');
  const chartSvg = document.getElementById('chartSvg');
  const cart = {}; // {id: qty}

  // Inicializar precios y stocks
  products.forEach(p=>{
    p.querySelector('.precio').textContent = Number(p.dataset.precio).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
    p.querySelector('.stock').textContent = p.dataset.stock;
  });

  function updateCartUI(){
    // Limpiar
    const existing = cartContainer.querySelectorAll('.linea');
    existing.forEach(el=>el.remove());
    // Añadir líneas
    Object.entries(cart).forEach(([id,qty])=>{
      const prod = document.querySelector(`.prod[data-id="${id}"]`);
      const price = Number(prod.dataset.precio);
      const line = document.createElement('div');
      line.className='linea';
      line.dataset.id=id;
      line.innerHTML = `<strong>${prod.querySelector('strong').textContent}</strong> - 
        Precio: ${price.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})} € 
        <span class="cant">${qty}</span> 
        <button class="quitar" data-id="${id}">Quitar</button>`;
      cartContainer.appendChild(line);
    });
    // Actualizar resumen
    const totalItems = Object.values(cart).reduce((a,b)=>a+b,0);
    const totalPrice = Object.entries(cart).reduce((sum,[id,qty])=>{
      const price = Number(document.querySelector(`.prod[data-id="${id}"]`).dataset.precio);
      return sum + price*qty;
    },0);
    itemsSpan.textContent = totalItems;
    totalSpan.textContent = totalPrice.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
    // Actualizar botones add
    products.forEach(p=>{
      const id = p.dataset.id;
      const stock = Number(p.dataset.stock);
      const qty = cart[id]||0;
      const btn = p.querySelector('.add');
      btn.disabled = qty>=stock;
    });
  }

  function updateChart(){
    const data = Array.from(products).map(p=>({
      id:p.dataset.id,
      qty:cart[p.dataset.id]||0,
      stock:Number(p.dataset.stock)
    }));
    const maxStock = Math.max(...data.map(d=>d.stock));
    const width = 600, height = 200;
    const margin = {left:40,right:20,top:20,bottom:30};
    const barWidth = (width - margin.left - margin.right)/data.length;
    let svgContent = '';
    // Gridlines y axis
    for(let i=0;i<=maxStock;i++){
      const y = margin.top + (height - margin.top - margin.bottom)*(i/maxStock);
      svgContent += `<line x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}" stroke="#e1e0d9" stroke-width="1"/>`;
      svgContent += `<text x="${margin.left-10}" y="${y+4}" text-anchor="end" font-size="10" fill="#898781">${i}</text>`;
    }
    // Bars
    data.forEach((d,i)=>{
      const x = margin.left + i*barWidth + barWidth*0.1;
      const barH = (height - margin.top - margin.bottom)*(d.qty/maxStock);
      const y = height - margin.bottom - barH;
      svgContent += `<rect x="${x}" y="${y}" width="${barWidth*0.8}" height="${barH}" fill="#2a78d6" rx="3" ry="3" style="transition:height 0.5s"/>`;
      svgContent += `<text x="${x+barWidth*0.4}" y="${height - margin.bottom + 12}" text-anchor="middle" font-size="10" fill="#333">${d.id}</text>`;
    });
    chartSvg.innerHTML = svgContent;
  }

  function addProduct(id){
    const prod = document.querySelector(`.prod[data-id="${id}"]`);
    const stock = Number(prod.dataset.stock);
    const qty = cart[id]||0;
    if(qty<stock){
      cart[id] = qty+1;
      updateCartUI();
      updateChart();
    }
  }

  function removeProduct(id){
    const qty = cart[id]||0;
    if(qty>0){
      cart[id] = qty-1;
      if(cart[id]===0) delete cart[id];
      updateCartUI();
      updateChart();
    }
  }

  // Event listeners manual
  document.querySelectorAll('.add').forEach(btn=>{
    btn.addEventListener('click',()=>addProduct(btn.dataset.id));
  });
  document.addEventListener('click',e=>{
    if(e.target.classList.contains('quitar')){
      removeProduct(e.target.dataset.id);
    }
  });

  // Animación automática
  setInterval(()=>{
    const ids = Array.from(products).map(p=>p.dataset.id);
    const id = ids[Math.floor(Math.random()*ids.length)];
    const action = Math.random()<0.5 ? 'add' : 'remove';
    if(action==='add'){
      addProduct(id);
    }else{
      removeProduct(id);
    }
  },2000);

  // Render inicial
  updateCartUI();
  updateChart();
});
</script>
</body>
</html>
