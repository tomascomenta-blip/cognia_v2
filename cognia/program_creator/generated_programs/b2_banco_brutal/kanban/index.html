
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Kanban en un solo archivo</title>
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f0f0;
    margin:0;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
  }
  .board{
    display:flex;
    gap:20px;
    width:100%;
    max-width:1200px;
  }
  .col{
    background:#fff;
    border-radius:5px;
    flex:1;
    padding:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    opacity:0;
    transform:translateX(-20px);
    animation:slideIn .5s ease forwards;
  }
  .col:nth-child(1){animation-delay:.1s;}
  .col:nth-child(2){animation-delay:.2s;}
  .col:nth-child(3){animation-delay:.3s;}
  @keyframes slideIn{
    to{opacity:1;transform:translateX(0);}
  }
  .col h2{
    margin:0 0 10px;
    font-size:1.2em;
    display:flex;
    align-items:center;
  }
  .col h2 span{
    background:#333;
    color:#fff;
    border-radius:12px;
    padding:2px 8px;
    margin-left:8px;
    font-size:.8em;
  }
  .cards{
    min-height:50px;
  }
  .card{
    background:#e3e3e3;
    margin:5px 0;
    padding:10px;
    border-radius:3px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    opacity:0;
    transform:translateY(-10px);
    animation:cardIn .5s ease forwards;
  }
  .card:nth-child(1){animation-delay:.1s;}
  .card:nth-child(2){animation-delay:.2s;}
  .card:nth-child(3){animation-delay:.3s;}
  @keyframes cardIn{
    to{opacity:1;transform:translateY(0);}
  }
  button{
    margin-left:5px;
    padding:2px 6px;
    font-size:.9em;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="board">
  <div class="col" data-col="todo">
    <h2>Todo <span id="cont-todo"></span></h2>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing <span id="cont-doing"></span></h2>
    <div class="cards"></div>
  </div>
  <div class="col" data-col="done">
    <h2>Done <span id="cont-done"></span></h2>
    <div class="cards"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const ids = ['t1','t2','t3'];
  const todoCards = document.querySelector('.col[data-col="todo"] .cards');

  ids.forEach(id => {
    const card = createCard(id);
    todoCards.appendChild(card);
  });

  updateCounts();

  function createCard(id){
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = id;
    card.innerHTML = `
      <span>${id}</span>
      <div>
        <button class="menos">-</button>
        <button class="mas">+</button>
      </div>
    `;
    card.querySelector('.mas').addEventListener('click', moveRight);
    card.querySelector('.menos').addEventListener('click', moveLeft);
    return card;
  }

  function moveRight(e){
    const card = e.target.closest('.card');
    const currentCol = card.parentElement.parentElement;
    const current = currentCol.dataset.col;
    if(current === 'done') return; // no avanzar más

    let target = current === 'todo' ? 'doing' : 'done';
    const targetCol = document.querySelector(`.col[data-col="${target}"] .cards`);

    // regla WIP: doing máximo 2 tarjetas
    if(target === 'doing' && targetCol.children.length >= 2) return;

    currentCol.querySelector('.cards').removeChild(card);
    targetCol.appendChild(card);
    updateCounts();
  }

  function moveLeft(e){
    const card = e.target.closest('.card');
    const currentCol = card.parentElement.parentElement;
    const current = currentCol.dataset.col;
    if(current === 'todo') return; // no retroceder más

    let target = current === 'doing' ? 'todo' : 'doing';
    const targetCol = document.querySelector(`.col[data-col="${target}"] .cards`);

    currentCol.querySelector('.cards').removeChild(card);
    targetCol.appendChild(card);
    updateCounts();
  }

  function updateCounts(){
    ['todo','doing','done'].forEach(col => {
      const count = document.querySelector(`.col[data-col="${col}"] .cards`).children.length;
      document.getElementById(`cont-${col}`).textContent = count;
    });
  }
});
</script>
</body>
</html>
