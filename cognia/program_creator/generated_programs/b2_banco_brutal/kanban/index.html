<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kanban en HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,sans-serif;margin:0;padding:10px;background:#eaeaea;}
  #board{display:flex;flex-wrap:wrap;gap:10px;}
  .col{flex:1 1 30%;min-width:250px;background:#f9f9f9;padding:10px;border-radius:5px;}
  .col h2{margin-top:0;font-size:1.2em;}
  .cards{min-height:30px;}
  .card{background:#fff;border:1px solid #ccc;border-radius:3px;padding:8px;margin-bottom:8px;display:flex;align-items:center;}
  .card p{margin:0;flex:1;}
  button{margin-left:4px;padding:2px 6px;font-size:0.9em;}
  .counter{font-size:0.9em;color:#555;}
  @media(max-width:600px){.col{flex:1 1 100%;}}
</style>
</head>
<body>
<div id="board">
  <div class="col" data-col="todo">
    <h2>Todo</h2>
    <div class="cards">
      <div class="card" data-id="t1"><p>t1</p><button class="menos">←</button><button class="mas">→</button></div>
      <div class="card" data-id="t2"><p>t2</p><button class="menos">←</button><button class="mas">→</button></div>
      <div class="card" data-id="t3"><p>t3</p><button class="menos">←</button><button class="mas">→</button></div>
    </div>
    <div class="counter"><span id="cont-todo"></span> tarjetas</div>
  </div>
  <div class="col" data-col="doing">
    <h2>Doing</h2>
    <div class="cards"></div>
    <div class="counter"><span id="cont-doing"></span> tarjetas</div>
  </div>
  <div class="col" data-col="done">
    <h2>Done</h2>
    <div class="cards"></div>
    <div class="counter"><span id="cont-done"></span> tarjetas</div>
  </div>
</div>
<script>
const colOrder = ['todo','doing','done'];
function updateBoard(){
  const cols = document.querySelectorAll('.col');
  const counts = {todo:0,doing:0,done:0};
  cols.forEach(col=>{
    const c = col.querySelectorAll('.card').length;
    counts[col.dataset.col] = c;
  });
  document.getElementById('cont-todo').textContent = counts.todo;
  document.getElementById('cont-doing').textContent = counts.doing;
  document.getElementById('cont-done').textContent = counts.done;
  document.querySelectorAll('.card').forEach(card=>{
    const col = card.parentElement.parentElement.dataset.col;
    const menos = card.querySelector('.menos');
    const mas = card.querySelector('.mas');
    menos.disabled = col==='todo';
    mas.disabled = col==='done' || (col==='todo' && counts.doing>=2);
  });
}
function moveCard(btn,dir){
  const card = btn.closest('.card');
  const currCol = card.parentElement.parentElement.dataset.col;
  const idx = colOrder.indexOf(currCol);
  const newIdx = idx+dir;
  if(newIdx<0||newIdx>=colOrder.length)return;
  const targetCol = document.querySelector('.col[data-col="'+colOrder[newIdx]+'"]');
  targetCol.querySelector('.cards').appendChild(card);
  updateBoard();
}
document.querySelectorAll('.mas').forEach(b=>b.addEventListener('click',()=>moveCard(b,1)));
document.querySelectorAll('.menos').forEach(b=>b.addEventListener('click',()=>moveCard(b,-1)));
updateBoard();
</script>
</body>
</html>
