<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini hoja de cálculo</title>
<style>
body{font-family:sans-serif;margin:0;padding:10px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.celda{width:100%;box-sizing:border-box;padding:5px;}
.chart{margin-top:10px;}
.summary{font-weight:bold;}
</style>
</head>
<body>
<div class="summary" id="sum">Suma: 0</div>
<div class="grid" id="grid">
<input class="celda" data-ref="A1" data-formula="" value="">
<input class="celda" data-ref="B1" data-formula="" value="">
<input class="celda" data-ref="C1" data-formula="" value="">
<input class="celda" data-ref="A2" data-formula="=A1+B1" value="">
<input class="celda" data-ref="B2" data-formula="=A2-5" value="">
<input class="celda" data-ref="C2" data-formula="=B2+10" value="">
<input class="celda" data-ref="A3" data-formula="=C2-A1" value="">
<input class="celda" data-ref="B3" data-formula="=A3+B1" value="">
<input class="celda" data-ref="C3" data-formula="=B3-C2" value="">
</div>
<svg class="chart" id="chart" width="100%" height="200"></svg>
<table id="detail" style="margin-top:10px;border-collapse:collapse;">
<tr><th>Ref</th><th>Valor</th></tr>
</table>
<script>
const cells=document.querySelectorAll('.celda');
const values={};

function evalCell(r,stack){
  if(stack.includes(r)) return 'CIRC';
  const inp=document.querySelector(`[data-ref="${r}"]`);
  const v=inp.dataset.formula;
  if(v==='') return '';
  if(v[0]!='=') return parseFloat(v)||0;
  const expr=v.slice(1).replace(/[A-Z][0-9]/g,ref=>{
    const val=evalCell(ref,stack.concat(r));
    return val==='CIRC'?'CIRC':val;
  });
  if(expr==='CIRC') return 'CIRC';
  try{ return eval(expr); }catch{return 'CIRC';}
}

function recalc(){
  const oldValues={...values};
  cells.forEach(inp=>{
    const r=inp.dataset.ref;
    const oldVal=values[r];
    const val=evalCell(r,[]);
    inp.value=val;
    // color based on value
    if(typeof val==='number'){
      inp.style.color=val>=0?'green':'red';
    }else if(val===''){
      inp.style.color='black';
    }else{
      inp.style.color='red';
    }
    values[r]=val;
  });
  const sum=Object.values(values).reduce((a,b)=>a+(typeof b==='number'?b:0),0);
  document.getElementById('sum').textContent='Suma: '+sum;
  const a=values['A1'],b=values['B1'],c=values['C1'];
  const max=Math.max(a,b,c,1);
  const svg=document.getElementById('chart');
  const rect=svg.getBoundingClientRect();
  const w=rect.width,h=rect.height;
  const barW=w/6;
  svg.innerHTML='';
  [0,max/2,max].forEach(y=>{
    const yPos=h-y/max*h;
    svg.innerHTML+=`<line x1="0" y1="${yPos}" x2="${w}" y2="${yPos}" stroke="#eee" stroke-width="1"/>`;
  });
  [a,b,c].forEach((v,i)=>{
    const hgt=v/max*h;
    svg.innerHTML+=`<rect x="${i*barW+barW/4}" y="${h-hgt}" width="${barW/2}" height="${hgt}" fill="steelblue"/>`;
  });
  svg.innerHTML+=`<text x="0" y="${h-2}" font-size="10">0</text><text x="${w-20}" y="10" font-size="10">${max.toFixed(0)}</text>`;
  const detail=document.getElementById('detail');
  detail.innerHTML='<tr><th>Ref</th><th>Valor</th></tr>';
  Object.entries(values).forEach(([k,v])=>{
    const old=oldValues[k];
    const change= (typeof v==='number' && typeof old==='number') ? v-old : 0;
    const color= typeof v==='number' ? (change>=0?'green':'red') : (v==='CIRC'?'red':'black');
    detail.innerHTML+=`<tr><td>${k}</td><td style="color:${color}">${v}</td></tr>`;
  });
}

// recalc on user input
cells.forEach(inp=>{
  inp.addEventListener('input',()=>{
    inp.dataset.formula=inp.value;
    recalc();
  });
  inp.addEventListener('change',recalc);
  inp.addEventListener('click',recalc);
});

setTimeout(recalc,0);
setInterval(()=>{
  cells[0].dataset.formula=Math.floor(Math.random()*100)+1;
  cells[0].value=cells[0].dataset.formula;
  cells[1].dataset.formula=Math.floor(Math.random()*100)+1;
  cells[1].value=cells[1].dataset.formula;
  cells[2].dataset.formula=Math.floor(Math.random()*100)+1;
  cells[2].value=cells[2].dataset.formula;
  recalc();
},2000);
</script>
</body>
</html>
