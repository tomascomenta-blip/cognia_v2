<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mini Hoja de Cálculo 3x3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#333;
    margin:0;
    padding:20px;
  }
  h1{ text-align:center; }
  p{ text-align:center; margin-bottom:20px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
    max-width:400px;
    margin:auto;
  }
  .celda{
    width:100%;
    box-sizing:border-box;
    padding:5px;
    text-align:right;
    border:1px solid #ccc;
    border-radius:3px;
    font-size:1rem;
  }
</style>
</head>
<body>
<h1>Mini Hoja de Cálculo 3x3</h1>
<p>Escribe valores o fórmulas (ejemplo: <code>=A1+B1</code>)</p>
<div class="grid">
  <input type="text" class="celda" data-ref="A1" value="10">
  <input type="text" class="celda" data-ref="A2">
  <input type="text" class="celda" data-ref="A3">
  <input type="text" class="celda" data-ref="B1" value="5">
  <input type="text" class="celda" data-ref="B2">
  <input type="text" class="celda" data-ref="B3">
  <input type="text" class="celda" data-ref="C1">
  <input type="text" class="celda" data-ref="C2">
  <input type="text" class="celda" data-ref="C3" value="=A1+B1">
</div>
<script>
class Cell{
  constructor(el, sheet){
    this.element=el;
    this.ref=el.dataset.ref;
    this.sheet=sheet;
    this.formula=null;
    this.dependencies=new Set();
    this.dependents=new Set();
    this.prevValue=null;
    this.element.addEventListener('input',()=>this.onInput());
  }
  onInput(){
    const val=this.element.value.trim();
    this.formula=val.startsWith('=')?val:null;
    this.sheet.updateDependencies(this);
    this.sheet.updateCell(this);
  }
}
class Spreadsheet{
  constructor(){
    this.cells=new Map();
    document.querySelectorAll('input.celda').forEach(el=>{
      const cell=new Cell(el,this);
      this.cells.set(cell.ref,cell);
    });
    this.updateAllDependencies();
    this.evaluateAll();
  }
  updateAllDependencies(){
    this.cells.forEach(cell=>this.updateDependencies(cell));
  }
  updateDependencies(cell){
    // remove old deps
    cell.dependencies.forEach(depRef=>{
      const dep=this.cells.get(depRef);
      if(dep)dep.dependents.delete(cell.ref);
    });
    const newDeps=new Set();
    if(cell.formula){
      const refs=cell.formula.match(/[A-C][1-3]/g);
      if(refs)refs.forEach(r=>newDeps.add(r));
    }
    // add new deps
    newDeps.forEach(depRef=>{
      const dep=this.cells.get(depRef);
      if(dep)dep.dependents.add(cell.ref);
    });
    cell.dependencies=newDeps;
  }
  evaluateAll(){
    this.cells.forEach(cell=>this.updateCell(cell));
  }
  updateCell(cell){
    const val=this.evaluate(cell,new Set());
    if(val==='CIRC'){
      cell.element.value='CIRC';
      cell.element.style.color='red';
      cell.prevValue=null;
    }else if(typeof val==='number'){
      const diff = cell.prevValue!==null ? val - cell.prevValue : 0;
      cell.element.style.color = diff>=0 ? 'green' : 'red';
      cell.element.value=val.toString();
      cell.prevValue=val;
    }else{
      cell.element.value=val;
      cell.element.style.color='black';
      cell.prevValue=null;
    }
    // propagate
    cell.dependents.forEach(depRef=>{
      const dep=this.cells.get(depRef);
      if(dep)this.updateCell(dep);
    });
  }
  evaluate(cell,stack){
    if(stack.has(cell.ref))return 'CIRC';
    stack.add(cell.ref);
    if(!cell.formula){
      stack.delete(cell.ref);
      const raw=cell.element.value.trim();
      const num=Number(raw);
      if(!isNaN(num))return num;
      return raw;
    }
    const expr=cell.formula.slice(1);
    const tokens=expr.split(/([+-])/);
    let result=this.evaluateOperand(tokens[0],stack);
    if(result==='CIRC'){stack.delete(cell.ref);return 'CIRC';}
    for(let i=1;i<tokens.length;i+=2){
      const op=tokens[i];
      const opVal=this.evaluateOperand(tokens[i+1],stack);
      if(opVal==='CIRC'){stack.delete(cell.ref);return 'CIRC';}
      if(op==='+')result+=opVal;
      else if(op==='-')result-=opVal;
    }
    stack.delete(cell.ref);
    return result;
  }
  evaluateOperand(tok,stack){
    const refMatch=tok.match(/[A-C][1-3]/);
    if(refMatch){
      const ref=refMatch[0];
      const dep=this.cells.get(ref);
      if(!dep)return 0;
      const val=this.evaluate(dep,stack);
      if(val==='CIRC')return 'CIRC';
      return val;
    }else{
      const num=Number(tok);
      return isNaN(num)?0:num;
    }
  }
}
document.addEventListener('DOMContentLoaded',()=>new Spreadsheet());
</script>
</body>
</html>
