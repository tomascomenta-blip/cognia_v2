<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Undertale Pixelart</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #121212;
            color: white;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .chart {
            width: 100%;
            height: 200px;
            margin: 10px 0;
            background: #222222;
        }
        .chart svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Juego Undertale Pixelart</div>
        <div class="chart">
            <svg id="grafico" width="100%" height="200" viewBox="0 0 600 200"></svg>
        </div>
        <div class="game-area">
            <div class="pixel-area" id="pixel-area"></div>
        </div>
    </div>
    <script>
        function pintar(datos) {
            var svg = document.getElementById('grafico');
            var M = {arriba: 12, abajo: 28, izq: 56, der: 12}, W = 600, H = 200;
            var y0 = Math.min.apply(null, datos), y1 = Math.max.apply(null, datos);
            if (y1 - y0 < 1) { y0 -= 1; y1 += 1; }
            var x = function(i){ return M.izq + (W-M.izq-M.der) * i / Math.max(1, datos.length-1); };
            var y = function(v){ return M.arriba + (H-M.arriba-M.abajo) * (1 - (v-y0)/(y1-y0)); };
            var linea = datos.map(function(v,i){ return (i?'L':'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join('');
            var rejilla = '', etiquetas = '';
            for (var k = 0; k <= 3; k++) {
                var v = y0 + (y1-y0) * k/3, yy = y(v).toFixed(1);
                rejilla += '<line x1="'+M.izq+'" x2="'+(W-M.der)+'" y1="'+yy+'" y2="'+yy+'" stroke="#e1e0d9" stroke-width="1"/>';
                etiquetas += '<text x="'+(M.izq-8)+'" y="'+yy+'" dy="4" text-anchor="end" font-size="11" fill="#898781">'+Math.round(v).toLocaleString('es-ES')+'</text>';
            }
            svg.innerHTML = rejilla + etiquetas +
                '<path d="'+linea+'" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>';
        }

        function actualizarJuego() {
            var datos = [10, 20, 30, 40, 50];
            pintar(datos);
            datos.push(datos[0] + 5);
            datos.shift();
            setTimeout(actualizarJuego, 1000);
        }

        function pintarAreaPixels() {
            var area = document.getElementById('pixel-area');
            area.innerHTML = '<div class="pixel green"></div><div class="pixel red"></div><div class="pixel green"></div><div class="pixel red"></div><div class="pixel green"></div><div class="pixel red"></div><div class="pixel green"></div><div class="pixel red"></div>';
        }

        pintarAreaPixels();
        actualizarJuego();
    </script>
</body>
</html>
